/* ======================================================================
 * Mutations: optimistic locally, then queued to the server.

 * ==================================================================== */
const PAYLOAD = ['id', 'title', 'desc', 'due', 'time', 'status', 'priority', 'list', 'starred', 'parent', 'order', 'repeat', 'milestone', 'plan', 'size'];

const nowStamp = () => new Date().toISOString();

function siblingOrders(list, parent, milestone) {

}
function createTask(f) {

  const milestone = p ? (f.milestone !== undefined ? f.milestone : ((currentMs(p) || {}).id || '')) : '';
  const orders = siblingOrders(list, parent);
  const order = !orders.length ? 0 : f.append ? Math.max(...orders) + 1 : Math.min(...orders) - 1;
  const due = f.due || (f.time ? todayISO() : '');
  const t = {
    id: newId(), title: f.title, desc: f.desc || '', due, time: due ? (f.time || '') : '', status: 'Not started', priority: f.priority || 'Medium',
    list, starred: !!f.starred, parent, order, repeat: f.repeat || '', created: nowStamp(), completed: '', archived: false, archType: '', synced: false,
    milestone, plan: f.plan || '', size: f.size || 1, blockedBy: [], blockReason: '', blockedSince: '', waiting: '', waitingSince: '', blockLog: [], updated: nowStamp(),
  };

}

function patch(id, fields) {

    if (!('order' in diff)) { const o = siblingOrders(diff.list, ''); diff.order = o.length ? Math.min(...o) - 1 : 0; }

const completing = new Set();
function complete(id, rowEl) {

  completing.add(id);

    const finished = [t, ...activeKids(id)];
    finished.forEach(x => { if (x.status === 'Blocked') clearBlockLocal(x, 'Finished while blocked'); Object.assign(x, { archived: true, archType: 'Completed', status: 'Done', completed: now, updated: now }); });
    let next = null;

        id: newId(), due: nextDue(t.due, t.repeat, todayISO()), status: 'Not started', created: now, completed: '', plan: '',
        parent: t.parent && byId.get(t.parent) && !byId.get(t.parent).archived ? t.parent : '', archived: false, archType: '', synced: false,

function unarch(x) { Object.assign(x, { archived: false, archType: '', completed: '', status: x.status === 'Done' ? 'Not started' : x.status, updated: nowStamp() }); }

/* ======================================================================
 * Notes: formatted text (Quill). A note's body is stored as Quill Delta JSON.
 * Notes written before the editor existed are plain text; they're converted
 * when opened and saved in the new format on the first edit.
 * ==================================================================== */
const NOTE_MAX = 180000; // mirrors NOTE_MAX in Projects.gs
const HIGHLIGHT = 'rgba(245, 196, 81, 0.35)';
const NOTE_FORMATS = ['bold', 'italic', 'underline', 'strike', 'background', 'link', 'header', 'list', 'indent', 'blockquote', 'divider', 'task'];
const isDeltaBody = body => /^\s*\{\s*"ops"\s*:/.test(body || '');

// "[ ] item" lines become checkboxes, "- item" bullets, "1. item" numbers, "# Title" headings.
function textToDelta(text, made) {
  const ops = [];
  String(text || '').replace(/\r/g, '').split('\n').forEach((raw, i) => {
    let m, line = raw.replace(/\s+$/, ''), attrs = null;
    const indent = Math.min(8, Math.floor(raw.match(/^[ \t]*/)[0].replace(/\t/g, '  ').length / 2));
    if ((m = raw.match(/^\s*\[\s?\]\s?(.*)$/))) { line = m[1]; attrs = { list: 'unchecked' }; }
    else if ((m = raw.match(/^\s*\[[xX]\]\s?(.*)$/))) { line = m[1]; attrs = { list: 'checked' }; }
    else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { line = m[1]; attrs = { list: 'bullet' }; }
    else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { line = m[1]; attrs = { list: 'ordered' }; }
    else if ((m = raw.match(/^\s*(#{1,3})\s+(.*)$/))) { line = m[2]; attrs = { header: m[1].length }; }
    if (attrs && attrs.list) {
      if (indent) attrs.indent = indent;
      if (made && made[i]) attrs.task = String(made[i]);
    }
    if (line) ops.push({ insert: line });
    ops.push(attrs ? { insert: '\n', attributes: attrs } : { insert: '\n' });
  });
  return { ops };
}
// A fresh copy each time, so callers may change it.
function noteDelta(n) {
  if (isDeltaBody(n.body)) {
    try { const d = JSON.parse(n.body); if (d && Array.isArray(d.ops)) return d; } catch (e) {}
  }
  return textToDelta(n.body, n.made);
}
const textCache = new Map();
function noteText(n) {
  const key = n.body || '';
  if (textCache.has(key)) return textCache.get(key);
  let out = key;
  if (isDeltaBody(key)) { try { out = JSON.parse(key).ops.map(op => (typeof op.insert === 'string' ? op.insert : '\n')).join(''); } catch (e) {} }
  if (textCache.size > 300) textCache.clear();
  textCache.set(key, out);
  return out;
}
// task id → is its checkbox ticked? (only checkbox lines linked to a task)
function linkedStates(delta) {
  const m = new Map();
  delta.ops.forEach(op => {
    const a = op.attributes;
    if (a && a.task && typeof op.insert === 'string' && op.insert.includes('\n') && (a.list === 'checked' || a.list === 'unchecked')) m.set(a.task, a.list === 'checked');
  });
  return m;
}
const noteLinksTo = (n, id) => (n.body || '').includes(id) || Object.values(n.made || {}).includes(id);
const notesLinking = id => S.notes.filter(n => proj(n.projectId) && noteLinksTo(n, id) && linkedStates(noteDelta(n)).has(id));

const NOTE_TEMPLATES = {
  meeting: [{ insert: 'Attendees: \n' }, { insert: 'Notes' }, { insert: '\n', attributes: { header: 3 } }, { insert: '\n', attributes: { list: 'bullet' } },
    { insert: 'Action items' }, { insert: '\n', attributes: { header: 3 } }, { insert: '\n', attributes: { list: 'unchecked' } }],
  decision: ['Decision:', 'Why:', 'Alternatives considered:', 'Revisit if:'].reduce((ops, l) => ops.concat({ insert: l, attributes: { bold: true } }, { insert: ' \n' }), []),
  reference: [{ insert: '\n' }],
};
function newNote(p, type) {
  const body = JSON.stringify({ ops: NOTE_TEMPLATES[type] || NOTE_TEMPLATES.reference });
  const n = { id: newId('n'), projectId: p.id, type, title: '', body, pinned: false, created: nowStamp(), updated: nowStamp(), made: {} };
  S.notes.push(n);
  S.noteId = n.id;
  S.noteFilter = 'all';
  send('saveNote', Object.assign(pick(n, ['id', 'projectId', 'type', 'title', 'body']), { create: true }));
  renderNow();
  const ti = document.querySelector(`[data-key="ntitle:${n.id}"]`);
  if (ti) ti.focus();
}
async function deleteNote(n) {
  if (!(await confirmDlg('Delete this note?', `“${n.title || 'Untitled'}” will be deleted. This can't be undone.`, 'Delete note'))) return;
  if (NE && NE.noteId === n.id) { clearTimeout(NE.timer); NE = null; }
  S.notes = S.notes.filter(x => x !== n);
  S.noteId = null;
  schedule();
  send('deleteNote', n.id);
}

// Ticking a linked checkbox completes its task; completing the task ticks the checkbox (in every note).
function syncNoteChecks(ids) {
  const want = new Map();
  ids.forEach(id => { const t = byId.get(id); if (t && t.archType !== 'Deleted') want.set(id, t.archType === 'Completed'); });
  if (!want.size) return;
  S.notes.forEach(n => {
    if (![...want.keys()].some(id => noteLinksTo(n, id))) return;
    if (NE && NE.quill && NE.noteId === n.id) {
      const q = NE.quill;
      q.getLines().forEach(line => {
        const f = line.formats() || {};
        if (!f.task || !want.has(f.task) || (f.list !== 'checked' && f.list !== 'unchecked')) return;
        const v = want.get(f.task) ? 'checked' : 'unchecked';
        if (f.list !== v) q.formatLine(q.getIndex(line), 1, 'list', v, 'api');
      });
      return;
    }
    const d = noteDelta(n);
    let changed = false;
    d.ops.forEach(op => {
      const a = op.attributes;
      if (!a || !a.task || !want.has(a.task) || (a.list !== 'checked' && a.list !== 'unchecked')) return;
      const v = want.get(a.task) ? 'checked' : 'unchecked';
      if (a.list !== v) { a.list = v; changed = true; }
    });
    if (!changed) return;
    n.body = JSON.stringify(d);
    n.made = {};
    n.updated = nowStamp();
    send('saveNote', { id: n.id, body: n.body, made: {} });
  });
}

/* ----- the editor ----- */
let NE = null; // { el, quill, noteId, timer, dirty, states, ... } for the note on screen; kept across re-renders
let quillReady = false;
function setupQuill() {
  if (!window.Quill) return false;
  if (quillReady) return true;
  const Parchment = Quill.import('parchment');
  // Links a checkbox line to a task: <li data-task="t…">
  Quill.register(new Parchment.Attributor('task', 'data-task', { scope: Parchment.Scope.BLOCK }), true);
  const BlockEmbed = Quill.import('blots/block/embed');
  class Divider extends BlockEmbed {}
  Divider.blotName = 'divider';
  Divider.tagName = 'HR';
  Quill.register(Divider, true);
  quillReady = true;
  return true;
}

function editorToolbarHTML() {
  const b = (cls, title, inner, value) => `<button type="button" class="${cls}" ${value != null ? `value="${value}"` : ''} title="${title}" aria-label="${title}">${inner}</button>`;
  const x = (act, title, inner) => `<button type="button" data-ne="${act}" title="${title}" aria-label="${title}">${inner}</button>`;
  return `<div class="ne-bar" role="toolbar" aria-label="Formatting">
    ${x('list', 'Show or hide the note list', ic('sidePanel'))}<span class="ne-sep"></span>
    ${b('ql-bold', 'Bold (Ctrl+B)', ic('bold'))}${b('ql-italic', 'Italic (Ctrl+I)', ic('italic'))}${b('ql-underline', 'Underline (Ctrl+U)', ic('underline'))}${b('ql-strike', 'Strikethrough', ic('strike'))}${b('ql-background', 'Highlight', ic('highlight'), HIGHLIGHT)}<span class="ne-sep"></span>
    ${b('ql-header ne-h', 'Heading 1 (Ctrl+Alt+1)', 'H1', '1')}${b('ql-header ne-h', 'Heading 2 (Ctrl+Alt+2)', 'H2', '2')}${b('ql-header ne-h', 'Heading 3 (Ctrl+Alt+3)', 'H3', '3')}<span class="ne-sep"></span>
    ${b('ql-list', 'Bullets (Ctrl+Shift+8)', ic('bullets'), 'bullet')}${b('ql-list', 'Numbered list (Ctrl+Shift+7)', ic('numbers'), 'ordered')}${b('ql-list ne-check', 'Checkbox (Ctrl+Shift+9)', ic('checkbox'), 'check')}${b('ql-indent', 'Outdent (Shift+Tab)', ic('outdent'), '-1')}${b('ql-indent', 'Indent (Tab)', ic('indent'), '+1')}<span class="ne-sep"></span>
    ${b('ql-blockquote', 'Quote', ic('quote'))}${x('divider', 'Divider line (or type --- and Enter)', ic('rule'))}${x('link', 'Link (Ctrl+K)', ic('link'))}${b('ql-clean', 'Clear formatting', ic('clear'))}
    <span class="ne-grow"></span>
    ${x('task', 'Turn the current line into a task (Ctrl+Shift+Enter)', `${ic('addCircle')}<span>Task</span>`)}${x('focus', 'Focus mode (Ctrl+.)', ic('expand'))}
  </div>`;
}

function createEditor(n) {
  const el = document.createElement('div');
  el.className = 'ne';
  el.innerHTML = `${editorToolbarHTML()}<div class="ne-body"><div class="ne-q"></div><button type="button" class="ne-hover" hidden></button></div>
    <div class="ne-foot"><span class="ne-info"></span><span class="ne-hint">Tab indents · Shift+Tab outdents · type - for bullets, [ ] for a checkbox, # for a heading</span><span class="ne-grip" title="Drag to resize · double-click to reset"></span></div>
    <div class="ne-pop" hidden></div>`;
  return { el, noteId: n.id, quill: null, started: false, timer: null, dirty: false, states: new Map(), lastBody: n.body, size: (n.body || '').length };
}

// Quill needs its element in the page, so it starts after the first mount.
function startEditor(ne, n) {
  ne.started = true;
  wireGrip(ne);
  wireEditorBar(ne);
  if (!setupQuill()) {
    // Still downloading: show the note read-only; onQuill swaps in the real editor when it arrives.
    const loading = window.QUILL_STATE === 'loading';
    ne.el.querySelector('.ne-bar').querySelectorAll('button:not([data-ne="list"]):not([data-ne="focus"])').forEach(b => { b.disabled = true; });
    ne.el.querySelector('.ne-body').innerHTML = (loading ? `<div class="ne-loading">Loading the editor…</div>`
      : `<div class="ne-warn">${ic('alert')}<span>The note editor couldn't load (cdn.jsdelivr.net may be blocked on this network), so this note is read-only for now. Reload to try again, or add the optional <b>quill</b> file described in the README.</span></div>`)
      + `<div class="ne-ro">${deltaToHTML(noteDelta(n))}</div>`;
    ne.el.querySelector('.ne-hint').textContent = '';
    return;
  }
  const quill = new Quill(ne.el.querySelector('.ne-q'), {
    formats: NOTE_FORMATS,
    placeholder: 'Write here. Type - for bullets, 1. for numbers, [ ] for a checkbox, # for a heading.',
    modules: { toolbar: { container: ne.el.querySelector('.ne-bar') }, history: { delay: 700, maxStack: 300, userOnly: true } },
  });
  ne.quill = quill;
  quill.setContents(noteDelta(n), 'silent');
  quill.history.clear();
  ne.states = linkedStates(quill.getContents());
  reconcileChecks(ne);
  // Pasting keeps bold, italics, lists and links; drops colours, fonts, sizes and task links.
  quill.clipboard.addMatcher(Node.ELEMENT_NODE, (node, delta) => {
    delta.ops.forEach(op => {
      const a = op.attributes;
      if (!a) return;
      delete a.task;
      if (a.background && a.background !== HIGHLIGHT) delete a.background;
      if (!Object.keys(a).length) delete op.attributes;
    });
    return delta;
  });
  quill.on('text-change', (delta, old, source) => onEditorChange(ne, source));
  quill.on('editor-change', () => markCheckButton(ne));
  quill.on('selection-change', range => linkPopover(ne, range));
  ne.el.addEventListener('keydown', e => editorKeys(ne, e), true);
  const body = ne.el.querySelector('.ne-body'), hover = ne.el.querySelector('.ne-hover');
  body.addEventListener('mousemove', e => hoverLine(ne, e));
  body.addEventListener('mouseleave', e => { if (!hover.contains(e.relatedTarget)) hover.hidden = true; });
  hover.addEventListener('mousedown', e => e.preventDefault());
  hover.addEventListener('click', () => hoverAction(ne));
  updateNoteInfo(ne);
}

// A task may have been finished (or reopened) while its note wasn't open: match the checkboxes to the tasks.
function reconcileChecks(ne) {
  const q = ne.quill;
  q.getLines().forEach(line => {
    const f = line.formats() || {}, t = f.task && byId.get(f.task);
    if (!t || t.archType === 'Deleted' || (f.list !== 'checked' && f.list !== 'unchecked')) return;
    const v = t.archType === 'Completed' ? 'checked' : 'unchecked';
    if (f.list !== v) q.formatLine(q.getIndex(line), 1, 'list', v, 'api');
  });
}

function wireEditorBar(ne) {
  const bar = ne.el.querySelector('.ne-bar');
  // Keep the cursor and selection in the text while clicking toolbar buttons.
  bar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-ne]');
    if (!b || b.disabled) return;
    const act = b.dataset.ne;
    if (act === 'list') return toggleNoteList();
    if (act === 'focus') return toggleNoteFocus();
    if (!ne.quill) return;
    if (act === 'divider') insertDivider(ne);
    else if (act === 'link') openLinkEditor(ne);
    else if (act === 'task') makeTasksFromSelection(ne);
  });
  const pop = ne.el.querySelector('.ne-pop');
  pop.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  pop.addEventListener('click', e => {
    const b = e.target.closest('[data-pop]');
    if (!b) return;
    if (b.dataset.pop === 'save') saveLink(ne);
    else if (b.dataset.pop === 'remove') removeLink(ne);
    else if (b.dataset.pop === 'edit') showPop(ne, 'edit', ne.quill.getFormat(ne.linkRange).link || '');
  });
  pop.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); saveLink(ne); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); hidePop(ne, true); }
  });
  syncEditorButtons();
}

function onEditorChange(ne, source) {
  ne.dirty = true;
  clearTimeout(ne.timer);
  ne.timer = setTimeout(() => flushEditor(ne), 800);
  const now = linkedStates(ne.quill.getContents());
  if (source === 'user') {
    now.forEach((checked, id) => {
      const before = ne.states.get(id);
      if (before === undefined || before === checked) return;
      const t = byId.get(id);
      if (!t || t.archType === 'Deleted') return;
      if (checked && !t.archived) complete(id, null);
      else if (!checked && t.archType === 'Completed') uncomplete(id);
    });
  }
  ne.states = now;
  updateNoteInfo(ne);
}

function flushEditor(ne) {
  ne = ne || NE;
  if (!ne || !ne.quill) return;
  clearTimeout(ne.timer);
  if (!ne.dirty) return;
  const n = S.notes.find(x => x.id === ne.noteId);
  if (!n) { ne.dirty = false; return; }
  const body = JSON.stringify(ne.quill.getContents());
  ne.size = body.length;
  // Too long: keep it on screen, unsaved, and say so. Saving resumes once it's short enough.
  if (body.length > NOTE_MAX) { ne.tooLong = true; updateNoteInfo(ne); return; }
  ne.tooLong = false;
  ne.dirty = false;
  ne.lastBody = body;
  if (body !== n.body) {
    n.body = body;
    n.made = {};
    n.updated = nowStamp();
    send('saveNote', { id: n.id, body, made: {} });
  }
  updateNoteInfo(ne);
}

function updateNoteInfo(ne) {
  const info = ne.el.querySelector('.ne-info');
  if (!info || !ne.quill) return;
  let boxes = 0;
  ne.quill.getContents().ops.forEach(op => {
    const a = op.attributes;
    if (a && typeof op.insert === 'string' && (a.list === 'checked' || a.list === 'unchecked')) boxes += op.insert.split('\n').length - 1;
  });
  const linked = [...ne.states.keys()].filter(id => byId.get(id)).length;
  info.innerHTML = ne.tooLong
    ? '<span class="bad">Not saved: this note is too long. Remove some text or split it into two notes.</span>'
    : [boxes ? plural(boxes, 'checkbox', 'checkboxes') : '', linked ? `${linked} linked to tasks` : '',
      ne.size > NOTE_MAX * 0.8 ? `<span class="warn">${Math.round(ne.size / NOTE_MAX * 100)}% of the size limit</span>` : ''].filter(Boolean).join(' · ');
}

// Quill's toolbar can't tell that "checked"/"unchecked" both mean the checkbox button is on.
function markCheckButton(ne) {
  const b = ne.el.querySelector('.ne-check'), r = ne.quill.getSelection();
  if (!b || !r) return;
  const l = ne.quill.getFormat(r).list, on = l === 'checked' || l === 'unchecked';
  b.classList.toggle('ql-active', on);
  b.setAttribute('aria-pressed', String(on));
}

function editorKeys(ne, e) {
  const mod = e.ctrlKey || e.metaKey, stop = () => { e.preventDefault(); e.stopPropagation(); };
  if (mod && !e.altKey && !e.shiftKey && e.key === '.') { stop(); toggleNoteFocus(); return; }
  const q = ne.quill;
  if (!q || !q.root.contains(e.target) || e.isComposing) return;
  const range = q.getSelection();
  if (!range) return;
  const fmt = q.getFormat(range);
  if (mod && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'k') { stop(); openLinkEditor(ne); return; }
  if (mod && e.shiftKey && !e.altKey && e.key === 'Enter') { stop(); makeTasksFromSelection(ne); return; }
  if (mod && e.shiftKey && !e.altKey && /^Digit[789]$/.test(e.code)) {
    stop();
    const want = { Digit7: 'ordered', Digit8: 'bullet', Digit9: 'unchecked' }[e.code];
    const on = want === 'unchecked' ? (fmt.list === 'checked' || fmt.list === 'unchecked') : fmt.list === want;
    q.format('list', on ? false : want, 'user');
    return;
  }
  if (mod && e.altKey && /^Digit[0-3]$/.test(e.code)) {
    stop();
    const lvl = Number(e.code.slice(-1));
    q.format('header', lvl && fmt.header !== lvl ? lvl : false, 'user');
    return;
  }
  // Tab / Shift+Tab move a list item in or out wherever the cursor is, like Word and Docs.
  if (e.key === 'Tab' && !mod && !e.altKey && fmt.list) { stop(); q.format('indent', e.shiftKey ? '-1' : '+1', 'user'); return; }
  if (e.key === 'Enter' && !e.shiftKey && !mod && range.length === 0) {
    const [line] = q.getLine(range.index);
    if (!line) return;
    const at = q.getIndex(line), text = q.getText(at, Math.max(0, line.length() - 1));
    // Enter on an empty nested item steps out one level instead of leaving the list.
    if (fmt.list && text === '' && fmt.indent) { stop(); q.format('indent', '-1', 'user'); return; }
    if (!fmt.list && !fmt.header && text.trim() === '---') {
      stop();
      q.deleteText(at, text.length, 'user');
      q.insertEmbed(at, 'divider', true, 'user');
      q.setSelection(at + 1, 0, 'user');
      return;
    }
  }
  if (e.key === ' ' && !mod && range.length === 0 && !fmt.list && !fmt.header && !fmt.blockquote) {
    const [, offset] = q.getLine(range.index);
    const prefix = q.getText(range.index - offset, offset);
    const h = /^(#{1,3})$/.exec(prefix);
    if (h || prefix === '>') {
      stop();
      q.deleteText(range.index - offset, offset, 'user');
      if (h) q.formatLine(range.index - offset, 1, 'header', h[1].length, 'user');
      else q.formatLine(range.index - offset, 1, 'blockquote', true, 'user');
    }
  }
}

function insertDivider(ne) {
  const q = ne.quill, range = q.getSelection(true), [line] = q.getLine(range.index);
  const at = q.getIndex(line), empty = line.length() <= 1;
  const pos = empty ? at : at + line.length() - 1;
  q.insertEmbed(pos, 'divider', true, 'user');
  q.setSelection(pos + 1, 0, 'user');
}

function makeTasksFromSelection(ne) {
  const q = ne.quill, range = q.getSelection(true);
  makeTasksForLines(ne, q.getLines(range.index, Math.max(1, range.length)));
}
function makeTasksForLines(ne, lines) {
  const q = ne.quill, n = S.notes.find(x => x.id === ne.noteId), p = n && proj(n.projectId);
  if (!p) return;
  if (p.status === 'done') { snack('Reopen the project to add tasks to it.'); return; }
  const made = [];
  lines.forEach(line => {
    if (!line || line.statics.blotName === 'divider') return;
    const f = line.formats() || {}, linked = f.task && byId.get(f.task);
    if (f.header || f.list === 'checked' || (linked && linked.archType !== 'Deleted')) return;
    const at = q.getIndex(line), title = q.getText(at, Math.max(0, line.length() - 1)).replace(/\s+/g, ' ').trim();
    if (!title) return;
    const t = createTask({ title: title.slice(0, 500), list: p.name });
    q.formatLine(at, 1, { list: 'unchecked', task: t.id }, 'api');
    made.push(t);
  });
  if (!made.length) { snack('Put the cursor on a line with text to turn it into a task.'); return; }
  ne.states = linkedStates(q.getContents());
  updateNoteInfo(ne);
  const m = msById(made[0].milestone);
  snack(`${made.length === 1 ? 'Task' : plural(made.length, 'task')} added${m ? ' to ' + m.name : ''}`, made.length === 1 ? 'Open' : null, () => openPanel(made[0].id));
}

function hoverLine(ne, e) {
  const hover = ne.el.querySelector('.ne-hover');
  if (hover.contains(e.target)) return;
  const li = e.target.closest && e.target.closest('li[data-list="unchecked"], li[data-list="checked"]');
  const id = li && li.getAttribute('data-task'), t = id && byId.get(id);
  if (!li || !ne.quill.root.contains(li) || (!t && li.getAttribute('data-list') === 'checked')) { hover.hidden = true; ne.hoverLi = null; return; }
  ne.hoverLi = li;
  hover.innerHTML = t ? `${ic('subArrow')}<span>${t.archived ? 'Task done' : 'Open task'}</span>` : `${ic('addCircle')}<span>Make task</span>`;
  hover.style.top = Math.max(0, li.getBoundingClientRect().top - ne.el.querySelector('.ne-body').getBoundingClientRect().top) + 'px';
  hover.hidden = false;
}
function hoverAction(ne) {
  const li = ne.hoverLi;
  if (!li || !li.isConnected) return;
  const id = li.getAttribute('data-task');
  if (id && byId.get(id)) { openPanel(id); return; }
  const blot = Quill.find(li);
  if (blot) makeTasksForLines(ne, [blot]);
  ne.el.querySelector('.ne-hover').hidden = true;
}

/* links */
function normalizeUrl(v) {
  v = String(v || '').trim();
  if (!v) return '';
  if (/^(https?:|mailto:|tel:)/i.test(v)) return v;
  if (/^[^\s@/]+@[^\s@/]+\.[^\s@/]+$/.test(v)) return 'mailto:' + v;
  return 'https://' + v.replace(/^\/+/, '');
}
function linkRangeAt(q, index) {
  for (const i of [index, index + 1]) {
    let [blot] = q.getLeaf(i);
    while (blot && blot.statics.blotName !== 'link' && blot.parent) blot = blot.parent;
    if (blot && blot.statics.blotName === 'link') return { index: q.getIndex(blot), length: blot.length() };
  }
  return null;
}
function openLinkEditor(ne) {
  const q = ne.quill;
  let range = q.getSelection(true);
  const cur = q.getFormat(range).link || '';
  if (cur && !range.length) range = linkRangeAt(q, range.index) || range;

// Read-only view, used only if the editor couldn't load.
function deltaToHTML(delta) {
  const lines = [];
  let cur = [];
  const inline = (text, a) => {
    let h = esc(text);
    if (!a) return h;
    if (a.bold) h = `<b>${h}</b>`;
    if (a.italic) h = `<i>${h}</i>`;
    if (a.underline) h = `<u>${h}</u>`;
    if (a.strike) h = `<s>${h}</s>`;
    if (a.background) h = `<mark>${h}</mark>`;
    if (a.link) h = `<a href="${esc(/^(https?:|mailto:|tel:)/i.test(a.link) ? a.link : '#')}" target="_blank" rel="noopener noreferrer">${h}</a>`;
    return h;
  };
  delta.ops.forEach(op => {
    if (typeof op.insert !== 'string') { if (op.insert && op.insert.divider) lines.push({ hr: true }); return; }
    const parts = op.insert.split('\n');
    parts.forEach((part, i) => {
      if (part) cur.push(inline(part, op.attributes));
      if (i < parts.length - 1) { lines.push({ html: cur.join(''), a: op.attributes || {} }); cur = []; }
    });
  });
  if (cur.length) lines.push({ html: cur.join(''), a: {} });
  const counters = [];
  return lines.map(l => {
    if (l.hr) return '<hr>';
    const a = l.a, ind = a.indent || 0, body = l.html || '<br>';
    if (a.list) {
      if (a.list === 'ordered') { counters[ind] = (counters[ind] || 0) + 1; counters.length = ind + 1; } else counters.length = ind;
      const mark = a.list === 'bullet' ? '•' : a.list === 'ordered' ? counters[ind] + '.' : a.list === 'checked' ? '☑' : '☐';
      return `<div class="ro-li ${a.list === 'checked' ? 'done' : ''}" style="padding-left:${1.5 + ind * 1.5}em"><span class="ro-m">${mark}</span>${body}</div>`;
    }
    counters.length = 0;
    if (a.header) return `<h${a.header}>${body}</h${a.header}>`;
    if (a.blockquote) return `<blockquote>${body}</blockquote>`;
    return `<p>${body}</p>`;
  }).join('');
}

/* ======================================================================

 * ==================================================================== */
const MONTHS = ['january|jan', 'february|feb', 'march|mar', 'april|apr', 'may', 'june|jun', 'july|jul', 'august|aug', 'september|sept|sep', 'october|oct', 'november|nov', 'december|dec'];

  const n = norm(token), names = [...S.projects.filter(p => p.status !== 'done').map(p => p.name), ...S.lists.map(l => l.name)];
  const exact = names.find(x => norm(x) === n);

}

      || take('(?:tomorrow|tmrw|tmr)', () => { r.due = addDays(today, 1); })

  const prow = p => {
    const st = stats(p), h = isOpenProject(p) ? suggested(p) : '';
    const right = p.status === 'blocked' ? `<span style="color:var(--red)">${ic('blocked')}</span>` : `<span class="pct">${p.status === 'planned' ? '' : st.pct + '%'}</span>`;
    return `<button type="button" class="srow ${S.view === 'project' && S.id === p.id ? 'on' : ''} ${isOpenProject(p) ? '' : 'dim'}" data-act="project" data-id="${p.id}" data-key="proj:${p.id}" title="${esc(p.name)}${h ? ' · signals: ' + HEALTH[h] : ''}">
      <i class="dot" style="--c:${COLOR_HEX[p.color] || COLOR_HEX.GRAY}"></i><span class="nm">${esc(p.name)}</span>${h && p.status !== 'blocked' ? `<i class="hd ${h}"></i>` : ''}${right}</button>`;
  };
  const other = S.projects.filter(p => !isOpenProject(p)).sort((a, b) => ['planned', 'paused', 'done'].indexOf(a.status) - ['planned', 'paused', 'done'].indexOf(b.status) || a.name.localeCompare(b.name));
  const counts = new Map();
  live.forEach(t => counts.set(t.list, (counts.get(t.list) || 0) + 1));
  const trashN = S.tasks.filter(t => t.archType === 'Deleted').length;
  return `<div class="brand">${ic('logo')}<span>Tasks</span></div>
    <button class="create" type="button" data-act="create">${ic('add')}<span>Create</span></button>
    ${nav('home', 'home', 'Home')}
    ${nav('myday', 'sun', 'My Day', myDay || '', overdue)}
    ${nav('upcoming', 'upcoming', 'Upcoming')}
    ${nav('starred', 'star', 'Starred', live.filter(t => t.starred).length || '')}
    ${nav('review', 'review', 'Weekly review', toReview || '')}
    <div class="sec"><span>Projects</span><button class="icon-btn" type="button" data-act="new-project" title="Create project" aria-label="Create project">${ic('add')}</button></div>
    ${open.map(prow).join('') || '<div class="empty" style="padding:6px 12px">No active projects.</div>'}
    ${other.length ? `<button type="button" class="sec-toggle" data-act="toggle-other">${prefs.showOther ? 'Hide' : 'Show'} planned, paused &amp; done (${other.length})</button>${prefs.showOther ? other.map(prow).join('') : ''}` : ''}
    <div class="sec"><span>Lists</span><button class="icon-btn" type="button" data-act="new-list" title="Create list" aria-label="Create list">${ic('add')}</button></div>
    ${S.lists.map(l => `<button type="button" class="srow ${S.view === 'list' && S.id === l.name ? 'on' : ''}" data-act="list" data-name="${esc(l.name)}" data-key="list:${esc(l.name)}">
      <i class="dot" style="--c:${COLOR_HEX[l.color] || COLOR_HEX.GRAY}"></i><span class="nm">${esc(l.name)}</span><span class="pct">${counts.get(l.name) || ''}</span></button>`).join('')}
    <div class="drawer-foot">
      ${nav('trash', 'trash', 'Trash', trashN || '')}
      <button type="button" class="nav" data-act="settings">${ic('settings')}<span class="lbl">Settings</span></button>
      <button type="button" class="nav" data-act="shortcuts">${ic('keyboard')}<span class="lbl">Keyboard shortcuts</span><kbd>?</kbd></button>
    </div>`;
}

function viewHTML() {
  if (S.error && !S.ready) {
    return `<div class="big-empty">${ic('alert')}<p>Couldn't load your tasks.</p><p>${esc(S.error)}</p><button class="btn primary" type="button" data-act="retry">Try again</button></div>`;
  }
  if (!S.ready) return `<div class="wrap"><div class="card"><div class="skeleton"><i></i><i></i><i></i><i></i><i></i></div></div></div>`;
  if (S.view === 'project' && proj(S.id)) return projectHTML(proj(S.id));
  if (S.view === 'list' && listByName(S.id)) return listHTML(listByName(S.id));
  return ({ home: homeHTML, myday: myDayHTML, upcoming: upcomingHTML, starred: starredHTML, review: reviewHTML, trash: trashHTML, search: searchHTML }[S.view] || homeHTML)();
}

const healthPill = h => (h ? `<span class="hp ${h}"><i></i>${HEALTH[h]}</span>` : '<span class="hp"><i></i>No update yet</span>');
const dot = name => `<i class="dot" style="--c:${colorOf(name)}"></i>`;

function highlight(text, q) {
  if (!q) return esc(text);
  const lower = text.toLowerCase(), needle = q.toLowerCase();
  let out = '', i = 0, at;
  while ((at = lower.indexOf(needle, i)) >= 0) { out += esc(text.slice(i, at)) + `<mark>${esc(text.slice(at, at + needle.length))}</mark>`; i = at + needle.length; }
  return out + esc(text.slice(i));
}

function taskRow(t, o = {}) {
  const done = t.archType === 'Completed', today = todayISO(), chips = [];
  const q = S.view === 'search' ? S.query.trim() : '';
  if (o.showList) chips.push(`<span class="chip" style="--c:${colorOf(t.list)}"><span class="cdot"></span>${esc(t.list)}</span>`);
  if (done && t.completed) chips.push(`<span class="chip">${ic('check')}Done ${relLower(localDayOf(t.completed))}</span>`);
  if (!done && !o.trash) {
    if (isBlocked(t)) {
      const ob = openBlockers(t);
      chips.push(`<span class="chip blocked" title="${esc(t.blockReason)}">${ic('blocked')}Blocked${t.blockReason ? ': ' + esc(t.blockReason) : ''}</span>`);
      if (t.waiting) chips.push(`<span class="chip wait">${ic('hourglass')}${esc(t.waiting)} · ${ageDays(t.waitingSince)}d</span>`);
      if (ob.length) chips.push(`<span class="chip" title="${esc(ob.map(b => b.title).join(', '))}">${ic('subArrow')}After: ${esc(ob[0].title)}${ob.length > 1 ? ` +${ob.length - 1}` : ''}</span>`);
      if (!hasPlan(t)) chips.push('<span class="chip wait">No unblock plan</span>');
    }
    if (t.status === 'In progress') chips.push(`<span class="chip doing">${ic('half')}In progress</span>`);
    if (t.due && !o.hideDue) {
      const cls = t.due < today ? 'overdue' : t.due === today ? 'today' : '';
      chips.push(`<span class="chip ${cls}">${ic(t.time ? 'clock' : 'event')}${relDay(t.due)}${t.time ? ', ' + fmtTime(t.time) : ''}${t.repeat ? ic('repeat') : ''}</span>`);
    } else if (t.repeat) chips.push(`<span class="chip">${ic('repeat')}${esc(repeatLabel(t.repeat, t.due).split(' on ')[0])}</span>`);
    if (t.plan && !o.hidePlan) chips.push(t.plan <= today ? `<span class="chip myday">${ic('sun')}My Day</span>` : `<span class="chip">${ic('sun')}Plan ${relLower(t.plan)}</span>`);
    if (t.priority === 'High') chips.push(`<span class="chip high">${ic('flag')}High</span>`);
    if (t.priority === 'Low') chips.push(`<span class="chip low">${ic('flag')}Low</span>`);
    const ks = kidsOf(t.id).filter(isLive);
    if (ks.length) chips.push(`<span class="chip" title="Subtasks done">${ic('checklist')}${ks.filter(k => k.archived).length}/${ks.length}</span>`);
    if (o.showParent && t.parent && byId.get(t.parent)) chips.push(`<span class="chip" title="Subtask of ${esc(byId.get(t.parent).title)}">${ic('subArrow')}${esc(byId.get(t.parent).title)}</span>`);
  }
  const inProject = !!projByName(t.list);
  const right = o.trash
    ? `<div class="row-actions"><button class="icon-btn" type="button" data-act="untrash" data-id="${t.id}" title="Restore" aria-label="Restore">${ic('restore')}</button><button class="icon-btn" type="button" data-act="purge" data-id="${t.id}" title="Delete forever" aria-label="Delete forever">${ic('deleteForever')}</button></div>`
    : `${inProject && !done ? `<span class="size" title="Size">${SIZES[pts(t)]}</span>` : ''}${!done ? `<button type="button" class="star ${t.starred ? 'on' : ''}" data-act="star" data-id="${t.id}" aria-pressed="${t.starred}" aria-label="${t.starred ? 'Remove star' : 'Star task'}">${ic(t.starred ? 'star' : 'starOutline')}</button>` : ''}`;
  return `<div class="task ${done ? 'done' : ''} ${isBlocked(t) ? 'blocked' : ''} ${S.taskId === t.id ? 'sel' : ''} ${S.fresh.has(t.id) ? 'enter' : ''}" data-act="${o.trash ? '' : 'task'}" data-id="${t.id}" data-key="task:${t.id}${o.k || ''}" tabindex="0" aria-label="${esc(t.title)}${done ? ', completed' : ''}">
    ${o.trash ? '' : `<button type="button" class="check" data-act="toggle" data-id="${t.id}" role="checkbox" aria-checked="${done}" aria-label="${done ? 'Mark not complete' : 'Complete'}">${ic('check')}</button>`}
    <div class="tb"><div class="tt">${highlight(t.title, q)}</div>${t.desc && !done && o.notes !== false ? `<div class="tn">${highlight(t.desc.split('\n')[0], q)}</div>` : ''}${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}</div>
    ${right}</div>`;
}

function quickAdd(key, defaults, placeholder) {
  const v = drafts.get(key) || '';
  return `<label class="qa">${ic('addCircle')}<input data-qa="1" data-key="qa:${esc(key)}" data-defaults="${esc(JSON.stringify(defaults))}" placeholder="${esc(placeholder || 'Add a task')}" aria-label="${esc(placeholder || 'Add a task')}" value="${esc(v)}" autocomplete="off" maxlength="500" enterkeyhint="done"></label>
    <div class="qa-preview" data-preview="${esc(key)}">${v.trim() ? previewChips(quickFields(v, defaults), defaults) : ''}</div>`;
}
function previewChips(f, defaults) {
  const out = [];
  if (f.due && f.due !== defaults.due) out.push(`<span class="chip today">${ic('event')}${relDay(f.due)}</span>`);
  if (f.time) out.push(`<span class="chip today">${ic('clock')}${fmtTime(f.time)}</span>`);
  if (f.repeat) out.push(`<span class="chip">${ic('repeat')}${esc(repeatLabel(f.repeat, f.due).split(' on ')[0])}</span>`);
  if (f.priority && f.priority !== defaults.priority) out.push(`<span class="chip ${f.priority.toLowerCase()}">${ic('flag')}${f.priority}</span>`);
  if (f.list && f.list !== defaults.list) out.push(`<span class="chip" style="--c:${colorOf(f.list)}"><span class="cdot"></span>${esc(f.list)}</span>`);
  if (f.milestone && f.milestone !== defaults.milestone && msById(f.milestone)) out.push(`<span class="chip">${ic('diamond')}${esc(msById(f.milestone).name)}</span>`);
  if (f.size && f.size !== 1) out.push(`<span class="chip mono">${SIZES[f.size]}</span>`);
  if (f.starred && !defaults.starred) out.push(`<span class="chip star">${ic('star')}Starred</span>`);
  if (out.length) out.push('<span class="sub" style="align-self:center">Enter to add</span>');
  return out.join('');
}

function doneToggle(key, tasks, o) {
  if (!tasks.length) return '';
  const open = !!prefs.open[key];
  return `<button type="button" class="done-toggle ${open ? 'open' : ''}" data-act="show-done" data-v="${esc(key)}" aria-expanded="${open}">${ic('chevron')}Completed (${tasks.length})</button>
    ${open ? tasks.map(t => taskRow(t, o || {})).join('') : ''}`;
}

/* ----- Home ----- */
function homeHTML() {
  const open = openProjects(), today = todayISO(), live = S.tasks.filter(t => !t.archived);
  const att = [];
  open.forEach(p => signals(p).forEach(s => att.push(Object.assign({ p }, s))));
  live.filter(t => !projByName(t.list) && t.due && t.due < today).forEach(t => att.push({ lvl: 'amber', text: `Overdue: ${t.title}`, task: t.id, list: t.list }));
  live.filter(t => !projByName(t.list) && isBlocked(t) && !hasPlan(t)).forEach(t => att.push({ lvl: 'amber', text: `Blocked with no unblock plan: ${t.title}`, task: t.id, list: t.list }));
  const order = { red: 0, amber: 1, info: 2 };
  att.sort((a, b) => order[a.lvl] - order[b.lvl]);
  const waiting = live.filter(t => t.waiting).length + S.projects.filter(p => p.waiting && isOpenProject(p)).length;
  const blocked = live.filter(isBlocked).length + S.projects.filter(p => p.status === 'blocked').length;
  const doneWeek = S.tasks.filter(t => t.archType === 'Completed' && diffDays(localDayOf(t.completed), today) <= 6).length;
  const sorted = open.slice().sort((a, b) => SEV[suggested(b)] - SEV[suggested(a)] || a.priority - b.priority);
  const shelf = S.projects.filter(p => p.status === 'planned' || p.status === 'paused');
  const activeN = S.projects.filter(p => p.status === 'active' || p.status === 'blocked').length;
  return `<div class="wrap">
    <div class="strip">
      <div class="stat ${activeN > 5 ? 'warn' : ''}"><div class="v">${activeN}</div><div class="l">Open projects${activeN > 5 ? ' · consider pausing one' : ''}</div></div>
      <button type="button" class="stat link" data-act="view" data-v="myday"><div class="v">${live.filter(inMyDay).length}</div><div class="l">Tasks in My Day</div></button>
      <div class="stat ${blocked ? 'warn' : ''}"><div class="v">${blocked}</div><div class="l">Blocked</div></div>
      <div class="stat"><div class="v">${waiting}</div><div class="l">Waiting on people</div></div>
    </div>
    <section class="card"><div class="card-h">Needs attention<span class="grow"></span><span class="note">${plural(att.length, 'item')}</span></div>
      <div>${att.length ? att.slice(0, prefs.open['att-all'] ? 99 : 5).map(a => `<button type="button" class="att ${a.lvl}" data-act="${a.task ? 'task' : 'project'}" data-id="${a.task || a.p.id}" ${a.task ? '' : 'data-tab="overview"'}>
        <span class="sev"></span><span class="txt">${esc(a.text)}</span><span class="who">${dot(a.p ? a.p.name : a.list)}${esc(a.p ? a.p.name : a.list)}</span></button>`).join('') : '<div class="empty">Nothing needs attention right now.</div>'}
      ${att.length > 5 ? `<button type="button" class="done-toggle ${prefs.open['att-all'] ? 'open' : ''}" data-act="show-done" data-v="att-all">${ic('chevron')}${prefs.open['att-all'] ? 'Show fewer' : `Show all ${att.length}`}</button>` : ''}</div>
    </section>
    <section class="card"><div class="card-h">Projects · riskiest first<span class="grow"></span><button class="text-btn" type="button" data-act="new-project">New project</button></div>
      ${sorted.length ? `<div class="ptable" role="table">
        <div class="ph">Project</div><div class="ph">Health</div><div class="ph">Progress</div><div class="ph">Current milestone</div><div class="ph c-target">Target</div><div class="ph">Next action</div>
        ${sorted.map(projRow).join('')}</div>` : '<div class="empty">No open projects. Create one, or turn a list into a project from its menu.</div>'}
    </section>
    ${shelf.length ? `<section class="card"><div class="card-h">Planned &amp; paused</div>${shelf.map(p => `<div class="orow">${dot(p.name)}<div class="grow"><button type="button" class="link" data-act="project" data-id="${p.id}"><b>${esc(p.name)}</b></button><div class="sub">${PSTATUS[p.status]}${p.goal ? ' · ' + esc(p.goal) : ''}</div></div>
      <button class="btn sm" type="button" data-act="pstatus" data-id="${p.id}" data-v="active">Start</button></div>`).join('')}</section>` : ''}
  </div>`;
}
function projRow(p) {
  const st = stats(p), rep = reported(p), sug = suggested(p), m = currentMs(p), na = nextAction(p), today = todayISO();
  const mismatch = rep && SEV[sug] > SEV[rep];
  let fc = `<span class="sub">${esc(st.why)}</span>`;
  if (st.forecast && p.target) { const late = diffDays(p.target, st.forecast); fc = `<span class="sub ${late > 7 ? 'bad' : late > 0 ? 'warn' : 'good'}">Forecast ${fmtShort(st.forecast)}</span>`; }
  const ms = m ? (() => { const s = msStats(m), late = m.target && m.target < today; return `<span class="ms" style="--c:${COLOR_HEX[p.color]}">${ic('diamond')}${esc(m.name)}</span><span class="sub ${late ? 'bad' : ''}">${s.nd}/${s.n} tasks${m.target ? ` · ${late ? 'was due' : 'due'} ${relLower(m.target)}` : ''}</span>`; })()
    : `<span class="sub">${msOf(p).length ? 'All milestones reached' : 'No milestones yet'}</span>`;
  return `<div class="prow" role="row" data-act="project" data-id="${p.id}" data-key="prow:${p.id}" tabindex="0">
    <div class="pname">${dot(p.name)}<div>${esc(p.name)}<small>${PPRI[p.priority] || 'Medium'} priority</small></div></div>
    <div class="c-health">${p.status === 'blocked' ? `<span class="pill blocked">${ic('blocked')}Blocked</span>` : healthPill(rep)}${mismatch || (!rep && sug !== 'green') ? `<span class="sub ${sug === 'red' ? 'bad' : 'warn'}">Signals say ${HEALTH[sug]}</span>` : ''}</div>
    <div class="c-prog"><div class="bar" style="--c:${COLOR_HEX[p.color]}"><i style="width:${st.pct}%"></i></div><span class="sub mono">${st.pct}% · ${st.done}/${st.total} pts${st.addedPts ? ` · +${st.addedPts} new` : ''}</span></div>
    <div class="c-ms">${ms}</div>
    <div class="c-target"><span>${p.target ? fmtShort(p.target) : '—'}</span>${fc}</div>
    <div class="c-next">${na ? `<button type="button" class="na" data-act="task" data-id="${na.id}">${esc(na.title)}</button>` : st.open.length ? '<span class="sub warn">No next action</span>' : st.total ? '<span class="sub">Ready to close</span>' : '<span class="sub">Add the first task</span>'}</div>
  </div>`;
}

/* ----- My Day ----- */
function myDayHTML() {
  const today = todayISO(), live = S.tasks.filter(t => !t.archived);
  const overdue = live.filter(t => t.due && t.due < today).sort(SORTS.due);
  const dueToday = live.filter(t => t.due === today).sort(SORTS.due);
  const planned = live.filter(t => t.plan && t.plan <= today && !(t.due && t.due <= today)).sort(SORTS.due);
  const doneToday = S.tasks.filter(t => t.archType === 'Completed' && localDayOf(t.completed) === today).sort(byCompletedDesc);
  const sugg = openProjects().filter(p => p.status === 'active').map(p => ({ p, t: nextAction(p) })).filter(x => x.t && !inMyDay(x.t));
  const total = overdue.length + dueToday.length + planned.length + doneToday.length;
  const sec = (label, arr, hot) => arr.length ? `<div class="group-h ${hot ? 'hot' : ''}"><span class="gname">${label}</span><span class="gmeta">${arr.length}</span></div>${arr.map(t => taskRow(t, { showList: true, hidePlan: true, k: ':' + label })).join('')}` : '';
  return `<div class="wrap"><div class="cols">
    <section class="card">
      <div class="card-b" style="padding-top:14px"><div style="display:flex;align-items:center;gap:12px"><div class="bar" style="flex:1"><i style="width:${total ? Math.round(doneToday.length / total * 100) : 0}%"></i></div><span class="sub">${doneToday.length} of ${total} done</span></div></div>
      ${quickAdd('myday', { plan: today, list: S.defaultList }, 'Add a task for today')}
      ${sec('Overdue', overdue, true)}${sec('Due today', dueToday)}${sec('Planned for today', planned)}
      ${!overdue.length && !dueToday.length && !planned.length ? `<div class="empty">${doneToday.length ? 'All done for today.' : 'Nothing planned for today.'} Pull in a next action on the right.</div>` : ''}
      ${doneToggle('myday-done', doneToday, { showList: true })}<div style="height:8px"></div>
    </section>
    <div class="col">
      <section class="card"><div class="card-h">Next actions from your projects</div>
        <div>${sugg.length ? sugg.map(({ p, t }) => `<div class="orow"><div class="grow"><button type="button" class="link" data-act="task" data-id="${t.id}">${esc(t.title)}</button><div class="sub">${dot(p.name)} ${esc(p.name)}${t.due ? ' · due ' + relLower(t.due) : ''}</div></div>
          <button type="button" class="btn sm tonal" data-act="plan-today" data-id="${t.id}">${ic('sun')}Add</button></div>`).join('') : '<div class="empty">Every active project’s next action is already in My Day.</div>'}</div></section>
      <section class="card"><div class="card-h">Plan date vs. due date</div><div class="card-b small muted">
        <p style="margin:0 0 6px"><b style="color:var(--text)">Plan</b> is when you intend to work on a task. It puts the task in My Day and never turns red.</p>
        <p style="margin:0"><b style="color:var(--text)">Due</b> is a real deadline. It drives overdue warnings and project signals.</p></div></section>
    </div>
  </div></div>`;
}

/* ----- Upcoming ----- */
function upcomingHTML() {
  const today = todayISO(), live = S.tasks.filter(t => !t.archived);
  let html = '';
  const od = live.filter(t => t.due && t.due < today).sort(SORTS.due);
  if (od.length) html += `<section class="card"><div class="card-h" style="color:var(--red)">Overdue<span class="grow"></span><span class="note">${od.length}</span></div>${od.map(t => taskRow(t, { showList: true, k: ':od' })).join('')}<div style="height:8px"></div></section>`;
  for (let i = 0; i < 14; i++) {
    const d = addDays(today, i);
    const items = live.filter(t => t.due === d || (t.plan === d && t.due !== d)).sort(SORTS.due);
    const ms = S.milestones.filter(m => !m.done && m.target === d && proj(m.projectId) && isOpenProject(proj(m.projectId)));
    if (!items.length && !ms.length && i > 1) continue;
    html += `<section class="card"><div class="card-h" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)">${relDay(d)}<span class="note muted">${fmtShort(d)}</span></div>
      ${ms.map(m => { const p = proj(m.projectId); return `<div class="group-h" style="--c:${COLOR_HEX[p.color]};padding-top:6px">${ic('diamond')}<button type="button" class="link gname" data-act="project" data-id="${p.id}">Milestone: ${esc(m.name)}</button><span class="gmeta">${esc(p.name)}</span></div>`; }).join('')}
      ${quickAdd('day:' + d, { due: d, list: S.defaultList })}
      ${items.map(t => taskRow(t, { showList: true, hideDue: t.due === d, k: ':' + d })).join('')}<div style="height:8px"></div></section>`;
  }
  return `<div class="wrap narrow">${html}</div>`;
}

function starredHTML() {
  const items = S.tasks.filter(t => !t.archived && t.starred).sort(SORTS.due);
  return `<div class="wrap narrow"><section class="card" style="padding-top:8px">${quickAdd('starred', { starred: true, list: S.defaultList }, 'Add a starred task')}
    ${items.map(t => taskRow(t, { showList: true })).join('') || '<div class="empty">Star important tasks to see them here.</div>'}<div style="height:8px"></div></section></div>`;
}

function searchHTML() {
  const q = S.query.trim().toLowerCase();
  const hit = t => isLive(t) && (t.title.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.list.toLowerCase().includes(q) || (t.blockReason || '').toLowerCase().includes(q));
  const act = S.tasks.filter(t => !t.archived && hit(t)).sort(SORTS.due);
  const done = S.tasks.filter(t => t.archType === 'Completed' && hit(t)).sort(byCompletedDesc);
  const notes = S.notes.filter(n => (n.title + '\n' + noteText(n)).toLowerCase().includes(q) && proj(n.projectId));
  return `<div class="wrap narrow">
    <section class="card"><div class="card-h">Tasks<span class="grow"></span><span class="note">${act.length + done.length}</span></div>
      ${act.map(t => taskRow(t, { showList: true, showParent: true })).join('')}${!act.length && !done.length ? '<div class="empty">No matching tasks.</div>' : ''}
      ${doneToggle('search-done', done, { showList: true })}<div style="height:8px"></div></section>
    ${notes.length ? `<section class="card"><div class="card-h">Notes</div><div class="card-b">${notes.map(n => `<button type="button" class="nmini" data-act="note" data-id="${n.id}"><span class="ntype ${n.type}">${n.type}</span>${highlight(n.title || 'Untitled', S.query.trim())}<small>${esc(proj(n.projectId).name)}</small></button>`).join('')}</div></section>` : ''}
  </div>`;
}

function trashHTML() {
  const items = S.tasks.filter(t => t.archType === 'Deleted').sort((a, b) => a.list.localeCompare(b.list) || a.title.localeCompare(b.title));
  return `<div class="wrap narrow"><section class="card"><div class="card-h">Deleted tasks stay here until you empty the trash<span class="grow"></span>
    <button class="text-btn danger" type="button" data-act="empty-trash" ${items.length ? '' : 'disabled'}>Empty trash</button></div>
    ${items.map(t => taskRow(t, { trash: true, showList: true })).join('') || '<div class="empty">Trash is empty.</div>'}<div style="height:8px"></div></section></div>`;
}

/* ----- Weekly review ----- */
function reviewHTML() {
  const open = openProjects(), live = S.tasks.filter(t => !t.archived);
  const waiting = [...live.filter(t => t.waiting).map(t => ({ kind: 'task', x: t, title: t.title, where: t.list })),
    ...S.projects.filter(p => p.waiting && isOpenProject(p)).map(p => ({ kind: 'project', x: p, title: `Project: ${p.name}`, where: p.name }))]
    .sort((a, b) => (a.x.waitingSince || '').localeCompare(b.x.waitingSince || ''));
  const noPlan = live.filter(t => isBlocked(t) && !hasPlan(t));
  const shelf = S.projects.filter(p => p.status === 'planned' || p.status === 'paused');
  const reviewed = open.filter(p => S.reviewed.has(p.id)).length;
  return `<div class="wrap" style="max-width:1040px">
    <div class="sub">About 10 minutes · ${reviewed} of ${open.length} projects reviewed${S.settings.reviewDay != null ? ` · your review day is ${WEEKDAYS[S.settings.reviewDay]}` : ''}</div>
    <div class="step"><span class="n">01</span><h2>Check each open project</h2></div>
    <p class="sub" style="margin:0">Read the signals, pick a health and write two sentences: what changed, what's next, what's in the way.</p>
    ${open.map(p => {
      const sig = signals(p), sug = suggested(p), na = nextAction(p), done = S.reviewed.has(p.id);
      return `<section class="card"><div class="rv-h">${dot(p.name)}<h3>${esc(p.name)}</h3>
          ${done ? '<span class="hp green"><i></i>Reviewed</span>' : `<span class="sub">Last update</span>${healthPill(reported(p))}<span class="sub">Signals</span>${healthPill(sug)}`}
          <button class="btn sm" type="button" data-act="project" data-id="${p.id}">Open</button></div>
        ${done ? '' : `<div class="rv-b"><div>
            ${sig.length ? sig.map(s => `<div class="sig ${s.lvl}"><span class="sev"></span><span>${s.task ? `<button type="button" class="link" data-act="task" data-id="${s.task}">${esc(s.text)}</button>` : esc(s.text)}</span></div>`).join('') : '<p class="sub">No signals. Everything looks on track.</p>'}
            <div class="sig info" style="border-top:1px solid var(--line)"><span class="sev"></span><span>Next action: ${na ? `<button type="button" class="link" data-act="task" data-id="${na.id}"><b>${esc(na.title)}</b></button>` : '<b style="color:var(--amber)">none. Add a task or unblock one.</b>'}</span></div>
          </div><div>${composerHTML(p, 'rv')}</div></div>`}
      </section>`;
    }).join('') || '<div class="empty">No open projects.</div>'}
    <div class="step"><span class="n">02</span><h2>Chase what you're waiting on</h2></div>
    <section class="card">${waiting.length ? waiting.map(({ kind, x, title, where }) => {
      const age = ageDays(x.waitingSince);
      return `<div class="orow"><div class="grow"><button type="button" class="link" data-act="${kind === 'project' ? 'project' : 'task'}" data-id="${x.id}">${esc(title)}</button><div class="sub ${age >= 5 ? 'warn' : ''}">Waiting on ${esc(x.waiting)} for ${plural(age, 'day')} · ${esc(where)}</div></div>
        <button class="btn sm" type="button" data-act="followed" data-kind="${kind}" data-id="${x.id}">I followed up</button><button class="btn sm tonal" type="button" data-act="arrived" data-kind="${kind}" data-id="${x.id}">It arrived</button></div>`;
    }).join('') : '<div class="empty">You’re not waiting on anyone.</div>'}</section>
    ${noPlan.length ? `<div class="step"><span class="n">03</span><h2>Give blocked tasks a plan</h2></div>
    <section class="card">${noPlan.map(t => `<div class="orow"><div class="grow"><button type="button" class="link" data-act="task" data-id="${t.id}">${esc(t.title)}</button><div class="sub">${esc(t.list)} · ${t.blockReason ? 'Blocked: ' + esc(t.blockReason) : 'Blocked with no reason recorded'}</div></div>
      <button class="btn sm warn" type="button" data-act="block" data-kind="task" data-id="${t.id}">Add a plan</button></div>`).join('')}</section>` : ''}
    <div class="step"><span class="n">${noPlan.length ? '04' : '03'}</span><h2>Decide on planned and paused projects</h2></div>
    <section class="card">${shelf.length ? shelf.map(p => `<div class="orow">${dot(p.name)}<div class="grow"><b>${esc(p.name)}</b><div class="sub">${PSTATUS[p.status]}${p.goal ? ' · ' + esc(p.goal) : ''}</div></div>
      ${open.length >= 5 ? '<span class="sub warn">You already have 5 open projects</span>' : ''}<button class="btn sm" type="button" data-act="pstatus" data-id="${p.id}" data-v="active">Start</button></div>`).join('') : '<div class="empty">Nothing planned or paused.</div>'}</section>
  </div>`;
}
function composerHTML(p, ctx) {
  const pick = S.uh[p.id] || suggested(p), key = `upd:${ctx}:${p.id}`;
  return `<div class="composer">
    <div class="hbtns"><span class="sub">Health</span>${['green', 'amber', 'red'].map(h => `<button type="button" class="hbtn ${h}" aria-pressed="${pick === h}" data-act="uh" data-id="${p.id}" data-h="${h}"><i></i>${HEALTH[h]}</button>`).join('')}</div>
    <textarea data-key="${key}" data-draft="${key}" rows="3" placeholder="What changed, what's next, what's in the way?" aria-label="Status update for ${esc(p.name)}">${esc(drafts.get(key) || '')}</textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="sub">Suggested from signals: ${HEALTH[suggested(p)]}</span>
      <button type="button" class="btn sm primary" data-act="post-update" data-id="${p.id}" data-ctx="${ctx}">Post update</button></div></div>`;
}

/* ----- Project page ----- */
function projectHTML(p) {
  if (!['overview', 'tasks', 'notes'].includes(S.tab)) S.tab = 'overview';
  const st = stats(p), today = todayISO();
  const statusPill = p.status === 'blocked' ? `<button type="button" class="pill blocked" data-act="status-menu" data-id="${p.id}">${ic('blocked')}Blocked${ic('chevron')}</button>`
    : `<button type="button" class="pill ${p.status === 'done' ? 'done' : ''}" data-act="status-menu" data-id="${p.id}">${PSTATUS[p.status]}${ic('chevron')}</button>`;
  const head = `<div class="phead" style="--c:${COLOR_HEX[p.color]}"><div class="phead-in">
    <div class="ph-row">${dot(p.name)}${statusPill}${isOpenProject(p) ? healthPill(reported(p)) : ''}<span class="grow"></span>
      <button class="btn sm" type="button" data-act="edit-project" data-id="${p.id}">${ic('edit')}Edit</button></div>
    ${p.closed ? `<div class="ph-meta"><span>Closed <b>${fmtShort(p.closed)}</b></span></div>` : ''}
    <nav class="tabs" role="tablist">${[['overview', 'Overview', ''], ['tasks', 'Tasks', st.open.length], ['notes', 'Notes', notesOf(p).length]].map(([k, l, n]) => `<button type="button" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-v="${k}">${l}${n ? `<span class="count">${n}</span>` : ''}</button>`).join('')}</nav></div></div>`;
  return head + ({ overview: overviewHTML, tasks: projectTasksHTML, notes: notesHTML }[S.tab])(p);
}

function blockBoxHTML(kind, x) {
  const ob = x.blockedBy.map(id => byId.get(id)).filter(Boolean);
  const age = ageDays(x.blockedSince);
  return `<div class="blockbox"><div class="bh">${ic('blocked')}${kind === 'project' ? 'Project blocked' : 'Blocked'}<span class="muted">${x.blockedSince ? `· ${age ? `for ${plural(age, 'day')}` : 'since today'}` : ''}</span></div>
    <div class="reason">${x.blockReason ? esc(x.blockReason) : '<span class="muted">No reason recorded.</span>'}</div>
    ${hasPlan(x) ? `<div class="plan-h">Unblocks when these are done</div>
      ${ob.map(b => `<div class="bitem ${b.archived ? 'done' : ''}"><button type="button" class="check" data-act="toggle" data-id="${b.id}" aria-label="${b.archived ? 'Mark not complete' : 'Complete'}: ${esc(b.title)}">${ic('check')}</button><button type="button" class="link bt" data-act="task" data-id="${b.id}">${esc(b.title)}</button>${b.archType === 'Deleted' ? '<span class="sub">deleted</span>' : ''}</div>`).join('')}
      ${x.waiting ? `<div class="bitem">${ic('hourglass')}<span class="bt">Waiting on <b>${esc(x.waiting)}</b> · ${plural(ageDays(x.waitingSince), 'day')}</span>
        <button class="btn sm" type="button" data-act="followed" data-kind="${kind}" data-id="${x.id}">I followed up</button><button class="btn sm tonal" type="button" data-act="arrived" data-kind="${kind}" data-id="${x.id}">It arrived</button></div>` : ''}`
    : '<div class="noplan">No unblock plan yet. Add a task to do first, or who you’re waiting on.</div>'}
    <div class="bactions"><button class="btn sm ${hasPlan(x) ? '' : 'warn'}" type="button" data-act="block" data-kind="${kind}" data-id="${x.id}">${ic('edit')}${hasPlan(x) ? 'Edit block' : 'Add a plan'}</button>
      <button class="btn sm" type="button" data-act="unblock" data-kind="${kind}" data-id="${x.id}">${ic('unlock')}Unblock now</button></div></div>`;
}

function overviewHTML(p) {
  const st = stats(p), na = nextAction(p), today = todayISO(), ms = msOf(p), ups = updatesOf(p);
  const sig = signals(p).filter(x => x.act !== 'blocked');
  const pinned = notesOf(p).filter(n => n.pinned || n.type === 'decision').sort((a, b) => b.pinned - a.pinned || (b.updated || '').localeCompare(a.updated || ''));
  const late = st.forecast && p.target ? diffDays(p.target, st.forecast) : 0;
  const composing = S.composeFor === p.id, allUps = !!prefs.open['ups:' + p.id];
  const closing = sig.some(x => x.act === 'close');

  const target = p.target
    ? `<div class="fv">${fmtShort(p.target)}</div><div class="sub ${late > 7 ? 'bad' : late > 0 ? 'warn' : ''}">${st.forecast ? (late > 0 ? `Forecast ${fmtShort(st.forecast)}` : 'On pace') : diffDays(today, p.target) >= 0 ? plural(diffDays(today, p.target), 'day') + ' left' : 'Past target'}</div>`
    : `<button type="button" class="text-btn flush" data-act="edit-project" data-id="${p.id}">Set a date</button>`;
  const next = na ? `<button type="button" class="link fv-task" data-act="task" data-id="${na.id}">${esc(na.title)}</button>${na.due ? `<div class="sub">Due ${relLower(na.due)}</div>` : ''}`
    : st.open.length ? '<div class="sub warn">Everything open is blocked</div>'
    : `<button type="button" class="text-btn flush" data-act="tab" data-v="tasks">${st.total ? 'All done' : '+ Add the first task'}</button>`;
  const summary = `<section class="card summary">
    ${p.goal ? `<p class="goal">${esc(p.goal)}</p>` : `<button type="button" class="text-btn flush" data-act="edit-project" data-id="${p.id}">+ Add a goal: when is this project done?</button>`}
    ${p.outcome ? `<p class="small" style="color:var(--green);margin:0">Outcome: ${esc(p.outcome)}</p>` : ''}
    <div class="facts">
      <div class="fact"><div class="fl">Progress</div><div class="fv">${st.pct}%</div><div class="bar" style="--c:${COLOR_HEX[p.color]}"><i style="width:${st.pct}%"></i></div></div>
      <div class="fact"><div class="fl">Target</div>${target}</div>
      <div class="fact wide"><div class="fl">Next action</div>${next}</div>
    </div></section>`;

  const attention = sig.length ? `<section class="card"><div class="card-h">Needs attention</div><div class="card-b">
    ${sig.map(x => `<div class="sig ${x.lvl}"><span class="sev"></span><span>${x.task ? `<button type="button" class="link" data-act="task" data-id="${x.task}">${esc(x.text)}</button>` : esc(x.text)}</span></div>`).join('')}
    ${closing ? `<div class="composer" style="margin-top:8px"><textarea data-key="outcome:${p.id}" data-draft="outcome:${p.id}" rows="2" placeholder="What did it achieve? e.g. Repeat defects down 38%" aria-label="Outcome">${esc(drafts.get('outcome:' + p.id) || '')}</textarea>
      <div><button type="button" class="btn sm primary" data-act="close-project" data-id="${p.id}">Close project</button></div></div>` : ''}</div></section>` : '';

  const milestones = ms.length ? `<section class="card"><div class="card-h">Milestones<span class="grow"></span><button class="text-btn" type="button" data-act="milestones" data-id="${p.id}">Edit</button></div>
    <div class="card-b">${ms.map(m => {
      const s = msStats(m), lateM = !m.done && m.target && m.target < today, cur = currentMs(p) === m;
      const when = m.done ? `Reached ${fmtShort(m.done)}` : !m.target ? '' : lateM ? `${diffDays(m.target, today)} days late` : relDay(m.target);
      return `<div class="mrow ${m.done ? 'reached' : lateM ? 'late' : cur ? 'current' : ''}">${ic('diamond')}<div>${esc(m.name)}<span class="sub"> · ${s.nd}/${s.n}</span></div>
        <div class="bar" style="--c:${m.done ? 'var(--green)' : COLOR_HEX[p.color]}"><i style="width:${s.pct}%"></i></div><div class="when">${when}</div></div>`;
    }).join('')}</div></section>` : '';

  const shown = allUps ? ups : ups.slice(0, 1);
  const updates = isOpenProject(p) || ups.length ? `<section class="card"><div class="card-h">Status<span class="grow"></span>
      ${isOpenProject(p) && !composing ? `<button class="text-btn" type="button" data-act="compose" data-id="${p.id}">Post update</button>` : ''}</div>
    <div class="card-b">${composing ? composerHTML(p, 'ov') : ''}
      ${shown.map(u => `<div class="upd"><div class="uh">${healthPill(u.health)}<span>${fmtDay(u.date)}</span></div><p>${esc(u.text)}</p></div>`).join('') || (composing ? '' : '<p class="sub" style="margin:0">No updates yet.</p>')}
      ${ups.length > 1 ? `<button type="button" class="text-btn flush" data-act="show-done" data-v="ups:${p.id}">${allUps ? 'Show less' : `Show earlier (${ups.length - 1})`}</button>` : ''}</div></section>` : '';

  const notes = pinned.length ? `<section class="card"><div class="card-h">Pinned &amp; decisions</div><div class="card-b">
    ${pinned.slice(0, 5).map(n => `<button type="button" class="nmini" data-act="note" data-id="${n.id}"><span class="ntype ${n.type}">${n.type}</span><span>${esc(n.title || 'Untitled')}</span></button>`).join('')}</div></section>` : '';

  const side = attention + notes;
  return `<div class="wrap">
    ${p.status === 'blocked' ? blockBoxHTML('project', p) : ''}
    ${summary}
    ${side ? `<div class="cols"><div class="col">${milestones}${updates}</div><div class="col">${side}</div></div>` : `${milestones}${updates}`}
    ${!ms.length && p.status !== 'done' ? `<p class="sub center"><button type="button" class="text-btn" data-act="milestones" data-id="${p.id}">+ Add milestones</button> to split the project into phases</p>` : ''}
  </div>`;
}

function projectTasksHTML(p) {
  const ms = msOf(p), all = tasksIn(p.name).filter(isTop);
  const groups = ms.map(m => ({ m, ts: all.filter(t => t.milestone === m.id) }));
  const loose = all.filter(t => !ms.some(m => m.id === t.milestone));
  if (loose.length || !ms.length) groups.push({ m: null, ts: loose });
  const canAdd = p.status !== 'done';
  return `<div class="wrap narrow"><section class="card" style="--c:${COLOR_HEX[p.color]}">
    ${groups.map(({ m, ts }) => {
      const open = ts.filter(t => !t.archived).sort(SORTS.my), done = ts.filter(t => t.archType === 'Completed').sort(byCompletedDesc);
      const s = m ? msStats(m) : null, late = m && !m.done && m.target && m.target < todayISO();
      const key = `ms:${p.id}:${m ? m.id : 'none'}`;
      return `<div class="group-h ${m && m.done ? 'reached' : ''}">${m ? ic('diamond') : ''}<span class="gname">${m ? esc(m.name) : (ms.length ? 'No milestone' : 'Tasks')}</span>
          <span class="gmeta" style="${late ? 'color:var(--red)' : ''}">${m ? `${s.nd}/${s.n}${m.done ? ` · reached ${fmtShort(m.done)}` : m.target ? ` · ${late ? 'was due' : 'due'} ${relLower(m.target)}` : ''}` : ''}</span></div>
        ${open.map(t => taskRow(t)).join('')}
        ${canAdd && !(m && m.done) ? quickAdd(key, { list: p.name, milestone: m ? m.id : '' }, m ? `Add a task to ${m.name}` : 'Add a task') : ''}
        ${doneToggle(key + ':done', done)}`;
    }).join('')}
    <div class="card-b" style="padding-top:8px"><button class="text-btn" type="button" data-act="milestones" data-id="${p.id}">${ic('diamond')} ${ms.length ? 'Edit milestones' : 'Add milestones'}</button></div>
  </section>
  <p class="sub">Quick add understands <kbd>tomorrow</kbd> <kbd>fri 3pm</kbd> <kbd>!high</kbd> <kbd>~L</kbd> (size) <kbd>^Milestone</kbd> <kbd>*</kbd> (star). Alt + ↑/↓ moves the selected task.</p></div>`;
}

function notesHTML(p) {
  const all = notesOf(p).sort((a, b) => b.pinned - a.pinned || (b.updated || '').localeCompare(a.updated || ''));
  const shown = all.filter(n => S.noteFilter === 'all' || n.type === S.noteFilter);
  if (!all.some(n => n.id === S.noteId)) S.noteId = (shown[0] || all[0] || {}).id || null;
  const n = all.find(x => x.id === S.noteId);
  const filters = [['all', 'All'], ['meeting', 'Meetings'], ['decision', 'Decisions'], ['reference', 'Reference']];
  return `<div class="notes-wrap ${prefs.noteListHidden && n ? 'list-hidden' : ''}" style="--nl:${prefs.noteListW || 280}px">
    <section class="card nlist-card"><div class="card-h">Notes<span class="grow"></span><span class="note">${all.length || ''}</span></div>
      <div class="filters">${filters.map(([k, l]) => `<button type="button" class="fbtn" aria-pressed="${S.noteFilter === k}" data-act="nfilter" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="nlist" id="nlist">${noteListHTML(shown)}</div>
      <div class="card-b" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" type="button" data-act="new-note" data-v="meeting" data-id="${p.id}">${ic('add')}Meeting</button>
        <button class="btn sm" type="button" data-act="new-note" data-v="decision" data-id="${p.id}">${ic('add')}Decision</button><button class="btn sm" type="button" data-act="new-note" data-v="reference" data-id="${p.id}">${ic('add')}Note</button></div>
    </section>
    <div class="nsplit" role="separator" aria-orientation="vertical" aria-label="Resize the note list" title="Drag to resize · double-click to reset"></div>
    <section class="nmain">${n ? `
      <div class="nhead">
        <select class="nsel" data-note-type="${n.id}" aria-label="Note type">${['meeting', 'decision', 'reference'].map(t => `<option value="${t}" ${n.type === t ? 'selected' : ''}>${t[0].toUpperCase() + t.slice(1)}</option>`).join('')}</select>
        <span class="sub">${fmtDay(localDayOf(n.created))}</span><span class="grow"></span>
        <button class="btn sm" type="button" data-act="pin" data-id="${n.id}">${ic('pin')}${n.pinned ? 'Unpin' : 'Pin to overview'}</button>
        <button class="icon-btn" type="button" data-act="delete-note" data-id="${n.id}" title="Delete note" aria-label="Delete note">${ic('trash')}</button></div>
      <input class="ntitle" data-key="ntitle:${n.id}" data-note="${n.id}" data-nf="title" value="${esc(n.title)}" placeholder="Untitled note" aria-label="Note title" maxlength="200">
      <div data-note-slot="${n.id}"></div>`
    : `<div class="card"><div class="empty">Keep meeting notes, decisions and reference material next to the work. Notes support headings, bullets, checkboxes and links, and any checkbox can become a task.</div></div>`}
    </section></div>`;
}
function noteListHTML(shown) {
  return shown.map(n => {
    const snip = noteText(n).replace(/\s+/g, ' ').trim().slice(0, 90);
    return `<button type="button" class="nitem ${S.noteId === n.id ? 'on' : ''}" data-act="note" data-id="${n.id}">${ic(n.type === 'decision' ? 'decision' : n.type === 'meeting' ? 'meeting' : 'notes')}
      <span style="min-width:0;flex:1"><span class="nt">${esc(n.title || 'Untitled')}</span>${snip ? `<span class="snip">${esc(snip)}</span>` : ''}<small>${n.pinned ? 'Pinned · ' : ''}${fmtShort(localDayOf(n.updated || n.created))}</small></span></button>`;
  }).join('') || '<p class="sub" style="padding:8px">No notes here yet.</p>';
}

/* ----- Plain list ----- */
function listHTML(l) {
  const ts = tasksIn(l.name).filter(isTop), open = ts.filter(t => !t.archived).sort(SORTS.my), done = ts.filter(t => t.archType === 'Completed').sort(byCompletedDesc);
  return `<div class="wrap narrow"><section class="card" style="--c:${COLOR_HEX[l.color]}">
    <div class="card-h">${dot(l.name)}<span class="note" style="color:var(--text-2)">${plural(open.length, 'open task')}</span><span class="grow"></span>
      <button class="icon-btn" type="button" data-act="list-menu" data-name="${esc(l.name)}" title="List options" aria-label="List options">${ic('more')}</button></div>
    ${quickAdd('list:' + l.name, { list: l.name })}

const saveTimers = new Map();
function saveSoon(id, field, value) {
  const k = id + ':' + field, prev = saveTimers.get(k);
  if (prev) clearTimeout(prev.timer);
  const run = () => { saveTimers.delete(k); patch(id, { [field]: value }); };
  saveTimers.set(k, { timer: setTimeout(run, 600), run });
}
function flushSaves() {
  [...saveTimers.values()].forEach(v => { clearTimeout(v.timer); v.run(); });
  [...noteTimers.keys()].forEach(flushNote);
  flushEditor();
}

let menuReturn = null, menuItems = [];
function openMenu(items, anchor) {
  closeMenu(false);
  menuReturn = anchor;
  menuItems = items.filter(Boolean);
  const layer = $('layer');
  const html = menuItems.map((it, i) => {
    if (it === '-') return '<hr>';
    if (it.header) return `<div class="menu-h">${esc(it.header)}</div>`;
    return `<button type="button" class="menu-i ${it.danger ? 'danger' : ''} ${it.on ? 'on' : ''}" data-mi="${i}" ${it.disabled ? 'disabled' : ''} ${it.color ? `style="--c:${it.color}"` : ''}>
      ${it.color ? '<span class="cdot"></span>' : it.icon ? ic(it.icon) : '<span class="sp"></span>'}<span class="l">${esc(it.label)}</span></button>`;
  }).join('');
  layer.insertAdjacentHTML('beforeend', `<div class="menu-scrim"></div><div class="menu" role="menu">${html}</div>`);
  const menu = layer.querySelector('.menu'), r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8));
  if (r.right - mw < 8) left = Math.max(8, Math.min(r.left, innerWidth - mw - 8));
  let top = r.bottom + 4;
  if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  layer.querySelector('.menu-scrim').addEventListener('click', () => closeMenu());
  menu.addEventListener('click', e => {
    const b = e.target.closest('[data-mi]');
    if (!b) return;
    const it = menuItems[Number(b.dataset.mi)];
    closeMenu(false);
    it.action();
  });
  menu.addEventListener('keydown', e => {
    const btns = [...menu.querySelectorAll('.menu-i:not([disabled])')], i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); btns[(i + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length].focus(); }
    else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); closeMenu(); }
  });
  const first = menu.querySelector('.menu-i:not([disabled])');
  if (first) first.focus();
}
function closeMenu(refocus = true) {
  const layer = $('layer'), had = layer.querySelector('.menu');
  layer.querySelectorAll('.menu, .menu-scrim').forEach(n => n.remove());
  if (had && refocus && menuReturn && menuReturn.isConnected) menuReturn.focus({ preventScroll: true });
}

// Generic modal. `actions`: [{ label, value, primary, danger, left }]. `onAction(value, box)` may return false to keep it open.
function openDialog({ title, body, actions, wide, onMount, onAction }) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const scrim = document.createElement('div');
    scrim.className = 'dlg-scrim';
    scrim.innerHTML = `<div class="dlg ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><h2 id="dlgTitle">${esc(title)}</h2>${body}
      <div class="dlg-actions">${actions.map((a, i) => `<button type="button" class="btn ${a.primary ? (a.danger ? 'danger' : 'primary') : a.danger ? 'danger' : ''} ${a.left ? 'left' : ''}" data-ai="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
    const box = scrim.firstElementChild;
    const finish = v => {
      if (v !== null && onAction && onAction(v, box) === false) return;
      scrim.remove();
      document.removeEventListener('keydown', onKey, true);
      if (prev && prev.isConnected) prev.focus({ preventScroll: true });
      resolve(v);
    };
    const primary = actions.find(a => a.primary);
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(null); }
      else if (e.key === 'Enter' && primary && e.target.tagName === 'INPUT' && !['checkbox', 'date'].includes(e.target.type) && !e.target.dataset.enter) { e.preventDefault(); finish(primary.value); }
      else if (e.key === 'Tab') {
        const f = [...box.querySelectorAll('button:not([disabled]), input, select, textarea, a[href]')];
        if (!f.length) return;
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    };
    box.addEventListener('click', e => { const b = e.target.closest('[data-ai]'); if (b) finish(actions[Number(b.dataset.ai)].value); });
    scrim.addEventListener('mousedown', e => { if (e.target === scrim) finish(null); });
    document.addEventListener('keydown', onKey, true);
    $('layer').append(scrim);
    if (onMount) onMount(box);
    const first = box.querySelector('[autofocus]') || box.querySelector('input:not([type=checkbox]), textarea, select') || box.querySelector('.btn.primary, .btn.danger');
    if (first) { first.focus(); if (first.select && first.tagName === 'INPUT') first.select(); }
  });
}
