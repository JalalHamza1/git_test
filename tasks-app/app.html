  if ('status' in diff && t.status === 'Blocked' && diff.status !== 'Blocked') clearBlockLocal(t, 'Unblocked by hand');
  Object.assign(t, diff, { updated: nowStamp() });
  reindex();
  schedule();
  send('saveTask', Object.assign({ id }, diff));
}

function clearBlockLocal(x, how) {
  if (x.blockReason || x.blockedBy.length || x.waiting) {
    x.blockLog = (x.blockLog || []).concat({ reason: x.blockReason, from: x.blockedSince, to: nowStamp(), how }).slice(-20);
  }
  Object.assign(x, { blockReason: '', blockedBy: [], blockedSince: '', waiting: '', waitingSince: '' });
}
// Mirrors afterFinished_ in Projects.gs.
function afterFinishedLocal(ids) {
  const fin = new Set(ids), unblocked = [], reached = [];
  S.tasks.forEach(t => {
    if (t.archived || t.status !== 'Blocked' || t.waiting || !t.blockedBy.some(x => fin.has(x)) || !blockersCleared(t.blockedBy)) return;
    clearBlockLocal(t, 'Unblocked when its tasks were done');
    t.status = 'Not started';
    unblocked.push(t.title);
  });
  S.projects.forEach(p => {
    if (p.status !== 'blocked' || p.waiting || !p.blockedBy.some(x => fin.has(x)) || !blockersCleared(p.blockedBy)) return;
    clearBlockLocal(p, 'Unblocked when its tasks were done');
    p.status = 'active';
    unblocked.push(`project ${p.name}`);
  });
  ids.forEach(id => {
    const t = byId.get(id);
    if (!t || t.archType !== 'Completed' || !t.milestone) return;
    const m = msById(t.milestone);
    if (!m || m.done || S.tasks.some(x => x.milestone === m.id && !x.archived)) return;
    m.done = todayISO();
    reached.push(m.name);
  });
  return { unblocked, reached };
}

const completing = new Set();
function complete(id, rowEl) {
  const t = byId.get(id);
  if (!t || t.archived || completing.has(id)) return;
  completing.add(id);
  const finish = () => {
    completing.delete(id);
    if (t.archived) return;
    const now = nowStamp();
    const finished = [t, ...activeKids(id)];
    finished.forEach(x => { if (x.status === 'Blocked') clearBlockLocal(x, 'Finished while blocked'); Object.assign(x, { archived: true, archType: 'Completed', status: 'Done', completed: now, updated: now }); });
    let next = null;
    if (t.repeat) {
      next = Object.assign(pick(t, ['title', 'desc', 'time', 'priority', 'list', 'starred', 'order', 'repeat', 'milestone', 'size']), {
        id: newId(), due: nextDue(t.due, t.repeat, todayISO()), status: 'Not started', created: now, completed: '', plan: '',
        parent: t.parent && byId.get(t.parent) && !byId.get(t.parent).archived ? t.parent : '', archived: false, archType: '', synced: false,
        blockedBy: [], blockReason: '', blockedSince: '', waiting: '', waitingSince: '', blockLog: [], updated: now,
      });
      S.tasks.push(next);
      S.fresh.add(next.id);
    }
    reindex();
    const res = afterFinishedLocal(finished.map(x => x.id));
    const p = projByName(t.list);
    if (p) touchProject(p);
    reindex();
    schedule();
    send('completeTask', id, next ? next.id : null);
    const nextId = next && next.id;
    const parts = [];
    if (res.reached.length) parts.push(`Milestone reached: ${res.reached.join(', ')}`);
    if (res.unblocked.length) parts.push(`Unblocked: ${res.unblocked.join(', ')}`);
    if (next) parts.push(`next one ${relLower(next.due)}`);
    snack(parts.length ? parts.join(' · ') : 'Task completed', 'Undo', () => uncomplete(id, nextId));
  };
  if (rowEl && !matchMedia('(prefers-reduced-motion: reduce)').matches) { rowEl.classList.add('completing'); setTimeout(finish, 260); }
  else finish();
}

function unarch(x) { Object.assign(x, { archived: false, archType: '', completed: '', status: x.status === 'Done' ? 'Not started' : x.status, updated: nowStamp() }); }
// Mirrors restoreTask in Code.gs (plus reopening a reached milestone).
function restoreLocal(t) {
  const was = t.archType, stamp = t.completed;
  unarch(t);
  const p = t.parent && byId.get(t.parent);
  if (t.parent && !p) t.parent = '';
  else if (p && p.archType === 'Completed') unarch(p);
  else if (p && p.archived) t.parent = '';
  kidsOf(t.id).forEach(k => { if (k.archType === was && (was !== 'Completed' || k.completed === stamp)) unarch(k); });
  [t, ...kidsOf(t.id)].forEach(x => { const m = x.milestone && msById(x.milestone); if (m && m.done && !x.archived) m.done = ''; });
}
function dropLocal(ids) {
  S.tasks = S.tasks.filter(t => !ids.has(t.id) && !(ids.has(t.parent) && t.archType === 'Deleted'));
  S.tasks.forEach(t => { if (ids.has(t.parent)) t.parent = ''; });
  reindex();
}
function uncomplete(id, spawnedId) {
  const t = byId.get(id);
  if (!t) return;
  if (t.archType === 'Completed') { restoreLocal(t); send('restoreTask', id); }
  if (spawnedId && byId.has(spawnedId)) { dropLocal(new Set([spawnedId])); send('purgeTask', spawnedId); }
  reindex();
  schedule();
}
function trash(id) {
  const t = byId.get(id);

  if (S.taskId && affected.some(a => a.id === S.taskId)) closePanel();
  affected.forEach(x => Object.assign(x, { archived: true, archType: 'Deleted' }));
  reindex();
  const res = afterFinishedLocal(affected.map(a => a.id));
  schedule();
  send('deleteTask', id);
  const msg = affected.length > 1 ? `Moved to trash with ${plural(affected.length - 1, 'subtask')}` : 'Moved to trash';
  snack(res.unblocked.length ? `${msg} · Unblocked: ${res.unblocked.join(', ')}` : msg, 'Undo', () => untrash(id));
}
function untrash(id) {

}

// Keyboard and panel "move up / down": swaps with the neighbour in the same group.
function moveBy(id, dir) {
  const t = byId.get(id);
  if (!t || t.archived) return;
  const top = isTop(t);
  const sib = S.tasks.filter(x => !x.archived && x.list === t.list && (top ? isTop(x) && x.milestone === t.milestone : x.parent === t.parent)).sort(SORTS.my);
  const i = sib.indexOf(t), j = i + dir;
  if (j < 0 || j >= sib.length) return;
  [sib[i], sib[j]] = [sib[j], sib[i]];
  sib.forEach((x, n) => { x.order = n; });
  schedule();
  send('reorderTasks', t.list, top ? '' : t.parent, sib.map(x => x.id));
}

/* ----- blocking ----- */
function blockLocal(target, spec, kind) {
  const now = nowStamp(), made = [];
  const p = kind === 'project' ? target : null;
  const list = p ? p.name : target.list;
  const milestone = p ? spec.milestone : target.milestone;
  const baseOrder = p ? Math.min(0, ...siblingOrders(list, '')) - 1 : target.order;
  spec.create.forEach((c, n) => {
    const t = {
      id: c.id, title: c.title, desc: '', due: '', time: '', status: 'Not started', priority: p ? 'High' : target.priority, list, starred: false, parent: '',
      order: baseOrder - (spec.create.length - n) * 0.01, repeat: '', created: now, completed: '', archived: false, archType: '', synced: false,
      milestone, plan: '', size: 1, blockedBy: [], blockReason: '', blockedSince: '', waiting: '', waitingSince: '', blockLog: [], updated: now,
    };
    S.tasks.push(t);
    S.fresh.add(t.id);
    made.push(t.id);
  });
  reindex();
  const blockers = [...new Set(spec.blockers.concat(made))];
  const wasBlocked = p ? p.status === 'blocked' : target.status === 'Blocked';
  if (!wasBlocked) target.blockedSince = now;
  if (spec.waiting !== target.waiting) target.waitingSince = spec.waiting ? now : '';
  Object.assign(target, { blockReason: spec.reason, blockedBy: blockers, waiting: spec.waiting, updated: now });
  if (p) p.status = 'blocked'; else target.status = 'Blocked';
}
function blockTask(t, spec) {

}
function blockProject(p, spec) {

  send('blockProject', p.id, spec);

}
function unblock(kind, id) {

}
function arrived(kind, id) {

  } else {

  }

let rafPending = false, renderBlocked = false, composing = false;

}

const isTextField = el => el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && /^(text|search|)$/.test(el.type)));

function render() {
  if (composing) { renderBlocked = true; return; }
  const a = document.activeElement, sel = focusKey(a);
  let range = null;
  try { if (isTextField(a)) range = [a.selectionStart, a.selectionEnd]; } catch (e) {}
  const main = $('main'), top = main.scrollTop;
  $('drawer').innerHTML = `<div class="drawer-inner">${drawerHTML()}</div>`;
  renderTop();
  main.innerHTML = viewHTML();
  main.scrollTop = top;

    const n = document.querySelector(sel);
    if (n && n !== document.activeElement) {

  const mismatch = rep && SEV[sug] > SEV[rep];
  let fc = `<span class="sub">${esc(st.why)}</span>`;
  if (st.forecast && p.target) { const late = diffDays(p.target, st.forecast); fc = `<span class="sub ${late > 7 ? 'bad' : late > 0 ? 'warn' : 'good'}">Forecast ${fmtShort(st.forecast)}</span>`; }
  const ms = m ? (() => { const s = msStats(m), late = m.target && m.target < today; return `<span class="ms" style="--c:${COLOR_HEX[p.color]}">${ic('diamond')}${esc(m.name)}</span><span class="sub ${late ? 'bad' : ''}">${s.nd}/${s.n} tasks${m.target ? ` · ${late ? 'was due' : 'due'} ${relLower(m.target)}` : ''}</span>`; })()
    : `<span class="sub">${msOf(p).length ? 'All milestones reached' : 'No milestones yet'}</span>`;
  return `<div class="prow" role="row" data-act="project" data-id="${p.id}" data-key="prow:${p.id}" tabindex="0">
    <div class="pname">${dot(p.name)}<div>${esc(p.name)}<small>${PPRI[p.priority] || 'Medium'} priority</small></div></div>
    <div class="c-health">${p.status === 'blocked' ? `<span class="pill blocked">${ic('blocked')}Blocked</span>` : healthPill(rep)}${mismatch || (!rep && sug !== 'green') ? `<span class="sub ${sug === 'red' ? 'bad' : 'warn'}">Signals say ${HEALTH[sug]}</span>` : ''}</div>
    <div class="c-prog"><div class="bar" style="--c:${COLOR_HEX[p.color]}"><i style="width:${st.pct}%"></i></div><span class="sub mono">${st.pct}% · ${st.done}/${st.total} pts${st.addedPts ? ` · +${st.addedPts} new` : ''}</span></div>
    <div class="c-ms">${ms}</div>
    <div class="c-target"><span>${p.target ? fmtShort(p.target) : '—'}</span>${fc}</div>
    <div class="c-next">${na ? `<button type="button" class="na" data-act="task" data-id="${na.id}">${esc(na.title)}</button>` : st.open.length ? '<span class="sub warn">No next action</span>' : st.total ? '<span class="sub">Ready to close</span>' : '<span class="sub">Add the first task</span>'}</div>
  </div>`;
}

/* ----- My Day ----- */
function myDayHTML() {
  const today = todayISO(), live = S.tasks.filter(t => !t.archived);
  const overdue = live.filter(t => t.due && t.due < today).sort(SORTS.due);
  const dueToday = live.filter(t => t.due === today).sort(SORTS.due);
  const planned = live.filter(t => t.plan && t.plan <= today && !(t.due && t.due <= today)).sort(SORTS.due);
  const doneToday = S.tasks.filter(t => t.archType === 'Completed' && localDayOf(t.completed) === today).sort(byCompletedDesc);
  const sugg = openProjects().filter(p => p.status === 'active').map(p => ({ p, t: nextAction(p) })).filter(x => x.t && !inMyDay(x.t));
  const total = overdue.length + dueToday.length + planned.length + doneToday.length;
  const sec = (label, arr, hot) => arr.length ? `<div class="group-h ${hot ? 'hot' : ''}"><span class="gname">${label}</span><span class="gmeta">${arr.length}</span></div>${arr.map(t => taskRow(t, { showList: true, hidePlan: true, k: ':' + label })).join('')}` : '';
  return `<div class="wrap"><div class="cols">
    <section class="card">
      <div class="card-b" style="padding-top:14px"><div style="display:flex;align-items:center;gap:12px"><div class="bar" style="flex:1"><i style="width:${total ? Math.round(doneToday.length / total * 100) : 0}%"></i></div><span class="sub">${doneToday.length} of ${total} done</span></div></div>
      ${quickAdd('myday', { plan: today, list: S.defaultList }, 'Add a task for today')}
      ${sec('Overdue', overdue, true)}${sec('Due today', dueToday)}${sec('Planned for today', planned)}
      ${!overdue.length && !dueToday.length && !planned.length ? `<div class="empty">${doneToday.length ? 'All done for today.' : 'Nothing planned for today.'} Pull in a next action on the right.</div>` : ''}
      ${doneToggle('myday-done', doneToday, { showList: true })}<div style="height:8px"></div>
    </section>
    <div class="col">
      <section class="card"><div class="card-h">Next actions from your projects</div>
        <div>${sugg.length ? sugg.map(({ p, t }) => `<div class="orow"><div class="grow"><button type="button" class="link" data-act="task" data-id="${t.id}">${esc(t.title)}</button><div class="sub">${dot(p.name)} ${esc(p.name)}${t.due ? ' · due ' + relLower(t.due) : ''}</div></div>
          <button type="button" class="btn sm tonal" data-act="plan-today" data-id="${t.id}">${ic('sun')}Add</button></div>`).join('') : '<div class="empty">Every active project’s next action is already in My Day.</div>'}</div></section>
      <section class="card"><div class="card-h">Plan date vs. due date</div><div class="card-b small muted">
        <p style="margin:0 0 6px"><b style="color:var(--text)">Plan</b> is when you intend to work on a task. It puts the task in My Day and never turns red.</p>
        <p style="margin:0"><b style="color:var(--text)">Due</b> is a real deadline. It drives overdue warnings and project signals.</p></div></section>
    </div>
  </div></div>`;
}

/* ----- Upcoming ----- */
function upcomingHTML() {
  const today = todayISO(), live = S.tasks.filter(t => !t.archived);
  let html = '';
  const od = live.filter(t => t.due && t.due < today).sort(SORTS.due);
  if (od.length) html += `<section class="card"><div class="card-h" style="color:var(--red)">Overdue<span class="grow"></span><span class="note">${od.length}</span></div>${od.map(t => taskRow(t, { showList: true, k: ':od' })).join('')}<div style="height:8px"></div></section>`;
  for (let i = 0; i < 14; i++) {
    const d = addDays(today, i);
    const items = live.filter(t => t.due === d || (t.plan === d && t.due !== d)).sort(SORTS.due);
    const ms = S.milestones.filter(m => !m.done && m.target === d && proj(m.projectId) && isOpenProject(proj(m.projectId)));
    if (!items.length && !ms.length && i > 1) continue;
    html += `<section class="card"><div class="card-h" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)">${relDay(d)}<span class="note muted">${fmtShort(d)}</span></div>
      ${ms.map(m => { const p = proj(m.projectId); return `<div class="group-h" style="--c:${COLOR_HEX[p.color]};padding-top:6px">${ic('diamond')}<button type="button" class="link gname" data-act="project" data-id="${p.id}">Milestone: ${esc(m.name)}</button><span class="gmeta">${esc(p.name)}</span></div>`; }).join('')}
      ${quickAdd('day:' + d, { due: d, list: S.defaultList })}
      ${items.map(t => taskRow(t, { showList: true, hideDue: t.due === d, k: ':' + d })).join('')}<div style="height:8px"></div></section>`;
  }
  return `<div class="wrap narrow">${html}</div>`;
}

function starredHTML() {
  const items = S.tasks.filter(t => !t.archived && t.starred).sort(SORTS.due);
  return `<div class="wrap narrow"><section class="card" style="padding-top:8px">${quickAdd('starred', { starred: true, list: S.defaultList }, 'Add a starred task')}
    ${items.map(t => taskRow(t, { showList: true })).join('') || '<div class="empty">Star important tasks to see them here.</div>'}<div style="height:8px"></div></section></div>`;
}

function searchHTML() {
  const q = S.query.trim().toLowerCase();
  const hit = t => isLive(t) && (t.title.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.list.toLowerCase().includes(q) || (t.blockReason || '').toLowerCase().includes(q));
  const act = S.tasks.filter(t => !t.archived && hit(t)).sort(SORTS.due);
  const done = S.tasks.filter(t => t.archType === 'Completed' && hit(t)).sort(byCompletedDesc);
  const notes = S.notes.filter(n => (n.title + '\n' + n.body).toLowerCase().includes(q) && proj(n.projectId));
  return `<div class="wrap narrow">
    <section class="card"><div class="card-h">Tasks<span class="grow"></span><span class="note">${act.length + done.length}</span></div>
      ${act.map(t => taskRow(t, { showList: true, showParent: true })).join('')}${!act.length && !done.length ? '<div class="empty">No matching tasks.</div>' : ''}
      ${doneToggle('search-done', done, { showList: true })}<div style="height:8px"></div></section>
    ${notes.length ? `<section class="card"><div class="card-h">Notes</div><div class="card-b">${notes.map(n => `<button type="button" class="nmini" data-act="note" data-id="${n.id}"><span class="ntype ${n.type}">${n.type}</span>${highlight(n.title || 'Untitled', S.query.trim())}<small>${esc(proj(n.projectId).name)}</small></button>`).join('')}</div></section>` : ''}
  </div>`;
}

function trashHTML() {
  const items = S.tasks.filter(t => t.archType === 'Deleted').sort((a, b) => a.list.localeCompare(b.list) || a.title.localeCompare(b.title));
  return `<div class="wrap narrow"><section class="card"><div class="card-h">Deleted tasks stay here until you empty the trash<span class="grow"></span>
    <button class="text-btn danger" type="button" data-act="empty-trash" ${items.length ? '' : 'disabled'}>Empty trash</button></div>
    ${items.map(t => taskRow(t, { trash: true, showList: true })).join('') || '<div class="empty">Trash is empty.</div>'}<div style="height:8px"></div></section></div>`;
}

/* ----- Weekly review ----- */
function reviewHTML() {
  const open = openProjects(), live = S.tasks.filter(t => !t.archived);
  const waiting = [...live.filter(t => t.waiting).map(t => ({ kind: 'task', x: t, title: t.title, where: t.list })),
    ...S.projects.filter(p => p.waiting && isOpenProject(p)).map(p => ({ kind: 'project', x: p, title: `Project: ${p.name}`, where: p.name }))]
    .sort((a, b) => (a.x.waitingSince || '').localeCompare(b.x.waitingSince || ''));
  const noPlan = live.filter(t => isBlocked(t) && !hasPlan(t));
  const shelf = S.projects.filter(p => p.status === 'planned' || p.status === 'paused');
  const reviewed = open.filter(p => S.reviewed.has(p.id)).length;
  return `<div class="wrap" style="max-width:1040px">
    <div class="sub">About 10 minutes · ${reviewed} of ${open.length} projects reviewed${S.settings.reviewDay != null ? ` · your review day is ${WEEKDAYS[S.settings.reviewDay]}` : ''}</div>
    <div class="step"><span class="n">01</span><h2>Check each open project</h2></div>
    <p class="sub" style="margin:0">Read the signals, pick a health and write two sentences: what changed, what's next, what's in the way.</p>
    ${open.map(p => {
      const sig = signals(p), sug = suggested(p), na = nextAction(p), done = S.reviewed.has(p.id);
      return `<section class="card"><div class="rv-h">${dot(p.name)}<h3>${esc(p.name)}</h3>
          ${done ? '<span class="hp green"><i></i>Reviewed</span>' : `<span class="sub">Last update</span>${healthPill(reported(p))}<span class="sub">Signals</span>${healthPill(sug)}`}
          <button class="btn sm" type="button" data-act="project" data-id="${p.id}">Open</button></div>
        ${done ? '' : `<div class="rv-b"><div>
            ${sig.length ? sig.map(s => `<div class="sig ${s.lvl}"><span class="sev"></span><span>${s.task ? `<button type="button" class="link" data-act="task" data-id="${s.task}">${esc(s.text)}</button>` : esc(s.text)}</span></div>`).join('') : '<p class="sub">No signals. Everything looks on track.</p>'}
            <div class="sig info" style="border-top:1px solid var(--line)"><span class="sev"></span><span>Next action: ${na ? `<button type="button" class="link" data-act="task" data-id="${na.id}"><b>${esc(na.title)}</b></button>` : '<b style="color:var(--amber)">none. Add a task or unblock one.</b>'}</span></div>
          </div><div>${composerHTML(p, 'rv')}</div></div>`}
      </section>`;
    }).join('') || '<div class="empty">No open projects.</div>'}
    <div class="step"><span class="n">02</span><h2>Chase what you're waiting on</h2></div>
    <section class="card">${waiting.length ? waiting.map(({ kind, x, title, where }) => {
      const age = ageDays(x.waitingSince);
      return `<div class="orow"><div class="grow"><button type="button" class="link" data-act="${kind === 'project' ? 'project' : 'task'}" data-id="${x.id}">${esc(title)}</button><div class="sub ${age >= 5 ? 'warn' : ''}">Waiting on ${esc(x.waiting)} for ${plural(age, 'day')} · ${esc(where)}</div></div>
        <button class="btn sm" type="button" data-act="followed" data-kind="${kind}" data-id="${x.id}">I followed up</button><button class="btn sm tonal" type="button" data-act="arrived" data-kind="${kind}" data-id="${x.id}">It arrived</button></div>`;
    }).join('') : '<div class="empty">You’re not waiting on anyone.</div>'}</section>
    ${noPlan.length ? `<div class="step"><span class="n">03</span><h2>Give blocked tasks a plan</h2></div>
    <section class="card">${noPlan.map(t => `<div class="orow"><div class="grow"><button type="button" class="link" data-act="task" data-id="${t.id}">${esc(t.title)}</button><div class="sub">${esc(t.list)} · ${t.blockReason ? 'Blocked: ' + esc(t.blockReason) : 'Blocked with no reason recorded'}</div></div>
      <button class="btn sm warn" type="button" data-act="block" data-kind="task" data-id="${t.id}">Add a plan</button></div>`).join('')}</section>` : ''}
    <div class="step"><span class="n">${noPlan.length ? '04' : '03'}</span><h2>Decide on planned and paused projects</h2></div>
    <section class="card">${shelf.length ? shelf.map(p => `<div class="orow">${dot(p.name)}<div class="grow"><b>${esc(p.name)}</b><div class="sub">${PSTATUS[p.status]}${p.goal ? ' · ' + esc(p.goal) : ''}</div></div>
      ${open.length >= 5 ? '<span class="sub warn">You already have 5 open projects</span>' : ''}<button class="btn sm" type="button" data-act="pstatus" data-id="${p.id}" data-v="active">Start</button></div>`).join('') : '<div class="empty">Nothing planned or paused.</div>'}</section>
  </div>`;
}
function composerHTML(p, ctx) {
  const pick = S.uh[p.id] || suggested(p), key = `upd:${ctx}:${p.id}`;
  return `<div class="composer">
    <div class="hbtns"><span class="sub">Health</span>${['green', 'amber', 'red'].map(h => `<button type="button" class="hbtn ${h}" aria-pressed="${pick === h}" data-act="uh" data-id="${p.id}" data-h="${h}"><i></i>${HEALTH[h]}</button>`).join('')}</div>
    <textarea data-key="${key}" data-draft="${key}" rows="3" placeholder="What changed, what's next, what's in the way?" aria-label="Status update for ${esc(p.name)}">${esc(drafts.get(key) || '')}</textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="sub">Suggested from signals: ${HEALTH[suggested(p)]}</span>
      <button type="button" class="btn sm primary" data-act="post-update" data-id="${p.id}" data-ctx="${ctx}">Post update</button></div></div>`;
}

/* ----- Project page ----- */
function projectHTML(p) {
  if (!['overview', 'tasks', 'notes'].includes(S.tab)) S.tab = 'overview';
  const st = stats(p), today = todayISO();
  const statusPill = p.status === 'blocked' ? `<button type="button" class="pill blocked" data-act="status-menu" data-id="${p.id}">${ic('blocked')}Blocked${ic('chevron')}</button>`
    : `<button type="button" class="pill ${p.status === 'done' ? 'done' : ''}" data-act="status-menu" data-id="${p.id}">${PSTATUS[p.status]}${ic('chevron')}</button>`;
  const left = p.target ? diffDays(today, p.target) : null;
  const head = `<div class="phead" style="--c:${COLOR_HEX[p.color]}">
    <div class="ph-row">${dot(p.name)}${statusPill}${isOpenProject(p) ? healthPill(reported(p)) : ''}<span class="grow"></span>
      <button class="btn sm" type="button" data-act="edit-project" data-id="${p.id}">${ic('edit')}Edit</button></div>
    <div class="ph-meta">${p.start ? `<span>Started <b>${fmtShort(p.start)}</b></span>` : ''}${p.target ? `<span>Target <b>${fmtShort(p.target)}</b> (${left >= 0 ? `${plural(left, 'day')} left` : `${-left} days ago`})</span>` : '<span>No target date</span>'}
      <span>Priority <b>${PPRI[p.priority] || 'Medium'}</b></span><span><b>${st.pct}%</b> done</span>${p.closed ? `<span>Closed <b>${fmtShort(p.closed)}</b></span>` : ''}</div>
    <nav class="tabs" role="tablist">${[['overview', 'Overview', ''], ['tasks', 'Tasks', st.open.length], ['notes', 'Notes', notesOf(p).length]].map(([k, l, n]) => `<button type="button" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-v="${k}">${l}${n ? `<span class="count">${n}</span>` : ''}</button>`).join('')}</nav></div>`;
  return head + ({ overview: overviewHTML, tasks: projectTasksHTML, notes: notesHTML }[S.tab])(p);
}

function blockBoxHTML(kind, x) {
  const ob = x.blockedBy.map(id => byId.get(id)).filter(Boolean);
  const age = ageDays(x.blockedSince);
  return `<div class="blockbox"><div class="bh">${ic('blocked')}${kind === 'project' ? 'Project blocked' : 'Blocked'}<span class="muted">${x.blockedSince ? `· ${age ? `for ${plural(age, 'day')}` : 'since today'}` : ''}</span></div>
    <div class="reason">${x.blockReason ? esc(x.blockReason) : '<span class="muted">No reason recorded.</span>'}</div>
    ${hasPlan(x) ? `<div class="plan-h">Unblocks when these are done</div>
      ${ob.map(b => `<div class="bitem ${b.archived ? 'done' : ''}"><button type="button" class="check" data-act="toggle" data-id="${b.id}" aria-label="${b.archived ? 'Mark not complete' : 'Complete'}: ${esc(b.title)}">${ic('check')}</button><button type="button" class="link bt" data-act="task" data-id="${b.id}">${esc(b.title)}</button>${b.archType === 'Deleted' ? '<span class="sub">deleted</span>' : ''}</div>`).join('')}
      ${x.waiting ? `<div class="bitem">${ic('hourglass')}<span class="bt">Waiting on <b>${esc(x.waiting)}</b> · ${plural(ageDays(x.waitingSince), 'day')}</span>
        <button class="btn sm" type="button" data-act="followed" data-kind="${kind}" data-id="${x.id}">I followed up</button><button class="btn sm tonal" type="button" data-act="arrived" data-kind="${kind}" data-id="${x.id}">It arrived</button></div>` : ''}`
    : '<div class="noplan">No unblock plan yet. Add a task to do first, or who you’re waiting on.</div>'}
    <div class="bactions"><button class="btn sm ${hasPlan(x) ? '' : 'warn'}" type="button" data-act="block" data-kind="${kind}" data-id="${x.id}">${ic('edit')}${hasPlan(x) ? 'Edit block' : 'Add a plan'}</button>
      <button class="btn sm" type="button" data-act="unblock" data-kind="${kind}" data-id="${x.id}">${ic('unlock')}Unblock now</button></div></div>`;
}

function overviewHTML(p) {
  const st = stats(p), sig = signals(p), sug = suggested(p), rep = reported(p), na = nextAction(p), today = todayISO();
  const ms = msOf(p), ups = updatesOf(p);
  const pinned = notesOf(p).filter(n => n.pinned || n.type === 'decision').sort((a, b) => b.pinned - a.pinned || (b.updated || '').localeCompare(a.updated || ''));
  const late = st.forecast && p.target ? diffDays(p.target, st.forecast) : 0;
  const closing = sig.some(s => s.act === 'close');
  return `<div class="wrap"><div class="cols">
    <div class="col">
      ${p.status === 'blocked' ? blockBoxHTML('project', p) : ''}
      <section class="card"><div class="card-h">Done when<span class="grow"></span><button class="text-btn" type="button" data-act="edit-project" data-id="${p.id}">Edit</button></div>
        <div class="card-b">${p.goal ? `<p class="goal">${esc(p.goal)}</p>` : '<p class="goal empty-goal">Write one sentence that says when this project is finished. It keeps the scope honest.</p>'}
        ${p.outcome ? `<p class="small" style="color:var(--green);margin:10px 0 0">Outcome: ${esc(p.outcome)}</p>` : ''}</div></section>
      <section class="card"><div class="card-h">Milestones<span class="grow"></span><button class="text-btn" type="button" data-act="milestones" data-id="${p.id}">${ms.length ? 'Edit' : 'Add milestones'}</button></div>
        <div class="card-b">${ms.map(m => {
          const s = msStats(m), lateM = !m.done && m.target && m.target < today, cur = currentMs(p) === m;
          const when = m.done ? `Reached ${fmtShort(m.done)}` : !m.target ? 'No date' : lateM ? `${diffDays(m.target, today)} days late` : `Due ${relLower(m.target)}`;
          return `<div class="mrow ${m.done ? 'reached' : lateM ? 'late' : cur ? 'current' : ''}">${ic('diamond')}<div><div style="font-weight:${cur ? 600 : 500}">${esc(m.name)}</div><div class="sub">${s.nd}/${s.n} tasks${cur ? ' · current' : ''}</div></div>
            <div class="bar" style="--c:${m.done ? 'var(--green)' : COLOR_HEX[p.color]}"><i style="width:${s.pct}%"></i></div><div class="when">${when}</div></div>`;
        }).join('') || '<p class="sub" style="margin:0">Milestones are the phases of the project, each with a date. Tasks belong to one, and a milestone is reached when its last task is done.</p>'}</div></section>
      <section class="card"><div class="card-h">Status updates</div><div class="card-b">${isOpenProject(p) ? composerHTML(p, 'ov') : ''}
        ${ups.map(u => `<div class="upd"><div class="uh">${healthPill(u.health)}<span>${fmtDay(u.date)}</span>${u.progress !== '' && u.progress != null ? `<span class="mono">${u.progress}%</span>` : ''}</div><p>${esc(u.text)}</p></div>`).join('') || '<p class="sub">No updates yet. A short weekly update is what makes the health on Home trustworthy.</p>'}</div></section>
    </div>
    <div class="col">
      <section class="card"><div class="card-h">Progress</div><div class="card-b">
        <div style="display:flex;align-items:baseline;gap:10px"><span class="big">${st.pct}%</span><span class="sub mono">${st.done} of ${st.total} points</span></div>
        <div class="burn">${burnupSVG(p, st)}</div>
        ${st.total ? `<div class="legend"><span><i style="background:var(--chart-scope)"></i>Total scope</span><span><i style="background:${COLOR_HEX[p.color]}"></i>Done</span>${st.forecast ? '<span><i style="background:var(--amber)"></i>Forecast</span>' : ''}</div>` : ''}
        <dl class="kv"><dt>Done in the last 7 days</dt><dd>+${st.doneWeek} pts</dd>
          <dt>Scope added this week</dt><dd class="${st.addedPts ? 'warn' : ''}">${st.addedPts ? `+${st.addedPts} pts (${plural(st.added, 'task')})` : 'None'}</dd>
          <dt>Forecast finish</dt><dd class="${late > 7 ? 'bad' : late > 0 ? 'warn' : st.forecast ? 'good' : ''}">${st.forecast ? `${fmtShort(st.forecast)}${p.target ? (late > 0 ? ` · ${late}d late` : ' · on time') : ''}` : esc(st.why)}</dd></dl>
        <p class="sub" style="margin:10px 0 0">Points: S = 1, M = 2, L = 3. Set a task's size in its details.</p></div></section>

function burnupSVG(p, st) {
  const ts = tasksIn(p.name), today = todayISO();
  if (!p.start || !ts.length || p.start > today) return '';
  const end = maxOf([p.target, st.forecast, today]);
  const n = Math.max(1, diffDays(p.start, end));
  const W = 340, H = 140, L = 6, R = 6, Tp = 12, B = 22;
  const created = ts.map(t => [localDayOf(t.created) || p.start, pts(t)]);
  const completed = ts.filter(t => t.archType === 'Completed').map(t => [localDayOf(t.completed), pts(t)]);
  const upTo = (arr, d) => sum(arr.filter(([x]) => x <= d), x => x[1]);
  const days = diffDays(p.start, today);
  const total = Math.max(1, st.total, upTo(created, today));
  const X = d => L + Math.max(0, diffDays(p.start, d)) / n * (W - L - R);
  const Y = v => Tp + (1 - v / total) * (H - Tp - B);
  let scope = '', done = '';
  const step = Math.max(1, Math.ceil(days / 120));
  for (let i = 0; i <= days; i += step) {
    const d = addDays(p.start, Math.min(i, days));
    scope += `${i ? 'L' : 'M'}${X(d).toFixed(1)},${Y(upTo(created, d)).toFixed(1)}`;
    done += `${i ? 'L' : 'M'}${X(d).toFixed(1)},${Y(upTo(completed, d)).toFixed(1)}`;
  }
  scope += `L${X(today).toFixed(1)},${Y(upTo(created, today)).toFixed(1)}`;
  done += `L${X(today).toFixed(1)},${Y(st.done).toFixed(1)}`;
  const xt = X(today), xg = p.target && p.target >= p.start ? X(p.target) : null, col = COLOR_HEX[p.color];
  const labels = [`<text class="ax" x="${L}" y="${H - 6}">${fmtShort(p.start)}</text>`];
  if (xg !== null) labels.push(`<text class="ax" x="${Math.min(xg, W - R)}" y="${H - 6}" text-anchor="end">Target ${fmtShort(p.target)}</text>`);
  if (xg === null || Math.abs(xt - xg) > 90) labels.push(`<text class="ax" x="${Math.min(xt, W - 30)}" y="${H - 6}" text-anchor="middle" style="fill:var(--text-2)">Today</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Burn-up chart: ${st.done} of ${st.total} points done">
    <line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)" stroke-width="1"/>
    ${xg !== null ? `<line x1="${xg}" x2="${xg}" y1="${Tp - 4}" y2="${Y(0)}" stroke="var(--text-3)" stroke-dasharray="3 3"/>` : ''}
    <line x1="${xt}" x2="${xt}" y1="${Tp - 4}" y2="${Y(0)}" stroke="var(--accent)" stroke-opacity=".45"/>
    <path d="${scope}" fill="none" stroke="var(--chart-scope)" stroke-width="2"/>
    <path d="${done}" fill="none" stroke="${col}" stroke-width="2.5"/>
    ${st.forecast ? `<line x1="${xt}" y1="${Y(st.done)}" x2="${X(st.forecast)}" y2="${Y(st.total)}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="${X(st.forecast)}" cy="${Y(st.total)}" r="3" fill="var(--amber)"/>` : ''}
    <circle cx="${xt}" cy="${Y(st.done)}" r="3.5" fill="${col}"/>${labels.join('')}</svg>`;
}

const saveTimers = new Map();
function saveSoon(id, field, value) {
  const k = id + ':' + field, prev = saveTimers.get(k);
  if (prev) clearTimeout(prev.timer);
  const run = () => { saveTimers.delete(k); patch(id, { [field]: value }); };
  saveTimers.set(k, { timer: setTimeout(run, 600), run });
}
function flushSaves() {
  [...saveTimers.values()].forEach(v => { clearTimeout(v.timer); v.run(); });
  [...noteTimers.keys()].forEach(flushNote);
}

let panelReturnFocus = null;
function openPanel(id) {
  if (!byId.get(id)) return;
  flushSaves();
  if (!S.taskId && !S.draft) panelReturnFocus = document.activeElement;
  S.taskId = id;
  S.draft = null;
  renderNow();
  if (!isNarrow()) requestAnimationFrame(() => {
    const ta = $('panel').querySelector('.pn-title');
    if (!ta) return;
    ta.focus({ preventScroll: true });
    autogrow(ta);
    ta.scrollTop = 0;
    $('panel').querySelector('.pn-b').scrollTop = 0;
  });
}
function openNew() {
  flushSaves();
  let list = S.defaultList, milestone;
  if (S.view === 'project' && proj(S.id) && proj(S.id).status !== 'done') { list = proj(S.id).name; milestone = (currentMs(proj(S.id)) || {}).id || ''; }
  if (S.view === 'list' && listByName(S.id)) list = S.id;
  if (!S.taskId && !S.draft) panelReturnFocus = document.activeElement;
  S.taskId = null;
  S.draft = { id: '', title: '', desc: '', due: '', time: '', plan: S.view === 'myday' ? todayISO() : '', priority: 'Medium', list, milestone: milestone || '', starred: S.view === 'starred', repeat: '', size: 1, status: 'Not started' };
  renderNow();
  requestAnimationFrame(() => { const ta = $('panel').querySelector('.pn-title'); if (ta) ta.focus(); });
}
function closePanel() {
  if (!S.taskId && !S.draft) return;
  flushSaves();
  S.taskId = null;
  S.draft = null;
  renderNow();
  const f = panelReturnFocus;
  panelReturnFocus = null;
  if (f && f.isConnected) f.focus({ preventScroll: true });
}
const isNarrow = () => matchMedia('(max-width: 900px)').matches;

function renderPanel() {
  const pnl = $('panel'), app = $('app');
  let t = S.draft || (S.taskId && byId.get(S.taskId));
  if (t && !S.draft && t.archType === 'Deleted') { S.taskId = null; t = null; }
  if (!t) {
    pnl.classList.remove('open');
    pnl.setAttribute('aria-hidden', 'true');
    app.classList.remove('panel-open');
    pnl.innerHTML = '';
    return;
  }
  const sc = pnl.querySelector('.pn-b'), top = sc ? sc.scrollTop : 0;
  pnl.innerHTML = panelHTML(t, !!S.draft);
  pnl.classList.add('open');
  pnl.removeAttribute('aria-hidden');
  app.classList.add('panel-open');
  const sc2 = pnl.querySelector('.pn-b');
  if (sc2) sc2.scrollTop = top;
}

    foot = `<span class="meta" title="${esc(meta)}">${esc(meta)}</span>${done ? `<button class="btn tonal" type="button" data-act="toggle" data-id="${t.id}">${ic('restore')}Mark not complete</button>`
      : `<button class="btn tonal" type="button" data-act="toggle" data-id="${t.id}">${ic('check')}Complete</button>`}`;
  }
  return `${head}<div class="pn-b">${body}</div><div class="pn-f">${foot}</div>`;
}

    if (f === 'starred') v = v === true || v === 'true';
    d[f] = v;

let menuReturn = null, menuItems = [];
function openMenu(items, anchor) {
  closeMenu(false);
  menuReturn = anchor;
  menuItems = items.filter(Boolean);
  const layer = $('layer');
  const html = menuItems.map((it, i) => {
    if (it === '-') return '<hr>';
    if (it.header) return `<div class="menu-h">${esc(it.header)}</div>`;
    return `<button type="button" class="menu-i ${it.danger ? 'danger' : ''} ${it.on ? 'on' : ''}" data-mi="${i}" ${it.disabled ? 'disabled' : ''} ${it.color ? `style="--c:${it.color}"` : ''}>
      ${it.color ? '<span class="cdot"></span>' : it.icon ? ic(it.icon) : '<span class="sp"></span>'}<span class="l">${esc(it.label)}</span></button>`;
  }).join('');
  layer.insertAdjacentHTML('beforeend', `<div class="menu-scrim"></div><div class="menu" role="menu">${html}</div>`);
  const menu = layer.querySelector('.menu'), r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8));
  if (r.right - mw < 8) left = Math.max(8, Math.min(r.left, innerWidth - mw - 8));
  let top = r.bottom + 4;
  if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  layer.querySelector('.menu-scrim').addEventListener('click', () => closeMenu());
  menu.addEventListener('click', e => {
    const b = e.target.closest('[data-mi]');
    if (!b) return;
    const it = menuItems[Number(b.dataset.mi)];
    closeMenu(false);
    it.action();
  });
  menu.addEventListener('keydown', e => {
    const btns = [...menu.querySelectorAll('.menu-i:not([disabled])')], i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); btns[(i + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length].focus(); }
    else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); closeMenu(); }
  });
  const first = menu.querySelector('.menu-i:not([disabled])');
  if (first) first.focus();
}
function closeMenu(refocus = true) {
  const layer = $('layer'), had = layer.querySelector('.menu');
  layer.querySelectorAll('.menu, .menu-scrim').forEach(n => n.remove());
  if (had && refocus && menuReturn && menuReturn.isConnected) menuReturn.focus({ preventScroll: true });
}

// Generic modal. `actions`: [{ label, value, primary, danger, left }]. `onAction(value, box)` may return false to keep it open.
function openDialog({ title, body, actions, wide, onMount, onAction }) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const scrim = document.createElement('div');
    scrim.className = 'dlg-scrim';
    scrim.innerHTML = `<div class="dlg ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><h2 id="dlgTitle">${esc(title)}</h2>${body}
      <div class="dlg-actions">${actions.map((a, i) => `<button type="button" class="btn ${a.primary ? (a.danger ? 'danger' : 'primary') : a.danger ? 'danger' : ''} ${a.left ? 'left' : ''}" data-ai="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
    const box = scrim.firstElementChild;
    const finish = v => {
      if (v !== null && onAction && onAction(v, box) === false) return;
      scrim.remove();
      document.removeEventListener('keydown', onKey, true);
      if (prev && prev.isConnected) prev.focus({ preventScroll: true });
      resolve(v);
    };
    const primary = actions.find(a => a.primary);
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(null); }
      else if (e.key === 'Enter' && primary && e.target.tagName === 'INPUT' && !['checkbox', 'date'].includes(e.target.type) && !e.target.dataset.enter) { e.preventDefault(); finish(primary.value); }
      else if (e.key === 'Tab') {
        const f = [...box.querySelectorAll('button:not([disabled]), input, select, textarea, a[href]')];
        if (!f.length) return;
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    };
    box.addEventListener('click', e => { const b = e.target.closest('[data-ai]'); if (b) finish(actions[Number(b.dataset.ai)].value); });
    scrim.addEventListener('mousedown', e => { if (e.target === scrim) finish(null); });
    document.addEventListener('keydown', onKey, true);
    $('layer').append(scrim);
    if (onMount) onMount(box);
    const first = box.querySelector('[autofocus]') || box.querySelector('input:not([type=checkbox]), textarea, select') || box.querySelector('.btn.primary, .btn.danger');
    if (first) { first.focus(); if (first.select && first.tagName === 'INPUT') first.select(); }
  });
}

async function milestonesDlg(p) {
  const rows = msOf(p).map(m => ({ id: m.id, name: m.name, target: m.target, done: m.done, orig: m }));
  const rowHTML = (r, i) => `<div class="mline ${r.done ? 'reached' : ''}" data-row="${i}">
    <div class="ord"><button type="button" data-mv="-1" aria-label="Move up">${ic('up')}</button><button type="button" data-mv="1" aria-label="Move down">${ic('down')}</button></div>
    <input class="input" data-mn value="${esc(r.name)}" placeholder="Milestone name" aria-label="Milestone name" maxlength="120" data-enter="1">
    <input class="input" type="date" data-mt value="${esc(r.target)}" aria-label="Target date">
    <button type="button" class="icon-btn" data-mdel aria-label="Delete milestone" title="Delete milestone">${ic('trash')}</button></div>`;
  const read = box => box.querySelectorAll('.mline').forEach((el, i) => { rows[i].name = el.querySelector('[data-mn]').value; rows[i].target = el.querySelector('[data-mt]').value; });
  const draw = box => { box.querySelector('.mlist').innerHTML = rows.map(rowHTML).join('') || '<p class="sub" style="margin:0">No milestones yet.</p>'; };
  const v = await openDialog({
    title: `Milestones · ${p.name}`, wide: true,
    actions: [{ label: 'Cancel', value: null }, { label: 'Save', primary: true, value: 'ok' }],
    body: `<p class="dlg-hint" style="margin-top:4px">Milestones are the phases of the project, in order. Each one is reached when its last task is done.</p>
      <div class="dlg-body"><div class="mlist"></div><button type="button" class="btn sm" data-madd style="align-self:flex-start">${ic('add')}Add milestone</button><div class="dlg-err" id="mErr"></div></div>`,
    onMount: box => {
      draw(box);
      if (!rows.length) { rows.push({ id: newId('m'), name: '', target: '', done: '' }); draw(box); }
      box.addEventListener('click', e => {
        const line = e.target.closest('.mline');
        if (e.target.closest('[data-madd]')) { read(box); rows.push({ id: newId('m'), name: '', target: '', done: '' }); draw(box); box.querySelector('.mline:last-child [data-mn]').focus(); }
        else if (line && e.target.closest('[data-mdel]')) { read(box); rows.splice(Number(line.dataset.row), 1); draw(box); }
        else if (line && e.target.closest('[data-mv]')) {
          read(box);
          const i = Number(line.dataset.row), j = i + Number(e.target.closest('[data-mv]').dataset.mv);
          if (j >= 0 && j < rows.length) { [rows[i], rows[j]] = [rows[j], rows[i]]; draw(box); }
        }
      });
    },
    onAction: (val, box) => {
      if (val !== 'ok') return;
      read(box);
      const keep = rows.filter(r => r.name.trim());
      const bad = keep.find(r => r.target && !/^\d{4}-\d{2}-\d{2}$/.test(r.target));
      if (bad) { box.querySelector('#mErr').textContent = 'One of the dates isn’t valid.'; return false; }
    },
  });
  if (v !== 'ok') return;
  const keep = rows.filter(r => r.name.trim());
  const keepIds = new Set(keep.map(r => r.id));
  msOf(p).filter(m => !keepIds.has(m.id)).forEach(deleteMilestoneLocal);
  keep.forEach((r, i) => {
    const name = r.name.trim().slice(0, 120);
    if (r.orig) {
      const f = {};
      if (r.orig.name !== name) f.name = name;
      if (r.orig.target !== r.target) f.target = r.target;
      if (r.orig.order !== i) f.order = i;
      if (Object.keys(f).length) saveMilestoneLocal(r.orig, f, false);
    } else saveMilestoneLocal({ id: r.id, projectId: p.id, name, target: r.target, done: '', order: i, eventId: '' }, {}, true);
  });
  touchProject(p);
  schedule();
}

// Asks why it's blocked and what will unblock it. Works for a task or a whole project.
async function blockDlg(kind, id) {
  const x = kind === 'project' ? proj(id) : byId.get(id);
  if (!x) return;
  const list = kind === 'project' ? x.name : x.list;
  const editing = kind === 'project' ? x.status === 'blocked' : x.status === 'Blocked';
  const exclude = new Set(kind === 'task' ? [x.id, ...kidsOf(x.id).map(k => k.id)] : []);
  const candidates = S.tasks.filter(t => !t.archived && t.list === list && !exclude.has(t.id) && !(kind === 'task' && t.blockedBy.includes(x.id))).sort(SORTS.my).slice(0, 60);
  const checked = new Set(x.blockedBy);
  const name = kind === 'project' ? `“${x.name}”` : `“${x.title}”`;
  let spec = null;
  const v = await openDialog({
    title: editing ? 'Edit block' : (kind === 'project' ? 'Mark project as blocked' : 'Mark task as blocked'), wide: true,
    actions: [{ label: 'Cancel', value: null }, { label: editing ? 'Save' : 'Mark blocked', primary: true, danger: true, value: 'ok' }],
    body: `<p style="margin-top:2px">${esc(name)}</p><div class="dlg-body">
      <div class="dlg-label">Why is it blocked?</div>
      <textarea id="bReason" rows="2" maxlength="500" placeholder="e.g. IT hasn’t given us Shared Drive access" aria-label="Why is it blocked?" autofocus>${esc(x.blockReason || '')}</textarea>
      <div class="dlg-label" style="margin-top:4px">What will unblock it?</div>
      <div class="opt"><div class="opt-h">${ic('addCircle')}Something I need to do first</div>
        <div class="sub" style="margin-top:-4px">Each line becomes a task${kind === 'project' ? ' at the top of the project' : ' right above this one'}. When they're done, it unblocks by itself.</div>
        <div id="bNew" style="display:flex;flex-direction:column;gap:6px"><input class="input" data-new placeholder="e.g. Email IT with the access request" aria-label="Task to do first" maxlength="500" data-enter="1"></div>
        <button type="button" class="text-btn" id="bAdd" style="align-self:flex-start">+ Another task</button></div>
      ${candidates.length ? `<div class="opt"><div class="opt-h">${ic('subArrow')}Another task that has to finish first</div>
        <div class="picks">${candidates.map(t => `<label class="pick"><input type="checkbox" value="${t.id}" ${checked.has(t.id) ? 'checked' : ''}><span>${esc(t.title)}</span>${isBlocked(t) ? '<span class="sub bad">blocked</span>' : ''}</label>`).join('')}</div></div>` : ''}
      <div class="opt"><div class="opt-h">${ic('hourglass')}Waiting on a person or team</div>
        <input class="input" id="bWait" value="${esc(x.waiting || '')}" placeholder="e.g. IT helpdesk" aria-label="Waiting on" maxlength="100" data-enter="1">
        <div class="sub">The app counts the days and flags it after 5. Click “It arrived” when it does.</div></div>
      <div class="dlg-err" id="bErr"></div></div>`,
    onMount: box => {
      box.querySelector('#bAdd').addEventListener('click', () => {
        const inp = document.createElement('input');
        Object.assign(inp, { className: 'input', placeholder: 'Another task to do first', maxLength: 500 });
        inp.dataset.new = '1';
        inp.dataset.enter = '1';
        box.querySelector('#bNew').append(inp);
        inp.focus();
      });
    },
    onAction: (val, box) => {
      if (val !== 'ok') return;
      const reason = box.querySelector('#bReason').value.trim();
      const err = box.querySelector('#bErr');
      if (!reason) { err.textContent = 'Write a short reason. It’s what you’ll see in the weekly review.'; box.querySelector('#bReason').focus(); return false; }
      const create = [...box.querySelectorAll('[data-new]')].map(i => i.value.replace(/\s+/g, ' ').trim()).filter(Boolean).slice(0, 10).map(title => ({ id: newId(), title }));
      const blockers = [...box.querySelectorAll('.picks input:checked')].map(i => i.value);

        err.textContent = 'There’s no unblock plan yet. You can save anyway and add one later. Click again to save.';
        return false;
      }
      spec = { reason, create, blockers, waiting, milestone: kind === 'project' ? ((currentMs(x) || {}).id || '') : '' };
    },
  });
  if (v !== 'ok' || !spec) return;
  if (kind === 'project') blockProject(x, spec); else blockTask(x, spec);
}

function shortcutsDlg() {
  const rows = [['/', 'Search'], ['c', 'Create task'], ['n', 'Quick-add on this page'], ['j k', 'Next / previous task'], ['Enter', 'Open task details'],
    ['x', 'Complete task'], ['s', 'Star / unstar'], ['b', 'Mark blocked…'], ['Del', 'Move to trash'], ['Alt ↑ ↓', 'Move task up / down'],
    ['1–6', 'Home · My Day · Upcoming · Starred · Review · Trash'], ['m', 'Show / hide menu'], ['Esc', 'Close panel or menu']];
  openDialog({
    title: 'Keyboard shortcuts', actions: [{ label: 'Close', primary: true, value: true }],
    body: `<div class="keys">${rows.map(([k, d]) => `<div>${k.split(' ').filter(Boolean).map(x => `<kbd>${esc(x)}</kbd>`).join('')}</div><div>${esc(d)}</div>`).join('')}</div>
      <p style="margin-top:14px">Quick-add understands:</p>
      <p style="font-size:13px;line-height:2"><kbd>tomorrow 3pm</kbd> <kbd>fri</kbd> <kbd>oct 5</kbd> <kbd>in 2 weeks</kbd> <kbd>every monday</kbd> <kbd>!high</kbd> <kbd>#Project</kbd> <kbd>^Milestone</kbd> <kbd>~L</kbd> <kbd>*</kbd></p>`,
  });
}

let snackTimer;
function snack(text, action, onAction) {
  const bar = $('snack'), btn = $('snackAction');
  $('snackText').textContent = text;
  btn.hidden = !action;
  if (action) { btn.textContent = action; btn.onclick = () => { hideSnack(); onAction(); }; }
  bar.classList.add('show');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(hideSnack, action ? 6500 : 3500);
}
const hideSnack = () => $('snack').classList.remove('show');

/* ======================================================================
 * Navigation
 * ==================================================================== */
function setView(v, id) {
  if (v !== 'search' && S.query) { S.query = ''; $('search').value = ''; $('topbar').classList.remove('searching'); }
  S.view = v;
  S.id = id === undefined ? null : id;
  if (v !== 'search') { prefs.view = v; prefs.id = S.id; savePrefs(); }
  if (isNarrow()) closeDrawer();
  renderNow();
  $('main').scrollTop = 0;
}
function openProject(id, tab) {
  if (!proj(id)) return;
  if (!(S.view === 'project' && S.id === id)) { S.tab = tab || 'overview'; S.noteId = null; S.noteFilter = 'all'; }
  else if (tab) S.tab = tab;
  setView('project', id);
}
function openList(name) { setView('list', name); }
function toggleDrawer() {
  if (isNarrow()) { $('app').classList.toggle('drawer-open'); return; }
  prefs.drawer = !prefs.drawer;
  savePrefs();
  renderTop();
}
const closeDrawer = () => $('app').classList.remove('drawer-open');

/* ======================================================================
 * Events
 * ==================================================================== */
const ACT = {
  view: el => setView(el.dataset.v),
  project: el => openProject(el.dataset.id, el.dataset.tab),
  list: el => openList(el.dataset.name),
  tab: el => { S.tab = el.dataset.v; renderNow(); },
  task: el => openPanel(el.dataset.id),
  toggle: el => { const t = byId.get(el.dataset.id); if (!t) return; t.archType === 'Completed' ? uncomplete(t.id) : complete(t.id, el.closest('.task')); },
  star: el => { const t = byId.get(el.dataset.id); if (t) patch(t.id, { starred: !t.starred }); },
  create: () => { openNew(); if (isNarrow()) closeDrawer(); },
  drawer: () => toggleDrawer(),
  retry: () => { S.error = null; boot(); },
  refresh: async () => { const b = $('btnRefresh'); b.classList.add('spin'); flushSaves(); await Q.chain; await boot(true); b.classList.remove('spin'); },
  sync: () => sync(),
  settings: () => settingsDlg(),
  shortcuts: () => shortcutsDlg(),
  'toggle-other': () => { prefs.showOther = !prefs.showOther; savePrefs(); renderNow(); },
  'new-project': () => newProject(),
  'new-list': () => newList(),
  'list-menu': el => { const l = listByName(el.dataset.name); if (l) listMenu(l, el); },
  'status-menu': el => { const p = proj(el.dataset.id); if (p) statusMenu(p, el); },
  'edit-project': el => { const p = proj(el.dataset.id); if (p) editProject(p); },
  pstatus: el => { const p = proj(el.dataset.id); if (p) setProjectStatus(p, el.dataset.v); },
  milestones: el => { const p = proj(el.dataset.id); if (p) milestonesDlg(p); },
  block: el => blockDlg(el.dataset.kind, el.dataset.id),
  unblock: el => unblock(el.dataset.kind, el.dataset.id),
  arrived: el => arrived(el.dataset.kind, el.dataset.id),
  followed: el => followedUp(el.dataset.kind, el.dataset.id),
  uh: el => { S.uh[el.dataset.id] = el.dataset.h; renderNow(); },
  'post-update': el => { const p = proj(el.dataset.id); if (p) postUpdate(p, el.dataset.ctx); },
  'close-project': el => { const p = proj(el.dataset.id); if (p) closeProject(p); },
  'plan-today': el => { const t = byId.get(el.dataset.id); if (t) { patch(t.id, { plan: todayISO() }); snack(`Added to My Day: ${t.title}`); } },
  note: el => { const n = S.notes.find(x => x.id === el.dataset.id); if (!n) return; openProject(n.projectId, 'notes'); S.noteId = n.id; S.noteFilter = 'all'; renderNow(); },
  nfilter: el => { S.noteFilter = el.dataset.v; S.noteId = null; renderNow(); },
  pin: el => { const n = S.notes.find(x => x.id === el.dataset.id); if (n) { n.pinned = !n.pinned; send('saveNote', { id: n.id, pinned: n.pinned }); renderNow(); } },
  'new-note': el => { const p = proj(el.dataset.id); if (p) newNote(p, el.dataset.v); },
  'delete-note': el => { const n = S.notes.find(x => x.id === el.dataset.id); if (n) deleteNote(n); },
  'note-task': el => { const n = S.notes.find(x => x.id === el.dataset.id); if (n) noteToTask(n, Number(el.dataset.i)); },
  'show-done': el => { const k = el.dataset.v; prefs.open[k] = !prefs.open[k]; savePrefs(); renderNow(); },
  'close-panel': () => closePanel(),
  'submit-new': () => submitNew(),
  set: el => setField(el.dataset.f, el.dataset.v),
  move: el => { if (S.taskId) moveBy(S.taskId, Number(el.dataset.v)); },
  'trash-task': el => trash(el.dataset.id),
  untrash: el => untrash(el.dataset.id),
  purge: el => purge(el.dataset.id),
  'empty-trash': () => emptyTrash(),
};
document.addEventListener('click', e => {
  if (e.target.closest('#layer')) return;
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.noteType) {
    const n = S.notes.find(x => x.id === el.dataset.noteType);
    if (n) { n.type = el.value; send('saveNote', { id: n.id, type: n.type }); renderNow(); }
    return;
  }
  const f = el.dataset.f;
  if (!f || !$('panel').contains(el) || f === 'title' || f === 'desc') return;
  setField(f, el.value);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.qa) {
    const key = el.dataset.key.slice(3), defaults = JSON.parse(el.dataset.defaults || '{}');
    if (el.value) drafts.set(key, el.value); else drafts.delete(key);
    const pv = document.querySelector(`[data-preview="${CSS.escape(key)}"]`);
    if (pv) pv.innerHTML = el.value.trim() ? previewChips(quickFields(el.value, defaults), defaults) : '';
    return;
  }
  if (el.dataset.draft) { drafts.set(el.dataset.draft, el.value); return; }
  if (el.dataset.subadd) { drafts.set('sub:' + el.dataset.subadd, el.value); return; }
  if (el.dataset.note) {
    const n = S.notes.find(x => x.id === el.dataset.note);
    if (!n) return;
    saveNoteSoon(n, { [el.dataset.nf]: el.value });
    if (el.dataset.nf === 'title') { const nl = $('nlist'); const p = proj(n.projectId); if (nl && p) nl.innerHTML = noteListHTML(notesOf(p).filter(x => S.noteFilter === 'all' || x.type === S.noteFilter).sort((a, b) => b.pinned - a.pinned || (b.updated || '').localeCompare(a.updated || ''))); }
    else { const ai = $('ai'); if (ai) ai.innerHTML = aiHTML(n); }
    return;
  }
  const f = el.dataset.f;
  if ((f === 'title' || f === 'desc') && $('panel').contains(el)) {
    autogrow(el);
    const v = f === 'title' ? el.value.replace(/\n/g, ' ') : el.value;
    if (S.draft) {
      S.draft[f] = v;
      const b = $('panel').querySelector('[data-act="submit-new"]');
      if (b) b.disabled = !S.draft.title.trim();
    } else if (S.taskId && (f === 'desc' || v.trim())) saveSoon(S.taskId, f, f === 'title' ? v.trim() : v);
  }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.dataset && (el.dataset.f === 'title' || el.dataset.f === 'desc') && S.taskId) {
    const t = byId.get(S.taskId);
    if (el.dataset.f === 'title' && t && !el.value.trim()) el.value = t.title;
    flushSaves();
  }
  if (el.dataset && el.dataset.note) flushNote(el.dataset.note);
});

function quickAddEnter(el) {
  const text = el.value.trim();
  if (!text) return;
  const key = el.dataset.key.slice(3), defaults = JSON.parse(el.dataset.defaults || '{}');
  const f = quickFields(text, defaults);
  const t = createTask(f);
  drafts.delete(key);
  el.value = '';
  const pv = document.querySelector(`[data-preview="${CSS.escape(key)}"]`);
  if (pv) pv.innerHTML = '';
  if (f.list !== defaults.list) snack(`Added to ${f.list}`, 'Open', () => openPanel(t.id));
}

document.addEventListener('keydown', e => {
  if (dialogOpen() || $('layer').querySelector('.menu')) return;
  const el = e.target, tag = el.tagName, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || el.isContentEditable;
  if (el.dataset && el.dataset.qa && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); quickAddEnter(el); return; }
  if (el.dataset && el.dataset.subadd && e.key === 'Enter' && !e.isComposing && el.value.trim()) {
    e.preventDefault();
    const parent = byId.get(el.dataset.subadd);
    if (parent) createTask({ title: el.value.trim(), parent: parent.id, list: parent.list, milestone: parent.milestone, append: true });
    drafts.delete('sub:' + el.dataset.subadd);
    el.value = '';
    return;
  }
  if (el.dataset && el.dataset.f === 'title' && e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    if (S.draft) submitNew(); else { const d = $('panel').querySelector('.pn-desc'); if (d) d.focus(); }
    return;
  }
  if (e.key === 'Escape') {
    if (el === $('search')) { clearSearch(); el.blur(); return; }
    if (el.dataset && el.dataset.qa) { el.value = ''; drafts.delete(el.dataset.key.slice(3)); el.blur(); return; }
    if ((S.taskId || S.draft) && (!typing || $('panel').contains(el))) { e.preventDefault(); closePanel(); return; }
    if ($('app').classList.contains('drawer-open')) { closeDrawer(); return; }
    hideSnack();
    return;
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && (S.taskId || S.draft)) { e.preventDefault(); if (S.draft) submitNew(); else closePanel(); return; }
  if (typing) return;
  const row = el.closest && el.closest('.task, .prow');
  const t = row && row.classList.contains('task') ? byId.get(row.dataset.id) : null;
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const id = (t && t.id) || S.taskId;
    if (id) { e.preventDefault(); moveBy(id, e.key === 'ArrowUp' ? -1 : 1); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const views = { 1: 'home', 2: 'myday', 3: 'upcoming', 4: 'starred', 5: 'review', 6: 'trash' };
  if (views[e.key]) { e.preventDefault(); setView(views[e.key]); return; }
  const keys = {
    '/': () => { $('topbar').classList.add('searching'); $('search').focus(); },
    c: () => openNew(), '?': shortcutsDlg, m: toggleDrawer,
    n: () => { const i = $('main').querySelector('.qa input'); if (i) { i.focus(); i.scrollIntoView({ block: 'nearest' }); } else openNew(); },
    j: () => moveFocus(1), k: () => moveFocus(-1), ArrowDown: () => moveFocus(1), ArrowUp: () => moveFocus(-1),
    x: () => t && (t.archived ? uncomplete(t.id) : complete(t.id, row)),
    s: () => t && !t.archived && patch(t.id, { starred: !t.starred }),
    b: () => t && !t.archived && blockDlg('task', t.id),
    e: () => t && openPanel(t.id),
    Enter: () => { if (t) openPanel(t.id); else if (row) row.click(); },
    Delete: () => t && trash(t.id), Backspace: () => t && trash(t.id),
  };
  if (keys[e.key]) {
    if (e.key === 'Enter' && /^(BUTTON|A|SUMMARY)$/.test(tag)) return;
    e.preventDefault();
    keys[e.key]();
  }
});
function moveFocus(dir) {
  const rows = [...$('main').querySelectorAll('.task')];
  if (!rows.length) return;
  const cur = document.activeElement.closest && document.activeElement.closest('.task');
  const i = rows.indexOf(cur);
  const next = rows[i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + dir))];
  next.focus();
  next.scrollIntoView({ block: 'nearest' });
}

let searchTimer;
function onSearch() {
  const v = $('search').value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (v.trim()) { if (S.view !== 'search') { S.prevView = S.view; S.prevId = S.id; } S.query = v; S.view = 'search'; }
    else if (S.view === 'search') { S.query = ''; S.view = S.prevView; S.id = S.prevId; }
    renderNow();
  }, 120);
}
function clearSearch() {
  $('search').value = '';
  $('topbar').classList.remove('searching');
  if (S.view === 'search') { S.query = ''; S.view = S.prevView; S.id = S.prevId; renderNow(); }
}

function initShell() {
  const put = (id, name) => { $(id).insertAdjacentHTML('afterbegin', ic(name)); };
  put('btnDrawer', 'menu');
  put('btnRefresh', 'refresh');
  put('btnSync', 'event');
  put('btnSettings', 'settings');
  put('btnClearSearch', 'close');
  put('searchBox', 'search');
  $('fab').innerHTML = `${ic('add')}<span>Create</span>`;
  $('searchBox').addEventListener('click', () => { $('topbar').classList.add('searching'); $('search').focus(); });
  $('search').addEventListener('input', onSearch);
  $('search').addEventListener('blur', () => { if (!$('search').value) $('topbar').classList.remove('searching'); });
  $('btnClearSearch').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); clearSearch(); $('search').focus(); });
  window.addEventListener('pagehide', flushSaves);
  $('main').addEventListener('compositionstart', () => { composing = true; });
  $('main').addEventListener('compositionend', () => { composing = false; if (renderBlocked) { renderBlocked = false; renderNow(); } });
  window.addEventListener('resize', () => { if (!isNarrow()) closeDrawer(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { flushSaves(); return; }
    if (!S.ready || Q.pending) return;
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
    if (Date.now() - S.loadedAt > 120000) boot(true);
  });
  let midnight = todayISO();
  setInterval(() => { if (todayISO() !== midnight) { midnight = todayISO(); schedule(); } }, 60000);
}

initShell();
render();
boot();
</script>
