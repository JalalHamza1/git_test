async function milestonesDlg(p) {
  const rows = msOf(p).map(m => ({ id: m.id, name: m.name, target: m.target, done: m.done, orig: m }));
  const rowHTML = (r, i) => `<div class="mline ${r.done ? 'reached' : ''}" data-row="${i}">
    <div class="ord"><button type="button" data-mv="-1" aria-label="Move up">${ic('up')}</button><button type="button" data-mv="1" aria-label="Move down">${ic('down')}</button></div>
    <input class="input" data-mn value="${esc(r.name)}" placeholder="Milestone name" aria-label="Milestone name" maxlength="120" data-enter="1">
    <input class="input" type="date" data-mt value="${esc(r.target)}" aria-label="Target date">
    <button type="button" class="icon-btn" data-mdel aria-label="Delete milestone" title="Delete milestone">${ic('trash')}</button></div>`;
  const read = box => box.querySelectorAll('.mline').forEach((el, i) => { rows[i].name = el.querySelector('[data-mn]').value; rows[i].target = el.querySelector('[data-mt]').value; });
  const draw = box => { box.querySelector('.mlist').innerHTML = rows.map(rowHTML).join('') || '<p class="sub" style="margin:0">No milestones yet.</p>'; };
  const v = await openDialog({
    title: `Milestones · ${p.name}`, wide: true,
    actions: [{ label: 'Cancel', value: null }, { label: 'Save', primary: true, value: 'ok' }],
    body: `<p class="dlg-hint" style="margin-top:4px">Milestones are the phases of the project, in order. Each one is reached when its last task is done.</p>
      <div class="dlg-body"><div class="mlist"></div><button type="button" class="btn sm" data-madd style="align-self:flex-start">${ic('add')}Add milestone</button><div class="dlg-err" id="mErr"></div></div>`,
    onMount: box => {
      draw(box);
      if (!rows.length) { rows.push({ id: newId('m'), name: '', target: '', done: '' }); draw(box); }
      box.addEventListener('click', e => {
        const line = e.target.closest('.mline');
        if (e.target.closest('[data-madd]')) { read(box); rows.push({ id: newId('m'), name: '', target: '', done: '' }); draw(box); box.querySelector('.mline:last-child [data-mn]').focus(); }
        else if (line && e.target.closest('[data-mdel]')) { read(box); rows.splice(Number(line.dataset.row), 1); draw(box); }
        else if (line && e.target.closest('[data-mv]')) {
          read(box);
          const i = Number(line.dataset.row), j = i + Number(e.target.closest('[data-mv]').dataset.mv);
          if (j >= 0 && j < rows.length) { [rows[i], rows[j]] = [rows[j], rows[i]]; draw(box); }
        }
      });
    },
    onAction: (val, box) => {
      if (val !== 'ok') return;
      read(box);
      const keep = rows.filter(r => r.name.trim());
      const bad = keep.find(r => r.target && !/^\d{4}-\d{2}-\d{2}$/.test(r.target));
      if (bad) { box.querySelector('#mErr').textContent = 'One of the dates isn’t valid.'; return false; }
    },
  });
  if (v !== 'ok') return;
  const keep = rows.filter(r => r.name.trim());
  const keepIds = new Set(keep.map(r => r.id));
  msOf(p).filter(m => !keepIds.has(m.id)).forEach(deleteMilestoneLocal);
  keep.forEach((r, i) => {
    const name = r.name.trim().slice(0, 120);
    if (r.orig) {
      const f = {};
      if (r.orig.name !== name) f.name = name;
      if (r.orig.target !== r.target) f.target = r.target;
      if (r.orig.order !== i) f.order = i;
      if (Object.keys(f).length) saveMilestoneLocal(r.orig, f, false);
    } else saveMilestoneLocal({ id: r.id, projectId: p.id, name, target: r.target, done: '', order: i, eventId: '' }, {}, true);
  });
  touchProject(p);
  schedule();
}

// Asks why it's blocked and what will unblock it. Works for a task or a whole project.
async function blockDlg(kind, id) {
  const x = kind === 'project' ? proj(id) : byId.get(id);
  if (!x) return;
  const list = kind === 'project' ? x.name : x.list;
  const editing = kind === 'project' ? x.status === 'blocked' : x.status === 'Blocked';
  const exclude = new Set(kind === 'task' ? [x.id, ...kidsOf(x.id).map(k => k.id)] : []);
  const candidates = S.tasks.filter(t => !t.archived && t.list === list && !exclude.has(t.id) && !(kind === 'task' && t.blockedBy.includes(x.id))).sort(SORTS.my).slice(0, 60);
  const checked = new Set(x.blockedBy);
  const name = kind === 'project' ? `“${x.name}”` : `“${x.title}”`;
  let spec = null;
  const v = await openDialog({
    title: editing ? 'Edit block' : (kind === 'project' ? 'Mark project as blocked' : 'Mark task as blocked'), wide: true,
    actions: [{ label: 'Cancel', value: null }, { label: editing ? 'Save' : 'Mark blocked', primary: true, danger: true, value: 'ok' }],
    body: `<p style="margin-top:2px">${esc(name)}</p><div class="dlg-body">
      <div class="dlg-label">Why is it blocked?</div>
      <textarea id="bReason" rows="2" maxlength="500" placeholder="e.g. IT hasn’t given us Shared Drive access" aria-label="Why is it blocked?" autofocus>${esc(x.blockReason || '')}</textarea>
      <div class="dlg-label" style="margin-top:4px">What will unblock it?</div>
      <div class="opt"><div class="opt-h">${ic('addCircle')}Something I need to do first</div>
        <div class="sub" style="margin-top:-4px">Each line becomes a task${kind === 'project' ? ' at the top of the project' : ' right above this one'}. When they're done, it unblocks by itself.</div>
        <div id="bNew" style="display:flex;flex-direction:column;gap:6px"><input class="input" data-new placeholder="e.g. Email IT with the access request" aria-label="Task to do first" maxlength="500" data-enter="1"></div>
        <button type="button" class="text-btn" id="bAdd" style="align-self:flex-start">+ Another task</button></div>
      ${candidates.length ? `<div class="opt"><div class="opt-h">${ic('subArrow')}Another task that has to finish first</div>
        <div class="picks">${candidates.map(t => `<label class="pick"><input type="checkbox" value="${t.id}" ${checked.has(t.id) ? 'checked' : ''}><span>${esc(t.title)}</span>${isBlocked(t) ? '<span class="sub bad">blocked</span>' : ''}</label>`).join('')}</div></div>` : ''}
      <div class="opt"><div class="opt-h">${ic('hourglass')}Waiting on a person or team</div>
        <input class="input" id="bWait" value="${esc(x.waiting || '')}" placeholder="e.g. IT helpdesk" aria-label="Waiting on" maxlength="100" data-enter="1">
        <div class="sub">The app counts the days and flags it after 5. Click “It arrived” when it does.</div></div>
      <div class="dlg-err" id="bErr"></div></div>`,
    onMount: box => {
      box.querySelector('#bAdd').addEventListener('click', () => {
        const inp = document.createElement('input');
        Object.assign(inp, { className: 'input', placeholder: 'Another task to do first', maxLength: 500 });
        inp.dataset.new = '1';
        inp.dataset.enter = '1';
        box.querySelector('#bNew').append(inp);
        inp.focus();
      });
    },
    onAction: (val, box) => {
      if (val !== 'ok') return;
      const reason = box.querySelector('#bReason').value.trim();
      const err = box.querySelector('#bErr');
      if (!reason) { err.textContent = 'Write a short reason. It’s what you’ll see in the weekly review.'; box.querySelector('#bReason').focus(); return false; }
      const create = [...box.querySelectorAll('[data-new]')].map(i => i.value.replace(/\s+/g, ' ').trim()).filter(Boolean).slice(0, 10).map(title => ({ id: newId(), title }));
      const blockers = [...box.querySelectorAll('.picks input:checked')].map(i => i.value);
      const waiting = box.querySelector('#bWait').value.trim().slice(0, 100);
      if (!create.length && !blockers.length && !waiting && !err.dataset.warned) {
        err.dataset.warned = '1';
        err.style.color = 'var(--amber)';
        err.textContent = 'There’s no unblock plan yet. You can save anyway and add one later. Click again to save.';
        return false;
      }
      spec = { reason, create, blockers, waiting, milestone: kind === 'project' ? ((currentMs(x) || {}).id || '') : '' };
    },
  });
  if (v !== 'ok' || !spec) return;
  if (kind === 'project') blockProject(x, spec); else blockTask(x, spec);
}

let snackTimer;
function snack(text, action, onAction) {
  const bar = $('snack'), btn = $('snackAction');
  $('snackText').textContent = text;
  btn.hidden = !action;
  if (action) { btn.textContent = action; btn.onclick = () => { hideSnack(); onAction(); }; }
  bar.classList.add('show');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(hideSnack, action ? 6500 : 3500);
}
const hideSnack = () => $('snack').classList.remove('show');

/* ======================================================================
 * Navigation
 * ==================================================================== */
function setView(v, id) {
  if (v !== 'search' && S.query) { S.query = ''; $('search').value = ''; $('topbar').classList.remove('searching'); }
  S.view = v;
  S.id = id === undefined ? null : id;
  if (v !== 'search') { prefs.view = v; prefs.id = S.id; savePrefs(); }
  if (isNarrow()) closeDrawer();
  renderNow();
  $('main').scrollTop = 0;
}
function openProject(id, tab) {
  if (!proj(id)) return;
  if (!(S.view === 'project' && S.id === id)) { S.tab = tab || 'overview'; S.noteId = null; S.noteFilter = 'all'; }
  else if (tab) S.tab = tab;
  setView('project', id);
}
function openList(name) { setView('list', name); }
function toggleDrawer() {
  if (isNarrow()) { $('app').classList.toggle('drawer-open'); return; }
  prefs.drawer = !prefs.drawer;
  savePrefs();
  renderTop();
}
const closeDrawer = () => $('app').classList.remove('drawer-open');

/* ======================================================================
 * Events
 * ==================================================================== */
const ACT = {
  view: el => setView(el.dataset.v),
  project: el => openProject(el.dataset.id, el.dataset.tab),
  list: el => openList(el.dataset.name),
  tab: el => { S.tab = el.dataset.v; renderNow(); },
  task: el => openPanel(el.dataset.id),
  toggle: el => { const t = byId.get(el.dataset.id); if (!t) return; t.archType === 'Completed' ? uncomplete(t.id) : complete(t.id, el.closest('.task')); },
  star: el => { const t = byId.get(el.dataset.id); if (t) patch(t.id, { starred: !t.starred }); },
  create: () => { openNew(); if (isNarrow()) closeDrawer(); },
  drawer: () => toggleDrawer(),
  retry: () => { S.error = null; boot(); },
  refresh: async () => { const b = $('btnRefresh'); b.classList.add('spin'); flushSaves(); await Q.chain; await boot(true); b.classList.remove('spin'); },
  sync: () => sync(),
  settings: () => settingsDlg(),
  shortcuts: () => shortcutsDlg(),
  'toggle-other': () => { prefs.showOther = !prefs.showOther; savePrefs(); renderNow(); },
  'new-project': () => newProject(),
  'new-list': () => newList(),
  'list-menu': el => { const l = listByName(el.dataset.name); if (l) listMenu(l, el); },
  'status-menu': el => { const p = proj(el.dataset.id); if (p) statusMenu(p, el); },
  'edit-project': el => { const p = proj(el.dataset.id); if (p) editProject(p); },
  pstatus: el => { const p = proj(el.dataset.id); if (p) setProjectStatus(p, el.dataset.v); },
  milestones: el => { const p = proj(el.dataset.id); if (p) milestonesDlg(p); },
  block: el => blockDlg(el.dataset.kind, el.dataset.id),
  unblock: el => unblock(el.dataset.kind, el.dataset.id),
  arrived: el => arrived(el.dataset.kind, el.dataset.id),
  followed: el => followedUp(el.dataset.kind, el.dataset.id),
  uh: el => { S.uh[el.dataset.id] = el.dataset.h; renderNow(); },
  compose: el => { S.composeFor = el.dataset.id; renderNow(); const t = document.querySelector(`[data-key="upd:ov:${el.dataset.id}"]`); if (t) t.focus(); },
  'post-update': el => { const p = proj(el.dataset.id); if (p) postUpdate(p, el.dataset.ctx); },
  'close-project': el => { const p = proj(el.dataset.id); if (p) closeProject(p); },
  'plan-today': el => { const t = byId.get(el.dataset.id); if (t) { patch(t.id, { plan: todayISO() }); snack(`Added to My Day: ${t.title}`); } },
  note: el => { const n = S.notes.find(x => x.id === el.dataset.id); if (!n) return; openProject(n.projectId, 'notes'); S.noteId = n.id; S.noteFilter = 'all'; renderNow(); },
  nfilter: el => { S.noteFilter = el.dataset.v; S.noteId = null; renderNow(); },
  pin: el => { const n = S.notes.find(x => x.id === el.dataset.id); if (n) { n.pinned = !n.pinned; send('saveNote', { id: n.id, pinned: n.pinned }); renderNow(); } },
  'new-note': el => { const p = proj(el.dataset.id); if (p) newNote(p, el.dataset.v); },
  'delete-note': el => { const n = S.notes.find(x => x.id === el.dataset.id); if (n) deleteNote(n); },
  'show-done': el => { const k = el.dataset.v; prefs.open[k] = !prefs.open[k]; savePrefs(); renderNow(); },
  'close-panel': () => closePanel(),
  'submit-new': () => submitNew(),
  set: el => setField(el.dataset.f, el.dataset.v),
  move: el => { if (S.taskId) moveBy(S.taskId, Number(el.dataset.v)); },
  'trash-task': el => trash(el.dataset.id),
  untrash: el => untrash(el.dataset.id),
  purge: el => purge(el.dataset.id),
  'empty-trash': () => emptyTrash(),
};
document.addEventListener('click', e => {
  if (e.target.closest('#layer')) return;
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.noteType) {
    const n = S.notes.find(x => x.id === el.dataset.noteType);
    if (n) { n.type = el.value; send('saveNote', { id: n.id, type: n.type }); renderNow(); }
    return;
  }
  const f = el.dataset.f;
  if (!f || !$('panel').contains(el) || f === 'title' || f === 'desc') return;
  setField(f, el.value);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.qa) {
    const key = el.dataset.key.slice(3), defaults = JSON.parse(el.dataset.defaults || '{}');
    if (el.value) drafts.set(key, el.value); else drafts.delete(key);
    const pv = document.querySelector(`[data-preview="${CSS.escape(key)}"]`);
    if (pv) pv.innerHTML = el.value.trim() ? previewChips(quickFields(el.value, defaults), defaults) : '';
    return;
  }
  if (el.dataset.draft) { drafts.set(el.dataset.draft, el.value); return; }
  if (el.dataset.subadd) { drafts.set('sub:' + el.dataset.subadd, el.value); return; }
  if (el.dataset.note) {
    const n = S.notes.find(x => x.id === el.dataset.note);
    if (!n) return;
    saveNoteSoon(n, { title: el.value });
    const nl = $('nlist'), p = proj(n.projectId);
    if (nl && p) nl.innerHTML = noteListHTML(notesOf(p).filter(x => S.noteFilter === 'all' || x.type === S.noteFilter).sort((a, b) => b.pinned - a.pinned || (b.updated || '').localeCompare(a.updated || '')));
    return;
  }
  const f = el.dataset.f;
  if ((f === 'title' || f === 'desc') && $('panel').contains(el)) {
    autogrow(el);
    const v = f === 'title' ? el.value.replace(/\n/g, ' ') : el.value;
    if (S.draft) {
      S.draft[f] = v;
      const b = $('panel').querySelector('[data-act="submit-new"]');
      if (b) b.disabled = !S.draft.title.trim();
    } else if (S.taskId && (f === 'desc' || v.trim())) saveSoon(S.taskId, f, f === 'title' ? v.trim() : v);
  }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.dataset && (el.dataset.f === 'title' || el.dataset.f === 'desc') && S.taskId) {
    const t = byId.get(S.taskId);
    if (el.dataset.f === 'title' && t && !el.value.trim()) el.value = t.title;
    flushSaves();
  }
  if (el.dataset && el.dataset.note) flushNote(el.dataset.note);
  if (isTypingEl(el) || (el.closest && el.closest('.ne'))) {
    // Leaving the note: save it, and catch up on anything that was held back while typing.
    setTimeout(() => {
      const now = document.activeElement;
      if (isTypingEl(now)) return;
      flushEditor();
      if (mainStale && !(now && now.closest && now.closest('.nmain'))) schedule();
    }, 0);
  }
});

function quickAddEnter(el) {
  const text = el.value.trim();
  if (!text) return;
  const key = el.dataset.key.slice(3), defaults = JSON.parse(el.dataset.defaults || '{}');
  const f = quickFields(text, defaults);
  const t = createTask(f);
  drafts.delete(key);
  el.value = '';
  const pv = document.querySelector(`[data-preview="${CSS.escape(key)}"]`);
  if (pv) pv.innerHTML = '';
  if (f.list !== defaults.list) snack(`Added to ${f.list}`, 'Open', () => openPanel(t.id));
}

document.addEventListener('keydown', e => {
  if (dialogOpen() || $('layer').querySelector('.menu')) return;
  const el = e.target, tag = el.tagName, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || el.isContentEditable;
  if (el.dataset && el.dataset.qa && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); quickAddEnter(el); return; }
  if (el.dataset && el.dataset.subadd && e.key === 'Enter' && !e.isComposing && el.value.trim()) {
    e.preventDefault();
    const parent = byId.get(el.dataset.subadd);
    if (parent) createTask({ title: el.value.trim(), parent: parent.id, list: parent.list, milestone: parent.milestone, append: true });
    drafts.delete('sub:' + el.dataset.subadd);
    el.value = '';
    return;
  }
  if (el.dataset && el.dataset.nf === 'title' && e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    if (NE && NE.quill) NE.quill.focus();
    return;
  }
  if (el.dataset && el.dataset.f === 'title' && e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    if (S.draft) submitNew(); else { const d = $('panel').querySelector('.pn-desc'); if (d) d.focus(); }
    return;
  }
  if (e.key === 'Escape') {
    if (el === $('search')) { clearSearch(); el.blur(); return; }
    if (S.noteFocus) { e.preventDefault(); toggleNoteFocus(false); return; }
    if (el.dataset && el.dataset.qa) { el.value = ''; drafts.delete(el.dataset.key.slice(3)); el.blur(); return; }
    if ((S.taskId || S.draft) && (!typing || $('panel').contains(el))) { e.preventDefault(); closePanel(); return; }
    if ($('app').classList.contains('drawer-open')) { closeDrawer(); return; }
    hideSnack();
    return;
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && (S.taskId || S.draft) && !(el.closest && el.closest('.ne'))) { e.preventDefault(); if (S.draft) submitNew(); else closePanel(); return; }
  if (typing) return;
  const row = el.closest && el.closest('.task, .prow');
  const t = row && row.classList.contains('task') ? byId.get(row.dataset.id) : null;
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const id = (t && t.id) || S.taskId;
    if (id) { e.preventDefault(); moveBy(id, e.key === 'ArrowUp' ? -1 : 1); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const views = { 1: 'home', 2: 'myday', 3: 'upcoming', 4: 'starred', 5: 'review', 6: 'trash' };
  if (views[e.key]) { e.preventDefault(); setView(views[e.key]); return; }
  const keys = {
    '/': () => { $('topbar').classList.add('searching'); $('search').focus(); },
    c: () => openNew(), '?': shortcutsDlg, m: toggleDrawer,
    n: () => { const i = $('main').querySelector('.qa input'); if (i) { i.focus(); i.scrollIntoView({ block: 'nearest' }); } else openNew(); },
    j: () => moveFocus(1), k: () => moveFocus(-1), ArrowDown: () => moveFocus(1), ArrowUp: () => moveFocus(-1),
    x: () => t && (t.archived ? uncomplete(t.id) : complete(t.id, row)),
    s: () => t && !t.archived && patch(t.id, { starred: !t.starred }),
    b: () => t && !t.archived && blockDlg('task', t.id),
    e: () => t && openPanel(t.id),
    Enter: () => { if (t) openPanel(t.id); else if (row) row.click(); },
    Delete: () => t && trash(t.id), Backspace: () => t && trash(t.id),
  };
  if (keys[e.key]) {
    if (e.key === 'Enter' && /^(BUTTON|A|SUMMARY)$/.test(tag)) return;
    e.preventDefault();
    keys[e.key]();
  }
});
function moveFocus(dir) {
  const rows = [...$('main').querySelectorAll('.task')];
  if (!rows.length) return;
  const cur = document.activeElement.closest && document.activeElement.closest('.task');
  const i = rows.indexOf(cur);
  const next = rows[i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + dir))];
  next.focus();
  next.scrollIntoView({ block: 'nearest' });
}

let searchTimer;
function onSearch() {
  const v = $('search').value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (v.trim()) { if (S.view !== 'search') { S.prevView = S.view; S.prevId = S.id; } S.query = v; S.view = 'search'; }
    else if (S.view === 'search') { S.query = ''; S.view = S.prevView; S.id = S.prevId; }
    renderNow();
  }, 120);
}
function clearSearch() {
  $('search').value = '';
  $('topbar').classList.remove('searching');
  if (S.view === 'search') { S.query = ''; S.view = S.prevView; S.id = S.prevId; renderNow(); }
}

function initShell() {
  const put = (id, name) => { $(id).insertAdjacentHTML('afterbegin', ic(name)); };
  put('btnDrawer', 'menu');
  put('btnRefresh', 'refresh');
  put('btnSync', 'event');
  put('btnSettings', 'settings');
  put('btnClearSearch', 'close');
  put('searchBox', 'search');
  $('fab').innerHTML = `${ic('add')}<span>Create</span>`;
  $('searchBox').addEventListener('click', () => { $('topbar').classList.add('searching'); $('search').focus(); });
  $('search').addEventListener('input', onSearch);
  $('search').addEventListener('blur', () => { if (!$('search').value) $('topbar').classList.remove('searching'); });
  $('btnClearSearch').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); clearSearch(); $('search').focus(); });
  window.addEventListener('pagehide', flushSaves);
  $('main').addEventListener('compositionstart', () => { composing = true; });
  $('main').addEventListener('compositionend', () => { composing = false; if (renderBlocked) { renderBlocked = false; renderNow(); } });
  window.addEventListener('resize', () => { if (!isNarrow()) closeDrawer(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { flushSaves(); return; }
    if (!S.ready || Q.pending) return;
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
    if (Date.now() - S.loadedAt > 120000) boot(true);
  });
  let midnight = todayISO();
  setInterval(() => { if (todayISO() !== midnight) { midnight = todayISO(); schedule(); } }, 60000);
}

initShell();
render();
boot();
</script>
