<!DOCTYPE html>
<html lang="cs">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eQRAP Logistika</title>
  <style>
/*
 * Styles – the whole look of the app.
 * Design rules: one accent colour (blue); red / amber / green only as small status markers;
 * neutral cards; controls at least 44 px high so they work on the kiosk tablet.
 */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --subtle: #f8f9fb; --border: #e3e6ea; --border-2: #cdd3db;
  --text: #1c2430; --text-2: #465061; --muted: #6b7482;
  --accent: #1d4ed8; --accent-hover: #1e40af; --accent-soft: #eef3fe; --accent-line: #c9d8fb;
  --ok: #157f3b; --ok-soft: #edf8f1; --ok-line: #c3e5cf;
  --warn: #9a5800; --warn-soft: #fff7ec; --warn-line: #f5d8a9;
  --bad: #b42318; --bad-soft: #fef3f2; --bad-line: #f5c7c2;
  --r: 8px; --r-sm: 6px; --tap: 44px;
  --sh: 0 1px 2px rgba(16, 24, 40, .05);
  --sh-lg: 0 12px 32px rgba(16, 24, 40, .16);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text);
  background: var(--bg); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; }
h3 { font-size: 13px; font-weight: 650; color: var(--text-2); margin: 18px 0 8px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------------------------------------------------------------- top bar and navigation */
.hdr { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 28px; height: 60px; padding: 0 24px;
  background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; white-space: nowrap; cursor: pointer; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center;
  font-size: 13px; font-weight: 800; }
.nav { display: flex; align-self: stretch; gap: 2px; }
.nav-item { display: flex; align-items: center; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: none;
  color: var(--text-2); font-weight: 550; font-size: 14px; cursor: pointer; }
.nav-item:hover { color: var(--text); }
.nav-item.on { color: var(--accent); border-bottom-color: var(--accent); }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.hdr-area { font-size: 13px; color: var(--text-2); white-space: nowrap; }
.hdr-select { height: 36px; min-width: 170px; width: auto; font-size: 13px; }
.lang-btn { height: 32px; min-width: 40px; padding: 0 8px; border: 1px solid var(--border-2); border-radius: var(--r-sm); background: var(--surface);
  font-size: 12px; font-weight: 700; color: var(--text-2); cursor: pointer; }
.lang-btn:hover { background: var(--subtle); }
.user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid;
  place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.menu-btn { display: none; height: 36px; padding: 0 12px; border: 1px solid var(--border-2); border-radius: var(--r-sm);
  background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; }
.menu-panel { position: absolute; top: 58px; right: 12px; min-width: 240px; padding: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--sh-lg); }
.menu-panel button { display: block; width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: var(--r-sm); background: none;
  text-align: left; font-size: 14px; cursor: pointer; }
.menu-panel button:hover { background: var(--subtle); }
.menu-panel .menu-sep { height: 1px; background: var(--border); margin: 6px 4px; }
.busybar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50; background: linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size: 50% 100%; animation: busy 1s linear infinite; }
@keyframes busy { from { background-position: -50% 0; } to { background-position: 150% 0; } }
.offline { position: sticky; top: 60px; z-index: 29; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
  padding: 8px 16px; background: var(--bad-soft); color: var(--bad); border-bottom: 1px solid var(--bad-line); font-weight: 600; font-size: 14px; }

/* ---------------------------------------------------------------- page layout */
.app { max-width: 1160px; margin: 0 auto; padding: 24px 24px 120px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head-main { min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { color: #b9bfc8; }
.page-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.page-sub { margin-top: 4px; color: var(--text-2); font-size: 14px; }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--sh); }
.card-title { font-size: 15px; font-weight: 650; margin-bottom: 14px; }
.card .card { box-shadow: none; margin-bottom: 12px; padding: 16px 18px; }
.sec { scroll-margin-top: 76px; }
.sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sec-num { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex: none;
  background: var(--subtle); border: 1px solid var(--border); color: var(--text-2); font-size: 12px; font-weight: 700; }
.sec-title { font-size: 15px; font-weight: 650; }
.sec-role { margin-left: auto; font-size: 12px; color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.row > * { flex: 1 1 220px; }
.kv { display: grid; grid-template-columns: minmax(150px, 30%) 1fr; margin: 0; }
.kv dt, .kv dd { margin: 0; padding: 8px 0; border-bottom: 1px solid #f0f2f4; }
.kv dt { color: var(--muted); font-size: 13.5px; }
.kv dd { font-weight: 500; overflow-wrap: anywhere; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.loading { padding: 48px 16px; text-align: center; color: var(--muted); }

/* ---------------------------------------------------------------- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; white-space: nowrap;
  border: 1px solid var(--border-2); border-radius: var(--r-sm); background: var(--surface); color: var(--text);
  font-size: 14px; font-weight: 600; cursor: pointer; user-select: none; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--subtle); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary, .btn-op, .btn-pil, .btn-mgr, .btn-ok { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover, .btn-op:hover, .btn-pil:hover, .btn-mgr:hover, .btn-ok:hover { background: var(--accent-hover); }
.btn-danger { color: var(--bad); border-color: var(--bad-line); }
.btn-danger:hover { background: var(--bad-soft); }
.btn-link { height: auto; padding: 0; border: 0; background: none; color: var(--accent); font-weight: 600; }
.btn-link:hover { background: none; text-decoration: underline; }
.btn-big { height: 48px; padding: 0 22px; font-size: 15px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* ---------------------------------------------------------------- forms */
.form-group { padding: 4px 0 8px; }
.form-group + .form-group { border-top: 1px solid var(--border); padding-top: 18px; margin-top: 6px; }
.form-group-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; align-items: start; }
.form-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fld { margin-bottom: 16px; min-width: 0; }
.fld-label { display: block; margin-bottom: 6px; font-size: 13.5px; font-weight: 600; }
.fld-hint { margin: 5px 0 0; font-size: 12.5px; color: var(--muted); }
p.fld-hint { margin: 0 0 12px; }
.req { color: var(--bad); }
.fld-err { margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--bad); }
.fld-err:empty { display: none; }
input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=search], select, textarea {
  width: 100%; height: var(--tap); padding: 0 12px; border: 1px solid var(--border-2); border-radius: var(--r-sm); background: var(--surface);
  transition: border-color .12s, box-shadow .12s; }
textarea { height: auto; min-height: 88px; padding: 10px 12px; resize: vertical; }
select { appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer;
  background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b7482' stroke-width='1.6'/></svg>") no-repeat right 12px center; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input:disabled, select:disabled, textarea:disabled { background: var(--subtle); color: var(--muted); }
.fld.has-err input, .fld.has-err select, .fld.has-err textarea, .fld.has-err .checklist { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.input-with-btn { display: flex; gap: 8px; }
.input-with-btn > :first-child { flex: 1; min-width: 0; }
.input-with-btn .btn { height: var(--tap); flex: none; }
.stack > * + * { margin-top: 8px; }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); border: 1px solid var(--border-2);
  border-radius: var(--r-sm); background: var(--surface); max-height: 300px; overflow: auto; }
.check-item { display: flex; align-items: center; gap: 10px; min-height: var(--tap); padding: 8px 12px; border-bottom: 1px solid #f0f2f4; cursor: pointer; }
.check-item:hover { background: var(--subtle); }
.check-item input, .chk input { width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
.chk { display: inline-flex; align-items: center; gap: 10px; min-height: var(--tap); cursor: pointer; font-size: 14px; }
.note { border-radius: var(--r-sm); padding: 10px 14px; margin: 10px 0 14px; font-size: 14px; border: 1px solid var(--border); background: var(--subtle); color: var(--text-2); }
.errbox, .warnbox, .okbox { border-radius: var(--r-sm); padding: 10px 14px; margin: 10px 0 14px; font-size: 14px; border: 1px solid; }
.errbox { background: var(--bad-soft); border-color: var(--bad-line); color: #8a1c14; }
.warnbox { background: var(--warn-soft); border-color: var(--warn-line); color: #6e4000; }
.okbox { background: var(--ok-soft); border-color: var(--ok-line); color: #145c2e; }
.errbox ul, .warnbox ul { margin: 4px 0 0 18px; padding: 0; }

/* ---------------------------------------------------------------- status, tags, chips */
.status { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12.5px; font-weight: 600;
  background: var(--subtle); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: #9aa3af; }
.status-active i { background: var(--accent); }
.status-done i { background: var(--ok); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 700;
  letter-spacing: .03em; text-transform: uppercase; border: 1px solid var(--border); color: var(--text-2); background: var(--surface); white-space: nowrap; }
.tag-bad { color: var(--bad); border-color: var(--bad-line); background: var(--bad-soft); }
.tag-warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); }
.chips { display: inline-flex; gap: 3px; }
.chip { width: 22px; height: 22px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border); background: var(--surface); color: #a3abb6; }
.chip-done { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.chip-wait { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.chip-late { background: var(--bad); border-color: var(--bad); color: #fff; }
.chip-na { border-style: dashed; color: #c3c9d1; background: transparent; }
.ok-mark { color: var(--ok); font-weight: 700; }
.bad-mark { color: var(--bad); font-weight: 700; }
.pill-ok { color: var(--ok); font-weight: 600; }
.pill-bad { color: var(--bad); font-weight: 600; }

/* ---------------------------------------------------------------- tabs (filters) */
.tabs { display: inline-flex; gap: 2px; padding: 3px; background: #eceef1; border-radius: var(--r); }
.tab { height: 34px; padding: 0 14px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2);
  font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(16, 24, 40, .12); }

/* ---------------------------------------------------------------- board */
.board-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--sh);
  height: calc(100vh - 250px); min-height: 320px; overflow-y: auto; }
.bhead, .brow { display: grid; grid-template-columns: 160px minmax(0, 1fr) 210px 176px; gap: 16px; align-items: center; padding: 12px 18px; }
.bhead { position: sticky; top: 0; z-index: 1; padding-top: 10px; padding-bottom: 10px; background: var(--subtle); border-bottom: 1px solid var(--border);
  font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.brow { border-bottom: 1px solid #eef0f3; border-left: 3px solid transparent; cursor: pointer; }
.brow:hover { background: #f9fafc; }
.brow.late { border-left-color: var(--bad); }
.brow.closed { opacity: .6; }
.b-num { font-weight: 650; font-size: 14px; font-variant-numeric: tabular-nums; }
.b-tags { display: flex; gap: 4px; margin-top: 4px; }
.b-text { font-weight: 550; }
.b-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.b-wait { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.brow.late .b-wait { color: var(--bad); font-weight: 600; }
.board-more { padding: 10px; text-align: center; font-size: 13px; color: var(--muted); }
.bottombar, .wiz-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: flex-end; gap: 10px;
  padding: 12px 24px; background: rgba(255, 255, 255, .97); border-top: 1px solid var(--border); }
.bottombar .btn, .wiz-nav .btn { min-width: 180px; }
.wiz-nav .spacer { flex: 1; }

/* ---------------------------------------------------------------- wizard */
.stepper { display: flex; align-items: center; margin-bottom: 20px; padding: 14px 18px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--sh); }
.step { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.step-dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 700;
  border: 1.5px solid var(--border-2); background: var(--surface); }
.step.cur { color: var(--text); }
.step.cur .step-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.done { color: var(--text-2); cursor: pointer; }
.step.done .step-dot { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.step-line { flex: 1; height: 1px; min-width: 12px; margin: 0 12px; background: var(--border-2); }
.step-line.done { background: var(--accent-line); }
.photo-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.photo-slot { padding: 14px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); text-align: center; }
.ph-title { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 700; }
.ph-title::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
.ph-wrong .ph-title::before { background: var(--bad); }
.ph-correct .ph-title::before { background: var(--ok); }
.ph-frame { height: 220px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; overflow: hidden;
  border-radius: var(--r-sm); background: var(--subtle); border: 1px dashed var(--border-2); }
.ph-frame img { max-width: 100%; max-height: 100%; }
.ph-empty { font-size: 13px; color: var(--muted); }
.ia-row { padding: 14px 16px 2px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--subtle); }
.ia-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.ia-title { font-size: 13px; font-weight: 700; color: var(--text-2); }
.sugg { display: block; width: 100%; margin-bottom: 6px; padding: 10px 12px; text-align: left; border: 1px solid var(--border);
  border-radius: var(--r-sm); background: var(--surface); font-size: 14px; cursor: pointer; }
.sugg:hover { border-color: var(--border-2); }
.sugg.on { border-color: var(--accent); background: var(--accent-soft); }

/* ---------------------------------------------------------------- QRAP detail */
.qhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; }
.qhead-what { margin: 2px 0 12px; font-size: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--text); font-weight: 600; }
.pnav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.pnav-item { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px 0 5px; border: 1px solid var(--border);
  border-radius: 16px; background: var(--surface); font-size: 13px; color: var(--text-2); cursor: pointer; }
.pnav-item:hover { background: var(--subtle); border-color: var(--border-2); }
.pnav-item .chip { border-radius: 50%; }
.qr-box { width: 136px; text-align: center; font-size: 12px; color: var(--muted); }
.qr { padding: 8px; margin-bottom: 6px; border: 1px solid var(--border); border-radius: var(--r); background: #fff; }
.qr img, .qr canvas { display: block; width: 118px !important; height: 118px !important; margin: 0 auto; }
.thumbs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
.thumb { width: 180px; padding: 8px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.thumb:hover { border-color: var(--border-2); }
.thumb img { max-width: 100%; max-height: 150px; border-radius: 4px; }
.thumb-wrong b::before, .thumb-correct b::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
.thumb-wrong b::before { background: var(--bad); }
.thumb-correct b::before { background: var(--ok); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
.tbl th { padding: 8px 10px; text-align: left; background: var(--subtle); border-bottom: 1px solid var(--border);
  font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.late td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.table-wrap { border: 1px solid var(--border); border-radius: var(--r-sm); overflow: auto; }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.slot { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); font-size: 13px; }
.slot-EFFECTIVE { border-color: var(--ok-line); background: var(--ok-soft); }
.slot-NOT_EFFECTIVE { border-color: var(--bad-line); background: var(--bad-soft); }
.slot-NOT_VERIFIED { border-color: var(--warn-line); background: var(--warn-soft); }
.why-list { margin: 0; padding-left: 22px; }
.why-list li { padding: 3px 0; }
.why-root { font-weight: 650; }
.why-step { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.why-step .chk { margin-top: 28px; font-size: 13px; }

/* ---------------------------------------------------------------- lists (shifts, checklists, needs) */
.list { border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 10px 14px;
  border-bottom: 1px solid var(--border); }
.list-row:last-child { border-bottom: 0; }

.opt-list { margin-bottom: 16px; border: 1px solid var(--border-2); border-radius: var(--r); overflow: hidden; }
.dec-opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--border);
  background: var(--surface); text-align: left; cursor: pointer; }
.dec-opt:last-child { border-bottom: 0; }
.dec-opt:hover { background: var(--subtle); }
.dec-opt.on { background: var(--accent-soft); }
.dec-opt:disabled { opacity: .5; cursor: not-allowed; }
.radio { width: 18px; height: 18px; margin-top: 2px; flex: none; border: 1.5px solid var(--border-2); border-radius: 50%; background: #fff; }
.dec-opt.on .radio { border: 5px solid var(--accent); }
.dec-opt-title { display: block; font-weight: 600; }
.dec-opt-sub { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }

/* ---------------------------------------------------------------- assessment */
.crit { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 16px; align-items: center; margin: 0; padding: 14px 0;
  border-bottom: 1px solid var(--border); }
.crit-title { font-weight: 600; }
.crit-sub { font-size: 13px; color: var(--muted); }
.crit-hint { margin-top: 4px; font-size: 12.5px; color: var(--text-2); }
.crit .fld-err { grid-column: 1 / -1; }

/* ---------------------------------------------------------------- manager */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.toolbar .fld { margin-bottom: 0; flex: 1 1 170px; }
.toolbar .btn { height: var(--tap); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--sh); }
.tile-n { font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile.alert { box-shadow: inset 3px 0 0 var(--bad), var(--sh); }
.tile-l { margin-top: 2px; font-size: 12.5px; color: var(--muted); }

/* ---------------------------------------------------------------- toast and dialogs */
.toast { position: fixed; right: 24px; bottom: 90px; z-index: 60; max-width: 420px; padding: 12px 16px 12px 18px; border-radius: var(--r);
  background: #1f2733; color: #fff; font-size: 14px; font-weight: 500; box-shadow: var(--sh-lg); border-left: 4px solid #8b95a5; }
.toast.ok { border-left-color: #4ade80; }
.toast.err { border-left-color: #f87171; }
.toast.warn { border-left-color: #fbbf24; }
.modal-wrap { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(16, 24, 40, .45); }
.modal { width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; padding: 22px 24px; background: var(--surface);
  border-radius: 12px; box-shadow: var(--sh-lg); }
.modal h2 { font-size: 17px; margin-bottom: 12px; }
.modal-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.modal img.full { max-width: 100%; border-radius: var(--r-sm); }

/* ---------------------------------------------------------------- tablets and phones */
@media (max-width: 1000px) {
  .nav { display: none; }
  .menu-btn { display: inline-flex; align-items: center; }
  .user-name { display: none; }
  .cols { grid-template-columns: 1fr; }
  .bhead, .brow { grid-template-columns: 140px minmax(0, 1fr) 180px; }
  .bhead > :nth-child(4), .brow > .chips { display: none; }
}
@media (max-width: 720px) {
  body { font-size: 15px; }
  .app { padding: 16px 12px 120px; }
  .hdr { padding: 0 12px; gap: 10px; }
  .hdr-area, .hdr-select { display: none; }
  .page-title { font-size: 19px; }
  .card { padding: 16px; }
  .form-grid, .form-grid-3, .photo-slots { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; }
  .kv dt { padding-bottom: 0; border-bottom: 0; }
  .bhead { display: none; }
  .brow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id chips" "what what" "status status"; gap: 6px 10px; }
  .brow > .b-id { grid-area: id; display: flex; gap: 8px; align-items: center; }

  .brow > .b-what { grid-area: what; }
  .brow > .b-status { grid-area: status; }
  .brow > .chips { grid-area: chips; display: inline-flex; }
  .qhead { grid-template-columns: 1fr; }
  .qr-box { display: none; }
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .crit { grid-template-columns: 1fr; gap: 8px; }
  .step-label { display: none; }
  .step.cur .step-label { display: inline; }
  .bottombar, .wiz-nav { padding: 10px 12px; }
  .bottombar .btn, .wiz-nav .btn { flex: 1; min-width: 0; padding: 0 10px; }
  .wiz-nav .spacer { display: none; }
  .board-list { height: calc(100vh - 270px); }
  .toast { left: 12px; right: 12px; bottom: 84px; max-width: none; }

.home { max-width: 860px; margin: 0 auto; }
.home-hero { text-align: center; padding: 28px 16px 8px; }
.home-kicker { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.home-title { font-size: 30px; font-weight: 700; margin: 8px 0 6px; letter-spacing: -.02em; }
.home-lead { color: var(--text-2); margin: 0 auto 22px; max-width: 520px; }
.home-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.btn-hero { height: 64px; min-width: 340px; font-size: 18px; border-radius: 10px; }
.home-actions .btn-big { min-width: 340px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 26px 0 8px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; text-align: center; }
.stat.alert { box-shadow: inset 0 -3px 0 var(--bad); }
.stat-n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12.5px; color: var(--muted); }
.home-section { margin-top: 24px; }
.home-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.home-section-head h2 { font-size: 15px; }
.home-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.home-empty { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border-2); border-radius: var(--r); }
.qcard { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);

.qcard:hover { border-color: var(--border-2); }
.qcard.late { box-shadow: inset 3px 0 0 var(--bad), var(--sh); }
.qcard-top { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.qcard-id { font-weight: 700; color: var(--text); }
.qcard-time { margin-left: auto; }

.qcard-bottom { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.pbar { display: inline-flex; gap: 3px; }
.pseg { width: 16px; height: 6px; border-radius: 3px; background: #e5e8ec; }
.pseg-done { background: #7cc79a; }
.pseg-wait { background: #f2c27a; }
.pseg-late { background: var(--bad); }
.pseg-na { background: transparent; border: 1px dashed #cbd1d8; height: 6px; }

.band { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-align: center;

.paper { border: 1px solid var(--border-2); }

.pp-l { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.pp-v { font-weight: 550; overflow-wrap: anywhere; }
.pp-list { margin: 0 0 8px; padding-left: 16px; }
.pp-list li { margin-bottom: 5px; }
.pp-col:nth-child(2) .pp-list, .pp-col:nth-child(7) .pp-list { list-style: none; padding-left: 0; }
.pp-sub { font-size: 11px; color: var(--muted); }
.pp-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pp-photo { text-align: center; font-size: 10px; color: var(--muted); }

.tl-item { position: relative; padding: 0 0 16px; }

.tl-meta { font-size: 12.5px; color: var(--muted); }
.tiles-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 720px) {

  .btn-hero, .home-actions .btn-big { min-width: 0; width: 100%; }

 * ViewBoard – the kiosk board (?page=board&area=WH1).
 * One row per QRAP like the paper board: number · problem · status / "čeká na" · progress 1–7.
 * Newest at the bottom; the list starts scrolled to the bottom and loads older rows when scrolled up.
 */
App.views.board = (() => {
  const PAGE = 40;
  const S = { area: '', filter: 'open', rows: [], hasMore: false, loading: false, timer: null, list: null, pendingBtn: null, sub: null };

  function render(root, params, extra) {
    S.area = String(params.area || defaultArea()).toUpperCase();
    S.filter = params.filter || 'open';
    S.rows = [];
    S.hasMore = false;
    S.list = h('div', { class: 'board-list', onscroll: onScroll });
    S.sub = h('span', null, S.area + ' · ' + areaName(S.area));
    S.pendingBtn = h('button', { class: 'btn btn-big', onclick: () => showPending() }, t('board.pending', { n: '…' }));
    const filters = tabs(['open', 'today', 'safety', 'all'].map(f => ({ value: f, label: t('board.f.' + f) })), S.filter,
      f => { setUrl({ page: 'board', area: S.area, filter: f }); S.filter = f; load('replace'); });
    const canNew = canCreateIn(S.area);
    addKids(root, [
      pageHead({ title: t('board.title'), sub: S.sub, actions: filters }),
      S.list,
      canNew ? h('div', { class: 'bottombar' }, S.pendingBtn,
        h('button', { class: 'btn btn-primary btn-big', onclick: () => go('new', { area: S.area }) }, t('board.new'))) : null
    ]);
    load('replace').then(() => { if (extra.toast) toast(extra.toast, 'ok', 6000); });
    S.timer = setInterval(() => load('refresh'), 60000);
  }

  function leave() { clearInterval(S.timer); }

  /** mode: replace (first load) · refresh (keep position) · older (prepend when scrolling up) */
  async function load(mode) {
    if (S.loading) return;
    S.loading = true;
    const req = { area: S.area, filter: S.filter, limit: mode === 'refresh' ? Math.max(PAGE, S.rows.length) : PAGE };
    if (mode === 'older' && S.rows.length) req.before = S.rows[0].key;
    const res = await api('apiGetBoard', req);
    S.loading = false;
    if (!res.ok) { showErrors(res); return; }
    S.pendingBtn.textContent = t('board.pending', { n: res.pending });
    S.sub.textContent = S.area + ' · ' + areaName(S.area) + ' · ' + t('board.count', { n: res.total });
    const list = S.list;
    const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
    if (mode === 'older') {
      const before = list.scrollHeight;
      S.rows = res.rows.concat(S.rows);
      S.hasMore = res.hasMore;
      draw();
      list.scrollTop = list.scrollHeight - before + list.scrollTop;
    } else {
      S.rows = res.rows;
      S.hasMore = res.hasMore;

    if (S.hasMore) list.appendChild(h('div', { class: 'board-more' }, t('board.older')));

    S.rows.forEach(r => list.appendChild(rowEl(r)));

  function rowEl(r) {
    const open = () => go('qrap', { id: r.id });
    const meta = [r.zone, r.loc].filter(Boolean).join(' / ') + (r.det ? ' · ' + fmtDT(r.det) : '');
    return h('div', {
      class: 'brow' + (r.late ? ' late' : '') + (FINAL_ST.indexOf(r.st) >= 0 ? ' closed' : ''),

    h('div', { class: 'b-what' }, h('div', { class: 'b-text' }, r.what || t('board.noText')), h('div', { class: 'b-meta' }, meta)),
    h('div', { class: 'b-status' }, statusBadge(r.st),

        fmtDT(d.detected_at || d.created_at), { onClick: () => pick(d), cls: 'draft-item' })))

  }
  function iaFromServer(rows) {
    return rows.map(a => ({ id: a.id, type: a.type, text: a.text, owner_name: a.owner_name, done_at: toLocalInput(a.done_at), remove: false }));
  }

  /** After a save: take the server's truth for ids, status and system fields; keep what is typed elsewhere. */
  function mergeServer(st, step) {
    const S = Wiz.S;
    S.id = st.q.qrap_id;
    S.status = st.q.status;
    S.s3 = st.s3;
    S.can = st.can;
    ['qrap_id', 'status', 'area_code', 's1_done_at', 's2_done_at', 's3_done_at', 'sent_at', 'containment_done_at', 'finder_name']
      .forEach(k => { S.q[k] = st.q[k]; });
    S.roles = st.alerts.map(a => a.role_code);
    S.photos = { WRONG: st.photos.find(p => p.kind === 'WRONG') || null, CORRECT: st.photos.find(p => p.kind === 'CORRECT') || null };
    if (step === 4) S.ia = iaFromServer(st.ia);
  }

  async function render(root, params) {
    Wiz.root = root;
    if (params.id) {
      root.appendChild(loadingEl());
      const res = await api('apiGetWizard', params.id);
      if (!root.isConnected) return;
      clear(root);
      if (!res.ok) { showErrors(res); root.appendChild(h('div', { class: 'empty' }, errText(res.errors[0]))); return; }
      fromServer(res.state, Math.min(5, Math.max(1, Number(params.step) || 1)));
      if (!Wiz.S.can.editQr) { root.appendChild(h('div', { class: 'empty' }, t('err.E_LOCKED'))); return; }
    } else {
      Wiz.S = blank(String(params.area || defaultArea()).toUpperCase());
      if (!canCreateIn(Wiz.S.area)) { root.appendChild(h('div', { class: 'empty' }, t('err.E_FORBIDDEN'))); return; }
    }
    draw();
  }

  /** Draws the whole wizard page for the current step. */
  function draw() {
    const S = Wiz.S;
    const root = clear(Wiz.root);
    root.classList.add('wizard');
    const trail = [boardCrumb(S.area)].concat(S.id && S.status !== 'DRAFT'
      ? [qrapCrumb(S.id), { label: t('wiz.edit') }] : [{ label: S.id || t('wiz.newTitle') }]);
    root.appendChild(pageHead({ crumbs: trail, title: S.id ? S.id : t('wiz.newTitle'), badges: S.status ? statusBadge(S.status) : null }));
    root.appendChild(stepper());
    Wiz.errBox = errorBox();
    root.appendChild(Wiz.errBox);
    Wiz.body = h('div', { class: 'wiz-body' });
    root.appendChild(Wiz.body);
    Wiz.steps[S.step](Wiz.body);
    root.appendChild(navBar());
  }
  Wiz.draw = draw;

  /** 1 Popis — 2 Fotky — 3 Upozornění — 4 Opatření — 5 Kontrola (finished steps are clickable). */
  function stepper() {
    const S = Wiz.S;
    const el = h('div', { class: 'stepper' });
    [1, 2, 3, 4, 5].forEach(n => {
      if (n > 1) el.appendChild(h('div', { class: 'step-line' + (n <= S.step ? ' done' : '') }));
      el.appendChild(h('div', { class: 'step' + (n === S.step ? ' cur' : n < S.step ? ' done' : ''), onclick: n < S.step ? () => goStep(n) : null },
        h('span', { class: 'step-dot' }, n < S.step ? '✓' : String(n)), h('span', { class: 'step-label' }, t('wiz.s' + n))));
    });
    return el;
  }

  /** Bottom bar: back / cancel on the left, "later" and the main button on the right. */
  function navBar() {
    const S = Wiz.S;
    const nav = h('div', { class: 'wiz-nav' });
    nav.appendChild(S.step > 1 ? button(t('btn.back'), () => goStep(S.step - 1), 'ghost', { big: true })
      : button(t('btn.cancel'), cancel, 'ghost', { big: true }));
    nav.appendChild(h('div', { class: 'spacer' }));
    Wiz.laterBtn = null;
    if (S.step === 4) {
      Wiz.laterBtn = button(t('wiz.later'), later, 'ghost', { big: true });
      Wiz.laterBtn.disabled = !S.q.risk_stock_shipped;
      nav.appendChild(Wiz.laterBtn);
    }
    if (S.step < 5) nav.appendChild(button(t('btn.next'), next, 'primary', { big: true }));
    else if (S.status === 'DRAFT') nav.appendChild(button(t('wiz.send'), submit, 'primary', { big: true }));
    else nav.appendChild(button(t('wiz.saveClose'), () => go('qrap', { id: S.id }), 'primary', { big: true }));
    return nav;
  }

  function goStep(n) {
    const S = Wiz.S;
    S.step = n;
    if (S.id) setUrl({ page: 'wizard', id: S.id, step: n });
    draw();
    window.scrollTo(0, 0);
  }
  Wiz.goStep = goStep;

  /** Saves one step on the server. mode: next | later | draft. */
  async function save(step, mode) {
    const S = Wiz.S;
    const res = await api('apiSaveStep', { id: S.id, area: S.area, step: step, mode: mode, data: Wiz.data[step]() });
    if (res.ok) { mergeServer(res.state, step); S.dirty = false; }
    return res;
  }

  async function next() {
    const S = Wiz.S;
    const step = S.step;
    const v = Wiz.validate[step]('next');
    if (!setErrors(Wiz.errBox, v.errors, Wiz.body)) return;
    if (!(await warnConfirm(v.warnings))) return;
    const res = await save(step, 'next');
    if (!res.ok) { showErrors(res, Wiz.errBox, Wiz.body); return; }
    goStep(step + 1);
  }

  /** "Dokončí TL později": needs only the risk answer; ③ can be completed later. */
  async function later() {
    const v = Wiz.validate[4]('later');
    if (!setErrors(Wiz.errBox, v.errors, Wiz.body)) return;
    const res = await save(4, 'later');
    if (!res.ok) { showErrors(res, Wiz.errBox, Wiz.body); return; }
    goStep(5);
  }

  async function submit() {
    const S = Wiz.S;
    const errs = Wiz.validate[5]();
    if (!setErrors(Wiz.errBox, errs)) return;
    const res = await api('apiSubmitQrap', S.id);
    if (!res.ok) { showErrors(res, Wiz.errBox); return; }
    go('home', { area: S.area }, { extra: { toast: t('wiz.sent', { id: S.id }) } });
  }

  async function cancel() {
    const S = Wiz.S;
    if (S.dirty && !(await confirmDlg(t('wiz.leaveUnsaved'), t('btn.leave'), 'danger'))) return;
    go(S.id ? 'qrap' : 'home', S.id ? { id: S.id } : { area: S.area });
  }

  /** Kiosk idle timeout: save what was typed as a draft, then back to the board. */
  async function onIdle() {
    const S = Wiz.S;
    const step = S ? S.step : 0;
    const hasText = S && (S.id || S.q.what || S.q.safety);
    if (S && S.dirty && hasText && step >= 1 && step <= 4) {
      const res = await save(step, 'draft');
      toast(res.ok ? t('wiz.idleSaved', { id: S.id }) : t('wiz.idleNotSaved'), res.ok ? 'ok' : 'warn', 7000);
    }
    go('home', { area: S ? S.area : defaultArea() });
  }

  return { render: render, onIdle: onIdle, leave: () => {} };
})();

/** "Stejný problém v posledních 7 dnech? = ANO": suggestions + manual number. */
Wiz.repeatPicker = async function (box) {

  <script>
'use strict';
/*
 * ViewWizardSteps – wizard steps 3 (② upozornění), 4 (③ okamžitá opatření), 5 (kontrola a odeslání)
 * and the browser-side checks of every step. The server repeats every check (never trust the browser).
 */

// ---------------------------------------------------------------- step 3: ② kdo byl upozorněn?

Wiz.steps[3] = function (body) {
  const S = Wiz.S;
  const riskAno = S.q.risk_stock_shipped === 'ANO';
  if (riskAno && S.roles.indexOf('QUALITY') < 0) S.roles.push('QUALITY');
  const other = field(t('f.alert_other'), textInput(S.other_text, v => { S.other_text = v; S.dirty = true; }, { max: 200 }),
    { name: 'alert_other', required: true });
  other.hidden = S.roles.indexOf('OTHER') < 0;
  const options = listItems('ALERT_ROLE').map(o => Object.assign(o, { locked: riskAno && o.value === 'QUALITY' }));
  addKids(body, [
    formGroup(t('sec.2'),
      field(t('f.roles'), multiToggle(options, S.roles, v => { S.roles = v; S.dirty = true; other.hidden = v.indexOf('OTHER') < 0; }),
        { name: 'roles', required: true, hint: t('wiz.alertHint') }),
      riskAno ? h('div', { class: 'note' }, t('wiz.qualityAuto')) : null,
      other)
  ]);
};

// ---------------------------------------------------------------- step 4: ③ okamžitá opatření <24h

Wiz.steps[4] = function (body) {
  const S = Wiz.S;
  const q = S.q;
  const set = k => v => { q[k] = v; S.dirty = true; };
  if (!S.ia.some(a => !a.remove)) S.ia.push({ id: '', type: '', text: '', owner_name: '', done_at: '', remove: false });

  const checkBox = h('div');
  const drawCheck = () => {
    clear(checkBox);
    if (q.risk_stock_shipped !== 'ANO') return;
    addKids(checkBox, [
      h('div', { class: 'note' }, t('wiz.riskAno')),
      formGrid(
        field(t('f.checked_qty'), numInput(q.checked_qty, set('checked_qty')), { name: 'checked_qty' }),
        field(t('f.wrong_found_qty'), numInput(q.wrong_found_qty, set('wrong_found_qty')), { name: 'wrong_found_qty' })),
      checkbox(t('f.check_in_progress'), q.check_in_progress, set('check_in_progress'))
    ]);
  };
  drawCheck();

  const iaBox = h('div');
  const drawIa = () => {
    clear(iaBox);
    S.ia.filter(a => !a.remove).forEach((a, i) => iaBox.appendChild(iaRow(a, i + 1)));
    iaBox.appendChild(button(t('wiz.addAction'), () => {
      S.ia.push({ id: '', type: '', text: '', owner_name: '', done_at: '', remove: false });
      S.dirty = true;
      drawIa();
    }, 'ghost'));
  };
  function iaRow(a, n) {
    const upd = k => v => { a[k] = v; S.dirty = true; };
    const doneIn = dtInput(a.done_at, upd('done_at'), nowLocalInput());
    return h('div', { class: 'ia-row' },
      h('div', { class: 'ia-head' }, h('span', { class: 'ia-title' }, t('wiz.actionN', { n: n })),
        button(t('btn.remove'), () => {
          if (a.id) a.remove = true; else S.ia.splice(S.ia.indexOf(a), 1);
          S.dirty = true;
          drawIa();
        }, 'link')),
      formGrid(
        field(t('f.ia_type'), selectEl(listItems('ACTION_TYPE'), a.type, upd('type')), { name: 'ia' + n + '_type' }),
        field(t('f.ia_owner'), personSelect(a.owner_name, upd('owner_name'), S.area), { name: 'ia' + n + '_owner_name' })),
      field(t('f.ia_text'), textInput(a.text, upd('text'), { max: 500, placeholder: t('wiz.actionTextHint') }), { name: 'ia' + n + '_text' }),
      formGrid(
        field(t('f.ia_done'), withButton(doneIn,
          button(t('btn.doneNow'), () => { a.done_at = nowLocalInput(); doneIn.value = a.done_at; S.dirty = true; })),
        { name: 'ia' + n + '_done', hint: t('wiz.doneHint') }),
        h('div')));
  }
  drawIa();

  const restored = field(t('f.restored_at'), withButton(dtInput(q.restored_at, set('restored_at'), nowLocalInput()),
    button(t('btn.now'), () => { q.restored_at = nowLocalInput(); S.dirty = true; Wiz.draw(); })),

  addKids(body, [

      formGrid(

        h('div')),
      checkBox),
    formGroup(t('f.ia'), iaBox),
    formGroup(t('wiz.g.process'),
      formGrid(
        field(t('f.process_stopped'), yesNo(q.process_stopped, v => { q.process_stopped = v; S.dirty = true; restored.hidden = v !== 'ANO'; },
          { lower: true }), { name: 'process_stopped', required: true }),
        restored)),
    h('p', { class: 'fld-hint' }, t('wiz.laterHint'))
  ]);
};

/** Which ③ rules are not met yet (same codes as section3State_ on the server). */
Wiz.s3Missing = function () {
  const q = Wiz.S.q;
  const ia = Wiz.S.ia.filter(a => !a.remove);
  const m = [];
  const blank = v => v === '' || v === undefined || v === null;
  if (!q.risk_stock_shipped) m.push('RISK');
  if (q.risk_stock_shipped === 'ANO') {
    if (q.check_in_progress) m.push('CHECK_IN_PROGRESS');
    else if (blank(q.checked_qty) || blank(q.wrong_found_qty)) m.push('CHECK_DATA');
  }
  if (!ia.length) m.push('NO_ACTION');
  else if (ia.some(a => !a.done_at)) m.push('ACTION_OPEN');
  if (!q.process_stopped) m.push('PROCESS');
  else if (q.process_stopped === 'ANO' && !q.restored_at) m.push('NOT_RESTORED');
  return m;
};

// ---------------------------------------------------------------- step 5: kontrola a odeslání

Wiz.steps[5] = function (body) {
  const S = Wiz.S;
  const q = S.q;
  const edit = n => h('div', { class: 'btn-row' }, button(t('btn.edit'), () => Wiz.goStep(n), 'link'));
  const miss = Wiz.s3Missing();
  const thumbs = h('div', { class: 'thumbs' }, ['WRONG', 'CORRECT'].map(k => {
    const p = S.photos[k];
    if (!p) return null;
    const img = h('img', { alt: t('wiz.photo' + k) });
    loadPhoto(p.thumb_file_id, img);
    return h('div', { class: 'thumb thumb-' + k.toLowerCase() }, h('b', null, t('wiz.photo' + k)), img);
  }));
  addKids(body, [
    h('p', { class: 'fld-hint' }, t('wiz.checkHint')),
    sectionCard('1', t('sec.1'), 'op', kvList([
      [t('f.safety'), yn(q.safety, true)],
      [t('f.what'), q.what],
      [t('f.how_found'), q.how_found === 'OTHER' ? t('lbl.other') + ': ' + (q.how_found_other || '') : listLabel('HOW_FOUND', q.how_found)],
      [t('f.detected_at'), fmtDT(localToMs(q.detected_at))],
      [t('f.where'), [q.zone, q.location_code].filter(Boolean).join(' / ')],
      [t('f.qty'), q.qty === '' || q.qty === undefined ? '' : q.qty + ' ' + listLabel('UNIT', q.unit) + (q.nok_situation ? ' · ' + t('f.nok_situation') : '')],
      [t('f.repeat_7d'), q.repeat_7d === 'ANO' ? t('lbl.yes') + ' → ' + (q.repeat_ref || '?') : yn(q.repeat_7d)],
      [t('f.finder_name'), [q.finder_name, q.finder_badge].filter(Boolean).join(' · ')],
      [t('f.material_no'), q.material_no], [t('f.hu_or_delivery_no'), q.hu_or_delivery_no], [t('f.supplier'), q.supplier]
    ]), thumbs, q.photoExc ? h('p', null, h('b', null, t('f.photo_exception') + ': '), q.photo_exception) : null, edit(1)),
    sectionCard('2', t('sec.2'), 'op', h('p', null, S.roles.map(r => listLabel('ALERT_ROLE', r)).join(', ') || '–',
      S.other_text && S.roles.indexOf('OTHER') >= 0 ? ' (' + S.other_text + ')' : ''), edit(3)),
    sectionCard('3', t('sec.3'), 'op', kvList([
      [t('f.risk_stock_shipped'), yn(q.risk_stock_shipped)],
      [t('f.check'), q.risk_stock_shipped === 'ANO' ? (q.check_in_progress ? t('f.check_in_progress') :
        (q.checked_qty || 0) + ' / ' + (q.wrong_found_qty || 0) + ' ' + t('lbl.pcs')) : ''],
      [t('f.process_stopped'), yn(q.process_stopped, true) + (q.restored_at ? ' → ' + fmtDT(localToMs(q.restored_at)) : '')]
    ]), table([t('f.ia_type'), t('f.ia_text'), t('f.ia_owner'), t('f.ia_done')], S.ia.filter(a => !a.remove).map(a =>
      [listLabel('ACTION_TYPE', a.type), a.text, a.owner_name, a.done_at ? fmtDT(localToMs(a.done_at)) : t('lbl.open')])),
    miss.length ? h('div', { class: 'warnbox' }, t('wiz.s3Later') + ' ' + miss.map(m => t('s3.' + m)).join(', '))
      : h('div', { class: 'okbox' }, t('wiz.s3Complete')), edit(4)),
    S.status === 'DRAFT' ? h('p', { class: 'muted' }, t('wiz.sendHint')) : null
  ]);
};

// ---------------------------------------------------------------- checks (mirror of the server rules)

Wiz.validate[1] = function () {
  const q = Wiz.S.q;
  const e = [];
  const w = [];
  const req = f => e.push({ code: 'E_REQUIRED', field: f });
  if (!q.safety) req('safety');
  const what = String(q.what || '').trim();
  if (!what) req('what'); else if (what.length < 10) w.push({ code: 'W_WHAT_SHORT' });
  if (!q.how_found) req('how_found');
  else if (q.how_found === 'OTHER' && !String(q.how_found_other || '').trim()) req('how_found_other');
  const det = localToMs(q.detected_at);
  if (!q.detected_at || isNaN(det)) req('detected_at');
  else if (det > Date.now() + 5 * 60000) e.push({ code: 'E_FUTURE', field: 'detected_at' });
  else if (det < Date.now() - 24 * 3600000) w.push({ code: 'W_OLD_DETECTION' });
  if (!q.zone) req('zone');
  if (!q.location_code) req('location_code');
  if (q.qty === '' || q.qty === undefined) req('qty');
  else if (!Number.isInteger(q.qty) || q.qty < 0) e.push({ code: 'E_INVALID', field: 'qty' });
  else if (q.qty === 0 && !q.nok_situation) e.push({ code: 'E_QTY_ZERO', field: 'qty' });
  else if (q.qty > 0 && !q.unit) req('unit');
  if (!q.repeat_7d) req('repeat_7d');
  else if (q.repeat_7d === 'ANO' && !q.repeat_ref) e.push({ code: 'E_REPEAT_REF', field: 'repeat_ref' });
  if (!q.finder_name && !String(q.finder_badge || '').trim()) req('finder_name');
  return { errors: e, warnings: w };
};

Wiz.validate[2] = function () {
  const S = Wiz.S;
  const e = [];
  const photos = S.photos.WRONG && S.photos.CORRECT;
  if (!photos) {
    if (!S.q.photoExc) e.push({ code: 'E_PHOTOS' });
    else if (String(S.q.photo_exception || '').trim().length < 3) e.push({ code: 'E_REQUIRED', field: 'photo_exception' });
  }
  return { errors: e, warnings: [] };
};

Wiz.validate[3] = function () {
  const S = Wiz.S;
  const e = [];
  if (!S.roles.length) e.push({ code: 'E_ALERT_NONE' });
  if (S.roles.indexOf('OTHER') >= 0 && !String(S.other_text || '').trim()) e.push({ code: 'E_REQUIRED', field: 'alert_other' });
  return { errors: e, warnings: [] };
};

Wiz.validate[4] = function (mode) {
  const q = Wiz.S.q;
  const e = [];
  const num = v => v !== '' && v !== undefined && v !== null;
  if (!q.risk_stock_shipped) e.push({ code: 'E_REQUIRED', field: 'risk_stock_shipped' });
  if (num(q.checked_qty) && num(q.wrong_found_qty) && q.wrong_found_qty > q.checked_qty) {
    e.push({ code: 'E_WRONG_GT_CHECKED', field: 'wrong_found_qty' });
  }
  const det = localToMs(q.detected_at);
  if (q.process_stopped === 'ANO' && q.restored_at && localToMs(q.restored_at) < det) {
    e.push({ code: 'E_RESTORED_BEFORE', field: 'restored_at' });
  }
  Wiz.S.ia.filter(a => !a.remove).forEach((a, i) => {
    const n = i + 1;
    if (!a.type) e.push({ code: 'E_IA_ROW', row: n, field: 'ia' + n + '_type' });
    if (!String(a.text || '').trim()) e.push({ code: 'E_IA_ROW', row: n, field: 'ia' + n + '_text' });
    if (!a.owner_name) e.push({ code: 'E_IA_ROW', row: n, field: 'ia' + n + '_owner_name' });
    if (a.done_at) {
      const d = localToMs(a.done_at);
      if (d > Date.now() + 5 * 60000) e.push({ code: 'E_IA_DONE_FUTURE', row: n, field: 'ia' + n + '_done' });
      else if (d < det) e.push({ code: 'E_IA_DONE_BEFORE', row: n, field: 'ia' + n + '_done' });
    }
  });
  if (mode === 'next' && !e.length) {
    const miss = Wiz.s3Missing();
    if (miss.length) e.push({ code: 'E_S3_INCOMPLETE', missing: miss });
  }
  return { errors: e, warnings: [] };
};

/** Before "Odeslat". Returns a list of errors. */
Wiz.validate[5] = function () {
  const S = Wiz.S;
  const e = [];
  if (!S.q.s1_done_at) e.push({ code: 'E_S1_INCOMPLETE' });
  e.push.apply(e, Wiz.validate[2]().errors);
  e.push.apply(e, Wiz.validate[3]().errors);
  if (!S.q.risk_stock_shipped) e.push({ code: 'E_REQUIRED', field: 'risk_stock_shipped' });
  return e;
};

Wiz.data[3] = () => ({ roles: Wiz.S.roles.slice(), other_text: Wiz.S.other_text || '' });
Wiz.data[4] = () => {
  const q = Wiz.S.q;
  const val = v => (v === undefined || v === null ? '' : v);
  return {
    risk_stock_shipped: val(q.risk_stock_shipped), checked_qty: val(q.checked_qty), wrong_found_qty: val(q.wrong_found_qty),
    check_in_progress: !!q.check_in_progress, process_stopped: val(q.process_stopped), restored_at: val(q.restored_at),
    actions: Wiz.S.ia.filter(a => a.id || a.type || a.text || a.owner_name).map(a => ({ id: a.id, type: a.type, text: a.text,
      owner_name: a.owner_name, done_at: a.done_at, remove: a.remove }))
  };
};

  <script>
'use strict';
/*
 * ViewQrap – detail of one QRAP (?page=qrap&id=…).
 * Top card: the problem, key facts, a 1–7 jump bar, the next action (one blue button) and the QR code
 * for the supervisor's phone. Below: the 7 sections in the order of the paper row, then the admin tools.
 */
App.views.qrap = (() => {
  let tab = 'overview';

  async function render(root, params) {
    const d = await loadDetail(root, params.id);
    if (!d) return;
    const q = d.q;
    const body = h('div');
    const show = key => {
      tab = key;
      clear(body);
      if (key === 'paper') addKids(body, [paperForm(d)]);
      else if (key === 'history') addKids(body, [historyCard(d)]);
      else addKids(body, [sec1(d), sec2(d), sec3(d), sec4(d), sec5(d), sec6(d), sec7(d), adminBox(d)]);
    };
    addKids(root, [
      pageHead({
        crumbs: [boardCrumb(q.area_code), { label: q.qrap_id }],
        title: q.qrap_id,
        badges: [statusBadge(q.status)].concat(qrapTags(q.safety === 'ANO', q.repeat_7d === 'ANO', q.archived === true))
      }),
      topCard(d),
      h('div', { class: 'tab-bar' }, tabs([{ value: 'overview', label: t('qtab.overview') }, { value: 'paper', label: t('qtab.paper') },
        { value: 'history', label: t('qtab.history') }], tab, show)),
      body
    ]);
    show(tab);
  }

  // ---------------------------------------------------------------- paper view (like the A1 sheet row)

  /** The QRAP laid out like one row of the paper board: 7 columns, left to right. */
  function paperForm(d) {
    const q = d.q;
    const line = (label, value) => value === '' || value === null || value === undefined ? null
      : h('div', { class: 'pp-line' }, h('span', { class: 'pp-l' }, label), h('span', { class: 'pp-v' }, value));
    const col = (n, title, ...content) => h('div', { class: 'pp-col' }, h('div', { class: 'pp-head' }, h('span', { class: 'pp-num' }, n), title),
      h('div', { class: 'pp-body' }, content.filter(Boolean).length ? content : h('span', { class: 'muted' }, '—')));
    const na = q.status === 'CLOSED_SOLVED' || q.status === 'ESCALATED';
    const acts = d.actions.filter(a => a.status !== 'REMOVED');
    const whys = d.why.filter(w => w.chain === 'OCCURRENCE' && w.text).sort((a, b) => a.step - b.step);
    const a = d.assess[0];
    const photo = kind => {
      const p = d.photos.find(x => x.kind === kind);
      if (!p) return null;
      const img = h('img', { alt: '' });
      loadPhoto(p.thumb_file_id, img);
      return h('div', { class: 'pp-photo pp-photo-' + kind.toLowerCase() }, img, h('span', null, t('wiz.photo' + kind)));
    };
    return h('div', { class: 'card paper-card' },
      h('div', { class: 'paper-top' }, h('b', null, 'QRAP ' + q.qrap_id), h('span', { class: 'muted' }, q.template_version)),
      h('div', { class: 'paper-bands' },
        h('div', { class: 'band', style: { gridColumn: 'span 3' } }, t('paper.band1')),
        h('div', { class: 'band' }, t('paper.band2')),
        h('div', { class: 'band', style: { gridColumn: 'span 2' } }, t('paper.band3')),
        h('div', { class: 'band' }, t('paper.band4'))),
      h('div', { class: 'paper' },
        col('1', t('sec.1'),
          line('SAFETY', yn(q.safety, true)), line(t('f.what'), q.what), line(t('f.how_found'), listLabel('HOW_FOUND', q.how_found)),
          line(t('f.detected_at'), fmtDT(q.detected_at)), line(t('f.where'), [q.zone, q.location_code].filter(Boolean).join(' / ')),
          line(t('f.qty'), q.qty === '' ? '' : q.qty + ' ' + listLabel('UNIT', q.unit)),
          line(t('paper.repeat'), q.repeat_7d === 'ANO' ? t('lbl.yes') + ' → ' + q.repeat_ref : yn(q.repeat_7d)),
          line(t('f.finder_name'), q.finder_name), line(t('f.material_no'), q.material_no),
          h('div', { class: 'pp-photos' }, photo('WRONG'), photo('CORRECT'))),
        col('2', t('sec.2'), d.alerts.length ? h('ul', { class: 'pp-list' }, d.alerts.map(x => h('li', null, '☑ ' + listLabel('ALERT_ROLE', x.role_code)))) : null),
        col('3', t('sec.3'),
          line(t('paper.risk'), yn(q.risk_stock_shipped)),
          line(t('paper.check'), q.checked_qty === '' ? '' : q.checked_qty + ' / ' + q.wrong_found_qty + ' ' + t('lbl.pcs')),
          d.ia.length ? h('ul', { class: 'pp-list' }, d.ia.map(x => h('li', null, x.text, h('div', { class: 'pp-sub' },
            x.owner_name + (x.done_at ? ' · ' + fmtDT(x.done_at) : ' · ' + t('lbl.open')))))) : null,
          line(t('paper.restart'), q.process_stopped === 'ANO' ? fmtDT(q.restored_at) || '—' : yn(q.process_stopped, true))),
        col('4', t('sec.4'),
          line(t('paper.shifts'), App.set.shifts.map(sh => (d.shiftInfo.some(x => x.shift_code === sh.code) ? '☑ ' : '☐ ') + sh.name).join('  ')),
          line(t('f.decision'), q.decision ? t('dec.' + q.decision) : ''), line(t('f.decision_comment'), q.decision_comment),
          line(t('f.assign_ref'), q.assign_ref), line(t('paper.sign'), q.decided_by ? personName(q.decided_by) + ' · ' + fmtDT(q.decided_at) : '')),
        col('5', t('sec.5'), na ? h('span', { class: 'muted' }, t('paper.na')) : whys.length ? h('ol', { class: 'pp-list' }, whys.map(w =>
          h('li', { class: w.is_root === true ? 'why-root' : '' }, w.text))) : null),
        col('6', t('sec.6'), na ? h('span', { class: 'muted' }, t('paper.na')) : null,
          !na ? line(t('f.learned'), q.learned) : null,
          !na && acts.length ? h('ul', { class: 'pp-list' }, acts.map(x => h('li', null, x.text, h('div', { class: 'pp-sub' },
            x.pilot_name + ' · ' + t('f.planned') + ' ' + fmtD(x.planned) + (x.done ? ' · ' + t('f.done') + ' ' + fmtD(x.done) : ''))))) : null,
          !na ? line(t('paper.eff'), d.eff.slots.map(x => x && x.result === 'EFFECTIVE' ? '●' : '○').join(' ')) : null,
          !na ? line(t('paper.std'), q.std_update ? yn(q.std_update) + (q.std_update_ref ? ' → ' + q.std_update_ref : '') : '') : null,
          !na ? line(t('paper.closed'), q.closed_by && q.status === 'CLOSED' ? personName(q.closed_by) + ' · ' + fmtDT(q.closed_at) : '') : null),
        col('7', t('sec.7'), a ? h('div', null,
          h('ul', { class: 'pp-list' }, [1, 2, 3, 4, 5].map(n => h('li', null, t('assess.c' + n) + ': ' + t('assessVal.' + a['c' + n])))),
          line(t('paper.who'), personName(a.assessor) + ' · ' + fmtDT(a.at)), line(t('f.feedback'), a.feedback)) : null)));
  }

  // ---------------------------------------------------------------- history (timeline)

  /** Everything that happened to this QRAP, in time order, built from the saved data. */
  function historyCard(d) {
    const q = d.q;
    const ev = [];
    const add = (at, who, text) => { if (at) ev.push({ at: at, who: who || '', text: text }); };
    add(q.created_at, q.created_by, t('hist.created'));
    d.photos.forEach(p => add(p.uploaded_at, p.uploaded_by, t('hist.photo', { kind: t('wiz.photo' + p.kind) })));
    add(q.sent_at, '', t('hist.sent'));
    d.ia.forEach(x => add(x.done_at, x.owner_name, t('hist.iaDone', { text: x.text })));
    add(q.containment_done_at, '', t('hist.containment'));
    d.shiftInfo.forEach(x => add(x.informed_at, x.informed_by, t('hist.shift', { shift: shiftName(x.shift_code) })));
    add(q.decided_at, q.decided_by, t('hist.decision', { d: q.decision ? t('dec.' + q.decision) : '' }) + (q.decision_comment ? ' – „' + q.decision_comment + '“' : ''));
    d.pilots.forEach(p => add(p.assigned_at, '', t('hist.pilot', { name: p.name })));
    d.actions.forEach(x => {
      add(x.created_at, x.created_by, t('hist.action', { text: x.text }));
      (x.notes || []).forEach(n => add(n.at, n.author, t('hist.note', { text: n.note })));
    });
    d.eff.history.forEach(x => add(x.checked_at, x.checked_by, t('hist.eff', { n: x.slot, r: t('eff.' + x.result), shift: shiftName(x.shift_code) })));
    d.assess.forEach(x => add(x.at, x.assessor, t('hist.assess')));
    if (q.status === 'CLOSED' || q.status === 'CLOSED_SOLVED') add(q.closed_at, q.closed_by, t('hist.closed'));
    ev.sort((a, b) => (a.at < b.at ? -1 : 1));
    return card(t('qtab.history'), h('div', { class: 'timeline' }, ev.map(e => h('div', { class: 'tl-item' },
      h('div', { class: 'tl-dot' }),
      h('div', { class: 'tl-body' }, h('div', { class: 'tl-text' }, e.text),
        h('div', { class: 'tl-meta' }, fmtDT(e.at) + (e.who ? ' · ' + (e.who.indexOf('@') > 0 ? personName(e.who) : e.who) : '')))))),
    h('p', { class: 'fld-hint' }, t('hist.hint')));
  }

  function topCard(d) {
    const q = d.q;
    const facts = [
      [t('f.area'), q.area_code + ' · ' + areaName(q.area_code)],
      [t('meta.when'), fmtDT(q.detected_at)],
      d.waiting ? [t('board.col.wait'), t('wait.' + d.waiting)] : null,
      q.level && q.level !== 'AREA' ? [t('f.level'), q.level] : null,
      q.parent_id ? [t('f.parent_id'), qrapLink(q.parent_id)] : null,
      q.assign_ref ? [t('f.assign_ref'), qrapLink(q.assign_ref)] : null
    ].filter(Boolean);
    return h('div', { class: 'card qhead' },
      h('div', null,
        h('div', { class: 'qhead-what' }, q.what || t('board.noText')),
        h('div', { class: 'meta' }, facts.map(f => h('span', null, f[0] + ': ', h('b', null, f[1])))),
        sectionNav(d),
        actionButtons(d)),
      h('div', { class: 'qr-box' }, qrCode(d.links.decide), t('qrap.qrShort')));
  }

  /** 1–7 jump bar: each item shows the state of the section and scrolls to it. */
  function sectionNav(d) {
    return h('div', { class: 'pnav' }, d.chips.map((c, i) => h('button', {
      type: 'button', class: 'pnav-item', title: t('chipState.' + c),
      onclick: () => { const el = byId('sec-' + (i + 1)); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }, h('span', { class: 'chip chip-' + c }, String(i + 1)), t('secShort.' + (i + 1)))));
  }

  /** What this user may do next. The most relevant action is the blue button, the rest are secondary. */
  function actionButtons(d) {
    const q = d.q;
    const c = d.can;
    const id = q.qrap_id;
    const list = [];
    const add = (label, fn, main) => list.push({ label: label, fn: fn, main: !!main });
    if (c.editQr && q.status === 'DRAFT') add(t('qrap.continue'), () => go('wizard', { id: id, step: 1 }), true);
    if (c.editQr && q.status !== 'DRAFT' && !d.s3.complete) add(t('qrap.finishS3'), () => go('wizard', { id: id, step: 4 }), true);
    if (c.decide || c.shiftInfo) add(t('qrap.decide'), () => go('decide', { id: id }), c.decide);
    if (['ANALYSIS', 'ACTIONS_OPEN', 'VERIFY', 'CLOSED'].indexOf(q.status) >= 0) {
      add(t('qrap.analysis'), () => go('analysis', { id: id }), c.analyze && q.status !== 'VERIFY');
    }
    if (c.effect) add(t('qrap.effect'), () => go('effect', { id: id }), !d.closure.ok);
    if (c.close) add(t('qrap.close'), () => go('close', { id: id }), d.closure.ok);
    if (c.assess) add(t('qrap.assess'), () => go('assess', { id: id }));
    if (c.editQr && q.status !== 'DRAFT') add(t('qrap.editQr'), () => go('wizard', { id: id, step: 1 }));
    if (!list.length) return null;
    const main = list.findIndex(x => x.main);
    return h('div', { class: 'btn-row' }, list.map((x, i) => button(x.label, x.fn, i === main ? 'primary' : 'ghost')));
  }

  function sec1(d) {
    const q = d.q;
    return sectionCard('1', t('sec.1'), 'op', kvList([
      [t('f.safety'), yn(q.safety, true)],
      [t('f.what'), q.what],
      [t('f.how_found'), listLabel('HOW_FOUND', q.how_found)],
      [t('f.detected_at'), fmtDT(q.detected_at)],
      [t('f.where'), [q.zone, q.location_code].filter(Boolean).join(' / ')],
      [t('f.origin_zone'), q.origin_zone],
      [t('f.qty'), q.qty === '' ? '' : q.qty + ' ' + listLabel('UNIT', q.unit) + (q.nok_situation === true ? ' · ' + t('f.nok_situation') : '')],
      [t('f.repeat_7d'), q.repeat_7d === 'ANO' ? h('span', null, t('lbl.yes') + ' → ', qrapLink(q.repeat_ref)) : yn(q.repeat_7d)],
      [t('f.finder_name'), [q.finder_name, q.finder_badge].filter(Boolean).join(' · ')],
      [t('f.material_no'), q.material_no], [t('f.hu_or_delivery_no'), q.hu_or_delivery_no], [t('f.supplier'), q.supplier],
      [t('f.sent_at'), fmtDT(q.sent_at)]
    ]), photos(d), q.photo_exception ? h('div', { class: 'note' }, h('b', null, t('f.photo_exception') + ': '), q.photo_exception) : null);
  }

  function photos(d) {
    const items = ['WRONG', 'CORRECT'].map(kind => {
      const p = d.photos.find(x => x.kind === kind);
      if (!p) return null;
      const img = h('img', { alt: t('wiz.photo' + kind) });
      loadPhoto(p.thumb_file_id, img);
      return h('div', { class: 'thumb thumb-' + kind.toLowerCase(), onclick: () => showPhoto(p.file_id, t('wiz.photo' + kind)) },
        h('b', null, t('wiz.photo' + kind)), img);
    }).filter(Boolean);
    return items.length ? h('div', { class: 'thumbs' }, items) : null;
  }

  function sec2(d) {
    return sectionCard('2', t('sec.2'), 'op', d.alerts.length ? table([t('f.role'), t('f.notified_to'), t('f.at')], d.alerts.map(a => [

      if (!res.ok) { showErrors(res); return; }
      toast(t('msg.saved'), 'ok');

  <script>
'use strict';
/*
 * ViewDecide – supervisor pages for the phone.
 *   ?page=decide&id=…  ④ Rozhodnutí OJT: shift ticks, one decision, pilots, comment, signature.
 *   ?page=close&id=…   Uzavření: closure checklist + signature.
 * The server checks every guard again; the page only shows them early.
 */
App.views.decide = (() => {
  let D = null;       // detail from the server
  let form = null;    // {decision, comment, pilots[]}

  async function render(root, params) {
    D = await loadDetail(root, params.id);
    if (!D) return;
    form = { decision: '', comment: '', pilots: [] };
    draw(root);
  }

  function draw(root) {
    const q = D.q;
    clear(root);
    addKids(root, [
      pageHead({ crumbs: [boardCrumb(q.area_code), qrapCrumb(q.qrap_id), { label: t('qrap.decide') }], title: t('dec.title'),
        badges: [statusBadge(q.status)].concat(qrapTags(q.safety === 'ANO', q.repeat_7d === 'ANO')), sub: q.qrap_id }),
      summary(),
      shiftsCard(),
      q.decision ? decidedCard() : decisionCard(),
      h('div', { class: 'btn-row' },
        button(t('qrap.detail'), () => go('qrap', { id: q.qrap_id }), 'ghost'),
        D.can.assess ? button(t('qrap.assess'), () => go('assess', { id: q.qrap_id }), 'ghost') : null,
        D.can.close ? button(t('qrap.close'), () => go('close', { id: q.qrap_id }), 'ghost') : null,
        D.can.analyze ? button(t('qrap.analysis'), () => go('analysis', { id: q.qrap_id }), 'ghost') : null)
    ]);
  }

  /** Short facts of ①–③ so the supervisor can decide at the board. */
  function summary() {
    const q = D.q;
    const photos = D.photos.filter(p => p.kind !== 'DOC').map(p => {
      const img = h('img', { alt: '' });
      loadPhoto(p.thumb_file_id, img);
      return h('div', { class: 'thumb thumb-' + p.kind.toLowerCase(), onclick: () => showPhoto(p.file_id) }, h('b', null, t('wiz.photo' + p.kind)), img);
    });
    return card(t('dec.summary'),
      h('p', { style: { fontSize: '16px', fontWeight: '600', margin: '0 0 8px' } }, q.what),
      kvList([
        [t('f.detected_at'), fmtDT(q.detected_at)],
        [t('f.where'), [q.zone, q.location_code].filter(Boolean).join(' / ')],
        [t('f.qty'), q.qty === '' ? '' : q.qty + ' ' + listLabel('UNIT', q.unit)],
        [t('f.repeat_7d'), q.repeat_7d === 'ANO' ? h('span', null, t('lbl.yes') + ' → ', qrapLink(q.repeat_ref)) : yn(q.repeat_7d)],
        [t('f.risk_stock_shipped'), yn(q.risk_stock_shipped)],
        [t('f.wrong_found_qty'), q.wrong_found_qty === '' ? '' : String(q.wrong_found_qty)],
        [t('f.finder_name'), q.finder_name]
      ]),
      photos.length ? h('div', { class: 'thumbs' }, photos) : null,
      D.s3.complete ? h('div', { class: 'okbox' }, t('wiz.s3Complete'))
        : h('div', { class: 'warnbox' }, t('dec.s3Missing') + ' ' + D.s3.missing.map(m => t('s3.' + m)).join(', ')));
  }

  /** "Informace všem směnám během 5' meetingu" – one row per shift. */
  function shiftsCard() {
    const q = D.q;
    const rows = App.set.shifts.map(s => {
      const r = D.shiftInfo.find(x => x.shift_code === s.code);
      const side = r ? h('span', null, mark(true), ' ' + personName(r.informed_by) + ' · ' + fmtDT(r.informed_at))
        : D.can.shiftInfo ? button(t('dec.shiftMark'), async () => {
          const res = await api('apiSaveShiftInfo', { id: q.qrap_id, shift_code: s.code });
          if (!res.ok) { showErrors(res); return; }
          D.shiftInfo = res.shiftInfo;
          draw(byId('app'));
        }, 'ghost') : h('span', { class: 'muted' }, '–');
      return listRow(h('b', null, s.name), side, { cls: 'shift-row' });
    });
    return card(t('f.shiftInfo'), h('div', { class: 'list' }, rows),
      !D.can.shiftInfo && !q.decision ? h('p', { class: 'small muted' }, t('dec.shiftNoRight')) : null);
  }

  function decisionCard() {
    const q = D.q;
    const box = errorBox();
    if (!D.can.decide) {
      const why = App.user.isKiosk ? t('err.E_KIOSK_SIGN') : q.status !== 'WAIT_DECISION' ? t('dec.notReady') : t('dec.noRight');
      return card(t('f.decision'), h('div', { class: 'note' }, why));
    }
    const opt = (value, sub, disabled) => h('button', {
      type: 'button', class: 'dec-opt' + (form.decision === value ? ' on' : ''), disabled: disabled, role: 'radio',
      'aria-checked': String(form.decision === value), onclick: () => { form.decision = value; draw(byId('app')); }
    }, h('span', { class: 'radio' }), h('span', null, h('span', { class: 'dec-opt-title' }, t('dec.' + value)), h('span', { class: 'dec-opt-sub' }, sub)));
    const parent = D.parentArea;
    const existing = D.pilots.map(p => p.email);
    const pilotBox = form.decision === 'CONTINUE' ? h('div', null,
      existing.length ? h('p', { class: 'small' }, t('f.pilots') + ': ' + D.pilots.map(p => p.name).join(', ')) : null,
      field(t('dec.addPilot'), multiToggle(App.set.people.filter(p => p.email && p.roles.indexOf('KIOSK') < 0 && existing.indexOf(p.email) < 0)
        .sort((a, b) => (b.roles.indexOf('PILOT') >= 0) - (a.roles.indexOf('PILOT') >= 0)) // people with the PILOT role first
        .map(p => ({ value: p.email, label: p.name })), form.pilots, v => { form.pilots = v; }), { name: 'pilots', required: !existing.length })) : null;
    const warn = [];
    if (form.decision === 'SOLVED' && q.repeat_7d === 'ANO') warn.push(t('warn.W_SOLVED_REPEAT'));
    if (form.decision === 'SOLVED' && Number(q.wrong_found_qty) > 0) warn.push(t('warn.W_SOLVED_WRONG', { n: q.wrong_found_qty }));
    return card(t('f.decision'), box,
      h('div', { class: 'opt-list', role: 'radiogroup' },
        opt('CONTINUE', t('dec.CONTINUE_sub')),
        opt('SOLVED', q.safety === 'ANO' ? t('err.E_SOLVED_SAFETY') : t('dec.SOLVED_sub'), q.safety === 'ANO'),
        opt('ESCALATE', parent ? t('dec.ESCALATE_sub', { area: parent }) : t('err.E_NO_PARENT'), !parent)),
      pilotBox,
      warn.length ? h('div', { class: 'warnbox' }, h('ul', null, warn.map(w => h('li', null, w)))) : null,
      field(t('f.decision_comment'), textArea(form.comment, v => { form.comment = v; }, 3, 2000),
        { name: 'decision_comment', required: form.decision === 'SOLVED' || form.decision === 'ESCALATE' }),
      button(t('dec.sign'), () => sign(box), 'primary', { big: true, block: true }),
      h('p', { class: 'small muted', style: { marginTop: '8px' } }, t('dec.signHint', { user: App.user.email })));
  }

  async function sign(box, confirmed) {
    const q = D.q;
    const errs = [];
    if (!form.decision) errs.push({ code: 'E_REQUIRED', field: 'decision' });
    if ((form.decision === 'SOLVED' || form.decision === 'ESCALATE') && !form.comment.trim()) errs.push({ code: 'E_REQUIRED', field: 'decision_comment' });
    if (form.decision === 'CONTINUE' && !D.pilots.length && !form.pilots.length) errs.push({ code: 'E_PILOT_REQUIRED', field: 'pilots' });
    if (!setErrors(box, errs, byId('app'))) return;
    const res = await api('apiSignDecision', { id: q.qrap_id, decision: form.decision, comment: form.comment, pilots: form.pilots,
      confirmWarnings: !!confirmed });
    if (!res.ok && res.needConfirm) {
      if (await warnConfirm(res.warnings)) return sign(box, true);
      return;
    }
    if (!res.ok) { showErrors(res, box, byId('app')); return; }
    toast(res.copyId ? t('dec.escalated', { id: res.copyId }) : t('dec.signed'), 'ok', 6000);
    render(clear(byId('app')), { id: q.qrap_id });
  }

  function decidedCard() {
    const q = D.q;
    return card(t('f.decision'), kvList([
      [t('f.decision'), t('dec.' + q.decision)],
      [t('f.decision_comment'), q.decision_comment],
      [t('f.pilots'), D.pilots.map(p => p.name).join(', ')],
      [t('f.assign_ref'), q.assign_ref ? qrapLink(q.assign_ref) : ''],
      [t('f.signed'), personName(q.decided_by) + ' · ' + fmtDT(q.decided_at)]
    ]), h('div', { class: 'okbox' }, t('dec.locked')));
  }

  return { render: render };
})();

App.views.close = (() => {

        badges: statusBadge(q.status), sub: q.qrap_id + ' · ' + q.what }),

          h('b', null, (i + 1) + '. '), s ? [t('eff.' + s.result), h('br'), fmtD(s.shift_date) + ' · ' + shiftName(s.shift_code)] : '–')))),
      box,
      q.status === 'CLOSED' ? h('div', { class: 'okbox' }, t('close.done', { who: personName(q.closed_by), at: fmtDT(q.closed_at) }))

      h('div', { class: 'btn-row' }, button(t('qrap.detail'), () => go('qrap', { id: q.qrap_id }), 'ghost'),

  return { render: render };

  <script>
'use strict';
/*
 * ViewAnalysis – ⑤ PŘÍČINA 5 Proč? and ⑥ Konečné akce for the pilot (PC), ?page=analysis&id=…
 * ⑤ + lesson + standard question are saved together (apiSaveAnalysis); each action row is saved on its own
 * (apiSaveDefAction). The status (ANALYSIS → ACTIONS_OPEN → VERIFY) is moved by the server.
 */
App.views.analysis = (() => {
  let D = null;
  let F = null; // form state for ⑤ and the single ⑥ fields

  async function render(root, params) {
    D = await loadDetail(root, params.id);
    if (!D) return;
    const text = (ch, n) => ((D.why.find(w => w.chain === ch && Number(w.step) === n) || {}).text || '');
    const root_ = ch => Number((D.why.find(w => w.chain === ch && w.is_root === true) || {}).step || 0);
    F = {
      why: { OCCURRENCE: [1, 2, 3, 4, 5].map(n => text('OCCURRENCE', n)), NON_DETECTION: [1, 2, 3, 4, 5].map(n => text('NON_DETECTION', n)) },
      root: { OCCURRENCE: root_('OCCURRENCE'), NON_DETECTION: root_('NON_DETECTION') },
      showNd: D.why.some(w => w.chain === 'NON_DETECTION' && w.text),
      learned: D.q.learned || '', std_update: D.q.std_update || '', std_update_ref: D.q.std_update_ref || ''
    };
    draw(root);
  }

  function draw(root) {
    const q = D.q;
    const edit = D.can.analyze;
    clear(root);
    addKids(root, [
      pageHead({ crumbs: [boardCrumb(q.area_code), qrapCrumb(q.qrap_id), { label: t('ana.crumb') }], title: t('ana.title'),
        badges: statusBadge(q.status), sub: q.qrap_id + ' · ' + q.what,
        actions: [D.can.effect ? button(t('qrap.effect'), () => go('effect', { id: q.qrap_id }), 'ghost') : null,
          D.can.close ? button(t('qrap.close'), () => go('close', { id: q.qrap_id }), 'ghost') : null] }),
      card(null, kvList([[t('f.pilots'), D.pilots.map(p => p.name).join(', ') || '–'], [t('board.col.progress'), chipsEl(D.chips)]]),
        D.can.isDecider && edit ? pilotAdder() : null,
        !edit ? h('div', { class: 'note' }, t('ana.readOnly')) : null),
      whyCard(edit),
      actionsCard(edit)
    ]);
  }

  function reload() { render(clear(byId('app')), App.params); }

  function pilotAdder() {
    let email = '';
    return h('div', { style: { marginTop: '12px', maxWidth: '520px' } }, withButton(
      personSelect('', v => { email = v; }, '', { byEmail: true, placeholder: t('ana.addPilot') }),
      button(t('btn.add'), async () => {
        if (!email) return;
        const res = await api('apiAddPilot', { id: D.q.qrap_id, email: email });
        if (!res.ok) { showErrors(res); return; }
        toast(t('msg.saved'), 'ok');
        reload();
      }, 'ghost')));
  }

  /** Previous answer as a question: "Proč: <answer without the final dot>?" */
  function whyPrompt(n, prev) {
    return n + '. ' + t('why.prompt', { prev: String(prev || '').trim().replace(/[.?!…\s]+$/, '') || '…' });
  }

  /** ⑤: each prompt quotes the previous answer ("Proč: …?"). */
  function chainEl(ch, edit) {
    const list = h('div');
    const drawSteps = () => {
      clear(list);
