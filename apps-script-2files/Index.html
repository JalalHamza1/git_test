<!DOCTYPE html>
<html lang="cs">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eQRAP Logistika</title>
  <style>
/* Styles – all CSS of the app. Touch friendly: controls are at least 48 px (≈ 12 mm) high. */
:root {
  --ink: #16202a; --muted: #56616d; --line: #cfd6de; --bg: #eef1f4; --card: #ffffff;
  --hdr: #1f2d3d; --focus: #ffb300;
  --op: #D7861B; --sup: #2F6DB5; --pil: #7B4FB8; --mgr: #0E8C83;
  --done: #3B8A1E; --wait: #E08600; --late: #C62828; --todo: #b8c0c9;
  --tap: 52px; --radius: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: "Segoe UI", Roboto, Arial, sans-serif; font-size: 18px; line-height: 1.4; color: var(--ink);
  background: var(--bg); -webkit-text-size-adjust: 100%; }
h1 { font-size: 26px; margin: 0 0 12px; }
h2 { font-size: 22px; margin: 0 0 10px; }
h3 { font-size: 19px; margin: 14px 0 8px; }
a { color: var(--sup); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.nowrap { white-space: nowrap; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- header ---------- */
.hdr { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 16px;
  background: var(--hdr); color: #fff; min-height: 60px; }
.hdr-app { font-weight: 700; font-size: 20px; white-space: nowrap; cursor: pointer; }
.hdr-area { background: rgba(255,255,255,.15); border-radius: 20px; padding: 4px 12px; font-size: 16px; white-space: nowrap; }
.hdr-space { flex: 1; }
.hdr-user { font-size: 16px; opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
.hdr-btn { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.4); border-radius: var(--radius);
  min-height: 44px; min-width: 52px; padding: 0 12px; cursor: pointer; }
.hdr-menu { position: absolute; right: 12px; top: 62px; background: #fff; color: var(--ink); border-radius: var(--radius);
  box-shadow: 0 8px 30px rgba(0,0,0,.25); min-width: 240px; padding: 6px; }
.hdr-menu button { display: block; width: 100%; text-align: left; min-height: var(--tap); border: 0; background: none;
  padding: 0 14px; border-radius: 6px; cursor: pointer; }
.hdr-menu button:hover { background: var(--bg); }
.busybar { position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 50; background: linear-gradient(90deg, var(--focus), var(--sup));
  animation: busy 1s linear infinite; background-size: 200% 100%; }
@keyframes busy { from { background-position: 0 0; } to { background-position: 200% 0; } }
.offline { position: sticky; top: 60px; z-index: 19; display: flex; gap: 12px; align-items: center; justify-content: center;
  flex-wrap: wrap; background: var(--late); color: #fff; font-weight: 700; padding: 10px 16px; }

/* ---------- layout ---------- */
.app { padding: 16px; max-width: 1200px; margin: 0 auto; padding-bottom: 120px; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  border: 1px solid var(--line); }
.sec { border-left: 8px solid var(--line); }
.sec-op { border-left-color: var(--op); } .sec-sup { border-left-color: var(--sup); }
.sec-pil { border-left-color: var(--pil); } .sec-mgr { border-left-color: var(--mgr); }
.sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sec-num { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%;
  color: #fff; font-weight: 700; flex: none; }
.sec-op .sec-num { background: var(--op); } .sec-sup .sec-num { background: var(--sup); }
.sec-pil .sec-num { background: var(--pil); } .sec-mgr .sec-num { background: var(--mgr); }
.sec-title { font-size: 20px; font-weight: 700; margin: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.row > * { flex: 1 1 240px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.kv { display: grid; grid-template-columns: minmax(140px, 32%) 1fr; gap: 6px 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.loading { padding: 40px; text-align: center; color: var(--muted); font-size: 20px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap);
  padding: 0 20px; border-radius: var(--radius); border: 2px solid transparent; font-weight: 700; cursor: pointer;
  background: #e1e6eb; color: var(--ink); text-decoration: none; user-select: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--sup); color: #fff; }
.btn-op { background: var(--op); color: #fff; }
.btn-pil { background: var(--pil); color: #fff; }
.btn-mgr { background: var(--mgr); color: #fff; }
.btn-ok { background: var(--done); color: #fff; }
.btn-danger { background: var(--late); color: #fff; }
.btn-ghost { background: #fff; border-color: var(--line); }
.btn-big { min-height: 68px; font-size: 22px; padding: 0 28px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.btn-x { min-width: var(--tap); padding: 0; }

/* ---------- forms ---------- */
.fld { margin-bottom: 18px; }
.fld-label { display: block; font-weight: 700; margin-bottom: 6px; }
.fld-hint { color: var(--muted); font-size: 15px; margin: -2px 0 6px; }
.req { color: var(--late); }
.fld-err { color: var(--late); font-weight: 700; font-size: 16px; margin-top: 4px; }
.fld-err:empty { display: none; }
.fld.has-err input, .fld.has-err select, .fld.has-err textarea, .fld.has-err .seg { outline: 3px solid var(--late); outline-offset: 2px; }
input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=search], select, textarea {
  width: 100%; min-height: var(--tap); border: 2px solid var(--line); border-radius: var(--radius); padding: 8px 12px;
  background: #fff; }
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--sup); outline: none; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-btn { min-height: var(--tap); min-width: 90px; padding: 0 18px; border: 2px solid var(--line); border-radius: var(--radius);
  background: #fff; font-weight: 700; cursor: pointer; }
.seg-btn.on { background: var(--sup); border-color: var(--sup); color: #fff; }
.seg-btn.seg-danger.on { background: var(--late); border-color: var(--late); }
.seg-btn.seg-ok.on { background: var(--done); border-color: var(--done); }
.seg-btn.seg-warn.on { background: var(--wait); border-color: var(--wait); }
.seg-btn:disabled { opacity: .45; cursor: not-allowed; }
.seg-big .seg-btn { min-height: 64px; min-width: 130px; font-size: 22px; }
.seg-grid .seg-btn { flex: 1 1 200px; }
.chk { display: flex; align-items: center; gap: 12px; min-height: var(--tap); cursor: pointer; font-weight: 600; }
.chk input { width: 28px; height: 28px; flex: none; }
.errbox { background: #fdecea; border: 2px solid var(--late); color: #7f1d1d; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
.errbox ul, .warnbox ul { margin: 4px 0 0 20px; padding: 0; }
.warnbox { background: #fff4e0; border: 2px solid var(--wait); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
.okbox { background: #e9f5e3; border: 2px solid var(--done); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }

/* ---------- chips and badges ---------- */
.chips { display: inline-flex; gap: 4px; flex-wrap: nowrap; }
.chip { width: 30px; height: 30px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; color: #fff; }
.chip-done { background: var(--done); } .chip-wait { background: var(--wait); } .chip-late { background: var(--late); }
.chip-todo { background: var(--todo); color: #31404f; } .chip-na { background: transparent; border: 2px dashed #8d99a6; color: #8d99a6; }
.badge { display: inline-block; border-radius: 4px; padding: 1px 8px; font-size: 14px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
.badge-safety { background: var(--late); color: #fff; }
.badge-rep { background: var(--wait); color: #fff; }
.badge-st { background: #dfe6ee; color: var(--ink); }
.badge-archived { background: #6b7785; color: #fff; }
.pill-ok { color: var(--done); font-weight: 700; } .pill-bad { color: var(--late); font-weight: 700; }

/* ---------- board ---------- */
.board-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.board-top h1 { margin: 0; }
.board-list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  height: calc(100vh - 250px); min-height: 300px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.bhead, .brow { display: grid; grid-template-columns: 180px 1fr auto 190px; gap: 12px; align-items: center; padding: 10px 14px; }
.bhead { position: sticky; top: 0; background: #f7f9fb; font-size: 15px; color: var(--muted); font-weight: 700;
  border-bottom: 1px solid var(--line); z-index: 1; }
.brow { border-bottom: 1px solid var(--line); cursor: pointer; min-height: 72px; border-left: 8px solid transparent; }
.brow:hover { background: #f5f8fb; }
.brow.late { border-left-color: var(--late); background: #fff1f0; }
.brow.closed { opacity: .7; }
.b-id { font-weight: 700; overflow-wrap: anywhere; }
.b-text { font-weight: 600; }
.b-meta { color: var(--muted); font-size: 15px; }
.b-wait { font-size: 16px; font-weight: 600; }
.brow.late .b-wait { color: var(--late); }
.board-more { text-align: center; padding: 12px; color: var(--muted); }
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; gap: 12px; padding: 12px 16px;
  background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
.bottombar .btn { flex: 1; }

/* ---------- wizard ---------- */
.progress { display: flex; gap: 6px; margin-bottom: 16px; }
.progress div { flex: 1; text-align: center; padding: 10px 4px; border-radius: 6px; background: #dde3e9; font-size: 15px; font-weight: 700; }
.progress div.done { background: #cfe7c4; cursor: pointer; }
.progress div.cur { background: var(--op); color: #fff; }
.wiz-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; gap: 12px; padding: 12px 16px; background: #fff;
  border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
.wiz-nav .btn { flex: 1; }
.photo-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.photo-slot { border: 5px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: center; background: #fff; }
.ph-wrong { border-color: var(--late); } .ph-correct { border-color: var(--done); }
.ph-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.ph-wrong .ph-title { color: var(--late); } .ph-correct .ph-title { color: var(--done); }
.ph-frame { height: 260px; display: flex; align-items: center; justify-content: center; background: #f4f6f8; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
.ph-frame img { max-width: 100%; max-height: 100%; }
.ph-empty { color: var(--muted); font-size: 18px; }
.ia-row { border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; background: #fbfcfd; }
.ia-row .row > * { flex: 1 1 200px; }
.sugg { display: block; width: 100%; text-align: left; border: 2px solid var(--line); border-radius: var(--radius); background: #fff;
  padding: 10px 12px; margin-bottom: 8px; cursor: pointer; min-height: var(--tap); }
.sugg.on { border-color: var(--sup); background: #eaf1fb; }

/* ---------- detail ---------- */
.top-card { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.top-card .grow { flex: 1 1 320px; }
.qr { background: #fff; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); text-align: center; }
.qr img, .qr canvas { display: block; margin: 0 auto; }
.thumbs { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.thumb { border: 4px solid var(--line); border-radius: 6px; width: 200px; min-height: 120px; cursor: pointer; background: #f4f6f8;
  display: flex; flex-direction: column; align-items: center; }
.thumb img { max-width: 100%; max-height: 180px; }
.thumb-wrong { border-color: var(--late); } .thumb-correct { border-color: var(--done); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 16px; }
.tbl th { text-align: left; background: #f1f4f7; padding: 8px; font-size: 15px; color: var(--muted); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.late td { background: #fff1f0; }
.slots { display: flex; gap: 8px; flex-wrap: wrap; }
.slot { border: 2px solid var(--line); border-radius: var(--radius); padding: 8px 10px; min-width: 150px; background: #fff; font-size: 15px; }
.slot-EFFECTIVE { border-color: var(--done); background: #eef7ea; }
.slot-NOT_EFFECTIVE { border-color: var(--late); background: #fdecea; }
.slot-NOT_VERIFIED { border-color: var(--wait); background: #fff4e0; }
.why-step { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; margin-bottom: 10px; }
.why-root { font-weight: 700; color: var(--pil); }
.check-list li { margin-bottom: 6px; }

/* ---------- decision (phone) ---------- */
.dec-opt { display: block; width: 100%; text-align: left; border: 3px solid var(--line); border-radius: var(--radius); padding: 14px;
  margin-bottom: 10px; background: #fff; cursor: pointer; min-height: 64px; font-size: 19px; font-weight: 700; }
.dec-opt.on { border-color: var(--sup); background: #eaf1fb; }
.dec-opt:disabled { opacity: .5; cursor: not-allowed; }
.dec-opt small { display: block; font-weight: 400; font-size: 15px; color: var(--muted); margin-top: 4px; }
.shift-btn { min-width: 150px; }
.shift-btn.on { background: var(--done); color: #fff; border-color: var(--done); }

/* ---------- manager ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: #fff; border: 1px solid var(--line); border-top: 6px solid var(--mgr); border-radius: var(--radius); padding: 12px; }
.tile.alert { border-top-color: var(--late); }
.tile-n { font-size: 38px; font-weight: 800; line-height: 1.1; }
.tile-l { color: var(--muted); font-size: 15px; }
.need { display: grid; grid-template-columns: 8px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px;
  border-bottom: 1px solid var(--line); cursor: pointer; }
.need-bar { align-self: stretch; border-radius: 4px; background: var(--wait); }
.need.u-high .need-bar { background: var(--late); }

/* ---------- toast and modal ---------- */
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff;
  padding: 16px 22px; border-radius: var(--radius); font-weight: 700; max-width: 92vw; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.toast.ok { background: var(--done); } .toast.err { background: var(--late); } .toast.warn { background: var(--wait); }
.modal-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(10,20,30,.55); display: flex; align-items: center;
  justify-content: center; padding: 16px; }
.modal { background: #fff; border-radius: 10px; padding: 20px; width: 100%; max-width: 620px; max-height: 90vh; overflow: auto; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.modal img.full { max-width: 100%; }

/* ---------- small screens (phones) ---------- */
@media (max-width: 760px) {
  body { font-size: 17px; }
  .app { padding: 12px; }
  .bhead { display: none; }
  .brow { grid-template-columns: 1fr auto; grid-template-areas: "id chips" "what what" "wait wait"; gap: 6px; }
  .b-id { grid-area: id; } .b-what { grid-area: what; } .brow .chips { grid-area: chips; } .b-wait { grid-area: wait; }
  .chip { width: 26px; height: 26px; font-size: 14px; }
  .kv { grid-template-columns: 1fr; gap: 0 0; } .kv dd { margin-bottom: 8px; }
  .grid2, .photo-slots { grid-template-columns: 1fr; }
  .hdr-user { display: none; }
  .ph-frame { height: 200px; }
  .board-list { height: calc(100vh - 280px); }
  .hdr { gap: 8px; padding: 8px 10px; }
  .hdr-app { font-size: 17px; }
  .bottombar .btn-big, .wiz-nav .btn-big { font-size: 18px; min-height: 60px; padding: 0 10px; }
}
@media (max-width: 480px) {
  .hdr-area { display: none; }
  .hdr-btn { min-width: 44px; padding: 0 8px; }
}
</style>

</head>

  <div id="modal" class="modal-wrap" hidden></div>

  <script>
'use strict';
/*
 * ClientCore – shared browser code:
 *   App state · h() DOM builder · api() server calls with offline handling · router ·
 *   toast / dialogs · date formatting (Europe/Prague) · lists and people · photos · QR code · idle timer · header.
 * Security: user text is always inserted with textContent (h() does that), never with innerHTML.
 */

const App = {
  boot: window.BOOT || {},
  views: {},
  params: {},
  view: null,
  get user() { return this.boot.user || {}; },
  get set() { return this.boot.settings || { lists: {}, people: [], areas: [], shifts: [], locations: [], config: {} }; }
};
const PRAGUE = 'Europe/Prague';
const FINAL_ST = ['CLOSED_SOLVED', 'ESCALATED', 'CLOSED'];

/* ---------------------------------------------------------------- DOM builder */

/**
 * Creates an element. attrs: class, text, value, checked, disabled, hidden, style{}, dataset{}, on<event>, other attributes.
 * Children: nodes, strings (become text nodes → safe), arrays, null/false (skipped).
 */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  Object.keys(attrs || {}).forEach(k => {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (['value', 'checked', 'disabled', 'hidden', 'selected', 'multiple'].indexOf(k) >= 0) el[k] = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  });
  addKids(el, kids);
  return el;
}
function addKids(el, kids) {
  (kids || []).forEach(k => {
    if (Array.isArray(k)) return addKids(el, k);
    if (k === null || k === undefined || k === false) return;

/* ---------------------------------------------------------------- start */

App.start = function () {

    clear(byId('app')).appendChild(h('div', { class: 'card errbox' }, h('h2', null, t('err.' + App.boot.error)),

  return h('input', { type: 'date', value: value || '', min: opts.min || null, max: opts.max || null,
    oninput: e => onChange(e.target.value) });
}
function checkbox(label, checked, onChange) {
  return h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: !!checked, onchange: e => onChange(e.target.checked) }), label);
}

/** Person picker (value = name, or e-mail with byEmail). Only people with an e-mail when byEmail. */
function personSelect(value, onChange, area, opts) {
  opts = opts || {};
  const list = peopleOf(area, opts.roles).filter(p => !opts.byEmail || p.email)
    .map(p => ({ value: opts.byEmail ? p.email : p.name, label: p.name + (opts.showRoles ? ' (' + p.roles.join(', ') + ')' : '') }));
  if (value && !list.some(o => o.value === value)) list.unshift({ value: value, label: opts.byEmail ? personName(value) : value });
  return selectEl(list, value, onChange, opts.placeholder);
}

/** Button that disables itself while its async handler runs. */
function button(label, onClick, kind, opts) {
  opts = opts || {};
  const b = h('button', { type: 'button', class: 'btn btn-' + (kind || 'ghost') + (opts.big ? ' btn-big' : ''), disabled: !!opts.disabled });
  addKids(b, [label]);
  b.addEventListener('click', async () => {
    if (b.disabled) return;
    b.disabled = true;
    try { await onClick(); } finally { if (b.isConnected) b.disabled = !!opts.disabled; }
  });
  return b;
}

/** Board chips 1–7. */
function chipsEl(chips) {
  return h('div', { class: 'chips', 'aria-label': t('board.chips') }, (chips || []).map((c, i) =>
    h('span', { class: 'chip chip-' + c, title: t('chip.' + (i + 1)) + ': ' + t('chipState.' + c) }, String(i + 1))));
}
function statusBadge(st) { return h('span', { class: 'badge badge-st' }, statusLabel(st)); }

/** Section card with the round number and role colour (op | sup | pil | mgr). */
function sectionCard(num, title, role, ...content) {
  return h('section', { class: 'card sec sec-' + role },
    h('div', { class: 'sec-head' }, h('span', { class: 'sec-num' }, num), h('h2', { class: 'sec-title' }, title)),
    content);
}

/** Definition list: [[label, value], …]; empty values are skipped. */
function kvList(pairs) {
  const dl = h('dl', { class: 'kv' });
  pairs.forEach(p => {
    if (p[1] === '' || p[1] === null || p[1] === undefined || p[1] === false) return;
    dl.appendChild(h('dt', null, p[0]));
    dl.appendChild(h('dd', null, p[1]));
  });
  return dl;
}

function errorBox() { return h('div', { class: 'errbox', hidden: true, role: 'alert' }); }

/** Shows a list of client-side errors in a box. errs: [{code, field, …}] like the server. */
function setErrors(box, errs, root) {
  showErrors({ errors: errs }, box, root);
  return errs.length === 0;
}

/** Simple table. rows: arrays of cells (strings or nodes). */
function table(headers, rows, rowCls) {
  return h('table', { class: 'tbl' },
    h('thead', null, h('tr', null, headers.map(x => h('th', null, x)))),
    h('tbody', null, rows.map((r, i) => h('tr', { class: rowCls ? rowCls(i) : null }, r.map(c => h('td', null, c))))));
}

/** "Loading…" placeholder. */
function loadingEl() { return h('div', { class: 'loading' }, t('msg.loading')); }

/** Link-style button that opens a QRAP. */
function qrapLink(id) {
  return id ? h('a', { href: '#', onclick: e => { e.preventDefault(); go('qrap', { id: id }); } }, id) : '';
}

/** Yes / no text for ANO / NE. */
function yn(v, lower) {
  if (v === 'ANO') return lower ? t('lbl.yesLower') : t('lbl.yes');
  if (v === 'NE') return lower ? t('lbl.noLower') : t('lbl.no');
  return '–';
}

  <script>
'use strict';
/*
 * ViewBoard – the kiosk board (?page=board&area=WH1).
 * One row per QRAP like the paper board: number · what / where / when · chips 1–7 · "čeká na".
 * Newest at the bottom; the list starts scrolled to the bottom and loads older rows when scrolled up.
 */
App.views.board = (() => {
  const PAGE = 40;
  const S = { area: '', filter: 'open', rows: [], hasMore: false, loading: false, timer: null, list: null, pendingBtn: null };

  function render(root, params, extra) {
    S.area = String(params.area || defaultArea()).toUpperCase();
    S.filter = params.filter || 'open';
    S.rows = [];
    S.hasMore = false;
    S.list = h('div', { class: 'board-list', onscroll: onScroll });
    S.pendingBtn = h('button', { class: 'btn btn-ghost btn-big', onclick: showPending }, t('board.pending', { n: '…' }));
    const filters = segmented(['open', 'today', 'safety', 'all'].map(f => ({ value: f, label: t('board.f.' + f) })), S.filter,
      f => { setUrl({ page: 'board', area: S.area, filter: f }); S.filter = f; load('replace'); });
    addKids(root, [
      h('div', { class: 'board-top' }, h('h1', null, t('board.title') + ' · ' + S.area), filters),
      S.list,
      h('div', { class: 'bottombar' },
        canCreateIn(S.area) ? h('button', { class: 'btn btn-op btn-big', onclick: () => go('new', { area: S.area }) }, t('board.new')) : null,
        canCreateIn(S.area) ? S.pendingBtn : null)
    ]);
    load('replace').then(() => { if (extra.toast) toast(extra.toast, 'ok', 6000); });
    S.timer = setInterval(() => load('refresh'), 60000);
  }

  function leave() { clearInterval(S.timer); }

  /** mode: replace (first load) · refresh (keep position) · older (prepend when scrolling up) */
  async function load(mode) {
    if (S.loading) return;
    S.loading = true;
    const req = { area: S.area, filter: S.filter, limit: mode === 'refresh' ? Math.max(PAGE, S.rows.length) : PAGE };
    if (mode === 'older' && S.rows.length) req.before = S.rows[0].key;
    const res = await api('apiGetBoard', req);
    S.loading = false;
    if (!res.ok) { showErrors(res); return; }
    S.pendingBtn.textContent = t('board.pending', { n: res.pending });
    const list = S.list;
    const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
    if (mode === 'older') {
      const before = list.scrollHeight;
      S.rows = res.rows.concat(S.rows);
      S.hasMore = res.hasMore;
      draw();
      list.scrollTop = list.scrollHeight - before + list.scrollTop;
    } else {
      S.rows = res.rows;
      S.hasMore = res.hasMore;
      draw();
      if (mode === 'replace' || atBottom) list.scrollTop = list.scrollHeight;
    }
  }

  function draw() {
    const list = clear(S.list);
    list.appendChild(h('div', { class: 'bhead' }, h('div', null, t('board.col.id')), h('div', null, t('board.col.what')),
      h('div', null, '1 – 7'), h('div', null, t('board.col.wait'))));
    if (S.hasMore) list.appendChild(h('div', { class: 'board-more' }, t('board.older')));
    if (!S.rows.length) list.appendChild(h('div', { class: 'empty' }, t('board.empty')));
    S.rows.forEach(r => list.appendChild(rowEl(r)));
  }

  function rowEl(r) {
    const open = () => go('qrap', { id: r.id });
    return h('div', {
      class: 'brow' + (r.late ? ' late' : '') + (FINAL_ST.indexOf(r.st) >= 0 ? ' closed' : ''),
      role: 'button', tabindex: '0', onclick: open, onkeydown: e => { if (e.key === 'Enter') open(); }
    },
    h('div', { class: 'b-id' }, r.id, r.safety ? h('span', { class: 'badge badge-safety' }, 'SAFETY') : null,
      r.rep ? h('span', { class: 'badge badge-rep' }, t('board.repeat')) : null),
    h('div', { class: 'b-what' },
      h('div', { class: 'b-text' }, r.what || t('board.noText')),
      h('div', { class: 'b-meta' }, [r.zone, r.loc].filter(Boolean).join(' / ') + (r.det ? ' · ' + fmtDT(r.det) : ''))),
    chipsEl(r.chips),
    h('div', { class: 'b-wait' }, r.wait ? t('board.waitFor') + ' ' + t('wait.' + r.wait) : statusLabel(r.st)));
  }

  function onScroll() {
    if (S.list.scrollTop < 80 && S.hasMore && !S.loading) load('older');
  }

  /** "Pokračovat v rozpracovaném": drafts and QRAPs whose ③ is still open. */
  async function showPending() {
    const res = await api('apiGetDrafts', S.area);
    if (!res.ok) { showErrors(res); return; }
    const pick = d => {
      byId('modal').hidden = true;
      const step = d.status !== 'DRAFT' ? 4 : !d.s1 ? 1 : !d.photos ? 2 : !d.s2 ? 3 : d.risk ? 5 : 4;
      go('wizard', { id: d.id, step: step });
    };
    const body = h('div', null, res.drafts.length ? res.drafts.map(d => h('button', { class: 'sugg', onclick: () => pick(d) },
      h('b', null, d.id), ' · ', statusLabel(d.status), h('br'), d.what || t('board.noText'),
      h('div', { class: 'small muted' }, fmtDT(d.detected_at || d.created_at)))) : h('p', { class: 'muted' }, t('board.noPending')));
    modal({ title: t('board.pendingTitle'), body: body, buttons: [{ label: t('btn.close'), value: true }] });
  }

  return { render: render, leave: leave };
})();

  <script>
'use strict';
/*
 * ViewWizard – the kiosk wizard (?page=new&area=WH1 or ?page=wizard&id=…&step=…).
 * Steps: 1 Popis · 2 Fotky · 3 Upozornění · 4 Opatření · 5 Kontrola a odeslání.
 * This file: state, navigation, saving, step 1 and step 2. Steps 3–5 and the checks are in ViewWizardSteps.
 * Every "Další" validates in the browser, then saves on the server (which validates again).
 */
const Wiz = { S: null, root: null, body: null, errBox: null, laterBtn: null, steps: {}, validate: {}, data: {} };

App.views.wizard = App.views.new = (() => {
  /** Empty state for a new QRAP. */
  function blank(area) {
    return {
      id: '', area: area, status: '', step: 1, dirty: false,
      q: { detected_at: nowLocalInput(), nok_situation: false, check_in_progress: false, photo_exception: '', photoExc: false },
      roles: [], other_text: '', ia: [], photos: { WRONG: null, CORRECT: null }, s3: null, can: { editQr: true }
    };
  }

  /** Server state → wizard state (dates to local input format, "OTHER:text" split). */
  function fromServer(st, step) {
    const q = st.q;
    const how = String(q.how_found || '');
    Wiz.S = {
      id: q.qrap_id, area: q.area_code, status: q.status, step: step || 1, dirty: false,
      q: Object.assign({}, q, {
        detected_at: toLocalInput(q.detected_at), restored_at: toLocalInput(q.restored_at),
        how_found: how.indexOf('OTHER:') === 0 ? 'OTHER' : how,
        how_found_other: how.indexOf('OTHER:') === 0 ? how.slice(6) : '',
        nok_situation: q.nok_situation === true, check_in_progress: q.check_in_progress === true,
        photoExc: !!q.photo_exception
      }),
      roles: st.alerts.map(a => a.role_code),
      other_text: (st.alerts.find(a => a.role_code === 'OTHER') || {}).other_text || '',
      ia: iaFromServer(st.ia),
      photos: { WRONG: st.photos.find(p => p.kind === 'WRONG') || null, CORRECT: st.photos.find(p => p.kind === 'CORRECT') || null },
      s3: st.s3, can: st.can
    };
  }
  function iaFromServer(rows) {
    return rows.map(a => ({ id: a.id, type: a.type, text: a.text, owner_name: a.owner_name, done_at: toLocalInput(a.done_at), remove: false }));
  }

  /** After a save: take the server's truth for ids, status and system fields; keep what is typed elsewhere. */
  function mergeServer(st, step) {
    const S = Wiz.S;
    S.id = st.q.qrap_id;
    S.status = st.q.status;
    S.s3 = st.s3;
    S.can = st.can;
    ['qrap_id', 'status', 'area_code', 's1_done_at', 's2_done_at', 's3_done_at', 'sent_at', 'containment_done_at', 'finder_name']
      .forEach(k => { S.q[k] = st.q[k]; });
    S.roles = st.alerts.map(a => a.role_code);
    S.photos = { WRONG: st.photos.find(p => p.kind === 'WRONG') || null, CORRECT: st.photos.find(p => p.kind === 'CORRECT') || null };
    if (step === 4) S.ia = iaFromServer(st.ia);
  }

  async function render(root, params) {
    Wiz.root = root;
    if (params.id) {
      root.appendChild(loadingEl());
      const res = await api('apiGetWizard', params.id);
      if (!root.isConnected) return;
      clear(root);
      if (!res.ok) { showErrors(res); root.appendChild(h('div', { class: 'empty' }, errText(res.errors[0]))); return; }
      fromServer(res.state, Math.min(5, Math.max(1, Number(params.step) || 1)));
      if (!Wiz.S.can.editQr) { root.appendChild(h('div', { class: 'empty' }, t('err.E_LOCKED'))); return; }
    } else {
      Wiz.S = blank(String(params.area || defaultArea()).toUpperCase());
      if (!canCreateIn(Wiz.S.area)) { root.appendChild(h('div', { class: 'empty' }, t('err.E_FORBIDDEN'))); return; }
    }
    draw();
  }

  /** Draws the whole wizard page for the current step. */
  function draw() {
    const S = Wiz.S;
    const root = clear(Wiz.root);
    root.appendChild(h('div', { class: 'progress' }, [1, 2, 3, 4, 5].map(n => h('div', {
      class: n === S.step ? 'cur' : n < S.step ? 'done' : '',
      onclick: n < S.step ? () => goStep(n) : null
    }, n + ' ' + t('wiz.s' + n)))));
    root.appendChild(h('h1', null, S.id ? S.id : t('wiz.newTitle'), S.status ? statusBadge(S.status) : null));
    Wiz.errBox = errorBox();
    root.appendChild(Wiz.errBox);
    Wiz.body = h('div', { class: 'card' });
    root.appendChild(Wiz.body);
    Wiz.steps[S.step](Wiz.body);
    root.appendChild(navBar());
  }
  Wiz.draw = draw;

  function navBar() {
    const S = Wiz.S;
    const nav = h('div', { class: 'wiz-nav' });
    nav.appendChild(S.step > 1 ? button(t('btn.back'), () => goStep(S.step - 1), 'ghost', { big: true })
      : button(t('btn.cancel'), cancel, 'ghost', { big: true }));
    Wiz.laterBtn = null;
    if (S.step === 4) {
      Wiz.laterBtn = button(t('wiz.later'), later, 'ghost', { big: true });
      Wiz.laterBtn.disabled = !S.q.risk_stock_shipped;
      nav.appendChild(Wiz.laterBtn);
    }
    if (S.step < 5) nav.appendChild(button(t('btn.next'), next, 'op', { big: true }));
    else if (S.status === 'DRAFT') nav.appendChild(button(t('wiz.send'), submit, 'op', { big: true }));
    else nav.appendChild(button(t('wiz.saveClose'), () => go('qrap', { id: S.id }), 'primary', { big: true }));
    return nav;
  }

  function goStep(n) {
    const S = Wiz.S;
    S.step = n;
    if (S.id) setUrl({ page: 'wizard', id: S.id, step: n });
    draw();
    window.scrollTo(0, 0);
  }
  Wiz.goStep = goStep;

  /** Saves one step on the server. mode: next | later | draft. */
  async function save(step, mode) {
    const S = Wiz.S;
    const res = await api('apiSaveStep', { id: S.id, area: S.area, step: step, mode: mode, data: Wiz.data[step]() });
    if (res.ok) { mergeServer(res.state, step); S.dirty = false; }
    return res;
  }

  async function next() {
    const S = Wiz.S;
    const step = S.step;
    const v = Wiz.validate[step]('next');
    if (!setErrors(Wiz.errBox, v.errors, Wiz.body)) return;
    if (!(await warnConfirm(v.warnings))) return;
    const res = await save(step, 'next');
    if (!res.ok) { showErrors(res, Wiz.errBox, Wiz.body); return; }
    goStep(step + 1);
  }

  /** "Dokončí TL později": needs only the risk answer; ③ can be completed later. */
  async function later() {
    const v = Wiz.validate[4]('later');
    if (!setErrors(Wiz.errBox, v.errors, Wiz.body)) return;
    const res = await save(4, 'later');
    if (!res.ok) { showErrors(res, Wiz.errBox, Wiz.body); return; }
    goStep(5);
  }

  async function submit() {
    const S = Wiz.S;
    const errs = Wiz.validate[5]();
    if (!setErrors(Wiz.errBox, errs)) return;
    const res = await api('apiSubmitQrap', S.id);
    if (!res.ok) { showErrors(res, Wiz.errBox); return; }
    go('board', { area: S.area }, { extra: { toast: t('wiz.sent', { id: S.id }) } });
  }

  async function cancel() {
    const S = Wiz.S;
    if (S.dirty && !(await confirmDlg(t('wiz.leaveUnsaved'), t('btn.leave'), 'danger'))) return;
    go(S.id ? 'qrap' : 'board', S.id ? { id: S.id } : { area: S.area });
  }

  /** Kiosk idle timeout: save what was typed as a draft, then back to the board. */
  async function onIdle() {
    const S = Wiz.S;
    const step = S ? S.step : 0;
    const hasText = S && (S.id || S.q.what || S.q.safety);
    if (S && S.dirty && hasText && step >= 1 && step <= 4) {
      const res = await save(step, 'draft');
      toast(res.ok ? t('wiz.idleSaved', { id: S.id }) : t('wiz.idleNotSaved'), res.ok ? 'ok' : 'warn', 7000);
    }
    go('board', { area: S ? S.area : defaultArea() });
  }

  return { render: render, onIdle: onIdle, leave: () => {} };
})();

// ---------------------------------------------------------------- step 1: ① popis problému

Wiz.steps[1] = function (body) {
  const S = Wiz.S;
  const q = S.q;
  const set = k => v => { q[k] = v; S.dirty = true; };
  const otherBox = field(t('f.how_found_other'), textInput(q.how_found_other, set('how_found_other')), { name: 'how_found_other', required: true });
  otherBox.hidden = q.how_found !== 'OTHER';
  const whatHint = h('div', { class: 'fld-hint' });
  const updWhat = () => { whatHint.textContent = (q.what || '').trim().length < 10 ? t('wiz.whatShort') : ''; };
  updWhat();
  const locBox = h('div');
  const drawLoc = () => {
    clear(locBox);
    const codes = locationsOf(S.area, q.zone);
    if (codes.length) locBox.appendChild(segmented(codes.map(c => ({ value: c, label: c })), q.location_code, v => { q.location_code = v; S.dirty = true; drawLoc(); }));
    locBox.appendChild(h('div', { style: { marginTop: '8px' } },
      textInput(codes.indexOf(q.location_code) >= 0 ? '' : q.location_code, v => { q.location_code = v.trim(); S.dirty = true; },
        { placeholder: t('wiz.locOther'), max: 100 })));
  };
  drawLoc();
  const repBox = h('div');
  const drawRep = () => { clear(repBox); if (q.repeat_7d === 'ANO') Wiz.repeatPicker(repBox); };
  drawRep();
  addKids(body, [
    h('h2', null, t('sec.1')),
    field(t('f.safety'), yesNo(q.safety, set('safety'), { lower: true }), { name: 'safety', required: true, hint: t('wiz.safetyHint') }),
    field(t('f.what'), [textArea(q.what, v => { q.what = v; S.dirty = true; updWhat(); }, 3, 2000), whatHint], { name: 'what', required: true, hint: t('wiz.whatHint') }),
    field(t('f.how_found'), segmented(listItems('HOW_FOUND'), q.how_found, v => { q.how_found = v; S.dirty = true; otherBox.hidden = v !== 'OTHER'; }, 'seg-grid'),
      { name: 'how_found', required: true }),
    otherBox,
    field(t('f.detected_at'), h('div', { class: 'row' }, dtInput(q.detected_at, set('detected_at'), nowLocalInput()),
      h('div', { style: { flex: '0 0 auto' } }, button(t('btn.now'), () => { q.detected_at = nowLocalInput(); S.dirty = true; Wiz.draw(); }))),
    { name: 'detected_at', required: true, hint: t('wiz.whenHint') }),
    field(t('f.zone'), segmented(zonesOf(S.area).map(z => ({ value: z, label: z })), q.zone, v => { q.zone = v; q.location_code = ''; S.dirty = true; drawLoc(); }, 'seg-grid'),
      { name: 'zone', required: true }),
    field(t('f.location_code'), locBox, { name: 'location_code', required: true }),
    field(t('f.origin_zone'), selectEl(zonesOf(S.area), q.origin_zone, set('origin_zone'), t('lbl.unknown')), { name: 'origin_zone' }),
    field(t('f.qty'), [h('div', { class: 'row' }, numInput(q.qty, set('qty')), segmented(listItems('UNIT'), q.unit, set('unit'))),
      checkbox(t('f.nok_situation'), q.nok_situation, set('nok_situation'))], { name: 'qty', required: true }),
    field(t('f.repeat_7d'), yesNo(q.repeat_7d, v => { q.repeat_7d = v; S.dirty = true; drawRep(); }, { yesKind: 'warn' }), { name: 'repeat_7d', required: true }),
    field(null, repBox, { name: 'repeat_ref' }),
    field(t('f.finder_name'), h('div', { class: 'row' },
      personSelect(q.finder_name, set('finder_name'), S.area, { roles: ['OPERATOR', 'TL', 'SUPERVISOR'] }),
      textInput(q.finder_badge, set('finder_badge'), { placeholder: t('wiz.badge'), inputmode: 'numeric', max: 40 })),
    { name: 'finder_name', required: true }),
    h('h3', null, t('wiz.optional')),
    h('div', { class: 'row' },
      field(t('f.material_no'), textInput(q.material_no, set('material_no'), { max: 60 }), { name: 'material_no' }),
      field(t('f.hu_or_delivery_no'), textInput(q.hu_or_delivery_no, set('hu_or_delivery_no'), { max: 60 }), { name: 'hu_or_delivery_no' }),
      field(t('f.supplier'), textInput(q.supplier, set('supplier'), { max: 100 }), { name: 'supplier' }))
  ]);
};

/** "Stejný problém v posledních 7 dnech? = ANO": suggestions + manual number. */
Wiz.repeatPicker = async function (box) {
  const S = Wiz.S;
  const q = S.q;
  const list = h('div', null, loadingEl());
  const manual = textInput(q.repeat_ref, v => { q.repeat_ref = v.trim().toUpperCase(); S.dirty = true; }, { placeholder: t('wiz.repeatManual'), max: 60 });
  addKids(box, [h('div', { class: 'fld-label' }, t('wiz.repeatPick')), list, manual]);
  const res = await api('apiSuggestRepeats', { area: S.area, id: S.id, material_no: q.material_no, zone: q.zone, what: q.what,
    detected_at: q.detected_at });
  clear(list);
  if (!res.ok || !res.items.length) { list.appendChild(h('p', { class: 'muted' }, t('wiz.repeatNone'))); return; }
  res.items.forEach(it => list.appendChild(h('button', {
    type: 'button', class: 'sugg' + (q.repeat_ref === it.id ? ' on' : ''),
    onclick: () => { q.repeat_ref = it.id; S.dirty = true; manual.value = it.id; list.querySelectorAll('.sugg').forEach(b => b.classList.remove('on')); }
  }, h('b', null, it.id), ' · ', fmtDT(it.detected_at), ' · ', it.zone || '', h('br'), it.what)));
  list.querySelectorAll('.sugg').forEach(b => b.addEventListener('click', () => b.classList.add('on')));

// ---------------------------------------------------------------- step 2: fotky

Wiz.steps[2] = function (body) {
  const S = Wiz.S;
  const exc = field(t('f.photo_exception'), textArea(S.q.photo_exception, v => { S.q.photo_exception = v; S.dirty = true; }, 3, 500),
    { name: 'photo_exception', required: true });
  exc.hidden = !S.q.photoExc;
  addKids(body, [
    h('h2', null, t('wiz.s2')),
    h('p', { class: 'muted' }, t('wiz.photoHint')),
    h('div', { class: 'photo-slots' }, photoSlot('WRONG'), photoSlot('CORRECT')),
    h('div', { style: { marginTop: '16px' } }, checkbox(t('wiz.photoExc'), S.q.photoExc, v => {
      S.q.photoExc = v; S.dirty = true; exc.hidden = !v; if (!v) S.q.photo_exception = '';
    })),
    exc
  ]);

  function photoSlot(kind) {
    const cur = S.photos[kind];
    const frame = h('div', { class: 'ph-frame' });
    if (cur) {
      const img = h('img', { alt: t('wiz.photo' + kind) });
      loadPhoto(cur.thumb_file_id, img);
      frame.appendChild(img);
    } else {
      frame.appendChild(h('div', { class: 'ph-empty' }, t('wiz.noPhoto')));
    }
    const input = h('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'visually-hidden',
      onchange: e => upload(kind, e.target.files && e.target.files[0]) });
    return h('div', { class: 'photo-slot ph-' + kind.toLowerCase() },
      h('div', { class: 'ph-title' }, t('wiz.photo' + kind)),
      frame,
      h('label', { class: 'btn btn-big ' + (kind === 'WRONG' ? 'btn-danger' : 'btn-ok') }, input,
        cur ? t('wiz.retake') : t('wiz.takePhoto')));

  async function upload(kind, file) {
    if (!file) return;
    let full;
    let thumb;
    try {

    if (!res.ok) { showErrors(res); return; }

    toast(t('wiz.photoSaved'), 'ok');

Wiz.data[1] = () => {

    .forEach(k => { out[k] = q[k] === undefined ? '' : q[k]; });

};
Wiz.data[2] = () => ({ photo_exception: Wiz.S.q.photoExc ? Wiz.S.q.photo_exception : '' });

  ]);

// ---------------------------------------------------------------- step 4: ③ okamžitá opatření <24h

Wiz.steps[4] = function (body) {
  const S = Wiz.S;
  const q = S.q;
  const set = k => v => { q[k] = v; S.dirty = true; };
  if (!S.ia.some(a => !a.remove)) S.ia.push({ id: '', type: '', text: '', owner_name: '', done_at: '', remove: false });

  const checkBox = h('div');
  const drawCheck = () => {
    clear(checkBox);
    if (q.risk_stock_shipped !== 'ANO') return;
    addKids(checkBox, [
      h('div', { class: 'warnbox' }, t('wiz.riskAno')),
      h('div', { class: 'row' },
        field(t('f.checked_qty'), numInput(q.checked_qty, set('checked_qty')), { name: 'checked_qty' }),
        field(t('f.wrong_found_qty'), numInput(q.wrong_found_qty, set('wrong_found_qty')), { name: 'wrong_found_qty' })),
      checkbox(t('f.check_in_progress'), q.check_in_progress, set('check_in_progress'))
    ]);
  };
  drawCheck();

  const iaBox = h('div');
  const drawIa = () => {
    clear(iaBox);
    S.ia.filter(a => !a.remove).forEach((a, i) => iaBox.appendChild(iaRow(a, i + 1)));
    iaBox.appendChild(button(t('wiz.addAction'), () => {
      S.ia.push({ id: '', type: '', text: '', owner_name: '', done_at: '', remove: false });
      S.dirty = true;
      drawIa();
    }, 'ghost'));
  };
  function iaRow(a, n) {
    const upd = k => v => { a[k] = v; S.dirty = true; };
    const doneIn = dtInput(a.done_at, upd('done_at'), nowLocalInput());
    return h('div', { class: 'ia-row' },
      h('div', { class: 'fld-label' }, t('wiz.actionN', { n: n })),
      h('div', { class: 'row' },
        field(t('f.ia_type'), selectEl(listItems('ACTION_TYPE'), a.type, upd('type')), { name: 'ia' + n + '_type' }),
        field(t('f.ia_owner'), personSelect(a.owner_name, upd('owner_name'), S.area), { name: 'ia' + n + '_owner_name' })),
      field(t('f.ia_text'), textInput(a.text, upd('text'), { max: 500, placeholder: t('wiz.actionTextHint') }), { name: 'ia' + n + '_text' }),
      h('div', { class: 'row' },
        field(t('f.ia_done'), h('div', { class: 'row' }, doneIn, h('div', { style: { flex: '0 0 auto' } },
          button(t('btn.doneNow'), () => { a.done_at = nowLocalInput(); doneIn.value = a.done_at; S.dirty = true; }, 'ok'))),
        { name: 'ia' + n + '_done' }),
        h('div', { style: { flex: '0 0 auto', alignSelf: 'center' } }, button(t('btn.remove'), () => {
          if (a.id) a.remove = true; else S.ia.splice(S.ia.indexOf(a), 1);
          S.dirty = true;
          drawIa();
        }, 'ghost'))));
  }
  drawIa();

  const restored = field(t('f.restored_at'), h('div', { class: 'row' }, dtInput(q.restored_at, set('restored_at'), nowLocalInput()),
    h('div', { style: { flex: '0 0 auto' } }, button(t('btn.now'), () => { q.restored_at = nowLocalInput(); S.dirty = true; Wiz.draw(); }))),
  { name: 'restored_at', hint: t('wiz.restoredHint') });
  restored.hidden = q.process_stopped !== 'ANO';

  addKids(body, [
    h('h2', null, t('sec.3')),
    field(t('f.risk_stock_shipped'), yesNo(q.risk_stock_shipped, v => {
      q.risk_stock_shipped = v; S.dirty = true; drawCheck();
      if (Wiz.laterBtn) Wiz.laterBtn.disabled = false;
    }), { name: 'risk_stock_shipped', required: true, hint: t('wiz.riskHint') }),
    checkBox,
    h('h3', null, t('f.ia'), h('span', { class: 'req' }, ' *')),
    iaBox,
    field(t('f.process_stopped'), yesNo(q.process_stopped, v => { q.process_stopped = v; S.dirty = true; restored.hidden = v !== 'ANO'; },
      { lower: true, yesKind: 'warn' }), { name: 'process_stopped', required: true }),
    restored,
    h('p', { class: 'muted' }, t('wiz.laterHint'))
  ]);
};

/** Which ③ rules are not met yet (same codes as section3State_ on the server). */
Wiz.s3Missing = function () {
  const q = Wiz.S.q;
  const ia = Wiz.S.ia.filter(a => !a.remove);
  const m = [];
  const blank = v => v === '' || v === undefined || v === null;
  if (!q.risk_stock_shipped) m.push('RISK');
  if (q.risk_stock_shipped === 'ANO') {
    if (q.check_in_progress) m.push('CHECK_IN_PROGRESS');
    else if (blank(q.checked_qty) || blank(q.wrong_found_qty)) m.push('CHECK_DATA');
  }
  if (!ia.length) m.push('NO_ACTION');
  else if (ia.some(a => !a.done_at)) m.push('ACTION_OPEN');
  if (!q.process_stopped) m.push('PROCESS');
  else if (q.process_stopped === 'ANO' && !q.restored_at) m.push('NOT_RESTORED');
  return m;
};

// ---------------------------------------------------------------- step 5: kontrola a odeslání

Wiz.steps[5] = function (body) {
  const S = Wiz.S;
  const q = S.q;
  const edit = n => h('div', { class: 'btn-row' }, button(t('btn.edit'), () => Wiz.goStep(n), 'ghost'));
  const miss = Wiz.s3Missing();
  const thumbs = h('div', { class: 'thumbs' }, ['WRONG', 'CORRECT'].map(k => {
    const p = S.photos[k];
    if (!p) return null;
    const img = h('img', { alt: t('wiz.photo' + k) });
    loadPhoto(p.thumb_file_id, img);
    return h('div', { class: 'thumb thumb-' + k.toLowerCase() }, h('b', null, t('wiz.photo' + k)), img);
  }));
  addKids(body, [
    h('h2', null, t('wiz.s5')),
    sectionCard('1', t('sec.1'), 'op', kvList([
      [t('f.safety'), yn(q.safety, true)],
      [t('f.what'), q.what],
      [t('f.how_found'), q.how_found === 'OTHER' ? t('lbl.other') + ': ' + (q.how_found_other || '') : listLabel('HOW_FOUND', q.how_found)],
      [t('f.detected_at'), fmtDT(localToMs(q.detected_at))],
      [t('f.where'), [q.zone, q.location_code].filter(Boolean).join(' / ')],
      [t('f.qty'), q.qty === '' || q.qty === undefined ? '' : q.qty + ' ' + listLabel('UNIT', q.unit) + (q.nok_situation ? ' · ' + t('f.nok_situation') : '')],
      [t('f.repeat_7d'), q.repeat_7d === 'ANO' ? t('lbl.yes') + ' → ' + (q.repeat_ref || '?') : yn(q.repeat_7d)],
      [t('f.finder_name'), [q.finder_name, q.finder_badge].filter(Boolean).join(' · ')],
      [t('f.material_no'), q.material_no], [t('f.hu_or_delivery_no'), q.hu_or_delivery_no], [t('f.supplier'), q.supplier]
    ]), thumbs, q.photoExc ? h('p', null, h('b', null, t('f.photo_exception') + ': '), q.photo_exception) : null, edit(1)),
    sectionCard('2', t('sec.2'), 'op', h('p', null, S.roles.map(r => listLabel('ALERT_ROLE', r)).join(', ') || '–',
      S.other_text && S.roles.indexOf('OTHER') >= 0 ? ' (' + S.other_text + ')' : ''), edit(3)),
    sectionCard('3', t('sec.3'), 'op', kvList([
      [t('f.risk_stock_shipped'), yn(q.risk_stock_shipped)],
      [t('f.check'), q.risk_stock_shipped === 'ANO' ? (q.check_in_progress ? t('f.check_in_progress') :
        (q.checked_qty || 0) + ' / ' + (q.wrong_found_qty || 0) + ' ' + t('lbl.pcs')) : ''],
      [t('f.process_stopped'), yn(q.process_stopped, true) + (q.restored_at ? ' → ' + fmtDT(localToMs(q.restored_at)) : '')]
    ]), table([t('f.ia_type'), t('f.ia_text'), t('f.ia_owner'), t('f.ia_done')], S.ia.filter(a => !a.remove).map(a =>
      [listLabel('ACTION_TYPE', a.type), a.text, a.owner_name, a.done_at ? fmtDT(localToMs(a.done_at)) : t('lbl.open')])),
    miss.length ? h('div', { class: 'warnbox' }, t('wiz.s3Later') + ' ' + miss.map(m => t('s3.' + m)).join(', '))
      : h('div', { class: 'okbox' }, t('wiz.s3Complete')), edit(4)),
    S.status === 'DRAFT' ? h('p', { class: 'muted' }, t('wiz.sendHint')) : null
  ]);
};

// ---------------------------------------------------------------- checks (mirror of the server rules)

Wiz.validate[1] = function () {
  const q = Wiz.S.q;
  const e = [];
  const w = [];
  const req = f => e.push({ code: 'E_REQUIRED', field: f });
  if (!q.safety) req('safety');
  const what = String(q.what || '').trim();
  if (!what) req('what'); else if (what.length < 10) w.push({ code: 'W_WHAT_SHORT' });
  if (!q.how_found) req('how_found');
  else if (q.how_found === 'OTHER' && !String(q.how_found_other || '').trim()) req('how_found_other');
  const det = localToMs(q.detected_at);
  if (!q.detected_at || isNaN(det)) req('detected_at');
  else if (det > Date.now() + 5 * 60000) e.push({ code: 'E_FUTURE', field: 'detected_at' });
  else if (det < Date.now() - 24 * 3600000) w.push({ code: 'W_OLD_DETECTION' });
  if (!q.zone) req('zone');
  if (!q.location_code) req('location_code');
  if (q.qty === '' || q.qty === undefined) req('qty');
  else if (!Number.isInteger(q.qty) || q.qty < 0) e.push({ code: 'E_INVALID', field: 'qty' });
  else if (q.qty === 0 && !q.nok_situation) e.push({ code: 'E_QTY_ZERO', field: 'qty' });
  else if (q.qty > 0 && !q.unit) req('unit');
  if (!q.repeat_7d) req('repeat_7d');
  else if (q.repeat_7d === 'ANO' && !q.repeat_ref) e.push({ code: 'E_REPEAT_REF', field: 'repeat_ref' });
  if (!q.finder_name && !String(q.finder_badge || '').trim()) req('finder_name');
  return { errors: e, warnings: w };
};

Wiz.validate[2] = function () {
  const S = Wiz.S;
  const e = [];
  const photos = S.photos.WRONG && S.photos.CORRECT;
  if (!photos) {
    if (!S.q.photoExc) e.push({ code: 'E_PHOTOS' });
    else if (String(S.q.photo_exception || '').trim().length < 3) e.push({ code: 'E_REQUIRED', field: 'photo_exception' });
  }
  return { errors: e, warnings: [] };
};

Wiz.validate[3] = function () {
  const S = Wiz.S;
  const e = [];
  if (!S.roles.length) e.push({ code: 'E_ALERT_NONE' });
  if (S.roles.indexOf('OTHER') >= 0 && !String(S.other_text || '').trim()) e.push({ code: 'E_REQUIRED', field: 'alert_other' });
  return { errors: e, warnings: [] };
};

Wiz.validate[4] = function (mode) {
  const q = Wiz.S.q;
  const e = [];
  const num = v => v !== '' && v !== undefined && v !== null;
  if (!q.risk_stock_shipped) e.push({ code: 'E_REQUIRED', field: 'risk_stock_shipped' });
  if (num(q.checked_qty) && num(q.wrong_found_qty) && q.wrong_found_qty > q.checked_qty) {
    e.push({ code: 'E_WRONG_GT_CHECKED', field: 'wrong_found_qty' });
  }
  const det = localToMs(q.detected_at);
  if (q.process_stopped === 'ANO' && q.restored_at && localToMs(q.restored_at) < det) {
    e.push({ code: 'E_RESTORED_BEFORE', field: 'restored_at' });
  }
  Wiz.S.ia.filter(a => !a.remove).forEach((a, i) => {
    const n = i + 1;
    if (!a.type) e.push({ code: 'E_IA_ROW', row: n, field: 'ia' + n + '_type' });
    if (!String(a.text || '').trim()) e.push({ code: 'E_IA_ROW', row: n, field: 'ia' + n + '_text' });
    if (!a.owner_name) e.push({ code: 'E_IA_ROW', row: n, field: 'ia' + n + '_owner_name' });
    if (a.done_at) {
      const d = localToMs(a.done_at);
      if (d > Date.now() + 5 * 60000) e.push({ code: 'E_IA_DONE_FUTURE', row: n, field: 'ia' + n + '_done' });
      else if (d < det) e.push({ code: 'E_IA_DONE_BEFORE', row: n, field: 'ia' + n + '_done' });
    }
  });
  if (mode === 'next' && !e.length) {
    const miss = Wiz.s3Missing();
    if (miss.length) e.push({ code: 'E_S3_INCOMPLETE', missing: miss });
  }
  return { errors: e, warnings: [] };
};

/** Before "Odeslat". Returns a list of errors. */
Wiz.validate[5] = function () {
  const S = Wiz.S;
  const e = [];
  if (!S.q.s1_done_at) e.push({ code: 'E_S1_INCOMPLETE' });
  e.push.apply(e, Wiz.validate[2]().errors);
  e.push.apply(e, Wiz.validate[3]().errors);
  if (!S.q.risk_stock_shipped) e.push({ code: 'E_REQUIRED', field: 'risk_stock_shipped' });
  return e;
};

Wiz.data[3] = () => ({ roles: Wiz.S.roles.slice(), other_text: Wiz.S.other_text || '' });
Wiz.data[4] = () => {
  const q = Wiz.S.q;
  const val = v => (v === undefined || v === null ? '' : v);
  return {
    risk_stock_shipped: val(q.risk_stock_shipped), checked_qty: val(q.checked_qty), wrong_found_qty: val(q.wrong_found_qty),
    check_in_progress: !!q.check_in_progress, process_stopped: val(q.process_stopped), restored_at: val(q.restored_at),
    actions: Wiz.S.ia.filter(a => a.id || a.type || a.text || a.owner_name).map(a => ({ id: a.id, type: a.type, text: a.text,
      owner_name: a.owner_name, done_at: a.done_at, remove: a.remove }))
  };
};

  <script>
'use strict';
/*
 * ViewQrap – read-only detail of one QRAP (?page=qrap&id=…): all 7 sections in the order of the paper row,
 * photos, the buttons the current user may use next, a QR code to the supervisor page and the admin tools.
 */
App.views.qrap = (() => {
  async function render(root, params) {
    root.appendChild(loadingEl());
    const res = await api('apiGetQrap', params.id);
    if (!root.isConnected) return;
    clear(root);
    if (!res.ok) { root.appendChild(h('div', { class: 'empty' }, errText(res.errors[0]))); return; }
    draw(root, res.detail);
  }

  function draw(root, d) {
    const q = d.q;
    addKids(root, [topCard(d), actionButtons(d), sec1(d), sec2(d), sec3(d), sec4(d), sec5(d), sec6(d), sec7(d), adminBox(d)]);
  }

  function topCard(d) {
    const q = d.q;
    const related = [];
    if (q.parent_id) related.push([t('f.parent_id'), qrapLink(q.parent_id)]);
    if (q.assign_ref) related.push([t('f.assign_ref'), qrapLink(q.assign_ref)]);
    return h('div', { class: 'card top-card' },
      h('div', { class: 'grow' },
        h('h1', null, q.qrap_id, q.safety === 'ANO' ? h('span', { class: 'badge badge-safety' }, 'SAFETY') : null,
          q.archived === true ? h('span', { class: 'badge badge-archived' }, t('lbl.archived')) : null),
        h('p', null, statusBadge(q.status), d.waiting ? ' ' + t('board.waitFor') + ' ' + t('wait.' + d.waiting) : ''),
        chipsEl(d.chips),
        kvList([[t('f.area'), q.area_code + ' · ' + areaName(q.area_code)], [t('f.level'), q.level]].concat(related)),
        h('p', { class: 'small muted' }, q.template_version)),
      h('div', null, qrCode(d.links.decide), h('div', { class: 'small muted', style: { maxWidth: '190px' } }, t('qrap.qrHint'))));
  }

  /** Buttons for what this user may do next (flags come from the server). */
  function actionButtons(d) {
    const q = d.q;
    const c = d.can;
    const b = [];
    if (c.editQr && q.status === 'DRAFT') b.push(button(t('qrap.continue'), () => go('wizard', { id: q.qrap_id, step: 1 }), 'op', { big: true }));
    if (c.editQr && q.status !== 'DRAFT') {
      b.push(button(t('qrap.editQr'), () => go('wizard', { id: q.qrap_id, step: 1 }), 'ghost'));
      if (!d.s3.complete) b.push(button(t('qrap.finishS3'), () => go('wizard', { id: q.qrap_id, step: 4 }), 'op', { big: true }));
    }
    if (c.decide || c.shiftInfo) b.push(button(t('qrap.decide'), () => go('decide', { id: q.qrap_id }), 'primary', { big: true }));
    if (['ANALYSIS', 'ACTIONS_OPEN', 'VERIFY', 'CLOSED'].indexOf(q.status) >= 0) {
      b.push(button(t('qrap.analysis'), () => go('analysis', { id: q.qrap_id }), c.analyze ? 'pil' : 'ghost', { big: c.analyze }));
    }
    if (c.effect) b.push(button(t('qrap.effect'), () => go('effect', { id: q.qrap_id }), 'ok', { big: true }));
    if (c.close) b.push(button(t('qrap.close'), () => go('close', { id: q.qrap_id }), 'primary', { big: true }));
    if (c.assess) b.push(button(t('qrap.assess'), () => go('assess', { id: q.qrap_id }), 'mgr'));
    b.push(button(t('nav.board'), () => go('board', { area: q.area_code }), 'ghost'));
    return h('div', { class: 'btn-row' }, b);
  }

  function sec1(d) {
    const q = d.q;
    return sectionCard('1', t('sec.1'), 'op', kvList([
      [t('f.safety'), yn(q.safety, true)],
      [t('f.what'), q.what],
      [t('f.how_found'), listLabel('HOW_FOUND', q.how_found)],
      [t('f.detected_at'), fmtDT(q.detected_at)],
      [t('f.where'), [q.zone, q.location_code].filter(Boolean).join(' / ')],
      [t('f.origin_zone'), q.origin_zone],
      [t('f.qty'), q.qty === '' ? '' : q.qty + ' ' + listLabel('UNIT', q.unit) + (q.nok_situation === true ? ' · ' + t('f.nok_situation') : '')],
      [t('f.repeat_7d'), q.repeat_7d === 'ANO' ? h('span', null, t('lbl.yes') + ' → ', qrapLink(q.repeat_ref)) : yn(q.repeat_7d)],
      [t('f.finder_name'), [q.finder_name, q.finder_badge].filter(Boolean).join(' · ')],
      [t('f.material_no'), q.material_no], [t('f.hu_or_delivery_no'), q.hu_or_delivery_no], [t('f.supplier'), q.supplier],
      [t('f.sent_at'), fmtDT(q.sent_at)]
    ]), photos(d), q.photo_exception ? h('p', null, h('b', null, t('f.photo_exception') + ': '), q.photo_exception) : null);
  }

  function photos(d) {
    return h('div', { class: 'thumbs' }, ['WRONG', 'CORRECT'].map(kind => {
      const p = d.photos.find(x => x.kind === kind);

      return h('div', { class: 'thumb thumb-' + kind.toLowerCase(), onclick: () => showPhoto(p.file_id, t('wiz.photo' + kind)) },
        h('b', null, t('wiz.photo' + kind)), img);
    }));
  }

  function sec2(d) {
    return sectionCard('2', t('sec.2'), 'op', d.alerts.length ? table([t('f.role'), t('f.notified_to'), t('f.at')], d.alerts.map(a => [
      listLabel('ALERT_ROLE', a.role_code) + (a.other_text ? ' (' + a.other_text + ')' : ''), a.notified_to, fmtDT(a.notified_at)]))
      : h('p', { class: 'muted' }, '–'));
  }

  function sec3(d) {
    const q = d.q;
    return sectionCard('3', t('sec.3'), 'op', kvList([
      [t('f.risk_stock_shipped'), yn(q.risk_stock_shipped)],
      [t('f.check'), q.risk_stock_shipped === 'ANO' ? (q.check_in_progress === true ? t('f.check_in_progress')
        : (q.checked_qty === '' ? '–' : q.checked_qty) + ' / ' + (q.wrong_found_qty === '' ? '–' : q.wrong_found_qty) + ' ' + t('lbl.pcs')) : ''],
      [t('f.process_stopped'), yn(q.process_stopped, true) + (q.restored_at ? ' → ' + fmtDT(q.restored_at) : '')],
      [t('f.containment_done_at'), fmtDT(q.containment_done_at)]
    ]), d.ia.length ? table([t('f.ia_type'), t('f.ia_text'), t('f.ia_owner'), t('f.ia_done')], d.ia.map(a =>
      [listLabel('ACTION_TYPE', a.type), a.text, a.owner_name, a.done_at ? fmtDT(a.done_at) : t('lbl.open')])) : null,
    d.s3.complete ? h('div', { class: 'okbox' }, t('wiz.s3Complete'))
      : h('div', { class: 'warnbox' }, t('wiz.s3Later') + ' ' + d.s3.missing.map(m => t('s3.' + m)).join(', ')),
    d.can.editCheck && !d.can.editQr ? checkForm(d) : null);
  }

  /** Quality may correct the ③ check data. */
  function checkForm(d) {
    const v = { checked_qty: d.q.checked_qty, wrong_found_qty: d.q.wrong_found_qty, check_in_progress: d.q.check_in_progress === true };
    const box = errorBox();
    const form = h('div', { class: 'card' }, h('h3', null, t('qrap.qualityCheck')), box,
      h('div', { class: 'row' },
        field(t('f.checked_qty'), numInput(v.checked_qty, x => { v.checked_qty = x; }), { name: 'checked_qty' }),
        field(t('f.wrong_found_qty'), numInput(v.wrong_found_qty, x => { v.wrong_found_qty = x; }), { name: 'wrong_found_qty' })),
      checkbox(t('f.check_in_progress'), v.check_in_progress, x => { v.check_in_progress = x; }),
      button(t('btn.save'), async () => {
        const res = await api('apiSaveStep', { id: d.q.qrap_id, step: 4, mode: 'later', data: v });
        if (!res.ok) { showErrors(res, box, form); return; }
        toast(t('msg.saved'), 'ok');
        render(clear(byId('app')), App.params);
      }, 'primary'));
    return form;
  }

  function sec4(d) {
    const q = d.q;
    const shifts = App.set.shifts.map(s => {
      const r = d.shiftInfo.find(x => x.shift_code === s.code);
      return [s.name, r ? personName(r.informed_by) + ' · ' + fmtDT(r.informed_at) : '–'];
    });
    return sectionCard('4', t('sec.4'), 'sup',
      h('h3', null, t('f.shiftInfo')), kvList(shifts),
      kvList([
        [t('f.decision'), q.decision ? t('dec.' + q.decision) : t('lbl.notYet')],
        [t('f.decision_comment'), q.decision_comment],
        [t('f.pilots'), d.pilots.map(p => p.name).join(', ')],
        [t('f.assign_ref'), q.assign_ref ? qrapLink(q.assign_ref) : ''],
        [t('f.signed'), q.decided_by ? personName(q.decided_by) + ' · ' + fmtDT(q.decided_at) : '']
      ]));
  }

  function sec5(d) {
    if (d.q.status === 'CLOSED_SOLVED' || d.q.status === 'ESCALATED') return sectionCard('5', t('sec.5'), 'pil', h('p', { class: 'muted' }, t('lbl.notNeeded')));
    const chains = ['OCCURRENCE', 'NON_DETECTION'].map(ch => {
      const steps = d.why.filter(w => w.chain === ch && w.text).sort((a, b) => a.step - b.step);
      if (!steps.length) return null;
      return h('div', null, h('h3', null, t('why.' + ch)), h('ol', null, steps.map(w => h('li', { class: w.is_root === true ? 'why-root' : '' },
        w.text, w.is_root === true ? ' ← ' + t('why.root') : ''))));
    });
    return sectionCard('5', t('sec.5'), 'pil', chains.some(Boolean) ? chains : h('p', { class: 'muted' }, t('lbl.notYet')));
  }

  function sec6(d) {
    const q = d.q;
    if (q.status === 'CLOSED_SOLVED' || q.status === 'ESCALATED') return sectionCard('6', t('sec.6'), 'pil', h('p', { class: 'muted' }, t('lbl.notNeeded')));
    const acts = d.actions.filter(a => a.status !== 'REMOVED');
    return sectionCard('6', t('sec.6'), 'pil',
      kvList([[t('f.learned'), q.learned], [t('f.std_update'), q.std_update ? yn(q.std_update) + (q.std_update_ref ? ' → ' + q.std_update_ref : '') : '']]),
      acts.length ? table([t('f.action_text'), t('f.root_step'), t('f.pilot'), t('f.planned'), t('f.done'), t('f.status')], acts.map(a =>
        [a.text, a.root_step, a.pilot_name, fmtD(a.planned), fmtD(a.done), t('ast.' + a.status) + (a.late ? ' · ' + t('lbl.late') : '')]),
      i => (acts[i].late ? 'late' : '')) : null,
      h('h3', null, t('f.effect'), ' (', t('eff.round', { n: d.eff.round }), ')'),
      h('div', { class: 'slots' }, d.eff.slots.map((s, i) => h('div', { class: 'slot' + (s ? ' slot-' + s.result : '') },
        h('b', null, (i + 1) + '. '), s ? [t('eff.' + s.result), h('br'), fmtD(s.shift_date) + ' · ' + shiftName(s.shift_code)] : '–'))),
      kvList([[t('f.closed'), q.status === 'CLOSED' && q.closed_by ? personName(q.closed_by) + ' · ' + fmtDT(q.closed_at) : '']]));
  }

  function sec7(d) {
    const a = d.assess[0];
    if (!a) return sectionCard('7', t('sec.7'), 'mgr', h('p', { class: 'muted' }, t('assess.none')));
    return sectionCard('7', t('sec.7'), 'mgr',
      kvList([1, 2, 3, 4, 5].map(n => [t('assess.c' + n), t('assessVal.' + a['c' + n])]).concat([
        [t('f.ojt_with'), a.ojt_with], [t('f.feedback'), a.feedback + (a.feedback_type ? ' (' + t('fb.' + a.feedback_type) + ')' : '')],
        [t('f.assessor'), personName(a.assessor) + ' · ' + fmtDT(a.at)]])),
      h('p', { class: 'small muted' }, t('assess.count', { n: d.assess.length })));
  }

  /** Admin: unlock ①–③ / ④, reopen, archive. A reason is always required. */
  function adminBox(d) {
    if (!d.can.admin) return null;
    const q = d.q;
    const run = async (fn, payload, title) => {
      const reason = await promptDlg(title, t('admin.reason'), 5);
      if (!reason) return;
      const res = await api(fn, Object.assign({ id: q.qrap_id, reason: reason }, payload));
      if (!res.ok) { showErrors(res); return; }
      toast(t('msg.saved'), 'ok');
      render(clear(byId('app')), App.params);
    };
    const locked = String(q.locked_parts || '').split(',');
    return h('section', { class: 'card' }, h('h2', null, t('admin.title')), h('p', { class: 'small muted' }, t('admin.locked') + ': ' + (q.locked_parts || '–')),
      h('div', { class: 'btn-row' },
        locked.indexOf('QR') >= 0 && ['DRAFT', 'QR_OPEN', 'WAIT_DECISION'].indexOf(q.status) >= 0
          ? button(t('admin.unlockQr'), () => run('apiAdminUnlock', { part: 'QR' }, t('admin.unlockQr')), 'danger') : null,
        ['ANALYSIS', 'CLOSED_SOLVED'].indexOf(q.status) >= 0
          ? button(t('admin.unlockDecision'), () => run('apiAdminUnlock', { part: 'DECISION' }, t('admin.unlockDecision')), 'danger') : null,
        ['CLOSED', 'CLOSED_SOLVED'].indexOf(q.status) >= 0 ? button(t('admin.reopen'), () => run('apiAdminReopen', {}, t('admin.reopen')), 'danger') : null,
        button(q.archived === true ? t('admin.unarchive') : t('admin.archive'),
          () => run('apiAdminArchive', { archived: q.archived !== true }, q.archived === true ? t('admin.unarchive') : t('admin.archive')), 'ghost')));
  }

  return { render: render };
})();

  <script>
'use strict';
/*
 * ViewDecide – supervisor pages for the phone.
 *   ?page=decide&id=…  ④ Rozhodnutí OJT: shift ticks, one decision, pilots, comment, signature.
 *   ?page=close&id=…   Uzavření: closure checklist + signature.
 * The server checks every guard again; the page only shows them early.
 */
App.views.decide = (() => {
  let D = null;       // detail from the server
  let form = null;    // {decision, comment, pilots[]}

  async function render(root, params) {
    root.appendChild(loadingEl());
    const res = await api('apiGetQrap', params.id);
    if (!root.isConnected) return;
    clear(root);
    if (!res.ok) { root.appendChild(h('div', { class: 'empty' }, errText(res.errors[0]))); return; }
    D = res.detail;
    form = { decision: '', comment: '', pilots: [] };
    draw(root);
  }

  function draw(root) {
    const q = D.q;
    clear(root);
    addKids(root, [
      h('h1', null, t('dec.title'), ' · ', q.qrap_id),
      summary(),
      shiftsCard(),
      q.decision ? decidedCard() : decisionCard(),
      h('div', { class: 'btn-row' },
        button(t('qrap.detail'), () => go('qrap', { id: q.qrap_id }), 'ghost'),
        D.can.assess ? button(t('qrap.assess'), () => go('assess', { id: q.qrap_id }), 'mgr') : null,
        D.can.close ? button(t('qrap.close'), () => go('close', { id: q.qrap_id }), 'primary') : null,
        D.can.analyze ? button(t('qrap.analysis'), () => go('analysis', { id: q.qrap_id }), 'pil') : null)
    ]);
  }

  /** Short facts of ①–③ so the supervisor can decide at the board. */
  function summary() {
    const q = D.q;
    const photos = h('div', { class: 'thumbs' }, D.photos.filter(p => p.kind !== 'DOC').map(p => {
      const img = h('img', { alt: '' });
      loadPhoto(p.thumb_file_id, img);
      return h('div', { class: 'thumb thumb-' + p.kind.toLowerCase(), style: { width: '46%' }, onclick: () => showPhoto(p.file_id) },
        h('b', null, t('wiz.photo' + p.kind)), img);
    }));
    return h('div', { class: 'card sec sec-op' },
      h('p', null, statusBadge(q.status), q.safety === 'ANO' ? h('span', { class: 'badge badge-safety' }, 'SAFETY') : null,
        q.repeat_7d === 'ANO' ? h('span', { class: 'badge badge-rep' }, t('board.repeat')) : null),
      h('p', { style: { fontSize: '20px', fontWeight: '700' } }, q.what),
      kvList([
        [t('f.detected_at'), fmtDT(q.detected_at)],
        [t('f.where'), [q.zone, q.location_code].filter(Boolean).join(' / ')],
        [t('f.qty'), q.qty === '' ? '' : q.qty + ' ' + listLabel('UNIT', q.unit)],
        [t('f.repeat_7d'), q.repeat_7d === 'ANO' ? h('span', null, t('lbl.yes') + ' → ', qrapLink(q.repeat_ref)) : yn(q.repeat_7d)],
        [t('f.risk_stock_shipped'), yn(q.risk_stock_shipped)],
        [t('f.wrong_found_qty'), q.wrong_found_qty === '' ? '' : String(q.wrong_found_qty)],
        [t('f.finder_name'), q.finder_name]
      ]),
      photos,
      D.s3.complete ? h('div', { class: 'okbox' }, t('wiz.s3Complete'))
        : h('div', { class: 'warnbox' }, t('dec.s3Missing') + ' ' + D.s3.missing.map(m => t('s3.' + m)).join(', ')));
  }

  /** "Informace všem směnám během 5' meetingu" – one tick per shift. */
  function shiftsCard() {
    const q = D.q;
    const btns = App.set.shifts.map(s => {
      const r = D.shiftInfo.find(x => x.shift_code === s.code);
      const label = r ? '✓ ' + s.name + ' · ' + personName(r.informed_by) + ' ' + fmtDT(r.informed_at) : s.name;
      return button(label, async () => {
        const res = await api('apiSaveShiftInfo', { id: q.qrap_id, shift_code: s.code });
        if (!res.ok) { showErrors(res); return; }
        D.shiftInfo = res.shiftInfo;
        draw(byId('app'));
      }, 'ghost shift-btn' + (r ? ' on' : ''), { disabled: !!r || !D.can.shiftInfo });
    });
    return h('div', { class: 'card sec sec-sup' }, h('h2', null, t('f.shiftInfo')), h('div', { class: 'btn-row' }, btns),
      !D.can.shiftInfo && !q.decision ? h('p', { class: 'small muted' }, t('dec.shiftNoRight')) : null);
  }

  function decisionCard() {
    const q = D.q;
    const box = errorBox();
    if (!D.can.decide) {
      const why = App.user.isKiosk ? t('err.E_KIOSK_SIGN') : q.status !== 'WAIT_DECISION' ? t('dec.notReady') : t('dec.noRight');
      return h('div', { class: 'card sec sec-sup' }, h('h2', null, t('f.decision')), h('p', { class: 'warnbox' }, why));
    }
    const guards = h('div');
    const pilotBox = h('div');
    const opt = (value, sub, disabled) => h('button', {
      type: 'button', class: 'dec-opt' + (form.decision === value ? ' on' : ''), disabled: disabled,
      onclick: () => { form.decision = value; draw(byId('app')); }
    }, t('dec.' + value), h('small', null, sub));
    const parent = D.parentArea;
    const existing = D.pilots.map(p => p.email);
    if (form.decision === 'CONTINUE') {
      addKids(pilotBox, [
        existing.length ? h('p', null, t('f.pilots') + ': ' + D.pilots.map(p => p.name).join(', ')) : null,
        field(t('dec.addPilot'), multiToggle(App.set.people.filter(p => p.email && p.roles.indexOf('KIOSK') < 0 && existing.indexOf(p.email) < 0)
          .sort((a, b) => (b.roles.indexOf('PILOT') >= 0) - (a.roles.indexOf('PILOT') >= 0)) // people with the PILOT role first
          .map(p => ({ value: p.email, label: p.name })), form.pilots, v => { form.pilots = v; }), { name: 'pilots', required: !existing.length })
      ]);
    }
    const warn = [];
    if (form.decision === 'SOLVED' && q.repeat_7d === 'ANO') warn.push(t('warn.W_SOLVED_REPEAT'));
    if (form.decision === 'SOLVED' && Number(q.wrong_found_qty) > 0) warn.push(t('warn.W_SOLVED_WRONG', { n: q.wrong_found_qty }));
    if (warn.length) guards.appendChild(h('div', { class: 'warnbox' }, h('ul', null, warn.map(w => h('li', null, w)))));
    return h('div', { class: 'card sec sec-sup' },
      h('h2', null, t('f.decision')), box,
      opt('CONTINUE', t('dec.CONTINUE_sub')),
      opt('SOLVED', q.safety === 'ANO' ? t('err.E_SOLVED_SAFETY') : t('dec.SOLVED_sub'), q.safety === 'ANO'),
      opt('ESCALATE', parent ? t('dec.ESCALATE_sub', { area: parent }) : t('err.E_NO_PARENT'), !parent),
      pilotBox, guards,
      field(t('f.decision_comment'), textArea(form.comment, v => { form.comment = v; }, 3, 2000),
        { name: 'decision_comment', required: form.decision === 'SOLVED' || form.decision === 'ESCALATE' }),
      button(t('dec.sign'), () => sign(box), 'primary', { big: true }),
      h('p', { class: 'small muted' }, t('dec.signHint', { user: App.user.email })));
  }

  async function sign(box, confirmed) {
    const q = D.q;
    const errs = [];
    if (!form.decision) errs.push({ code: 'E_REQUIRED', field: 'decision' });
    if ((form.decision === 'SOLVED' || form.decision === 'ESCALATE') && !form.comment.trim()) errs.push({ code: 'E_REQUIRED', field: 'decision_comment' });
    if (form.decision === 'CONTINUE' && !D.pilots.length && !form.pilots.length) errs.push({ code: 'E_PILOT_REQUIRED', field: 'pilots' });
    if (!setErrors(box, errs, byId('app'))) return;
    const res = await api('apiSignDecision', { id: q.qrap_id, decision: form.decision, comment: form.comment, pilots: form.pilots,
      confirmWarnings: !!confirmed });
    if (!res.ok && res.needConfirm) {
      if (await warnConfirm(res.warnings)) return sign(box, true);
      return;
    }
    if (!res.ok) { showErrors(res, box, byId('app')); return; }
    toast(res.copyId ? t('dec.escalated', { id: res.copyId }) : t('dec.signed'), 'ok', 6000);
    render(clear(byId('app')), { id: q.qrap_id });
  }

  function decidedCard() {
    const q = D.q;
    return h('div', { class: 'card sec sec-sup' }, h('h2', null, t('f.decision')), kvList([
      [t('f.decision'), t('dec.' + q.decision)],
      [t('f.decision_comment'), q.decision_comment],
      [t('f.pilots'), D.pilots.map(p => p.name).join(', ')],
      [t('f.assign_ref'), q.assign_ref ? qrapLink(q.assign_ref) : ''],
      [t('f.signed'), personName(q.decided_by) + ' · ' + fmtDT(q.decided_at)]
    ]), h('p', { class: 'okbox' }, t('dec.locked')));
  }

  return { render: render };
})();

App.views.close = (() => {
  async function render(root, params) {
    root.appendChild(loadingEl());
    const res = await api('apiGetQrap', params.id);
    if (!root.isConnected) return;
    clear(root);
    if (!res.ok) { root.appendChild(h('div', { class: 'empty' }, errText(res.errors[0]))); return; }
    const d = res.detail;
    const q = d.q;
    const box = errorBox();
    addKids(root, [
      h('h1', null, t('close.title'), ' · ', q.qrap_id),
      h('div', { class: 'card sec sec-pil' },
        h('p', null, statusBadge(q.status), ' ', q.what),
        h('ul', { class: 'check-list' }, d.closure.items.map(i => h('li', { class: i.ok ? 'pill-ok' : 'pill-bad' },
          (i.ok ? '✓ ' : '✗ ') + t('close.' + i.code)))),
        h('div', { class: 'slots' }, d.eff.slots.map((s, i) => h('div', { class: 'slot' + (s ? ' slot-' + s.result : '') },
          h('b', null, (i + 1) + '. '), s ? [t('eff.' + s.result), h('br'), fmtD(s.shift_date) + ' · ' + shiftName(s.shift_code)] : '–')))),
      box,
      q.status === 'CLOSED' ? h('div', { class: 'okbox' }, t('close.done', { who: personName(q.closed_by), at: fmtDT(q.closed_at) }))
        : d.can.close ? button(t('close.sign'), async () => {
          const r = await api('apiSignClosure', { id: q.qrap_id });
          if (!r.ok) { showErrors(r, box); return; }
          toast(t('close.signed'), 'ok', 6000);
          render(clear(byId('app')), params);
        }, 'primary', { big: true, disabled: !d.closure.ok })
          : h('div', { class: 'warnbox' }, App.user.isKiosk ? t('err.E_KIOSK_SIGN') : t('close.noRight')),
      h('div', { class: 'btn-row' }, button(t('qrap.detail'), () => go('qrap', { id: q.qrap_id }), 'ghost'),
        d.can.effect ? button(t('qrap.effect'), () => go('effect', { id: q.qrap_id }), 'ok') : null)
    ]);
  }
  return { render: render };
})();
</script>

  <script>
'use strict';
/*
 * ViewAnalysis – ⑤ PŘÍČINA 5 Proč? and ⑥ Konečné akce for the pilot (PC), ?page=analysis&id=…
 * ⑤ + lesson + standard question are saved together (apiSaveAnalysis); each action row is saved on its own
 * (apiSaveDefAction). The status (ANALYSIS → ACTIONS_OPEN → VERIFY) is moved by the server.
 */
App.views.analysis = (() => {
  let D = null;
  let F = null; // form state for ⑤ and the single ⑥ fields

  async function render(root, params) {
    root.appendChild(loadingEl());
    const res = await api('apiGetQrap', params.id);
    if (!root.isConnected) return;
    clear(root);
    if (!res.ok) { root.appendChild(h('div', { class: 'empty' }, errText(res.errors[0]))); return; }
    D = res.detail;
    const text = (ch, n) => ((D.why.find(w => w.chain === ch && Number(w.step) === n) || {}).text || '');
    const root_ = ch => Number((D.why.find(w => w.chain === ch && w.is_root === true) || {}).step || 0);
    F = {
      why: { OCCURRENCE: [1, 2, 3, 4, 5].map(n => text('OCCURRENCE', n)), NON_DETECTION: [1, 2, 3, 4, 5].map(n => text('NON_DETECTION', n)) },
      root: { OCCURRENCE: root_('OCCURRENCE'), NON_DETECTION: root_('NON_DETECTION') },
      showNd: D.why.some(w => w.chain === 'NON_DETECTION' && w.text),
      learned: D.q.learned || '', std_update: D.q.std_update || '', std_update_ref: D.q.std_update_ref || ''
    };
    draw(root);
  }

  function draw(root) {
    const q = D.q;
    const edit = D.can.analyze;
    clear(root);
    addKids(root, [
      h('h1', null, t('ana.title'), ' · ', q.qrap_id),

  function chainEl(ch, edit) {
    const list = h('div');
    const drawSteps = () => {

      h('div', { class: 'row' },

      h('div', { class: 'row' },

        field(t('f.done'), dateInput(v.done, x => { v.done = x; }, { max: todayLocal() }), { name: 'done', hint: t('ana.doneHint') }),
        field(t('f.evidence_url'), textInput(v.evidence_url, x => { v.evidence_url = x; }, { max: 500, placeholder: 'https://' }), { name: 'evidence_url' })),
      canEdit ? h('div', { class: 'btn-row' },

      a ? notesEl(a) : null);
    if (!canEdit) card.querySelectorAll('input, select, textarea').forEach(el => { el.disabled = true; });

/*

App.views.effect = (() => {

    const old = d.eff.history.filter(r => Number(r.round) < d.eff.round);
    addKids(root, [
      h('h1', null, t('eff.title'), ' · ', q.qrap_id),
      h('div', { class: 'card' }, h('p', null, statusBadge(q.status), ' ', q.what),

        h('p', { class: 'small muted' }, t('eff.hint'))),

      h('div', { class: 'btn-row' }, button(t('qrap.detail'), () => go('qrap', { id: q.qrap_id }), 'ghost'),

    ]);

    const box = errorBox();

    const hints = {
      c1: (q.s1_done_at ? '✓ ' : '✗ ') + t('assess.h1'),
      c2: (d.s3.complete ? '✓ ' : '✗ ') + t('assess.h2') + (d.ia.length ? ' · ' + t('assess.hActions', { n: d.ia.length }) : ''),

      c4: t('assess.h4', { n: d.shiftInfo.length, all: App.set.shifts.length }) + (q.learned ? ' · ✓ ' + t('f.learned') : ''),
      c5: t('assess.h5')
    };
    const photos = h('div', { class: 'thumbs' }, d.photos.filter(p => p.kind !== 'DOC').map(p => {
      const img = h('img', { alt: '' });
      loadPhoto(p.thumb_file_id, img);

    }));
    const criteria = [1, 2, 3, 4, 5].map(n => field(t('assess.c' + n), [
      h('div', { class: 'fld-hint' }, t('assess.sub' + n) + ' — ' + hints['c' + n]),

      segmented([{ value: 'OK', label: 'OK', kind: 'ok' }, { value: 'NOK', label: 'NOK', kind: 'danger' }, { value: 'NA', label: 'N/A' }],
        f['c' + n], v => { f['c' + n] = v; }, 'seg-big')
    ], { name: 'c' + n, required: true }));
    addKids(root, [

          v => { f.feedback_type = v; }), { name: 'feedback_type' }),
        h('p', { class: 'small muted' }, t('assess.auto', { user: App.user.name })),
        button(t('assess.save'), async () => {
