  return h('div', null,
    h('div', { class: 'hero' }, h('div', null, h('h1', null, 'Přehled'),
      h('div', { class: 'sub' }, 'Data: ' + (S.all ? 'všechny QRAP' : 'otevřené + uzavřené za posledních ' + (S.cfg.ZOBRAZIT_UZAVRENE_DNI || 60) + ' dní'))),
      S.all ? null : h('button', { class: 'btn', onclick: e => refresh(false, e.currentTarget, true) }, 'Načíst všechna data')),
    h('div', { class: 'tiles tiles-6' },
      tile(open.length, 'Otevřené', 'open'), tile(open.filter(isLate).length, 'Po termínu', 'late', true),
      tile(open.filter(FILTERS.decide.test).length, 'Čeká na rozhodnutí', 'decide'),
      tile(open.filter(FILTERS.approve.test).length, 'Čeká na manažera', 'approve'),
      tile(open.filter(q => q.safety === 'ANO').length, 'SAFETY otevřené', 'open', true),
      tile(open.filter(q => q.decision === 'ESKALACE').length, 'Eskalované', 'open')),
    h('div', { class: 'tiles tiles-3' },
      kpi(avgDays === null ? '–' : avgDays.toFixed(1).replace('.', ',') + ' dne', 'Průměrná doba do uzavření', closed.length + ' uzavřených QRAP'),
      kpi(withS3.length ? Math.round(s3in / withS3.length * 100) + ' %' : '–', 'Okamžitá opatření ③ do ' + hours3() + ' h', s3in + ' z ' + withS3.length),
      kpi(recent.filter(q => q.repeat7 === 'ANO').length, 'Opakované problémy (90 dní)', 'odpověď „Stejný problém v posledních 7 dnech“')),
    weekChart(),
    h('div', { class: 'cols2' },
      barList('JAK BYL OBJEVEN (90 DNÍ)', count(recent, 'how'), label => { S.search = label; go('board'); }),
      barList('PODLE ZÓNY (90 DNÍ)', count(recent, 'zone'), label => { S.area = label; S.filter = 'open'; go('board'); })),
    h('div', { class: 'cols2' },
      h('div', { class: 'card' }, h('h2', null, 'KONEČNÉ AKCE PO TERMÍNU'),
        lateActs.length ? h('table', { class: 'roles' }, h('tr', null, h('th', null, 'Pilot'), h('th', null, 'Počet'), h('th', null, 'Nejstarší plán')),
          Object.entries(byOwner).sort((a, b) => b[1].length - a[1].length).map(([o, list]) => h('tr', null, h('td', null, o), h('td', null, list.length),
            h('td', null, fmtD(list.map(a => a.due).sort()[0]))))) : note('Žádné akce po termínu.')),
      h('div', { class: 'card' }, h('h2', null, 'SAFETY A ESKALACE (OTEVŘENÉ)'),
        watch.length ? h('div', { class: 'list flat' }, watch.map(rowEl)) : note('Nic otevřeného.'))));
}

// ------------------------------------------------------------------ 9b. SPRÁVA (admin only)
const SETTING_LABELS = {
  NAZEV: 'Název aplikace', EMAILY: 'Posílat e-maily (ANO / NE)', EMAIL_KVALITA: 'E-mail Kvality', EMAIL_BOZP: 'E-mail BOZP / EHS',
  LHUTA_OPATRENI_HODIN: 'Lhůta ③ okamžitá opatření (hodin)', ZOBRAZIT_UZAVRENE_DNI: 'Uzavřené QRAP na tabuli (dní)',
  KIOSK_NAVRAT_SEKUND: 'Kiosk – návrat na tabuli (sekund)', ODKAZ_APLIKACE: 'Odkaz aplikace do e-mailů'
};
const ROLE_HELP = { '': 'běžný uživatel', 'VEDOUCÍ': 'vedoucí / TL', 'MANAŽER': 'manažer – uzavírá QRAP', 'ADMIN': 'admin – Správa',
  'KIOSK': 'sdílený účet kiosku' };

function fillPeopleList() {
  fill(document.getElementById('people-list'), S.people.filter(p => p.role !== 'KIOSK').map(p => h('option', { value: p.name })));
}

function adminPage() {
  const box = h('div', null, note('Načítám…'));
  const draw = () => fill(box, peopleCard(), listsCard(), settingsCard());
  const saved = res => {
    S.adm = res;
    Object.assign(S, { people: res.boot.people, lists: res.boot.lists, cfg: res.boot.cfg });
    fillPeopleList();
    S.edit = null;
    draw();
    toast('Uloženo ✓');
  };
  const call = async (btn, fn, args) => {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Ukládám…';
    try { saved(await api(fn, ...args)); } catch (e) { toast(errText(e), true); btn.disabled = false; btn.textContent = label; }
  };
  function personForm(p) {
    const F = makeForm(p ? Object.assign({}, p, { active: p.active ? 'ANO' : '' }) : { active: 'ANO' });
    const b = h('button', { class: 'btn primary', onclick: () => {
      const d = F.read(); if (!d) return;
      call(b, 'apiSavePerson', [{ row: p ? p.row : '', name: d.name, email: d.email, role: d.role, area: d.area, active: d.active === 'ANO' }]);
    } }, p ? 'Uložit' : 'Přidat osobu');
    return h('div', { class: 'act-form' }, h('div', { class: 'grid' },
      F.input('name', 'Jméno', { req: true }), F.input('email', 'E-mail (firemní účet Google)', { req: true, type: 'email' }),
      F.select('role', 'Role', S.adm.roles.map(r => ({ value: r, label: r + ' – ' + ROLE_HELP[r] })), { ph: '— bez role (běžný uživatel) —' }),
      F.select('area', 'Zóna', S.lists.zones || [], { ph: '— všechny zóny —' }),
      F.toggle('active', 'Aktivní (neaktivní osoba se nemůže přihlásit s rolí, historie zůstává)', { wide: true })),
    h('div', { class: 'form-btns' }, b, h('button', { class: 'btn ghost', onclick: () => { S.edit = null; draw(); } }, 'Zrušit')));
  }
  function peopleCard() {
    const people = S.adm.people.slice().sort((a, b) => (b.active - a.active) || a.name.localeCompare(b.name, 'cs'));
    return h('div', { class: 'card' },
      h('div', { class: 'sec-head' }, h('h2', null, 'LIDÉ A ROLE (' + people.length + ')'), h('div', { class: 'grow' }),
        S.edit === 'person:new' ? null : h('button', { class: 'btn small primary', onclick: () => { S.edit = 'person:new'; draw(); } }, '+ Přidat osobu')),
      S.edit === 'person:new' ? personForm(null) : null,
      h('div', { class: 'slots-wrap' }, h('table', { class: 'people' },
        h('tr', null, ['Jméno', 'E-mail', 'Role', 'Zóna', 'Stav', ''].map(x => h('th', null, x))),
        people.map(p => (S.edit === 'person:' + p.row ? h('tr', null, h('td', { colspan: 6 }, personForm(p)))
          : h('tr', { class: p.active ? '' : 'inactive' }, h('td', null, h('b', null, p.name)), h('td', null, p.email),
            h('td', null, p.role ? h('span', { class: 'tag' }, roleName(p.role)) : h('span', { class: 'sub' }, 'bez role')),
            h('td', null, p.area || h('span', { class: 'sub' }, 'všechny')), h('td', null, p.active ? 'aktivní' : 'neaktivní'),
            h('td', null, h('button', { class: 'btn small ghost', onclick: () => { S.edit = 'person:' + p.row; draw(); } }, 'Upravit'))))))),
      h('p', { class: 'sub' }, 'Lidé se nemažou – nastavte „neaktivní“. Role: VEDOUCÍ (③ ④ ⑤ ⑥ ⑦), MANAŽER (navíc uzavírá QRAP a Přehled), ADMIN (navíc Správa), KIOSK (sdílený účet kiosku).'));
  }
  function listsCard() {
    return h('div', { class: 'card' }, h('h2', null, 'SEZNAMY VE FORMULÁŘI'),
      h('p', { class: 'sub' }, 'Jedna položka na řádek. Staré QRAP si ponechají původní hodnoty.'),
      h('div', { class: 'cols3' }, S.adm.lists.map(l => {
        const ta = h('textarea', { rows: Math.max(4, l.values.length + 1) });
        ta.value = l.values.join('\n');
        const b = h('button', { class: 'btn small', onclick: () => call(b, 'apiSaveList', [l.key, ta.value.split('\n')]) }, 'Uložit');
        return h('div', { class: 'fld' }, h('span', { class: 'fld-l' }, l.title), ta, h('div', { style: 'margin-top:6px' }, b));
      })));
  }
  function settingsCard() {
    const inputs = {};
    const b = h('button', { class: 'btn primary', onclick: () => {
      const o = {};
      Object.keys(inputs).forEach(k => { o[k] = inputs[k].value.trim(); });
      call(b, 'apiSaveSettings', [o]);
    } }, 'Uložit nastavení');
    return h('div', { class: 'card' }, h('h2', null, 'NASTAVENÍ'),
      h('div', { class: 'grid' }, S.adm.settings.map(x => {
        const el = x.key === 'EMAILY' ? h('select', null, h('option', { value: 'ANO' }, 'ANO'), h('option', { value: 'NE' }, 'NE'))
          : h('input', { type: /^(LHUTA|ZOBRAZIT|KIOSK)/.test(x.key) ? 'number' : 'text', min: 1 });
        el.value = x.value === undefined ? '' : x.value;
        inputs[x.key] = el;
        return h('label', { class: 'fld' }, h('span', { class: 'fld-l' }, SETTING_LABELS[x.key] || x.key), el, h('small', null, x.help));
      })),
      h('div', { class: 'form-btns' }, b));
  }
  if (S.adm) draw();
  else api('apiAdminData').then(res => { S.adm = res; draw(); }).catch(e => { fill(box, note(errText(e))); });
  return h('div', null,
    h('div', { class: 'hero' }, h('div', null, h('h1', null, 'Správa'),
      h('div', { class: 'sub' }, 'Lidé, seznamy a nastavení aplikace. Změny platí hned (ostatní uživatelé po obnovení stránky).'))),
    box);
}

function helpPage() {
  const yes = '✓', no = '–';
  const rows = [
    ['① ② nahlásit problém + ③ otázka na riziko', yes, yes, yes],
    ['③ doplnit okamžitá opatření (do 24 h)', yes, yes, yes],
    ['④ informované směny, rozhodnutí a podpis', no, yes, yes],
    ['⑤ 5 Proč, ⑥ konečné akce (piloti vybraní v ④)', 'pilot', yes, yes],
    ['⑥ označit svou akci, zapsat kontrolu směny', yes, yes, yes],
    ['⑦ hodnocení QRQC', no, yes, yes],
    ['Uzavřít QRAP (i „vyřešeno bez 5 Proč“)', no, no, yes],
    ['Zrušit / znovu otevřít / odemknout ①–④, Přehled', no, no, yes]
  ];
  return h('div', { class: 'narrow' },
    h('div', { class: 'hero' }, h('div', null, h('h1', null, 'Jak to funguje'),
      h('div', { class: 'sub' }, 'Elektronická verze formuláře QRAP V3.0 pro sklad a expedici – stejné otázky ① až ⑦.'))),
    h('div', { class: 'flow' },
      h('div', null, h('b', null, 'Operátor'), h('span', { class: 'sub' }, '① popis + fotky, ② kdo byl upozorněn, ③ riziko ano/ne → Odeslat. Vedoucí zóny dostane e-mail.')),
      h('div', null, h('b', null, 'TL / vedoucí'), h('span', { class: 'sub' }, '③ doplní okamžitá opatření do ' + hours3() + ' h, ④ informuje směny a podepíše rozhodnutí.')),
      h('div', null, h('b', null, 'Piloti'), h('span', { class: 'sub' }, '⑤ 5 Proč a kořenová příčina, ⑥ konečné akce s termínem.')),
      h('div', null, h('b', null, 'Ověření'), h('span', { class: 'sub' }, '⑥ efektivní na 5 různých směnách (zapisuje TL u tabule).')),
      h('div', null, h('b', null, 'Manažer'), h('span', { class: 'sub' }, 'uzavře QRAP. ⑦ hodnocení QRQC.'))),
    h('div', { class: 'card', style: 'margin-top:14px' }, h('h2', null, 'KDO CO MŮŽE'),
      h('div', { class: 'slots-wrap' }, h('table', { class: 'roles' },
        h('tr', null, h('th', null, ''), h('th', null, 'Kdokoli'), h('th', null, 'Vedoucí'), h('th', null, 'Manažer')),
        rows.map(r => h('tr', null, r.map(c => h('td', null, c)))))),
      h('p', { class: 'sub', style: 'margin-top:10px' }, 'Vaše role: ' + (S.me.role === 'ADMIN' ? 'manažer' : (roleName(S.me.role) || 'běžný uživatel')).toLowerCase() + '.')),
    h('div', { class: 'card' }, h('h2', null, 'KIOSK'),
      h('p', null, 'Na kiosku se dá udělat všechno. Kde je potřeba podpis (④, uzavření, ⑤ ⑥, ⑦), aplikace se zeptá „Kdo podepisuje?“ – napište své jméno a vyberte ho z nabídky. Aplikace ověří vaši roli a do historie zapíše vaše jméno a čas.'),
      h('p', null, 'Po chvíli bez dotyku se kiosk sám vrátí na tabuli.')));
}

async function refresh(quiet, btn, all) {
  if (btn) { btn.disabled = true; btn.textContent = 'Načítám…'; }
  try {
    const res = await api('apiRefresh', all || S.all);
    Object.assign(S, { qraps: res.qraps, actions: res.actions, effects: res.effects, assess: res.assess, all: res.all });
    if (!quiet) toast('Aktualizováno ✓');
  } catch (e) {
    if (!quiet) toast(errText(e), true);
  }
  if (S.view === 'board') { if (btn || all) render(); else if (redrawBoard) redrawBoard(); }
}

/** When a problem is opened, fetch its latest version in the background (someone else may have changed it). */
function refreshOne(id) {
  const snap = () => JSON.stringify([byId(id), S.actions.filter(a => a.qrapId === id), S.effects.filter(a => a.qrapId === id),
    S.assess.filter(a => a.qrapId === id)]);
  api('apiGet', id).then(res => {
    const before = snap();
    store(res);
    if (before !== snap() && S.view === 'detail' && S.id === id && !S.edit) render();
  }).catch(e => {
    if (!byId(id)) { toast(errText(e), true); go('board'); }
  });
}

function startKiosk() {
  document.body.classList.add('kiosk');
  let last = Date.now();
  ['click', 'keydown', 'touchstart', 'input'].forEach(ev => document.addEventListener(ev, () => { last = Date.now(); }, true));
  setInterval(() => {
    const limit = (Number(S.cfg.KIOSK_NAVRAT_SEKUND) || 120) * 1000;
    if (S.view !== 'board' && Date.now() - last > limit) go('board');
  }, 5000);
}

function start() {
  if (BOOT.error) {
    fill(document.getElementById('app'), h('main', null, h('div', { class: 'narrow card' },
      h('h1', null, 'Aplikaci se nepodařilo spustit'), h('p', null, BOOT.error),
      h('p', { class: 'muted' }, 'Kontaktujte správce aplikace.'))));
    return;
  }
  fillPeopleList();
  const p = BOOT.params || {};
  S.view = p.id ? 'detail' : (['new', 'help'].includes(p.view) ? p.view : 'board');
  S.id = p.id || null;
  try {
    google.script.history.setChangeHandler(e => {
      const st = (e && e.state) || {};
      const prm = (e && e.location && e.location.parameter) || {};
      S.view = st.view || (prm.id ? 'detail' : (prm.view || 'board'));
      S.id = st.id || prm.id || null;
      S.edit = null;
      render();
    });
  } catch (e) { /* ignore */ }
  render();
  if (S.view === 'detail') refreshOne(S.id);
  if (S.kiosk) startKiosk();
  setInterval(() => { if (S.view === 'board' && !document.hidden) refresh(true); }, 90000);
}

start();
