<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
/* =====================================================================
   eQRAP – stylesheet. White panels on a faint green-grey page, thin
   borders, one green. Palette: #66B539 · #151B1F · #374148 · #E8F7DD.
   Change colours only here (:root).
   ===================================================================== */
:root {
  --ink: #151B1F; --ink-2: #374148; --ink-3: #6b757e;
  --line: #e2e6e9; --line-2: #cfd5da; --page: #f5f8f3; --panel: #ffffff; --soft: #f7f9f8; --zebra: #fafbfa;
  --accent: #66B539; --accent-ink: #3f7d1f; --accent-dark: #57a02e; --accent-soft: #E8F7DD;
  --bad: #b8322a; --warn: #8a5300;
  --viz: #4f9a2a; --viz-track: #e3e8e4;  /* chart: one green series, validated >= 3:1 on white */
  --r: 10px;
  /* layout: flexible caps, side margins grow with the screen */
  --gutter: clamp(16px, 4vw, 72px); --w-wide: 84rem; --w-mid: 72rem; --w-form: 56rem; --w-paper: 120rem;
  /* one spacing scale */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 64px;
  --tap: 44px; --tap-s: 36px;
  --text: var(--ink); --muted: var(--ink-3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 "Segoe UI", -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1 { font-size: 24px; line-height: 1.25; font-weight: 700; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 16px; font-weight: 650; margin: 0; }
h3 { font-size: 14px; font-weight: 650; margin: 0 0 12px; }
p { margin: 0 0 8px; }
a { color: var(--accent-ink); }
button { font: inherit; cursor: pointer; color: inherit; }
[hidden] { display: none !important; }
.grow { flex: 1; }
.muted, .sub { color: var(--ink-3); }
.sub { font-size: 13px; }
.small { font-size: 13px; }
.pre { white-space: pre-wrap; }
.late-txt { font-weight: 700; color: var(--ink); }
.wide { grid-column: 1 / -1; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.top { background: #fff; border-bottom: 1px solid var(--line); border-top: 3px solid var(--accent); position: sticky; top: 0; z-index: 10; }
.top-in { width: 100%; max-width: calc(var(--w-wide) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); height: 64px; display: flex; align-items: center; gap: 32px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; font-weight: 700; font-size: 16px; color: var(--ink); }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 800; display: grid; place-items: center; }
nav { display: flex; gap: 4px; height: 100%; }
.nav { background: none; border: 0; padding: 0 12px; height: 100%; color: var(--ink-2); font-weight: 550; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.nav:hover { color: var(--ink); }
.nav.on { color: var(--accent-ink); border-bottom-color: var(--accent); }
.top-right { display: flex; align-items: center; gap: 10px; }
.who { display: flex; flex-direction: column; line-height: 1.2; font-size: 13px; font-weight: 600; padding-left: 12px; border-left: 1px solid var(--line); }
.who small { color: var(--ink-3); font-weight: 400; font-size: 12px; }
.view-as { width: auto; height: 34px; min-height: 0; padding: 0 8px; font-size: 13px; }
main { width: 100%; max-width: calc(var(--w-wide) + 2 * var(--gutter)); margin: 0 auto; padding: var(--s5) var(--gutter) var(--s7); }
main.w-mid { max-width: calc(var(--w-mid) + 2 * var(--gutter)); }
main.w-form { max-width: calc(var(--w-form) + 2 * var(--gutter)); }

/* ---------- page head + breadcrumb ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--ink-3); }
.crumbs button:hover { color: var(--ink); text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 600; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head .sub { margin-top: 4px; font-size: 14px; }
.head-btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); height: auto; padding: 0 16px; border-radius: 8px;
  border: 1px solid var(--line-2); background: #fff; color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--soft); border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); padding: 0 10px; }
.btn.ghost:hover { color: var(--ink); background: var(--soft); }
.btn.small { min-height: var(--tap-s); padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn-cta { min-height: 48px; padding: 0 24px; font-size: 15px; }
.btn-muted { min-height: 48px; }
.hero-btn { height: 48px; padding: 0 26px; font-size: 16px; }
body.kiosk .hero-btn { height: 64px; padding: 0 40px; font-size: 20px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* ---------- panels ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; margin-bottom: 16px; }
.card > h2 { margin-bottom: 14px; }
.p-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.p-head h2 { margin: 0; }

/* ---------- fields ---------- */
.fld { display: block; }
.fld-l { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.req { color: var(--bad); font-weight: 400; }
.fld small { display: block; font-size: 13px; color: var(--ink-3); margin-top: 6px; }
.info { display: inline-grid; place-items: center; width: 28px; height: 28px; margin: -6px 0 -6px 4px; border-radius: 50%; color: var(--ink-3); cursor: pointer; vertical-align: middle; }
.info:hover, .info.on { color: var(--accent-ink); background: var(--accent-soft); }
.info .ico { width: 16px; height: 16px; }
::placeholder { color: #9aa3ab; }
details.more-stats > summary { cursor: pointer; font-weight: 600; color: var(--ink-2); padding: var(--s3) 0; list-style: none; min-height: var(--tap); display: flex; align-items: center; gap: var(--s2); }
details.more-stats > summary::-webkit-details-marker { display: none; }
details.more-stats[open] > summary .ico { transform: rotate(90deg); }
.spark { display: block; width: 100%; height: 28px; margin-top: var(--s2); }
.spark rect { fill: var(--viz); }
.meter { height: 6px; background: var(--viz-track); border-radius: 3px; margin-top: var(--s3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--viz); }
.top-right .hide-board { }
.stat b { font-size: 26px; }
input, select, textarea { width: 100%; height: var(--tap); padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff;
  font: inherit; color: var(--ink); }
textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; margin: 0; padding: 0; accent-color: var(--accent-ink); flex: none; }
input[type=file] { height: auto; border: 0; padding: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox]:focus, input[type=radio]:focus { box-shadow: none; }
input[type=checkbox]:focus-visible, input[type=radio]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fld.invalid input, .fld.invalid select, .fld.invalid textarea { border-color: var(--bad); box-shadow: 0 0 0 3px #f8e3e1; }
.fld.invalid .fld-l { color: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 28px; align-items: start; }
.sub-h { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em;
  padding-top: 16px; border-top: 1px solid var(--line); margin-top: 4px; }
.grid > .sub-h:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.grid + .grid { margin-top: 22px; }
.checks { display: flex; flex-wrap: wrap; gap: 10px; }
.check, .check-line { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; font-weight: 400; }
.checks .check { border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 14px; background: #fff; }
.checks .check.on, .checks .check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; border: 1px solid var(--line-2); border-radius: 8px; padding: 11px 14px; background: #fff; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-top: 2px; }
.choice b { font-weight: 600; }
.choice small { display: block; color: var(--ink-3); font-size: 13px; }
.choices.inline { flex-direction: row; gap: 8px; flex-wrap: wrap; }
.choices.inline .choice { padding: 9px 18px; align-items: center; }
.choices.inline .choice input { margin: 0; }
.with-btn { display: flex; gap: 8px; }
.with-btn input { flex: 1; min-width: 0; }
.form-btns { display: flex; gap: 10px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.note { font-size: 14px; color: var(--ink-2); padding: 10px 0; }
.note.warn { color: var(--warn); }

/* ---------- new QRAP: tab header + one panel ---------- */
.shell { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.wiz-steps { display: block; background: var(--soft); border-bottom: 1px solid var(--line); overflow-x: auto; }
.wiz-list { display: flex; }
.wiz-step { flex: 1 1 0; display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; min-width: 0; min-height: 56px; padding: 0 14px; background: none; border: 0;
  border-right: 1px solid var(--line); border-bottom: 3px solid transparent; color: var(--ink-2); font-size: 14px; font-weight: 550; text-align: left; white-space: nowrap; }
.wiz-step:last-child { border-right: 0; }
.wiz-step .ico { width: 20px; height: 20px; color: var(--ink-3); }
.wiz-step:hover { background: #fff; }
.wiz-step.done { color: var(--ink); }
.wiz-step.done .ico { color: var(--accent-ink); }
.wiz-step.on { background: #fff; color: var(--accent-ink); font-weight: 650; border-bottom-color: var(--accent); }
.wiz-step.on .ico { color: var(--accent-ink); }
.shell-body { padding: 28px 32px 8px; }
.shell-inner { max-width: 1100px; }
.shell-sub { font-size: 20px; font-weight: 700; margin-bottom: 4px; outline: none; }
.shell-hint { color: var(--ink-3); font-size: 14px; margin-bottom: 24px; }
.shell .sec { margin: 0; padding: 0; border: 0; background: none; }
.shell .sec-head { display: none; }
.shell .sec-body { padding: 0; }
.shell .sec-body > div > .grid + .grid { margin-top: 26px; }
.shell .sec-body > div > .grid:first-child > .sub-h:first-child { display: none; }
.review-part { padding: 20px 0; border-top: 1px solid var(--line); }
.review-part:first-of-type { border-top: 0; padding-top: 4px; }
.review-part > h3 { color: var(--accent-ink); }
.shell-foot { display: flex; gap: 10px; align-items: center; padding: 16px 32px; margin-top: 24px; border-top: 1px solid var(--line); background: var(--soft); }

/* ---------- board ---------- */
.flash { display: flex; gap: 14px; align-items: center; padding: 12px 16px; margin-bottom: 18px; border: 1px solid #cfe8bf; background: var(--accent-soft);
  border-radius: var(--r); color: var(--accent-ink); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
button.stat:hover { border-color: var(--line-2); }
.stat.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stat-top { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); font-weight: 550; margin-bottom: 10px; }
.ibox { width: 32px; height: 32px; border: 1px solid var(--line-2); border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); flex: none; background: #fff; }
.stat.on .ibox { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.stat b { font-size: 30px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chg { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.chg .ico { width: 12px; height: 12px; stroke-width: 2.4; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar select { width: auto; min-width: 150px; font-size: 14px; }
.search { position: relative; width: 340px; max-width: 100%; }
.search .ico { position: absolute; left: 11px; top: 50%; margin-top: -9px; color: var(--ink-3); }
.search input { padding-left: 36px; font-size: 14px; }
.tbl-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tbl-scroll { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
.list th, .list td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: top; }
.list th:last-child, .list td:last-child { border-right: 0; }
.list th { background: var(--soft); font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; padding-top: 11px; padding-bottom: 11px; }
.list th.sortable { cursor: pointer; user-select: none; }
.list th.sortable:hover { color: var(--ink); }
.list th .ico { width: 14px; height: 14px; vertical-align: -2px; margin-left: 4px; color: var(--ink-3); }
.list th.sorted { color: var(--accent-ink); }
.list th.sorted .ico { color: var(--accent-ink); }
.list tbody tr:nth-child(even) { background: var(--zebra); }
.list tbody tr.row { cursor: pointer; }
.list tbody tr.row:hover { background: var(--accent-soft); }
.list tbody tr:last-child td { border-bottom: 0; }
.c-id { font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.c-what { min-width: 260px; }
.c-what b { display: block; font-weight: 550; }
.c-when, .c-who { white-space: nowrap; }
.row-tags { display: flex; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
.row-tags:empty { display: none; }
.st-txt { font-weight: 600; white-space: nowrap; }
.prog { display: flex; align-items: center; gap: 8px; min-width: 120px; padding-top: 4px; }
.prog-bar { display: flex; gap: 2px; flex: 1; }
.prog-bar span { flex: 1; height: 6px; background: var(--line); border-radius: 1px; }
.prog-bar span.on { background: var(--accent); }
.prog small { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.empty { padding: 40px 0; color: var(--ink-3); text-align: center; }
.tbl-foot { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.tbl-foot select { width: auto; height: 32px; font-size: 13px; padding: 0 8px; }
.pager { display: flex; gap: 6px; }
.pager .btn { min-width: var(--tap-s); padding: 0; }
.more { padding-top: 14px; font-size: 14px; color: var(--ink-3); }

/* status words: plain text */
.badge { font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.badge.ok { color: var(--accent-ink); }
.badge.bad { color: var(--bad); }
.badge.muted { color: var(--ink-3); }
.tag { font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .03em; }
.tag.bad { color: var(--ink); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tags .tag { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--ink); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 10px; }

/* ---------- QRAP detail: form on the left, status on the right ---------- */
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin: 0 0 20px; flex-wrap: wrap; }
.d-head h1 { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.d-head h1 .badge { font-size: 15px; }
.d-head .sub { margin-top: 4px; font-size: 14px; }
.d-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
.d-side { order: 2; position: sticky; top: 84px; }
.d-main { order: 1; min-width: 0; }
.tracker { list-style: none; margin: 0; padding: 0; }
.trk { display: flex; gap: 12px; align-items: center; padding: 7px 0; color: var(--ink-3); font-size: 14px; position: relative; }
.trk .ico { width: 20px; height: 20px; }
.trk.done { color: var(--ink); }
.trk.done .ico { color: var(--accent-ink); }
.trk.now { color: var(--accent-ink); font-weight: 650; }
.next { display: flex; flex-direction: column; gap: 4px; }
.next .lbl { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.next b { font-size: 16px; }
.next.ok b { color: var(--accent-ink); }
.next.bad .late-txt { font-weight: 700; }
.band { font-size: 12px; font-weight: 700; color: var(--ink-3); margin: 26px 0 10px; text-transform: uppercase; letter-spacing: .06em; }
.band:first-child { margin-top: 0; }
.sec { padding: 0; overflow: hidden; }
.d-main > .card { margin-bottom: var(--s3); }
.sec-head { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
.sec-head h2 { font-size: 16px; text-transform: lowercase; }
.sec-head h2::first-letter { text-transform: uppercase; }
.sec-body { padding: 18px 22px 20px; }
.num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none;
  background: var(--soft); color: var(--ink-3); border: 1px solid var(--line); }
.sec.done .num { background: var(--accent-soft); color: var(--accent-ink); border-color: #cfe8bf; }
.sec.now .num { background: var(--accent); color: #fff; border-color: var(--accent); }
.sec.now { border-color: #bfe0a8; }
.sec.wait .sec-head h2, .sec.skip .sec-head h2 { color: var(--ink-3); }
.sec.wait .sec-body, .sec.skip .sec-body { color: var(--ink-3); }
.big-text { font-size: 18px; font-weight: 550; margin: 0 0 6px; white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kv > div { padding: 10px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.kv span { display: block; font-size: 12.5px; color: var(--ink-3); margin-bottom: 2px; }
.by { font-size: 13px; color: var(--ink-3); margin-top: 10px; }
.box { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
.box.ok { background: var(--accent-soft); border-color: #cfe8bf; }
.box.ok > b { color: var(--accent-ink); }
.box.bad { border-color: #e9c3bf; }
.box.bad > b { color: var(--bad); }
.whys { list-style: none; margin: 0; padding: 0; }
.whys li { padding: 7px 0; display: grid; grid-template-columns: 44px 1fr; border-bottom: 1px solid var(--line); }
.whys li:last-child { border-bottom: 0; }
.whys li b { color: var(--ink-3); font-size: 13px; font-weight: 600; }
.whys li.root-step { font-weight: 650; }
.whys .badge { margin-left: 10px; }
.root { margin-top: 10px; }
.act { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act-no { color: var(--ink-3); font-size: 13px; font-weight: 700; }
.act.done .act-text { color: var(--ink-3); }
.act-btns { display: flex; gap: 6px; }
.act-form, .ia-row { padding: 18px; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; background: var(--soft); }
.ia-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 650; }
.why-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; margin-bottom: 12px; }
.why-root { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding-bottom: 12px; white-space: nowrap; cursor: pointer; }
.checklist { list-style: none; margin: 10px 0; padding: 0; }
.checklist li { padding: 3px 0; }
.checklist .ok { color: var(--accent-ink); font-weight: 700; }
.checklist .no { color: var(--bad); font-weight: 700; }
.slots-wrap { overflow-x: auto; }
.slots, table.roles, table.people { width: 100%; border-collapse: collapse; font-size: 14px; }
.slots th, .slots td, .roles th, .roles td, .people th, .people td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.slots th, .roles th, .people th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--soft); }
.roles td:not(:first-child), .roles th:not(:first-child) { text-align: center; width: 110px; }
.slots input, .slots select { height: 36px; min-width: 120px; }
.people tr.inactive td { color: var(--ink-3); }
.assess-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.assess-item .badge { margin-right: 12px; }
.photo-slots { display: grid; grid-template-columns: repeat(2, minmax(0, 340px)); gap: 18px; }
.pslot > b { display: block; font-size: 13px; font-weight: 650; margin-bottom: 8px; }
.pslot.wrong > b { color: var(--bad); }
.pslot.right > b { color: var(--accent-ink); }
.ph { width: 100%; height: 190px; border: 1px dashed var(--line-2); border-radius: 8px; background: var(--soft); display: grid; place-items: center;
  color: var(--ink-3); font-size: 13px; overflow: hidden; padding: 0; margin-bottom: 8px; position: relative; cursor: pointer; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph .x { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 50; cursor: zoom-out; }
.lightbox img { max-width: 94vw; max-height: 94vh; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { padding: 9px 0 9px 16px; border-left: 2px solid var(--line); position: relative; }
.timeline li::before { content: ''; position: absolute; left: -5px; top: 15px; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.inline-form { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Přehled manažera ---------- */
.dash-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.cols3 > .card, .cols2 > .card, .dash-row > .card { margin-bottom: 0; }
.dash-row, .cols3.dash { margin-bottom: 16px; }
.big-n { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 18px; font-size: 13px; color: var(--ink-2); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--viz); }
.dot.track { background: var(--viz-track); }
.dot.avg { width: 14px; height: 0; border-top: 2px dashed var(--ink-2); border-radius: 0; vertical-align: 3px; background: none; }
.viz-box { position: relative; }
.viz { width: 100%; height: auto; display: block; }
.viz-grid { stroke: #edf0ee; stroke-width: 1; }
.viz-base { stroke: var(--line-2); stroke-width: 1; }
.viz-axis { fill: var(--ink-3); font-size: 12px; }
.viz-bar { fill: var(--viz); }
.viz-avg { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 4; }
.viz-avg-l { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.viz-hit { fill: transparent; }
.viz-group:hover .viz-hit { fill: #f1f5ef; }
.viz-tip { position: absolute; top: 4px; transform: translateX(-50%); background: #fff; border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 12px;
  font-size: 13px; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 14px rgba(21,27,31,.08); }
.viz-tip b { display: block; margin-bottom: 4px; }
.viz-tip div { display: flex; justify-content: space-between; gap: 18px; color: var(--ink-2); }
.donut-wrap { display: grid; place-items: center; position: relative; margin: 6px 0 14px; }
.donut { width: 190px; height: 190px; }
.donut-c { position: absolute; text-align: center; }
.donut-c b { display: block; font-size: 28px; font-weight: 650; }
.donut-c span { font-size: 12px; color: var(--ink-3); }
.d-legend { list-style: none; margin: 0; padding: 0; }
.d-legend li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.d-legend li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.hbar { display: grid; grid-template-columns: 150px 1fr 32px; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; }
.hbar.click { cursor: pointer; }
.hbar.click:hover .hbar-l { text-decoration: underline; }
.hbar-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-t { height: 10px; background: var(--viz-track); border-radius: 0 3px 3px 0; }
.hbar-f { display: block; height: 10px; background: var(--viz); min-width: 2px; border-radius: 0 3px 3px 0; }
.hbar b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- help ---------- */
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.flow > div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.flow .num { margin-bottom: 10px; background: var(--accent-soft); color: var(--accent-ink); border-color: #cfe8bf; }
.flow b { display: block; margin-bottom: 4px; }

/* ---------- the paper form QRAP V3.0: board strips and the QRAP page ----------
   Same blocks and order as the paper: ① ② ③ (operator) · ④ (supervisor) · ⑤ ⑥ (pilots) · ⑦ (supervisor / manager).
   Column widths are the paper's proportions (--pp-cols). */
.pp-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.paper { --pp-cols: 4.3fr 1.15fr 3.15fr 1.8fr 1.75fr 3.75fr 1.9fr; --pp-c1: 4.3fr 1.15fr 3.15fr; --pp-c3: 1.75fr 3.75fr; --pp-gap: 8px; --pp-panel: #e8eaeb; --pp-line: #c2c7cb;
  --pp-dark: #7c8387; --pp-mid: #b8bdc0; --pp-ink: #23292d; font-size: 12.5px; line-height: 1.35; color: var(--ink); min-width: 1240px; }
.paper.compact { font-size: 11.5px; min-width: 1100px; --pp-cols: 4.8fr 1fr 3.1fr 1.7fr 1.6fr 3.5fr 1.95fr; --pp-c1: 4.8fr 1fr 3.1fr; --pp-c3: 1.6fr 3.5fr; }
.paper.compact .p7-c .cb { font-size: .92em; }
.pp-row { display: grid; grid-template-columns: var(--pp-cols); column-gap: var(--pp-gap); }
.g1 { grid-column: 1 / 4; } .g2 { grid-column: 4 / 5; } .g3 { grid-column: 5 / 7; } .g4 { grid-column: 7 / 8; }
.pp-bands { margin-bottom: 6px; }
.pp-band { background: #eef0f1; text-align: center; font-size: 11px; padding: 4px 20px 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); }
.pp-band.dark { background: var(--pp-dark); color: #fff; }
.pp-heads { margin-bottom: 6px; }
.pp-h { border-radius: 10px; display: grid; place-items: center; text-align: center; padding: 6px 8px; font-weight: 800; line-height: 1.02; color: #111; }
.pp-h .big { font-size: 26px; text-transform: uppercase; }
.pp-h .mid { font-size: 15px; font-weight: 500; }
.pp-h.g1 { background: var(--pp-panel); grid-template-columns: var(--pp-c1); column-gap: var(--pp-gap); }
.pp-h.g2 { background: var(--pp-dark); color: #fff; box-shadow: inset 0 0 0 3px #4a5054; }
.pp-h.g2 small { display: block; font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.pp-h.g3 { background: var(--pp-mid); grid-template-columns: var(--pp-c3); column-gap: var(--pp-gap); }
.pp-h.g4 { background: #fff; font-size: 15px; }
.pp-h.g4 small { display: block; font-size: 10.5px; font-weight: 400; margin-top: 2px; }
.paper.compact .pp-h .big { font-size: 17px; }
.paper.compact .pp-band { font-size: 10px; padding-right: 14px; }
.paper.compact .pp-h .mid, .paper.compact .pp-h.g4, .paper.compact .pp-h.g2 small { font-size: 12px; }
.pp-body { align-items: stretch; }
.pp-g { padding: 6px; border-radius: 10px; min-width: 0; }
.pp-g.g1 { background: var(--pp-panel); display: grid; grid-template-columns: var(--pp-c1); column-gap: var(--pp-gap); }
.pp-g.g2 { background: var(--pp-panel); border: 3px solid var(--pp-ink); display: flex; }
.pp-g.g3 { background: var(--pp-panel); border: 2px dashed #6f767a; display: grid; grid-template-columns: var(--pp-c3); column-gap: var(--pp-gap); }
.pp-g.g4 { background: #fff; border: 1.5px solid var(--pp-ink); border-radius: 14px; display: flex; }
.pp-cell { position: relative; min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 5px; border-radius: 6px; }
.pp-cell.now { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
.pp-ed { align-self: flex-end; display: flex; }
.pp-box { background: #fff; border: 1px solid var(--pp-line); padding: 4px 6px; min-width: 0; }
.pp-l { display: block; font-weight: 700; font-size: .92em; }
.pp-l.light { font-weight: 400; color: var(--ink-3); font-style: italic; }
.pp-v, .pp-txt { overflow-wrap: anywhere; }
.pp-txt { white-space: pre-wrap; }
.paper.compact .pp-txt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
.pp-empty { color: #a3aaaf; }
.paper .sub { font-size: .9em; }
.pp-more { font-size: .9em; color: var(--ink-3); }
.cb { display: inline-flex; align-items: baseline; gap: 5px; margin-right: 8px; }
.cb i { width: 11px; height: 11px; border: 1.5px solid var(--pp-ink); flex: none; position: relative; top: 1px; box-shadow: 1.5px 1.5px 0 var(--pp-ink); background: #fff; }
.cb.on i { background: var(--pp-ink); }
.cb.on i::after { content: '✓'; color: #fff; font-size: 10px; line-height: 10px; position: absolute; left: 1px; top: -1px; font-style: normal; }
.cb-list .cb { display: flex; margin: 0 0 4px; }
/* ① */
.p1 { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 5px; flex: 1; }
.p1-no { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.p1-no .no { display: flex; }
.p1-no .no span { background: #151b1f; color: #fff; font-weight: 800; padding: 3px 6px; }
.p1-no .no b { background: #fff; border: 1px solid var(--pp-line); padding: 2px 6px; flex: 1; white-space: nowrap; }
.p1-no .cb { font-weight: 800; font-size: 1.15em; }
.p1-co { grid-column: 2 / 4; }
.p1-rep { grid-column: 1 / 3; }
.p1-popis { grid-column: 1 / 4; border-radius: 10px; }
.p1-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 3px; }
.pp-part em { display: block; font-style: normal; font-weight: 700; font-size: .9em; color: var(--ink); margin-bottom: 2px; }
.pp-ph { display: block; width: 100%; height: 120px; border: 1px solid var(--pp-line); border-radius: 6px; overflow: hidden; margin-top: 4px; padding: 0;
  background: var(--soft); color: var(--ink-3); font-size: 12px; cursor: zoom-in; }
.pp-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pp-cam { margin-top: 4px; }
.pp-flag { font-size: .9em; color: var(--ink-2); }
/* ③ ⑥ tables */
.pp-t { width: 100%; border-collapse: collapse; background: #fff; table-layout: fixed; }
.pp-t th, .pp-t td { border: 1px solid var(--pp-line); padding: 3px 5px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.pp-t th { font-weight: 700; font-size: .92em; }
.paper.compact .pp-t th, .paper.compact .pp-t td { padding: 2px 3px; }
.paper.compact .pp-t th { font-size: .82em; white-space: nowrap; overflow: hidden; }
.paper.compact .pp-box { padding: 5px 6px; }
.pp-v, .pp-txt { overflow-wrap: break-word; }
.pp-grow { flex: 1; background: #fff; border: 1px solid var(--pp-line); }
.pp-grow .pp-t { border: 0; }
/* ④ */
.p4-dec { border-style: dashed; border-color: #6f767a; }
.p4-dec .cb { display: flex; margin: 0 0 4px; font-weight: 700; }
.p4-sh { display: flex; flex-wrap: wrap; gap: 2px 0; }
.p4-sh .cb { margin-right: 10px; }
/* ⑤ chevron */
.p5 { background: var(--pp-ink); padding: 2px; flex: 1; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 22px), 50% 100%, 0 calc(100% - 22px)); }
.p5-in { background: #fff; height: 100%; padding: 4px 4px 26px; display: flex; flex-direction: column; gap: 4px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 21px), 50% 100%, 0 calc(100% - 21px)); }
.p5-w { border: 1.5px solid var(--pp-ink); padding: 2px 5px; min-height: 3em; flex: 1; }
.p5-w > b { display: block; text-align: center; font-size: .92em; }
.p5-w.root { background: var(--accent-soft); }
.p5-root { display: block; text-align: center; font-size: .85em; font-weight: 700; color: var(--accent-ink); }
.p5-n { font-size: .9em; border-top: 1px dashed var(--pp-line); padding-top: 3px; }
/* ⑥ */
.p6-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.p6-eff { display: flex; gap: 3px; margin-top: 3px; }
.p6-eff span { width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid var(--pp-ink); display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.p6-eff span.on { background: var(--pp-ink); color: #fff; }
.pp-late { font-weight: 800; }
/* ⑦ */
.p7 { padding: 4px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.p7-c .cb { font-weight: 800; margin: 0; }
.p7-sub { font-style: italic; font-size: .9em; padding-left: 17px; }
.p7-res { font-weight: 700; margin-left: 4px; }
.p7-who { margin-top: auto; }
/* board: one paper strip per QRAP */
.strip { margin-top: 14px; cursor: pointer; border-radius: 12px; outline: none; }
.strip-cap { display: flex; gap: 10px; align-items: baseline; padding: 0 4px 5px; font-size: 13px; flex-wrap: wrap; }
.strip-cap .open-l { color: var(--accent-ink); font-weight: 650; }
.strip-cap .badge { margin-right: 6px; }
.strip:hover .pp-g, .strip:focus-visible .pp-g { box-shadow: 0 0 0 2px var(--accent); }
.layout-sw { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.layout-sw button { border: 0; background: #fff; padding: 0 12px; min-height: var(--tap-s); font-weight: 600; font-size: 13px; color: var(--ink-2); }
.layout-sw button.on { background: var(--accent-soft); color: var(--accent-ink); }
.next-bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.next-bar .next { flex: 1; min-width: 260px; }
.next-btns { display: flex; gap: 8px; flex-wrap: wrap; }
main.w-paper { max-width: calc(var(--w-paper) + 2 * var(--gutter)); }
.shell .step > .grid:first-child > .sub-h:first-child { display: none; }
.shell .step > .grid + .grid, .shell .step > .grid + div { margin-top: 26px; }
.pair-f { display: flex; flex-direction: column; gap: 10px; }

/* ---------- header logo, compact status cards and filters ---------- */
.brand { font-size: 21px; font-weight: 800; letter-spacing: .1em; color: var(--ink); gap: 0; }
.stats { gap: 10px; margin-bottom: 14px; }
.stat { flex-direction: row; align-items: center; gap: 12px; padding: 10px 14px; }
.stat-top { flex: 1; min-width: 0; margin: 0; font-size: 13.5px; align-items: center; }
.stat-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.stat-t small { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.ibox { width: 28px; height: 28px; border-radius: 7px; }
.ibox .ico { width: 16px; height: 16px; }
.stat b { font-size: 22px; font-weight: 700; }
.stat .spark { height: 18px; margin-top: 4px; width: 110px; }
.stat .meter { margin-top: 6px; width: 110px; }
.toolbar { gap: 8px; margin-bottom: 10px; }
.toolbar select, .toolbar .btn { min-height: var(--tap-s); height: var(--tap-s); font-size: 13px; }
.toolbar select { min-width: 128px; padding: 0 8px; }
.search { width: 260px; }
.search input { height: var(--tap-s); min-height: 0; font-size: 13px; padding-left: 32px; }
.search .ico { width: 16px; height: 16px; left: 10px; margin-top: -8px; }

/* ---------- forms: question on the left (bold), answer on the right (normal) ---------- */
.form-rows .grid { grid-template-columns: minmax(0, 1fr); gap: 0; }
.form-rows .fld { display: grid; grid-template-columns: minmax(170px, 32%) minmax(0, 1fr); column-gap: 24px; row-gap: 4px;
  align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.form-rows .fld-l { margin: 0; padding-top: 11px; font-size: 15px; font-weight: 700; line-height: 1.35; }
.form-rows .fld > :not(.fld-l) { grid-column: 2; }
.form-rows .fld small { margin-top: 2px; }
.form-rows .sub-h { font-size: 12.5px; color: var(--accent-ink); border: 0; padding: 22px 0 6px; margin: 0; }
.form-rows .grid > .sub-h:first-child { padding-top: 0; }
.form-rows .grid + .grid { margin-top: 18px; }
.form-rows .q-group > .fld + .fld { border-top: 0; padding-top: 0; }
.form-rows .pair-f { gap: 0; }
.form-rows .pair-f .pslot, .form-rows .note.wide { margin-left: calc(max(170px, 32%) + 24px); }
.form-rows .pair-f .pslot { padding-bottom: 12px; }
.form-rows .pslot .ph { max-width: 340px; height: 200px; }
.form-rows .ia-row { margin-top: 10px; }
.form-rows .ia-row .fld:first-child { border-top: 0; }
.form-rows .why-row { margin: 0; align-items: center; }
.form-rows .why-root { padding-bottom: 0; }
.form-rows .checks, .form-rows .choices.inline { padding-top: 2px; }
.choice b, .choices.inline .choice b { font-weight: 400; }
.choice:has(input:checked) b { font-weight: 600; }
.opt { font-weight: 400; color: var(--ink-3); font-size: .85em; margin-left: 6px; }
.shell-body { padding: 26px 32px 6px; }
.shell-sub { font-size: 19px; margin-bottom: 16px; }
.intro { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px; color: var(--ink-3); margin-top: 6px; line-height: 1.4; }
.intro .chip { border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; color: var(--ink-2); background: #fff; }

/* ---------- the paper form: calmer labels, normal-weight answers ---------- */
.pp-bands { margin-bottom: 10px; }
.pp-band { background: none; clip-path: none; border-top: 2px solid #a5abaf; padding: 5px 6px 0; font-size: 10.5px; line-height: 1.35;
  color: var(--ink-3); text-align: center; white-space: normal; overflow: visible; }
.pp-band b { color: var(--ink); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.pp-band.dark { background: none; color: var(--ink-3); border-top-color: var(--pp-ink); }
.paper.compact .pp-band { font-size: 10px; padding-right: 4px; }
.paper { font-size: 13px; line-height: 1.42; }
.paper.compact { font-size: 12px; }
.pp-g { padding: 8px; }
.pp-cell { gap: 6px; }
.pp-box { padding: 6px 8px; }
.pp-l { font-weight: 700; font-size: .9em; color: var(--ink); margin-bottom: 2px; }
.pp-v, .pp-txt { font-weight: 400; }
.pp-empty { color: #b9c0c4; }
.cb { color: var(--ink-3); font-weight: 400; }
.cb.on { color: var(--ink); }
.p4-dec .cb { font-weight: 400; }
.p1-no .cb, .p7-c .cb { font-weight: 700; color: var(--ink); }
.paper.compact .p7-sub, .paper.compact .pp-hint { display: none; }

/* ---------- Jak to funguje: a short visual guide ---------- */
.howto-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
.howto-step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.howto-step .hs-top { display: flex; align-items: center; gap: 10px; }
.howto-step .hs-n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px; flex: none; }
.howto-step .hs-ico { color: var(--accent-ink); margin-left: auto; }
.howto-step .hs-ico .ico { width: 22px; height: 22px; }
.howto-step b { font-size: 15px; }
.howto-step p { margin: 0; color: var(--ink-2); font-size: 14px; }

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<datalist id="people-list"></datalist>
<script>const BOOT = <?!= boot ?>;</script>
<script>
'use strict';
/* =====================================================================================
   eQRAP Expedice (Lite) – the whole screen.
   The questions are the ones of the firm's QRAP V3.0 form (logistics version), ① to ⑦.
   All data arrives together with the page (BOOT), so moving around is instant.
   The server is called only when something is saved, and for a quiet refresh.

   1. State and texts      4. Board (Přehled)          7. Forms (① … ⑦)
   2. Small helpers        5. New problem (Nahlásit)   8. Photos
   3. Header and routing   6. Problem detail ①–⑦      9. Help, kiosk, refresh, start
   ===================================================================================== */

// ------------------------------------------------------------------ 1. STATE AND TEXTS
const S = {
  me: BOOT.me || {}, cfg: BOOT.cfg || {}, lists: BOOT.lists || {}, people: BOOT.people || [],
  qraps: BOOT.qraps || [], actions: BOOT.actions || [], effects: BOOT.effects || [], assess: BOOT.assess || [], all: false,
  kiosk: !!(BOOT.params && BOOT.params.kiosk === '1') || (BOOT.me && BOOT.me.role === 'KIOSK'),
  view: 'board', id: null, edit: null, filter: 'open', area: '', range: '', search: '', sort: null, page: 0, per: 10, layout: savedLayout(), history: {}, flash: null, adm: null
};
const isManager = () => S.me.role === 'MANAŽER' || S.me.role === 'ADMIN';
/** Board view: 'paper' (the QRAP V3.0 form, default) or 'table'. Remembered on this device only. */
function savedLayout() { try { return localStorage.getItem('eqrap-layout') === 'table' ? 'table' : 'paper'; } catch (e) { return 'paper'; } }
function layoutSwitch(redraw) {
  const b = (v, label) => h('button', { type: 'button', class: S.layout === v ? 'on' : '', onclick: () => {
    S.layout = v;
    try { localStorage.setItem('eqrap-layout', v); } catch (e) { /* private window */ }
    redraw();
  } }, label);
  return h('div', { class: 'layout-sw', role: 'group', 'aria-label': 'Zobrazení' }, b('paper', 'Formulář QRAP'), b('table', 'Tabulka'));
}
const isAdmin = () => S.me.role === 'ADMIN';
const onKiosk = () => S.me.role === 'KIOSK';

const STATUS = {
  'OPATŘENÍ':   { label: '③ Opatření', cls: 'warn', next: '③ Okamžitá opatření', who: 'kdokoli ze směny (TL)' },
  'ROZHODNUTÍ': { label: '④ Rozhodnutí', cls: 'warn', next: '④ Rozhodnutí OJT', who: 'vedoucí' },
  'ANALÝZA':    { label: '⑤ 5 Proč', cls: 'info', next: '⑤ 5 Proč a ⑥ konečné akce', who: 'piloti' },
  'AKCE':       { label: '⑥ Akce', cls: 'info', next: '⑥ Konečné akce', who: 'piloti akcí' },
  'OVĚŘENÍ':    { label: '⑥ Ověření 5 směn', cls: 'info', next: '⑥ Efektivita 5 směn, potom uzavření manažerem', who: 'TL, manažer uzavře' },
  'SCHVÁLENÍ':  { label: 'Ke schválení', cls: 'warn', next: 'Uzavření – schválení manažerem', who: 'manažer' },
  'UZAVŘENO':   { label: 'Uzavřeno', cls: 'ok' },
  'ZRUŠENO':    { label: 'Zrušeno', cls: 'muted' }
};
const DECISIONS = [
  { value: 'POKRAČOVAT', label: 'Pokračovat s analýzou a 5 Proč', sub: 'Příčina není známá nebo je co se naučit → piloti dostanou e-mail.' },
  { value: 'VYŘEŠENO', label: 'Problém vyřešen: ŽÁDNÉ 5 Proč', sub: 'Opatření a OJT problém vyřešily. QRAP se uzavře.' },
  { value: 'ESKALACE', label: 'Eskalace na vyšší úroveň (manažer)', sub: 'Přesahuje oblast → manažer dostane e-mail, analýza pokračuje.' }
];
const CRITERIA = [
  ['c1', '1 RED BOX', 'Popis problému'], ['c2', '2 ROZDĚLENÍ', 'Třídění, ochrana a rozdělení úkolů'],
  ['c3', '3 POROVNÁNÍ', 'Dobrý a špatný'], ['c4', '4 POUČENÍ A SDÍLENÍ', 'Komunikace a transversalizace'],
  ['c5', '5 ON JOB TRAINING', 'OJT provedené managementem']
];
const SECTION_TITLES = ['', 'POPIS PROBLÉMU', 'KDO BYL UPOZORNĚN?', 'OKAMŽITÁ OPATŘENÍ', 'ROZHODNUTÍ OJT',
  'PŘÍČINA 5 Proč?', 'KONEČNÉ AKCE', 'HODNOCENÍ QRQC'];
const YES_NO = [{ value: 'ANO', label: 'ano' }, { value: 'NE', label: 'ne' }];

// ------------------------------------------------------------------ 2. SMALL HELPERS
/** Creates an element. Text is always inserted as text (never as HTML), so nothing typed can break the page. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'value') value = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = true;
    else el.setAttribute(k, v === true ? '' : v);
  });
  kids.flat(Infinity).forEach(k => {
    if (k !== null && k !== undefined && k !== false && k !== '') el.append(k instanceof Node ? k : String(k));
  });
  if (value !== undefined) el.value = value;
  return el;
}

/** Replaces the content of an element (same rules as h: lists are flattened, empty values skipped). */
function fill(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false && k !== ''));
  return el;
}

/** Calls a server function from Code.gs and returns a Promise. */
function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

function errText(e) {
  const m = String((e && e.message) || e || '');
  if (/NetworkError|Failed to fetch|network/i.test(m)) return 'Nepodařilo se spojit se serverem. Zkontrolujte připojení a zkuste to znovu.';
  return m.replace(/^(Exception|Error|Výjimka):\s*/, '');
}

let toastTimer = null;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (bad ? ' bad' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 7000 : 2500);
}

/** Saves: disables the button while waiting, stores the answer, shows "Uloženo". Returns the answer or null. */
async function save(btn, fn, args) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Ukládám…';
  try {
    const res = await api(fn, ...args);
    store(res);
    toast('Uloženo ✓');
    return res;
  } catch (e) {
    toast(errText(e), true);
    btn.disabled = false;
    btn.textContent = label;
    return null;
  }
}

/** Save from inside the detail page, then close the form and show the section again. */
async function submit(btn, fn, args, secNo) {
  const res = await save(btn, fn, args);
  if (!res) return null;
  S.edit = null;
  render();
  const el = document.getElementById('sec' + secNo);
  if (el) el.scrollIntoView({ block: 'nearest' });
  return res;
}

/** Puts a fresh problem (from the server) into the page's data. */
function store(res) {
  if (!res || !res.qrap) return;
  const id = res.qrap.id;
  const i = S.qraps.findIndex(q => q.id === id);
  if (i >= 0) S.qraps[i] = res.qrap; else S.qraps.unshift(res.qrap);
  S.actions = S.actions.filter(a => a.qrapId !== id).concat(res.actions);
  S.effects = S.effects.filter(a => a.qrapId !== id).concat(res.effects);
  S.assess = S.assess.filter(a => a.qrapId !== id).concat(res.assess);
  delete S.history[id];
}

const pad = n => String(n).padStart(2, '0');
function fmtDT(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const y = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
  return d.getDate() + '. ' + (d.getMonth() + 1) + '.' + y + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function fmtD(v) {
  if (!v) return '';
  const d = v.length === 10 ? new Date(v + 'T00:00') : new Date(v);
  return d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear();
}
function ago(iso) {
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 60) return 'před ' + min + ' min';
  if (min < 48 * 60) return 'před ' + Math.round(min / 60) + ' h';
  return 'před ' + Math.round(min / 1440) + ' dny';
}
function localInput(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function dayOf(iso) { const d = iso ? new Date(iso) : new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const today = () => dayOf();
const split = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const isOther = v => String(v || '').trim().toLowerCase() === 'jiné';
const byId = id => S.qraps.find(q => q.id === id);
const actsOf = (id, part) => S.actions.filter(a => a.qrapId === id && a.part === part && !a.removed).sort((a, b) => a.no - b.no);
const isOpen = q => q.status !== 'UZAVŘENO' && q.status !== 'ZRUŠENO';
const hours3 = () => Number(S.cfg.LHUTA_OPATRENI_HODIN) || 24;
const deadline3 = q => new Date(new Date(q.when || q.created).getTime() + hours3() * 3600e3);
const actLate = a => !a.done && a.due && a.due < today();
const isLate = q => isOpen(q) && ((q.status === 'OPATŘENÍ' && deadline3(q) < new Date()) || actsOf(q.id, '⑥').some(actLate));
const roleName = r => ({ 'VEDOUCÍ': 'Vedoucí', 'MANAŽER': 'Manažer', 'ADMIN': 'Admin', 'KIOSK': 'Kiosk' }[r] || '');
function personName(email) {
  const kiosk = / \(kiosk\)$/.test(email || '');
  const e = String(email || '').replace(/ \(kiosk\)$/, '');
  const p = S.people.find(x => x.email === e);
  return (p ? p.name : e) + (kiosk ? ' (na kiosku)' : '');
}
const pilotNames = q => split(q.pilots).map(personName).join(', ');
function badge(q) { const st = STATUS[q.status] || { label: q.status, cls: '' }; return h('span', { class: 'badge ' + st.cls }, st.label); }
const ynText = v => (v === 'ANO' ? 'ano' : v === 'NE' ? 'ne' : '');
function kv(pairs) {
  return h('div', { class: 'kv' }, pairs.filter(p => p[1] !== '' && p[1] !== null && p[1] !== undefined)
    .map(p => h('div', null, h('span', null, p[0]), p[1])));
}

/** Small line icons (24×24, drawn with the text colour). */
const ICONS = {
  circle: ['c:12,12,9'], check: ['c:12,12,9', 'M8 12.5l2.7 2.7L16.2 9.6'], dot: ['c:12,12,9', 'c:12,12,3.5'],
  inbox: ['M4 13h4.5l1.5 2.5h4l1.5-2.5H20', 'M6.5 5h11L20 13v6H4v-6z'], user: ['c:12,8,4', 'M4.5 20.5c1.4-3.8 4.3-5.5 7.5-5.5s6.1 1.7 7.5 5.5'],
  clock: ['c:12,12,9', 'M12 7.5V12l3 2'], done: ['M5 12.5l4.5 4.5L19 7.5'], alert: ['M12 3.5l9 16H3z', 'M12 10v4.5', 'M12 17.3v.2'],
  search: ['c:11,11,7', 'M20.5 20.5L16 16'], chart: ['M4 20h16', 'M7 16v-5', 'M12 16V6', 'M17 16v-8'], print: ['M7 9V3.5h10V9', 'M7 17H4.5V10.5a1.5 1.5 0 0 1 1.5-1.5h12a1.5 1.5 0 0 1 1.5 1.5V17H17', 'M7 14h10v6.5H7z'],
  plus: ['M12 5v14', 'M5 12h14'], camera: ['M4 8h3.5l2-2.5h5l2 2.5H20v11H4z', 'c:12,13,3.5'],
  bell: ['M6.5 16v-5a5.5 5.5 0 0 1 11 0v5l1.5 2h-14z', 'M10 20.5a2 2 0 0 0 4 0'], pin: ['M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z', 'c:12,10,2.3'], info: ['c:12,12,9', 'M12 11v5.5', 'M12 7.6v.2'], sort: ['M8 9.5l4-4 4 4', 'M8 14.5l4 4 4-4'], up: ['M12 19V5', 'M6 11l6-6 6 6'], down: ['M12 5v14', 'M6 13l6 6 6-6'],
  refresh: ['M19.5 12a7.5 7.5 0 1 1-2.2-5.3', 'M19.5 4v4.5H15'], left: ['M15 6l-6 6 6 6'], right: ['M9 6l6 6-6 6'], shield: ['M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z']
};
function icon(name) {
  return svg('svg', { viewBox: '0 0 24 24', class: 'ico', 'aria-hidden': 'true' }, (ICONS[name] || []).map(d => {
    if (d.slice(0, 2) !== 'c:') return svg('path', { d: d });
    const c = d.slice(2).split(',');
    return svg('circle', { cx: c[0], cy: c[1], r: c[2] });
  }));
}
const ibox = name => h('span', { class: 'ibox' }, icon(name));

// ------------------------------------------------------------------ 3. HEADER AND ROUTING
/** Show another page. replace = true: do not keep the current page in the browser's Back history. */
function go(view, id, replace) {
  S.view = view;
  S.id = id || null;
  S.edit = null;
  const p = {};
  if (id) p.id = id; else if (view !== 'board') p.view = view;
  if (S.kiosk) p.kiosk = '1';
  try { google.script.history[replace ? 'replace' : 'push']({ view: view, id: id || null }, p); } catch (e) { /* ignore */ }
  render();
  window.scrollTo(0, 0);
  if (view === 'detail') refreshOne(id);
}

function edit(key) {
  S.edit = key;
  render();
  const form = document.querySelector('.editing');
  if (form) {
    form.scrollIntoView({ block: 'nearest' });
    const first = form.querySelector('input:not([type=checkbox]):not([type=radio]), textarea, select');
    if (first) first.focus({ preventScroll: true });
  }
}

function render() {
  const pages = { board: boardPage, new: newPage, detail: detailPage, help: helpPage, dash: dashPage, admin: adminPage };
  if ((S.view === 'dash' && !isManager()) || (S.view === 'admin' && !isAdmin())) S.view = 'board';
  const width = { new: 'w-form', admin: 'w-mid', help: 'w-mid', detail: 'w-paper', board: 'w-paper', dash: 'w-paper' }[S.view] || '';
  fill(document.getElementById('app'), header(), h('main', { class: width || null }, (pages[S.view] || boardPage)()));
}

function header() {
  const nav = (label, view) => h('button', { class: 'nav' + (S.view === view ? ' on' : ''), onclick: () => go(view) }, label);
  const who = S.kiosk ? h('span', { class: 'who' }, 'Kiosk', h('small', null, 'sdílený terminál'))
    : h('span', { class: 'who', title: S.me.email }, S.me.name || S.me.email || '', h('small', null, roleName(S.me.role) || 'uživatel'));
  return h('header', { class: 'top' }, h('div', { class: 'top-in' },
    h('button', { class: 'brand', onclick: () => go('board'), title: S.cfg.NAZEV || '' }, 'QRQC'),
    h('nav', null, nav('Tabule', 'board'), nav('Jak to funguje', 'help'), isAdmin() ? nav('Správa', 'admin') : null),
    h('div', { class: 'grow' }),
    h('div', { class: 'top-right' },
      isManager() ? h('button', { class: 'btn btn-dash' + (S.view === 'dash' ? ' on' : ''), onclick: () => go('dash') }, icon('chart'), h('span', null, 'Přehled manažera')) : null,
      S.view === 'board' ? null : h('button', { class: 'btn primary', onclick: () => go('new') }, '+ Nahlásit problém'),
      S.me.owner ? viewAsSelect() : null,
      who)));
}

/** Page title with an optional breadcrumb and buttons on the right. */

// ------------------------------------------------------------------ 4. BOARD (TABULE = HOME)
const FILTERS = {
  open:      { label: 'Otevřené', test: isOpen },
  mine:      { label: 'Moje úkoly', test: q => isMine(q) },
  decide:    { label: 'Čeká na rozhodnutí', test: q => q.status === 'ROZHODNUTÍ' },
  approve:   { label: 'Čeká na manažera', test: q => q.status === 'SCHVÁLENÍ' || (q.status === 'OVĚŘENÍ' && q.eff.allOk) },
  late:      { label: 'Po termínu', test: isLate, alert: true },
  closed:    { label: 'Uzavřené', test: q => q.status === 'UZAVŘENO' },
  cancelled: { label: 'Zrušené', test: q => q.status === 'ZRUŠENO' }
};

/** "My tasks": leaders see what waits for them, pilots their analysis, managers what waits for closing. */
function isMine(q) {
  if (!isOpen(q)) return false;
  if (S.actions.some(a => a.qrapId === q.id && a.canDone && a.ownerEmail === S.me.email)) return true;
  if (split(q.pilots).includes(S.me.email) && ['ANALÝZA', 'AKCE'].includes(q.status)) return true;
  if (isManager() && FILTERS.approve.test(q)) return true;
  if (S.me.role && (!S.me.area || S.me.area === q.zone) && ['OPATŘENÍ', 'ROZHODNUTÍ'].includes(q.status)) return true;
  return false;
}

/** How far the QRAP is on the paper form: how many of the parts ①–⑦ are behind it. */
function stage(q) {
  return { 'OPATŘENÍ': 2, 'ROZHODNUTÍ': 3, 'ANALÝZA': 4, 'AKCE': 5, 'OVĚŘENÍ': 6, 'SCHVÁLENÍ': 6, 'UZAVŘENO': 7 }[q.status] || 0;
}
function progressEl(q) {
  const n = stage(q);
  return h('div', { class: 'prog', title: 'Hotovo ' + n + ' ze 7 částí formuláře' },
    h('div', { class: 'prog-bar' }, [1, 2, 3, 4, 5, 6, 7].map(i => h('span', { class: i <= n ? 'on' : '' }))),
    h('small', null, n + '/7'));
}

      h('div', { class: 'stat-top' }, ibox(icons[k]), h('div', { class: 'stat-t' }, h('span', null, FILTERS[k].label),
        notes[k]() ? h('small', null, notes[k]()) : null)), h('b', null, n));
  }));
  const draw = () => { drawStats(); drawList(); };
  redrawBoard = draw;

  const stSel = h('select', { title: 'Stav', onchange: e => { S.filter = e.target.value; S.page = 0; draw(); } },

  stSel.value = S.filter;
  const areaSel = h('select', { title: 'Zóna', onchange: e => { S.area = e.target.value; S.page = 0; draw(); } },
    h('option', { value: '' }, 'Zóna: všechny'), (S.lists.zones || []).map(a => h('option', { value: a }, a)));
  areaSel.value = S.area;
  const rangeSel = h('select', { title: 'Období', onchange: e => { S.range = e.target.value; S.page = 0; draw(); } },

  rangeSel.value = S.range || '';
  const search = h('input', { type: 'search', placeholder: 'Hledat číslo, problém, materiál, HU…', value: S.search,
    oninput: e => { S.search = e.target.value; S.page = 0; draw(); } });
  draw();

  const flash = S.flash;
  S.flash = null;
  const cancelled = S.qraps.filter(FILTERS.cancelled.test).length;

function haystack(q) {
  return [q.id, q.what, q.whatOther, q.descWrong, q.descRight, q.zone, q.location, q.materialNo, q.huNo, q.supplier, q.finder, q.how, q.howOther]
    .join(' ').toLowerCase();
}

/** Open before closed; late and SAFETY first; newest first. */
function order(a, b) {
  const rank = q => (isOpen(q) ? 0 : 4) - (isLate(q) ? 2 : 0) - (q.safety === 'ANO' ? 1 : 0);
  return rank(a) - rank(b) || String(b.when || b.created).localeCompare(String(a.when || a.created));
}

function rowEl(q) {
  const st = STATUS[q.status] || {};
  const open = () => go('detail', q.id);
  return h('tr', { class: 'row', tabindex: 0, onclick: open, onkeydown: e => { if (e.key === 'Enter') open(); } },
    h('td', { class: 'c-id' }, q.id,
      h('div', { class: 'row-tags' }, q.safety === 'ANO' ? h('span', { class: 'tag bad' }, 'SAFETY') : null,
        q.decision === 'ESKALACE' ? h('span', { class: 'tag' }, 'ESKALACE') : null)),
    h('td', { class: 'c-what' }, h('b', null, coText(q)), h('div', { class: 'sub' },
      [q.descWrong, jakText(q), q.qty === '' ? '' : q.qty + ' ' + q.unit, q.materialNo, q.huNo].filter(Boolean).join(' · '))),
    h('td', { class: 'c-where' }, h('div', null, q.zone), h('div', { class: 'sub' }, q.location)),
    h('td', { class: 'c-when' }, fmtDT(q.when || q.created), h('div', { class: 'sub' }, ago(q.when || q.created))),

      isLate(q) ? h('span', { class: 'late-txt' }, 'po termínu!') : (st.who ? 'čeká: ' + st.who : ''))),
    h('td', { class: 'c-prog' }, progressEl(q)));
}

function myActions() {

// ------------------------------------------------------------------ 5. NEW PROBLEM (NAHLÁSIT)
/**
 * New QRAP, step by step in the order of the paper form: the operator fills ① ② ③ (Zpět / Pokračovat).
 * Only the risk question of ③ is required now – what is missing in ③ the TL completes within 24 h.
 * The last step shows everything for a check before sending.
 */
function newPage() {
  const pf = popisForm({ when: new Date().toISOString(), finder: S.kiosk ? '' : S.me.name, zone: S.me.area || '' }, true);
  const s3 = opatreniForm({}, []);
  const step = (...kids) => h('div', { class: 'step' }, kids);
  const steps = [
    { name: 'Problém', title: 'Popis problému – CO a JAK', el: step(pf.groups[0]) },
    { name: 'Kdy a kde', el: step(pf.groups[1]) },
    { name: 'Kolik a kdo', el: step(pf.groups[2]) },
    { name: 'Popis', title: 'Popis problému – ŠPATNÝ a DOBRÝ díl', el: step(pf.groups[3]) },
    { name: 'Upozornění', title: 'Kdo byl upozorněn?', el: step(pf.two) },
    { name: 'Opatření', title: 'Okamžitá opatření <' + hours3() + 'h', el: step(s3.el,
      h('p', { class: 'sub', style: 'margin-top:12px' }, 'Vyplňte, co víte. Co chybí, doplní TL do ' + hours3() + ' h.')) },
    { name: 'Kontrola', el: null }
  ];
  let at = 0;
  const bar = h('div', { class: 'wiz-list' });
  const body = h('div');
  const back = h('button', { class: 'btn ghost', onclick: () => show(at - 1) }, '← Zpět');
  const next = h('button', { class: 'btn primary btn-cta', onclick: () => { if (valid(at)) show(at + 1); } }, 'Pokračovat →');
  const send = h('button', { class: 'btn primary btn-cta', onclick: async () => {
    const data = pf.read();
    if (!data) return;
    const d3 = s3.read();
    if (!d3) return;
    data.s3 = d3;
    const res = await save(send, 'apiCreate', [data]);
    if (!res) return;
    S.flash = { id: res.qrap.id, text: 'QRAP ' + res.qrap.id + ' odeslán. Vedoucí zóny dostal e-mail.' };
    S.filter = 'open';
    go('board', null, true);
  } }, 'Odeslat ✓');
  const titleEl = h('h2', { class: 'shell-sub' });
  titleEl.tabIndex = -1;
  function valid(i) {
    const st = steps[i];
    if (i === 5) return !!s3.read();
    if (!pf.F.read()) return false;
    const d = pf.F.peek();
    if (i === 1 && new Date(d.when).getTime() > Date.now() + 5 * 60000) return !!pf.F.mark('when', 'KDY nemůže být v budoucnosti.');
    if (i === 2 && Number(d.qty) > 0 && !d.unit) return !!pf.F.mark('unit', 'Vyberte jednotku.');
    return st.check ? !!st.check() : true;
  }
  function show(i) {
    for (let k = 0; k < i; k++) if (k >= at && !valid(k)) { i = k; break; }
    at = Math.max(0, Math.min(i, steps.length - 1));
    const last = at === steps.length - 1;
    fill(bar, steps.map((st, k) => h('button', { class: 'wiz-step' + (k < at ? ' done' : k === at ? ' on' : ''), type: 'button',
      title: (k + 1) + '. ' + (st.title || st.name), onclick: () => show(k) }, icon(k < at ? 'check' : 'circle'), h('span', null, st.name))));
    titleEl.textContent = (at + 1) + '. ' + (last ? 'Kontrola a odeslání' : steps[at].title || steps[at].name);
    fill(body, last ? steps.slice(0, -1).map(st => h('div', { class: 'review-part' }, h('h3', null, st.title || st.name), st.el)) : steps[at].el);
    back.hidden = at === 0;
    next.hidden = last;
    send.hidden = !last;
    window.scrollTo(0, 0);
    const f = body.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select');
    if (f && !last && at !== 0) f.focus({ preventScroll: true });
  }
  const page = h('div', null,
    pageHead('Nový QRAP', h('div', { class: 'intro' }, h('span', null, 'Vyplňuje operátor, který nalezl problém:'),
      h('span', { class: 'chip' }, '① Popis problému'), h('span', { class: 'chip' }, '② Kdo byl upozorněn?'),
      h('span', { class: 'chip' }, '③ Okamžitá opatření'), h('span', null, '* povinné')), null, 'Nový QRAP'),
    h('div', { class: 'shell' },
      h('nav', { class: 'wiz-steps', 'aria-label': 'Kroky' }, bar),
      h('div', { class: 'shell-body' }, h('div', { class: 'shell-inner form-rows' }, titleEl, body)),
      h('div', { class: 'shell-foot' }, back, h('div', { class: 'grow' }),
        h('button', { class: 'btn btn-muted', onclick: () => go('board') }, 'Zrušit'), next, send)));
  show(0);
  return page;
}
