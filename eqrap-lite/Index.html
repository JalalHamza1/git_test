/**
 * One QRAP filled into the paper form. big = the QRAP page (full texts, photos, buttons to fill each block);
 * otherwise the board (shortened texts, at most 3 table rows).
 */
function paperBody(q, big) {
  const now = NOW_CELL[q.status] || 0;
  const rowsMax = list => (big ? list : list.slice(0, 3));
  const more = list => (!big && list.length > 3 ? h('div', { class: 'pp-more' }, '+ ' + (list.length - 3) + ' další') : null);
  const edits = {};
  if (big) {
    if (q.can.popis) edits[1] = editBtn('popis', 'Upravit ① ②');
    if (q.can.opatreni) edits[3] = q.status === 'OPATŘENÍ' ? startBtn('opatreni', 'Doplnit ③') : editBtn('opatreni', 'Upravit ③');
    if (q.can.decide) edits[4] = startBtn('rozhodnuti', 'Rozhodnout ④');
    else if (q.can.shifts) edits[4] = editBtn('smeny', 'Směny ④');
    if (q.can.analyze) edits[5] = hasWhy(q) ? editBtn('pricina', 'Upravit ⑤') : startBtn('pricina', 'Vyplnit 5 Proč');
    if (q.can.analyze && hasWhy(q)) edits[6] = startBtn('akce:new', '+ Konečná akce');
    if (q.can.assess) edits[7] = editBtn('hodnoceni', '+ Hodnotit');
  }
  const cell = (n, ...kids) => h('div', { class: 'pp-cell c' + n + (now === n ? ' now' : ''), id: big ? 'sec' + n : null },
    edits[n] ? h('div', { class: 'pp-ed' }, edits[n]) : null, kids);
  const dShort = v => (big ? fmtD(v) : v ? fmtD(v).replace(/ \d{4}$/, '') : '');

  // ① POPIS PROBLÉMU
  const part = (kind, key, desc, title) => h('div', { class: 'pp-part ' + (kind === 'WRONG' ? 'bad' : 'good') }, h('em', null, title),
    ppText(desc), big ? photoSlot(q, kind, key, title) : (q[key] ? h('div', { class: 'pp-flag' }, '📷 foto') : null));
  const numbers = [q.materialNo ? 'č. dílu: ' + q.materialNo : '', q.huNo ? 'HU / DL: ' + q.huNo : '', q.supplier ? 'dodavatel: ' + q.supplier : '']
    .filter(Boolean).join(' · ');
  const c1 = cell(1, h('div', { class: 'p1' },
    h('div', { class: 'p1-no' }, h('div', { class: 'no' }, h('span', null, 'N°'), h('b', null, q.id)), cb(q.safety === 'ANO', 'SAFETY')),
    h('div', { class: 'pp-box p1-co' }, h('span', { class: 'pp-l' }, 'CO je za problém a JAK byl objeven?'),
      h('div', { class: 'pp-v' }, h('div', null, coText(q)), jakText(q) ? h('div', null, 'JAK: ' + jakText(q)) : null)),
    ppBox('KDY ?', h('div', null, h('div', null, 'Čas: ' + timeOf(q.when)), h('div', null, 'Datum: ' + dateOf(q.when)))),
    ppBox('KDE ?', h('div', null, q.zone, q.location ? h('div', { class: 'sub' }, q.location) : null)),
    ppBox('KOLIK špatných dílů?', q.qty === '' ? '' : q.qty + ' ' + (q.unit || '') + (q.nokSituation ? ' (NOK situace)' : '')),
    h('div', { class: 'pp-box p1-rep' }, h('span', { class: 'pp-l' }, 'Stejný problém v posledních 7 dnech?'),
      h('div', null, cb(q.repeat7 === 'ANO', 'ANO'), cb(q.repeat7 === 'ANO', 'N° QRAP: ' + (q.repeatRef || '……')), cb(q.repeat7 === 'NE', 'NE'))),
    ppBox('JMÉNO :', q.finder),
    h('div', { class: 'pp-box p1-popis' }, h('span', { class: 'pp-l light' }, 'Popis problému (nakresli nebo nalep obrázek) + číslo dílu'),
      h('div', { class: 'p1-pair' }, part('WRONG', 'photoWrong', q.descWrong, 'ŠPATNÝ díl'), part('RIGHT', 'photoRight', q.descRight, 'DOBRÝ díl')),
      numbers ? h('div', { class: 'sub' }, numbers) : null,
      q.photoException ? h('div', { class: 'sub' }, 'Bez fotek: ' + q.photoException) : null)));

  // ② KDO BYL UPOZORNĚN?
  const roles = (S.lists.alert || []).filter(r => !isOther(r));
  const got = split(q.notified);
  const c2 = cell(2, h('div', { class: 'pp-box cb-list', style: 'flex:1' },
    roles.map(r => cb(got.includes(r), r)), got.filter(x => !roles.includes(x) && !isOther(x)).map(x => cb(true, x)),
    cb(got.some(isOther), got.some(isOther) ? (q.notifiedOther || 'jiné') : '……………')));

  // ③ OKAMŽITÁ OPATŘENÍ <24h
  const ia = actsOf(q.id, '③');
  const quality = got.some(x => /kvalit/i.test(x));
  const c3 = cell(3,
    h('div', { class: 'pp-box' }, h('span', { class: 'pp-l' }, 'Ochranná opatření – je zde riziko na již naskladněném / expedovaném zboží?'),
      h('div', null, cb(q.risk === 'ANO', 'ANO'), cb(q.risk === 'ANO' && quality, 'upozorni oddělení KVALITY')), cb(q.risk === 'NE', 'NE')),
    h('div', { class: 'pp-box' }, h('span', { class: 'pp-l' }, 'Třídění – data'),
      h('div', null, 'Přetříděno: ' + (q.checked === '' ? '……' : q.checked) + ' ks · Špatné kusy: ' + (q.wrong === '' ? '……' : q.wrong) + ' ks',
        q.checkRunning ? ' (třídění probíhá)' : '')),
    h('div', { class: 'pp-grow' }, h('table', { class: 'pp-t' },
      h('colgroup', null, h('col'), h('col', { style: 'width:28%' }), h('col', { style: 'width:22%' })),
      h('tr', null, h('th', null, 'Okamžitá opatření:'), h('th', null, 'Kdo'), h('th', null, 'Čas')),
      rowsMax(ia).map(a => h('tr', null, h('td', null, a.text), h('td', null, a.owner), h('td', null, a.done ? (big ? fmtDT(a.done) : timeOf(a.done)) : 'probíhá')))),
    more(ia)),
    h('div', { class: 'pp-box' }, h('b', null, 'Čas re-startu procesu/stanice: '), q.restoredAt ? fmtDT(q.restoredAt) : '…… : ……'));

  // ④ ROZHODNUTÍ OJT
  const informed = split(q.shifts);
  const c4 = cell(4,
    h('div', { class: 'pp-box' }, h('span', { class: 'pp-l' }, big ? 'Informace všem směnám během 5\' meetingu (pětiminutovky):' : 'Informace směnám (5\' meeting):'),
      h('div', { class: 'p4-sh' }, (S.lists.shifts || []).map(x => cb(informed.includes(x), x)))),
    h('div', { class: 'pp-box p4-dec' }, DECISIONS.map(d => cb(q.decision === d.value, d.label))),
    q.pilots ? ppBox('Piloti:', pilotNames(q)) : null,
    h('div', { class: 'pp-box', style: 'flex:1' }, h('span', { class: 'pp-l' }, 'Komentář :'), ppText(q.decisionNote)),
    ppBox('Podpis :', q.decisionBy ? q.decisionBy + ' · ' + fmtDT(q.decisionAt) : ''));

  // ⑤ PŘÍČINA 5 Proč ?
  const nChain = [1, 2, 3, 4, 5].filter(i => q['n' + i]);
  const c5 = cell(5, h('div', { class: 'p5' }, h('div', { class: 'p5-in' },
    [1, 2, 3, 4, 5].map(i => h('div', { class: 'p5-w' + (Number(q.rootO) === i ? ' root' : '') }, h('b', null, i + ' PROČ ?'),
      q['o' + i] ? ppText(q['o' + i]) : null, Number(q.rootO) === i ? h('span', { class: 'p5-root' }, 'kořenová příčina') : null)),
    nChain.length ? h('div', { class: 'p5-n' }, h('b', null, 'Proč nebylo zachyceno: '),
      nChain.map(i => (Number(q.rootN) === i ? '★ ' : '') + i + '. ' + q['n' + i]).join(' · ')) : null)));

  // ⑥ KONEČNÉ AKCE
  const acts = actsOf(q.id, '⑥');
  const c6 = cell(6,
    h('div', { class: 'pp-box' }, h('span', { class: 'pp-l' }, 'Co jsme se naučili z QR?'), ppText(q.learned)),
    h('div', { class: 'pp-grow' }, h('table', { class: 'pp-t' },
      h('colgroup', null, h('col'), h('col', { style: 'width:19%' }), h('col', { style: 'width:' + (big ? 15 : 17) + '%' }), h('col', { style: 'width:' + (big ? 15 : 17) + '%' })),
      h('tr', null, h('th', { rowspan: 2 }, 'Konečné akce:'), h('th', { rowspan: 2 }, 'Kdo'), h('th', { colspan: 2, style: 'text-align:center' }, 'Kdy')),
      h('tr', null, h('th', null, 'plán'), h('th', null, 'hotovo')),
      rowsMax(acts).map(a => h('tr', null, h('td', null, a.text, h('span', { class: 'sub' }, ' (' + whyLabel(a.kind) + ')')), h('td', null, a.owner),
        h('td', { class: actLate(a) ? 'pp-late' : '' }, dShort(a.due)), h('td', null, a.done ? dShort(a.done) : '')))),
    more(acts)),
    h('div', { class: 'p6-bottom' },
      ppBox('Uzavření QRAP schváleno:', q.closedBy ? q.closedBy + ' · ' + fmtDT(q.closedAt) : ''),
      h('div', { class: 'pp-box' }, h('span', { class: 'pp-l' }, 'Efektivita zkontrolována na 5 směnách bez chyb'),
        h('div', { class: 'p6-eff', title: 'Efektivní na ' + q.eff.ok + ' z 5 směn' }, [1, 2, 3, 4, 5].map(i => h('span', { class: i <= q.eff.ok ? 'on' : '' }, i))))),
    h('div', { class: 'pp-box' }, h('span', { class: 'pp-l' }, 'Příležitost k aktualizaci STANDARDU?'),
      h('div', null, cb(q.std === 'NE', 'NE'), cb(q.std === 'ANO', 'ANO ' + (q.std === 'ANO' ? q.stdRef : '……………'))),
      h('small', { class: 'sub pp-hint' }, '(Např: Pracovní instrukce, …)')));

  // ⑦ HODNOCENÍ QRQC
  const list = S.assess.filter(a => a.qrapId === q.id).sort((a, b) => String(b.at).localeCompare(String(a.at)));
  const last = list[0];
  const c7 = cell(7, h('div', { class: 'p7' },
    CRITERIA.map(c => h('div', { class: 'p7-c' }, cb(last && last[c[0]] === 'OK', c[1].replace(/^(\d) /, '$1: ')),
      last && last[c[0]] && last[c[0]] !== 'OK' ? h('span', { class: 'p7-res' }, last[c[0]]) : null, h('div', { class: 'p7-sub' }, c[2]))),
    h('div', { class: 'p7-who' }, 'Kdo: ', last ? last.by : ''), h('div', null, 'Kdy: ', last ? fmtDT(last.at) : ''),
    h('div', null, 'Zpětná vazba: ', last ? (last.feedbackType ? last.feedbackType + ': ' : '') + (last.feedback || '') : ''),
    list.length > 1 ? h('div', { class: 'pp-more' }, '+ ' + (list.length - 1) + ' starší hodnocení') : null));

  return h('div', { class: 'pp-row pp-body' },
    h('div', { class: 'pp-g g1' }, c1, c2, c3), h('div', { class: 'pp-g g2' }, c4),
    h('div', { class: 'pp-g g3' }, c5, c6), h('div', { class: 'pp-g g4' }, c7));
}

/** O3 → "3. Proč", N1 → "N1 nezachyceno", STD → standard. */
const whyLabel = k => (k === 'STD' ? 'standard' : /^O\d$/.test(k) ? k[1] + '. Proč' : /^N\d$/.test(k) ? k[1] + '. Proč nezachyceno' : k || '');

/** The board: the paper header once, then one paper strip per QRAP. */
function paperList(rows) {
  return h('div', { class: 'pp-wrap' }, h('div', { class: 'paper compact' }, paperHead(),
    rows.map(q => {
      const st = STATUS[q.status] || {};
      const open = () => go('detail', q.id);
      return h('div', { class: 'strip row', tabindex: 0, onclick: open, onkeydown: e => { if (e.key === 'Enter') open(); } },
        h('div', { class: 'strip-cap' }, h('b', null, q.id), badge(q),
          isLate(q) ? h('b', null, 'po termínu!') : (st.who ? h('span', { class: 'sub' }, 'čeká: ' + st.who) : null),
          q.safety === 'ANO' ? h('span', { class: 'tag bad' }, 'SAFETY') : null, q.decision === 'ESKALACE' ? h('span', { class: 'tag' }, 'ESKALACE') : null,
          h('span', { class: 'grow' }), h('span', { class: 'sub' }, ago(q.when || q.created)), h('span', { class: 'open-l' }, 'Otevřít →')),
        paperBody(q, false));
    })));
}

// ------------------------------------------------------------------ 6b. THE QRAP PAGE: the paper form + what to do next
function detailPage() {
  const q = byId(S.id);
  if (!q) return h('div', { class: 'card' }, 'Načítám ' + (S.id || '') + '…');
  return h('div', null,
    h('div', { class: 'crumbs no-print' }, h('button', { onclick: () => go('board') }, 'Tabule'), h('span', null, '/'), h('b', null, q.id)),
    h('div', { class: 'd-head' },
      h('div', null, h('h1', null, q.id, badge(q), q.safety === 'ANO' ? h('span', { class: 'tag bad' }, 'SAFETY') : null,
        q.decision === 'ESKALACE' ? h('span', { class: 'tag' }, 'ESKALACE') : null),
        h('div', { class: 'sub' }, [titleOf(q), q.zone, 'KDY ' + fmtDT(q.when)].filter(Boolean).join(' · '))),
      h('button', { class: 'btn no-print', onclick: () => window.print() }, icon('print'), 'Tisk / PDF')),
    nextBar(q),
    h('div', { class: 'pp-wrap' }, h('div', { class: 'paper big' }, paperHead(), paperBody(q, true))),
    editorPanel(q),
    actionsPanel(q),
    q.status === 'OVĚŘENÍ' ? h('div', { class: 'card no-print' }, effectBox(q)) : null,
    q.status === 'OVĚŘENÍ' || q.status === 'SCHVÁLENÍ' ? h('div', { class: 'card no-print' }, closureBox(q)) : null,
    assessList(q),
    historyBox(q), adminBox(q));
}

/** "Další krok" and the buttons for what this person can do now. */
function nextBar(q) {
  const btns = [];
  if (q.can.opatreni && q.status === 'OPATŘENÍ') btns.push(startBtn('opatreni', 'Doplnit ③ okamžitá opatření'));
  if (q.can.decide) btns.push(startBtn('rozhodnuti', 'Rozhodnout ④'));
  else if (q.can.shifts) btns.push(editBtn('smeny', 'Označit informované směny ④'));
  if (q.can.analyze && !hasWhy(q)) btns.push(startBtn('pricina', 'Vyplnit 5 Proč ⑤'));
  if (q.can.analyze && hasWhy(q) && q.status === 'ANALÝZA') btns.push(startBtn('akce:new', '+ Přidat konečnou akci ⑥'));
  if (q.can.pilots) btns.push(editBtn('piloti', '+ přidat pilota'));
  return h('div', { class: 'card next-bar no-print' }, nextBox(q), btns.length ? h('div', { class: 'next-btns' }, btns) : null);
}

function nextBox(q) {
  if (q.status === 'UZAVŘENO') {
    return h('div', { class: 'next ok' }, h('span', { class: 'lbl' }, 'Stav'), h('b', null, '✓ Uzavřeno ' + fmtDT(q.closedAt)),
      h('span', { class: 'sub' }, (q.decision === 'VYŘEŠENO' ? 'vyřešeno bez 5 Proč' : 'po ověření 5 směn') + ' · uzavřel(a) ' + q.closedBy));
  }
  if (q.status === 'ZRUŠENO') return h('div', { class: 'next' }, h('span', { class: 'lbl' }, 'Stav'), h('b', null, 'Zrušeno'), h('span', { class: 'sub' }, q.cancelReason));
  const st = STATUS[q.status];
  const late = isLate(q);
  let who = st.who;
  let extra = '';
  if (q.status === 'OPATŘENÍ') extra = 'chybí: ' + q.s3Missing.join(', ') + ' · termín ' + fmtDT(deadline3(q).toISOString());
  if (q.status === 'ANALÝZA' || q.status === 'AKCE') who = 'piloti: ' + (pilotNames(q) || 'vedoucí');
  if (q.status === 'AKCE') extra = 'otevřené akce: ' + actsOf(q.id, '⑥').filter(a => !a.done).length;
  if (q.status === 'OVĚŘENÍ') extra = 'efektivní na ' + q.eff.ok + ' z 5 směn';
  return h('div', { class: 'next' + (late ? ' bad' : '') },
    h('span', { class: 'lbl' }, 'Další krok'), h('b', null, st.next), h('span', { class: 'sub' }, 'Dělá: ' + who),
    extra ? h('span', { class: late ? 'late-txt' : 'sub' }, extra + (late ? ' – po termínu!' : '')) : null);
}

/** The form for the block being filled in (opened from the buttons on the paper or in "Další krok"). */
function editorPanel(q) {
  const key = S.edit || '';
  let title = '', body = null;
  if (key === 'popis' && q.can.popis) {
    const pf = popisForm(q, false);
    const SF = makeForm({});
    const signer = signerField(SF, 'Kdo upravuje? (vedoucí – u vlastního hlášení není potřeba)', true);
    title = '① Popis problému · ② Kdo byl upozorněn?';
    body = h('div', null, pf.one, h('div', { class: 'sub-h', style: 'margin-top:20px' }, '② Kdo byl upozorněn?'), pf.two,
      signer ? h('div', { class: 'grid', style: 'margin-top:12px' }, signer) : null,
      formButtons('Uložit ① a ②', b => { const d = pf.read(); const x = SF.read(); if (d && x) submit(b, 'apiSave', [q.id, 'popis', Object.assign(d, x)], 1); }));
  } else if (key === 'opatreni' && q.can.opatreni) {
    const f = opatreniForm(q, actsOf(q.id, '③'));
    title = '③ Okamžitá opatření <' + hours3() + 'h';
    body = h('div', null, f.el, formButtons('Uložit ③', saveSection(q, 'opatreni', f.read, 3)));
  } else if (key === 'smeny' && q.can.shifts) {
    const F = makeForm({ shifts: q.shifts });
    title = '④ Informace všem směnám';
    body = h('div', null, F.checks('shifts', 'Informace všem směnám během 5\' meetingu (pětiminutovky)', S.lists.shifts || []),
      h('div', { class: 'grid', style: 'margin-top:12px' }, signerField(F, 'Kdo označuje směny? (vedoucí)')),
      formButtons('Uložit směny', saveSection(q, 'smeny', F.read, 4)));
  } else if (key === 'rozhodnuti' && q.can.decide) {
    title = '④ Rozhodnutí OJT';
    body = decisionForm(q);
  } else if (key === 'pricina' && q.can.analyze) {
    title = '⑤ Příčina 5 Proč ?';
    body = pricinaForm(q);
  } else if (key === 'piloti' && q.can.pilots) {
    const F = makeForm({});
    const have = split(q.pilots);
    title = 'Přidat piloty';
    body = h('div', null, F.checks('pilots', 'Přidat piloty', S.people.filter(p => !have.includes(p.email)).map(p => p.name), { req: true }),
      h('div', { class: 'grid', style: 'margin-top:10px' }, signerField(F, 'Kdo přidává? (vedoucí / manažer)')),
      formButtons('Přidat', saveSection(q, 'piloti', F.read, 5)));
  } else if (/^akce:/.test(key)) {
    const a = key === 'akce:new' ? null : actsOf(q.id, '⑥').find(x => 'akce:' + x.no === key);
    if (a ? (a.canEdit || a.canDone) : (q.can.analyze && hasWhy(q))) { title = a ? '⑥ Konečná akce' : '⑥ Nová konečná akce'; body = actionForm(q, a); }
  } else if (key === 'hodnoceni' && q.can.assess) {
    title = '⑦ Hodnocení QRQC';
    body = assessForm(q);
  }
  if (!body) return null;
  return h('div', { class: 'card editing form-rows no-print', id: 'editor', style: 'margin-top:16px' },
    h('div', { class: 'p-head' }, h('h2', null, title), h('div', { class: 'grow' }), h('button', { class: 'btn small ghost', onclick: () => edit(null) }, 'Zavřít')),
    body);
}

/** ⑥ final actions with their buttons (✓ Hotovo, Upravit) – shown while the analysis runs. */
function actionsPanel(q) {
  const acts = actsOf(q.id, '⑥');
  const work = acts.some(a => a.canDone || a.canEdit);
  if (!acts.length || !work || !['ANALÝZA', 'AKCE', 'OVĚŘENÍ'].includes(q.status)) return null;
  return h('div', { class: 'card acts-panel no-print' },
    h('div', { class: 'p-head' }, h('h2', null, '⑥ Konečné akce'), h('div', { class: 'grow' }),
      q.can.analyze && hasWhy(q) ? startBtn('akce:new', '+ Přidat konečnou akci') : null),
    acts.map(a => actionRow(q, a)));
}

/** All ⑦ assessments (the paper shows the latest one). */
function assessList(q) {
  const list = S.assess.filter(a => a.qrapId === q.id).sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if (list.length < 2) return null;
  const cls = v => (v === 'OK' ? 'ok' : v === 'NOK' ? 'bad' : '');
  return h('div', { class: 'card no-print' }, h('h2', null, '⑦ Všechna hodnocení QRQC (' + list.length + ')'),
    list.map(a => h('div', { class: 'assess-item' },
      h('div', { class: 'sub' }, fmtDT(a.at) + ' · ' + a.by),
      h('div', { style: 'margin:4px 0' }, CRITERIA.map(c => h('span', { class: 'badge ' + cls(a[c[0]]), title: c[1] }, c[1].split(' ')[0] + ' ' + a[c[0]]))),
      a.ojtWith ? h('div', { class: 'sub' }, 'OJT s: ' + a.ojtWith) : null,
      a.feedback ? h('div', null, a.feedbackType ? h('b', null, a.feedbackType + ': ') : null, a.feedback) : null)));
}

function actionRow(q, a) {
  const late = actLate(a);
  const step = a.kind === 'STD' ? 'aktualizace standardu' : 'odstraňuje ' + whyLabel(a.kind);
  return h('div', { class: 'act' + (a.done ? ' done' : '') },
    h('div', { class: 'act-no' }, a.kind === 'STD' ? 'STD' : a.kind),
    h('div', null, h('div', { class: 'act-text' }, a.text),
      h('div', { class: 'sub' }, a.owner, ' · ', step, ' · plán ', h('span', { class: late ? 'late-txt' : '' }, fmtD(a.due)),
        a.dueFirst && a.dueFirst !== a.due ? ' (původní plán ' + fmtD(a.dueFirst) + ')' : '', a.note ? ' · ' + a.note : '',
        /^https?:\/\//i.test(a.evidence) ? [' · ', h('a', { href: a.evidence, target: '_blank', rel: 'noopener' }, 'důkaz')] : '')),
    h('div', { class: 'act-st' }, a.done ? h('span', { class: 'badge ok' }, '✓ ' + fmtD(a.done))

/** ⑥ Efektivita – 5 směn (only when all actions are done, or to show earlier rounds). */
function effectBox(q) {
  const rows = S.effects.filter(e => e.qrapId === q.id);
  if (!rows.length && q.status !== 'OVĚŘENÍ') return null;
  const round = q.eff.round;
  const slot = n => rows.filter(e => e.round === round && e.slot === n).pop() || null;
  const resultBadge = r => h('span', { class: 'badge ' + (r === 'EFEKTIVNÍ' ? 'ok' : r === 'NEEFEKTIVNÍ' ? 'bad' : '') }, r);
  const tr = n => {
    const cur = slot(n);
    if (!q.can.effect || (cur && cur.result === 'EFEKTIVNÍ')) {
      return h('tr', null, h('td', null, n), h('td', null, cur ? fmtD(cur.date) : '–'), h('td', null, cur ? cur.shift : ''),
        h('td', null, cur ? resultBadge(cur.result) : ''), h('td', null, cur ? cur.by : ''), h('td'));
    }
    const date = h('input', { type: 'date', max: today(), value: cur ? cur.date : today() });
    const shift = h('select', null, h('option', { value: '' }, '— směna —'), (S.lists.shifts || []).map(s => h('option', { value: s }, s)));
    shift.value = cur ? cur.shift : '';
    const result = h('select', null, h('option', { value: '' }, '— výsledek —'),
      ['EFEKTIVNÍ', 'NEOVĚŘENO', 'NEEFEKTIVNÍ'].map(r => h('option', { value: r }, r)));
    result.value = cur ? cur.result : '';
    const by = h('input', { value: cur ? cur.by : (S.kiosk ? '' : S.me.name), placeholder: 'Kdo' });
    const b = h('button', { class: 'btn small', onclick: () => {
      if (result.value === 'NEEFEKTIVNÍ') toast('Chyba se znovu objevila → QRAP se vrátí do analýzy a počítání směn začne znovu.');
      submit(b, 'apiSaveEffect', [q.id, { slot: n, date: date.value, shift: shift.value, result: result.value, by: by.value }], 6);
    } }, 'Uložit');
    return h('tr', null, h('td', null, n), h('td', null, date), h('td', null, shift), h('td', null, result), h('td', null, by), h('td', null, b));
  };
  const older = rows.filter(e => e.round < round);
  return h('div', { class: 'box' },
    h('b', null, 'Efektivita zkontrolována na 5 směnách bez chyb'),
    h('span', { class: 'sub' }, ' · kolo ' + round + ' · efektivní na ' + q.eff.ok + ' z 5 různých směn'),
    h('p', { class: 'sub', style: 'margin:4px 0 8px' }, 'Každý slot musí být jiná směna (datum + směna). „NEEFEKTIVNÍ“ vrátí QRAP do analýzy.'),
    h('div', { class: 'slots-wrap' }, h('table', { class: 'slots' },
      h('tr', null, ['Slot', 'Datum směny', 'Směna', 'Výsledek', 'Zkontroloval(a)', ''].map(x => h('th', null, x))),
      [1, 2, 3, 4, 5].map(tr))),
    older.length ? h('p', { class: 'sub', style: 'margin-top:8px' }, 'Předchozí kola: ' +
      older.map(e => 'kolo ' + e.round + '/slot ' + e.slot + ' ' + e.result).join(', ')) : null);
}

/** Uzavření QRAP – only a manager closes: after the 5 shifts (checklist) or after „Problém vyřešen: ŽÁDNÉ 5 Proč“. */
function closureBox(q) {

/**
 * A tiny form builder: every field remembers how to read its value and whether it is required.
 * Fields inside a hidden block are skipped (not required, value '').
 */
function makeForm(values) {
  const items = {};
  const val = key => (values[key] === null || values[key] === undefined ? '' : values[key]);
  const hiddenNow = i => !i.box.isConnected || !!i.box.closest('[hidden]'); // not on screen = not checked now
  const wrap = (key, label, control, o) => {
    // Hints: in a plain text field the hint is the placeholder (gone when typing);
    // anywhere else it hides behind a small ⓘ next to the label – one tap shows one muted line.
    const text = control.matches && control.matches('textarea, input:not([type]), input[type=text], input[type=email]') ? control : null;
    let tip = null, info = null;
    if (o.hint && text && !text.placeholder) text.placeholder = o.hint.replace(/\.$/, '');
    else if (o.hint) {
      tip = h('small', { hidden: true }, o.hint);
      info = h('span', { class: 'info no-print', role: 'button', tabindex: 0, title: o.hint, 'aria-label': 'Nápověda',
        onclick: e => { e.preventDefault(); tip.hidden = !tip.hidden; info.classList.toggle('on', !tip.hidden); },
        onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') info.click(); } }, icon('info'));
    }
    const el = h(o.group ? 'div' : 'label', { class: 'fld' + (o.wide ? ' wide' : '') },
      label ? h('span', { class: 'fld-l' }, label, o.req ? h('span', { class: 'req' }, ' *') : null,
        o.opt ? h('span', { class: 'opt' }, 'nepovinné') : null, info) : null,
      control, tip);
    items[key].box = el;
    const ok = () => el.classList.remove('invalid');
    el.addEventListener('input', ok);
    el.addEventListener('change', ok);
    return el;
  };
  const F = {
    input(key, label, o = {}) {
      const dt = o.type === 'datetime-local';
      const el = o.rows ? h('textarea', { rows: o.rows, placeholder: o.ph, maxlength: 2000 })
        : h('input', { type: o.type || 'text', placeholder: o.ph, min: o.min, max: o.max, list: o.list,
          inputmode: o.type === 'number' ? 'numeric' : null, maxlength: o.type ? null : 200 });
      el.value = dt && val(key) ? localInput(val(key)) : val(key);
      if (o.onchange) el.addEventListener('input', () => o.onchange(el.value));
      items[key] = { label, req: o.req, focus: () => el.focus(),
        get: () => (dt ? (el.value ? new Date(el.value).toISOString() : '') : el.value.trim()) };
      const control = o.now ? h('div', { class: 'with-btn' }, el, h('button', { class: 'btn small', type: 'button',
        onclick: () => { el.value = localInput(); el.dispatchEvent(new Event('input', { bubbles: true })); } }, 'Teď')) : el;
      return wrap(key, label, control, o);
    },
    select(key, label, options, o = {}) {
      const opts = options.map(x => (typeof x === 'string' ? { value: x, label: x } : x));
      if (val(key) && !opts.some(x => x.value === val(key))) opts.push({ value: val(key), label: val(key) });
      const el = h('select', null, h('option', { value: '' }, o.ph || '— vyberte —'), opts.map(x => h('option', { value: x.value }, x.label)));
      el.value = val(key);
      if (o.onchange) el.addEventListener('change', () => o.onchange(el.value));
      items[key] = { label, req: o.req, get: () => el.value, focus: () => el.focus() };
      return wrap(key, label, el, o);
    },
    checks(key, label, options, o = {}) {
      const cur = split(val(key));
      const boxes = options.concat(cur.filter(x => !options.includes(x))).map(x => {
        const cb = h('input', { type: 'checkbox', checked: cur.includes(x) });
        const lb = h('label', { class: 'check' + (cb.checked ? ' on' : '') }, cb, x);
        cb.addEventListener('change', () => { lb.classList.toggle('on', cb.checked); if (o.onchange) o.onchange(read()); });
        return { cb, x, lb };
      });
      const read = () => boxes.filter(b => b.cb.checked).map(b => b.x);
      items[key] = { label, req: o.req, get: () => read().join(', '), focus: () => boxes[0] && boxes[0].cb.focus(),
        set: list => boxes.forEach(b => { b.cb.checked = list.includes(b.x); b.lb.classList.toggle('on', b.cb.checked); }) };
      return wrap(key, label, h('div', { class: 'checks' }, boxes.map(b => b.lb)), Object.assign({ group: true }, o));
    },
    radio(key, label, options, o = {}) {
      const name = 'r' + Math.random().toString(36).slice(2);
      const rows = options.map(x => {
        const r = h('input', { type: 'radio', name, value: x.value, checked: val(key) === x.value, disabled: x.disabled });
        return { r, el: h('label', { class: 'choice' + (r.checked ? ' on' : '') }, r,
          h('span', null, h('b', null, x.label), x.sub ? h('small', null, x.sub) : null)) };
      });
      rows.forEach(x => x.r.addEventListener('change', () => {
        rows.forEach(y => y.el.classList.toggle('on', y.r.checked));
        if (o.onchange) o.onchange(x.r.value);
      }));
      items[key] = { label, req: o.req, get: () => { const c = rows.find(x => x.r.checked); return c ? c.r.value : ''; }, focus: () => rows[0].r.focus() };
      return wrap(key, label, h('div', { class: 'choices' + (o.inline ? ' inline' : '') }, rows.map(x => x.el)), Object.assign({ group: true }, o));
    },
    yesno(key, label, o = {}) { return F.radio(key, label, YES_NO, Object.assign({ inline: true }, o)); },
    toggle(key, label, o = {}) {
      const cb = h('input', { type: 'checkbox', checked: !!val(key) });
      if (o.onchange) cb.addEventListener('change', () => o.onchange(cb.checked));
      items[key] = { label, get: () => (cb.checked ? 'ANO' : ''), focus: () => cb.focus() };
      const el = h('label', { class: 'check-line' + (o.wide ? ' wide' : '') }, cb, label);
      items[key].box = el;
      return el;
    },
    /** Marks one field red with a message (for rules that involve two fields). */
    mark(key, msg) {
      items[key].box.classList.add('invalid');
      items[key].focus();
      toast(msg, true);
      return null;
    },
    /** All values without checking (hidden fields give ''). */
    peek() {
      const out = {};
      Object.keys(items).forEach(k => { out[k] = items[k].box.closest('[hidden]') ? '' : items[k].get(); });
      return out;
    },
    /** Returns all values, or null (and marks the missing fields red) when something required is empty. */
    read() {
      Object.values(items).forEach(i => i.box.classList.remove('invalid'));
      const missing = Object.values(items).filter(i => i.req && !hiddenNow(i) && !i.get());
      if (missing.length) {
        missing.forEach(i => i.box.classList.add('invalid'));
        missing[0].focus();
        toast('Vyplňte prosím: ' + missing.map(i => i.label.replace(/[?:]$/, '')).join(', '), true);
        return null;
      }
      return F.peek();
    },
    item: key => items[key]
  };
  return F;
}

/** Shows or hides a block when a value changes. */
function showIf(el, on) { el.hidden = !on; return el; }

/**
 * ① POPIS PROBLÉMU and ② KDO BYL UPOZORNĚN? – the questions of the paper form QRAP V3.0, in its order.
 * groups = the steps of the new-QRAP form: Problém | Kdy a kde | Kolik a kdo | Popis problému.
 */
function popisForm(v, isNew) {
  const F = makeForm(v);
  const L = S.lists;
  const howOther = showIf(F.input('howOther', 'JAK – jiné (napište)', { req: true }), isOther(v.how));
  const whatOther = showIf(F.input('whatOther', 'CO – jiné (napište)', { req: true }), isOther(v.what));
  const recent = S.qraps.filter(q => q.id !== v.id && Date.now() - new Date(q.when).getTime() < 7 * 864e5)
    .map(q => ({ value: q.id, label: q.id + ' – ' + titleOf(q).slice(0, 60) }));
  const repeat = showIf(F.select('repeatRef', 'N° QRAP', recent,
    { req: true, ph: recent.length ? '— vyberte —' : 'Žádný QRAP za posledních 7 dnů' }), v.repeat7 === 'ANO');
  const photos = isNew ? photoPicker() : null;
  const groups = [
    h('div', { class: 'grid' },
      h('div', { class: 'sub-h wide' }, 'Problém'),
      F.yesno('safety', 'SAFETY', { req: true, wide: true, hint: 'Jde o bezpečnost lidí (úraz, pád zboží, VZV…)? Vyberte vědomě.' }),
      h('div', { class: 'q-group wide' },
        F.select('what', 'CO je za problém?', L.problems || [], { req: true, onchange: x => showIf(whatOther, isOther(x)) }), whatOther),
      h('div', { class: 'q-group wide' },
        F.select('how', 'JAK byl objeven?', L.how || [], { req: true, onchange: x => showIf(howOther, isOther(x)) }), howOther)),
    h('div', { class: 'grid' },
      h('div', { class: 'sub-h wide' }, 'Kdy a kde'),
      F.input('when', 'KDY ?', { req: true, type: 'datetime-local', now: true, hint: 'Čas a datum, kdy byl problém nalezen (ne čas zápisu).' }),
      F.select('zone', 'KDE ?', L.zones || [], { req: true })),
    h('div', { class: 'grid' },
      h('div', { class: 'sub-h wide' }, 'Kolik a kdo'),
      F.input('qty', 'KOLIK špatných dílů?', { req: true, type: 'number', min: 0 }),
      F.select('unit', 'Jednotka', L.units || []),
      h('div', { class: 'q-group wide' },
        F.yesno('repeat7', 'Stejný problém v posledních 7 dnech?', { req: true, onchange: x => showIf(repeat, x === 'ANO') }), repeat),
      F.input('finder', 'JMÉNO', { req: true, list: 'people-list', hint: 'Vaše jméno' })),
    h('div', { class: 'grid' },
      h('div', { class: 'sub-h wide' }, 'Popis problému'),
      h('div', { class: 'pair-f' }, F.input('descWrong', 'ŠPATNÝ díl – popis', { req: true, rows: 4, hint: 'Co je špatně? Popište fakta.' }),
        photos ? photos.slot('WRONG', 'ŠPATNÝ díl') : null),
      h('div', { class: 'pair-f' }, F.input('descRight', 'DOBRÝ díl – popis', { req: true, rows: 4, hint: 'Jak to má být správně?' }),
        photos ? photos.slot('RIGHT', 'DOBRÝ díl') : null),
      F.input('materialNo', 'Číslo dílu (materiálu)'),
      F.input('huNo', 'Číslo HU / dodacího listu', { opt: true }),
      F.input('supplier', 'Dodavatel', { opt: true }))
  ];
  const otherBox = showIf(F.input('notifiedOther', 'Jiné – kdo', { req: true }), split(v.notified).some(isOther));
  const two = h('div', null,
    F.checks('notified', 'Kdo byl upozorněn?', S.lists.alert || [], { req: true, hint: 'Koho jste informovali? Vyberte alespoň jednoho.',
      onchange: list => showIf(otherBox, list.some(isOther)) }),
    h('div', { style: 'margin-top:10px' }, otherBox),

      if (photos) {
        const p = photos.get();

/** ③ OKAMŽITÁ OPATŘENÍ <24h as on the paper: Ochranná opatření, Třídění – data, Okamžitá opatření, Čas re-startu. */
function opatreniForm(v, ia) {
  const F = makeForm(v);
  const sort = showIf(h('div', { class: 'grid wide' },
    h('div', { class: 'note warn wide' }, 'ANO → oddělení KVALITY dostane e-mail. Zapište data třídění.'),
    F.input('checked', 'Přetříděno (ks)', { type: 'number', min: 0 }),
    F.input('wrong', 'Špatné kusy (ks)', { type: 'number', min: 0 })), v.risk === 'ANO');
  const rows = iaList(ia);
  const el = h('div', null,
    h('div', { class: 'grid' },
      h('div', { class: 'sub-h wide' }, 'Ochranná opatření'),
      F.yesno('risk', 'Je zde riziko na již naskladněném nebo expedovaném zboží?', { req: true, wide: true,
        hint: 'Může být stejná chyba i u zboží, které už je na skladě nebo odešlo k zákazníkovi?', onchange: x => showIf(sort, x === 'ANO') }),
      sort),
    h('div', { class: 'grid' },
      h('div', { class: 'sub-h wide' }, 'Okamžitá opatření'),
      h('div', { class: 'wide' }, rows.el),
      F.input('restoredAt', 'Čas re-startu procesu/stanice', { type: 'datetime-local', now: true,
        hint: 'Kdy proces znovu běží. Nechte prázdné, když proces nebyl zastaven.' })));
  return {
    el,
    read() {
      const d = F.read();
      if (!d) return null;
      if (d.checked !== '' && d.wrong !== '' && Number(d.wrong) > Number(d.checked)) {
        return F.mark('wrong', '„Špatné kusy“ nemůže být víc než „Přetříděno“.');
      }
      const list = rows.read();
      if (!list) return null;
      d.ia = list;
      return d;
    }
  };
}

/** ③ table "Okamžitá opatření | Kdo | Čas". An untouched new row is ignored; empty Čas = still running. */
function iaList(existing) {
  const items = [];
  const box = h('div');
  const add = v => {
    const F = makeForm(v || {});
    const item = { no: v && v.no, F, removed: false };
    item.el = h('div', { class: 'ia-row' },
      h('div', { class: 'ia-head' }, h('b', null, 'Okamžité opatření'),
        h('button', { class: 'link', type: 'button', onclick: () => { item.removed = true; item.el.remove(); } }, 'Odebrat')),
      h('div', { class: 'grid' },
        F.input('text', 'Co bylo uděláno', { req: true, wide: true, ph: 'např. paleta zablokována, zboží přetříděno' }),
        F.input('owner', 'Kdo', { req: true, list: 'people-list' }),
        F.input('done', 'Čas', { type: 'datetime-local', now: true, hint: 'Kdy bylo hotovo. Prázdné = ještě probíhá.' })));
    items.push(item);
    box.append(item.el);
  };
  existing.forEach(add);
  if (!existing.length) add({ owner: S.kiosk ? '' : S.me.name });
  const addBtn = h('button', { class: 'btn small ghost', type: 'button', onclick: () => add({ owner: S.kiosk ? '' : S.me.name }) }, '+ Přidat opatření');
  return {
    el: h('div', null, box, addBtn),
    read() {
      const out = [];
      for (const it of items) {
        if (it.removed) { if (it.no) out.push({ no: it.no, remove: true }); continue; }
        const p = it.F.peek();
        if (!it.no && !p.text && !p.done) continue; // untouched new row
        const d = it.F.read();
        if (!d) return null;
        out.push(Object.assign({ no: it.no || '' }, d));
      }
      return out;
    }
  };
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => reject(new Error('Soubor není obrázek.'));
    img.src = URL.createObjectURL(file);
  });
}

function zoom(url) {

const DAY = 864e5;
function svg(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (v !== null && v !== undefined) el.setAttribute(k, v); });
  kids.flat(Infinity).forEach(k => { if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : String(k)); });
  return el;
}
function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const shortD = d => d.getDate() + '. ' + (d.getMonth() + 1) + '.';

/** Reported QRAPs in the last 8 weeks as a tiny bar strip (one series; exact numbers in the tooltip). */
function sparkline() {
  const start = mondayOf(Date.now() - 7 * 7 * DAY);
  const weeks = Array.from({ length: 8 }, (_, i) => {
    const from = new Date(start.getTime() + i * 7 * DAY), to = new Date(from.getTime() + 7 * DAY);
    return { from, n: S.qraps.filter(q => q.status !== 'ZRUŠENO' && q.created && new Date(q.created) >= from && new Date(q.created) < to).length };
  });
  const max = Math.max(1, ...weeks.map(w => w.n));
  const W = 160, H = 28, gw = W / 8, bw = gw - 4;
  return { total: weeks.reduce((m, w) => m + w.n, 0), el: svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'spark', preserveAspectRatio: 'none',
    role: 'img', 'aria-label': 'Nahlášeno po týdnech: ' + weeks.map(w => w.n).join(', ') },
    weeks.map((w, i) => {
      const hgt = Math.max(2, w.n / max * H);
      return svg('rect', { x: i * gw + 2, y: H - hgt, width: bw, height: hgt, rx: 1.5 },
        svg('title', null, 'Týden od ' + shortD(w.from) + ': ' + w.n));
    })) };
}

/** Horizontal bars for one series (one colour), value written next to each bar. */
function barList(title, pairs, onClick) {
  const max = Math.max(1, ...pairs.map(p => p[1]));
  return h('div', { class: 'card' }, h('h2', null, title),
    pairs.length ? pairs.map(([label, n]) => h('div', { class: 'hbar' + (onClick ? ' click' : ''), title: label + ': ' + n, onclick: onClick ? () => onClick(label) : null },
      h('span', { class: 'hbar-l' }, label), h('span', { class: 'hbar-t' }, h('span', { class: 'hbar-f', style: 'width:' + (n / max * 100) + '%' })),
      h('b', null, n))) : note('Zatím žádná data.'));
}

            (avgDays === null ? '–' : avgDays.toFixed(1).replace('.', ',') + ' dne (' + closed.length + ' QRAP)'))))));
}

// ------------------------------------------------------------------ 9b. SPRÁVA (admin only)
const SETTING_LABELS = {
  NAZEV: 'Název aplikace', EMAILY: 'Posílat e-maily (ANO / NE)', EMAIL_KVALITA: 'E-mail Kvality', EMAIL_BOZP: 'E-mail BOZP / EHS',
  LHUTA_OPATRENI_HODIN: 'Lhůta ③ okamžitá opatření (hodin)', ZOBRAZIT_UZAVRENE_DNI: 'Uzavřené QRAP na tabuli (dní)',
  KIOSK_NAVRAT_SEKUND: 'Kiosk – návrat na tabuli (sekund)', ODKAZ_APLIKACE: 'Odkaz aplikace do e-mailů'
};
const ROLE_HELP = { '': 'běžný uživatel', 'VEDOUCÍ': 'vedoucí / TL', 'MANAŽER': 'manažer – uzavírá QRAP', 'ADMIN': 'admin – Správa',
  'KIOSK': 'sdílený účet kiosku' };

function fillPeopleList() {
  fill(document.getElementById('people-list'), S.people.filter(p => p.role !== 'KIOSK').map(p => h('option', { value: p.name })));
}

function adminPage() {
  const box = h('div', null, note('Načítám…'));
  const draw = () => fill(box, peopleCard(), listsCard(), settingsCard());
  const saved = res => {
    S.adm = res;
    Object.assign(S, { people: res.boot.people, lists: res.boot.lists, cfg: res.boot.cfg });
    fillPeopleList();
    S.edit = null;
    draw();
    toast('Uloženo ✓');
  };
  const call = async (btn, fn, args) => {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Ukládám…';
    try { saved(await api(fn, ...args)); } catch (e) { toast(errText(e), true); btn.disabled = false; btn.textContent = label; }
  };
  function personForm(p) {
    const F = makeForm(p ? Object.assign({}, p, { active: p.active ? 'ANO' : '' }) : { active: 'ANO' });
    const b = h('button', { class: 'btn primary', onclick: () => {
      const d = F.read(); if (!d) return;
      call(b, 'apiSavePerson', [{ row: p ? p.row : '', name: d.name, email: d.email, role: d.role, area: d.area, active: d.active === 'ANO' }]);
    } }, p ? 'Uložit' : 'Přidat osobu');
    return h('div', { class: 'act-form' }, h('div', { class: 'grid' },
      F.input('name', 'Jméno', { req: true }), F.input('email', 'E-mail (firemní účet Google)', { req: true, type: 'email' }),
      F.select('role', 'Role', S.adm.roles.map(r => ({ value: r, label: r + ' – ' + ROLE_HELP[r] })), { ph: '— bez role (běžný uživatel) —' }),
      F.select('area', 'Zóna', S.lists.zones || [], { ph: '— všechny zóny —' }),
      F.toggle('active', 'Aktivní (neaktivní osoba se nemůže přihlásit s rolí, historie zůstává)', { wide: true })),
    h('div', { class: 'form-btns' }, b, h('button', { class: 'btn ghost', onclick: () => { S.edit = null; draw(); } }, 'Zrušit')));
  }
  function peopleCard() {
    const people = S.adm.people.slice().sort((a, b) => (b.active - a.active) || a.name.localeCompare(b.name, 'cs'));
    return h('div', { class: 'card' },
      h('div', { class: 'p-head' }, h('h2', null, 'Lidé a role (' + people.length + ')'), h('div', { class: 'grow' }),
        S.edit === 'person:new' ? null : h('button', { class: 'btn small primary', onclick: () => { S.edit = 'person:new'; draw(); } }, '+ Přidat osobu')),
      S.edit === 'person:new' ? personForm(null) : null,
      h('div', { class: 'slots-wrap' }, h('table', { class: 'people' },
        h('tr', null, ['Jméno', 'E-mail', 'Role', 'Zóna', 'Stav', ''].map(x => h('th', null, x))),
        people.map(p => (S.edit === 'person:' + p.row ? h('tr', null, h('td', { colspan: 6 }, personForm(p)))
          : h('tr', { class: p.active ? '' : 'inactive' }, h('td', null, h('b', null, p.name)), h('td', null, p.email),
            h('td', null, p.role ? h('span', { class: 'tag' }, roleName(p.role)) : h('span', { class: 'sub' }, 'bez role')),
            h('td', null, p.area || h('span', { class: 'sub' }, 'všechny')), h('td', null, p.active ? 'aktivní' : 'neaktivní'),
            h('td', null, h('button', { class: 'btn small ghost', onclick: () => { S.edit = 'person:' + p.row; draw(); } }, 'Upravit'))))))),
      h('p', { class: 'sub' }, 'Lidé se nemažou – nastavte „neaktivní“. Role: VEDOUCÍ (③ ④ ⑤ ⑥ ⑦), MANAŽER (navíc uzavírá QRAP a Přehled), ADMIN (navíc Správa), KIOSK (sdílený účet kiosku).'));
  }
  function listsCard() {
    return h('div', { class: 'card' }, h('h2', null, 'Seznamy ve formuláři'),
      h('p', { class: 'sub' }, 'Jedna položka na řádek. Staré QRAP si ponechají původní hodnoty.'),
      h('div', { class: 'cols3' }, S.adm.lists.map(l => {
        const ta = h('textarea', { rows: Math.max(4, l.values.length + 1) });
        ta.value = l.values.join('\n');
        const b = h('button', { class: 'btn small', onclick: () => call(b, 'apiSaveList', [l.key, ta.value.split('\n')]) }, 'Uložit');
        return h('div', { class: 'fld' }, h('span', { class: 'fld-l' }, l.title), ta, h('div', { style: 'margin-top:6px' }, b));
      })));
  }
  function settingsCard() {
    const inputs = {};
    const b = h('button', { class: 'btn primary', onclick: () => {
      const o = {};
      Object.keys(inputs).forEach(k => { o[k] = inputs[k].value.trim(); });
      call(b, 'apiSaveSettings', [o]);
    } }, 'Uložit nastavení');
    return h('div', { class: 'card' }, h('h2', null, 'Nastavení'),
      h('div', { class: 'grid' }, S.adm.settings.map(x => {
        const el = x.key === 'EMAILY' ? h('select', null, h('option', { value: 'ANO' }, 'ANO'), h('option', { value: 'NE' }, 'NE'))
          : h('input', { type: /^(LHUTA|ZOBRAZIT|KIOSK)/.test(x.key) ? 'number' : 'text', min: 1 });
        el.value = x.value === undefined ? '' : x.value;
        inputs[x.key] = el;
        return h('label', { class: 'fld' }, h('span', { class: 'fld-l' }, SETTING_LABELS[x.key] || x.key), el, h('small', null, x.help));
      })),
      h('div', { class: 'form-btns' }, b));
  }
  if (S.adm) draw();
  else api('apiAdminData').then(res => { S.adm = res; draw(); }).catch(e => { fill(box, note(errText(e))); });
  return h('div', null,
    pageHead('Správa', 'Lidé, seznamy a nastavení aplikace. Změny platí hned (ostatní uživatelé po obnovení stránky).', null, 'Správa'),
    box);
}

/** "Jak to funguje": how to fill in a QRAP, in the same 7 steps as the form, then what happens next. */
function helpPage() {
  const yes = '✓', no = '–';
  const rows = [
    ['① ② ③ nahlásit problém a okamžitá opatření', yes, yes, yes],
    ['③ doplnit okamžitá opatření (do ' + hours3() + ' h)', yes, yes, yes],
    ['④ informované směny, rozhodnutí a podpis', no, yes, yes],
    ['⑤ 5 Proč, ⑥ konečné akce (piloti vybraní v ④)', 'pilot', yes, yes],
    ['⑥ označit svou akci, zapsat kontrolu směny', yes, yes, yes],
    ['⑦ hodnocení QRQC', no, yes, yes],
    ['Uzavřít QRAP (i „vyřešeno bez 5 Proč“)', no, no, yes],
    ['Zrušit / znovu otevřít / odemknout ①–④, Přehled', no, no, yes]
  ];
  const steps = [
    ['alert', 'Problém', 'Vyberte, CO je za problém a JAK byl objeven. SAFETY = jde o bezpečnost lidí.'],
    ['clock', 'Kdy a kde', 'Kdy jste problém našli (tlačítko „Teď“) a ve které zóně.'],
    ['user', 'Kolik a kdo', 'Kolik dílů je špatně, zda se to stalo v posledních 7 dnech, a vaše jméno.'],
    ['camera', 'Popis', 'Popište ŠPATNÝ a DOBRÝ díl. Fotka pomůže, ale není povinná.'],
    ['bell', 'Upozornění', 'Zaškrtněte, koho jste o problému informovali.'],
    ['shield', 'Opatření', 'Je riziko u zboží na skladě? Co jste hned udělali, kdo a kdy.'],
    ['done', 'Kontrola a odeslání', 'Zkontrolujte údaje a stiskněte „Odeslat ✓“. Obrazovka se vrátí na tabuli.']
  ];
  const next = [
    ['④ Supervizor', 'informuje směny a rozhodne: 5 Proč, vyřešeno, nebo eskalace'],
    ['⑤ ⑥ Piloti', 'najdou příčinu (5 Proč) a zadají konečné akce'],
    ['⑥ Ověření', 'akce je efektivní na 5 různých směnách'],
    ['Manažer', 'uzavře QRAP · ⑦ hodnocení QRQC']
  ];
  return h('div', { class: 'howto' },
    pageHead('Jak vyplnit QRAP', h('div', { class: 'intro' }, h('span', null, 'Hlášení vyplňuje operátor, který problém našel – 7 krátkých kroků.'),
      h('span', null, '* povinné')), h('button', { class: 'btn primary', onclick: () => go('new') }, '+ Nahlásit problém'), 'Jak to funguje'),
    h('div', { class: 'howto-steps' }, steps.map((x, i) => h('div', { class: 'howto-step' + (i === steps.length - 1 ? ' send' : '') },
      h('div', { class: 'hs-top' }, h('span', { class: 'hs-n' }, i + 1), h('b', null, x[1]), h('span', { class: 'hs-ico' }, icon(x[0]))),
      h('p', null, x[2])))),
    h('h2', { class: 'howto-h' }, 'Co se děje potom'),
    h('div', { class: 'flow2' }, next.map((x, i) => [i ? h('div', { class: 'arrow' }, icon('right')) : null,
      h('div', null, h('b', null, x[0]), h('span', null, x[1]))])),
    h('div', { class: 'cols2' },
      h('div', { class: 'card' }, h('h2', null, 'Na kiosku'),
        h('p', null, 'Kde je potřeba podpis (④, ⑤ ⑥, uzavření, ⑦), aplikace se zeptá „Kdo podepisuje?“. Napište své jméno a vyberte ho z nabídky.'),
        h('p', { class: 'sub' }, 'Po chvíli bez dotyku se kiosk sám vrátí na tabuli.')),
      h('div', { class: 'card' },
        h('details', { class: 'roles-more' }, h('summary', null, icon('right'), 'Kdo co může'),
          h('div', { class: 'slots-wrap' }, h('table', { class: 'roles' },
            h('tr', null, h('th', null, ''), h('th', null, 'Kdokoli'), h('th', null, 'Vedoucí'), h('th', null, 'Manažer')),
            rows.map(r => h('tr', null, r.map(c => h('td', null, c)))))),
          h('p', { class: 'sub', style: 'margin-top:10px' }, 'Vaše role: ' + (S.me.role === 'ADMIN' ? 'manažer' : (roleName(S.me.role) || 'běžný uživatel')).toLowerCase() + '.')))));
}

async function refresh(quiet, btn, all) {
  if (btn) { btn.disabled = true; btn.textContent = 'Načítám…'; }
  try {
    const res = await api('apiRefresh', all || S.all);
    Object.assign(S, { qraps: res.qraps, actions: res.actions, effects: res.effects, assess: res.assess, all: res.all });
    if (!quiet) toast('Aktualizováno ✓');
  } catch (e) {
    if (!quiet) toast(errText(e), true);
  }
  if (S.view === 'board') { if (btn || all) render(); else if (redrawBoard) redrawBoard(); }
}

/** When a problem is opened, fetch its latest version in the background (someone else may have changed it). */
function refreshOne(id) {
  const snap = () => JSON.stringify([byId(id), S.actions.filter(a => a.qrapId === id), S.effects.filter(a => a.qrapId === id),
    S.assess.filter(a => a.qrapId === id)]);
  api('apiGet', id).then(res => {
    const before = snap();
    store(res);
    if (before !== snap() && S.view === 'detail' && S.id === id && !S.edit) render();
  }).catch(e => {
    if (!byId(id)) { toast(errText(e), true); go('board'); }
  });
}

function startKiosk() {
  document.body.classList.add('kiosk');
  let last = Date.now();
  ['click', 'keydown', 'touchstart', 'input'].forEach(ev => document.addEventListener(ev, () => { last = Date.now(); }, true));
  setInterval(() => {
    const limit = (Number(S.cfg.KIOSK_NAVRAT_SEKUND) || 120) * 1000;
    if (S.view !== 'board' && Date.now() - last > limit) go('board');
  }, 5000);
}

function start() {
  if (BOOT.error) {
    fill(document.getElementById('app'), h('main', null, h('div', { class: 'card' },
      h('h1', null, 'Aplikaci se nepodařilo spustit'), h('p', null, BOOT.error),
      h('p', { class: 'muted' }, 'Kontaktujte správce aplikace.'))));
    return;
  }
  fillPeopleList();
  const p = BOOT.params || {};
  S.view = p.id ? 'detail' : (['new', 'help'].includes(p.view) ? p.view : 'board');
  S.id = p.id || null;
  try {
    google.script.history.setChangeHandler(e => {
      const st = (e && e.state) || {};
      const prm = (e && e.location && e.location.parameter) || {};
      S.view = st.view || (prm.id ? 'detail' : (prm.view || 'board'));
      S.id = st.id || prm.id || null;
      S.edit = null;
      render();
    });
  } catch (e) { /* ignore */ }
  render();
  if (S.view === 'detail') refreshOne(S.id);
  if (S.kiosk) startKiosk();
  setInterval(() => { if (S.view === 'board' && !document.hidden) refresh(true); }, 90000);
}

start();
</script>
