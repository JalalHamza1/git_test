<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
/* =====================================================================
   eQRAP – stylesheet. Plain "document" look: white page, black text,
   thin rules instead of boxes, one green for actions. Nothing else.
   Change the green in one place: --accent.
   ===================================================================== */
:root {
  --ink: #16191d; --ink-2: #4b535c; --ink-3: #848c95;
  --rule: #e4e7eb; --rule-2: #cdd2d8; --field: #ffffff; --page: #ffffff; --soft: #f5f6f7;
  --accent: #2b7a4b; --accent-ink: #1f5d38; --accent-soft: #eef5f0;
  --bad: #b3261e; --warn: #8a5300;
  --series-1: #2a78d6; --series-2: #eb6834; /* chart colours (validated for colour-blind readers) */
  --text: var(--ink); --muted: var(--ink-3); --line: var(--rule); --line2: var(--rule-2); --accent-d: var(--accent-ink); --accent-s: var(--accent-soft);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1 { font-size: 26px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; margin: 0; }
h2 { font-size: 15px; font-weight: 650; margin: 0; }
p { margin: 0 0 8px; }
a { color: var(--accent-ink); }
button { font: inherit; cursor: pointer; }
[hidden] { display: none !important; }
.grow { flex: 1; }
.muted, .sub { color: var(--ink-3); }
.sub { font-size: 13px; }
.small { font-size: 13px; }
.pre { white-space: pre-wrap; }
.late-txt { color: var(--bad); font-weight: 600; }
.wide { grid-column: 1 / -1; }

/* ---------- top bar ---------- */
.top { border-bottom: 1px solid var(--rule); background: #fff; position: sticky; top: 0; z-index: 10; }
.top-in { max-width: 1160px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; font-weight: 700; font-size: 15px; color: var(--ink); }
.logo { width: 22px; height: 22px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 12px; display: grid; place-items: center; }
nav { display: flex; gap: 22px; height: 100%; }
.nav { background: none; border: 0; padding: 0; height: 100%; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; }
.nav:hover { color: var(--ink); }
.nav.on { color: var(--ink); border-bottom-color: var(--ink); }
.who { font-size: 13px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.role { color: var(--ink-2); }
.role::before { content: '· '; }
.view-as { width: auto; min-height: 0; padding: 4px 6px; font-size: 13px; }
main { max-width: 1160px; margin: 0 auto; padding: 32px 24px 80px; }
.narrow { max-width: 820px; margin: 0 auto; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 6px;
  border: 1px solid var(--rule-2); background: #fff; color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); padding: 0 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--soft); }
.btn.small { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn-cta { height: 44px; padding: 0 22px; font-size: 15px; }
.btn-muted { height: 44px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* ---------- fields ---------- */
.fld { display: block; }
.fld-l { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.req { color: var(--bad); font-weight: 400; }
.fld small { display: block; font-size: 13px; color: var(--ink-3); margin-top: 6px; }
input, select, textarea { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--field);
  font: inherit; color: var(--ink); }
textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
input[type=checkbox], input[type=radio] { width: 16px; height: 16px; margin: 0; padding: 0; accent-color: var(--accent); flex: none; }
input[type=file] { height: auto; border: 0; padding: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.fld.invalid input, .fld.invalid select, .fld.invalid textarea { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.fld.invalid .fld-l { color: var(--bad); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 24px; align-items: start; }
.sub-h { grid-column: 1 / -1; font-size: 13px; font-weight: 600; color: var(--ink-3); padding-top: 14px; border-top: 1px solid var(--rule); margin-top: 6px; }
.grid > .sub-h:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.checks { display: flex; flex-direction: column; gap: 10px; }
.check, .check-line { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; font-weight: 400; }
.check.on { color: var(--ink); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.choice input { margin-top: 3px; }
.choice b { font-weight: 500; }
.choice small { display: block; color: var(--ink-3); font-size: 13px; }
.choices.inline { flex-direction: row; gap: 24px; flex-wrap: wrap; }
.with-btn { display: flex; gap: 8px; }
.with-btn input { flex: 1; min-width: 0; }
.form-btns { display: flex; gap: 10px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.note { font-size: 14px; color: var(--ink-2); padding: 10px 0; }
.note.warn { color: var(--warn); }

/* ---------- new QRAP: steps on the left, one column of questions ---------- */
.shell { max-width: 1000px; margin: 0 auto; }
.shell-head { padding-bottom: 24px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; }
.shell-head .sub { font-size: 15px; margin-top: 6px; }
.shell-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; align-items: start; }
.wiz-steps { position: sticky; top: 80px; height: auto; display: block; }
.wiz-list { display: flex; flex-direction: column; }
.wiz-step { display: grid; grid-template-columns: 26px 1fr; grid-template-rows: auto auto; text-align: left; background: none; border: 0;
  border-left: 2px solid var(--rule); padding: 9px 0 9px 14px; color: var(--ink-3); font-size: 14px; }
.wiz-step small { grid-column: 2; font-size: 12px; color: var(--ink-3); }
.wiz-n { font-variant-numeric: tabular-nums; }
.wiz-step.done { color: var(--ink-2); }
.wiz-step.on { color: var(--ink); font-weight: 650; border-left-color: var(--accent); }
.shell-body { max-width: 620px; }
.shell-sub { font-size: 21px; font-weight: 650; margin-bottom: 26px; outline: none; }
.shell .grid { grid-template-columns: 1fr; }
.shell .sec { margin: 0 0 8px; }
.shell .sec-head { display: none; }
.shell-foot { display: flex; gap: 10px; align-items: center; margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--rule); }
.shell-note { display: none; }

/* ---------- board ---------- */
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.hero .sub { margin-top: 6px; font-size: 14px; }
.hero-btn { height: 48px; padding: 0 24px; font-size: 16px; }
body.kiosk .hero-btn { height: 64px; padding: 0 36px; font-size: 20px; }
.flash { display: flex; gap: 16px; align-items: center; padding: 12px 0; margin-bottom: 18px; border-bottom: 1px solid var(--rule); color: var(--accent-ink); font-weight: 600; }
.tiles { display: flex; gap: 28px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; flex-wrap: wrap; }
.tile { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 10px; color: var(--ink-3); font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.tile b { font-size: 14px; color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.tile span { font-weight: 500; }
.tile:hover { color: var(--ink); }
.tile.on { color: var(--ink); border-bottom-color: var(--ink); }
.tile.on b { color: var(--ink); }
.tile.alert b { color: var(--bad); }
.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.toolbar select { width: auto; min-width: 180px; }
.toolbar input[type=search] { width: 340px; max-width: 100%; }
.list { border-top: 1px solid var(--ink); }
.row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 150px 210px 100px 110px; gap: 18px; align-items: start; padding: 14px 4px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.row:hover { background: var(--soft); }
.row.head { cursor: default; padding: 8px 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.row.head:hover { background: none; }
.c-id { font-weight: 600; font-variant-numeric: tabular-nums; }
.c-what b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-what .sub, .c-area .sub, .c-st .sub, .c-age .sub { margin-top: 2px; }
.row-tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; font-weight: 500; }
.row-tags:empty { display: none; }
.prog { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.prog-bar { display: flex; gap: 2px; flex: 1; }
.prog-bar span { flex: 1; height: 4px; background: var(--rule); }
.prog-bar span.on { background: var(--ink-2); }
.prog small { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.empty { padding: 40px 0; color: var(--ink-3); text-align: center; }
.more { padding-top: 16px; font-size: 14px; color: var(--ink-3); }
.list.flat { border-top: 0; }
.list.flat .row { grid-template-columns: 110px minmax(0, 1fr) 160px; }
.list.flat .c-prog, .list.flat .c-age, .list.flat .c-area { display: none; }

/* status words: plain text, colour only where it carries meaning */
.badge { font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.badge.ok { color: var(--accent-ink); }
.badge.warn { color: var(--warn); }
.badge.bad { color: var(--bad); }
.badge.info { color: var(--ink); }
.badge.muted { color: var(--ink-3); }
.tag { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.tag.bad { color: var(--bad); }
.tag + .tag::before { content: '· '; color: var(--ink-3); }
.tags { display: flex; gap: 6px 16px; flex-wrap: wrap; }
.tags .tag { font-size: 15px; font-weight: 400; color: var(--ink); }
.tags .tag + .tag::before { content: ''; }

/* ---------- QRAP detail: a document, sections divided by rules ---------- */
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin: 10px 0 18px; }
.d-head h1 { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.d-head .sub { margin-top: 6px; font-size: 14px; }
.tracker { display: flex; flex-wrap: wrap; gap: 4px 0; margin: 0 0 22px; font-size: 13px; }
.trk { color: var(--ink-3); }
.trk:not(:last-child)::after { content: '›'; margin: 0 10px; color: var(--rule-2); }
.trk.done { color: var(--ink-2); }
.trk.now { color: var(--ink); font-weight: 650; }
.next { padding: 14px 0; margin-bottom: 8px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.next.bad b { color: var(--bad); }
.next.ok b { color: var(--accent-ink); }
.band, .band.dark { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 34px 0 0; text-transform: uppercase; letter-spacing: .06em; }
.card { padding: 22px 0; border-bottom: 1px solid var(--rule); }
.card > h2, .card h2 { margin-bottom: 12px; }
.sec { padding: 22px 0; border-bottom: 1px solid var(--rule); }
.sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.sec-head h2 { font-size: 17px; text-transform: lowercase; }
.sec-head h2::first-letter { text-transform: uppercase; }
.num { color: var(--ink-3); font-weight: 600; font-size: 15px; min-width: 18px; font-variant-numeric: tabular-nums; }
.sec.wait h2, .sec.skip h2, .sec.wait .sec-body, .sec.skip .sec-body { color: var(--ink-3); }
.big-text { font-size: 18px; font-weight: 500; margin: 0 0 6px; white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 28px; margin-top: 14px; }
.kv span { display: block; font-size: 13px; color: var(--ink-3); margin-bottom: 1px; }
.by { font-size: 13px; color: var(--ink-3); margin-top: 10px; }
.box { margin-top: 16px; padding: 14px 0 0; border-top: 1px dashed var(--rule-2); }
.box.ok > b { color: var(--accent-ink); }
.box.bad > b { color: var(--bad); }
.whys { list-style: none; margin: 0; padding: 0; }
.whys li { padding: 6px 0; display: grid; grid-template-columns: 44px 1fr; }
.whys li b { color: var(--ink-3); font-size: 13px; font-weight: 600; }
.whys li.root-step { font-weight: 600; }
.whys .badge { margin-left: 10px; }
.root { margin-top: 10px; }
.act { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 14px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.act:last-child { border-bottom: 0; }
.act-no { color: var(--ink-3); font-size: 13px; font-weight: 600; }
.act.done .act-text { color: var(--ink-3); }
.act-btns { display: flex; gap: 6px; }
.act-form, .ia-row { padding: 18px 0; border-top: 1px dashed var(--rule-2); margin-top: 8px; }
.ia-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; }
.why-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; margin-bottom: 12px; }
.why-root { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding-bottom: 12px; white-space: nowrap; cursor: pointer; }
.checklist { list-style: none; margin: 10px 0; padding: 0; }
.checklist li { padding: 3px 0; }
.checklist .ok { color: var(--accent-ink); font-weight: 700; }
.checklist .no { color: var(--bad); font-weight: 700; }
.slots-wrap { overflow-x: auto; }
.slots, table.roles, table.people { width: 100%; border-collapse: collapse; font-size: 14px; }
.slots th, .slots td, .roles th, .roles td, .people th, .people td { text-align: left; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.slots th, .roles th, .people th { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.roles td:not(:first-child), .roles th:not(:first-child) { text-align: center; width: 110px; }
.slots input, .slots select { height: 36px; min-width: 120px; }
.people tr.inactive td { color: var(--ink-3); }
.assess-item { padding: 10px 0; border-bottom: 1px solid var(--rule); }
.assess-item .badge { margin-right: 10px; }
.photo-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pslot > b { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.pslot.wrong > b { color: var(--bad); }
.pslot.right > b { color: var(--accent-ink); }
.ph { width: 100%; height: 170px; border: 1px dashed var(--rule-2); border-radius: 6px; background: var(--soft); display: grid; place-items: center;
  color: var(--ink-3); font-size: 13px; overflow: hidden; padding: 0; margin-bottom: 8px; position: relative; cursor: pointer; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph .x { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 50; cursor: zoom-out; }
.lightbox img { max-width: 94vw; max-height: 94vh; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { padding: 8px 0; border-bottom: 1px solid var(--rule); }
.inline-form { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Přehled (dashboard) ---------- */
.tiles-6, .tiles-3 { display: grid; gap: 0; border: 0; border-top: 1px solid var(--ink); margin: 0 0 8px; }
.tiles-6 { grid-template-columns: repeat(6, 1fr); }
.tiles-3 { grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); }
.tiles-6 .tile, .tiles-3 .tile { flex-direction: column; align-items: flex-start; gap: 2px; padding: 16px 16px 16px 0; border-bottom: 1px solid var(--rule); text-align: left; }
.tiles-6 .tile b, .tiles-3 .tile b { font-size: 28px; font-weight: 600; color: var(--ink); line-height: 1.1; }
.tiles-6 .tile.alert b { color: var(--bad); }
.kpi { cursor: default; }
.kpi small { color: var(--ink-3); font-size: 12px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; }
.cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.legend { display: flex; gap: 18px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.dot.s1 { background: var(--series-1); } .dot.s2 { background: var(--series-2); }
.viz-box { position: relative; }
.viz { width: 100%; height: auto; display: block; }
.viz-grid { stroke: #eef0f2; stroke-width: 1; }
.viz-base { stroke: var(--rule-2); stroke-width: 1; }
.viz-axis { fill: var(--ink-3); font-size: 12px; }
.viz-s1 { fill: var(--series-1); } .viz-s2 { fill: var(--series-2); }
.viz-hit { fill: transparent; }
.viz-group:hover .viz-hit { fill: #f4f5f6; }
.viz-tip { position: absolute; top: 4px; transform: translateX(-50%); background: #fff; border: 1px solid var(--rule-2); border-radius: 6px; padding: 8px 10px;
  font-size: 12px; pointer-events: none; white-space: nowrap; }
.hbar { display: grid; grid-template-columns: 170px 1fr 32px; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; }
.hbar.click { cursor: pointer; }
.hbar.click:hover .hbar-l { text-decoration: underline; }
.hbar-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-t { height: 10px; background: #f1f2f4; }
.hbar-f { display: block; height: 10px; background: var(--series-1); min-width: 2px; }
.hbar b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- help ---------- */
.flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; padding: 8px 0 24px; border-bottom: 1px solid var(--rule); counter-reset: f; }
.flow b { display: block; margin-bottom: 4px; }
.flow b::before { counter-increment: f; content: counter(f) '  '; color: var(--ink-3); }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 6px;
  font-size: 14px; font-weight: 500; z-index: 60; max-width: 92vw; }
.toast.bad { background: var(--bad); }

/* ---------- phone ---------- */
@media (max-width: 820px) {
  .top-in { padding: 0 16px; gap: 16px; height: auto; min-height: 52px; flex-wrap: wrap; }
  nav { order: 3; width: 100%; height: 40px; overflow-x: auto; }
  .who { display: none; }
  main { padding: 20px 16px 60px; }
  h1 { font-size: 22px; }
  .hero-btn { width: 100%; }
  .grid { grid-template-columns: 1fr; }
  .shell-grid { grid-template-columns: 1fr; gap: 20px; }
  .wiz-steps { position: static; }
  .wiz-list { flex-direction: row; overflow-x: auto; }
  .wiz-step { border-left: 0; border-bottom: 2px solid var(--rule); padding: 8px 10px; grid-template-columns: auto; white-space: nowrap; }
  .wiz-step span:not(.wiz-n), .wiz-step small { display: none; }
  .wiz-step.on span:not(.wiz-n) { display: inline; margin-left: 6px; }
  .wiz-step.on { border-bottom-color: var(--accent); display: flex; }
  .shell-foot { flex-wrap: wrap; }
  .shell-foot .btn-cta { flex: 1; }
  .row { grid-template-columns: 1fr auto; gap: 4px 12px; }
  .row.head { display: none; }
  .c-id { order: 1; } .c-st { order: 2; text-align: right; } .c-what { order: 3; grid-column: 1 / -1; }
  .c-area { order: 4; } .c-age { order: 5; text-align: right; } .c-prog { order: 6; grid-column: 1 / -1; }
  .tiles { gap: 18px; overflow-x: auto; flex-wrap: nowrap; }
  .tiles-6, .tiles-3 { grid-template-columns: 1fr 1fr; }
  .cols2, .cols3, .flow { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr 1fr; }
  .act { grid-template-columns: 32px minmax(0, 1fr); }
  .act-st, .act-btns { grid-column: 2; }
  .d-head { flex-direction: column; }
  .photo-slots { grid-template-columns: 1fr 1fr; }
  .hbar { grid-template-columns: 110px 1fr 28px; }
}
@media print {
  .top, .no-print, .btn, .toast, .tracker { display: none !important; }
  main { padding: 0; }
  .sec { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<datalist id="people-list"></datalist>
<script>const BOOT = <?!= boot ?>;</script>
<script>
'use strict';
/* =====================================================================================
   eQRAP Expedice (Lite) – the whole screen.
   The questions are the ones of the firm's QRAP V3.0 form (logistics version), ① to ⑦.
   All data arrives together with the page (BOOT), so moving around is instant.
   The server is called only when something is saved, and for a quiet refresh.

   1. State and texts      4. Board (Přehled)          7. Forms (① … ⑦)
   2. Small helpers        5. New problem (Nahlásit)   8. Photos
   3. Header and routing   6. Problem detail ①–⑦      9. Help, kiosk, refresh, start
   ===================================================================================== */

// ------------------------------------------------------------------ 1. STATE AND TEXTS
const S = {
  me: BOOT.me || {}, cfg: BOOT.cfg || {}, lists: BOOT.lists || {}, people: BOOT.people || [],
  qraps: BOOT.qraps || [], actions: BOOT.actions || [], effects: BOOT.effects || [], assess: BOOT.assess || [], all: false,
  kiosk: !!(BOOT.params && BOOT.params.kiosk === '1') || (BOOT.me && BOOT.me.role === 'KIOSK'),
  view: 'board', id: null, edit: null, filter: 'open', area: '', search: '', history: {}, flash: null, adm: null
};
const isManager = () => S.me.role === 'MANAŽER' || S.me.role === 'ADMIN';
const isAdmin = () => S.me.role === 'ADMIN';
const onKiosk = () => S.me.role === 'KIOSK';

const STATUS = {
  'OPATŘENÍ':   { label: '③ Opatření', cls: 'warn', next: '③ Okamžitá opatření', who: 'kdokoli ze směny (TL)' },
  'ROZHODNUTÍ': { label: '④ Rozhodnutí', cls: 'warn', next: '④ Rozhodnutí OJT', who: 'vedoucí' },
  'ANALÝZA':    { label: '⑤ 5 Proč', cls: 'info', next: '⑤ 5 Proč a ⑥ konečné akce', who: 'piloti' },
  'AKCE':       { label: '⑥ Akce', cls: 'info', next: '⑥ Konečné akce', who: 'piloti akcí' },
  'OVĚŘENÍ':    { label: '⑥ Ověření 5 směn', cls: 'info', next: '⑥ Efektivita 5 směn, potom uzavření manažerem', who: 'TL, manažer uzavře' },
  'SCHVÁLENÍ':  { label: 'Ke schválení', cls: 'warn', next: 'Uzavření – schválení manažerem', who: 'manažer' },
  'UZAVŘENO':   { label: 'Uzavřeno', cls: 'ok' },
  'ZRUŠENO':    { label: 'Zrušeno', cls: 'muted' }
};
const DECISIONS = [
  { value: 'POKRAČOVAT', label: 'Pokračovat s analýzou a 5 Proč', sub: 'Příčina není známá nebo je co se naučit → piloti dostanou e-mail.' },
  { value: 'VYŘEŠENO', label: 'Problém vyřešen: ŽÁDNÉ 5 Proč', sub: 'Opatření a OJT problém vyřešily. QRAP se uzavře.' },
  { value: 'ESKALACE', label: 'Eskalace na vyšší úroveň (manažer)', sub: 'Přesahuje oblast → manažer dostane e-mail, analýza pokračuje.' }
];
const CRITERIA = [
  ['c1', '1 RED BOX', 'Popis problému'], ['c2', '2 ROZDĚLENÍ', 'Třídění, ochrana a rozdělení úkolů'],
  ['c3', '3 POROVNÁNÍ', 'Dobrý a špatný'], ['c4', '4 POUČENÍ A SDÍLENÍ', 'Komunikace a transversalizace'],
  ['c5', '5 ON JOB TRAINING', 'OJT provedené managementem']
];
const SECTION_TITLES = ['', 'POPIS PROBLÉMU', 'KDO BYL UPOZORNĚN?', 'OKAMŽITÁ OPATŘENÍ', 'ROZHODNUTÍ OJT',
  'PŘÍČINA 5 Proč?', 'KONEČNÉ AKCE', 'HODNOCENÍ QRQC'];
const YES_NO = [{ value: 'ANO', label: 'ano' }, { value: 'NE', label: 'ne' }];

// ------------------------------------------------------------------ 2. SMALL HELPERS
/** Creates an element. Text is always inserted as text (never as HTML), so nothing typed can break the page. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'value') value = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = true;
    else el.setAttribute(k, v === true ? '' : v);
  });
  kids.flat(Infinity).forEach(k => {
    if (k !== null && k !== undefined && k !== false && k !== '') el.append(k instanceof Node ? k : String(k));
  });
  if (value !== undefined) el.value = value;
  return el;
}

/** Replaces the content of an element (same rules as h: lists are flattened, empty values skipped). */
function fill(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false && k !== ''));
  return el;
}

/** Calls a server function from Code.gs and returns a Promise. */
function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

function errText(e) {
  const m = String((e && e.message) || e || '');
  if (/NetworkError|Failed to fetch|network/i.test(m)) return 'Nepodařilo se spojit se serverem. Zkontrolujte připojení a zkuste to znovu.';
  return m.replace(/^(Exception|Error|Výjimka):\s*/, '');
}

let toastTimer = null;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (bad ? ' bad' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 7000 : 2500);
}

/** Saves: disables the button while waiting, stores the answer, shows "Uloženo". Returns the answer or null. */
async function save(btn, fn, args) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Ukládám…';
  try {
    const res = await api(fn, ...args);
    store(res);
    toast('Uloženo ✓');
    return res;
  } catch (e) {
    toast(errText(e), true);
    btn.disabled = false;
    btn.textContent = label;
    return null;
  }
}

/** Save from inside the detail page, then close the form and show the section again. */
async function submit(btn, fn, args, secNo) {
  const res = await save(btn, fn, args);
  if (!res) return null;
  S.edit = null;
  render();
  const el = document.getElementById('sec' + secNo);
  if (el) el.scrollIntoView({ block: 'nearest' });
  return res;
}

/** Puts a fresh problem (from the server) into the page's data. */
function store(res) {
  if (!res || !res.qrap) return;
  const id = res.qrap.id;
  const i = S.qraps.findIndex(q => q.id === id);
  if (i >= 0) S.qraps[i] = res.qrap; else S.qraps.unshift(res.qrap);
  S.actions = S.actions.filter(a => a.qrapId !== id).concat(res.actions);
  S.effects = S.effects.filter(a => a.qrapId !== id).concat(res.effects);
  S.assess = S.assess.filter(a => a.qrapId !== id).concat(res.assess);
  delete S.history[id];
}

const pad = n => String(n).padStart(2, '0');
function fmtDT(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const y = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
  return d.getDate() + '. ' + (d.getMonth() + 1) + '.' + y + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function fmtD(v) {
  if (!v) return '';
  const d = v.length === 10 ? new Date(v + 'T00:00') : new Date(v);
  return d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear();
}
function ago(iso) {
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 60) return 'před ' + min + ' min';
  if (min < 48 * 60) return 'před ' + Math.round(min / 60) + ' h';
  return 'před ' + Math.round(min / 1440) + ' dny';
}
function localInput(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function dayOf(iso) { const d = iso ? new Date(iso) : new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const today = () => dayOf();
const split = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const isOther = v => String(v || '').trim().toLowerCase() === 'jiné';
const byId = id => S.qraps.find(q => q.id === id);
const actsOf = (id, part) => S.actions.filter(a => a.qrapId === id && a.part === part && !a.removed).sort((a, b) => a.no - b.no);
const isOpen = q => q.status !== 'UZAVŘENO' && q.status !== 'ZRUŠENO';
const hours3 = () => Number(S.cfg.LHUTA_OPATRENI_HODIN) || 24;
const deadline3 = q => new Date(new Date(q.when || q.created).getTime() + hours3() * 3600e3);
const actLate = a => !a.done && a.due && a.due < today();
const isLate = q => isOpen(q) && ((q.status === 'OPATŘENÍ' && deadline3(q) < new Date()) || actsOf(q.id, '⑥').some(actLate));
const roleName = r => ({ 'VEDOUCÍ': 'Vedoucí', 'MANAŽER': 'Manažer', 'ADMIN': 'Admin', 'KIOSK': 'Kiosk' }[r] || '');
function personName(email) {
  const kiosk = / \(kiosk\)$/.test(email || '');
  const e = String(email || '').replace(/ \(kiosk\)$/, '');
  const p = S.people.find(x => x.email === e);
  return (p ? p.name : e) + (kiosk ? ' (na kiosku)' : '');
}
const pilotNames = q => split(q.pilots).map(personName).join(', ');
function badge(q) { const st = STATUS[q.status] || { label: q.status, cls: '' }; return h('span', { class: 'badge ' + st.cls }, st.label); }
const ynText = v => (v === 'ANO' ? 'ano' : v === 'NE' ? 'ne' : '');
function kv(pairs) {
  return h('div', { class: 'kv' }, pairs.filter(p => p[1] !== '' && p[1] !== null && p[1] !== undefined)
    .map(p => h('div', null, h('span', null, p[0]), p[1])));
}

// ------------------------------------------------------------------ 3. HEADER AND ROUTING
/** Show another page. replace = true: do not keep the current page in the browser's Back history. */
function go(view, id, replace) {
  S.view = view;
  S.id = id || null;
  S.edit = null;
  const p = {};
  if (id) p.id = id; else if (view !== 'board') p.view = view;
  if (S.kiosk) p.kiosk = '1';
  try { google.script.history[replace ? 'replace' : 'push']({ view: view, id: id || null }, p); } catch (e) { /* ignore */ }
  render();
  window.scrollTo(0, 0);
  if (view === 'detail') refreshOne(id);
}

function edit(key) {
  S.edit = key;
  render();
  const form = document.querySelector('.editing');
  if (form) {
    form.scrollIntoView({ block: 'nearest' });
    const first = form.querySelector('input:not([type=checkbox]):not([type=radio]), textarea, select');
    if (first) first.focus({ preventScroll: true });
  }
}

function render() {
  const pages = { board: boardPage, new: newPage, detail: detailPage, help: helpPage, dash: dashPage, admin: adminPage };
  if ((S.view === 'dash' && !isManager()) || (S.view === 'admin' && !isAdmin())) S.view = 'board';
  fill(document.getElementById('app'), header(), h('main', null, (pages[S.view] || boardPage)()));
}

function header() {
  const nav = (label, view) => h('button', { class: 'nav' + (S.view === view ? ' on' : ''), onclick: () => go(view) }, label);
  const who = S.kiosk ? h('span', { class: 'who' }, 'Kiosk')
    : h('span', { class: 'who', title: S.me.email }, S.me.name || S.me.email || '', S.me.role ? h('span', { class: 'role' }, roleName(S.me.role)) : null);
  return h('header', { class: 'top' }, h('div', { class: 'top-in' },
    h('button', { class: 'brand', onclick: () => go('board') }, h('span', { class: 'logo' }, 'Q'), S.cfg.NAZEV || 'eQRAP'),
    h('nav', null, nav('Tabule', 'board'), isManager() ? nav('Přehled', 'dash') : null, isAdmin() ? nav('Správa', 'admin') : null,
      nav('Jak to funguje', 'help')),
    h('div', { class: 'grow' }),
    h('button', { class: 'btn primary', onclick: () => go('new') }, '+ Nahlásit problém'),
    S.me.owner ? viewAsSelect() : null,
    who));
}

/** Owner only: "Zobrazit jako" – try the app as another role (the server enforces that role too). */
function viewAsSelect() {
  const sel = h('select', { class: 'view-as', title: 'Zobrazit aplikaci jako jiná role', onchange: async e => {
    sel.disabled = true;
    try {
      const b = await api('apiViewAs', e.target.value);
      Object.assign(S, { me: b.me, cfg: b.cfg, lists: b.lists, people: b.people, qraps: b.qraps, actions: b.actions,
        effects: b.effects, assess: b.assess, all: false, kiosk: b.me.role === 'KIOSK', adm: null, edit: null });
      document.body.classList.toggle('kiosk', S.kiosk);
      toast(e.target.value ? 'Zobrazeno jako: ' + e.target.selectedOptions[0].textContent : 'Zpět jako Admin');
      go('board');
    } catch (err) { toast(errText(err), true); sel.disabled = false; }
  } },
  [['', 'Admin (vy)'], ['-', 'jako: běžný uživatel'], ['VEDOUCÍ', 'jako: vedoucí'], ['MANAŽER', 'jako: manažer'], ['KIOSK', 'jako: kiosk']]
    .map(o => h('option', { value: o[0] }, o[1])));
  sel.value = S.me.viewAs || '';
  return sel;
}

// ------------------------------------------------------------------ 4. BOARD (TABULE = HOME)
const FILTERS = {
  open:      { label: 'Otevřené', test: isOpen },
  mine:      { label: 'Moje úkoly', test: q => isMine(q) },
  decide:    { label: 'Čeká na rozhodnutí', test: q => q.status === 'ROZHODNUTÍ' },
  approve:   { label: 'Čeká na manažera', test: q => q.status === 'SCHVÁLENÍ' || (q.status === 'OVĚŘENÍ' && q.eff.allOk) },
  late:      { label: 'Po termínu', test: isLate, alert: true },
  closed:    { label: 'Uzavřené', test: q => q.status === 'UZAVŘENO' },
  cancelled: { label: 'Zrušené', test: q => q.status === 'ZRUŠENO' }
};

/** "My tasks": leaders see what waits for them, pilots their analysis, managers what waits for closing. */
function isMine(q) {
  if (!isOpen(q)) return false;
  if (S.actions.some(a => a.qrapId === q.id && a.canDone && a.ownerEmail === S.me.email)) return true;
  if (split(q.pilots).includes(S.me.email) && ['ANALÝZA', 'AKCE'].includes(q.status)) return true;
  if (isManager() && FILTERS.approve.test(q)) return true;
  if (S.me.role && (!S.me.area || S.me.area === q.zone) && ['OPATŘENÍ', 'ROZHODNUTÍ'].includes(q.status)) return true;
  return false;
}

/** How far the QRAP is on the paper form: how many of the parts ①–⑦ are behind it. */
function stage(q) {
  return { 'OPATŘENÍ': 2, 'ROZHODNUTÍ': 3, 'ANALÝZA': 4, 'AKCE': 5, 'OVĚŘENÍ': 6, 'SCHVÁLENÍ': 6, 'UZAVŘENO': 7 }[q.status] || 0;
}
function progressEl(q) {
  const n = stage(q);
  return h('div', { class: 'prog', title: 'Hotovo ' + n + ' ze 7 částí formuláře' },
    h('div', { class: 'prog-bar' }, [1, 2, 3, 4, 5, 6, 7].map(i => h('span', { class: i <= n ? 'on' : '' }))),
    h('small', null, n + '/7'));
}

let redrawBoard = null;
function boardPage() {
  const keys = S.kiosk ? ['open', 'decide', 'approve', 'late', 'closed'] : ['open', 'mine', 'decide', 'late', 'closed'];
  if (!keys.includes(S.filter) && S.filter !== 'cancelled') S.filter = 'open';
  const tiles = h('div', { class: 'tiles' });
  const listBox = h('div', { class: 'list' });
  const countEl = h('span', { class: 'sub' });
  const inArea = q => !S.area || q.zone === S.area;

  const drawList = () => {
    const words = S.search.trim().toLowerCase();
    const test = FILTERS[S.filter].test;
    const rows = S.qraps.filter(q => inArea(q) && (words ? q.status !== 'ZRUŠENO' && haystack(q).includes(words) : test(q))).sort(order);
    countEl.textContent = words ? 'Nalezeno: ' + rows.length : rows.length + ' ' + (rows.length === 1 ? 'QRAP' : 'QRAP');
    fill(listBox,
      h('div', { class: 'row head' }, h('div', null, 'Číslo'), h('div', null, 'Problém'), h('div', null, 'Kde'),
        h('div', null, 'Stav'), h('div', null, 'Průběh ①–⑦'), h('div', null, 'Zjištěno')),
      rows.length ? rows.map(rowEl) : h('div', { class: 'empty' }, words ? 'Nic nenalezeno.' : 'Žádné QRAP v tomto filtru.'));
  };
  const drawTiles = () => fill(tiles, keys.map(k => {
    const n = S.qraps.filter(q => inArea(q) && FILTERS[k].test(q)).length;
    return h('button', { class: 'tile' + (S.filter === k && !S.search ? ' on' : '') + (FILTERS[k].alert && n ? ' alert' : ''),
      onclick: () => { S.filter = k; S.search = ''; search.value = ''; draw(); } }, h('b', null, n), h('span', null, FILTERS[k].label));
  }));
  const draw = () => { drawTiles(); drawList(); };
  redrawBoard = draw;

  const areaSel = h('select', { onchange: e => { S.area = e.target.value; draw(); } },
    h('option', { value: '' }, 'Všechny zóny'), (S.lists.zones || []).map(a => h('option', { value: a }, a)));
  areaSel.value = S.area;
  const search = h('input', { type: 'search', placeholder: 'Hledat: číslo QRAP, materiál, HU, dodací list, text…', value: S.search,
    oninput: e => { S.search = e.target.value; draw(); } });
  draw();

  const open = S.qraps.filter(isOpen);
  const flash = S.flash;
  S.flash = null;
  const cancelled = S.qraps.filter(FILTERS.cancelled.test).length;
  return h('div', null,
    h('div', { class: 'hero' },
      h('div', null, h('h1', null, 'Tabule QRAP'),
        h('div', { class: 'sub' }, open.length + ' otevřených · ' + open.filter(isLate).length + ' po termínu · kliknutím otevřete formulář')),
      h('button', { class: 'btn primary hero-btn', onclick: () => go('new') }, '+ Nahlásit problém')),
    flash ? h('div', { class: 'flash' }, h('span', null, '✓ ' + flash.text),
      flash.id && !S.kiosk ? h('button', { class: 'link', onclick: () => go('detail', flash.id) }, 'Otevřít ' + flash.id) : null) : null,
    myActions(),
    tiles,
    h('div', { class: 'toolbar' }, areaSel, search, h('div', { class: 'grow' }), countEl,
      h('button', { class: 'btn ghost small', onclick: e => refresh(false, e.currentTarget) }, '⟳ Obnovit')),
    listBox,
    h('div', { class: 'more' },
      S.all ? null : h('button', { class: 'link', onclick: e => refresh(false, e.currentTarget, true) }, 'Zobrazit i starší uzavřené'),
      isManager() && cancelled ? [' · ', h('button', { class: 'link', onclick: () => { S.filter = 'cancelled'; render(); } }, 'Zrušené (' + cancelled + ')')] : null));
}

function haystack(q) {
  return [q.id, q.what, q.zone, q.location, q.materialNo, q.huNo, q.supplier, q.finder, q.how].join(' ').toLowerCase();
}

/** Open before closed; late and SAFETY first; newest first. */
function order(a, b) {
  const rank = q => (isOpen(q) ? 0 : 4) - (isLate(q) ? 2 : 0) - (q.safety === 'ANO' ? 1 : 0);
  return rank(a) - rank(b) || String(b.when || b.created).localeCompare(String(a.when || a.created));
}

function rowEl(q) {
  const st = STATUS[q.status] || {};
  const open = () => go('detail', q.id);
  return h('div', { class: 'row', tabindex: 0, onclick: open, onkeydown: e => { if (e.key === 'Enter') open(); } },
    h('div', { class: 'c-id' }, q.id,
      h('div', { class: 'row-tags' }, q.safety === 'ANO' ? h('span', { class: 'tag bad' }, 'SAFETY') : null,
        q.decision === 'ESKALACE' ? h('span', { class: 'tag' }, 'Eskalováno') : null)),
    h('div', { class: 'c-what' }, h('b', null, q.what), h('div', { class: 'sub' },
      [q.how, q.qty === '' ? '' : q.qty + ' ' + q.unit, q.materialNo, q.huNo].filter(Boolean).join(' · '))),
    h('div', { class: 'c-area' }, h('div', null, q.zone), h('div', { class: 'sub' }, q.location)),
    h('div', { class: 'c-st' }, badge(q), h('div', { class: 'sub' },
      isLate(q) ? h('span', { class: 'late-txt' }, 'po termínu') : (st.who ? 'čeká: ' + st.who : ''))),
    h('div', { class: 'c-prog' }, progressEl(q)),
    h('div', { class: 'c-age sub' }, fmtDT(q.when || q.created), h('div', null, ago(q.when || q.created))));
}

function myActions() {
  if (S.kiosk || !S.me.email) return null;
  const mine = S.actions.filter(a => a.canDone && a.ownerEmail === S.me.email);
  if (!mine.length) return null;
  return h('div', { class: 'card' }, h('h2', null, 'MOJE KONEČNÉ AKCE (' + mine.length + ')'),
    mine.map(a => h('div', { class: 'act' },
      h('div', { class: 'act-no' }, '⑥'),
      h('div', null, h('div', null, a.text), h('div', { class: 'sub' }, a.qrapId + ' · plán ',
        h('span', { class: actLate(a) ? 'late-txt' : '' }, fmtD(a.due)))),
      h('div', null),
      h('button', { class: 'btn small', onclick: () => go('detail', a.qrapId) }, 'Otevřít'))));
}

// ------------------------------------------------------------------ 5. NEW PROBLEM (NAHLÁSIT)
/** New QRAP as a step-by-step wizard (Zpět / Další). The last step shows everything for a check before sending. */
function newPage() {
  const pf = popisForm({ when: new Date().toISOString(), finder: S.kiosk ? '' : S.me.name, zone: S.me.area || '' }, true);
  const RF = makeForm({});
  const riskEl = h('div', { class: 'grid' }, RF.yesno('risk', 'Je riziko u zboží už na skladě nebo už expedovaného?', { req: true, wide: true,
    hint: 'Může být stejná chyba i u zboží, které je už na skladě nebo už expedované? ANO → Kvalita dostane e-mail.' }));
  // split ① into its groups (Problém | Kdy a kde | Množství + Kdo + Nepovinné | Fotky)
  const groups = [];
  Array.from(pf.one.children).forEach(el => {
    if (el.classList.contains('sub-h')) groups.push(h('div', { class: 'grid' }));
    groups[groups.length - 1].append(el);
  });
  const g = (...i) => h('div', null, i.map(x => groups[x]));
  const steps = [
    { name: 'Problém', el: section(1, 'now', g(0)) },
    { name: 'Kdy a kde', el: section(1, 'now', g(1)) },
    { name: 'Množství a kdo', el: section(1, 'now', g(2, 3, 4)) },
    { name: 'Fotky', el: section(1, 'now', g(5)), check: () => {
      const p = pf.photos.get();
      const d = pf.F.peek();
      if (!(p.WRONG && p.RIGHT) && !(d.photoExc && d.photoException)) return pf.F.mark('photoExc', 'Vyfoťte ŠPATNĚ i SPRÁVNĚ, nebo zaškrtněte výjimku s důvodem.');
      return true;
    } },
    { name: '② Upozornění', el: section(2, 'now', pf.two) },
    { name: '③ Riziko', el: section(3, 'now', h('div', null, riskEl, h('p', { class: 'sub', style: 'margin-top:12px' },
      'Ostatní okamžitá opatření ③ doplní TL / vedoucí do ' + hours3() + ' h od KDY.'))) },
    { name: 'Kontrola', el: null }
  ];
  let at = 0;
  const bar = h('div', { class: 'wiz-list' });
  const body = h('div');
  const back = h('button', { class: 'btn ghost', onclick: () => show(at - 1) }, '← Zpět');
  const next = h('button', { class: 'btn primary btn-cta', onclick: () => { if (valid(at)) show(at + 1); } }, 'Pokračovat →');
  const send = h('button', { class: 'btn primary btn-cta', onclick: async () => {
    const data = pf.read();
    if (!data) return;
    const s3 = RF.read();
    if (!s3) return;
    data.s3 = s3;
    const res = await save(send, 'apiCreate', [data]);
    if (!res) return;
    S.flash = { id: res.qrap.id, text: 'QRAP ' + res.qrap.id + ' odeslán. Vedoucí zóny dostal e-mail.' };
    S.filter = 'open';
    go('board', null, true);
  } }, 'Odeslat ✓');
  const titleEl = h('h2', { class: 'shell-sub' });
  titleEl.tabIndex = -1;
  function valid(i) {
    const st = steps[i];
    if (i === 5) return !!RF.read();
    if (!pf.F.read()) return false;
    const d = pf.F.peek();
    if (i === 1 && new Date(d.when).getTime() > Date.now() + 5 * 60000) return !!pf.F.mark('when', 'KDY nemůže být v budoucnosti.');
    if (i === 2) {
      if (Number(d.qty) === 0 && !d.nokSituation) return !!pf.F.mark('qty', 'Zadejte KOLIK větší než 0, nebo zaškrtněte „NOK situace bez kusů“.');
      if (Number(d.qty) > 0 && !d.unit) return !!pf.F.mark('unit', 'Vyberte jednotku.');
    }
    return st.check ? !!st.check() : true;
  }
  function show(i) {
    for (let k = 0; k < i; k++) if (k >= at && !valid(k)) { i = k; break; }
    at = Math.max(0, Math.min(i, steps.length - 1));
    const last = at === steps.length - 1;
    fill(bar, steps.map((st, k) => h('button', { class: 'wiz-step' + (k < at ? ' done' : k === at ? ' on' : ''), type: 'button',
      onclick: () => show(k) }, h('span', { class: 'wiz-n' }, k + 1), h('span', null, st.name),
      k < at ? h('small', null, 'hotovo') : null)));
    titleEl.textContent = last ? 'Kontrola a odeslání' : steps[at].name;
    fill(body, last ? [h('p', { class: 'sub' }, 'Zkontrolujte údaje. Cokoli můžete ještě opravit přímo zde.')].concat(steps.slice(0, -1).map(st => st.el)) : steps[at].el);
    back.hidden = at === 0;
    next.hidden = last;
    send.hidden = !last;
    window.scrollTo(0, 0);
    const f = body.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select');
    if (f && !last) f.focus({ preventScroll: true });
  }
  const page = h('div', { class: 'shell' },
    h('div', { class: 'shell-head' }, h('h1', null, 'Nový QRAP'),
      h('p', { class: 'sub' }, 'Vyplňuje operátor, který problém našel. Povinné údaje jsou označené *.')),
    h('div', { class: 'shell-grid' },
      h('nav', { class: 'wiz-steps', 'aria-label': 'Kroky' }, bar),
      h('div', { class: 'shell-body' }, titleEl, body,
        h('div', { class: 'shell-foot' }, back, h('div', { class: 'grow' }),
          h('button', { class: 'btn btn-muted', onclick: () => go('board') }, 'Zrušit'), next, send))));
  show(0);
  return page;
}

// ------------------------------------------------------------------ 6. PROBLEM DETAIL ①–⑦
/** One numbered block of the QRAP form. state: done | now | wait | skip */
function section(n, state, body, button) {
  return h('section', { class: 'card sec ' + state, id: 'sec' + n },
    h('div', { class: 'sec-head' }, h('span', { class: 'num' }, n),
      h('h2', null, SECTION_TITLES[n] + (n === 3 ? ' <' + hours3() + 'h' : '')), h('div', { class: 'grow' }), button || null),
    h('div', { class: 'sec-body' }, body));
}
const editBtn = (key, label) => h('button', { class: 'btn small ghost no-print', onclick: () => edit(key) }, label || 'Upravit');
const startBtn = (key, label) => h('button', { class: 'btn small primary no-print', onclick: () => edit(key) }, label);
const note = text => h('p', { class: 'muted' }, text);
function formButtons(label, onSave) {
  const b = h('button', { class: 'btn primary', onclick: () => onSave(b) }, label);
  return h('div', { class: 'form-btns' }, b, h('button', { class: 'btn ghost', onclick: () => edit(null) }, 'Zrušit'));
}
const saveSection = (q, part, read, n) => b => { const d = read(); if (d) submit(b, 'apiSave', [q.id, part, d], n); };

function detailPage() {
  const q = byId(S.id);
  if (!q) return h('div', { class: 'narrow card' }, 'Načítám ' + (S.id || '') + '…');
  const pf = S.edit === 'popis' ? popisForm(q, false) : null;
  return h('div', { class: 'narrow' },
    h('button', { class: 'link no-print', onclick: () => go('board') }, '← Tabule'),
    h('div', { class: 'd-head' },
      h('div', null, h('h1', null, q.id, ' ', badge(q), q.safety === 'ANO' ? [' ', h('span', { class: 'tag bad' }, 'SAFETY')] : null,
        q.decision === 'ESKALACE' ? [' ', h('span', { class: 'tag' }, 'Eskalováno')] : null),
        h('div', { class: 'sub' }, [q.zone, q.location, 'KDY ' + fmtDT(q.when)].filter(Boolean).join(' · '))),
      h('button', { class: 'btn no-print', onclick: () => window.print() }, 'Tisk / PDF')),
    steps(q), nextBox(q),
    h('div', { class: 'band' }, 'QR vyplňuje OPERÁTOR, který nalezl problém'), sec1(q, pf), sec2(q, pf), sec3(q),
    h('div', { class: 'band dark' }, 'Vyplňuje Supervizor'), sec4(q),
    h('div', { class: 'band' }, 'Vyplňují pověření pracovníci (piloti), na základě rozhodnutí Supervizora'), sec5(q), sec6(q),
    h('div', { class: 'band dark' }, 'Supervizor / Manažer'), sec7(q),
    historyBox(q), adminBox(q));
}

function steps(q) {
  if (q.status === 'ZRUŠENO') return null;
  const names = ['Nahlášeno', 'Opatření', 'Rozhodnutí', '5 Proč', 'Akce', 'Ověření 5 směn', 'Uzavřeno'];
  const at = { 'OPATŘENÍ': 1, 'ROZHODNUTÍ': 2, 'ANALÝZA': 3, 'AKCE': 4, 'OVĚŘENÍ': 5, 'SCHVÁLENÍ': 6, 'UZAVŘENO': 7 }[q.status] || 0;
  return h('div', { class: 'tracker no-print' }, names.map((n, i) =>
    h('div', { class: 'trk ' + (i < at ? 'done' : i === at ? 'now' : '') }, h('span', null, n))));
}

function nextBox(q) {
  if (q.status === 'UZAVŘENO') {
    return h('div', { class: 'next ok' }, h('b', null, '✓ Uzavřeno ' + fmtDT(q.closedAt)),
      h('span', { class: 'sub' }, (q.decision === 'VYŘEŠENO' ? '· vyřešeno bez 5 Proč' : '· po ověření 5 směn') + ' · uzavřel(a) ' + q.closedBy));
  }
  if (q.status === 'ZRUŠENO') return h('div', { class: 'next grey' }, h('b', null, 'Zrušeno: '), q.cancelReason);
  const st = STATUS[q.status];
  const late = isLate(q);
  let who = st.who;
  let extra = '';
  if (q.status === 'OPATŘENÍ') extra = 'chybí: ' + q.s3Missing.join(', ') + ' · termín ' + fmtDT(deadline3(q).toISOString());
  if (q.status === 'ANALÝZA' || q.status === 'AKCE') who = 'piloti: ' + (pilotNames(q) || 'vedoucí');
  if (q.status === 'AKCE') extra = 'otevřené akce: ' + actsOf(q.id, '⑥').filter(a => !a.done).length;
  if (q.status === 'OVĚŘENÍ') extra = 'efektivní na ' + q.eff.ok + ' z 5 směn';
  return h('div', { class: 'next' + (late ? ' bad' : '') },
    h('span', null, 'Další krok:'), h('b', null, st.next), h('span', { class: 'sub' }, '· dělá: ' + who),
    extra ? h('span', { class: late ? 'late-txt' : 'sub' }, '· ' + extra + (late ? ' – po termínu!' : '')) : null);
}

function sec1(q, pf) {
  if (pf) return h('div', { class: 'editing' }, section(1, 'now', pf.one));
  return section(1, 'done', h('div', null,
    h('p', { class: 'big-text' }, q.what),
    kv([['SAFETY', ynText(q.safety)], ['JAK byl objeven?', isOther(q.how) ? 'jiné: ' + q.howOther : q.how], ['KDY?', fmtDT(q.when)],
      ['KDE?', [q.zone, q.location].filter(Boolean).join(' / ')], ['Kde vzniklo?', q.originZone || 'nevím / stejné'],
      ['KOLIK?', q.qty === '' ? '' : q.qty + ' ' + q.unit + (q.nokSituation ? ' · NOK situace bez kusů' : '')],
      ['Stejný problém v posledních 7 dnech?', q.repeat7 === 'ANO' ? 'ANO → ' + q.repeatRef : ynText(q.repeat7)],
      ['JMÉNO', q.finder], ['Číslo materiálu', q.materialNo],
      ['Číslo HU / dodacího listu', q.huNo], ['Dodavatel', q.supplier]]),
    photosView(q)), q.can.popis ? editBtn('popis', 'Upravit ① ②') : null);
}

function sec2(q, pf) {
  if (pf) {
    const SF = makeForm({});
    const signer = signerField(SF, 'Kdo upravuje? (vedoucí – u vlastního hlášení není potřeba)', true);
    return section(2, 'now', h('div', null, pf.two, signer ? h('div', { class: 'grid', style: 'margin-top:12px' }, signer) : null,
      formButtons('Uložit ① a ②', b => { const d = pf.read(); const x = SF.read(); if (d && x) submit(b, 'apiSave', [q.id, 'popis', Object.assign(d, x)], 1); })));
  }
  return section(2, 'done', h('div', null,
    h('div', { class: 'tags' }, split(q.notified).map(x => h('span', { class: 'tag' }, isOther(x) && q.notifiedOther ? 'jiné: ' + q.notifiedOther : x)))));
}

function sec3(q) {
  const ia = actsOf(q.id, '③');
  if (S.edit === 'opatreni') {
    const f = opatreniForm(q, ia);
    return h('div', { class: 'editing' }, section(3, 'now', h('div', null, f.el, formButtons('Uložit ③', saveSection(q, 'opatreni', f.read, 3)))));
  }
  const state = q.s3Done ? 'done' : isOpen(q) ? 'now' : 'wait';
  return section(3, state, h('div', null,
    kv([['Je riziko u zboží už na skladě nebo už expedovaného?', ynText(q.risk)],
      ['Kontrola (zkontrolováno / špatně)', q.risk !== 'ANO' ? '' : q.checkRunning ? 'kontrola probíhá'
        : (q.checked === '' ? '?' : q.checked) + ' / ' + (q.wrong === '' ? '?' : q.wrong) + ' ks'],
      ['Proces zastaven?', ynText(q.processStopped) + (q.restoredAt ? ' → obnoven ' + fmtDT(q.restoredAt) : '')]]),
    h('div', { class: 'sub-h', style: 'margin-top:14px' }, 'Okamžitá opatření'),
    ia.length ? ia.map((a, i) => h('div', { class: 'act' },
      h('div', { class: 'act-no' }, (i + 1) + '.'),
      h('div', null, h('div', null, a.text), h('div', { class: 'sub' }, a.kind + ' · ' + a.owner)),
      h('div', { class: 'act-st' }, a.done ? h('span', { class: 'badge ok' }, '✓ ' + fmtDT(a.done)) : h('span', { class: 'badge' }, 'probíhá')),
      h('div'))) : note('Zatím žádné opatření.'),
    q.s3Done ? h('div', { class: 'box ok' }, '✓ Okamžitá opatření ③ jsou kompletní (' + fmtDT(q.s3Done) + ').')
      : h('div', { class: 'box ' + (isLate(q) ? 'bad' : '') }, 'Opatření ③ ještě nejsou kompletní – chybí: ' + q.s3Missing.join(', ') +
        '. Termín: ' + fmtDT(deadline3(q).toISOString()) + '.')),
  q.can.opatreni ? (q.s3Done ? editBtn('opatreni') : startBtn('opatreni', 'Doplnit ③')) : null);
}

function sec4(q) {
  if (S.edit === 'rozhodnuti') return h('div', { class: 'editing' }, section(4, 'now', decisionForm(q)));
  const shiftsAll = S.lists.shifts || [];
  const informed = split(q.shifts);
  let shiftsEl;
  if (q.can.shifts) {
    const F = makeForm({ shifts: q.shifts });
    const b = h('button', { class: 'btn small', onclick: () => { const d = F.read(); if (d) submit(b, 'apiSave', [q.id, 'smeny', d], 4); } }, 'Uložit směny');
    const signer = signerField(F, 'Kdo označuje směny? (vedoucí)');
    shiftsEl = h('div', null, F.checks('shifts', 'Informace všem směnám během 5\' meetingu', shiftsAll),
      signer ? h('div', { class: 'grid', style: 'margin-top:8px' }, signer) : null, h('div', { style: 'margin-top:8px' }, b));
  } else {
    shiftsEl = kv([['Informace všem směnám během 5\' meetingu', shiftsAll.map(s => (informed.includes(s) ? '✓ ' : '✗ ') + s).join('   ')]]);
  }
  if (q.decision) {
    const d = DECISIONS.find(x => x.value === q.decision) || { label: q.decision };
    return section(4, 'done', h('div', null, shiftsEl,
      h('p', { style: 'margin-top:12px' }, h('b', null, d.label)),
      q.decisionNote ? h('p', { class: 'pre' }, 'Komentář: ' + q.decisionNote) : null,
      q.pilots ? kv([['Piloti', pilotNames(q)]]) : null,
      q.decision === 'ESKALACE' ? note('Eskalováno – manažeři dostali e-mail. Manažer vybere piloty („+ přidat pilota“ v ⑤).') : null,
      h('div', { class: 'by' }, 'Podepsal(a) ' + q.decisionBy + ' · ' + fmtDT(q.decisionAt) + ' · zamčeno'),
      q.decision === 'VYŘEŠENO' ? closureBox(q) : null));
  }
  const msg = !q.s3Done ? 'Rozhodnutí je možné, až jsou okamžitá opatření ③ kompletní.'
    : q.can.decide ? 'Rozhodněte a podepište.' : 'Čeká na rozhodnutí vedoucího.';
  return section(4, q.status === 'ROZHODNUTÍ' ? 'now' : 'wait', h('div', null, shiftsEl, h('p', { class: 'muted', style: 'margin-top:12px' }, msg)),
    q.can.decide ? startBtn('rozhodnuti', 'Rozhodnout') : null);
}

const needsAnalysis = q => q.decision === 'POKRAČOVAT' || q.decision === 'ESKALACE';

function sec5(q) {
  if (q.decision === 'VYŘEŠENO') return section(5, 'skip', note('Není potřeba (rozhodnutí bez 5 Proč).'));
  if (!needsAnalysis(q)) return section(5, 'wait', note('Vyplňují piloti po rozhodnutí ④ „Pokračovat s analýzou a 5 Proč“.'));
  if (S.edit === 'pricina') return h('div', { class: 'editing' }, section(5, 'now', pricinaForm(q)));
  if (S.edit === 'piloti') {
    const F = makeForm({});
    const have = split(q.pilots);
    return h('div', { class: 'editing' }, section(5, 'now', h('div', null,
      F.checks('pilots', 'Přidat piloty', S.people.filter(p => !have.includes(p.email)).map(p => p.name), { req: true }),
      h('div', { class: 'grid', style: 'margin-top:10px' }, signerField(F, 'Kdo přidává? (vedoucí / manažer)')),
      formButtons('Přidat', saveSection(q, 'piloti', F.read, 5)))));
  }
  const filled = c => [1, 2, 3, 4, 5].filter(i => q[c + i]);
  const chain = (c, title) => (filled(c).length ? h('div', { style: 'margin-bottom:12px' }, h('div', { class: 'sub-h' }, title),
    h('ol', { class: 'whys' }, filled(c).map(i => h('li', { class: Number(q['root' + c.toUpperCase()]) === i ? 'root-step' : '' },
      h('b', null, c.toUpperCase() + i), q[c + i], Number(q['root' + c.toUpperCase()]) === i ? h('span', { class: 'badge warn', style: 'margin-left:8px' }, 'kořenová příčina') : null)))) : null);
  const empty = !filled('o').length;
  const pilots = h('div', { class: 'sub', style: 'margin-bottom:10px' }, 'Piloti: ' + (pilotNames(q) || '–'),
    q.can.pilots ? [' ', h('button', { class: 'link no-print', onclick: () => edit('piloti') }, '+ přidat pilota')] : null);
  return section(5, empty ? (isOpen(q) ? 'now' : 'wait') : 'done', h('div', null, pilots,
    empty ? note('Zatím nevyplněno.') : [chain('o', 'Proč to vzniklo?'), chain('n', 'Proč to nebylo zachyceno?'),
      kv([['Co jsme se naučili z QR?', q.learned || '–'],
        ['Příležitost k aktualizaci STANDARDU?', q.std === 'ANO' ? 'ANO → ' + q.stdRef : ynText(q.std) || '–']])]),
  q.can.analyze ? (empty ? startBtn('pricina', 'Vyplnit 5 Proč') : editBtn('pricina')) : null);
}

function sec6(q) {
  if (q.decision === 'VYŘEŠENO') return section(6, 'skip', note('Není potřeba (rozhodnutí bez 5 Proč).'));
  if (!needsAnalysis(q)) return section(6, 'wait', note('Konečné akce zadávají piloti po analýze 5 Proč.'));
  const acts = actsOf(q.id, '⑥');
  const state = q.status === 'UZAVŘENO' ? 'done' : ['AKCE', 'OVĚŘENÍ'].includes(q.status) || q.status === 'ANALÝZA' ? 'now' : 'wait';
  const canAdd = q.can.analyze && S.edit !== 'akce:new';
  const addBtn = canAdd ? h('button', { class: 'btn small primary no-print', onclick: () => edit('akce:new') }, '+ Přidat konečnou akci') : null;
  const hasWhy = !![1, 2, 3, 4, 5].some(i => q['o' + i] || q['n' + i]);
  return section(6, state, h('div', null,
    acts.length ? h('div', null, acts.map(a => (S.edit === 'akce:' + a.no ? actionForm(q, a) : actionRow(q, a))))
      : note(q.can.analyze && !hasWhy ? 'Nejdříve vyplňte a uložte 5 Proč – každá akce odstraňuje jeden krok.' : 'Zatím žádné konečné akce.'),
    S.edit === 'akce:new' ? actionForm(q, null) : null,
    effectBox(q), closureBox(q)), hasWhy ? addBtn : null);
}

function actionRow(q, a) {
  const late = actLate(a);
  const step = a.kind === 'STD' ? 'aktualizace standardu' : 'odstraňuje ' + a.kind;
  return h('div', { class: 'act' + (a.done ? ' done' : '') },
    h('div', { class: 'act-no' }, a.kind === 'STD' ? 'STD' : a.kind),
    h('div', null, h('div', { class: 'act-text' }, a.text),
      h('div', { class: 'sub' }, a.owner, ' · ', step, ' · plán ', h('span', { class: late ? 'late-txt' : '' }, fmtD(a.due)),
        a.dueFirst && a.dueFirst !== a.due ? ' (původní plán ' + fmtD(a.dueFirst) + ')' : '', a.note ? ' · ' + a.note : '',
        /^https?:\/\//i.test(a.evidence) ? [' · ', h('a', { href: a.evidence, target: '_blank', rel: 'noopener' }, 'důkaz')] : '')),
    h('div', { class: 'act-st' }, a.done ? h('span', { class: 'badge ok' }, '✓ ' + fmtD(a.done))
      : h('span', { class: 'badge ' + (late ? 'bad' : '') }, late ? 'Po termínu' : 'Otevřená')),
    h('div', { class: 'act-btns no-print' },
      a.canDone ? h('button', { class: 'btn small', onclick: e => (onKiosk() ? edit('akce:' + a.no)
        : submit(e.currentTarget, 'apiSaveAction', [q.id, { no: a.no, done: true }], 6)) }, '✓ Hotovo') : null,
      a.canEdit || a.canDone ? h('button', { class: 'btn small ghost', onclick: () => edit('akce:' + a.no) }, 'Upravit') : null));
}

/** ⑥ Efektivita – 5 směn (only when all actions are done, or to show earlier rounds). */
function effectBox(q) {
  const rows = S.effects.filter(e => e.qrapId === q.id);
  if (!rows.length && q.status !== 'OVĚŘENÍ') return null;
  const round = q.eff.round;
  const slot = n => rows.filter(e => e.round === round && e.slot === n).pop() || null;
  const resultBadge = r => h('span', { class: 'badge ' + (r === 'EFEKTIVNÍ' ? 'ok' : r === 'NEEFEKTIVNÍ' ? 'bad' : '') }, r);
  const tr = n => {
    const cur = slot(n);

/**
 * A tiny form builder: every field remembers how to read its value and whether it is required.
 * Fields inside a hidden block are skipped (not required, value '').
 */
function makeForm(values) {
  const items = {};
  const val = key => (values[key] === null || values[key] === undefined ? '' : values[key]);
  const hiddenNow = i => !i.box.isConnected || !!i.box.closest('[hidden]'); // not on screen = not checked now
  const wrap = (key, label, control, o) => {
    const el = h(o.group ? 'div' : 'label', { class: 'fld' + (o.wide ? ' wide' : '') },
      label ? h('span', { class: 'fld-l' }, label, o.req ? h('span', { class: 'req' }, ' *') : null) : null,
      control, o.hint ? h('small', null, o.hint) : null);
    items[key].box = el;
    const ok = () => el.classList.remove('invalid');
    el.addEventListener('input', ok);
    el.addEventListener('change', ok);
    return el;
  };
  const F = {
    input(key, label, o = {}) {
      const dt = o.type === 'datetime-local';
      const el = o.rows ? h('textarea', { rows: o.rows, placeholder: o.ph, maxlength: 2000 })
        : h('input', { type: o.type || 'text', placeholder: o.ph, min: o.min, max: o.max, list: o.list,
          inputmode: o.type === 'number' ? 'numeric' : null, maxlength: o.type ? null : 200 });
      el.value = dt && val(key) ? localInput(val(key)) : val(key);
      if (o.onchange) el.addEventListener('input', () => o.onchange(el.value));
      items[key] = { label, req: o.req, focus: () => el.focus(),
        get: () => (dt ? (el.value ? new Date(el.value).toISOString() : '') : el.value.trim()) };
      const control = o.now ? h('div', { class: 'with-btn' }, el, h('button', { class: 'btn small', type: 'button',
        onclick: () => { el.value = localInput(); el.dispatchEvent(new Event('input', { bubbles: true })); } }, 'Teď')) : el;
      return wrap(key, label, control, o);
    },
    select(key, label, options, o = {}) {
      const opts = options.map(x => (typeof x === 'string' ? { value: x, label: x } : x));
      if (val(key) && !opts.some(x => x.value === val(key))) opts.push({ value: val(key), label: val(key) });
      const el = h('select', null, h('option', { value: '' }, o.ph || '— vyberte —'), opts.map(x => h('option', { value: x.value }, x.label)));
      el.value = val(key);
      if (o.onchange) el.addEventListener('change', () => o.onchange(el.value));
      items[key] = { label, req: o.req, get: () => el.value, focus: () => el.focus() };
      return wrap(key, label, el, o);
    },
    checks(key, label, options, o = {}) {
      const cur = split(val(key));
      const boxes = options.concat(cur.filter(x => !options.includes(x))).map(x => {
        const cb = h('input', { type: 'checkbox', checked: cur.includes(x) });
        const lb = h('label', { class: 'check' + (cb.checked ? ' on' : '') }, cb, x);
        cb.addEventListener('change', () => { lb.classList.toggle('on', cb.checked); if (o.onchange) o.onchange(read()); });
        return { cb, x, lb };
      });
      const read = () => boxes.filter(b => b.cb.checked).map(b => b.x);
      items[key] = { label, req: o.req, get: () => read().join(', '), focus: () => boxes[0] && boxes[0].cb.focus(),
        set: list => boxes.forEach(b => { b.cb.checked = list.includes(b.x); b.lb.classList.toggle('on', b.cb.checked); }) };
      return wrap(key, label, h('div', { class: 'checks' }, boxes.map(b => b.lb)), Object.assign({ group: true }, o));
    },
    radio(key, label, options, o = {}) {
      const name = 'r' + Math.random().toString(36).slice(2);
      const rows = options.map(x => {
        const r = h('input', { type: 'radio', name, value: x.value, checked: val(key) === x.value, disabled: x.disabled });
        return { r, el: h('label', { class: 'choice' + (r.checked ? ' on' : '') }, r,
          h('span', null, h('b', null, x.label), x.sub ? h('small', null, x.sub) : null)) };
      });
      rows.forEach(x => x.r.addEventListener('change', () => {
        rows.forEach(y => y.el.classList.toggle('on', y.r.checked));
        if (o.onchange) o.onchange(x.r.value);
      }));
      items[key] = { label, req: o.req, get: () => { const c = rows.find(x => x.r.checked); return c ? c.r.value : ''; }, focus: () => rows[0].r.focus() };
      return wrap(key, label, h('div', { class: 'choices' + (o.inline ? ' inline' : '') }, rows.map(x => x.el)), Object.assign({ group: true }, o));
    },
    yesno(key, label, o = {}) { return F.radio(key, label, YES_NO, Object.assign({ inline: true }, o)); },
    toggle(key, label, o = {}) {
      const cb = h('input', { type: 'checkbox', checked: !!val(key) });
      if (o.onchange) cb.addEventListener('change', () => o.onchange(cb.checked));
      items[key] = { label, get: () => (cb.checked ? 'ANO' : ''), focus: () => cb.focus() };
      const el = h('label', { class: 'check-line' + (o.wide ? ' wide' : '') }, cb, label);
      items[key].box = el;
      return el;
    },
    /** Marks one field red with a message (for rules that involve two fields). */
    mark(key, msg) {
      items[key].box.classList.add('invalid');
      items[key].focus();
      toast(msg, true);
      return null;
    },
    /** All values without checking (hidden fields give ''). */
    peek() {
      const out = {};
      Object.keys(items).forEach(k => { out[k] = items[k].box.closest('[hidden]') ? '' : items[k].get(); });
      return out;
    },
    /** Returns all values, or null (and marks the missing fields red) when something required is empty. */
    read() {
      Object.values(items).forEach(i => i.box.classList.remove('invalid'));
      const missing = Object.values(items).filter(i => i.req && !hiddenNow(i) && !i.get());
      if (missing.length) {
        missing.forEach(i => i.box.classList.add('invalid'));
        missing[0].focus();
        toast('Vyplňte prosím: ' + missing.map(i => i.label.replace(/[?:]$/, '')).join(', '), true);
        return null;
      }
      return F.peek();
    },
    item: key => items[key]
  };
  return F;
}

function opatreniForm(v, ia) {

    F.input('wrong', 'Nalezeno špatně (ks)', { type: 'number', min: 0 }),
    F.toggle('checkRunning', 'kontrola probíhá', { wide: true })), v.risk === 'ANO');
  const restored = showIf(h('div', null, F.input('restoredAt', 'Proces obnoven v', { type: 'datetime-local', now: true,
    hint: 'Kdy proces znovu běží' })), v.processStopped === 'ANO');
  const rows = iaList(ia);
  const el = h('div', null,
    h('div', { class: 'grid' },
      h('div', { class: 'sub-h wide' }, 'Riziko u zboží'),
      F.yesno('risk', 'Je riziko u zboží už na skladě nebo už expedovaného?', { req: true, wide: true,

        F.select('kind', 'Typ', S.lists.iaTypes || [], { req: true }),
        F.input('owner', 'Kdo', { req: true, list: 'people-list' }),
        F.input('text', 'Co bylo uděláno', { req: true, wide: true, ph: 'Co přesně bylo uděláno' }),
        F.input('done', 'Hotovo v', { type: 'datetime-local', now: true, hint: 'Prázdné = ještě probíhá.' })));
    items.push(item);
    box.append(item.el);
  };
  existing.forEach(add);
  if (!existing.length) add({ owner: S.kiosk ? '' : S.me.name });
  const addBtn = h('button', { class: 'btn small ghost', type: 'button', onclick: () => add({ owner: S.kiosk ? '' : S.me.name }) }, '+ Přidat opatření');
  return {
    el: h('div', null, box, addBtn),
    read() {
      const out = [];
      for (const it of items) {
        if (it.removed) { if (it.no) out.push({ no: it.no, remove: true }); continue; }
        const p = it.F.peek();
        if (!it.no && !p.kind && !p.text) continue; // untouched new row
        const d = it.F.read();
        if (!d) return null;
        out.push(Object.assign({ no: it.no || '' }, d));
      }
      return out;
    }
  };
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => reject(new Error('Soubor není obrázek.'));
    img.src = URL.createObjectURL(file);
  });
}

function zoom(url) {
  const lb = h('div', { class: 'lightbox', onclick: () => lb.remove() }, h('img', { src: url, alt: 'Fotka' }));
  document.body.append(lb);
}

const DAY = 864e5;
function svg(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (v !== null && v !== undefined) el.setAttribute(k, v); });
  kids.flat(Infinity).forEach(k => { if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : String(k)); });
  return el;
}
function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const shortD = d => d.getDate() + '. ' + (d.getMonth() + 1) + '.';

/** Bars with a 4px rounded top, anchored to the baseline. */
function barPath(x, y, w, hgt) {
  const r = Math.min(4, w / 2, hgt);
  if (hgt <= 0) return '';
  return 'M' + x + ',' + (y + hgt) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) +
    'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + hgt) + 'Z';
}

/** New vs. closed QRAPs per week (last 8 weeks): grouped bars, legend, hover tooltip, table view. */
function weekChart() {
  const start = mondayOf(Date.now() - 7 * 7 * DAY);
  const weeks = Array.from({ length: 8 }, (_, i) => {
    const from = new Date(start.getTime() + i * 7 * DAY);
    const to = new Date(from.getTime() + 7 * DAY);
    const inW = iso => iso && new Date(iso) >= from && new Date(iso) < to;
    return { label: shortD(from), range: shortD(from) + ' – ' + shortD(new Date(to.getTime() - DAY)),
      created: S.qraps.filter(q => inW(q.created)).length, closed: S.qraps.filter(q => q.status === 'UZAVŘENO' && inW(q.closedAt)).length };
  });
  const W = 1080, H = 240, L = 34, R = 8, T = 12, B = 28;
  const max = Math.max(4, ...weeks.map(w => Math.max(w.created, w.closed)));
  const top = Math.ceil(max / 4) * 4;
  const y = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - R) / weeks.length;
  const bw = Math.min(22, (gw - 18) / 2);
  const tip = h('div', { class: 'viz-tip', hidden: true });
  const chart = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'viz', role: 'img', 'aria-label': 'Nové a uzavřené QRAP po týdnech' },
    [0, 1, 2, 3, 4].map(i => {
      const v = top * i / 4;
      return [svg('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), class: 'viz-grid' }),
        svg('text', { x: L - 6, y: y(v) + 4, class: 'viz-axis', 'text-anchor': 'end' }, String(v))];
    }),
    weeks.map((w, i) => {
      const gx = L + i * gw;
      const x1 = gx + (gw - (bw * 2 + 2)) / 2;
      const g = svg('g', { class: 'viz-group' },
        svg('rect', { x: gx, y: T, width: gw, height: H - T - B, class: 'viz-hit' }),
        svg('path', { d: barPath(x1, y(w.created), bw, y(0) - y(w.created)), class: 'viz-s1' }),
        svg('path', { d: barPath(x1 + bw + 2, y(w.closed), bw, y(0) - y(w.closed)), class: 'viz-s2' }),
        svg('text', { x: gx + gw / 2, y: H - 9, class: 'viz-axis', 'text-anchor': 'middle' }, w.label));
      g.addEventListener('mouseenter', e => {
        fill(tip, h('b', null, 'Týden ' + w.range), h('div', null, h('i', { class: 'dot s1' }), 'Nové: ' + w.created),
          h('div', null, h('i', { class: 'dot s2' }), 'Uzavřené: ' + w.closed));
        tip.hidden = false;
        tip.style.left = Math.min(78, (i + 0.5) / weeks.length * 100) + '%';
      });
      g.addEventListener('mouseleave', () => { tip.hidden = true; });
      return g;
    }),
    svg('line', { x1: L, x2: W - R, y1: y(0), y2: y(0), class: 'viz-base' }));
  const table = h('table', { class: 'roles', hidden: true },
    h('tr', null, h('th', null, 'Týden'), h('th', null, 'Nové'), h('th', null, 'Uzavřené')),
    weeks.map(w => h('tr', null, h('td', null, w.range), h('td', null, w.created), h('td', null, w.closed))));
  const toggle = h('button', { class: 'link', onclick: () => { table.hidden = !table.hidden; box.hidden = !table.hidden; toggle.textContent = table.hidden ? 'Zobrazit tabulku' : 'Zobrazit graf'; } }, 'Zobrazit tabulku');
  const box = h('div', { class: 'viz-box' }, chart, tip);
  return h('div', { class: 'card' },
    h('div', { class: 'sec-head' }, h('h2', null, 'NOVÉ A UZAVŘENÉ QRAP – POSLEDNÍCH 8 TÝDNŮ'), h('div', { class: 'grow' }), toggle),
    h('div', { class: 'legend' }, h('span', null, h('i', { class: 'dot s1' }), 'Nové'), h('span', null, h('i', { class: 'dot s2' }), 'Uzavřené')),
    box, table);
}

/** Horizontal bars for one series (one colour), value written next to each bar. */

}
