<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root { --ink: #151B1F; --ink-3: #6b757e; --line: #cbd3cf; --page: #ecf2e8; --accent: #66B539; --accent-ink: #3f7d1f; --accent-soft: #E8F7DD; --bad: #b8322a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.45 "Segoe UI", -apple-system, Roboto, Arial, sans-serif; }
main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 22px; margin: 0 0 6px; }
p { margin: 0 0 14px; color: var(--ink-3); }
.pic { display: block; width: 100%; margin: 0 0 14px; padding: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pic.done { border-color: var(--accent); background: var(--accent-soft); }
.pic button { display: block; width: 100%; min-height: 68px; padding: 14px 16px; border: 0; background: none; font: inherit; font-weight: 650; color: var(--ink); text-align: left; }
.pic img { display: block; width: 100%; max-height: 240px; object-fit: cover; }
.pic .state { display: block; font-weight: 400; font-size: 14px; color: var(--ink-3); }
.pic.done .state { color: var(--accent-ink); }
#msg { color: var(--bad); font-weight: 600; min-height: 1.4em; }
.error { background: #fff; border: 1px solid var(--bad); border-radius: 12px; padding: 16px; color: var(--bad); font-weight: 600; }
@media (prefers-color-scheme: dark) {
  :root { --ink: #e6ecee; --ink-3: #9aa6ad; --line: #3a464d; --page: #151B1F; --accent-soft: #22361a; --accent-ink: #8fd16a; }
  .pic { background: #1d252a; }
  .error { background: #1d252a; }
}
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="boot"><?!= boot ?></script>
<script>
'use strict';
const BOOT = (() => { try { return JSON.parse(document.getElementById('boot').textContent) || {}; } catch (e) { return { error: 'Stránku se nepodařilo načíst.' }; } })();
const app = document.getElementById('app');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  kids.flat().forEach(k => { if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : String(k)); });
  return el;
}

/** Decodes the picture once and returns it twice as JPEG: the photo (max 1280 px) and a preview (max 480 px). Same as on the kiosk. */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    const jpeg = (max, quality) => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', quality);
    };
    img.onload = () => {
      URL.revokeObjectURL(src);
      try { resolve({ full: jpeg(1280, 0.8), thumb: jpeg(480, 0.7) }); } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('Soubor není obrázek.')); };
    img.src = src;
  });
}

const errText = e => String((e && e.message) || e || '').replace(/^(ScriptError|Exception|Error|Výjimka):\s*/, '') || 'Nastala chyba. Zkuste to znovu.';

if (BOOT.error || !BOOT.token) {
  app.append(h('div', { class: 'error', role: 'alert' }, BOOT.error || 'Odkaz není platný. Na kiosku zobrazte nový QR kód.'));
} else {
  const msg = h('p', { id: 'msg', role: 'alert' });
  app.append(h('h1', null, 'Fotky k QRAP'),
    h('p', null, 'Vyfoťte díly. Fotka se za pár vteřin objeví na kiosku. Můžete vyfotit nebo vybrat z galerie.'));
  [['WRONG', 'ŠPATNÝ díl'], ['RIGHT', 'DOBRÝ díl']].forEach(([kind, label]) => {
    // no "capture" on purpose: the phone offers both the camera and the gallery
    const input = h('input', { type: 'file', accept: 'image/*', hidden: true });
    const state = h('span', { class: 'state' }, 'klepněte a vyfoťte');
    const btn = h('button', { type: 'button', onclick: () => input.click() }, '📷 ' + label, state);
    const box = h('div', { class: 'pic' }, btn);
    input.addEventListener('change', async () => {
      const file = input.files[0];
      if (!file) return;
      btn.disabled = true;
      state.textContent = 'nahrávám…';
      msg.textContent = '';
      try {
        const p = await shrink(file);
        await new Promise((ok, bad) => google.script.run.withSuccessHandler(ok).withFailureHandler(bad)
          .apiPhoneUpload(BOOT.token, kind, p.full, p.thumb));
        box.classList.add('done');
        box.querySelector('img') && box.querySelector('img').remove();
        box.append(h('img', { src: p.thumb, alt: label }));
        state.textContent = '✓ nahráno – klepnutím vyfotíte znovu';
      } catch (e) {
        msg.textContent = errText(e);
        state.textContent = 'nepodařilo se – zkuste to znovu';
      }
      btn.disabled = false;
      input.value = '';
    });
    app.append(box, input);
  });
  app.append(msg, h('p', null, 'Hotovo? Vraťte se ke kiosku a pokračujte ve formuláři.'));
}
</script>
</body>
</html>
