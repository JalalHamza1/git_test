/** file ID → Promise of the image: each photo is downloaded once, also when two places ask for it at the same time. */
const PHOTOS = new Map();
function loadPhoto(qid, fileId) {
  if (!PHOTOS.has(fileId)) {
    const p = api('apiPhoto', qid, fileId);
    PHOTOS.set(fileId, p);
    p.catch(() => PHOTOS.delete(fileId)); // a failed download may be tried again
  }
  return PHOTOS.get(fileId);
}

/**
 * One photo on the paper (QRAP page): the small preview loads first, a tap opens the full photo.
 * A photo cell holds "fullId|previewId" (older QRAPs: only fullId). While ① can be changed, "Vyfotit" opens
 * the camera on a tablet / phone (capture), or the file picker on a PC.
 */
function photoSlot(q, kind, key, title) {
  const ids = String(q[key] || '').split('|').filter(Boolean);
  const tile = ids.length ? h('button', { class: 'pp-ph', type: 'button', title: title, 'aria-label': title + ' – zvětšit fotku' }, 'Načítám…') : null;
  if (tile) {
    loadPhoto(q.id, ids[1] || ids[0]).then(url => fill(tile, h('img', { src: url, alt: title })))
      .catch(() => { tile.textContent = 'Fotku nelze načíst'; });
    tile.addEventListener('click', e => { e.stopPropagation(); zoom(q.id, ids[0], title); });
  }
  if (!q.can.popis) return tile;
  const input = h('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true, onchange: async e => {
    const file = e.target.files[0];
    if (!file) return;
    button.textContent = 'Nahrávám…';
    button.disabled = true;
    try {
      const p = await shrink(file);
      store(await api('apiSetPhoto', q.id, kind, p.full, p.thumb));
      toast('Fotka uložena ✓');
    } catch (err) { toast(errText(err), true); }
    input.value = '';
    if (S.edit) { button.disabled = false; button.textContent = '📷 Vyfotit znovu'; } else render(); // never throw away a block being filled in
  } });
  const button = h('button', { class: 'btn small pp-cam no-print', type: 'button', onclick: e => { e.stopPropagation(); input.click(); } },
    ids.length ? '📷 Vyfotit znovu' : '📷 Přidat foto');
  return h('div', null, tile, button, input);
}

/**
 * Optional photos in the new-QRAP form. A photo is { full, thumb } when it was taken on this device (shrunk in the
 * browser so the upload is quick), or { thumb } when it arrived from a phone (the full photo is already in Drive;
 * only the token is sent). "📱 Fotit telefonem" shows a QR code; the phone uploads, this page polls every 3 s.
 * The server side is in PhotoHandoff.gs, the page the phone opens is Upload.html.
 */
function photoPicker() {
  const KINDS = ['WRONG', 'RIGHT'];
  const NAMES = { WRONG: 'ŠPATNÝ', RIGHT: 'DOBRÝ' };
  const pics = { WRONG: null, RIGHT: null };
  const redraws = [];
  const redrawAll = () => redraws.forEach(f => f());
  const have = {};   // per kind: the value the server already gave us (so the poll sends only what is new)
  let session = null;

  const slot = (kind, title) => {
    const box = h('div', { class: 'pslot ' + (kind === 'RIGHT' ? 'right' : 'wrong') });
    const input = h('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true, onchange: async e => {
      const file = e.target.files[0];
      if (!file) return;
      try { pics[kind] = await shrink(file); } catch (err) { toast(errText(err), true); }
      input.value = '';
      draw();
    } });
    const draw = () => fill(box,
      pics[kind] ? h('button', { class: 'ph', type: 'button', 'aria-label': title + ' – vyfotit znovu', onclick: () => input.click() },
        h('img', { src: pics[kind].thumb, alt: title })) : null,
      h('div', { class: 'inline-form' },
        h('button', { class: 'btn small', type: 'button', onclick: () => input.click() }, pics[kind] ? '📷 Vyfotit znovu' : '📷 Přidat foto'),
        pics[kind] ? null : h('span', { class: 'opt' }, 'nepovinné'),
        pics[kind] ? h('button', { class: 'btn small ghost', type: 'button', onclick: () => { pics[kind] = null; draw(); } }, 'Odebrat') : null),
      input);
    redraws.push(draw);
    draw();
    return box;
  };

  async function phoneDialog() {
    if (!session) {
      try {
        session = await api('apiPhotoSession');
        KINDS.forEach(k => { delete have[k]; });
      } catch (e) { toast(errText(e), true); return; }
    }
    let alive = true;
    const status = h('p', { class: 'sub', role: 'status' }, 'Čekám na fotku…');
    const close = () => { alive = false; box.remove(); };
    let qrEl;
    try {
      if (typeof qrcode !== 'function') throw new Error('QR library not loaded');
      const qr = qrcode(0, 'M');
      qr.addData(session.url);
      qr.make();
      qrEl = h('img', { src: qr.createDataURL(5, 4), alt: 'QR kód', width: 220, height: 220, style: 'image-rendering:pixelated' });
    } catch (e) {
      qrEl = h('p', { class: 'sub', style: 'overflow-wrap:anywhere' }, 'QR kód se nepodařilo vytvořit. Otevřete na telefonu tento odkaz: ', h('br'), session.url);
    }
    const box = h('div', { class: 'lightbox', role: 'dialog', 'aria-label': 'Vyfoťte telefonem', style: 'cursor:default' },
      h('div', { class: 'card', style: 'text-align:center;max-width:340px;margin:0' },
        h('h2', null, 'Vyfoťte telefonem'),
        h('p', null, 'Naskenujte QR kód firemním telefonem a vyfoťte oba díly.'),
        qrEl, status,
        h('div', { class: 'form-btns', style: 'justify-content:center' }, h('button', { class: 'btn primary', type: 'button', onclick: close }, 'Hotovo'))));
    document.body.append(box);

    const say = () => {
      const got = KINDS.filter(k => have[k]).map(k => NAMES[k]);
      status.textContent = got.length ? 'Přijato: ' + got.join(', ') + ' ✓' : 'Čekám na fotku…';
    };
    say();
    let fails = 0;
    while (alive) {
      await new Promise(r => setTimeout(r, 3000));
      if (!alive) break;
      try {
        const r = await api('apiPhotoPoll', session.token, have);
        fails = 0;
        const got = KINDS.filter(k => r[k]);
        got.forEach(k => { have[k] = r[k].value; pics[k] = { thumb: r[k].thumb }; });
        if (got.length) { redrawAll(); say(); }
      } catch (e) {
        fails++;
        if (/neplatí/.test(String((e && e.message) || ''))) {
          // the session is gone: phone photos that were only shown here are gone with it – say so instead of sending without them
          session = null;
          KINDS.forEach(k => { delete have[k]; if (pics[k] && !pics[k].full) pics[k] = null; });
          redrawAll();
          status.textContent = errText(e);
          alive = false;
        } else if (fails >= 5) {
          status.textContent = errText(e);
          alive = false;
        }
      }
    }
  }

  return {
    slot,
    get: () => Object.assign({}, pics),
    token: () => (session ? session.token : ''),
    // kinds whose phone photo must NOT be attached: removed here, or replaced by a photo taken on this device
    drop: () => KINDS.filter(k => !(pics[k] && !pics[k].full)),
    phoneBtn: () => h('button', { class: 'btn', type: 'button', onclick: phoneDialog }, '📱 Fotit telefonem')
  };
}

/** Decodes the picture once and returns it twice as JPEG: the photo (max 1280 px) and a preview (max 480 px). */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    const jpeg = (max, quality) => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', quality);
    };
    img.onload = () => {
      URL.revokeObjectURL(src);
      try { resolve({ full: jpeg(1280, 0.8), thumb: jpeg(480, 0.7) }); } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('Soubor není obrázek.')); };
    img.src = src;
  });
}

/** The full photo over the page; a click or Esc closes it. */
function zoom(qid, fileId, title) {
  const close = () => { lb.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  const lb = h('div', { class: 'lightbox', role: 'dialog', 'aria-label': title || 'Fotka', tabindex: -1, onclick: close },
    h('span', { class: 'lb-wait' }, 'Načítám…'));
  document.body.append(lb);
  document.addEventListener('keydown', esc);
  lb.focus();
  loadPhoto(qid, fileId).then(url => { if (lb.isConnected) fill(lb, h('img', { src: url, alt: title || 'Fotka' })); })
    .catch(err => { close(); toast(errText(err), true); });
}

// ------------------------------------------------------------------ 9a. PŘEHLED (dashboard for managers)
const DAY = 864e5;
function svg(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (v !== null && v !== undefined) el.setAttribute(k, v); });
  kids.flat(Infinity).forEach(k => { if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : String(k)); });
  return el;
}
function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const shortD = d => d.getDate() + '. ' + (d.getMonth() + 1) + '.';

/** Reported QRAPs in the last 8 weeks as a tiny bar strip (one series; exact numbers in the tooltip). One pass over the list. */
function sparkline() {
  const start = mondayOf(Date.now() - 7 * 7 * DAY);
  const counts = [0, 0, 0, 0, 0, 0, 0, 0];
  S.qraps.forEach(q => {
    if (q.status === 'ZRUŠENO' || !q.created) return;
    const w = Math.floor((new Date(q.created) - start) / (7 * DAY));
    if (w >= 0 && w < 8) counts[w]++;
  });
  const weeks = counts.map((n, i) => ({ from: new Date(start.getTime() + i * 7 * DAY), n }));
  const max = Math.max(1, ...counts);
  const W = 160, H = 28, gw = W / 8, bw = gw - 4;
  return { total: counts.reduce((m, n) => m + n, 0), el: svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'spark', preserveAspectRatio: 'none',
    role: 'img', 'aria-label': 'Nahlášeno po týdnech: ' + counts.join(', ') },
    weeks.map((w, i) => {
      const hgt = Math.max(2, w.n / max * H);
      return svg('rect', { x: i * gw + 2, y: H - hgt, width: bw, height: hgt, rx: 1.5 },
        svg('title', null, 'Týden od ' + shortD(w.from) + ': ' + w.n));
    })) };
}

/** Horizontal bars for one series (one colour), value written next to each bar. */
function barList(title, pairs, onClick) {
  const max = Math.max(1, ...pairs.map(p => p[1]));
  return h('div', { class: 'card' }, h('h2', null, title),

      h('span', { class: 'hbar-l' }, label), h('span', { class: 'hbar-t' }, h('span', { class: 'hbar-f', style: 'width:' + (n / max * 100) + '%' })),
      h('b', null, n))) : note('Zatím žádná data.'));
}

    h('div', { class: 'tbl-wrap' },

        'Kdo není na seznamu, může aplikaci používat jako uživatel.'));
  }
  function listsCard() {
    return h('div', { class: 'card' }, h('h2', null, 'Seznamy ve formuláři'),
      h('p', { class: 'sub' }, 'Jedna položka na řádek. Staré QRAP si ponechají původní hodnoty.'),
      h('div', { class: 'cols3' }, S.adm.lists.map(l => {
        const ta = h('textarea', { rows: Math.max(4, l.values.length + 1), 'aria-label': l.title });
        ta.value = l.values.join('\n');
        const b = h('button', { class: 'btn small', onclick: () => call(b, 'apiSaveList', [l.key, ta.value.split('\n')]) }, 'Uložit');
        return h('div', { class: 'fld' }, h('span', { class: 'fld-l' }, l.title), ta, h('div', { style: 'margin-top:6px' }, b));
      })));
  }
  function settingsCard() {
    const inputs = {};
    const b = h('button', { class: 'btn primary', onclick: () => {
      const o = {};
      Object.keys(inputs).forEach(k => { o[k] = inputs[k].value.trim(); });
      call(b, 'apiSaveSettings', [o]);
    } }, 'Uložit nastavení');
    return h('div', { class: 'card' }, h('h2', null, 'Nastavení'),
      h('div', { class: 'grid' }, S.adm.settings.map(x => {
        const el = x.key === 'EMAILY' ? h('select', null, h('option', { value: 'ANO' }, 'ANO'), h('option', { value: 'NE' }, 'NE'))
          : h('input', { type: /^(LHUTA|ZOBRAZIT)/.test(x.key) ? 'number' : 'text', min: 1 });
        el.value = x.value === undefined ? '' : x.value;
        inputs[x.key] = el;
        return h('label', { class: 'fld' }, h('span', { class: 'fld-l' }, SETTING_LABELS[x.key] || x.key), el, h('small', null, x.help));
      })),
      h('div', { class: 'form-btns' }, b));
  }
  if (S.adm) draw();
  else api('apiAdminData').then(res => { S.adm = res; draw(); }).catch(e => { fill(box, note(errText(e))); });
  return h('div', null,
    pageHead('Správa', 'Lidé, seznamy a nastavení aplikace. Změny platí hned (ostatní uživatelé po obnovení stránky).', null, 'Správa'),
    box);
}

    ['bell', 'Upozornění', 'Zaškrtněte, koho jste o problému informovali.'],
    ['shield', 'Opatření', 'Je riziko u zboží na skladě? Co jste hned udělali, kdo a kdy.'],

  const next = [

      h('span', null, '* povinné')), h('button', { class: 'btn primary', onclick: () => go('new') }, '+ Nahlásit problém'), 'Jak to funguje'),
    h('div', { class: 'howto-steps' }, steps.map((x, i) => h('div', { class: 'howto-step' + (i === steps.length - 1 ? ' send' : '') },
      h('div', { class: 'hs-top' }, h('span', { class: 'hs-n' }, i + 1), h('b', null, x[1]), h('span', { class: 'hs-ico' }, icon(x[0]))),
      h('p', null, x[2])))),

    h('div', { class: 'flow2' }, next.map((x, i) => [i ? h('div', { class: 'arrow' }, icon('right')) : null,
      h('div', null, h('b', null, x[0]), h('span', null, x[1]))])),
    h('div', { class: 'cols2' },
      h('div', { class: 'card' }, h('h2', null, 'Podpis'),
        h('p', null, 'Každý krok se podepíše vaším účtem Google – jméno a čas se uloží do historie. Nic dalšího vyplňovat nemusíte.'),
        h('p', { class: 'sub' }, 'Každý může udělat kterýkoli krok. Podle formuláře QRAP ale ④ rozhoduje supervizor a ⑤ ⑥ vyplňují piloti.')),
      h('div', { class: 'card' },
        h('details', { class: 'roles-more' }, h('summary', null, icon('right'), 'Kdo co může'),
          h('div', { class: 'slots-wrap' }, h('table', { class: 'roles' },
            h('tr', null, h('th', null, ''), h('th', null, 'Uživatel'), h('th', null, 'Manažer'), h('th', null, 'Admin')),
            rows.map(r => h('tr', null, r.map(c => h('td', null, c)))))),
          h('p', { class: 'sub', style: 'margin-top:10px' }, 'Vaše role: ' + (roleName(S.me.role) || 'uživatel').toLowerCase() + '.')))));

// ------------------------------------------------------------------ 9c. REFRESH AND START
/**
 * Reload the data. The quiet auto-refresh sends the data version the page has: when nothing changed, the server
 * answers "unchanged" without reading the Sheet. Never two quiet refreshes at once. A button or "all" always
 * reloads and redraws the page.
 */
let refreshing = false;
async function refresh(quiet, btn, all) {
  if (quiet && refreshing) return;
  refreshing = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Načítám…'; }
  let changed = false;
  try {
    const res = await api('apiRefresh', all || S.all, quiet ? S.ver : '');
    if (res.unchanged) S.loadedAt = Date.now();
    else { loadLists(res); changed = true; }
    if (!quiet) toast('Aktualizováno ✓');
  } catch (e) {
    if (!quiet) toast(errText(e), true);
  } finally {
    refreshing = false;
  }
  if (btn || all) render(); // on any page – also "Načíst všechna data" on Přehled manažera
  else if (changed && S.view === 'board' && redrawBoard) redrawBoard();
}

/** When a problem is opened, fetch its latest version in the background – the server answers "unchanged" if nothing changed. */
function refreshOne(id) {
  const have = !!byId(id);
  const snap = () => JSON.stringify([byId(id), actsAll(id), S.effects.filter(a => a.qrapId === id), S.assess.filter(a => a.qrapId === id)]);
  api('apiGet', id, have ? S.ver : '').then(res => {
    if (!res || res.unchanged) return;
    const before = snap();
    store(res);
    if (before !== snap() && S.view === 'detail' && S.id === id && !S.edit) render();
  }).catch(e => {
    if (!byId(id)) { toast(errText(e), true); go('board'); }
  });
}

function start() {
  if (BOOT.error) {
    fill(document.getElementById('app'), h('main', null, h('div', { class: 'card' },
      h('h1', null, 'Aplikaci se nepodařilo spustit'), h('p', null, BOOT.error),
      h('p', { class: 'muted' }, 'Kontaktujte správce aplikace.'))));
    return;
  }
  loadLists(BOOT);
  fillPeopleList();
  const p = BOOT.params || {};
  S.view = p.id ? 'detail' : (['new', 'help'].includes(p.view) ? p.view : 'board');
  S.id = p.id || null;
  try {
    google.script.history.setChangeHandler(e => {
      const st = (e && e.state) || {};
      const prm = (e && e.location && e.location.parameter) || {};
      S.view = st.view || (prm.id ? 'detail' : (prm.view || 'board'));
      S.id = st.id || prm.id || null;
      S.edit = null;
      render();
    });
  } catch (e) { /* ignore */ }
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.matches && t.matches('.pp-edit input[type=date], .pp-edit input[type=time]') && t.showPicker) { try { t.showPicker(); } catch (err) { /* not allowed here */ } }
  });
  render();
  if (S.view === 'detail') refreshOne(S.id);
  setInterval(() => { if (S.view === 'board' && !document.hidden) refresh(true); }, 90000);
  document.addEventListener('visibilitychange', () => { // back on the tab after a while: catch up at once
    if (!document.hidden && S.view === 'board' && Date.now() - S.loadedAt > 60000) refresh(true);
  });
}

start();
</script>
