<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<!-- QR code for the phone photo hand-off (if it fails to load, the dialog shows the link as text instead) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* =====================================================================
   eQRAP – stylesheet. Light green-grey page, white cards with a soft shadow,
   dark slate headers on the paper form, one green for actions.
   Change colours only here (:root). One definition per selector – search
   for a class name and you find the one place that styles it.
   ===================================================================== */
:root {
  --ink: #151B1F; --ink-2: #374148; --ink-3: #6b757e;
  --line: #dfe4e1; --line-2: #cbd3cf; --page: #ecf2e8; --panel: #ffffff; --soft: #f5f7f5; --zebra: #fafbfa; --tray: #e1e6e3;
  --accent: #66B539; --accent-ink: #3f7d1f; --accent-dark: #57a02e; --accent-deep: #3a7a32; --accent-deeper: #2f6629;
  --accent-soft: #E8F7DD; --accent-tint: #e5f1dd;
  --warm: #b8501d; --warm-soft: #fce8dc;
  --bad: #b8322a; --warn: #8a5300;
  --slate: #34444c; --slate-2: #57676f; --slate-ink: #e6ecee;
  --viz: #4f9a2a; --viz-track: #e3e8e4;  /* chart: one green series, validated >= 3:1 on white */
  --r: 10px;
  --shadow: 0 1px 2px rgba(21,27,31,.05), 0 3px 10px rgba(21,27,31,.05);
  /* layout: flexible caps, side margins grow with the screen */
  --gutter: clamp(12px, 2vw, 40px); --w-wide: 84rem; --w-mid: 72rem; --w-form: 50rem; --w-paper: 120rem;
  /* one spacing scale */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 64px;
  --tap: 42px; --tap-s: 34px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 "Segoe UI", -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1 { font-size: 24px; line-height: 1.25; font-weight: 700; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 16px; font-weight: 650; margin: 0; }
h3 { font-size: 14px; font-weight: 650; margin: 0 0 12px; }
p { margin: 0 0 8px; }
a { color: var(--accent-ink); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, [role=button]:focus-visible, .strip:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.grow { flex: 1; }
.muted, .sub { color: var(--ink-3); }
.sub { font-size: 13px; }
.small { font-size: 13px; }
.late-txt { font-weight: 700; color: var(--ink); }
.wide { grid-column: 1 / -1; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.top { background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 1px 3px rgba(21,27,31,.04); position: sticky; top: 0; z-index: 10; }
.top-in { width: 100%; max-width: calc(var(--w-wide) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); height: 60px; display: flex; align-items: center; gap: 32px; }
.brand { display: flex; align-items: center; background: none; border: 0; padding: 0; font-size: 21px; font-weight: 800; letter-spacing: .04em; color: var(--ink); }
nav { display: flex; gap: 4px; height: 100%; }
.nav { background: none; border: 0; padding: 0 12px; height: 100%; color: var(--ink-2); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav:hover { color: var(--ink); }
.nav.on { color: var(--accent-ink); border-bottom-color: var(--accent); }
.top-right { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-tint); color: var(--accent-ink); display: grid; place-items: center;
  font-size: 13px; font-weight: 700; flex: none; border: 1px solid #cfe3c2; }
.who { display: flex; flex-direction: column; line-height: 1.2; font-size: 13px; font-weight: 600; }
.who small { color: var(--ink-3); font-weight: 400; font-size: 12px; }
.view-as { width: auto; height: 32px; min-height: 0; padding: 0 8px; font-size: 13px; }
main { width: 100%; max-width: calc(var(--w-wide) + 2 * var(--gutter)); margin: 0 auto; padding: var(--s5) var(--gutter) var(--s7); }
main.w-mid { max-width: calc(var(--w-mid) + 2 * var(--gutter)); }
main.w-form { max-width: calc(var(--w-form) + 2 * var(--gutter)); }
main.w-paper { max-width: calc(var(--w-paper) + 2 * var(--gutter)); }

/* ---------- page head + breadcrumb ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--ink-3); }
.crumbs button:hover { color: var(--ink); text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 600; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head .sub { margin-top: 4px; font-size: 14px; }
.head-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.intro { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px; color: var(--ink-3); margin-top: 6px; line-height: 1.4; }
.intro .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; color: var(--ink-2); background: #fff; }
.intro .chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-3); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; border-radius: 7px;
  border: 1px solid var(--line-2); background: #fff; color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--soft); border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(47,102,41,.25); }
.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn.primary.hero-btn { background: var(--accent-deep); border-color: var(--accent-deep); height: 44px; padding: 0 22px; font-size: 15px; }
.btn.primary.hero-btn:hover { background: var(--accent-deeper); border-color: var(--accent-deeper); }
.btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: none; box-shadow: none; color: var(--ink-2); padding: 0 10px; }
.btn.ghost:hover { color: var(--ink); background: var(--soft); }
.btn.small { min-height: var(--tap-s); padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn-cta { min-height: 44px; padding: 0 22px; font-size: 15px; }
.btn-muted { min-height: 44px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* ---------- panels ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
.card > h2 { margin-bottom: 14px; }
.p-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.p-head h2 { margin: 0; }

/* ---------- fields ---------- */
.fld { display: block; }
.fld-l { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.req { color: var(--bad); font-weight: 400; }
.opt { font-weight: 400; color: var(--ink-3); font-size: .85em; margin-left: 6px; }
.fld small { display: block; font-size: 13px; color: var(--ink-3); margin-top: 6px; }
.info { display: inline-grid; place-items: center; width: 26px; height: 26px; margin: -6px 0 -6px 4px; border-radius: 50%; color: var(--ink-3); cursor: pointer; vertical-align: middle; }
.info:hover, .info.on { color: var(--accent-ink); background: var(--accent-soft); }
.info .ico { width: 15px; height: 15px; }
::placeholder { color: #9aa3ab; }
input, select, textarea { width: 100%; height: var(--tap); padding: 0 12px; border: 1px solid var(--line-2); border-radius: 7px; background: #fff;
  font: inherit; color: var(--ink); }
textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
input[type=checkbox], input[type=radio] { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: var(--accent-ink); flex: none; }
input[type=file] { height: auto; border: 0; padding: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox]:focus, input[type=radio]:focus { box-shadow: none; }
input[type=checkbox]:focus-visible, input[type=radio]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fld.invalid input, .fld.invalid select, .fld.invalid textarea { border-color: var(--bad); box-shadow: 0 0 0 3px #f8e3e1; }
.fld.invalid .fld-l { color: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 28px; align-items: start; }
.grid + .grid { margin-top: 22px; }
.sub-h { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em;
  padding-top: 16px; border-top: 1px solid var(--line); margin-top: 4px; }
.grid > .sub-h:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check, .check-line { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; font-weight: 400; }
.checks .check { border: 1px solid var(--line-2); border-radius: 7px; padding: 7px 13px; background: #fff; }
.checks .check.on, .checks .check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; border: 1px solid var(--line-2); border-radius: 7px; padding: 10px 14px; background: #fff; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-top: 2px; }
.choice b { font-weight: 400; }
.choice:has(input:checked) b { font-weight: 600; }
.choice small { display: block; color: var(--ink-3); font-size: 13px; }
.choices.inline { flex-direction: row; gap: 8px; flex-wrap: wrap; }
.choices.inline .choice { padding: 7px 16px; align-items: center; }
.choices.inline .choice input { margin: 0; }
.with-btn { display: flex; gap: 8px; }
.with-btn input { flex: 1; min-width: 0; }
.form-btns { display: flex; gap: 10px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.note { font-size: 14px; color: var(--ink-2); padding: 10px 0; }
.note.warn { color: var(--warn); }
.qty-pair { display: flex; gap: 8px; }
.qty-pair > input { flex: 1 1 55%; min-width: 0; }
.qty-pair > .fld, .form-rows .qty-pair > .fld { flex: 1 1 45%; display: block; padding: 0; border: 0; min-width: 0; }
.pair-f { display: flex; flex-direction: column; gap: 10px; }

/* ---------- forms: question on the left (bold), answer on the right; related questions in a rounded box ---------- */
.form-rows .grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
.form-rows .grid + .grid { margin-top: 18px; }
.form-rows .fld { display: grid; grid-template-columns: minmax(170px, 32%) minmax(0, 1fr); column-gap: 24px; row-gap: 4px;
  align-items: center; padding: 8px 12px; }
.form-rows .fld-l { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.35; }
.form-rows .fld > :not(.fld-l) { grid-column: 2; }
.form-rows .fld small { margin-top: 2px; }
.form-rows .q-group { border: 1px solid var(--line); border-radius: 9px; background: #fff; }
.form-rows .q-group > .fld + .fld { border-top: 1px solid var(--line); }
.form-rows .sub-h { font-size: 12.5px; color: var(--accent-ink); border: 0; padding: 14px 12px 2px; margin: 0; }
.form-rows .grid > .sub-h:first-child { padding-top: 0; }
.form-rows .pair-f { gap: 0; }
.form-rows .pair-f .pslot, .form-rows .note.wide { margin-left: calc(max(170px, 32%) + 36px); }
.form-rows .pair-f .pslot { padding-bottom: 12px; }
.form-rows .pslot .ph { max-width: 340px; height: 200px; }
.form-rows .ia-row { margin-top: 10px; }
.form-rows .why-row { margin: 0; align-items: center; }
.form-rows .why-root { padding-bottom: 0; }
.form-rows .checks, .form-rows .choices.inline { padding-top: 2px; }

/* ---------- new QRAP: arrow steps on top, then one card ---------- */
.wiz-steps { display: block; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
.wiz-list { display: flex; background: var(--line-2); } /* the 2 px gaps between the arrows show this colour */
.wiz-step { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 50px; margin-left: -12px; padding: 0 14px 0 26px;
  background: #fff; border: 0; color: var(--ink-2); font-size: 13.5px; font-weight: 550; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%); }
.wiz-step:first-child { margin-left: 0; padding-left: 12px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); }
.wiz-step:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 14px 50%); }
.wiz-step .ico { width: 17px; height: 17px; color: var(--ink-3); }
.wiz-step:hover { background: var(--soft); }
.wiz-step.done { color: var(--ink); }
.wiz-step.done .ico { color: var(--accent-ink); }
.wiz-step.on { background: #e3e8e5; color: var(--ink); font-weight: 650; }
.wiz-step.on .ico { color: var(--ink); }
.shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.shell-body { padding: 12px 16px 6px; }
.shell-inner { max-width: 1100px; }
.shell-sub { background: #e4e8e5; border-bottom: 1px solid var(--line-2); padding: 14px 18px; font-size: 17px; font-weight: 700; margin: 0; outline: none; }
.shell .step > .grid:first-child > .sub-h:first-child { display: none; }
.shell .step > .grid + .grid, .shell .step > .grid + div { margin-top: 18px; }
.review-part { padding: 18px 0; border-top: 1px solid var(--line); }
.review-part:first-of-type { border-top: 0; padding-top: 4px; }
.review-part > h3 { color: var(--accent-ink); padding: 0 12px; }
.shell-foot { display: flex; gap: 10px; align-items: center; padding: 14px 16px; margin-top: 16px; border-top: 1px solid var(--line); background: var(--soft); }

/* ---------- board: status cards, filters, table ---------- */
.flash { display: flex; gap: 14px; align-items: center; padding: 12px 16px; margin-bottom: 18px; border: 1px solid #cfe8bf; background: var(--accent-soft);
  border-radius: var(--r); color: var(--accent-ink); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 16px; text-align: left;
  display: flex; flex-direction: row; align-items: center; gap: 12px; }
button.stat:hover { border-color: var(--line-2); }
.stat.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), var(--shadow); }
.stat-top { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink); font-weight: 650; }
.stat-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.stat-t small { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.ibox { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--accent-ink); background: var(--accent-tint); flex: none; }
.ibox .ico { width: 17px; height: 17px; }
.stat b { font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stat-late .ibox { background: var(--warm-soft); color: var(--warm); }
.stat-late b { color: var(--warm); }
.stat .spark { display: block; height: 18px; margin-top: 4px; width: 110px; }
.stat .meter { margin-top: 6px; width: 110px; }
.spark rect { fill: var(--viz); }
.meter { height: 6px; background: var(--viz-track); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--viz); }
.toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar select, .toolbar .btn, .toolbar .search input { height: 30px; min-height: 30px; font-size: 12.5px; border-radius: 6px; }
.toolbar select { width: auto; min-width: 112px; padding: 0 6px; }
.toolbar .btn { padding: 0 10px; gap: 5px; box-shadow: none; }
.toolbar .btn .ico { width: 14px; height: 14px; }
.search { position: relative; width: 260px; max-width: 100%; }
.search .ico { position: absolute; left: 10px; top: 50%; width: 16px; height: 16px; margin-top: -8px; color: var(--ink-3); }
.search input { height: var(--tap-s); min-height: 0; font-size: 13px; padding-left: 32px; }
.toolbar .search { width: 220px; }
.toolbar .search input { padding-left: 28px; }
.toolbar .search .ico { width: 14px; height: 14px; left: 9px; margin-top: -7px; }
.tbl-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.tbl-scroll { overflow-x: auto; }
.empty { padding: 40px 0; color: var(--ink-3); text-align: center; }
.tbl-foot { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.tbl-foot select { width: auto; height: 32px; font-size: 13px; padding: 0 8px; }
.pager { display: flex; gap: 6px; }
.pager .btn { min-width: var(--tap-s); padding: 0; }
.more { padding-top: 14px; font-size: 14px; color: var(--ink-3); }

/* status words: plain text */
.badge { font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.badge.ok { color: var(--accent-ink); }
.badge.bad { color: var(--bad); }
.badge.muted { color: var(--ink-3); }
.tag { font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .03em; }
.tag.bad { color: var(--bad); }

/* ---------- QRAP page ---------- */
.d-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 0 0 14px; flex-wrap: wrap; }
.d-head h1 { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; font-size: 24px; }
.d-head h1 .badge { font-size: 15px; }
.next-bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 12px 18px; margin-bottom: 14px; }
.next-bar .next { flex: 1; min-width: 260px; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.next-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.next { display: flex; flex-direction: column; gap: 4px; }
.next .lbl { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.next b { font-size: 15px; }
.next.ok b { color: var(--accent-ink); }
.box { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
.box.ok { background: var(--accent-soft); border-color: #cfe8bf; }
.box.ok > b { color: var(--accent-ink); }
.act { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act-no { color: var(--ink-3); font-size: 13px; font-weight: 700; }
.act.done .act-text { color: var(--ink-3); }
.act-btns { display: flex; gap: 6px; }
.act-form, .ia-row { padding: 18px; border: 1px solid var(--line); border-radius: 9px; margin-top: 12px; background: var(--soft); }
.ia-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 650; }
.why-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; margin-bottom: 12px; }
.why-root { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding-bottom: 12px; white-space: nowrap; cursor: pointer; }
.checklist { list-style: none; margin: 10px 0; padding: 0; }
.checklist li { padding: 3px 0; }
.checklist .ok { color: var(--accent-ink); font-weight: 700; }
.checklist .no { color: var(--bad); font-weight: 700; }
.slots-wrap { overflow-x: auto; }
.slots, table.roles, table.people { width: 100%; border-collapse: collapse; font-size: 14px; }
.slots th, .slots td, .roles th, .roles td, .people th, .people td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.slots th, .roles th, .people th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--soft); }

/* ---------- the paper form QRAP V3.0: board strips and the QRAP page ----------

   Column widths are the paper's proportions (--pp-cols). The whole form sits in one white card. */
.pp-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 1.5px solid #b7c2bc; border-radius: 14px;
  box-shadow: var(--shadow); padding: 12px 12px 14px; }
/* each QRAP is one framed sheet: light grey with a clear border; the boxes on it are white */

.strip { padding: 8px 10px 10px; }
.paper.big .pp-body { padding: 10px; }
.paper { --pp-cols: 4.3fr 1.15fr 3.15fr 1.8fr 1.75fr 3.75fr 1.9fr; --pp-c1: 4.3fr 1.15fr 3.15fr; --pp-c3: 1.75fr 3.75fr; --pp-gap: 8px;
  --pp-line: #a7b2ac; --pp-ink: #23292d; font-size: 13px; line-height: 1.42; color: var(--ink); min-width: 1240px; }

.paper.compact { font-size: 12px; min-width: 1100px; --pp-cols: 4.8fr 1fr 3.1fr 1.7fr 1.6fr 3.5fr 1.95fr; --pp-c1: 4.8fr 1fr 3.1fr; --pp-c3: 1.6fr 3.5fr; }

.g1 { grid-column: 1 / 4; } .g2 { grid-column: 4 / 5; } .g3 { grid-column: 5 / 7; } .g4 { grid-column: 7 / 8; }
/* the two header rows: who fills it (thin strip) and the big title (dark slab) */
.pp-bands { margin-bottom: 5px; align-items: stretch; }
.pp-band { display: flex; align-items: center; justify-content: center; text-align: center; background: var(--slate-2); color: var(--slate-ink);
  border-radius: 5px; padding: 3px 8px; font-size: 10.5px; line-height: 1.3; }
.pp-band b { color: #fff; font-weight: 700; }

.paper.compact .pp-band { font-size: 9.5px; padding: 2px 6px; }
.pp-heads { margin-bottom: 10px; align-items: stretch; }
.pp-h { border-radius: 8px; display: grid; place-items: center; text-align: center; padding: 9px 10px; font-weight: 800; line-height: 1.1; color: #fff; background: var(--slate); }

.pp-h.g1 { grid-template-columns: var(--pp-c1); column-gap: var(--pp-gap); }
.pp-h.g3 { grid-template-columns: var(--pp-c3); column-gap: var(--pp-gap); }

.paper.compact .pp-h .mid { font-size: 11px; }

/* body: grey trays with white boxes */
.pp-body { align-items: stretch; }
.pp-g { padding: 0; min-width: 0; }
.pp-g.g1 { display: grid; grid-template-columns: var(--pp-c1); column-gap: var(--pp-gap); }
.pp-g.g2 { display: flex; }
.pp-g.g3 { display: grid; grid-template-columns: var(--pp-c3); column-gap: var(--pp-gap); }

.cb { display: inline-flex; align-items: baseline; gap: 6px; margin-right: 8px; color: var(--ink-3); font-weight: 400; }

/* ① */
.p1 { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 5px; flex: 1; }

.p1-co { grid-column: 2 / 4; }

.pp-ph { display: block; width: 100%; height: 120px; border: 1px solid var(--pp-line); border-radius: 6px; overflow: hidden; margin-top: 4px; padding: 0;
  background: var(--soft); color: var(--ink-3); font-size: 12px; cursor: zoom-in; }
.pp-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pp-cam { margin-top: 4px; }

.pp-grow { flex: 1; background: #fff; border: 1px solid var(--pp-line); border-radius: 6px; overflow: hidden; box-shadow: 0 1px 2px rgba(21,27,31,.08); }

/* ④ */
.p4-dec .cb { display: flex; margin: 0 0 4px; }

  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), 50% 100%, 0 calc(100% - 9px)); }
.p5-w::before { content: ''; position: absolute; inset: 1px; z-index: -1; background: #fff;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), 50% 100%, 0 calc(100% - 9px)); }

/* ⑥ */
.p6-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

.p7 { padding: 4px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.p7-c .cb { font-weight: 700; color: var(--ink); margin: 0; }
.paper.compact .p7-c .cb { font-size: .92em; }
.p7-sub { font-style: italic; font-size: .9em; padding-left: 17px; color: var(--ink-3); }

.paper.compact .p7-sub, .paper.compact .pp-hint { display: none; }
/* typing straight into the paper: same boxes, same size – the texts become plain fields with a dashed green line */
.pp-cell.pp-edit { outline: 2px solid var(--accent); outline-offset: 3px; }
.vh, .lbl-paper .fld-l { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.pp-edit input:not([type=checkbox]):not([type=radio]), .pp-edit select {
  height: 24px; padding: 0 4px; font-size: inherit; border: 0; border-bottom: 1.5px dashed var(--accent); border-radius: 3px 3px 0 0; background: #f3f9ef; }
.pp-edit textarea { min-height: 2.8em; padding: 2px 4px; font-size: inherit; line-height: 1.35; border: 1.5px dashed var(--accent); border-radius: 4px; background: #f3f9ef; }

.pp-edit .checks { flex-direction: column; gap: 2px; }

.pp-edit .p5-w { text-align: left; padding-bottom: 14px; }

.pp-edit .pp-t td { padding: 2px 3px; }
.pp-mini { font-size: .9em; color: var(--ink-3); margin-top: 4px; }
.p1-safety-e { display: flex; flex-direction: column; gap: 2px; }

/* Uložit / Zrušit while typing into the paper: a small bar at the bottom of the screen, so the paper keeps its size */

  max-width: calc(100vw - 32px); background: #fff; border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 6px 24px rgba(21,27,31,.18); padding: 10px 16px; }

/* SAFETY = ANO: the whole form gets a red frame */
.shell-card.safety, .pp-wrap.safety, .strip.safety, .strip.safety:hover { border: 3px solid var(--bad); box-shadow: 0 0 0 3px #f8e3e1; }
/* board: one paper strip per QRAP */
.strip { margin-top: 14px; cursor: pointer; outline: none; }

/* ---------- toast ---------- */

  font-size: 14px; font-weight: 500; z-index: 60; max-width: 92vw; }

}

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<datalist id="people-list"></datalist>

<!-- All data the page starts with. JSON only, never run as code; "<" arrives escaped from doGet. -->
<script type="application/json" id="boot"><?!= boot ?></script>

<script>
'use strict';
/* =====================================================================================
   eQRAP Expedice (Lite) – the whole screen.
   The questions are the ones of the firm's QRAP V3.0 form (logistics version), ① to ⑦.
   All data arrives together with the page (#boot), so moving around is instant.
   The server is called only to save, to open a QRAP (answered "unchanged" when nothing changed),
   and for a quiet refresh every 90 s (which reads nothing on the server when nothing changed).

   Lists arrive compact ({ k: column names, r: rows }) and are turned into objects once (loadLists).
   Lookups by QRAP number use Maps that are rebuilt only when a list is replaced (never patched in place).

   1. State and texts      4. Board (Tabule)           7. Forms (① … ⑦)
   2. Small helpers        5. New problem (Nahlásit)   8. Photos (kiosk camera + phone hand-off)
   3. Header and routing   6. Problem detail ①–⑦      9. Dashboard, Správa, help, refresh, start
   ===================================================================================== */

// ------------------------------------------------------------------ 1. STATE AND TEXTS
const BOOT = readBoot();
function readBoot() {
  try { return JSON.parse(document.getElementById('boot').textContent) || {}; }
  catch (e) { return { error: 'Data aplikace se nepodařilo načíst. Obnovte prosím stránku.' }; }
}
const S = {
  me: BOOT.me || {}, cfg: BOOT.cfg || {}, lists: BOOT.lists || {}, people: BOOT.people || [], meta: BOOT.meta || {},
  qraps: [], actions: [], effects: [], assess: [], all: false, ver: BOOT.ver || '',
  view: 'board', id: null, edit: null, editMode: 'panel', filter: 'open', area: '', range: '', search: '', page: 0, per: 10,
  history: {}, flash: null, adm: null, dashList: 'open', loadedAt: Date.now()
};
const isManager = () => S.me.role === 'MANAŽER' || S.me.role === 'ADMIN';
const isAdmin = () => S.me.role === 'ADMIN';

const STATUS = {
  'OPATŘENÍ':   { label: '③ Opatření', cls: 'warn', next: '③ Okamžitá opatření', who: 'kdokoli ze směny (TL)' },
  'ROZHODNUTÍ': { label: '④ Rozhodnutí', cls: 'warn', next: '④ Rozhodnutí OJT', who: 'supervizor' },
  'ANALÝZA':    { label: '⑤ 5 Proč', cls: 'step', next: '⑤ 5 Proč a ⑥ konečné akce', who: 'piloti' },
  'AKCE':       { label: '⑥ Akce', cls: 'step', next: '⑥ Konečné akce', who: 'piloti akcí' },
  'OVĚŘENÍ':    { label: '⑥ Ověření 5 směn', cls: 'step', next: '⑥ Efektivita 5 směn, potom podpis uzavření', who: 'kdokoli ze směny' },
  'SCHVÁLENÍ':  { label: 'Ke schválení', cls: 'warn', next: 'Podpis uzavření', who: 'kdokoli' },
  'UZAVŘENO':   { label: 'Uzavřeno', cls: 'ok' },
  'ZRUŠENO':    { label: 'Zrušeno', cls: 'muted' }
};
const DECISIONS = [
  { value: 'POKRAČOVAT', label: 'Pokračovat s analýzou a 5 Proč', sub: 'Příčina není známá nebo je co se naučit → piloti dostanou e-mail.' },
  { value: 'VYŘEŠENO', label: 'Problém vyřešen: ŽÁDNÉ 5 Proč', sub: 'Opatření a OJT problém vyřešily. QRAP se hned uzavře.' },
  { value: 'ESKALACE', label: 'Eskalace na vyšší úroveň (manažer)', sub: 'Přesahuje oblast → manažeři dostanou e-mail, analýza pokračuje.' }
];
const CRITERIA = [
  ['c1', '1 RED BOX', 'Popis problému'], ['c2', '2 ROZDĚLENÍ', 'Třídění, ochrana a rozdělení úkolů'],
  ['c3', '3 POROVNÁNÍ', 'Dobrý a špatný'], ['c4', '4 POUČENÍ A SDÍLENÍ', 'Komunikace a transversalizace'],
  ['c5', '5 ON JOB TRAINING', 'OJT provedené managementem']
];
const YES_NO = [{ value: 'ANO', label: 'ano' }, { value: 'NE', label: 'ne' }];

/** Compact list from the server ({ k: names, r: rows }) → objects. A plain array is taken as it is. */
function rowsOf(t) {
  if (!t) return [];
  if (Array.isArray(t)) return t;
  const k = t.k, n = k.length;
  return t.r.map(r => { const o = {}; for (let i = 0; i < n; i++) o[k[i]] = r[i]; return o; });
}

/**
 * A QRAP from the server sends three things packed: can (what is possible now) and ck (closure conditions) as bits,
 * eff as [round, effective shifts, all ok]. Unpacked here once, so the rest of the page reads q.can.decide etc.
 */
function prepQ(q) {
  if (q.can && typeof q.can === 'object') return q; // already unpacked
  const can = Number(q.can) || 0, ck = Number(q.ck) || 0, e = Array.isArray(q.eff) ? q.eff : [1, 0, 0];
  q.can = {};
  (S.meta.can || []).forEach((k, i) => { q.can[k] = !!(can & (1 << i)); });
  q.checklist = (S.meta.checklist || []).map((label, i) => ({ label, ok: !!(ck & (1 << i)) }));
  q.eff = { round: e[0], ok: e[1], allOk: !!e[2] };
  return q;
}

/** Puts a list from the server into the page (boot, refresh, "Zobrazit jako"). */
function loadLists(d) {
  S.qraps = rowsOf(d.qraps).map(prepQ);
  S.actions = rowsOf(d.actions);
  S.effects = rowsOf(d.effects);
  S.assess = rowsOf(d.assess);
  S.all = !!d.all;
  if (d.ver) S.ver = d.ver;
  S.history = {};
  S.loadedAt = Date.now();
}

// ------------------------------------------------------------------ 2. SMALL HELPERS
/** Creates an element. Text is always inserted as text (never as HTML), so nothing typed can break the page. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'value') value = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = true;
    else el.setAttribute(k, v === true ? '' : v);
  });
  kids.flat(Infinity).forEach(k => {
    if (k !== null && k !== undefined && k !== false && k !== '') el.append(k instanceof Node ? k : String(k));
  });
  if (value !== undefined) el.value = value;
  return el;
}

/** Replaces the content of an element (same rules as h: lists are flattened, empty values skipped). */
function fill(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false && k !== ''));
  return el;
}

/** Calls that are safe to repeat: retried once after a network hiccup (apiCreate carries a one-time token). */
const RETRY = new Set(['apiRefresh', 'apiGet', 'apiPhoto', 'apiHistory', 'apiAdminData', 'apiCreate']);
const isNetErr = e => /NetworkError|Failed to fetch|network|HTTP 0/i.test(String((e && e.message) || e || ''));

/** Calls a server function from Code.gs and returns a Promise. */
function api(fn, ...args) {
  const once = () => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
  if (!RETRY.has(fn)) return once();
  return once().catch(e => (isNetErr(e) ? new Promise(r => setTimeout(r, 1500)).then(once) : Promise.reject(e)));
}

function errText(e) {
  if (isNetErr(e)) return 'Nepodařilo se spojit se serverem. Zkontrolujte připojení a zkuste to znovu.';
  const m = String((e && e.message) || e || '').replace(/^(ScriptError|Exception|Error|Výjimka):\s*/, '');
  return m || 'Nastala chyba. Zkuste to prosím znovu.';
}

let toastTimer = null;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (bad ? ' bad' : '');
  t.setAttribute('role', bad ? 'alert' : 'status');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 7000 : 2500);
}

/** Saves: disables the button while waiting, stores the answer, shows "Uloženo". Returns the answer or null. */
async function save(btn, fn, args) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Ukládám…';
  try {
    const res = await api(fn, ...args);
    store(res);
    toast('Uloženo ✓');
    return res;
  } catch (e) {
    toast(errText(e), true);
    btn.disabled = false;
    btn.textContent = label;
    return null;
  }
}

/** Save from inside the detail page, then close the form and show the section again. */
async function submit(btn, fn, args, secNo) {
  const res = await save(btn, fn, args);
  if (!res) return null;
  S.edit = null;
  render();
  const el = document.getElementById('sec' + secNo);
  if (el) el.scrollIntoView({ block: 'nearest' });
  return res;
}

/** Puts a fresh problem (from the server) into the page's data. Lists are replaced, never patched in place. */
function store(res) {
  if (!res || !res.qrap) return;
  const q = prepQ(res.qrap);
  const id = q.id;
  S.qraps = byId(id) ? S.qraps.map(x => (x.id === id ? q : x)) : [q].concat(S.qraps);
  S.actions = S.actions.filter(a => a.qrapId !== id).concat(res.actions || []);
  S.effects = S.effects.filter(a => a.qrapId !== id).concat(res.effects || []);
  S.assess = S.assess.filter(a => a.qrapId !== id).concat(res.assess || []);
  delete S.history[id];
}

const pad = n => String(n).padStart(2, '0');
function fmtDT(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const y = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
  return d.getDate() + '. ' + (d.getMonth() + 1) + '.' + y + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function fmtD(v) {
  if (!v) return '';
  const d = v.length === 10 ? new Date(v + 'T00:00') : new Date(v);
  return d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear();
}
function ago(iso) {
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 60) return 'před ' + min + ' min';
  if (min < 48 * 60) return 'před ' + Math.round(min / 60) + ' h';
  return 'před ' + Math.round(min / 1440) + ' dny';
}
function localInput(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function dayOf(iso) { const d = iso ? new Date(iso) : new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const today = () => dayOf();
const split = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const isOther = v => String(v || '').trim().toLowerCase() === 'jiné';

/** Lookups by QRAP number / e-mail: Maps rebuilt only when the list itself was replaced. */
const IDX = { q: null, qm: null, a: null, am: null, p: null, pm: null };
function byId(id) {
  if (IDX.q !== S.qraps) { IDX.q = S.qraps; IDX.qm = new Map(S.qraps.map(q => [q.id, q])); }
  return IDX.qm.get(id);
}
function actsAll(id) {
  if (IDX.a !== S.actions) {
    IDX.a = S.actions;
    IDX.am = new Map();
    S.actions.forEach(a => { const g = IDX.am.get(a.qrapId); if (g) g.push(a); else IDX.am.set(a.qrapId, [a]); });
  }
  return IDX.am.get(id) || [];
}
function personOf(email) {
  if (IDX.p !== S.people) { IDX.p = S.people; IDX.pm = new Map(S.people.map(p => [p.email, p])); }
  return IDX.pm.get(email);
}
const actsOf = (id, part) => actsAll(id).filter(a => a.part === part && !a.removed).sort((a, b) => a.no - b.no);
const isOpen = q => q.status !== 'UZAVŘENO' && q.status !== 'ZRUŠENO';
const hours3 = () => Number(S.cfg.LHUTA_OPATRENI_HODIN) || 24;
const deadline3 = q => new Date(new Date(q.when || q.created).getTime() + hours3() * 3600e3);
const actLate = a => !a.done && a.due && a.due < today();
const isLate = q => isOpen(q) && ((q.status === 'OPATŘENÍ' && deadline3(q) < new Date()) || actsOf(q.id, '⑥').some(actLate));
const roleName = r => ({ 'MANAŽER': 'Manažer', 'ADMIN': 'Admin' }[r] || '');
function personName(email) {
  const kiosk = / \(kiosk\)$/.test(email || ''); // older history lines signed on the kiosk
  const e = String(email || '').replace(/ \(kiosk\)$/, '');
  const p = personOf(e);
  return (p ? p.name : e) + (kiosk ? ' (na kiosku)' : '');
}
const pilotNames = q => split(q.pilots).map(personName).join(', ');
function badge(q) { const st = STATUS[q.status] || { label: q.status, cls: '' }; return h('span', { class: 'badge ' + st.cls }, st.label); }

/** Small line icons (24×24, drawn with the text colour). */
const ICONS = {
  circle: ['c:12,12,9'], check: ['c:12,12,9', 'M8 12.5l2.7 2.7L16.2 9.6'], dot: ['c:12,12,9', 'c:12,12,3.5'],
  inbox: ['M4 13h4.5l1.5 2.5h4l1.5-2.5H20', 'M6.5 5h11L20 13v6H4v-6z'], user: ['c:12,8,4', 'M4.5 20.5c1.4-3.8 4.3-5.5 7.5-5.5s6.1 1.7 7.5 5.5'],
  clock: ['c:12,12,9', 'M12 7.5V12l3 2'], done: ['M5 12.5l4.5 4.5L19 7.5'], alert: ['M12 3.5l9 16H3z', 'M12 10v4.5', 'M12 17.3v.2'],
  search: ['c:11,11,7', 'M20.5 20.5L16 16'], chart: ['M4 20h16', 'M7 16v-5', 'M12 16V6', 'M17 16v-8'], print: ['M7 9V3.5h10V9', 'M7 17H4.5V10.5a1.5 1.5 0 0 1 1.5-1.5h12a1.5 1.5 0 0 1 1.5 1.5V17H17', 'M7 14h10v6.5H7z'],
  plus: ['M12 5v14', 'M5 12h14'], camera: ['M4 8h3.5l2-2.5h5l2 2.5H20v11H4z', 'c:12,13,3.5'],
  bell: ['M6.5 16v-5a5.5 5.5 0 0 1 11 0v5l1.5 2h-14z', 'M10 20.5a2 2 0 0 0 4 0'], pin: ['M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z', 'c:12,10,2.3'], info: ['c:12,12,9', 'M12 11v5.5', 'M12 7.6v.2'], sort: ['M8 9.5l4-4 4 4', 'M8 14.5l4 4 4-4'], up: ['M12 19V5', 'M6 11l6-6 6 6'], down: ['M12 5v14', 'M6 13l6 6 6-6'],
  refresh: ['M19.5 12a7.5 7.5 0 1 1-2.2-5.3', 'M19.5 4v4.5H15'], left: ['M15 6l-6 6 6 6'], right: ['M9 6l6 6-6 6'], shield: ['M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z']
};
function icon(name) {
  return svg('svg', { viewBox: '0 0 24 24', class: 'ico', 'aria-hidden': 'true' }, (ICONS[name] || []).map(d => {
    if (d.slice(0, 2) !== 'c:') return svg('path', { d: d });
    const c = d.slice(2).split(',');
    return svg('circle', { cx: c[0], cy: c[1], r: c[2] });
  }));
}
const ibox = name => h('span', { class: 'ibox' }, icon(name));

// ------------------------------------------------------------------ 3. HEADER AND ROUTING
/** Show another page. replace = true: do not keep the current page in the browser's Back history. */
function go(view, id, replace) {
  S.view = view;
  S.id = id || null;
  S.edit = null;
  const p = {};
  if (id) p.id = id; else if (view !== 'board') p.view = view;
  try { google.script.history[replace ? 'replace' : 'push']({ view: view, id: id || null }, p); } catch (e) { /* ignore */ }
  render();
  window.scrollTo(0, 0);
  if (view === 'detail') refreshOne(id);
}

/**
 * Open a block for filling in (null = close). mode 'paper' = type straight into the paper (click on the form);
 * otherwise the full form opens under the paper (buttons in "Další krok").
 */
function edit(key, mode) {
  S.edit = key;
  S.editMode = key && mode === 'paper' ? 'paper' : 'panel';
  render();
  const form = document.querySelector('.editing');
  if (form) {
    form.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    const first = form.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select');
    if (first) first.focus({ preventScroll: true });
  }
}

function render() {
  const pages = { board: boardPage, new: newPage, detail: detailPage, help: helpPage, dash: dashPage, admin: adminPage };
  if ((S.view === 'dash' && !isManager()) || (S.view === 'admin' && !isAdmin())) S.view = 'board';
  const width = { new: 'w-form', admin: 'w-mid', help: 'w-mid', detail: 'w-paper', board: 'w-paper', dash: 'w-paper' }[S.view] || '';
  fill(document.getElementById('app'), header(), h('main', { class: width || null }, (pages[S.view] || boardPage)()));
}

function header() {
  const nav = (label, view) => h('button', { class: 'nav' + (S.view === view ? ' on' : ''), onclick: () => go(view) }, label);
  const who = h('span', { class: 'who', title: S.me.email }, S.me.name || S.me.email || '', h('small', null, roleName(S.me.role) || 'uživatel'));
  const initials = String(S.me.name || S.me.email || '?').split(/[\s.@]+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
  return h('header', { class: 'top' }, h('div', { class: 'top-in' },
    h('button', { class: 'brand', onclick: () => go('board'), title: S.cfg.NAZEV || '' }, 'e-QRAP'),
    h('nav', null, nav('Tabule', 'board'), nav('Jak to funguje', 'help'), isAdmin() ? nav('Správa', 'admin') : null),
    h('div', { class: 'grow' }),
    h('div', { class: 'top-right' },
      isManager() ? h('button', { class: 'btn btn-dash' + (S.view === 'dash' ? ' on' : ''), onclick: () => go('dash') }, icon('chart'), h('span', null, 'Přehled manažera')) : null,
      S.view === 'board' ? null : h('button', { class: 'btn primary', onclick: () => go('new') }, '+ Nahlásit problém'),
      S.me.canViewAs ? viewAsSelect() : null,
      h('span', { class: 'avatar', 'aria-hidden': 'true' }, initials),
      who)));
}

/** Page title with an optional breadcrumb and buttons on the right. */
function pageHead(title, sub, right, crumb) {
  return h('div', null,
    crumb ? h('div', { class: 'crumbs' }, h('button', { onclick: () => go('board') }, 'Tabule'), h('span', null, '/'), h('b', null, crumb)) : null,
    h('div', { class: 'page-head' }, h('div', null, h('h1', null, title), sub ? h('div', { class: 'sub' }, sub) : null),
      right ? h('div', { class: 'head-btns' }, right) : null));
}

/** Admins only: "Zobrazit jako" – try the app as another role (the server uses that role too). */
function viewAsSelect() {
  const sel = h('select', { class: 'view-as', title: 'Zobrazit aplikaci jako jiná role', 'aria-label': 'Zobrazit jako', onchange: async e => {
    sel.disabled = true;
    try {
      const b = await api('apiViewAs', e.target.value);
      Object.assign(S, { me: b.me, cfg: b.cfg, lists: b.lists, people: b.people, meta: b.meta || S.meta, adm: null, edit: null });
      loadLists(b);
      fillPeopleList();
      toast(e.target.value ? 'Zobrazeno jako: ' + e.target.selectedOptions[0].textContent : 'Zpět jako Admin');
      go('board');
    } catch (err) { toast(errText(err), true); sel.disabled = false; }
  } },
  [['', 'Admin (vy)'], ['-', 'jako: uživatel'], ['MANAŽER', 'jako: manažer']]
    .map(o => h('option', { value: o[0] }, o[1])));
  sel.value = S.me.viewAs || '';
  return sel;
}

// ------------------------------------------------------------------ 4. BOARD (TABULE = HOME)
const FILTERS = {
  open:      { label: 'Otevřené', test: isOpen },
  decide:    { label: 'Čeká na rozhodnutí', test: q => q.status === 'ROZHODNUTÍ' },

  late:      { label: 'Po termínu', test: isLate, alert: true },

/** Search text of a QRAP, built once per QRAP object (a fresh object from the server gets a fresh one). */
const HAY = new WeakMap();
function haystack(q) {
  let s = HAY.get(q);
  if (s === undefined) {
    s = [q.id, q.what, q.whatOther, q.descWrong, q.descRight, q.zone, q.location, q.reference, q.materialNo, q.huNo, q.supplier, q.finder, q.how, q.howOther]
      .join(' ').toLowerCase();
    HAY.set(q, s);
  }
  return s;
}

/** Open before closed; late and SAFETY first; newest first. The keys are computed once per QRAP, not per comparison. */
function sortQ(rows) {
  return rows.map(q => ({ q, r: (isOpen(q) ? 0 : 4) - (isLate(q) ? 2 : 0) - (q.safety === 'ANO' ? 1 : 0), t: String(q.when || q.created || '') }))
    .sort((a, b) => a.r - b.r || (a.t < b.t ? 1 : a.t > b.t ? -1 : 0))
    .map(x => x.q);
}

function myActions() {
  if (!S.me.email) return null;
  const mine = S.actions.filter(a => a.canDone && a.ownerEmail === S.me.email);
  if (!mine.length) return null;
  return h('div', { class: 'card' }, h('h2', null, 'Moje konečné akce (' + mine.length + ')'),
    mine.map(a => h('div', { class: 'act' },
      h('div', { class: 'act-no' }, '⑥'),

        h('span', { class: actLate(a) ? 'late-txt' : '' }, fmtD(a.due)))),
      h('div', null),
      h('button', { class: 'btn small', onclick: () => go('detail', a.qrapId) }, 'Otevřít'))));
}

/**
 * New QRAP, step by step in the order of the paper form: ① ② ③ (Zpět / Pokračovat).
 * Only the risk question of ③ is required now – what is missing in ③ the TL completes within 24 h.
 * The last step shows everything for a check before sending. The form carries a one-time token,
 * so a double click or a retry after a lost answer never creates two QRAPs.
 */
function newPage() {
  const pf = popisForm({ when: new Date().toISOString(), zone: S.me.area || '' }, true);
  const s3 = opatreniForm({}, []);
  const token = window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  const step = (...kids) => h('div', { class: 'step' }, kids);
  const steps = [
    { name: 'Problém', title: 'Popis problému – CO a JAK', el: step(pf.groups[0]) },
    { name: 'Kdy a kde', el: step(pf.groups[1]) },
    { name: 'Kolik a kdo', el: step(pf.groups[2]) },
    { name: 'Popis', title: 'Popis problému – ŠPATNÝ a DOBRÝ díl', el: step(pf.groups[3]) },
    { name: 'Upozornění', title: 'Kdo byl upozorněn?', el: step(pf.two) },
    { name: 'Opatření', title: 'Okamžitá opatření <' + hours3() + 'h', el: step(s3.el,
      h('p', { class: 'sub', style: 'margin-top:12px' }, 'Vyplňte, co víte. Co chybí, doplní TL do ' + hours3() + ' h.')) },
    { name: 'Kontrola', el: null }
  ];
  let at = 0;
  const bar = h('div', { class: 'wiz-list' });
  const body = h('div');
  const back = h('button', { class: 'btn ghost', onclick: () => show(at - 1) }, '← Zpět');
  const next = h('button', { class: 'btn primary btn-cta', onclick: () => { if (valid(at)) show(at + 1); } }, 'Pokračovat →');
  const send = h('button', { class: 'btn primary btn-cta', onclick: async () => {
    const data = pf.read();
    if (!data) return;
    const d3 = s3.read();
    if (!d3) return;
    data.s3 = d3;
    data.token = token;
    const phoneUsed = pf.photos.drop().length < 2; // at least one photo came from the phone
    const res = await save(send, 'apiCreate', [data]);
    if (!res) return;
    S.flash = { id: res.qrap.id, text: 'QRAP ' + res.qrap.id + ' odeslán. Manažer zóny dostal e-mail.' +
      (phoneUsed && res.phoneExpired ? ' Fotky z telefonu se nepodařilo připojit – přidejte je na stránce QRAP (Přidat foto).' : '') };
    S.filter = 'open';
    go('board', null, true);
  } }, 'Odeslat ✓');
  const titleEl = h('h2', { class: 'shell-sub' });
  titleEl.tabIndex = -1;
  function valid(i) {
    const st = steps[i];
    if (i === 5) return !!s3.read();
    if (!pf.F.read()) return false;
    const d = pf.F.peek();
    if (i === 1 && new Date(d.when).getTime() > Date.now() + 5 * 60000) return !!pf.F.mark('when', 'KDY nemůže být v budoucnosti.');
    if (i === 2 && Number(d.qty) > 0 && !d.unit) return !!pf.F.mark('unit', 'Vyberte jednotku.');
    return st.check ? !!st.check() : true;
  }
  function show(i) {
    for (let k = 0; k < i; k++) if (k >= at && !valid(k)) { i = k; break; }
    at = Math.max(0, Math.min(i, steps.length - 1));
    const last = at === steps.length - 1;
    fill(bar, steps.map((st, k) => h('button', { class: 'wiz-step' + (k < at ? ' done' : k === at ? ' on' : ''), type: 'button',
      title: (k + 1) + '. ' + (st.title || st.name), 'aria-current': k === at ? 'step' : null, onclick: () => show(k) },
      icon(k <= at ? 'check' : 'circle'), h('span', null, st.name))));
    titleEl.textContent = (at + 1) + '. ' + (last ? 'Kontrola a odeslání' : steps[at].title || steps[at].name);
    fill(body, last ? steps.slice(0, -1).map(st => h('div', { class: 'review-part' }, h('h3', null, st.title || st.name), st.el)) : steps[at].el);
    back.hidden = at === 0;
    next.hidden = last;
    send.hidden = !last;
    window.scrollTo(0, 0);
    const f = body.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select');
    if (f && !last && at !== 0) f.focus({ preventScroll: true });
  }
  const page = h('div', null,
    pageHead('Nový QRAP', null, null, 'Nový QRAP'),
    h('div', { class: 'shell' },
      h('nav', { class: 'wiz-steps', 'aria-label': 'Kroky' }, bar),
      h('div', { class: 'shell-card' }, titleEl,
        h('div', { class: 'shell-body' }, h('div', { class: 'shell-inner form-rows' }, body)),
        h('div', { class: 'shell-foot' }, back, h('div', { class: 'grow' }),
          h('button', { class: 'btn btn-muted', onclick: () => go('board') }, 'Zrušit'), next, send))));
  page.addEventListener('change', () => {
    page.querySelector('.shell-card').classList.toggle('safety', pf.F.item('safety').get() === 'ANO');
  });
  show(0);
  return page;
}

/** "Další krok" and the buttons for what can be done now. */
function nextBar(q) {
  const btns = [];
  if (q.can.opatreni && q.status === 'OPATŘENÍ') btns.push(startBtn('opatreni', 'Doplnit ③ okamžitá opatření'));
  if (q.can.decide) btns.push(startBtn('rozhodnuti', 'Rozhodnout ④'));
  else if (q.can.shifts) btns.push(editBtn('smeny', 'Označit informované směny ④'));
  if (q.can.analyze && !hasWhy(q)) btns.push(startBtn('pricina', 'Vyplnit 5 Proč ⑤'));
  if (q.can.analyze && hasWhy(q) && q.status === 'ANALÝZA') btns.push(startBtn('akce:new', '+ Přidat konečnou akci ⑥'));
  if (q.can.pilots) btns.push(editBtn('piloti', '+ přidat pilota'));
  return h('div', { class: 'card next-bar no-print' }, nextBox(q), btns.length ? h('div', { class: 'next-btns' }, btns) : null);
}

function nextBox(q) {
  if (q.status === 'UZAVŘENO') {
    return h('div', { class: 'next ok' }, h('span', { class: 'lbl' }, 'Stav'), h('b', null, '✓ Uzavřeno ' + fmtDT(q.closedAt)),

  const late = isLate(q);
  let who = st.who;
  let extra = '';
  if (q.status === 'OPATŘENÍ') extra = 'chybí: ' + (q.s3Missing || []).join(', ') + ' · termín ' + fmtDT(deadline3(q).toISOString());
  if (q.status === 'ANALÝZA' || q.status === 'AKCE') who = 'piloti: ' + (pilotNames(q) || 'kdokoli');
  if (q.status === 'AKCE') extra = 'otevřené akce: ' + actsOf(q.id, '⑥').filter(a => !a.done).length;
  if (q.status === 'OVĚŘENÍ') extra = 'efektivní na ' + q.eff.ok + ' z 5 směn';

/**
 * The block being filled in, right on the paper. Returns the inputs for the boxes of that block (e),
 * which blocks change (cells), the block that gets the Uložit / Zrušit buttons (main) and those buttons (bar).
 * ① ② are saved together, and ⑤ together with "Co jsme se naučili" and "STANDARD" in ⑥ – as on the paper.
 */
function editorFor(q, key) {
  if (key === 'popis' && q.can.popis) {
    const pf = popisForm(q, false);
    return { main: 1, cells: [1, 2], e: pf.parts,
      bar: formButtons('Uložit ① a ②', b => { const d = pf.read(); if (d) submit(b, 'apiSave', [q.id, 'popis', d], 1); }) };
  }
  if (key === 'opatreni' && q.can.opatreni) {
    const f = opatreniForm(q, actsOf(q.id, '③'), true);
    return { main: 3, cells: [3], e: f.parts, bar: formButtons('Uložit ③', saveSection(q, 'opatreni', f.read, 3)) };
  }
  if (key === 'smeny' && q.can.shifts) {
    const F = makeForm({ shifts: q.shifts });
    return { main: 4, cells: [4], e: { shifts: F.checks('shifts', 'Informace všem směnám (5\' meeting)', S.lists.shifts || []) },
      bar: formButtons('Uložit směny', saveSection(q, 'smeny', F.read, 4)) };
  }
  if (key === 'rozhodnuti' && q.can.decide) {
    const d = decisionEditor(q);
    return { main: 4, cells: [4], e: d.parts, bar: d.bar };
  }
  if (key === 'piloti' && q.can.pilots) {
    const F = makeForm({});
    const have = split(q.pilots);
    return { main: 4, cells: [4],
      e: { pilots: F.checks('pilots', 'Přidat piloty', S.people.filter(p => !have.includes(p.email)).map(p => p.name), { req: true }) },
      bar: formButtons('Přidat', saveSection(q, 'piloti', F.read, 4)) };
  }
  if (key === 'pricina' && q.can.analyze) {
    const d = pricinaEditor(q);
    return { main: 5, cells: [5, 6], e: d.parts, bar: d.bar };
  }
  if (/^akce:/.test(key)) {
    const a = key === 'akce:new' ? null : actsOf(q.id, '⑥').find(x => 'akce:' + x.no === key);
    if (a ? a.canEdit : (q.can.analyze && hasWhy(q))) {
      const d = actionEditor(q, a);
      return { main: 6, cells: [6], e: { action: d.el, editNo: a ? a.no : 'new' }, bar: d.bar };
    }
  }
  if (key === 'hodnoceni' && q.can.assess) {
    const d = assessEditor(q);
    return { main: 7, cells: [7], e: d.parts, bar: d.bar };
  }
  return null;

/** The full form under the paper, opened from the buttons in "Další krok". */
function panelFor(q, key) {
  let title = '', body = null;
  if (key === 'popis' && q.can.popis) {
    const pf = popisForm(q, false);
    title = '① Popis problému · ② Kdo byl upozorněn?';
    body = h('div', null, pf.one, h('div', { class: 'sub-h', style: 'margin-top:20px' }, '② Kdo byl upozorněn?'), pf.two,
      formButtons('Uložit ① a ②', b => { const d = pf.read(); if (d) submit(b, 'apiSave', [q.id, 'popis', d], 1); }));
  } else if (key === 'opatreni' && q.can.opatreni) {
    const f = opatreniForm(q, actsOf(q.id, '③'));
    title = '③ Okamžitá opatření <' + hours3() + 'h';
    body = h('div', null, f.el, formButtons('Uložit ③', saveSection(q, 'opatreni', f.read, 3)));
  } else if (key === 'smeny' && q.can.shifts) {
    const F = makeForm({ shifts: q.shifts });
    title = '④ Informace všem směnám';
    body = h('div', null, F.checks('shifts', 'Informace všem směnám během 5\' meetingu (pětiminutovky)', S.lists.shifts || []),
      formButtons('Uložit směny', saveSection(q, 'smeny', F.read, 4)));
  } else if (key === 'rozhodnuti' && q.can.decide) {
    title = '④ Rozhodnutí OJT';
    body = decisionForm(q);
  } else if (key === 'pricina' && q.can.analyze) {
    title = '⑤ Příčina 5 Proč ?';
    body = pricinaForm(q);
  } else if (key === 'piloti' && q.can.pilots) {
    const F = makeForm({});

    title = 'Přidat piloty';
    body = h('div', null, F.checks('pilots', 'Přidat piloty', S.people.filter(p => !have.includes(p.email)).map(p => p.name), { req: true }),
      formButtons('Přidat', saveSection(q, 'piloti', F.read, 5)));
  } else if (/^akce:/.test(key)) {

/** The 5 Proč steps an action can remove (both chains), plus STD for the standard action. */
function whySteps(q, a) {
  const steps = [];
  ['o', 'n'].forEach(c => [1, 2, 3, 4, 5].forEach(i => {
    if (q[c + i]) steps.push({ value: c.toUpperCase() + i, label: whyLabel(c.toUpperCase() + i) + ' – ' + q[c + i].slice(0, 70) });
  }));
  if (a && a.kind === 'STD') steps.push({ value: 'STD', label: 'STD – aktualizace standardu' });
  return steps;
}

function saveActionForm(b, q, a, F) {
  const d = F.read();
  if (!d) return;
  if (d.evidence && !/^https?:\/\//i.test(d.evidence)) { F.mark('evidence', 'Odkaz musí začínat http:// nebo https://'); return; }
  if (a) {
    d.no = a.no;
    if (!d.done) d.done = false; // empty = not done yet
    else if (a.done && d.done === dayOf(a.done)) delete d.done; // unchanged: keep the original time
  }
  submit(b, 'apiSaveAction', [q.id, d], 6);
}

/**
 * A tiny form builder: every field remembers how to read its value and whether it is required.
 * Fields inside a hidden block are skipped (not required, value '').
 */
function makeForm(values) {
  const items = {};
  const val = key => (values[key] === null || values[key] === undefined ? '' : values[key]);
  const hiddenNow = i => !i.box.isConnected || !!i.box.closest('[hidden]'); // not on screen = not checked now
  const wrap = (key, label, control, o) => {
    // Hints: in a plain text field the hint is the placeholder (gone when typing);
    // anywhere else it hides behind a small ⓘ next to the label – one tap shows one muted line.
    const text = control.matches && control.matches('textarea, input:not([type]), input[type=text], input[type=email]') ? control : null;
    let tip = null, info = null;
    if (o.hint && text && !text.placeholder) text.placeholder = o.hint.replace(/\.$/, '');
    else if (o.hint) {
      tip = h('small', { hidden: true }, o.hint);
      info = h('span', { class: 'info no-print', role: 'button', tabindex: 0, title: o.hint, 'aria-label': 'Nápověda',
        onclick: e => { e.preventDefault(); tip.hidden = !tip.hidden; info.classList.toggle('on', !tip.hidden); },
        onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); info.click(); } } }, icon('info'));
    }
    const el = h(o.group ? 'div' : 'label', { class: 'fld' + (o.wide ? ' wide' : ''), role: o.group ? 'group' : null },
      label ? h('span', { class: 'fld-l' }, label, o.req ? h('span', { class: 'req' }, ' *') : null,
        o.opt ? h('span', { class: 'opt' }, 'nepovinné') : null, info) : null,
      control, tip);
    items[key].box = el;
    const ok = () => el.classList.remove('invalid');
    el.addEventListener('input', ok);
    el.addEventListener('change', ok);
    return el;
  };
  const F = {
    input(key, label, o = {}) {
      const dt = o.type === 'datetime-local';
      const el = o.rows ? h('textarea', { rows: o.rows, placeholder: o.ph, maxlength: 2000 })
        : h('input', { type: o.type || 'text', placeholder: o.ph, min: o.min, max: o.max, list: o.list,
          inputmode: o.type === 'number' ? 'numeric' : null, maxlength: o.type ? null : 200 });
      el.value = dt && val(key) ? localInput(val(key)) : val(key);
      if (o.onchange) el.addEventListener('input', () => o.onchange(el.value));
      items[key] = { label, req: o.req, focus: () => el.focus(),
        get: () => (dt ? (el.value ? new Date(el.value).toISOString() : '') : el.value.trim()) };
      const control = o.now ? h('div', { class: 'with-btn' }, el, h('button', { class: 'btn small', type: 'button',
        onclick: () => { el.value = localInput(); el.dispatchEvent(new Event('input', { bubbles: true })); } }, 'Teď')) : el;
      return wrap(key, label, control, o);
    },
    select(key, label, options, o = {}) {
      const opts = options.map(x => (typeof x === 'string' ? { value: x, label: x } : x));
      if (val(key) && !opts.some(x => x.value === val(key))) opts.push({ value: val(key), label: val(key) });
      const el = h('select', null, h('option', { value: '' }, o.ph || '— vyberte —'), opts.map(x => h('option', { value: x.value }, x.label)));
      el.value = val(key);
      if (o.onchange) el.addEventListener('change', () => o.onchange(el.value));
      items[key] = { label, req: o.req, get: () => el.value, focus: () => el.focus() };
      return wrap(key, label, el, o);
    },
    checks(key, label, options, o = {}) {
      const cur = split(val(key));
      const boxes = options.concat(cur.filter(x => !options.includes(x))).map(x => {
        const box = h('input', { type: 'checkbox', checked: cur.includes(x) });
        const lb = h('label', { class: 'check' + (box.checked ? ' on' : '') }, box, x);
        box.addEventListener('change', () => { lb.classList.toggle('on', box.checked); if (o.onchange) o.onchange(read()); });
        return { cb: box, x, lb };
      });
      const read = () => boxes.filter(b => b.cb.checked).map(b => b.x);
      items[key] = { label, req: o.req, get: () => read().join(', '), focus: () => boxes[0] && boxes[0].cb.focus(),
        set: list => boxes.forEach(b => { b.cb.checked = list.includes(b.x); b.lb.classList.toggle('on', b.cb.checked); }) };
      return wrap(key, label, h('div', { class: 'checks' }, boxes.map(b => b.lb)), Object.assign({ group: true }, o));
    },
    radio(key, label, options, o = {}) {
      const name = 'r' + Math.random().toString(36).slice(2);
      const rows = options.map(x => {
        const r = h('input', { type: 'radio', name, value: x.value, checked: val(key) === x.value, disabled: x.disabled });
        return { r, el: h('label', { class: 'choice' + (r.checked ? ' on' : '') }, r,
          h('span', null, h('b', null, x.label), x.sub ? h('small', null, x.sub) : null)) };
      });
      rows.forEach(x => x.r.addEventListener('change', () => {
        rows.forEach(y => y.el.classList.toggle('on', y.r.checked));
        if (o.onchange) o.onchange(x.r.value);
      }));
      items[key] = { label, req: o.req, get: () => { const c = rows.find(x => x.r.checked); return c ? c.r.value : ''; }, focus: () => rows[0].r.focus() };
      return wrap(key, label, h('div', { class: 'choices' + (o.inline ? ' inline' : '') }, rows.map(x => x.el)), Object.assign({ group: true }, o));
    },
    yesno(key, label, o = {}) { return F.radio(key, label, YES_NO, Object.assign({ inline: true }, o)); },
    toggle(key, label, o = {}) {
      const box = h('input', { type: 'checkbox', checked: !!val(key) });
      if (o.onchange) box.addEventListener('change', () => o.onchange(box.checked));
      items[key] = { label, get: () => (box.checked ? 'ANO' : ''), focus: () => box.focus() };
      const el = h('label', { class: 'check-line' + (o.wide ? ' wide' : '') }, box, label);
      items[key].box = el;
      return el;
    },
    /** Marks one field red with a message (for rules that involve two fields). */
    mark(key, msg) {
      items[key].box.classList.add('invalid');
      items[key].focus();
      toast(msg, true);
      return null;
    },
    /** All values without checking (hidden fields give ''). */
    peek() {
      const out = {};
      Object.keys(items).forEach(k => { out[k] = items[k].box.closest('[hidden]') ? '' : items[k].get(); });
      return out;
    },
    /** Returns all values, or null (and marks the missing fields red) when something required is empty. */
    read() {
      Object.values(items).forEach(i => i.box.classList.remove('invalid'));
      const missing = Object.values(items).filter(i => i.req && !hiddenNow(i) && !i.get());
      if (missing.length) {
        missing.forEach(i => i.box.classList.add('invalid'));
        missing[0].focus();
        toast('Vyplňte prosím: ' + missing.map(i => i.label.replace(/[?:]$/, '')).join(', '), true);
        return null;
      }
      return F.peek();
    },
    item: key => items[key]
  };
  return F;
}

/** Shows or hides a block when a value changes. */
function showIf(el, on) { el.hidden = !on; return el; }

/** KOLIK špatných dílů? with its unit right next to the number (one row). */
function qtyRow(F, L) {
  const qty = F.input('qty', 'KOLIK špatných dílů?', { req: true, type: 'number', min: 0 });
  const unit = F.select('unit', '', L.units || [], { group: true, ph: '— jednotka —' });
  const na = F.toggle('qtyNA', 'N/A', { onchange: on => setNA(on) });
  const input = qty.querySelector('input');
  const sel = unit.querySelector('select');
  const pair = h('div', { class: 'qty-pair' });
  input.replaceWith(pair);
  pair.append(input, unit, na);
  // N/A = no number of pieces: KOLIK and unit are emptied, locked and no longer required
  const setNA = on => {
    if (on) { input.value = ''; sel.value = ''; }
    input.disabled = sel.disabled = on;
    F.item('qty').req = !on;
    qty.classList.remove('invalid');
  };
  setNA(!!F.item('qtyNA').get());
  return qty;
}

    descWrong: F.input('descWrong', 'ŠPATNÝ díl – popis', { req: true, rows: 4, hint: 'Co je špatně? Popište fakta.' }),
    descRight: F.input('descRight', 'DOBRÝ díl – popis', { req: true, rows: 4, hint: 'Jak to má být správně?' }),
    reference: F.input('reference', 'Reference', { opt: true }),

      F.checks('notified', 'Kdo byl upozorněn?', S.lists.alert || [], { req: true, hint: 'Koho jste informovali? Vyberte alespoň jednoho.',
        onchange: list => showIf(otherBox, list.some(isOther)) }),

/** ③ OKAMŽITÁ OPATŘENÍ <24h as on the paper: Ochranná opatření, Třídění – data, Okamžitá opatření, Čas re-startu. */
function opatreniForm(v, ia, onPaper) {
  const F = makeForm(v);
  const sort = showIf(h('div', { class: 'grid wide' },
    h('div', { class: 'note warn wide' }, 'ANO → oddělení KVALITY dostane e-mail. Zapište data třídění.'),
    F.input('checked', 'Přetříděno (ks)', { type: 'number', min: 0, ph: 'přetříděno ks' }),
    F.input('wrong', 'Špatné kusy (ks)', { type: 'number', min: 0, ph: 'špatné ks' })), v.risk === 'ANO');
  const rows = onPaper ? iaTable(ia, v.when) : iaList(ia);
  const parts = {
    risk: h('div', { class: 'wide' },
      F.yesno('risk', 'Je zde riziko na již naskladněném nebo expedovaném zboží?', { req: true, wide: true,
        hint: 'Může být stejná chyba i u zboží, které už je na skladě nebo odešlo k zákazníkovi?', onchange: x => showIf(sort, x === 'ANO') }),
      sort),
    ia: rows.el,
    restoredAt: F.input('restoredAt', 'Čas re-startu procesu/stanice', { type: 'datetime-local', now: true,
      hint: 'Kdy proces znovu běží. Nechte prázdné, když proces nebyl zastaven.' })
  };
  const el = h('div', null,
    h('div', { class: 'grid' }, h('div', { class: 'sub-h wide' }, 'Ochranná opatření'), parts.risk),
    h('div', { class: 'grid' }, h('div', { class: 'sub-h wide' }, 'Okamžitá opatření'), h('div', { class: 'wide' }, parts.ia), parts.restoredAt));
  return {
    el, parts,
    read() {
      const d = F.read();
      if (!d) return null;
      if (d.checked !== '' && d.wrong !== '' && Number(d.wrong) > Number(d.checked)) {
        return F.mark('wrong', '„Špatné kusy“ nemůže být víc než „Přetříděno“.');
      }
      const list = rows.read();
      if (!list) return null;
      d.ia = list;
      return d;
    }
  };
}

/**
 * KDY on the paper: "Čas" and "Datum" in two lines, as on the paper. They fill the KDY field the form reads
 * (that field stays in the page, only visually hidden).
 */
function whenSplit(fld) {
  const dt = fld.querySelector('input');
  fld.classList.add('vh');
  const v = (dt.value || '').split('T');
  const date = h('input', { type: 'date', value: v[0] || '', 'aria-label': 'Datum' });
  const time = h('input', { type: 'time', value: v[1] || '', 'aria-label': 'Čas' });
  const sync = () => { dt.value = date.value && time.value ? date.value + 'T' + time.value : ''; dt.dispatchEvent(new Event('input', { bubbles: true })); };
  date.addEventListener('input', sync);
  time.addEventListener('input', sync);
  return h('div', { class: 'when-split' }, fld, h('div', null, 'Čas: ', time), h('div', null, 'Datum: ', date));
}

/**
 * ③ on the paper: "Okamžitá opatření | Kdo | Čas" typed straight into the table rows. Čas is a time as on the paper:
 * it is the first such time after KDY (③ has to be done within 24 h). An unchanged time keeps its stored date.
 */
function iaTable(existing, whenIso) {
  const base = whenIso ? new Date(whenIso) : new Date();
  const toIso = t => {
    if (!t) return '';
    const p = t.split(':').map(Number);
    const d = new Date(base);
    d.setHours(p[0], p[1], 0, 0);
    if (d.getTime() < base.getTime() - 60000) d.setDate(d.getDate() + 1);
    return d.toISOString();
  };
  const rows = [];
  const body = h('tbody');
  const add = v => {
    v = v || {};
    const F = makeForm(v);
    const it = { no: v.no, F, removed: false, orig: v.done || '', t0: v.done ? timeOf(v.done) : '' };
    it.time = h('input', { type: 'time', value: it.t0, 'aria-label': 'Čas' });
    it.tr = h('tr', null,
      h('td', null, F.input('text', 'Okamžité opatření', { req: true, rows: 2, ph: 'co bylo uděláno' })),
      h('td', null, F.input('owner', 'Kdo', { req: true, list: 'people-list', ph: 'kdo' })),
      h('td', null, it.time, h('div', { class: 'pp-rowbtns' },
        h('button', { class: 'link', type: 'button', onclick: () => { it.time.value = timeOf(new Date().toISOString()); } }, 'teď'),
        h('button', { class: 'link pp-del', type: 'button', title: 'Odebrat opatření', 'aria-label': 'Odebrat opatření',
          onclick: () => { it.removed = true; it.tr.remove(); } }, '×'))));
    rows.push(it);
    body.append(it.tr);
  };
  existing.forEach(add);
  if (!existing.length) add({ owner: S.me.name });
  const el = h('div', { class: 'lbl-paper' },
    h('table', { class: 'pp-t' }, h('colgroup', null, h('col'), h('col', { style: 'width:28%' }), h('col', { style: 'width:24%' })),
      h('thead', null, h('tr', null, h('th', null, 'Okamžitá opatření:'), h('th', null, 'Kdo'), h('th', null, 'Čas'))), body),
    h('button', { class: 'link pp-add', type: 'button', onclick: () => add({ owner: S.me.name }) }, '+ opatření'));
  return {
    el,
    read() {
      const out = [];
      for (const it of rows) {
        if (it.removed) { if (it.no) out.push({ no: it.no, remove: true }); continue; }
        const p = it.F.peek();
        if (!it.no && !p.text && !it.time.value) continue; // untouched new row
        const d = it.F.read();
        if (!d) return null;
        out.push({ no: it.no || '', text: d.text, owner: d.owner, done: it.time.value === it.t0 ? it.orig : toIso(it.time.value) });
      }
      return out;
    }
  };
}

/** ③ table "Okamžitá opatření | Kdo | Čas". An untouched new row is ignored; empty Čas = still running. */
function iaList(existing) {
  const items = [];
  const box = h('div');
  const add = v => {
    const F = makeForm(v || {});
    const item = { no: v && v.no, F, removed: false };
    item.el = h('div', { class: 'ia-row' },
      h('div', { class: 'ia-head' }, h('b', null, 'Okamžité opatření'),
        h('button', { class: 'link', type: 'button', onclick: () => { item.removed = true; item.el.remove(); } }, 'Odebrat')),
      h('div', { class: 'grid' },
        F.input('text', 'Co bylo uděláno', { req: true, wide: true, ph: 'např. paleta zablokována, zboží přetříděno' }),
        F.input('owner', 'Kdo', { req: true, list: 'people-list' }),
        F.input('done', 'Čas', { type: 'datetime-local', now: true, hint: 'Kdy bylo hotovo. Prázdné = ještě probíhá.' })));
    items.push(item);
    box.append(item.el);
  };
  existing.forEach(add);
  if (!existing.length) add({ owner: S.me.name });
  const addBtn = h('button', { class: 'btn small ghost', type: 'button', onclick: () => add({ owner: S.me.name }) }, '+ Přidat opatření');
  return {
    el: h('div', null, box, addBtn),
    read() {
      const out = [];
      for (const it of items) {
        if (it.removed) { if (it.no) out.push({ no: it.no, remove: true }); continue; }
        const p = it.F.peek();
        if (!it.no && !p.text && !p.done) continue; // untouched new row
        const d = it.F.read();
        if (!d) return null;
        out.push(Object.assign({ no: it.no || '' }, d));
      }
      return out;
    }
  };
}

/** ④ ROZHODNUTÍ OJT – shifts informed, decision, pilots, comment. Signed with your account. */
function decisionEditor(q) {

    { hint: 'Piloti dostanou e-mail a vyplní ⑤ 5 Proč a ⑥ konečné akce.' })), false);
  const onDecision = x => {
    showIf(pilots, x === 'POKRAČOVAT' || x === 'ESKALACE');
    const w = [];
    if (x === 'VYŘEŠENO' && q.repeat7 === 'ANO') w.push('Problém se opakoval v posledních 7 dnech.');
    if (x === 'VYŘEŠENO' && Number(q.wrong) > 0) w.push('Při kontrole bylo nalezeno špatně ' + q.wrong + ' ks.');
    warn.textContent = w.length ? 'Pozor: ' + w.join(' ') + ' Opravdu bez 5 Proč?' : '';
    warn.hidden = !w.length;
  };
  const shiftsAll = S.lists.shifts || [];
  const parts = {
    shifts: F.checks('shifts', 'Informace všem směnám (5\' meeting)', shiftsAll),
    decision: F.radio('decision', 'Rozhodnutí', DECISIONS.map(d => Object.assign({}, d,
      { disabled: d.value === 'VYŘEŠENO' && q.safety === 'ANO', sub: d.value === 'VYŘEŠENO' && q.safety === 'ANO' ? 'Nelze – SAFETY = ANO.' : d.sub })),
    { req: true, onchange: onDecision }),
    decisionExtra: h('div', null, warn, pilots),

  };
  const bar = h('div', null, signNote(), formButtons('Podepsat', b => {
    const d = F.read();
    if (!d) return;
    if (d.decision === 'POKRAČOVAT' && !d.pilots) { F.mark('pilots', 'Vyberte alespoň jednoho pilota.'); return; }
    if ((d.decision === 'VYŘEŠENO' || d.decision === 'ESKALACE') && !d.decisionNote) { F.mark('decisionNote', 'Napište komentář.'); return; }
    if (split(d.shifts).length < shiftsAll.length) toast('Upozornění: ne všechny směny byly informovány.');
    submit(b, 'apiSave', [q.id, 'rozhodnuti', d], 4);
  }));
  return { parts, bar };
}

/** ⑤ PŘÍČINA 5 Proč? – one input in each arrow, the root cause, the second chain; lesson and standard sit in ⑥. */
function pricinaEditor(q) {
  const F = makeForm(q);
  const roots = {};
  const chain = (c, first) => {
    const name = 'root' + c + Math.random().toString(36).slice(2);
    roots[c] = [1, 2, 3, 4, 5].map(i => h('input', { type: 'radio', name, value: i, checked: Number(q['root' + c.toUpperCase()]) === i }));
    return [1, 2, 3, 4, 5].map(i => ({
      input: F.input(c + i, c === 'o' ? i + ' PROČ ?' : 'N' + i + ' – proč nezachyceno?', { rows: 2, ph: i === 1 ? first : 'Proč se stalo to předchozí?' }),
      root: h('label', { class: 'why-root' }, roots[c][i - 1], 'kořenová příčina')
    }));
  };
  const o = chain('o', 'Proč vznikl problém?');
  const n = chain('n', 'Proč nebyl zachycen dříve?');
  const nBox = showIf(h('div', null, h('b', null, 'Proč to nebylo zachyceno?'), n.map(x => h('div', { class: 'why-row' }, x.input, x.root))),
    [1, 2, 3, 4, 5].some(i => q['n' + i]));
  const addN = h('button', { class: 'btn small ghost', type: 'button', hidden: !nBox.hidden,
    onclick: () => { nBox.hidden = false; addN.hidden = true; } }, '+ Proč nebylo zachyceno?');
  const stdRef = showIf(h('div', null, F.input('stdRef', 'Který standard', { req: true })), q.std === 'ANO');
  const parts = {
    o,
    nChain: h('div', null, nBox, addN),
    learned: F.input('learned', 'Co jsme se naučili z QR?', { rows: 2, hint: 'Povinné pro uzavření.' }),
    std: h('div', null, F.yesno('std', 'Příležitost k aktualizaci STANDARDU?', { hint: 'ANO vytvoří akci „Aktualizovat standard“.',
      onchange: x => showIf(stdRef, x === 'ANO') }), stdRef)
  };
  const bar = formButtons('Uložit analýzu', b => {
    const d = F.read();
    if (!d) return;
    ['o', 'n'].forEach(c => { const r = roots[c].find(x => x.checked); d['root' + c.toUpperCase()] = r ? r.value : ''; });
    const filled = [1, 2, 3, 4, 5].filter(i => d['o' + i]).length;
    if (filled < 3) toast('Upozornění: vyplněno jen ' + filled + ' Proč – obvykle je potřeba aspoň 3.');
    submit(b, 'apiSave', [q.id, 'pricina', d], 5);
  });
  return { parts, bar };
}
