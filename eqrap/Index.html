<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<!-- The QR code library for the phone photo hand-off is loaded only when needed (qrLib), so it never delays the start. -->
<style>
/* =====================================================================
   eQRAP – stylesheet. Light green-grey page, white cards with a soft shadow,
   dark slate headers on the paper form, one green for actions.
   Change colours only here (:root). One definition per selector – search
   for a class name and you find the one place that styles it.
   ===================================================================== */
:root {
  --ink: #151B1F; --ink-2: #374148; --ink-3: #6b757e;
  --line: #dfe4e1; --line-2: #cbd3cf; --page: #ecf2e8; --panel: #ffffff; --soft: #f5f7f5; --zebra: #fafbfa; --tray: #e1e6e3;
  --accent: #66B539; --accent-ink: #3f7d1f; --accent-dark: #57a02e; --accent-deep: #3a7a32; --accent-deeper: #2f6629;
  --accent-soft: #E8F7DD; --accent-tint: #e5f1dd;
  --warm: #b8501d; --warm-soft: #fce8dc;
  --bad: #b8322a; --warn: #8a5300;
  --slate: #34444c; --slate-2: #57676f; --slate-ink: #e6ecee;
  --viz: #4f9a2a; --viz-track: #e3e8e4;  /* chart: one green series, validated >= 3:1 on white */
  --r: 10px;
  --shadow: 0 1px 2px rgba(21,27,31,.05), 0 3px 10px rgba(21,27,31,.05);
  /* layout: flexible caps, side margins grow with the screen */
  --gutter: clamp(12px, 2vw, 40px); --w-wide: 84rem; --w-mid: 72rem; --w-form: 50rem; --w-paper: 120rem;
  /* one spacing scale */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 64px;
  --tap: 42px; --tap-s: 34px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 "Segoe UI", -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1 { font-size: 24px; line-height: 1.25; font-weight: 700; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 16px; font-weight: 650; margin: 0; }
h3 { font-size: 14px; font-weight: 650; margin: 0 0 12px; }
p { margin: 0 0 8px; }
a { color: var(--accent-ink); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, [role=button]:focus-visible, .strip:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.grow { flex: 1; }
.muted, .sub { color: var(--ink-3); }
.sub { font-size: 13px; }
.small { font-size: 13px; }
.late-txt { font-weight: 700; color: var(--ink); }
.wide { grid-column: 1 / -1; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.top { background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 1px 3px rgba(21,27,31,.04); position: sticky; top: 0; z-index: 10; }
.top-in { width: 100%; max-width: calc(var(--w-wide) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); height: 60px; display: flex; align-items: center; gap: 32px; }
.brand { display: flex; align-items: center; background: none; border: 0; padding: 0; font-size: 21px; font-weight: 800; letter-spacing: .04em; color: var(--ink); }
nav { display: flex; gap: 4px; height: 100%; }
.nav { background: none; border: 0; padding: 0 12px; height: 100%; color: var(--ink-2); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav:hover { color: var(--ink); }
.nav.on { color: var(--accent-ink); border-bottom-color: var(--accent); }
.top-right { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-tint); color: var(--accent-ink); display: grid; place-items: center;
  font-size: 13px; font-weight: 700; flex: none; border: 1px solid #cfe3c2; }
.who { display: flex; flex-direction: column; line-height: 1.2; font-size: 13px; font-weight: 600; }
.who small { color: var(--ink-3); font-weight: 400; font-size: 12px; }
.view-as { width: auto; height: 32px; min-height: 0; padding: 0 8px; font-size: 13px; }
main { width: 100%; max-width: calc(var(--w-wide) + 2 * var(--gutter)); margin: 0 auto; padding: var(--s5) var(--gutter) var(--s7); }
main.w-mid { max-width: calc(var(--w-mid) + 2 * var(--gutter)); }
main.w-form { max-width: calc(var(--w-form) + 2 * var(--gutter)); }
main.w-paper { max-width: calc(var(--w-paper) + 2 * var(--gutter)); }

/* ---------- page head + breadcrumb ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--ink-3); }
.crumbs button:hover { color: var(--ink); text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 600; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head .sub { margin-top: 4px; font-size: 14px; }
.head-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.intro { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px; color: var(--ink-3); margin-top: 6px; line-height: 1.4; }
.intro .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; color: var(--ink-2); background: #fff; }
.intro .chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-3); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; border-radius: 7px;
  border: 1px solid var(--line-2); background: #fff; color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--soft); border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(47,102,41,.25); }
.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn.primary.hero-btn { background: var(--accent-deep); border-color: var(--accent-deep); height: 44px; padding: 0 22px; font-size: 15px; }
.btn.primary.hero-btn:hover { background: var(--accent-deeper); border-color: var(--accent-deeper); }
.btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: none; box-shadow: none; color: var(--ink-2); padding: 0 10px; }
.btn.ghost:hover { color: var(--ink); background: var(--soft); }
.btn.small { min-height: var(--tap-s); padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn-cta { min-height: 44px; padding: 0 22px; font-size: 15px; }
.btn-muted { min-height: 44px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* ---------- panels ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
.card > h2 { margin-bottom: 14px; }
.p-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.p-head h2 { margin: 0; }

/* ---------- fields ---------- */
.fld { display: block; }
.fld-l { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.req { color: var(--bad); font-weight: 400; }
.opt { font-weight: 400; color: var(--ink-3); font-size: .85em; margin-left: 6px; }
.fld small { display: block; font-size: 13px; color: var(--ink-3); margin-top: 6px; }
.info { display: inline-grid; place-items: center; width: 26px; height: 26px; margin: -6px 0 -6px 4px; border-radius: 50%; color: var(--ink-3); cursor: pointer; vertical-align: middle; }
.info:hover, .info.on { color: var(--accent-ink); background: var(--accent-soft); }
.info .ico { width: 15px; height: 15px; }
::placeholder { color: #9aa3ab; }
input, select, textarea { width: 100%; height: var(--tap); padding: 0 12px; border: 1px solid var(--line-2); border-radius: 7px; background: #fff;
  font: inherit; color: var(--ink); }
textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
input[type=checkbox], input[type=radio] { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: var(--accent-ink); flex: none; }
input[type=file] { height: auto; border: 0; padding: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox]:focus, input[type=radio]:focus { box-shadow: none; }
input[type=checkbox]:focus-visible, input[type=radio]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fld.invalid input, .fld.invalid select, .fld.invalid textarea { border-color: var(--bad); box-shadow: 0 0 0 3px #f8e3e1; }
.fld.invalid .fld-l { color: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 28px; align-items: start; }
.grid + .grid { margin-top: 22px; }
.sub-h { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em;
  padding-top: 16px; border-top: 1px solid var(--line); margin-top: 4px; }
.grid > .sub-h:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check, .check-line { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; font-weight: 400; }
.checks .check { border: 1px solid var(--line-2); border-radius: 7px; padding: 7px 13px; background: #fff; }
.checks .check.on, .checks .check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; border: 1px solid var(--line-2); border-radius: 7px; padding: 10px 14px; background: #fff; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-top: 2px; }
.choice b { font-weight: 400; }
.choice:has(input:checked) b { font-weight: 600; }
.choice small { display: block; color: var(--ink-3); font-size: 13px; }
.choices.inline { flex-direction: row; gap: 8px; flex-wrap: wrap; }
.choices.inline .choice { padding: 7px 16px; align-items: center; }
.choices.inline .choice input { margin: 0; }
.with-btn { display: flex; gap: 8px; }
.with-btn input { flex: 1; min-width: 0; }
.form-btns { display: flex; gap: 10px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.note { font-size: 14px; color: var(--ink-2); padding: 10px 0; }
.note.warn { color: var(--warn); }
.qty-pair { display: flex; gap: 8px; }
.qty-pair > input { flex: 1 1 55%; min-width: 0; }
.qty-pair > .fld, .form-rows .qty-pair > .fld { flex: 1 1 45%; display: block; padding: 0; border: 0; min-width: 0; }
.pair-f { display: flex; flex-direction: column; gap: 10px; }

/* ---------- forms: question on the left (bold), answer on the right; related questions in a rounded box ---------- */
.form-rows .grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
.form-rows .grid + .grid { margin-top: 18px; }
.form-rows .fld { display: grid; grid-template-columns: minmax(170px, 32%) minmax(0, 1fr); column-gap: 24px; row-gap: 4px;
  align-items: center; padding: 8px 12px; }
.form-rows .fld-l { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.35; }
.form-rows .fld > :not(.fld-l) { grid-column: 2; }
.form-rows .fld small { margin-top: 2px; }
.form-rows .q-group { border: 1px solid var(--line); border-radius: 9px; background: #fff; }
.form-rows .q-group > .fld + .fld { border-top: 1px solid var(--line); }
.form-rows .sub-h { font-size: 12.5px; color: var(--accent-ink); border: 0; padding: 14px 12px 2px; margin: 0; }
.form-rows .grid > .sub-h:first-child { padding-top: 0; }
.form-rows .pair-f { gap: 0; }
.form-rows .pair-f .pslot, .form-rows .note.wide { margin-left: calc(max(170px, 32%) + 36px); }
.form-rows .pair-f .pslot { padding-bottom: 12px; }
.form-rows .pslot .ph { max-width: 340px; height: 200px; }
.form-rows .ia-row { margin-top: 10px; }
.form-rows .why-row { margin: 0; align-items: center; }
.form-rows .why-root { padding-bottom: 0; }
.form-rows .checks, .form-rows .choices.inline { padding-top: 2px; }

/* ---------- new QRAP: arrow steps on top, then one card ---------- */
.wiz-steps { display: block; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
.wiz-list { display: flex; background: var(--line-2); } /* the 2 px gaps between the arrows show this colour */
.wiz-step { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 50px; margin-left: -12px; padding: 0 14px 0 26px;
  background: #fff; border: 0; color: var(--ink-2); font-size: 13.5px; font-weight: 550; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%); }
.wiz-step:first-child { margin-left: 0; padding-left: 12px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); }
.wiz-step:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 14px 50%); }
.wiz-step .ico { width: 17px; height: 17px; color: var(--ink-3); }
.wiz-step:hover { background: var(--soft); }
.wiz-step.done { color: var(--ink); }
.wiz-step.done .ico { color: var(--accent-ink); }
.wiz-step.on { background: #e3e8e5; color: var(--ink); font-weight: 650; }
.wiz-step.on .ico { color: var(--ink); }
.shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.shell-body { padding: 12px 16px 6px; }
.shell-inner { max-width: 1100px; }
.shell-sub { background: #e4e8e5; border-bottom: 1px solid var(--line-2); padding: 14px 18px; font-size: 17px; font-weight: 700; margin: 0; outline: none; }
.shell .step > .grid:first-child > .sub-h:first-child { display: none; }
.shell .step > .grid + .grid, .shell .step > .grid + div { margin-top: 18px; }
.review-part { padding: 18px 0; border-top: 1px solid var(--line); }
.review-part:first-of-type { border-top: 0; padding-top: 4px; }
.review-part > h3 { color: var(--accent-ink); padding: 0 12px; }
.shell-foot { display: flex; gap: 10px; align-items: center; padding: 14px 16px; margin-top: 16px; border-top: 1px solid var(--line); background: var(--soft); }

/* ---------- board: status cards, filters, table ---------- */
.flash { display: flex; gap: 14px; align-items: center; padding: 12px 16px; margin-bottom: 18px; border: 1px solid #cfe8bf; background: var(--accent-soft);
  border-radius: var(--r); color: var(--accent-ink); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 16px; text-align: left;
  display: flex; flex-direction: row; align-items: center; gap: 12px; }
button.stat:hover { border-color: var(--line-2); }
.stat.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), var(--shadow); }
.stat-top { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink); font-weight: 650; }
.stat-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.stat-t small { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.ibox { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--accent-ink); background: var(--accent-tint); flex: none; }
.ibox .ico { width: 17px; height: 17px; }
.stat b { font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stat-late .ibox { background: var(--warm-soft); color: var(--warm); }
.stat-late b { color: var(--warm); }
.stat .spark { display: block; height: 18px; margin-top: 4px; width: 110px; }
.stat .meter { margin-top: 6px; width: 110px; }
.spark rect { fill: var(--viz); }
.meter { height: 6px; background: var(--viz-track); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--viz); }
.toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar select, .toolbar .btn, .toolbar .search input { height: 30px; min-height: 30px; font-size: 12.5px; border-radius: 6px; }
.toolbar select { width: auto; min-width: 112px; padding: 0 6px; }
.toolbar .btn { padding: 0 10px; gap: 5px; box-shadow: none; }
.toolbar .btn .ico { width: 14px; height: 14px; }
.search { position: relative; width: 260px; max-width: 100%; }
.search .ico { position: absolute; left: 10px; top: 50%; width: 16px; height: 16px; margin-top: -8px; color: var(--ink-3); }
.search input { height: var(--tap-s); min-height: 0; font-size: 13px; padding-left: 32px; }
.toolbar .search { width: 220px; }
.toolbar .search input { padding-left: 28px; }
.toolbar .search .ico { width: 14px; height: 14px; left: 9px; margin-top: -7px; }
.tbl-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.tbl-scroll { overflow-x: auto; }
.empty { padding: 40px 0; color: var(--ink-3); text-align: center; }
.tbl-foot { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.tbl-foot select { width: auto; height: 32px; font-size: 13px; padding: 0 8px; }
.pager { display: flex; gap: 6px; }
.pager .btn { min-width: var(--tap-s); padding: 0; }
.more { padding-top: 14px; font-size: 14px; color: var(--ink-3); }

/* status words: plain text */
.badge { font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.badge.ok { color: var(--accent-ink); }
.badge.bad { color: var(--bad); }
.badge.muted { color: var(--ink-3); }
.tag { font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .03em; }
.tag.bad { color: var(--bad); }

/* ---------- QRAP page ---------- */
.d-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 0 0 14px; flex-wrap: wrap; }
.d-head h1 { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; font-size: 24px; }
.d-head h1 .badge { font-size: 15px; }
.next-bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 12px 18px; margin-bottom: 14px; }
.next-bar .next { flex: 1; min-width: 260px; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.next-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.next { display: flex; flex-direction: column; gap: 4px; }
.next .lbl { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.next b { font-size: 15px; }
.next.ok b { color: var(--accent-ink); }
.box { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
.box.ok { background: var(--accent-soft); border-color: #cfe8bf; }
.box.ok > b { color: var(--accent-ink); }
.act { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act-no { color: var(--ink-3); font-size: 13px; font-weight: 700; }
.act.done .act-text { color: var(--ink-3); }
.act-btns { display: flex; gap: 6px; }
.act-form, .ia-row { padding: 18px; border: 1px solid var(--line); border-radius: 9px; margin-top: 12px; background: var(--soft); }
.ia-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 650; }
.why-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; margin-bottom: 12px; }
.why-root { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding-bottom: 12px; white-space: nowrap; cursor: pointer; }
.checklist { list-style: none; margin: 10px 0; padding: 0; }
.checklist li { padding: 3px 0; }
.checklist .ok { color: var(--accent-ink); font-weight: 700; }
.checklist .no { color: var(--bad); font-weight: 700; }
.slots-wrap { overflow-x: auto; }
.slots, table.roles, table.people { width: 100%; border-collapse: collapse; font-size: 14px; }
.slots th, .slots td, .roles th, .roles td, .people th, .people td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.slots th, .roles th, .people th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--soft); }
.roles td:not(:first-child), .roles th:not(:first-child) { text-align: center; width: 110px; }
.slots input, .slots select { height: 36px; min-width: 120px; }

.assess-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.assess-item .badge { margin-right: 12px; }
.pslot > b { display: block; font-size: 13px; font-weight: 650; margin-bottom: 8px; }
.ph { width: 100%; height: 190px; border: 1px dashed var(--line-2); border-radius: 8px; background: var(--soft); display: grid; place-items: center;
  color: var(--ink-3); font-size: 13px; overflow: hidden; padding: 0; margin-bottom: 8px; position: relative; cursor: pointer; }

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 50; cursor: zoom-out; }

.inline-form { display: flex; gap: 10px; flex-wrap: wrap; }
details.admin-box > summary, details.more-stats > summary, details.roles-more > summary { cursor: pointer; font-weight: 650; color: var(--ink-2); min-height: var(--tap-s);
  display: flex; align-items: center; gap: 8px; list-style: none; }

/* ---------- Přehled manažera ---------- */
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.cols3 > .card, .cols2 > .card { margin-bottom: 0; }

.hbar-t { height: 10px; background: var(--viz-track); border-radius: 0 3px 3px 0; }

/* ---------- the paper form QRAP V3.0: board strips and the QRAP page ----------
   Same blocks and order as the paper: ① ② ③ (operator) · ④ (supervisor) · ⑤ ⑥ (pilots) · ⑦ (supervisor / manager).
   Column widths are the paper's proportions (--pp-cols). The whole form sits in one white card. */
.pp-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 1.5px solid #b7c2bc; border-radius: 14px;
  box-shadow: var(--shadow); padding: 12px 12px 14px; }
/* each QRAP is one framed sheet: light grey with a clear border; the boxes on it are white */
.strip, .paper.big .pp-body { background: #eef0ef; border: 1.5px solid #97a39d; border-radius: 12px; box-shadow: var(--shadow); }
.strip { padding: 8px 10px 10px; }
.paper.big .pp-body { padding: 10px; }
.paper { --pp-cols: 4.3fr 1.15fr 3.15fr 1.8fr 1.75fr 3.75fr 1.9fr; --pp-c1: 4.3fr 1.15fr 3.15fr; --pp-c3: 1.75fr 3.75fr; --pp-gap: 8px;
  --pp-line: #a7b2ac; --pp-ink: #23292d; font-size: 13px; line-height: 1.42; color: var(--ink); min-width: 1240px; }
.paper.big { --pp-cols: 5.2fr 1.9fr 3.6fr 2.6fr 2.4fr 3.8fr 2.5fr; --pp-c1: 5.2fr 1.9fr 3.6fr; --pp-c3: 2.4fr 3.8fr; min-width: 1440px; }
.paper.compact { font-size: 12px; min-width: 1100px; --pp-cols: 4.8fr 1fr 3.1fr 1.7fr 1.6fr 3.5fr 1.95fr; --pp-c1: 4.8fr 1fr 3.1fr; --pp-c3: 1.6fr 3.5fr; }
.paper .sub { font-size: .9em; }
.pp-row { display: grid; grid-template-columns: var(--pp-cols); column-gap: var(--pp-gap); }
.g1 { grid-column: 1 / 4; } .g2 { grid-column: 4 / 5; } .g3 { grid-column: 5 / 7; } .g4 { grid-column: 7 / 8; }
/* the two header rows: who fills it (thin strip) and the big title (dark slab) */
.pp-bands { margin-bottom: 5px; align-items: stretch; }
.pp-band { display: flex; align-items: center; justify-content: center; text-align: center; background: var(--slate-2); color: var(--slate-ink);
  border-radius: 5px; padding: 3px 8px; font-size: 10.5px; line-height: 1.3; }
.pp-band b { color: #fff; font-weight: 700; }
.pp-band.dark { background: var(--slate); }
.paper.compact .pp-band { font-size: 9.5px; padding: 2px 6px; }
.pp-heads { margin-bottom: 10px; align-items: stretch; }
.pp-h { border-radius: 8px; display: grid; place-items: center; text-align: center; padding: 9px 10px; font-weight: 800; line-height: 1.1; color: #fff; background: var(--slate); }
.pp-h .big { font-size: 20px; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.pp-h .mid { font-size: 13px; font-weight: 500; color: var(--slate-ink); text-wrap: balance; }
.pp-h small { display: block; font-size: 12px; font-weight: 500; color: #c9d4d8; margin-top: 3px; }
.pp-h.g1 { grid-template-columns: var(--pp-c1); column-gap: var(--pp-gap); }
.pp-h.g3 { grid-template-columns: var(--pp-c3); column-gap: var(--pp-gap); }
.paper.compact .pp-h { padding: 7px 6px; }
.paper.compact .pp-h .big { font-size: 14px; }
.paper.compact .pp-h .mid { font-size: 11px; }
.paper.compact .pp-h small { font-size: 10.5px; }
/* body: grey trays with white boxes */
.pp-body { align-items: stretch; }
.pp-g { padding: 0; min-width: 0; }
.pp-g.g1 { display: grid; grid-template-columns: var(--pp-c1); column-gap: var(--pp-gap); }
.pp-g.g2 { display: flex; }
.pp-g.g3 { display: grid; grid-template-columns: var(--pp-c3); column-gap: var(--pp-gap); }
.pp-g.g4 { background: #fff; border: 1px solid var(--pp-line); border-radius: 8px; box-shadow: 0 1px 2px rgba(21,27,31,.08); padding: 4px; display: flex; }
.pp-cell { position: relative; min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; border-radius: 6px; }
.pp-cell.now { outline: 2px solid var(--bad); outline-offset: 2px; background: #fdf2f1; }
.pp-cell.can-edit { cursor: pointer; }
.pp-cell.can-edit:hover { outline: 2px dashed var(--accent); outline-offset: 2px; }
.pp-cell.now.can-edit:hover { outline: 2px solid var(--bad); }
.pp-ed { align-self: flex-end; display: flex; }
.pp-box { background: #fff; border: 1px solid var(--pp-line); border-radius: 6px; padding: 6px 8px; min-width: 0; box-shadow: 0 1px 2px rgba(21,27,31,.08); }
.paper.compact .pp-box { padding: 5px 7px; }
.pp-l { display: block; font-weight: 700; font-size: .9em; color: #1c2a31; margin-bottom: 4px; letter-spacing: .01em; }
.pp-l.light { font-weight: 400; color: var(--ink-3); font-style: italic; }
.pp-v, .pp-txt { overflow-wrap: break-word; font-weight: 400; color: #46535a; }
.pp-txt { white-space: pre-wrap; }
.paper.compact .pp-txt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
.pp-empty { color: #b9c0c4; }
.pp-more { font-size: .9em; color: var(--ink-3); }
.cb { display: inline-flex; align-items: baseline; gap: 6px; margin-right: 8px; color: var(--ink-3); font-weight: 400; }
.cb.on { color: #2b383e; }
.cb i { width: 11px; height: 11px; border: 1.5px solid #7f8b86; border-radius: 2px; flex: none; position: relative; top: 1px; background: #fff; }
.cb.on i { background: var(--accent-deep); border-color: var(--accent-deep); }
.cb.on i::after { content: '✓'; color: #fff; font-size: 9px; line-height: 9px; position: absolute; left: 1px; top: 0; font-style: normal; font-weight: 700; }
.cb-list .cb { display: flex; margin: 0 0 4px; }
/* ① */
.p1 { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 5px; flex: 1; }
.p1-no { background: #fff; border: 1px solid var(--pp-line); border-radius: 6px; box-shadow: 0 1px 2px rgba(21,27,31,.08); padding: 6px 8px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.p1-id { font-size: 1.45em; font-weight: 800; line-height: 1.1; white-space: nowrap; letter-spacing: .01em; }
.paper.compact .p1-id { font-size: 1.25em; }
.p1-safety { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .92em; color: var(--accent-ink); }
.p1-safety i { width: 8px; height: 8px; border-radius: 50%; background: var(--viz); flex: none; }
.p1-safety.on { color: var(--bad); }
.p1-safety.on i { background: var(--bad); }
.p1-no.safety { background: var(--bad); border-color: #8f241e; color: #fff; }
.p1-no.safety .p1-id, .p1-no.safety .p1-safety, .p1-no.safety .choice, .p1-no.safety b { color: #fff; }
.p1-no.safety .p1-safety i { background: #fff; }
.p1-co { grid-column: 2 / 4; }
.p1-rep { grid-column: 1 / 3; }
.p1-popis { grid-column: 1 / 4; }
.p1-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 3px; }
.pp-part em { display: block; font-style: normal; font-weight: 700; font-size: .9em; color: var(--ink); margin-bottom: 2px; }
.pp-ph { display: block; width: 100%; height: 120px; border: 1px solid var(--pp-line); border-radius: 6px; overflow: hidden; margin-top: 4px; padding: 0;
  background: var(--soft); color: var(--ink-3); font-size: 12px; cursor: zoom-in; }
.pp-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pp-cam { margin-top: 4px; }
.ph-btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.on-desk { display: none; }
/* a mouse on a PC: no camera button (it would only open the file dialog as well) */
@media (hover: hover) and (pointer: fine) {
  .ph-cam { display: none; }
  .on-touch { display: none; }
  .on-desk { display: inline; }
}
.pp-flag { font-size: .9em; color: var(--ink-2); }
/* ③ ⑥ tables */
.pp-t { width: 100%; border-collapse: collapse; background: #fff; table-layout: fixed; }
.pp-t th, .pp-t td { border: 1px solid #c6cec9; padding: 3px 5px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.pp-t th { font-weight: 700; font-size: .92em; background: #eef2ef; }
.paper.compact .pp-t th, .paper.compact .pp-t td { padding: 2px 3px; }
.paper.compact .pp-t th { font-size: .82em; white-space: nowrap; overflow: hidden; }
.pp-grow { flex: 1; background: #fff; border: 1px solid var(--pp-line); border-radius: 6px; overflow: hidden; box-shadow: 0 1px 2px rgba(21,27,31,.08); }
.pp-grow .pp-t { border: 0; }
/* ④ */
.p4-dec .cb { display: flex; margin: 0 0 4px; }
.p4-sh { display: flex; flex-wrap: wrap; gap: 2px 0; }
.p4-sh .cb { margin-right: 10px; }
/* ⑤ – each "Proč" is a small arrow pointing to the next one */
.p5 { flex: 1; display: flex; }
.p5-in { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.p5-w { position: relative; isolation: isolate; flex: 1; min-height: 3.2em; padding: 4px 8px 13px; text-align: center; background: #9aa6a0;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), 50% 100%, 0 calc(100% - 9px)); }
.p5-w::before { content: ''; position: absolute; inset: 1px; z-index: -1; background: #fff;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), 50% 100%, 0 calc(100% - 9px)); }
.p5-w > b { display: block; font-size: .92em; }
.p5-w .pp-txt { text-align: left; }
.p5-w.root { background: #8fbf73; }
.p5-w.root::before { background: var(--accent-soft); }
.p5-root { display: block; font-size: .85em; font-weight: 700; color: var(--accent-ink); }
.p5-n { font-size: .9em; background: #fff; border: 1px solid var(--pp-line); border-radius: 6px; padding: 4px 6px; box-shadow: 0 1px 2px rgba(21,27,31,.08); }
/* ⑥ */
.p6-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.p6-eff { display: flex; gap: 3px; margin-top: 3px; }
.p6-eff span { width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid #7f8b86; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.p6-eff span.on { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
.pp-late { font-weight: 800; }
/* ⑦ */
.p7 { padding: 4px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.p7-c .cb { font-weight: 700; color: var(--ink); margin: 0; }
.paper.compact .p7-c .cb { font-size: .92em; }
.p7-sub { font-style: italic; font-size: .9em; padding-left: 17px; color: var(--ink-3); }
.p7-res { font-weight: 700; margin-left: 4px; }
.p7-who { margin-top: auto; }
.paper.compact .p7-sub, .paper.compact .pp-hint { display: none; }
/* typing straight into the paper: same boxes, same size – the texts become plain fields with a dashed green line */
.pp-cell.pp-edit { outline: 2px solid var(--accent); outline-offset: 3px; }
.vh, .lbl-paper .fld-l { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pp-edit .fld + .fld, .pp-edit .q-group > .fld + .fld { margin-top: 3px; }
.pp-edit .fld-l { font-size: .82em; font-weight: 600; color: var(--ink-3); margin: 3px 0 1px; }
.pp-edit input:not([type=checkbox]):not([type=radio]), .pp-edit select {
  height: 24px; padding: 0 4px; font-size: inherit; border: 0; border-bottom: 1.5px dashed var(--accent); border-radius: 3px 3px 0 0; background: #f3f9ef; }
.pp-edit textarea { min-height: 2.8em; padding: 2px 4px; font-size: inherit; line-height: 1.35; border: 1.5px dashed var(--accent); border-radius: 4px; background: #f3f9ef; }
.pp-edit input:focus, .pp-edit select:focus, .pp-edit textarea:focus { background: #fff; border-color: var(--accent-ink); box-shadow: 0 0 0 2px var(--accent-soft); }
.pp-edit input[type=date]::-webkit-calendar-picker-indicator, .pp-edit input[type=time]::-webkit-calendar-picker-indicator { display: none; }
.pp-edit input[type=checkbox], .pp-edit input[type=radio] { width: 13px; height: 13px; }
.pp-edit .checks { flex-direction: column; gap: 2px; }
.pp-edit .p4-sh-e .checks { flex-direction: row; gap: 2px 10px; }
.pp-edit .checks .check, .pp-edit .checks .check.on, .pp-edit .checks .check:has(input:checked) { border: 0; padding: 0; background: none; font-size: inherit; gap: 6px; }
.pp-edit .choices, .pp-edit .choices.inline { flex-direction: row; flex-wrap: wrap; gap: 2px 12px; padding: 0; }
.pp-edit .p4-dec .choices { flex-direction: column; gap: 4px; }
.pp-edit .choice, .pp-edit .choices.inline .choice, .pp-edit .choice:has(input:checked) { border: 0; padding: 0; background: none; gap: 6px; font-size: inherit; align-items: center; }
.pp-edit .choice small, .pp-edit .fld small { display: none; }
.pp-edit .with-btn { gap: 4px; }
.pp-edit .with-btn .btn { min-height: 24px; padding: 0 6px; font-size: 11.5px; }
.pp-edit .grid { grid-template-columns: minmax(0, 1fr); gap: 3px; margin: 0; }
.pp-edit .note { padding: 2px 0; font-size: 11px; }
.pp-edit .why-root { padding: 2px 0 0; font-size: 11px; white-space: normal; gap: 5px; }
.pp-edit .why-row { display: block; margin: 4px 0 0; }
.pp-edit .p5-w { text-align: left; padding-bottom: 14px; }
.pp-edit .p5-w > b { text-align: center; }
.pp-edit .qty-pair { gap: 4px; }
.pp-edit .qty-pair > input { flex: 0 0 40px; }
.pp-edit .qty-pair > .fld { flex: 1 1 auto; }
.pp-edit .pp-t td { padding: 2px 3px; }
.pp-mini { font-size: .9em; color: var(--ink-3); margin-top: 4px; }
.p1-safety-e { display: flex; flex-direction: column; gap: 2px; }
.when-split > div { display: flex; align-items: center; gap: 2px 4px; flex-wrap: wrap; }
.when-split input { flex: 1 1 auto; min-width: 0; }
.when-split input[type=date] { min-width: 98px; }
.p1-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
.pp-rowbtns { display: flex; gap: 8px; margin-top: 2px; font-size: 11.5px; }
.pp-rowbtns .pp-del { color: var(--bad); font-size: 14px; line-height: 1; }
.link.pp-add { display: block; padding: 4px 6px; font-size: 12px; }
.pp-actrow { background: var(--accent-soft); }
.pp-t tr.pp-click { cursor: pointer; }
.pp-t tr.pp-click:hover td { background: var(--accent-soft); }
.btn.pp-done { min-height: 24px; padding: 0 7px; font-size: 12px; }
/* Uložit / Zrušit while typing into the paper: a small bar at the bottom of the screen, so the paper keeps its size */
.float-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  max-width: calc(100vw - 32px); background: #fff; border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 6px 24px rgba(21,27,31,.18); padding: 10px 16px; }
.float-bar .form-btns { margin: 0; }
.float-bar > div { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.float-bar .sub { margin: 0; }
body:has(.float-bar) .toast { bottom: 92px; }
/* SAFETY = ANO: the whole form gets a red frame */
.shell-card.safety, .pp-wrap.safety, .strip.safety, .strip.safety:hover { border: 3px solid var(--bad); box-shadow: 0 0 0 3px #f8e3e1; }
/* board: one paper strip per QRAP */
.strip { margin-top: 14px; cursor: pointer; outline: none; }
.strip-cap { display: flex; gap: 10px; align-items: baseline; padding: 0 4px 6px; font-size: 13px; flex-wrap: wrap; }
.strip-cap > b:first-child { font-size: 14px; }
.strip-cap .open-l { color: var(--accent-ink); font-weight: 650; }
.strip-cap .badge { margin-right: 6px; }
.strip:hover, .strip:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }

/* ---------- Jak to funguje: a short visual guide ---------- */
.howto-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
.howto-step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.howto-step .hs-top { display: flex; align-items: center; gap: 10px; }
.howto-step .hs-n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px; flex: none; }
.howto-step .hs-ico { color: var(--accent-ink); margin-left: auto; }
.howto-step .hs-ico .ico { width: 22px; height: 22px; }
.howto-step b { font-size: 15px; }
.howto-step p { margin: 0; color: var(--ink-2); font-size: 14px; }
.howto-step.send { background: var(--accent-soft); border-color: #cfe8bf; }
.howto-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 0 0 10px; }
.flow2 { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-bottom: 22px; }
.flow2 > div { flex: 1 1 170px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; }
.flow2 > div b { display: block; margin-bottom: 2px; }
.flow2 > div span { font-size: 13px; color: var(--ink-2); }
.flow2 > .arrow { flex: 0 0 auto; border: 0; background: none; box-shadow: none; padding: 0; display: grid; place-items: center; color: var(--ink-3); }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 8px;
  font-size: 14px; font-weight: 500; z-index: 80; max-width: 92vw; display: flex; align-items: center; gap: 14px; }
.toast.bad { background: var(--bad); }
.toast button { flex: none; background: none; border: 1px solid rgba(255,255,255,.65); color: #fff; border-radius: 6px; padding: 4px 12px; font-weight: 650; }
.toast button:hover { background: rgba(255,255,255,.12); }

/* ---------- waiting: never an empty wait (thin bar on top, spinner in the button, a card with what happens + tips) ---------- */
.topbar { position: fixed; left: 0; top: 0; height: 3px; width: 0; background: var(--accent); z-index: 100; opacity: 0; pointer-events: none;
  transition: width .25s ease-out, opacity .4s; box-shadow: 0 0 6px rgba(102,181,57,.55); }
.topbar.on { opacity: 1; }
.spin { display: inline-block; width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
  animation: spin .7s linear infinite; flex: none; vertical-align: -2px; }

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<datalist id="people-list"></datalist>

<!-- All data the page starts with. JSON only, never run as code; "<" arrives escaped from doGet. -->
<script type="application/json" id="boot"><?!= boot ?></script>

<script>
'use strict';
/* =====================================================================================
   eQRAP Expedice (Lite) – the whole screen.
   The questions are the ones of the firm's QRAP V3.0 form (logistics version), ① to ⑦.
   All data arrives together with the page (#boot), so moving around is instant.
   The server is called only to save, to open a QRAP (answered "unchanged" when nothing changed),
   and for a quiet refresh every 90 s of the board or the open QRAP (nothing is read when nothing changed).

   Lists arrive compact ({ k: column names, r: rows }) and are turned into objects once (loadLists).
   Lookups by QRAP number use Maps that are rebuilt only when a list is replaced (never patched in place).

   NO EMPTY WAITING (2b): every wait shows a spinner, a bar on top, then what is happening and tips.
   SAFETY: unsaved work is never lost by one click (2c: questions before leaving, a draft of a new QRAP in this
   browser), important steps are confirmed (ask), a save locks the page until it is done, and two people
   cannot overwrite each other's changes (fingerprints, fpOf – the server refuses and the page asks).

   1. State and texts      4. Board (Tabule)           7. Forms (① … ⑦)
   2. Small helpers        5. New problem (Nahlásit)   8. Photos (kiosk camera + phone hand-off)
   2b. Waiting  2c. Unsaved work  3. Header and routing  6. Problem detail ①–⑦  9. Dashboard, Správa, help, refresh, start
   ===================================================================================== */

// ------------------------------------------------------------------ 1. STATE AND TEXTS
const BOOT = readBoot();
function readBoot() {
  try { return JSON.parse(document.getElementById('boot').textContent) || {}; }
  catch (e) { return { error: 'Data aplikace se nepodařilo načíst. Obnovte prosím stránku.' }; }
}
const S = {
  me: BOOT.me || {}, cfg: BOOT.cfg || {}, lists: BOOT.lists || {}, people: BOOT.people || [], meta: BOOT.meta || {},
  qraps: [], actions: [], effects: [], assess: [], all: false, ver: BOOT.ver || '',
  view: 'board', id: null, edit: null, editMode: 'panel', filter: 'open', area: '', range: '', search: '', page: 0, per: 10,
  history: {}, flash: null, adm: null, dashList: 'open', loadedAt: Date.now(), newBuild: false
};
const isManager = () => S.me.role === 'MANAŽER' || S.me.role === 'ADMIN';
const isAdmin = () => S.me.role === 'ADMIN';

const STATUS = {
  'OPATŘENÍ':   { label: '③ Opatření', cls: 'warn', next: '③ Okamžitá opatření', who: 'kdokoli ze směny (TL)' },
  'ROZHODNUTÍ': { label: '④ Rozhodnutí', cls: 'warn', next: '④ Rozhodnutí OJT', who: 'supervizor' },
  'ANALÝZA':    { label: '⑤ 5 Proč', cls: 'step', next: '⑤ 5 Proč a ⑥ konečné akce', who: 'piloti' },
  'AKCE':       { label: '⑥ Akce', cls: 'step', next: '⑥ Konečné akce', who: 'piloti akcí' },
  'OVĚŘENÍ':    { label: '⑥ Ověření 5 směn', cls: 'step', next: '⑥ Efektivita 5 směn, potom podpis uzavření', who: 'kdokoli ze směny' },
  'SCHVÁLENÍ':  { label: 'Ke schválení', cls: 'warn', next: 'Podpis uzavření', who: 'kdokoli' },
  'UZAVŘENO':   { label: 'Uzavřeno', cls: 'ok' },
  'ZRUŠENO':    { label: 'Zrušeno', cls: 'muted' }
};
const DECISIONS = [
  { value: 'POKRAČOVAT', label: 'Pokračovat s analýzou a 5 Proč', sub: 'Příčina není známá nebo je co se naučit → piloti dostanou e-mail.' },
  { value: 'VYŘEŠENO', label: 'Problém vyřešen: ŽÁDNÉ 5 Proč', sub: 'Opatření a OJT problém vyřešily. QRAP se hned uzavře.' },
  { value: 'ESKALACE', label: 'Eskalace na vyšší úroveň (manažer)', sub: 'Přesahuje oblast → manažeři dostanou e-mail, analýza pokračuje.' }
];
const CRITERIA = [
  ['c1', '1 RED BOX', 'Popis problému'], ['c2', '2 ROZDĚLENÍ', 'Třídění, ochrana a rozdělení úkolů'],
  ['c3', '3 POROVNÁNÍ', 'Dobrý a špatný'], ['c4', '4 POUČENÍ A SDÍLENÍ', 'Komunikace a transversalizace'],
  ['c5', '5 ON JOB TRAINING', 'OJT provedené managementem']
];
const YES_NO = [{ value: 'ANO', label: 'ano' }, { value: 'NE', label: 'ne' }];

/**
 * Fingerprints of the parts of a QRAP, exactly as Code.gs computes them (FP_FIELDS, fp_ – keep both equal).
 * A form remembers the fingerprint of what it showed; the server refuses the save if somebody changed that part since.
 */
const FP_FIELDS = {
  popis: ['safety', 'what', 'whatOther', 'how', 'howOther', 'when', 'zone', 'qty', 'unit', 'nokSituation', 'repeat7',
    'repeatRef', 'finder', 'descWrong', 'descRight', 'reference', 'notified', 'notifiedOther'],
  opatreni: ['risk', 'checked', 'wrong', 'restoredAt'],
  smeny: ['shifts'],
  pricina: ['o1', 'o2', 'o3', 'o4', 'o5', 'rootO', 'n1', 'n2', 'n3', 'n4', 'n5', 'rootN', 'learned', 'std', 'stdRef'],
  akce: ['text', 'kind', 'owner', 'due', 'done', 'evidence', 'note']
};
function fp(vals) {
  const s = vals.map(v => {
    v = String(v === null || v === undefined ? '' : v);
    return /^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(v) ? v.slice(0, 16) : v;
  }).join('\u001f');
  let x = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; }
  return x.toString(36);
}
function fpOf(q, part) {
  const vals = FP_FIELDS[part].map(k => q[k]);
  if (part === 'opatreni') actsOf(q.id, '③').forEach(a => vals.push(a.no, a.text, a.owner, a.done));
  return fp(vals);
}
const fpAct = a => fp(FP_FIELDS.akce.map(k => a[k]));

/** Compact list from the server ({ k: names, r: rows }) → objects. A plain array is taken as it is. */
function rowsOf(t) {
  if (!t) return [];
  if (Array.isArray(t)) return t;
  const k = t.k, n = k.length;
  return t.r.map(r => { const o = {}; for (let i = 0; i < n; i++) o[k[i]] = r[i]; return o; });
}

/**
 * A QRAP from the server sends three things packed: can (what is possible now) and ck (closure conditions) as bits,
 * eff as [round, effective shifts, all ok]. Unpacked here once, so the rest of the page reads q.can.decide etc.
 */
function prepQ(q) {
  if (q.can && typeof q.can === 'object') return q; // already unpacked
  const can = Number(q.can) || 0, ck = Number(q.ck) || 0, e = Array.isArray(q.eff) ? q.eff : [1, 0, 0];
  q.can = {};
  (S.meta.can || []).forEach((k, i) => { q.can[k] = !!(can & (1 << i)); });
  q.checklist = (S.meta.checklist || []).map((label, i) => ({ label, ok: !!(ck & (1 << i)) }));
  q.eff = { round: e[0], ok: e[1], allOk: !!e[2] };
  return q;
}

/** Puts a list from the server into the page (boot, refresh, "Zobrazit jako"). */
function loadLists(d) {
  S.qraps = rowsOf(d.qraps).map(prepQ);
  S.actions = rowsOf(d.actions);
  S.effects = rowsOf(d.effects);
  S.assess = rowsOf(d.assess);
  S.all = !!d.all;
  if (d.ver) S.ver = d.ver;
  S.history = {};
  S.loadedAt = Date.now();
}

// ------------------------------------------------------------------ 2. SMALL HELPERS
/** Creates an element. Text is always inserted as text (never as HTML), so nothing typed can break the page. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'value') value = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = true;
    else el.setAttribute(k, v === true ? '' : v);
  });
  kids.flat(Infinity).forEach(k => {
    if (k !== null && k !== undefined && k !== false && k !== '') el.append(k instanceof Node ? k : String(k));
  });
  if (value !== undefined) el.value = value;
  return el;
}

/** Replaces the content of an element (same rules as h: lists are flattened, empty values skipped). */
function fill(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false && k !== ''));
  return el;
}

/** Calls that are safe to repeat: retried once after a network hiccup (apiCreate carries a one-time token). */
const RETRY = new Set(['apiRefresh', 'apiGet', 'apiPhoto', 'apiHistory', 'apiAdminData', 'apiCreate', 'apiPhotoPoll', 'apiMail']);
const isNetErr = e => /NetworkError|Failed to fetch|network|HTTP 0/i.test(String((e && e.message) || e || ''));
/** "Aplikace je právě zaneprázdněná" = the server's lock was not free and nothing was written: always safe to repeat. */
const isBusyErr = e => /zaneprázdněn/i.test(String((e && e.message) || e || ''));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/**
 * Calls a server function from Code.gs and returns a Promise. A busy server is asked once more by itself; a network
 * hiccup too, for calls that are safe to repeat. E-mails of a save are sent right after, in the background.
 */
function api(fn, ...args) {
  const once = () => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
  return once().catch(e => {
    if (isBusyErr(e)) { waitSay('Na serveru se právě ukládá něco jiného – za chvilku to zkusím znovu…'); return sleep(2000).then(once); }

function errText(e) {

/**
 * Saves: the button shows what is happening, the page is locked until the answer is there (WAIT), the answer is
 * stored, "Uloženo" is shown. Returns the answer or null. o = { phases, done (toast text), undo ({ label, run }) }.
 * When somebody else saved the same part meanwhile (answer.conflict), nothing was written and the person decides.

async function save(btn, fn, args, o) {
  o = o || {};
  if (navigator.onLine === false) {
    toast('Jste offline – nic se neuložilo. Počkejte na připojení a zkuste to znovu (vyplněné údaje zůstaly).', true);
    return null;
  }
  const w = waitStart(btn, o);
  let res;
  try {
    res = await api(fn, ...args);
  } catch (e) {
    w.end(false);
    if (isNetErr(e)) {
      toast('Spojení se serverem selhalo. Není jisté, zda se to uložilo – stránka se teď aktualizuje, zkontrolujte to a případně uložte znovu.', true);
      if (S.view === 'detail' && S.id) refreshOne(S.id);
    } else toast(errText(e), true);
    return null;
  }
  w.end(true);
  if (res && res.conflict) return conflict(res, btn, fn, args, o);
  store(res);
  DIRTY = false;
  toast(o.done || 'Uloženo ✓', false, o.undo);
  return res;
}

/** Somebody else saved this part while it was open here. Nothing was written – the person chooses what happens. */
async function conflict(res, btn, fn, args, o) {

  const how = await ask({
    title: 'Mezitím to uložil někdo jiný',
    text: c.by + ' uložil(a) tento QRAP ' + (c.at ? 'v ' + fmtDT(c.at) : 'před chvílí') + ', zatímco jste měli formulář otevřený. ' +
      'Vaše změny zatím NEJSOU uložené.',
    cancel: 'Zpět do formuláře', third: 'Zahodit moje, ukázat aktuální', ok: 'Uložit moje (přepíše jejich)', danger: true
  });
  if (how === true) { // save again without the fingerprint = overwrite
    args.forEach(a => { if (a && typeof a === 'object') delete a._fp; });
    return save(btn, fn, args, o);
  }
  if (how === 'third') { store(res); DIRTY = false; S.edit = null; render(); toast('Zobrazena aktuální verze.'); }
  return null;
}

/** Save from inside the detail page, then close the form and show the section again. */
async function submit(btn, fn, args, secNo, o) {
  const res = await save(btn, fn, args, o);

/** Puts a fresh problem (from the server) into the page's data. Lists are replaced, never patched in place. */
function store(res) {

  const id = q.id;

  'Tip: 5× Proč hledá chybu v procesu, ne viníka.',

function waitStart(btn, o) {

    steps: (o.steps || []).map(t => ({ t, st: '' })), tip0: Math.floor(Math.random() * TIPS.length), btn, card: null };

function waitTick() {
  const list = WAIT.list;
  if (!list.length) return;
  const now = Date.now();
  if (!WAIT.bar) WAIT.bar = document.body.appendChild(h('div', { class: 'topbar', 'aria-hidden': 'true' }));
  WAIT.bar.classList.add('on');
  WAIT.bar.style.width = (8 + 82 * (1 - Math.exp(-(now - list[0].t0) / 3000))) + '%'; // fills quickly, never reaches the end alone
  list.filter(x => now - x.t0 > 390000).forEach(x => { // the server gives up after 6 min – so does the page
    waitEnd(x);
    toast('Server neodpověděl. Zkontrolujte připojení a zkuste to znovu.', true);
  });
  const w = list[list.length - 1];
  if (!w) return;
  const ms = now - w.t0;
  if (ms < w.cardAt) return;
  const phase = w.text || w.phases.filter(p => ms >= p[0]).pop()[1];
  const tipN = ms >= 4000 ? Math.floor((ms - 4000) / 7000) : -1;
  const tip = tipN < 0 ? null : TIPS[(w.tip0 + tipN) % TIPS.length];
  const key = [phase, Math.floor(ms / 1000), tipN, w.steps.map(s => s.st + s.t).join('|')].join('#');
  if (key === w.key) return; // redraw only when something visible changed

}

function waitEnd(w) {
  const i = WAIT.list.indexOf(w);
  if (i < 0) return;
  WAIT.list.splice(i, 1);
  if (w.card) w.card.remove();
  if (w.btn && w.btn.isConnected) { w.btn.replaceChildren(...w.kids); w.btn.disabled = w.dis; w.btn.style.minWidth = w.minW; }
  if (w.lock && !WAIT.list.some(x => x.lock)) lockPage(false);

  WAIT.timer = null;
  const bar = WAIT.bar;
  bar.style.width = '100%';

  setTimeout(() => { if (!WAIT.list.length) bar.style.width = '0'; }, 800);

/** Changes the text of the newest wait (e.g. "trying again"). */
function waitSay(text) { const w = WAIT.list[WAIT.list.length - 1]; if (w) w.say(text); }

/** While a save runs nothing on the page can be clicked or typed into (dialogs, toast and the wait card stay usable). */
function lockPage(on) {

/**
 * A question that must be answered on purpose: big buttons, the safe answer has the focus, Esc or a click outside =
 * the safe answer. o = { title, text, body, ok, cancel, third, danger }. Returns a Promise of true / false / 'third'.
 */
function ask(o) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const id = 'q' + Math.random().toString(36).slice(2);
    const done = v => {
      box.remove();
      document.removeEventListener('keydown', key, true);
      if (prev && prev.isConnected && prev.focus) prev.focus({ preventScroll: true });
      resolve(v);
    };
    const no = h('button', { class: 'btn', type: 'button', onclick: () => done(false) }, o.cancel || 'Zpět');
    const third = o.third ? h('button', { class: 'btn', type: 'button', onclick: () => done('third') }, o.third) : null;
    const yes = h('button', { class: 'btn ' + (o.danger ? 'danger-fill' : 'primary'), type: 'button', onclick: () => done(true) }, o.ok || 'Ano');
    const btns = [no, third, yes].filter(Boolean);
    const key = e => {
      if (e.key === 'Escape') { e.preventDefault(); done(false); }
      else if (e.key === 'Tab') { // the focus stays in the question
        e.preventDefault();
        const i = btns.indexOf(document.activeElement);
        btns[(i + (e.shiftKey ? btns.length - 1 : 1) + btns.length) % btns.length].focus();
      }

      onclick: e => { if (e.target === box) done(false); } },
      h('div', { class: 'modal-card' }, h('h2', { id }, o.title), o.text ? h('p', null, o.text) : null, o.body || null,
        h('div', { class: 'form-btns' }, btns)));
    document.body.append(box);
    document.addEventListener('keydown', key, true);
    (o.danger ? no : yes).focus();
  });
}

/**
 * DIRTY = something was typed or chosen in a form and is not saved yet (new QRAP, a block of a QRAP, Správa).
 * Then leaving asks first: the menu, "Zrušit", another block, the browser's Back button, closing the tab.
 * Filters, search and paging are not work – they carry data-free. A new QRAP is also kept as a draft (DRAFT),
 * so leaving it loses nothing at all.

let DIRTY = false;

  const t = e.target;

/** true = the page may be left now. Asks only when there is unsaved work that would be lost (once, also on a double click). */
let leaveQ = null;

  if (!leaveQ) {

      ok: 'Zahodit změny', cancel: 'Zpět k vyplňování', danger: true });
    leaveQ.then(() => { leaveQ = null; });

function leaving() { if (onLeave) { const f = onLeave; onLeave = null; f(); } }

/**
 * The draft of a new QRAP in this browser (per account, for 24 h): typing, step, the one-time token and the photos
 * already uploaded. After a reload, a crash or a wrong click the form continues where it was. A send reuses the

const DRAFT = {
  works: (() => { try { localStorage.setItem('eqrap:t', '1'); localStorage.removeItem('eqrap:t'); return true; } catch (e) { return false; } })(),
  key: () => 'eqrap:draft:' + (S.me.email || ''),

      const d = JSON.parse(localStorage.getItem(DRAFT.key()) || 'null');

    } catch (e) { return null; }

  put(d) {

    try { localStorage.setItem(DRAFT.key(), JSON.stringify(Object.assign(v, { photos: null }))); return true; } catch (e) { return false; }

/**

function go(view, id, replace) {
  if (DIRTY && !(S.view === 'new' && DRAFT.works && !S.edit)) {
    leaveOk().then(ok => { if (ok) go(view, id, replace); });
    return;
  }
  leaving();
  DIRTY = false;
  S.view = view;
  S.id = id || null;
  S.edit = null;
  const p = {};
  if (id) p.id = id; else if (view !== 'board') p.view = view;
  try { google.script.history[replace ? 'replace' : 'push']({ view: view, id: id || null }, p); } catch (e) { /* ignore */ }
  render();
  window.scrollTo(0, 0);
  if (view === 'detail') refreshOne(id);

}

/** Search text of a QRAP, built once per QRAP object (a fresh object from the server gets a fresh one). */
const HAY = new WeakMap();
function haystack(q) {
  let s = HAY.get(q);
  if (s === undefined) {
    s = [q.id, q.what, q.whatOther, q.descWrong, q.descRight, q.zone, q.location, q.reference, q.materialNo, q.huNo, q.supplier, q.finder, q.how, q.howOther]
      .join(' ').toLowerCase();
    HAY.set(q, s);
  }
  return s;
}

/** Open before closed; late and SAFETY first; newest first. The keys are computed once per QRAP, not per comparison. */
function sortQ(rows) {
  return rows.map(q => ({ q, r: (isOpen(q) ? 0 : 4) - (isLate(q) ? 2 : 0) - (q.safety === 'ANO' ? 1 : 0), t: String(q.when || q.created || '') }))
    .sort((a, b) => a.r - b.r || (a.t < b.t ? 1 : a.t > b.t ? -1 : 0))
    .map(x => x.q);
}

function myActions() {
  if (!S.me.email) return null;
  const mine = S.actions.filter(a => a.canDone && a.ownerEmail === S.me.email);
  if (!mine.length) return null;
  return h('div', { class: 'card' }, h('h2', null, 'Moje konečné akce (' + mine.length + ')'),
    mine.map(a => h('div', { class: 'act' },
      h('div', { class: 'act-no' }, '⑥'),
      h('div', null, h('div', null, a.text), h('div', { class: 'sub' }, a.qrapId + ' · plán ',
        h('span', { class: actLate(a) ? 'late-txt' : '' }, fmtD(a.due)))),
      h('div', null),
      h('button', { class: 'btn small', onclick: () => go('detail', a.qrapId) }, 'Otevřít'))));
}

// ------------------------------------------------------------------ 5. NEW PROBLEM (NAHLÁSIT)
/**
 * New QRAP, step by step in the order of the paper form: ① ② ③ (Zpět / Pokračovat).
 * Only the risk question of ③ is required now – what is missing in ③ the TL completes within 24 h.
 * The last step shows everything for a check before sending. The form carries a one-time token,
 * so a double click or a retry after a lost answer never creates two QRAPs.
 * Everything typed is kept as a draft in this browser (DRAFT): a reload, a crash or a wrong click loses nothing,
 * the form continues where it was. Photos are uploaded in the background as soon as they are taken (photoPicker),
 * so "Odeslat" sends only text.
 */
function newPage() {
  const draft = DRAFT.get();
  const d0 = draft || {};
  const pv = Object.assign({ when: new Date().toISOString(), zone: S.me.area || '' }, d0.p || {});
  if (d0.p) pv.nokSituation = d0.p.qtyNA || '';
  let page = null;
  const keep = () => { // the draft, a moment after the last change (and at once when leaving)
    clearTimeout(keepT);
    keepT = setTimeout(keepNow, 500);
  };
  let keepT = null;
  let sent = false;
  const keepNow = () => {
    clearTimeout(keepT);
    if (sent || !(DIRTY || draft)) return; // nothing typed yet: no draft
    DRAFT.put({ token, step: at, p: pf.F.peek(), s3: s3.peek(), photos: pf.photos.state() });
  };
  const pf = popisForm(pv, true, d0.photos, keep);
  const s3 = opatreniForm(d0.s3 || {}, (d0.s3 && d0.s3.ia) || []);
  const token = d0.token || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
  qrLib().catch(() => { /* loaded again when the QR code is needed */ }); // ready before anybody presses "Fotit telefonem"
  const step = (...kids) => h('div', { class: 'step' }, kids);
  const steps = [
    { name: 'Problém', title: 'Popis problému – CO a JAK', el: step(pf.groups[0]) },
    { name: 'Kdy a kde', el: step(pf.groups[1]) },
    { name: 'Kolik a kdo', el: step(pf.groups[2]) },
    { name: 'Popis', title: 'Popis problému – ŠPATNÝ a DOBRÝ díl', el: step(pf.groups[3]) },
    { name: 'Upozornění', title: 'Kdo byl upozorněn?', el: step(pf.two) },
    { name: 'Opatření', title: 'Okamžitá opatření <' + hours3() + 'h', el: step(s3.el,
      h('p', { class: 'sub', style: 'margin-top:12px' }, 'Vyplňte, co víte. Co chybí, doplní TL do ' + hours3() + ' h.')) },
    { name: 'Kontrola', el: null }
  ];
  let at = 0;
  const bar = h('div', { class: 'wiz-list' });
  const body = h('div');
  const back = h('button', { class: 'btn ghost', onclick: () => show(at - 1) }, '← Zpět');
  const next = h('button', { class: 'btn primary btn-cta', onclick: async () => {
    if (!valid(at)) return;
    if (at === 1 && !(await whenOk())) return;
    show(at + 1);
  } }, 'Pokračovat →');
  const send = h('button', { class: 'btn primary btn-cta', onclick: async () => {
    if (!pf.read() || !s3.read() || !(await whenOk())) return; // the fields are checked before anything is sent
    if (navigator.onLine === false) { toast('Jste offline – QRAP se neodeslal. Nic se neztratilo, odešlete ho po připojení.', true); return; }
    const w = waitStart(send, { phases: PHASES.create, cardAt: 0, short: 'Odesílám…',
      steps: ['Kontrola údajů', 'Fotky', 'Zápis QRAP do tabulky', 'E-mail manažerovi zóny'] });
    w.step(0, 'ok');
    try {
      const n = pf.photos.count();
      w.step(1, 'run', pf.photos.pending() ? 'Dokončuji nahrání fotek…' : 'Fotky');
      await pf.photos.settle(); // photos taken here went up in the background – usually they are already there
      w.step(1, 'ok', n ? 'Fotky (' + n + ')' : 'Bez fotek');
      const data = pf.read();
      const d3 = s3.read();
      if (!data || !d3) { w.end(); return; }
      data.s3 = d3;
      data.token = token;
      w.step(2, 'run');
      pf.photos.pause(); // the server ends the photo hand-off with this save
      const res = await api('apiCreate', data);
      w.step(2, 'ok');
      w.step(3, 'ok', 'E-mail manažerovi zóny – odchází na pozadí');
      sent = true;
      DIRTY = false;
      DRAFT.clear();
      store(res);
      pf.photos.seed(res.qrap); // the previews are already here – the QRAP page shows them without downloading
      const photoNote = pf.photos.afterCreate(res);
      w.end();
      S.flash = { id: res.qrap.id, text: 'QRAP ' + res.qrap.id + ' odeslán. Manažer zóny dostane e-mail.' + photoNote };
      S.filter = 'open';
      go('board', null, true);
    } catch (e) {
      w.end();

/** ④ "Podepsat": checks, then one clear question with everything that will happen – a signature cannot be undone here. */

  const d = F.read();

  if ((d.decision === 'VYŘEŠENO' || d.decision === 'ESKALACE') && !d.decisionNote) { F.mark('decisionNote', 'Napište komentář.'); return; }
  const dec = DECISIONS.filter(x => x.value === d.decision)[0];
  const missing = shiftsAll.filter(s => !split(d.shifts).includes(s));
  const ok = await ask({ title: 'Podepsat rozhodnutí ④?', ok: 'Podepsat', cancel: 'Zpět',
    body: h('div', null,

  const F = makeForm(q);

        h('label', { class: 'why-root' }, roots[c][i - 1], 'kořenová příčina'))));
  };
  const nBox = showIf(h('div', null, chain('n', 'Proč to nebylo zachyceno?', 'Proč problém nebyl zachycen dříve?')),
    [1, 2, 3, 4, 5].some(i => q['n' + i]));
  const addN = h('button', { class: 'btn small ghost', type: 'button', hidden: !nBox.hidden,
    onclick: () => { nBox.hidden = false; addN.hidden = true; } }, '+ Přidat řetězec „Proč to nebylo zachyceno?“');
  const stdRef = showIf(h('div', null, F.input('stdRef', 'Který standard', { req: true, len: 300 })), q.std === 'ANO');
  return h('div', null,
    h('p', { class: 'sub' }, 'Ptejte se „proč?“ na fakta, dokud nedojdete k příčině v procesu, kterou lze odstranit (ne k osobě).'),
    chain('o', 'Proč to vzniklo?', 'Proč vznikl problém?'),
    nBox, addN,
    h('div', { class: 'sub-h', style: 'margin-top:12px' }, 'Poučení a standard'),
    h('div', { class: 'grid' },
      F.input('learned', 'Co jsme se naučili z QR?', { rows: 2, wide: true, hint: 'Povinné pro uzavření.' }),
      F.yesno('std', 'Příležitost k aktualizaci STANDARDU?', { hint: 'ANO vytvoří akci „Aktualizovat standard“.',
        onchange: x => showIf(stdRef, x === 'ANO') }),
      stdRef),
    formButtons('Uložit analýzu', savePricina(q, F, roots)));
}

/** ⑤ "Uložit analýzu" – fewer than 3 "Proč" is asked about before saving (not after), so it can still be completed. */
function savePricina(q, F, roots) {
  const base = fpOf(q, 'pricina'); // what the form showed when it opened
  return async b => {
    const d = F.read();
    if (!d) return;
    ['o', 'n'].forEach(c => { const r = roots[c].find(x => x.checked); d['root' + c.toUpperCase()] = r ? r.value : ''; });
    const filled = [1, 2, 3, 4, 5].filter(i => d['o' + i]).length;
    if (filled < 3 && !(await ask({ title: 'Jen ' + filled + '× Proč?', text: 'Ke skutečné příčině v procesu obvykle vedou aspoň 3 „Proč“. Uložit i tak? (Doplnit to můžete i později.)',
      ok: 'Uložit i tak', cancel: 'Doplnit Proč' }))) return;
    d._fp = base;
    submit(b, 'apiSave', [q.id, 'pricina', d], 5);
  };
}

/** ⑥ one definitive action (new or edit). */
function actionForm(q, a) {
  const F = makeForm(a ? Object.assign({}, a, { done: a.done ? dayOf(a.done) : '' }) : {});
  const steps = whySteps(q, a);
  const done = a ? F.input('done', 'Hotovo', { type: 'date', max: today(), hint: 'Datum hotovo akci uzavře.' }) : null;
  return h('div', { class: 'act-form editing' },
    h('div', { class: 'grid' },
      F.input('text', 'Konečná akce', { req: true, rows: 2, wide: true, len: 500 }),
      F.select('kind', 'Odstraňuje krok 5 Proč', steps, { req: true }),
      F.input('owner', 'Pilot', { req: true, list: 'people-list', ph: 'Začněte psát jméno', len: 100 }),
      F.input('due', 'Plán', { req: true, type: 'date', min: a ? null : today() }),
      done,
      F.input('evidence', 'Odkaz na důkaz', { ph: 'https://…', len: 500 }),
      F.input('note', 'Poznámka', { wide: true, len: 500 })),
    formButtons(a ? 'Uložit akci' : 'Přidat akci', saveActionForm(q, a, F)),
    a && a.canEdit ? removeActionBtn(q, a, 'margin-top:8px') : null);
}

/** "Odebrat akci" – asked first: a removed action cannot be brought back on the page. */
function removeActionBtn(q, a, style) {
  return h('button', { class: 'btn small danger', style, onclick: async e => {
    const b = e.currentTarget;
    if (!(await ask({ title: 'Odebrat akci ' + a.no + '?', text: '„' + a.text + '“ zmizí z konečných akcí. Na stránce ji nepůjde vrátit.',
      ok: 'Odebrat akci', cancel: 'Ponechat', danger: true }))) return;
    submit(b, 'apiSaveAction', [q.id, { no: a.no, remove: true }], 6, { done: 'Akce ' + a.no + ' odebrána.' });
  } }, 'Odebrat akci');
}

/** The 5 Proč steps an action can remove (both chains), plus STD for the standard action. */
function whySteps(q, a) {
  const steps = [];
  ['o', 'n'].forEach(c => [1, 2, 3, 4, 5].forEach(i => {
    if (q[c + i]) steps.push({ value: c.toUpperCase() + i, label: whyLabel(c.toUpperCase() + i) + ' – ' + q[c + i].slice(0, 70) });
  }));
  if (a && a.kind === 'STD') steps.push({ value: 'STD', label: 'STD – aktualizace standardu' });
  return steps;
}

/** The save of an action form. The fingerprint of an existing action is taken when the form opens. */
function saveActionForm(q, a, F) {
  const base = a ? fpAct(a) : '';
  return b => {
    const d = F.read();
    if (!d) return;
    if (d.evidence && !/^https?:\/\//i.test(d.evidence)) { F.mark('evidence', 'Odkaz musí začínat http:// nebo https://'); return; }
    if (a) {
      d.no = a.no;
      d._fp = base;
      if (!d.done) d.done = false; // empty = not done yet
      else if (a.done && d.done === dayOf(a.done)) delete d.done; // unchanged: keep the original time
    }
    submit(b, 'apiSaveAction', [q.id, d], 6);
  };
}

/** ⑦ HODNOCENÍ QRQC – 5 criteria OK / NOK / N/A, OJT and feedback. The hints help the assessor. */
function assessHints(q) {
  const ia = actsOf(q.id, '③');
  const photos = q.photoWrong && q.photoRight;
  return {
    c1: '① kompletní' + (photos ? ' · obě fotky' : ' · bez fotek (výjimka)'),
    c2: (q.s3Done ? '③ kompletní' : '③ nekompletní') + ' · ' + ia.length + ' opatření',
    c3: photos ? 'obě fotky' : 'bez fotek',
    c4: 'informováno směn: ' + split(q.shifts).length + '/' + (S.lists.shifts || []).length,
    c5: 'bylo OJT s operátorem u tabule?'
  };
}
const ASSESS_OPTS = ['OK', 'NOK', 'N/A'].map(v => ({ value: v, label: v }));

function assessForm(q) {
  const F = makeForm({});
  const hints = assessHints(q);
  return h('div', null,
    h('div', { class: 'grid' },
      CRITERIA.map(c => F.radio(c[0], c[1] + ' – ' + c[2], ASSESS_OPTS, { req: true, inline: true, wide: true, hint: hints[c[0]] })),

      F.select('feedbackType', 'Typ zpětné vazby', ['pochvala', 'silná stránka', 'ke zlepšení']),
      F.input('feedback', 'Zpětná vazba', { rows: 2, wide: true })),
    h('p', { class: 'sub' }, 'Hodnotitel a čas se uloží automaticky (' + S.me.name + ').'),
    formButtons('Uložit hodnocení', b => { const d = F.read(); if (d) submit(b, 'apiAssess', [q.id, d], 7); }));
}

/** All ⑦ assessments (the paper shows the latest one). */
function assessList(q) {
  const list = S.assess.filter(a => a.qrapId === q.id).sort((a, b) => String(b.at).localeCompare(String(a.at)));

/** ⑥ Efektivita – 5 směn. A shift counts only from the day the last final action was done; the checker is you. */
function effectBox(q) {
  const rows = S.effects.filter(e => e.qrapId === q.id);
  if (!rows.length && q.status !== 'OVĚŘENÍ') return null;
  const round = q.eff.round;
  const fixed = actsOf(q.id, '⑥').map(a => a.done).filter(Boolean).sort().pop();
  const minDay = fixed ? dayOf(fixed) : null;
  const slot = n => rows.filter(e => e.round === round && e.slot === n).pop() || null;
  const resultBadge = r => h('span', { class: 'badge ' + (r === 'EFEKTIVNÍ' ? 'ok' : r === 'NEEFEKTIVNÍ' ? 'bad' : '') }, r);
  const tr = n => {
    const cur = slot(n);
    if (!q.can.effect || (cur && cur.result === 'EFEKTIVNÍ')) {
      return h('tr', null, h('td', null, n), h('td', null, cur ? fmtD(cur.date) : '–'), h('td', null, cur ? cur.shift : ''),
        h('td', null, cur ? resultBadge(cur.result) : ''), h('td', null, cur ? cur.by : ''), h('td'));
    }
    const date = h('input', { type: 'date', min: minDay, max: today(), value: cur ? cur.date : today(), 'aria-label': 'Datum směny ' + n });
    const shift = h('select', { 'aria-label': 'Směna ' + n }, h('option', { value: '' }, '— směna —'), (S.lists.shifts || []).map(s => h('option', { value: s }, s)));
    shift.value = cur ? cur.shift : '';
    const result = h('select', { 'aria-label': 'Výsledek ' + n }, h('option', { value: '' }, '— výsledek —'),
      ['EFEKTIVNÍ', 'NEOVĚŘENO', 'NEEFEKTIVNÍ'].map(r => h('option', { value: r }, r)));
    result.value = cur ? cur.result : '';
    // a saved result cannot be changed later (an effective slot stays, "neefektivní" restarts the count): asked first
    const b = h('button', { class: 'btn small', onclick: async () => {
      const miss = [!date.value && [date, 'datum'], !shift.value && [shift, 'směnu'], !result.value && [result, 'výsledek']].filter(Boolean);
      if (miss.length) { miss[0][0].focus(); toast('Vyplňte ' + miss.map(m => m[1]).join(', ') + ' (slot ' + n + ').', true); return; }
      if (date.value > today() || (minDay && date.value < minDay)) { date.focus(); toast('Datum směny musí být od ' + (minDay ? fmtD(minDay) : '') + ' do dneška.', true); return; }
      const bad = result.value === 'NEEFEKTIVNÍ';
      const ok = await ask({ title: 'Uložit slot ' + n + ': ' + result.value + '?', ok: bad ? 'Ano, chyba se objevila' : 'Uložit', cancel: 'Zpět', danger: bad,
        text: fmtD(date.value) + ', směna ' + shift.value + '. ' + (bad
          ? 'QRAP se vrátí do analýzy 5 Proč a počítání 5 směn začne znovu. Piloti a manažeři dostanou e-mail.'
          : result.value === 'EFEKTIVNÍ' ? 'Efektivní slot už pak nepůjde změnit.' : 'Slot půjde později přepsat.') });
      if (ok) submit(b, 'apiSaveEffect', [q.id, { slot: n, date: date.value, shift: shift.value, result: result.value }], 6);
    } }, 'Uložit');
    return h('tr', null, h('td', null, n), h('td', null, date), h('td', null, shift), h('td', null, result),
      h('td', { class: 'sub' }, S.me.name), h('td', null, b));
  };
  const older = rows.filter(e => e.round < round);
  return h('div', { class: 'box' },
    h('b', null, 'Efektivita zkontrolována na 5 směnách bez chyb'),
    h('span', { class: 'sub' }, ' · kolo ' + round + ' · efektivní na ' + q.eff.ok + ' z 5 různých směn'),
    h('p', { class: 'sub', style: 'margin:4px 0 8px' }, 'Každý slot musí být jiná směna (datum + směna), nejdříve ze dne, kdy byly hotové konečné akce' +
      (minDay ? ' (' + fmtD(minDay) + ')' : '') + '. Jako kontrolor se uloží vaše jméno. „NEEFEKTIVNÍ“ vrátí QRAP do analýzy.'),
    h('div', { class: 'slots-wrap' }, h('table', { class: 'slots' },
      h('tr', null, ['Slot', 'Datum směny', 'Směna', 'Výsledek', 'Zkontroloval(a)', ''].map(x => h('th', null, x))),
      [1, 2, 3, 4, 5].map(tr))),
    older.length ? h('p', { class: 'sub', style: 'margin-top:8px' }, 'Předchozí kola: ' +
      older.map(e => 'kolo ' + e.round + '/slot ' + e.slot + ' ' + e.result).join(', ')) : null);
}

/** Uzavření QRAP – after the 5 shifts (checklist); older QRAPs decided „Problém vyřešen“ also wait here for the signature. */
function closureBox(q) {
  if (q.status === 'UZAVŘENO') {
    return h('div', { class: 'box ok' }, h('b', null, '✓ Uzavření QRAP podepsal(a) ' + q.closedBy), ' · ' + fmtDT(q.closedAt));
  }
  if (q.status !== 'OVĚŘENÍ' && q.status !== 'SCHVÁLENÍ') return null;
  const approve = q.status === 'SCHVÁLENÍ';
  const ok = approve || q.checklist.every(c => c.ok);
  const b = h('button', { class: 'btn primary', disabled: !ok, onclick: async () => {
    if (!(await ask({ title: 'Podepsat uzavření ' + q.id + '?', text: 'QRAP se uzavře a podpis (váš účet a čas) se uloží do historie. ' +
      'Znovu otevřít ho pak může jen manažer.', ok: 'Podepsat uzavření', cancel: 'Zpět' }))) return;
    submit(b, 'apiSave', [q.id, 'uzavreni', {}], approve ? 4 : 6, { done: 'QRAP ' + q.id + ' uzavřen ✓' });
  } }, 'Podepsat uzavření');
  return h('div', { class: 'box' }, h('b', null, approve ? 'Uzavření' : 'Podmínky uzavření'),
    approve ? h('p', { class: 'sub' }, 'Rozhodnuto „Problém vyřešen: ŽÁDNÉ 5 Proč“ – zbývá podepsat uzavření.')
      : h('ul', { class: 'checklist' }, q.checklist.map(c => h('li', null, h('span', { class: c.ok ? 'ok' : 'no' }, c.ok ? '✓ ' : '✗ '), c.label))),
    q.can.close ? h('div', null, h('div', { class: 'form-btns' }, b), signNote()) : null);
}

function historyBox(q) {
  const box = h('div', { class: 'card no-print' });
  const load = async e => {
    const w = waitStart(e.currentTarget, { lock: false, phases: PHASES.load });
    box.append(h('div', { class: 'hist-skel' }, [70, 55, 62].map(p => h('span', { class: 'skel', style: 'height:14px;margin-top:12px;width:' + p + '%' }))));
    try { S.history[q.id] = await api('apiHistory', q.id); } catch (err) { toast(errText(err), true); }
    w.end();
    draw();
  };
  const draw = () => {
    const rows = S.history[q.id];
    fill(box, h('div', { class: 'p-head' }, h('h2', null, 'Historie změn'), h('div', { class: 'grow' }),
      rows ? null : h('button', { class: 'btn small ghost', onclick: load }, 'Zobrazit')),
    rows ? (rows.length ? h('ul', { class: 'timeline' }, rows.map(r => h('li', null,
      h('div', { class: 'sub' }, fmtDT(r.at) + ' · ' + personName(r.by)), h('div', null, r.text)))) : note('Žádné záznamy.')) : null);
  };
  draw();
  return box;
}

/** Cancel / reopen / unlock – managers and admins only, always with a reason that goes into the history. */
function adminBox(q) {
  if (!isManager()) return null;
  const open = isOpen(q);
  const F = makeForm({});
  const reason = F.input('reason', 'Důvod (uloží se do historie)', { req: true, wide: true, len: 300 });
  const what = {
    cancel: ['Zrušit QRAP ' + q.id + '?', 'QRAP zmizí z otevřených. Vrátit to jde jen přes „Znovu otevřít“.', true],
    unlock: ['Odemknout ①–④?', 'Podepsané rozhodnutí ④ se zruší a bude potřeba ho podepsat znovu.', true],
    reopen: ['Znovu otevřít ' + q.id + '?', 'QRAP se vrátí mezi otevřené.', false]
  };
  const op = (label, code, cls) => {
    const b = h('button', { class: 'btn ' + (cls || ''), onclick: async () => {
      const d = F.read();
      if (!d) return;

      if (!(await ask({ title, text: text + ' Důvod: „' + d.reason + '“.', ok: label, cancel: 'Zpět', danger }))) return;
      submit(b, 'apiAdmin', [q.id, code, d.reason], 1);
    } }, label);

  };
  return h('details', { class: 'card no-print admin-box' },
