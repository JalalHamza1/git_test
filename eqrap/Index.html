      'Vždy s důvodem – uloží se do historie s vaším jménem.'),
    h('div', { class: 'grid' }, reason),
    h('div', { class: 'form-btns' },
      open && q.decision ? op('Odemknout ①–④ (zrušit rozhodnutí)', 'unlock') : null,
      open ? op('Zrušit QRAP', 'cancel', 'danger') : op('Znovu otevřít', 'reopen')));
}

// ------------------------------------------------------------------ 7. FORMS (① … ⑦)
/** Every step is signed with the Google account of the person who saves it. */
const signNote = () => h('p', { class: 'sub' }, 'Podpis = váš účet (' + S.me.email + ') + čas, uloží se do historie.');

/**
 * A tiny form builder: every field remembers how to read its value and whether it is required.
 * Fields inside a hidden block are skipped (not required, value '').
 */
function makeForm(values) {
  const items = {};
  const val = key => (values[key] === null || values[key] === undefined ? '' : values[key]);
  const hiddenNow = i => !i.box.isConnected || !!i.box.closest('[hidden]'); // not on screen = not checked now
  const wrap = (key, label, control, o) => {
    // Hints: in a plain text field the hint is the placeholder (gone when typing);
    // anywhere else it hides behind a small ⓘ next to the label – one tap shows one muted line.
    const text = control.matches && control.matches('textarea, input:not([type]), input[type=text], input[type=email]') ? control : null;
    let tip = null, info = null;
    if (o.hint && text && !text.placeholder) text.placeholder = o.hint.replace(/\.$/, '');
    else if (o.hint) {
      tip = h('small', { hidden: true }, o.hint);
      info = h('span', { class: 'info no-print', role: 'button', tabindex: 0, title: o.hint, 'aria-label': 'Nápověda',
        onclick: e => { e.preventDefault(); tip.hidden = !tip.hidden; info.classList.toggle('on', !tip.hidden); },
        onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); info.click(); } } }, icon('info'));
    }
    const el = h(o.group ? 'div' : 'label', { class: 'fld' + (o.wide ? ' wide' : ''), role: o.group ? 'group' : null },
      label ? h('span', { class: 'fld-l' }, label, o.req ? h('span', { class: 'req' }, ' *') : null,
        o.opt ? h('span', { class: 'opt' }, 'nepovinné') : null, info) : null,
      control, o.extra || null, tip);
    items[key].box = el;
    const ok = () => el.classList.remove('invalid');
    el.addEventListener('input', ok);
    el.addEventListener('change', ok);
    return el;
  };
  const F = {
    /** o.len = the most characters the server keeps for this field – the field never takes more (nothing is cut off later). */
    input(key, label, o = {}) {
      const dt = o.type === 'datetime-local';
      const num = o.type === 'number';
      const len = o.len || (o.rows ? 2000 : 200);
      const el = o.rows ? h('textarea', { rows: o.rows, placeholder: o.ph, maxlength: len })
        : h('input', { type: o.type || 'text', placeholder: o.ph, min: o.min, max: o.max, list: o.list,
          inputmode: num ? 'numeric' : null, step: num ? 1 : null, maxlength: o.type ? null : len });
      el.value = dt && val(key) ? localInput(val(key)) : val(key);
      if (o.onchange) el.addEventListener('input', () => o.onchange(el.value));
      // pieces are whole numbers: "e", "+", "-", "," and "." cannot be typed
      if (num) el.addEventListener('keydown', e => { if (/^[eE+\-.,]$/.test(e.key)) e.preventDefault(); });
      items[key] = { label, req: o.req, focus: () => el.focus(),
        get: () => (dt ? (el.value ? new Date(el.value).toISOString() : '') : el.value.trim()),
        bad: () => !!(el.validity && el.validity.badInput) || (num && el.value !== '' && !/^\d{1,8}$/.test(el.value)) };
      // longer texts: a counter appears at 80 % of the limit
      let count = null;
      if (o.rows) {
        count = h('span', { class: 'count', hidden: true });
        const upd = () => {
          const n = el.value.length;
          count.hidden = n < len * 0.8;
          count.textContent = n + ' / ' + len + (n >= len ? ' – víc se nevejde' : '');
          count.classList.toggle('near', n >= len * 0.95);
        };
        el.addEventListener('input', upd);
        upd();
      }
      const control = o.now ? h('div', { class: 'with-btn' }, el, h('button', { class: 'btn small', type: 'button',
        onclick: () => { el.value = localInput(); el.dispatchEvent(new Event('input', { bubbles: true })); } }, 'Teď')) : el;
      return wrap(key, label, control, Object.assign({}, o, { extra: count }));
    },
    select(key, label, options, o = {}) {
      const opts = options.map(x => (typeof x === 'string' ? { value: x, label: x } : x));
      if (val(key) && !opts.some(x => x.value === val(key))) opts.push({ value: val(key), label: val(key) });
      const el = h('select', null, h('option', { value: '' }, o.ph || '— vyberte —'), opts.map(x => h('option', { value: x.value }, x.label)));
      el.value = val(key);
      if (o.onchange) el.addEventListener('change', () => o.onchange(el.value));
      items[key] = { label, req: o.req, get: () => el.value, focus: () => el.focus() };
      return wrap(key, label, el, o);
    },
    checks(key, label, options, o = {}) {
      const cur = split(val(key));
      const boxes = options.concat(cur.filter(x => !options.includes(x))).map(x => {
        const box = h('input', { type: 'checkbox', checked: cur.includes(x) });
        const lb = h('label', { class: 'check' + (box.checked ? ' on' : '') }, box, x);
        box.addEventListener('change', () => { lb.classList.toggle('on', box.checked); if (o.onchange) o.onchange(read()); });
        return { cb: box, x, lb };
      });
      const read = () => boxes.filter(b => b.cb.checked).map(b => b.x);
      items[key] = { label, req: o.req, get: () => read().join(', '), focus: () => boxes[0] && boxes[0].cb.focus(),
        set: list => boxes.forEach(b => { b.cb.checked = list.includes(b.x); b.lb.classList.toggle('on', b.cb.checked); }) };
      return wrap(key, label, h('div', { class: 'checks' }, boxes.map(b => b.lb)), Object.assign({ group: true }, o));
    },
    radio(key, label, options, o = {}) {
      const name = 'r' + Math.random().toString(36).slice(2);
      const rows = options.map(x => {
        const r = h('input', { type: 'radio', name, value: x.value, checked: val(key) === x.value, disabled: x.disabled });
        return { r, el: h('label', { class: 'choice' + (r.checked ? ' on' : '') }, r,
          h('span', null, h('b', null, x.label), x.sub ? h('small', null, x.sub) : null)) };
      });
      rows.forEach(x => x.r.addEventListener('change', () => {
        rows.forEach(y => y.el.classList.toggle('on', y.r.checked));
        if (o.onchange) o.onchange(x.r.value);
      }));
      items[key] = { label, req: o.req, get: () => { const c = rows.find(x => x.r.checked); return c ? c.r.value : ''; }, focus: () => rows[0].r.focus() };
      return wrap(key, label, h('div', { class: 'choices' + (o.inline ? ' inline' : '') }, rows.map(x => x.el)), Object.assign({ group: true }, o));
    },
    yesno(key, label, o = {}) { return F.radio(key, label, YES_NO, Object.assign({ inline: true }, o)); },
    toggle(key, label, o = {}) {
      const box = h('input', { type: 'checkbox', checked: !!val(key) });
      if (o.onchange) box.addEventListener('change', () => o.onchange(box.checked));
      items[key] = { label, get: () => (box.checked ? 'ANO' : ''), focus: () => box.focus() };
      const el = h('label', { class: 'check-line' + (o.wide ? ' wide' : '') }, box, label);
      items[key].box = el;
      return el;
    },
    /** Marks one field red with a message (for rules that involve two fields). */
    mark(key, msg) {
      items[key].box.classList.add('invalid');
      items[key].focus();
      toast(msg, true);
      return null;
    },
    /** All values without checking (hidden fields give ''). */
    peek() {
      const out = {};
      Object.keys(items).forEach(k => { out[k] = items[k].box.closest('[hidden]') ? '' : items[k].get(); });
      return out;
    },
    /** Returns all values, or null (and marks the missing fields red) when something required is empty. */
    read() {
      Object.values(items).forEach(i => i.box.classList.remove('invalid'));
      // a number the browser could not read (e.g. "2,5") would arrive as empty – said clearly instead
      const bad = Object.values(items).filter(i => i.bad && !hiddenNow(i) && i.bad());
      if (bad.length) {
        bad.forEach(i => i.box.classList.add('invalid'));
        bad[0].focus();
        toast('Zadejte celé číslo (bez čárky, tečky a mínusu): ' + bad.map(i => i.label.replace(/[?:]$/, '')).join(', '), true);
        return null;
      }
      const missing = Object.values(items).filter(i => i.req && !hiddenNow(i) && !i.get());
      if (missing.length) {
        missing.forEach(i => i.box.classList.add('invalid'));
        missing[0].focus();
        toast('Vyplňte prosím: ' + missing.map(i => i.label.replace(/[?:]$/, '')).join(', '), true);
        return null;
      }
      return F.peek();
    },
    item: key => items[key]
  };
  return F;
}

/** Shows or hides a block when a value changes. */
function showIf(el, on) { el.hidden = !on; return el; }

/** KOLIK špatných dílů? with its unit right next to the number (one row). */
function qtyRow(F, L) {
  const qty = F.input('qty', 'KOLIK špatných dílů?', { req: true, type: 'number', min: 0, max: 10000000 });
  const unit = F.select('unit', '', L.units || [], { group: true, ph: '— jednotka —' });
  const na = F.toggle('qtyNA', 'N/A', { onchange: on => setNA(on) });
  const input = qty.querySelector('input');
  const sel = unit.querySelector('select');
  const pair = h('div', { class: 'qty-pair' });
  input.replaceWith(pair);
  pair.append(input, unit, na);
  // N/A = no number of pieces: KOLIK and unit are emptied, locked and no longer required
  const setNA = on => {
    if (on) { input.value = ''; sel.value = ''; }
    input.disabled = sel.disabled = on;
    F.item('qty').req = !on;
    qty.classList.remove('invalid');
  };
  setNA(!!F.item('qtyNA').get());
  return qty;
}

    descRight: F.input('descRight', 'DOBRÝ díl – popis', { req: true, rows: 4, hint: 'Jak to má být správně?', len: 1000 }),
    reference: F.input('reference', 'Reference', { opt: true, len: 200 }),
    notified: h('div', null,
      F.checks('notified', 'Kdo byl upozorněn?', S.lists.alert || [], { req: true, hint: 'Koho jste informovali? Vyberte alespoň jednoho.',

  const groups = [

/** ③ OKAMŽITÁ OPATŘENÍ <24h as on the paper: Ochranná opatření, Třídění – data, Okamžitá opatření, Čas re-startu. */
function opatreniForm(v, ia, onPaper) {
  const F = makeForm(v);
  const sort = showIf(h('div', { class: 'grid wide' },
    h('div', { class: 'note warn wide' }, 'ANO → oddělení KVALITY dostane e-mail. Zapište data třídění.'),
    F.input('checked', 'Přetříděno (ks)', { type: 'number', min: 0, ph: 'přetříděno ks' }),
    F.input('wrong', 'Špatné kusy (ks)', { type: 'number', min: 0, ph: 'špatné ks' })), v.risk === 'ANO');
  const rows = onPaper ? iaTable(ia, v.when) : iaList(ia);
  const parts = {
    risk: h('div', { class: 'wide' },
      F.yesno('risk', 'Je zde riziko na již naskladněném nebo expedovaném zboží?', { req: true, wide: true,
        hint: 'Může být stejná chyba i u zboží, které už je na skladě nebo odešlo k zákazníkovi?', onchange: x => showIf(sort, x === 'ANO') }),
      sort),
    ia: rows.el,
    restoredAt: F.input('restoredAt', 'Čas re-startu procesu/stanice', { type: 'datetime-local', now: true,
      hint: 'Kdy proces znovu běží. Nechte prázdné, když proces nebyl zastaven.' })
  };
  const el = h('div', null,
    h('div', { class: 'grid' }, h('div', { class: 'sub-h wide' }, 'Ochranná opatření'), parts.risk),
    h('div', { class: 'grid' }, h('div', { class: 'sub-h wide' }, 'Okamžitá opatření'), h('div', { class: 'wide' }, parts.ia), parts.restoredAt));
  return {
    el, parts,
    read() {
      const d = F.read();
      if (!d) return null;
      if (d.checked !== '' && d.wrong !== '' && Number(d.wrong) > Number(d.checked)) {
        return F.mark('wrong', '„Špatné kusy“ nemůže být víc než „Přetříděno“.');
      }
      const list = rows.read();
      if (!list) return null;
      d.ia = list;
      return d;
    },
    /** Everything as typed, unchecked (the draft of a new QRAP). */
    peek: () => Object.assign(F.peek(), { ia: rows.peek ? rows.peek() : [] })
  };
}

/**
 * KDY on the paper: "Čas" and "Datum" in two lines, as on the paper. They fill the KDY field the form reads
 * (that field stays in the page, only visually hidden).
 */
function whenSplit(fld) {
  const dt = fld.querySelector('input');
  fld.classList.add('vh');
  const v = (dt.value || '').split('T');
  const date = h('input', { type: 'date', value: v[0] || '', 'aria-label': 'Datum' });
  const time = h('input', { type: 'time', value: v[1] || '', 'aria-label': 'Čas' });
  const sync = () => { dt.value = date.value && time.value ? date.value + 'T' + time.value : ''; dt.dispatchEvent(new Event('input', { bubbles: true })); };
  date.addEventListener('input', sync);
  time.addEventListener('input', sync);
  return h('div', { class: 'when-split' }, fld, h('div', null, 'Čas: ', time), h('div', null, 'Datum: ', date));
}

/**
 * ③ on the paper: "Okamžitá opatření | Kdo | Čas" typed straight into the table rows. Čas is a time as on the paper:
 * it is the first such time after KDY (③ has to be done within 24 h). An unchanged time keeps its stored date.
 */
function iaTable(existing, whenIso) {
  const base = whenIso ? new Date(whenIso) : new Date();
  const toIso = t => {
    if (!t) return '';
    const p = t.split(':').map(Number);
    const d = new Date(base);
    d.setHours(p[0], p[1], 0, 0);
    if (d.getTime() < base.getTime() - 60000) d.setDate(d.getDate() + 1);
    return d.toISOString();
  };
  const rows = [];
  const body = h('tbody');
  const add = v => {
    v = v || {};
    const F = makeForm(v);
    const it = { no: v.no, F, removed: false, orig: v.done || '', t0: v.done ? timeOf(v.done) : '' };
    it.time = h('input', { type: 'time', value: it.t0, 'aria-label': 'Čas' });
    it.tr = h('tr', null,
      h('td', null, F.input('text', 'Okamžité opatření', { req: true, rows: 2, ph: 'co bylo uděláno', len: 500 })),
      h('td', null, F.input('owner', 'Kdo', { req: true, list: 'people-list', ph: 'kdo', len: 100 })),
      h('td', null, it.time, h('div', { class: 'pp-rowbtns' },
        h('button', { class: 'link', type: 'button', onclick: () => { it.time.value = timeOf(new Date().toISOString()); } }, 'teď'),
        h('button', { class: 'link pp-del', type: 'button', title: 'Odebrat opatření', 'aria-label': 'Odebrat opatření',
          onclick: () => { it.removed = true; it.tr.remove(); } }, '×'))));
    rows.push(it);
    body.append(it.tr);
  };
  existing.forEach(add);
  if (!existing.length) add({ owner: S.me.name });
  const el = h('div', { class: 'lbl-paper' },
    h('table', { class: 'pp-t' }, h('colgroup', null, h('col'), h('col', { style: 'width:28%' }), h('col', { style: 'width:24%' })),
      h('thead', null, h('tr', null, h('th', null, 'Okamžitá opatření:'), h('th', null, 'Kdo'), h('th', null, 'Čas'))), body),
    h('button', { class: 'link pp-add', type: 'button', onclick: () => add({ owner: S.me.name }) }, '+ opatření'));
  return {
    el,
    read() {
      const out = [];
      for (const it of rows) {
        if (it.removed) { if (it.no) out.push({ no: it.no, remove: true }); continue; }
        const p = it.F.peek();
        if (!it.no && !p.text && !it.time.value) continue; // untouched new row
        const d = it.F.read();
        if (!d) return null;
        out.push({ no: it.no || '', text: d.text, owner: d.owner, done: it.time.value === it.t0 ? it.orig : toIso(it.time.value) });
      }
      return out;
    }
  };
}

/** ③ table "Okamžitá opatření | Kdo | Čas". An untouched new row is ignored; empty Čas = still running. */
function iaList(existing) {
  const items = [];
  const box = h('div');
  const add = v => {
    const F = makeForm(v || {});
    const item = { no: v && v.no, F, removed: false };
    item.el = h('div', { class: 'ia-row' },
      h('div', { class: 'ia-head' }, h('b', null, 'Okamžité opatření'),
        h('button', { class: 'link', type: 'button', onclick: () => { item.removed = true; item.el.remove(); } }, 'Odebrat')),
      h('div', { class: 'grid' },
        F.input('text', 'Co bylo uděláno', { req: true, wide: true, ph: 'např. paleta zablokována, zboží přetříděno', len: 500 }),
        F.input('owner', 'Kdo', { req: true, list: 'people-list', len: 100 }),
        F.input('done', 'Čas', { type: 'datetime-local', now: true, hint: 'Kdy bylo hotovo. Prázdné = ještě probíhá.' })));
    items.push(item);
    box.append(item.el);
  };
  existing.forEach(add);
  if (!existing.length) add({ owner: S.me.name });
  const addBtn = h('button', { class: 'btn small ghost', type: 'button', onclick: () => add({ owner: S.me.name }) }, '+ Přidat opatření');
  return {
    el: h('div', null, box, addBtn),
    read() {
      const out = [];
      for (const it of items) {
        if (it.removed) { if (it.no) out.push({ no: it.no, remove: true }); continue; }
        const p = it.F.peek();
        if (!it.no && !p.text && !p.done) continue; // untouched new row
        const d = it.F.read();
        if (!d) return null;
        out.push(Object.assign({ no: it.no || '' }, d));
      }
      return out;
    },
    peek: () => items.filter(it => !it.removed).map(it => Object.assign({ no: it.no || '' }, it.F.peek()))
  };
}

    F.select('kind', 'Odstraňuje krok 5 Proč', whySteps(q, a), { req: true }),
    F.input('owner', 'Pilot', { req: true, list: 'people-list', ph: 'Začněte psát jméno', len: 100 }),
    F.input('due', 'Plán', { req: true, type: 'date', min: a ? null : today() }),
    a ? F.input('done', 'Hotovo', { type: 'date', max: today(), hint: 'Datum hotovo akci uzavře.' }) : null,
    F.input('evidence', 'Odkaz na důkaz', { ph: 'https://…', len: 500 }),
    F.input('note', 'Poznámka', { wide: true, len: 500 }));
  const bar = h('div', null,
    formButtons(a ? 'Uložit akci' : 'Přidat akci', saveActionForm(q, a, F)),
    a && a.canEdit ? removeActionBtn(q, a, 'margin-top:6px') : null);
  return { el, bar };
}

/** ⑦ HODNOCENÍ QRQC on the paper – 5 criteria OK / NOK / N/A, OJT and feedback. */
function assessEditor(q) {
  const F = makeForm({});
  const hints = assessHints(q);
  const parts = {
    crit: CRITERIA.map(c => F.radio(c[0], c[1] + ' – ' + c[2], ASSESS_OPTS, { req: true, inline: true, hint: hints[c[0]] })),
    ojtWith: F.input('ojtWith', 'OJT s kým'),

  };

    formButtons('Uložit hodnocení', b => { const d = F.read(); if (d) submit(b, 'apiAssess', [q.id, d], 7); }));
  return { parts, bar };
}

// ------------------------------------------------------------------ 8. PHOTOS
/**
 * file ID → { p: Promise of the image, url: the image once known }. Each photo is downloaded once, also when two places
 * ask for it at the same time. Photos taken or received on this page are put in at once (photoPut), so they are never
 * downloaded again. At most PHOTO_MAX are kept (a kiosk page stays open for days).
 */
const PHOTOS = new Map();
const PHOTO_MAX = 60;
function photoKeep(fileId, entry) {
  PHOTOS.delete(fileId);
  PHOTOS.set(fileId, entry);
  while (PHOTOS.size > PHOTO_MAX) PHOTOS.delete(PHOTOS.keys().next().value);
  return entry;
}
function photoPut(fileId, url) { if (fileId && url) photoKeep(fileId, { p: Promise.resolve(url), url }); }
const photoNow = fileId => { const e = fileId ? PHOTOS.get(fileId) : null; return e ? e.url : null; };
function loadPhoto(qid, fileId) {
  const hit = PHOTOS.get(fileId);
  if (hit) return photoKeep(fileId, hit).p;
  const e = { p: null, url: null };
  e.p = api('apiPhoto', qid, fileId).then(url => { e.url = url; return url; });
  e.p.catch(() => { if (PHOTOS.get(fileId) === e) PHOTOS.delete(fileId); }); // a failed download may be tried again
  return photoKeep(fileId, e).p;
}

/** A photo cell holds "fullId|previewId" (older QRAPs: only fullId). */
const photoIds = v => String(v || '').split('|').filter(Boolean);

/**
 * Two ways to add a photo – the same everywhere (new QRAP, QRAP page; the phone page has its own copy):
 *   "📷 Vyfotit"     opens the camera straight away on phones and tablets (newer Android phones offer only the
 *                    gallery without it); hidden on a PC with a mouse, where it would only open the file dialog too
 *   "🖼️ Z galerie"   picks a photo that is already there (on a PC: "📷 Přidat foto" – the file dialog)
 * The inputs are made once and live as long as the buttons, so a redraw while the camera is open loses nothing.
 * onFile(file) is called with the chosen file; free = changes here are saved at once (not "unsaved work").
 */
function photoInputs(onFile, o) {
  o = o || {};
  const mk = capture => {
    const input = h('input', { type: 'file', accept: 'image/*', capture: capture ? 'environment' : null, hidden: true, 'data-free': o.free ? '' : null });
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      // the input is emptied only after the file was read (readPhoto copies it first): on some phones a camera
      // file disappears as soon as the input lets go of it
      Promise.resolve(file ? onFile(file) : null).catch(() => { /* reported by onFile */ }).then(() => { input.value = ''; });
    });
    return input;
  };
  const cam = mk(true), gal = mk(false);
  const camBtn = h('button', { class: 'btn small ph-cam', type: 'button', onclick: e => { e.stopPropagation(); cam.click(); } });
  const galBtn = h('button', { class: 'btn small', type: 'button', onclick: e => { e.stopPropagation(); gal.click(); } });
  const label = has => {
    fill(camBtn, has ? '📷 Vyfotit znovu' : '📷 Vyfotit');
    fill(galBtn, h('span', { class: 'on-touch' }, '🖼️ Z galerie'), h('span', { class: 'on-desk' }, has ? '📷 Vyměnit fotku' : '📷 Přidat foto'));
  };
  label(o.has);
  return { camBtn, galBtn, inputs: [cam, gal], label, set disabled(v) { camBtn.disabled = galBtn.disabled = v; } };
}

/**
 * One photo on the paper (QRAP page): the preview (at once from memory, else a shimmer until it is loaded),
 * a tap opens the full photo. While ① can be changed, a new photo can be taken or picked (photoInputs); it is shown
 * at once while it is being uploaded, and the page is locked until the upload is done.
 */
function photoSlot(q, kind, key, title) {
  const ids = photoIds(q[key]);
  const pic = (url, busy) => [h('img', { src: url, alt: title }), busy ? h('div', { class: 'ph-busy' }, h('span', { class: 'spin' }), busy) : null];
  const tile = ids.length ? h('button', { class: 'pp-ph', type: 'button', title: title, 'aria-label': title + ' – zvětšit fotku' })
    : h('div', { class: 'pp-ph', hidden: true });
  if (ids.length) {
    const tid = ids[1] || ids[0];
    if (photoNow(tid)) fill(tile, pic(photoNow(tid)));
    else {
      fill(tile, h('span', { class: 'skel', 'aria-hidden': 'true' }));
      loadPhoto(q.id, tid).then(url => fill(tile, pic(url))).catch(() => { fill(tile, 'Fotku nelze načíst'); });
    }
    tile.addEventListener('click', e => { e.stopPropagation(); zoom(q.id, ids[0], title, ids[1]); });
  }
  if (!q.can.popis) return ids.length ? tile : null;
  const btns = photoInputs(async file => {
    const w = waitStart(null, { phases: PHASES.photo });
    try {
      const p = await readPhoto(file);
      tile.hidden = false;
      fill(tile, pic(p.thumb || p.full, 'Nahrávám…')); // the new photo is visible at once
      w.say('Nahrávám fotku…');
      const res = await api('apiSetPhoto', q.id, kind, p.full, p.thumb);
      const nids = photoIds(res.qrap && res.qrap[key]);
      photoPut(nids[1], p.thumb); // already here – never downloaded again
      photoPut(nids[0], p.full);
      store(res);
      w.end();
      toast('Fotka uložena ✓');
    } catch (err) {
      w.end();
      toast(errText(err), true);
      if (S.view === 'detail' && !S.edit && !DIRTY) render(); // back to the photo that is really saved
      return;
    }
    if (S.edit || DIRTY) { tile.querySelector('.ph-busy') && tile.querySelector('.ph-busy').remove(); btns.label(true); }
    else render(); // never throw away a block being filled in
  }, { free: true, has: ids.length > 0 });
  return h('div', null, tile, h('div', { class: 'pp-cam no-print ph-btns' }, btns.camBtn, btns.galBtn), btns.inputs);
}

/**
 * Optional photos in the new-QRAP form, one per kind. Per kind: null or { thumb, full?, value?, state }:
 *   'up'      taken here and being uploaded in the background – the operator goes on filling in the form
 *   'staged'  taken here and already in Drive (value = the photo cell)
 *   'phone'   arrived from the phone hand-off (only the preview is here, the photo is in Drive)
 *   'local'   taken here, but the background upload failed or took too long – it travels with "Odeslat" (slower,
 *             never lost)
 * "Odeslat" sends the cells it SHOWS (photoKeep): the server attaches exactly those (create_ → phonePhotos_), so
 * the order in which uploads finish, a phone retake or a lost cache can never swap or drop a photo silently.
 * "📱 Fotit telefonem" shows a QR code; the page then asks every few seconds what arrived (photoPoll_).
 * The server side is in PhotoHandoff.gs, the page the phone opens is Upload.html.
 * init = the photos of a draft ({ session, pics }); onChange = called after every change (the draft is saved).
 */
function photoPicker(init, onChange) {
  const KINDS = ['WRONG', 'RIGHT'];
  const NAMES = { WRONG: 'ŠPATNÝ', RIGHT: 'DOBRÝ' };
  const STAGE_MS = 60000; // a background upload that takes longer goes with "Odeslat" instead
  const keyOf = k => (k === 'RIGHT' ? 'photoRight' : 'photoWrong');
  const pics = { WRONG: null, RIGHT: null };
  const prep = { WRONG: null, RIGHT: null };   // the photo being read (a Promise), so "Odeslat" can wait for it
  const chain = { WRONG: Promise.resolve(), RIGHT: Promise.resolve() };
  const have = {};                              // per kind: the value the server has (the poll sends only what is new)
  let session = (init && init.session) || null;
  KINDS.forEach(k => {
    const p = init && init.pics && init.pics[k];
    if (p && p.value && p.thumb) { pics[k] = { thumb: p.thumb, value: p.value, state: p.state === 'phone' ? 'phone' : 'staged' }; have[k] = p.value; }
  });
  let root = null; // the form this belongs to: background work stops when it is gone
  let dlg = null, polling = false, seen = false, used = false;
  // true while "Odeslat" runs and after it: the server ends the hand-off when the QRAP is saved, so a check still
  // on its way would hear "link no longer valid" – that is not an expired link and must not be reported as one
  let stopped = false;
  const alive = () => !root || root.isConnected;
  const redraws = [];
  const changed = () => { redraws.forEach(f => f()); sayDlg(); if (onChange) onChange(); };

  let sessionP = null;
  const ensureSession = () => {
    if (session) return Promise.resolve(session);
    if (!sessionP) sessionP = api('apiPhotoSession').then(s => { session = s; sessionP = null; return s; }, e => { sessionP = null; throw e; });
    return sessionP;
  };
  /**
   * The hand-off ended (6 h, or the server's cache was cleared). Nothing shown is lost: photos already uploaded keep
   * their cell and are checked again on "Odeslat"; the next photo opens a new hand-off.
   */
  const sessionLost = () => { session = null; KINDS.forEach(k => { delete have[k]; }); };

  /** Uploads a photo taken here in the background. A failed or slow upload keeps the photo – it then goes with "Odeslat". */
  const stage = (kind, p) => {
    p.state = 'up';
    pics[kind] = p;
    changed();
    chain[kind] = chain[kind]
      .then(() => ensureSession())
      .then(s => Promise.race([api('apiStagePhoto', s.token, kind, p.full, p.thumb),
        sleep(STAGE_MS).then(() => { throw new Error('Nahrávání fotky trvá příliš dlouho – fotka se odešle s formulářem.'); })]))
      .then(r => {
        if (pics[kind] === p && p.state === 'up') { p.value = r.value; p.state = 'staged'; have[kind] = r.value; }
        else delete have[kind]; // replaced meanwhile – the next poll says what the server really has
      }, e => {
        if (pics[kind] === p && p.state === 'up') p.state = 'local';
        if (/neplatí/.test(errText(e)) && !stopped) sessionLost();
      })
      .then(changed);
    return chain[kind];
  };

  const slot = (kind, title) => {
    const box = h('div', { class: 'pslot ' + (kind === 'RIGHT' ? 'right' : 'wrong') });
    const view = h('div');
    const note = p => (p.state === 'up' ? [h('span', { class: 'spin' }), 'Nahrávám na pozadí – můžete pokračovat']
      : p.state === 'local' ? 'Odešle se s formulářem' : p.state === 'phone' ? '📱 Z telefonu ✓' : 'Nahráno ✓');
    const btns = photoInputs(file => {
      if (stopped) return null;
      prep[kind] = readPhoto(file).then(p => { prep[kind] = null; draw(); return stage(kind, p); },
        err => { prep[kind] = null; draw(); toast(errText(err), true); });
      draw();
      return prep[kind];
    });
    const remove = h('button', { class: 'btn small ghost', type: 'button', onclick: () => { pics[kind] = null; DIRTY = true; changed(); } }, 'Odebrat');
    const opt = h('span', { class: 'opt' }, 'nepovinné');
    const draw = () => {
      const p = pics[kind];
      fill(view,
        prep[kind] ? h('div', { class: 'ph' }, h('span', { class: 'skel' }), h('div', { class: 'ph-busy' }, h('span', { class: 'spin' }), 'Načítám fotku…'))
          : p ? h('button', { class: 'ph', type: 'button', 'aria-label': title + ' – zvětšit', onclick: () => zoomUrl(p.full || p.thumb, title) },
            h('img', { src: p.thumb || p.full, alt: title }), h('div', { class: 'ph-busy' + (p.state === 'up' || p.state === 'local' ? '' : ' ok') }, note(p))) : null);
      btns.label(!!p);
      btns.disabled = !!prep[kind];
      remove.hidden = !p;
      opt.hidden = !!p;
    };
    redraws.push(draw);
    fill(box, view, h('div', { class: 'inline-form ph-btns' }, btns.camBtn, btns.galBtn, remove, opt), btns.inputs);
    draw();
    return box;
  };

  /** While the form is open and the phone was used: what arrived? (fast while the QR dialog is open, slower after). */
  async function poll() {
    if (polling) return;
    polling = true;
    let fails = 0, quiet = Date.now();
    try {
      while (session && alive() && !stopped && Date.now() - quiet < 20 * 60000) {
        await sleep(dlg ? 2500 : 6000);
        if (!session || !alive() || stopped) break;
        try {
          const r = await api('apiPhotoPoll', session.token, have);
          if (stopped) break;
          fails = 0;
          if (r.seen && !seen) { seen = true; quiet = Date.now(); sayDlg(); }
          const got = KINDS.filter(k => r[k]);
          got.forEach(k => {
            have[k] = r[k].value;
            pics[k] = { thumb: r[k].thumb, value: r[k].value, state: 'phone' };
            photoPut(photoIds(r[k].value)[1], r[k].thumb);
          });
          if (got.length) { quiet = Date.now(); DIRTY = true; changed(); }
        } catch (e) {
          if (stopped || !alive()) break; // the QRAP was sent meanwhile (or the form left) – nothing to report
          if (/neplatí/.test(errText(e))) { sessionLost(); sayDlg('Odkaz vypršel – zavřete okno a zobrazte nový QR kód. Fotky, které už dorazily, zůstávají.'); break; }
          if (++fails >= 5) { sayDlg('Spojení se nedaří: ' + errText(e)); break; }
        }
      }
    } finally {
      polling = false;
    }
  }

  async function phoneDialog() {
    if (dlg) return;
    used = true;
    const status = h('p', { class: 'sub', role: 'status', style: 'min-height:1.5em' });
    const qrBox = h('div', { class: 'qr-box' }, h('span', { class: 'skel', style: 'width:220px;height:220px' }));
    const thumbs = h('div', { class: 'qr-thumbs' });
    const done = h('button', { class: 'btn primary', type: 'button', onclick: () => close() }, 'Hotovo');
    const box = h('div', { class: 'modal no-print', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Vyfoťte telefonem' },
      h('div', { class: 'modal-card', style: 'text-align:center;max-width:380px' },
        h('h2', null, 'Vyfoťte telefonem'),
        h('ol', { class: 'qr-how' }, h('li', null, 'Naskenujte QR kód firemním telefonem (přihlášeným firemním účtem Google).'),
          h('li', null, 'Na telefonu klepněte na „📷 Vyfotit“ u ŠPATNÉHO a DOBRÉHO dílu.'), h('li', null, 'Fotky se objeví tady i ve formuláři.')),
        qrBox, status, thumbs,
        h('div', { class: 'form-btns', style: 'justify-content:center' }, done)));
    const esc = e => { if (e.key === 'Escape') close(); };
    const close = () => { if (!dlg) return; dlg = null; box.remove(); document.removeEventListener('keydown', esc, true); };
    dlg = { status, thumbs };
    document.body.append(box);
    document.addEventListener('keydown', esc, true);
    done.focus();
    sayDlg('Připravuji QR kód…');
    try {
      if (!session) seen = false;
      const s = await ensureSession();
      await qrLib().catch(() => null); // without the library the link is shown as text
      if (!dlg) return;
      fill(qrBox, qrImage(s.url));
      sayDlg();
      poll();
    } catch (e) {
      fill(qrBox);
      sayDlg(errText(e));
    }
  }
  function sayDlg(msg) {
    if (!dlg) return;
    const got = KINDS.filter(k => pics[k] && pics[k].state === 'phone');
    fill(dlg.status, msg || (got.length === 2 ? '✓ Obě fotky jsou tady. Stiskněte Hotovo.'
      : got.length ? 'Přijato: ' + got.map(k => NAMES[k]).join(', ') + ' ✓ – čekám na další…'
      : [h('span', { class: 'pulse' }), seen ? ' 📱 Telefon je připojený – čekám na fotku…' : ' Čekám, až naskenujete QR kód…']));
    fill(dlg.thumbs, got.map(k => h('img', { src: pics[k].thumb, alt: NAMES[k] + ' díl' })));
  }

  return {
    slot,
    attach: el => { root = el; },
    get: () => Object.assign({}, pics),
    count: () => KINDS.filter(k => pics[k]).length,
    pending: () => KINDS.some(k => prep[k] || (pics[k] && pics[k].state === 'up')),
    /** Resolves when every photo taken so far is read and uploaded (or failed / too slow and goes with the form). */
    settle: () => Promise.all(KINDS.map(k => Promise.resolve(prep[k]).then(() => chain[k]))),
    token: () => (session ? session.token : ''),
    /** The cells "Odeslat" asks to attach: every photo shown that is already in Drive. */
    keep: () => KINDS.reduce((o, k) => {
      const p = pics[k];
      if (p && p.value && (p.state === 'staged' || p.state === 'phone')) o[k] = p.value;
      return o;
    }, {}),
    // for a server of the previous version: kinds whose hand-off photo must NOT be attached
    drop: () => KINDS.filter(k => !(pics[k] && (pics[k].state === 'staged' || pics[k].state === 'phone'))),
    /** "Odeslat" starts: no more checks of the hand-off (see stopped). resume() after a failed send. */
    pause: () => { stopped = true; },
    resume: () => { stopped = false; if (session && used) poll(); },
    /** For the draft: only what is safely on the server (value) – with its preview. */
    state: () => ({ session, pics: KINDS.reduce((o, k) => {
      const p = pics[k];
      o[k] = p && p.value && (p.state === 'staged' || p.state === 'phone') ? { thumb: p.thumb, value: p.value, state: p.state } : null;
      return o;
    }, {}) }),
    /** After "Odeslat": the previews of the new QRAP are already here – the QRAP page shows them without downloading. */
    seed(q) {
      KINDS.forEach(k => {
        const p = pics[k];
        const ids = photoIds(q[keyOf(k)]);
        if (!p || !ids.length || !(p.state === 'local' || p.value === q[keyOf(k)])) return;
        photoPut(ids[1], p.thumb);
        if (p.full) photoPut(ids[0], p.full);
      });
    },
    /**
     * After "Odeslat": photos the server could not attach (res.photoLost) are uploaded again from memory when they
     * were taken here; a lost phone photo is reported in the returned text (it has to be taken again).
     */
    afterCreate(res) {
      const q = res.qrap;
      const lost = (res.photoLost || []).filter(k => pics[k] && !q[keyOf(k)]);
      const redo = lost.filter(k => pics[k].full);
      const gone = lost.filter(k => !pics[k].full);
      if (redo.length) {
        redo.reduce((p, k) => p.then(() => api('apiSetPhoto', q.id, k, pics[k].full, pics[k].thumb).then(store)), Promise.resolve())
          .then(() => { toast('Fotky připojeny k ' + q.id + ' ✓'); if (S.view === 'board' && redrawBoard) redrawBoard(); },
            () => toast('Fotky se nepodařilo připojit – přidejte je na stránce ' + q.id + ' (Přidat foto).', true));
      }
      return gone.length ? ' Fotku z telefonu (' + gone.map(k => NAMES[k]).join(', ') + ') se nepodařilo připojit – přidejte ji na stránce QRAP.' : '';
    },
    /** The form was thrown away: its uploaded photos go to the Drive trash. */
    discard() {
      stopped = true;
      const t = session && session.token;
      session = null;
      KINDS.forEach(k => { pics[k] = null; });
      if (t) api('apiPhotoDiscard', t).catch(() => { /* expired anyway */ });
    },
    phoneBtn: () => h('button', { class: 'btn', type: 'button', onclick: phoneDialog }, '📱 Fotit telefonem')
  };
}

/**
 * The QR code library is loaded only when it is needed (prefetched when the new-QRAP form opens), so it never slows
 * down the start of the app. First jsDelivr with a fixed fingerprint (a changed file is refused), cdnjs as a fallback.
 */
let QR_LIB = null;
function qrLib() {
  if (typeof qrcode === 'function') return Promise.resolve();
  if (QR_LIB) return QR_LIB;
  const load = (src, sri) => new Promise((ok, bad) => {
    const s = h('script', { src: src, integrity: sri || null, crossorigin: sri ? 'anonymous' : null });
    s.onload = () => (typeof qrcode === 'function' ? ok() : bad(new Error('QR')));
    s.onerror = () => { s.remove(); bad(new Error('Knihovnu pro QR kód se nepodařilo načíst.')); };
    document.head.append(s);
  });
  QR_LIB = load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js',
    'sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k')
    .catch(() => load('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'))
    .catch(e => { QR_LIB = null; throw e; });
  return QR_LIB;
}

/** The QR code as a picture – or, when the library is not there, the link as text to type in. */
function qrImage(url) {
  try {
    if (typeof qrcode !== 'function') throw new Error('QR library not loaded');
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    return h('img', { src: qr.createDataURL(5, 4), alt: 'QR kód', width: 220, height: 220, style: 'image-rendering:pixelated' });
  } catch (e) {
    return h('p', { class: 'sub', style: 'overflow-wrap:anywhere' }, 'QR kód se nepodařilo vytvořit. Otevřete na telefonu tento odkaz: ', h('br'), url);
  }
}

/**
 * A photo from the camera or the gallery → { full, thumb } as JPEG (max 1280 px / 480 px), small and quick to upload.
 * Made to work on real phones and tablets (Upload.html has the same function – keep them equal):
 *   - the file is copied into memory first: a camera file on some phones disappears once the input lets go of it
 *   - three ways to read it: an <img> (follows the camera's rotation), createImageBitmap, and – for a JPEG / PNG that
 *     no browser can draw – the original file as it is, when it is small enough
 *   - a time limit, so a phone that never finishes decoding does not hang the form
 *   - a canvas that silently failed (out of memory on a big photo) is noticed and drawn again smaller
 * Errors are in Czech and say what to do.
 */
async function readPhoto(file) {
  if (!file || !file.size) throw new Error('Fotka je prázdná – vyfoťte ji prosím znovu.');
  if (file.size > 40 * 1024 * 1024) throw new Error('Soubor je příliš velký (víc než 40 MB). Vyberte menší fotku.');
  let buf;
  try { buf = await file.arrayBuffer(); } catch (e) { throw new Error('Fotku se nepodařilo přečíst – vyfoťte ji prosím znovu.'); }
  const head = new Uint8Array(buf.slice(0, 12));
  const kind = head[0] === 0xFF && head[1] === 0xD8 ? 'jpeg' : head[0] === 0x89 && head[1] === 0x50 ? 'png'
    : head[0] === 0x47 && head[1] === 0x49 ? 'gif' : head[8] === 0x57 && head[9] === 0x45 ? 'webp' : '';
  const blob = new Blob([buf], { type: kind ? 'image/' + kind : (file.type || 'application/octet-stream') });
  const timed = (p, ms) => Promise.race([p, sleep(ms).then(() => { throw new Error('timeout'); })]);
  let src = null;
  try {
    src = await timed(new Promise((ok, bad) => {
      const img = new Image();
      const url = URL.createObjectURL(blob);
      img.onload = () => { URL.revokeObjectURL(url); ok({ el: img, w: img.naturalWidth || img.width, h: img.naturalHeight || img.height }); };
      img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('img')); };
      img.src = url;
    }), 25000);
  } catch (e) {
    try {
      const bmp = await timed(createImageBitmap(blob, { imageOrientation: 'from-image' }), 25000);
      src = { el: bmp, w: bmp.width, h: bmp.height, close: () => bmp.close && bmp.close() };
    } catch (e2) { src = null; }
  }
  if (!src || !src.w || !src.h) {
    // nothing could draw it: a JPEG / PNG small enough goes as it is (the server checks it again)
    if ((kind === 'jpeg' || kind === 'png') && buf.byteLength <= 4.5 * 1024 * 1024) {
      const full = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => bad(r.error); r.readAsDataURL(blob); });
      return { full, thumb: '' };
    }
    throw new Error(kind ? 'Fotku se nepodařilo zpracovat. Zkuste ji vyfotit znovu.'
      : 'Tento formát fotky neumíme přečíst (např. HEIC). Vyfoťte ji tlačítkem „📷 Vyfotit“, nebo na iPhonu nastavte ' +
        'Nastavení → Fotoaparát → Formáty → Nejkompatibilnější.');
  }
  const draw = (from, w0, h0, max, quality) => {
    const scale = Math.min(1, max / Math.max(w0, h0));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w0 * scale));
    c.height = Math.max(1, Math.round(h0 * scale));
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.fillStyle = '#fff'; // a transparent PNG gets a white background instead of black
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(from, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', quality);
    return { c, url, ok: /^data:image\/jpeg;base64,/.test(url) && url.length > 200 };
  };
  try {
    let big = draw(src.el, src.w, src.h, 1280, 0.8);
    if (!big.ok) big = draw(src.el, src.w, src.h, 960, 0.75); // not enough memory for 1280 px: smaller
    if (!big.ok) throw new Error('canvas');
    const small = draw(big.c, big.c.width, big.c.height, 480, 0.7); // from the 1280 px copy: quick
    return { full: big.url, thumb: small.ok ? small.url : '' };
  } catch (e) {
    throw new Error('Fotku se nepodařilo zmenšit (málo paměti v zařízení?). Zavřete jiné aplikace a zkuste to znovu.');
  } finally {
    if (src.close) src.close();
  }
}

const DAY = 864e5;
function svg(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (v !== null && v !== undefined) el.setAttribute(k, v); });
  kids.flat(Infinity).forEach(k => { if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : String(k)); });
  return el;
}
function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const shortD = d => d.getDate() + '. ' + (d.getMonth() + 1) + '.';

/** Reported QRAPs in the last 8 weeks as a tiny bar strip (one series; exact numbers in the tooltip). One pass over the list. */
function sparkline() {
  const start = mondayOf(Date.now() - 7 * 7 * DAY);
  const counts = [0, 0, 0, 0, 0, 0, 0, 0];
  S.qraps.forEach(q => {
    if (q.status === 'ZRUŠENO' || !q.created) return;
    const w = Math.floor((new Date(q.created) - start) / (7 * DAY));
    if (w >= 0 && w < 8) counts[w]++;
  });
  const weeks = counts.map((n, i) => ({ from: new Date(start.getTime() + i * 7 * DAY), n }));
  const max = Math.max(1, ...counts);
  const W = 160, H = 28, gw = W / 8, bw = gw - 4;
  return { total: counts.reduce((m, n) => m + n, 0), el: svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'spark', preserveAspectRatio: 'none',
    role: 'img', 'aria-label': 'Nahlášeno po týdnech: ' + counts.join(', ') },
    weeks.map((w, i) => {
      const hgt = Math.max(2, w.n / max * H);
      return svg('rect', { x: i * gw + 2, y: H - hgt, width: bw, height: hgt, rx: 1.5 },
        svg('title', null, 'Týden od ' + shortD(w.from) + ': ' + w.n));
    })) };
}

      h('b', null, n))) : note('Zatím žádná data.'));
}

        risky.push('Odkaz aplikace nevypadá jako adresa webové aplikace (https://script.google.com/…/exec). Špatný odkaz rozbije odkazy v e-mailech i QR kód pro telefon.');
      }
      if (risky.length && !(await ask({ title: 'Opravdu uložit?', text: risky.join(' '), ok: 'Přesto uložit', cancel: 'Zpět', danger: true }))) return;
      call(b, 'apiSaveSettings', [o]);
    } }, 'Uložit nastavení');
    return h('div', { class: 'card' }, h('h2', null, 'Nastavení'),
      h('div', { class: 'grid' }, S.adm.settings.map(x => {
        const el = x.key === 'EMAILY' ? h('select', null, h('option', { value: 'ANO' }, 'ANO'), h('option', { value: 'NE' }, 'NE'))
          : h('input', { type: /^(LHUTA|ZOBRAZIT)/.test(x.key) ? 'number' : 'text', min: 1, max: x.key === 'LHUTA_OPATRENI_HODIN' ? 720 : x.key === 'ZOBRAZIT_UZAVRENE_DNI' ? 365 : null });
        el.value = x.value === undefined ? '' : x.value;
        inputs[x.key] = el;
        return h('label', { class: 'fld' }, h('span', { class: 'fld-l' }, SETTING_LABELS[x.key] || x.key), el, h('small', null, x.help));
      })),
      h('div', { class: 'form-btns' }, b));
  }
  if (S.adm) draw();
  else api('apiAdminData').then(res => { S.adm = res; draw(); }).catch(e => { box.removeAttribute('aria-busy'); fill(box, note(errText(e))); });
  return h('div', null,
    pageHead('Správa', 'Lidé, seznamy a nastavení aplikace. Změny platí hned (ostatní uživatelé po obnovení stránky).', null, 'Správa'),
    box);
}

  ];

  ];

  return h('div', { class: 'howto' },

      h('span', null, '* povinné')), h('button', { class: 'btn primary', onclick: () => go('new') }, '+ Nahlásit problém'), 'Jak to funguje'),
    h('div', { class: 'howto-steps' }, steps.map((x, i) => h('div', { class: 'howto-step' + (i === steps.length - 1 ? ' send' : '') },
      h('div', { class: 'hs-top' }, h('span', { class: 'hs-n' }, i + 1), h('b', null, x[1]), h('span', { class: 'hs-ico' }, icon(x[0]))),
      h('p', null, x[2])))),
    h('h2', { class: 'howto-h' }, 'Co se děje potom'),
    h('div', { class: 'flow2' }, next.map((x, i) => [i ? h('div', { class: 'arrow' }, icon('right')) : null,
      h('div', null, h('b', null, x[0]), h('span', null, x[1]))])),
    h('div', { class: 'cols2' },
      h('div', { class: 'card' }, h('h2', null, 'Podpis'),
        h('p', null, 'Každý krok se podepíše vaším účtem Google – jméno a čas se uloží do historie. Nic dalšího vyplňovat nemusíte.'),
        h('p', { class: 'sub' }, 'Každý může udělat kterýkoli krok. Podle formuláře QRAP ale ④ rozhoduje supervizor a ⑤ ⑥ vyplňují piloti.')),
      h('div', { class: 'card' },
        h('details', { class: 'roles-more' }, h('summary', null, icon('right'), 'Kdo co může'),
          h('div', { class: 'slots-wrap' }, h('table', { class: 'roles' },
            h('tr', null, h('th', null, ''), h('th', null, 'Uživatel'), h('th', null, 'Manažer'), h('th', null, 'Admin')),
            rows.map(r => h('tr', null, r.map(c => h('td', null, c)))))),
          h('p', { class: 'sub', style: 'margin-top:10px' }, 'Vaše role: ' + (roleName(S.me.role) || 'uživatel').toLowerCase() + '.')))));
}

// ------------------------------------------------------------------ 9c. REFRESH AND START
/**
 * Reload the data. The quiet auto-refresh sends the data version the page has: when nothing changed, the server
 * answers "unchanged" without reading the Sheet. Never two quiet refreshes at once. A button or "all" always
 * reloads and redraws the page.
 */
let refreshing = false;
async function refresh(quiet, btn, all) {
  if (quiet && refreshing) return;
  refreshing = true;
  const w = quiet ? null : waitStart(btn || null, { lock: false, phases: PHASES.load });
  let changed = false;
  try {
    const res = await api('apiRefresh', all || S.all, quiet ? S.ver : '');
    if (res.unchanged) S.loadedAt = Date.now();
    else { loadLists(res); changed = true; }
    if (res.build && BOOT.build && res.build !== BOOT.build && !S.newBuild) { S.newBuild = true; drawBanners(); } // redeployed
    if (!quiet) toast('Aktualizováno ✓');
  } catch (e) {
    if (!quiet) toast(errText(e), true);
  } finally {
    refreshing = false;
    if (w) w.end();
  }
  if (btn || all) render(); // on any page – also "Načíst všechna data" on Přehled manažera
  else if (changed && S.view === 'board' && redrawBoard) redrawBoard();
}

/** When a problem is opened, fetch its latest version in the background – the server answers "unchanged" if nothing changed. */
function refreshOne(id) {
  const have = !!byId(id);
  const snap = () => JSON.stringify([byId(id), actsAll(id), S.effects.filter(a => a.qrapId === id), S.assess.filter(a => a.qrapId === id)]);
  api('apiGet', id, have ? S.ver : '').then(res => {
    if (!res || res.unchanged) return;
    const before = snap();
    store(res);
    if (before !== snap() && S.view === 'detail' && S.id === id && !S.edit && !DIRTY && !WAIT.list.length) render(); // never under the hands of somebody typing
  }).catch(e => {
    if (!byId(id)) { toast(errText(e), true); go('board'); }
  });
}

function start() {
  if (BOOT.error) {
    fill(document.getElementById('app'), h('main', null, h('div', { class: 'card' },
      h('h1', null, 'Aplikaci se nepodařilo spustit'), h('p', null, BOOT.error),
      BOOT.url ? h('p', null, h('a', { class: 'btn primary', href: BOOT.url, target: '_top' }, 'Zkusit znovu')) : null,
      h('p', { class: 'muted' }, 'Když to nepomůže, kontaktujte správce aplikace (a pošlete mu text výše).'))));
    return;
  }
  loadLists(BOOT);
  fillPeopleList();
  const p = BOOT.params || {};
  S.view = p.id ? 'detail' : (['new', 'help'].includes(p.view) ? p.view : 'board');
  S.id = p.id || null;
  try {
    google.script.history.setChangeHandler(e => {
      const st = (e && e.state) || {};
      const prm = (e && e.location && e.location.parameter) || {};
      const apply = () => {
        leaving();
        DIRTY = false;
        S.view = st.view || (prm.id ? 'detail' : (prm.view || 'board'));
        S.id = st.id || prm.id || null;
        S.edit = null;
        render();
      };
      if (!DIRTY || (S.view === 'new' && DRAFT.works && !S.edit)) { apply(); return; }
      // the browser's Back button with unsaved work: asked; "stay" puts the address back
      leaveOk().then(ok => {
        if (ok) apply();
        else try { google.script.history.push({ view: S.view, id: S.id }, S.id ? { id: S.id } : S.view !== 'board' ? { view: S.view } : {}); } catch (x) { /* ignore */ }
      });
    });
  } catch (e) { /* ignore */ }
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.matches && t.matches('.pp-edit input[type=date], .pp-edit input[type=time]') && t.showPicker) { try { t.showPicker(); } catch (err) { /* not allowed here */ } }
  });
  document.addEventListener('input', markDirty, true);
  document.addEventListener('change', markDirty, true);
  // closing the tab or reloading: the draft is written; unsaved work or a save in progress makes the browser ask
  window.addEventListener('beforeunload', e => {
    if (onLeave) onLeave();
    if (WAIT.list.some(w => w.lock) || (DIRTY && !(S.view === 'new' && DRAFT.works && !S.edit))) { e.preventDefault(); e.returnValue = ''; }
  });
  // the screen crossed 1180 px (tablet turned, window resized): the board switches between strips and cards –
  // never while somebody is typing or saving
  const relayout = () => { if (!DIRTY && !S.edit && !WAIT.list.length && (S.view === 'board' || S.view === 'dash')) render(); };
  if (NARROW.addEventListener) NARROW.addEventListener('change', relayout); else NARROW.addListener(relayout);
  window.addEventListener('offline', () => { drawBanners(); toast('Připojení k internetu se ztratilo – vyplněné údaje zůstávají, uložte je po připojení.', true); });
  window.addEventListener('online', () => { drawBanners(); toast('Připojení je zpět ✓'); if (S.view === 'board') refresh(true); });
  render();
  if (S.view === 'detail') refreshOne(S.id);
  setInterval(() => {
    if (document.hidden) return;
    if (S.view === 'board') refresh(true);
    else if (S.view === 'detail' && S.id && !S.edit && !DIRTY && !WAIT.list.length) refreshOne(S.id); // the open QRAP stays current too
  }, 90000);
  document.addEventListener('visibilitychange', () => { // back on the tab after a while: catch up at once
    if (!document.hidden && S.view === 'board' && Date.now() - S.loadedAt > 60000) refresh(true);
  });
}

start();
