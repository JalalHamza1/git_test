<script>
'use strict';
/*
 * ClientForms – reusable form widgets and small display helpers.
 * Every input widget takes the current value and an onChange(value) callback, and returns a DOM node.
 */

/** Label + control + error line. opts: {name (data-field for server errors), required, hint, cls}. */
function field(label, control, opts) {
  opts = opts || {};
  return h('div', { class: 'fld' + (opts.cls ? ' ' + opts.cls : ''), 'data-field': opts.name || '' },
    label ? h('label', { class: 'fld-label' }, label, opts.required ? h('span', { class: 'req' }, ' *') : null) : null,
    opts.hint ? h('div', { class: 'fld-hint' }, opts.hint) : null,
    control,
    h('div', { class: 'fld-err' }));
}

/** Button group with one choice. options: [{value, label, kind (danger|ok|warn), disabled}]. */
function segmented(options, value, onChange, cls) {
  const wrap = h('div', { class: 'seg' + (cls ? ' ' + cls : ''), role: 'radiogroup' });
  const btns = options.map(o => h('button', {
    type: 'button', role: 'radio', disabled: !!o.disabled,
    class: 'seg-btn' + (o.kind ? ' seg-' + o.kind : '') + (o.value === value ? ' on' : ''),
    'aria-checked': String(o.value === value),
    onclick: () => {
      btns.forEach(b => { b.classList.remove('on'); b.setAttribute('aria-checked', 'false'); });
      btns[options.indexOf(o)].classList.add('on');
      btns[options.indexOf(o)].setAttribute('aria-checked', 'true');
      onChange(o.value);
    }
  }, o.label));
  return addKids(wrap, btns);
}

/** Button group with several choices. locked values cannot be switched off. */
function multiToggle(options, values, onChange, cls) {
  const sel = values.slice();
  const wrap = h('div', { class: 'seg' + (cls ? ' ' + cls : '') });
  options.forEach(o => {
    const b = h('button', { type: 'button', class: 'seg-btn' + (sel.indexOf(o.value) >= 0 ? ' on' : ''),
      'aria-pressed': String(sel.indexOf(o.value) >= 0), disabled: !!o.locked }, o.label);
    b.addEventListener('click', () => {
      const i = sel.indexOf(o.value);
      if (i >= 0) sel.splice(i, 1); else sel.push(o.value);
      b.classList.toggle('on', i < 0);
      b.setAttribute('aria-pressed', String(i < 0));
      onChange(sel.slice());
    });
    wrap.appendChild(b);
  });
  return wrap;
}

/** ANO / NE buttons without a default. lower = show "ano / ne" (SAFETY wording). */
function yesNo(value, onChange, opts) {
  opts = opts || {};
  return segmented([
    { value: 'ANO', label: opts.lower ? t('lbl.yesLower') : t('lbl.yes'), kind: opts.yesKind || 'danger' },
    { value: 'NE', label: opts.lower ? t('lbl.noLower') : t('lbl.no'), kind: 'ok' }
  ], value, onChange, 'seg-big');
}

/** <select>. options: [{value, label}] or strings. */
function selectEl(options, value, onChange, placeholder) {
  const s = h('select', { onchange: e => onChange(e.target.value) });
  if (placeholder !== false) s.appendChild(h('option', { value: '' }, placeholder || t('lbl.choose')));
  options.forEach(o => {
    const opt = typeof o === 'object' ? o : { value: o, label: o };
    s.appendChild(h('option', { value: opt.value }, opt.label));
  });
  s.value = value || '';
  return s;
}

function textInput(value, onChange, opts) {
  opts = opts || {};
  return h('input', { type: opts.type || 'text', value: value || '', placeholder: opts.placeholder || '',
    maxlength: opts.max || 300, inputmode: opts.inputmode || null, oninput: e => onChange(e.target.value) });
}
function numInput(value, onChange) {
  return h('input', { type: 'number', min: 0, step: 1, inputmode: 'numeric', value: value === '' || value === undefined ? '' : value,
    oninput: e => onChange(e.target.value === '' ? '' : Number(e.target.value)) });
}
function textArea(value, onChange, rows, max) {
  return h('textarea', { rows: rows || 3, maxlength: max || 2000, value: value || '', oninput: e => onChange(e.target.value) });
}
/** datetime-local (value 'YYYY-MM-DDTHH:mm', Prague). */
function dtInput(value, onChange, max) {
  return h('input', { type: 'datetime-local', value: value || '', max: max || null, oninput: e => onChange(e.target.value) });
}
function dateInput(value, onChange, opts) {
  opts = opts || {};
  return h('input', { type: 'date', value: value || '', min: opts.min || null, max: opts.max || null,
    oninput: e => onChange(e.target.value) });
}
function checkbox(label, checked, onChange) {
  return h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: !!checked, onchange: e => onChange(e.target.checked) }), label);
}

/** Person picker (value = name, or e-mail with byEmail). Only people with an e-mail when byEmail. */
function personSelect(value, onChange, area, opts) {
  opts = opts || {};
  const list = peopleOf(area, opts.roles).filter(p => !opts.byEmail || p.email)
    .map(p => ({ value: opts.byEmail ? p.email : p.name, label: p.name + (opts.showRoles ? ' (' + p.roles.join(', ') + ')' : '') }));
  if (value && !list.some(o => o.value === value)) list.unshift({ value: value, label: opts.byEmail ? personName(value) : value });
  return selectEl(list, value, onChange, opts.placeholder);
}

/** Button that disables itself while its async handler runs. */
function button(label, onClick, kind, opts) {
  opts = opts || {};
  const b = h('button', { type: 'button', class: 'btn btn-' + (kind || 'ghost') + (opts.big ? ' btn-big' : ''), disabled: !!opts.disabled });
  addKids(b, [label]);
  b.addEventListener('click', async () => {
    if (b.disabled) return;
    b.disabled = true;
    try { await onClick(); } finally { if (b.isConnected) b.disabled = !!opts.disabled; }
  });
  return b;
}

/** Board chips 1–7. */
function chipsEl(chips) {
  return h('div', { class: 'chips', 'aria-label': t('board.chips') }, (chips || []).map((c, i) =>
    h('span', { class: 'chip chip-' + c, title: t('chip.' + (i + 1)) + ': ' + t('chipState.' + c) }, String(i + 1))));
}
function statusBadge(st) { return h('span', { class: 'badge badge-st' }, statusLabel(st)); }

/** Section card with the round number and role colour (op | sup | pil | mgr). */
function sectionCard(num, title, role, ...content) {
  return h('section', { class: 'card sec sec-' + role },
    h('div', { class: 'sec-head' }, h('span', { class: 'sec-num' }, num), h('h2', { class: 'sec-title' }, title)),
    content);
}

/** Definition list: [[label, value], …]; empty values are skipped. */
function kvList(pairs) {
  const dl = h('dl', { class: 'kv' });
  pairs.forEach(p => {
    if (p[1] === '' || p[1] === null || p[1] === undefined || p[1] === false) return;
    dl.appendChild(h('dt', null, p[0]));
    dl.appendChild(h('dd', null, p[1]));
  });
  return dl;
}

function errorBox() { return h('div', { class: 'errbox', hidden: true, role: 'alert' }); }

/** Shows a list of client-side errors in a box. errs: [{code, field, …}] like the server. */
function setErrors(box, errs, root) {
  showErrors({ errors: errs }, box, root);
  return errs.length === 0;
}

/** Simple table. rows: arrays of cells (strings or nodes). */
function table(headers, rows, rowCls) {
  return h('table', { class: 'tbl' },
    h('thead', null, h('tr', null, headers.map(x => h('th', null, x)))),
    h('tbody', null, rows.map((r, i) => h('tr', { class: rowCls ? rowCls(i) : null }, r.map(c => h('td', null, c))))));
}

/** "Loading…" placeholder. */
function loadingEl() { return h('div', { class: 'loading' }, t('msg.loading')); }

/** Link-style button that opens a QRAP. */
function qrapLink(id) {
  return id ? h('a', { href: '#', onclick: e => { e.preventDefault(); go('qrap', { id: id }); } }, id) : '';
}

/** Yes / no text for ANO / NE. */
function yn(v, lower) {
  if (v === 'ANO') return lower ? t('lbl.yesLower') : t('lbl.yes');
  if (v === 'NE') return lower ? t('lbl.noLower') : t('lbl.no');
  return '–';
}
</script>
