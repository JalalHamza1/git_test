<script>
'use strict';
/*
 * ViewAssess – ⑦ Hodnocení QRQC (?page=assess&id=…), for the phone.
 * 5 criteria OK / NOK / NA, "OJT s kým", feedback + type. Next to each criterion the page shows what the
 * app knows (① complete, ③ state, photos, shifts informed, lesson) so the assessor does not tick blindly.
 */
App.views.assess = (() => {
  async function render(root, params) {
    const d = await loadDetail(root, params.id);
    if (!d) return;
    const q = d.q;
    const f = { c1: '', c2: '', c3: '', c4: '', c5: '', ojt_with: q.finder_name || '', feedback: '', feedback_type: '' };
    const box = errorBox();
    const kinds = d.photos.map(p => p.kind);
    const hints = {
      c1: [!!q.s1_done_at, t('assess.h1')],
      c2: [d.s3.complete, t('assess.h2') + (d.ia.length ? ' · ' + t('assess.hActions', { n: d.ia.length }) : '')],
      c3: [kinds.indexOf('WRONG') >= 0 && kinds.indexOf('CORRECT') >= 0, t('assess.h3')],
      c4: [null, t('assess.h4', { n: d.shiftInfo.length, all: App.set.shifts.length }) + (q.learned ? ' · ' + t('f.learned') + ' ✓' : '')],
      c5: [null, t('assess.h5')]
    };
    const photos = d.photos.filter(p => p.kind !== 'DOC').map(p => {
      const img = h('img', { alt: '' });
      loadPhoto(p.thumb_file_id, img);
      return h('div', { class: 'thumb thumb-' + p.kind.toLowerCase() }, h('b', null, t('wiz.photo' + p.kind)), img);
    });
    const criteria = [1, 2, 3, 4, 5].map(n => {
      const hint = hints['c' + n];
      return h('div', { class: 'fld crit', 'data-field': 'c' + n },
        h('div', null,
          h('div', { class: 'crit-title' }, t('assess.c' + n), h('span', { class: 'req' }, ' *')),
          h('div', { class: 'crit-sub' }, t('assess.sub' + n)),
          h('div', { class: 'crit-hint' }, hint[0] === null ? null : mark(hint[0]), hint[0] === null ? '' : ' ', hint[1]),
          n === 3 && photos.length ? h('div', { class: 'thumbs' }, photos) : null),
        segmented([{ value: 'OK', label: 'OK' }, { value: 'NOK', label: 'NOK' }, { value: 'NA', label: 'N/A' }], f['c' + n], v => { f['c' + n] = v; }),
        h('div', { class: 'fld-err' }));
    });
    addKids(root, [
      pageHead({ crumbs: [boardCrumb(q.area_code), qrapCrumb(q.qrap_id), { label: t('qrap.assess') }], title: t('assess.title'),
        badges: statusBadge(q.status), sub: q.qrap_id + ' · ' + q.what }),
      d.can.assess ? card(null, box, criteria,
        h('div', { style: { marginTop: '18px' } },
          formGrid(
            field(t('f.ojt_with'), personSelect(f.ojt_with, v => { f.ojt_with = v; }, q.area_code), { name: 'ojt_with' }),
            field(t('f.feedback_type'), segmented(['PRAISE', 'STRENGTH', 'IMPROVE'].map(x => ({ value: x, label: t('fb.' + x) })), '',
              v => { f.feedback_type = v; }), { name: 'feedback_type' })),
          field(t('f.feedback'), textArea('', v => { f.feedback = v; }, 3, 2000), { name: 'feedback', required: true }),
          h('p', { class: 'fld-hint' }, t('assess.auto', { user: App.user.name })),
          button(t('assess.save'), async () => {
            const errs = [];
            ['c1', 'c2', 'c3', 'c4', 'c5'].forEach(c => { if (!f[c]) errs.push({ code: 'E_CRITERIA', field: c }); });
            if (!f.feedback.trim()) errs.push({ code: 'E_REQUIRED', field: 'feedback' });
            if (!setErrors(box, errs, root)) return;
            const res = await api('apiSaveAssessment', Object.assign({ id: q.qrap_id }, f));
            if (!res.ok) { showErrors(res, box, root); return; }
            toast(t('assess.saved'), 'ok');
            go('qrap', { id: q.qrap_id });
          }, 'primary', { big: true })))
        : card(null, h('div', { class: 'note' }, q.status === 'DRAFT' ? t('assess.draft') : t('err.E_FORBIDDEN'))),
      d.assess.length ? card(t('assess.history'),
        table([t('f.at'), t('f.assessor'), '1', '2', '3', '4', '5', t('f.feedback')], d.assess.map(a => [fmtDT(a.at), personName(a.assessor),
          a.c1, a.c2, a.c3, a.c4, a.c5, a.feedback + (a.feedback_type ? ' (' + t('fb.' + a.feedback_type) + ')' : '')]))) : null
    ]);
  }
  return { render: render };
})();
</script>
