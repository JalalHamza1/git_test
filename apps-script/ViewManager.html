<script>
'use strict';
/*
 * ViewManager – manager page (?page=manager): key numbers, "Potřebuje vás" (most urgent first),
 * assessments today per supervisor, filters (area / date / status) and search (number, text, material).
 */
App.views.manager = (() => {
  const F = { area: '', from: '', to: '', status: 'open' };

  function render(root) {
    const out = h('div', null, loadingEl());
    const results = h('div');
    let term = '';
    const doSearch = async () => {
      if (term.trim().length < 2) { clear(results); return; }
      const res = await api('apiSearch', term.trim());
      clear(results);
      if (!res.ok) { showErrors(res); return; }
      results.appendChild(card(t('mgr.searchResults', { n: res.total }), rowsTable(res.rows)));
    };
    const statuses = [{ value: 'open', label: t('mgr.st.open') }, { value: 'closed', label: t('mgr.st.closed') }, { value: 'all', label: t('mgr.st.all') }]
      .concat(['DRAFT', 'QR_OPEN', 'WAIT_DECISION', 'ANALYSIS', 'ACTIONS_OPEN', 'VERIFY', 'CLOSED_SOLVED', 'ESCALATED', 'CLOSED']
        .map(s => ({ value: s, label: statusLabel(s) })));
    const search = h('input', { type: 'search', placeholder: t('mgr.searchHint'), oninput: e => { term = e.target.value; },
      onkeydown: e => { if (e.key === 'Enter') doSearch(); } });
    addKids(root, [
      pageHead({ title: t('mgr.title'), sub: t('mgr.sub'),
        actions: h('div', { style: { width: '380px', maxWidth: '100%' } }, withButton(search, button(t('btn.search'), doSearch, 'ghost'))) }),
      results,
      h('div', { class: 'card' }, h('div', { class: 'toolbar' },
        field(t('f.area'), selectEl(App.set.areas.map(a => ({ value: a.code, label: a.code + ' · ' + a.name })), F.area, v => { F.area = v; }, t('mgr.allAreas'))),
        field(t('mgr.from'), dateInput(F.from, v => { F.from = v; })),
        field(t('mgr.to'), dateInput(F.to, v => { F.to = v; })),
        field(t('f.status'), selectEl(statuses, F.status, v => { F.status = v; }, false)),
        button(t('btn.apply'), () => load(out), 'primary'))),
      out
    ]);
    load(out);
  }

  async function load(out) {
    clear(out).appendChild(loadingEl());
    const res = await api('apiGetManager', F);
    clear(out);
    if (!res.ok) { out.appendChild(h('div', { class: 'empty' }, errText(res.errors[0]))); return; }
    const tile = (key, alert) => h('div', { class: 'tile' + (alert && res.tiles[key] ? ' alert' : '') },
      h('div', { class: 'tile-n' }, String(res.tiles[key])), h('div', { class: 'tile-l' }, t('mgr.tile.' + key)));
    const assessTotal = res.assessToday.reduce((s, a) => s + a.count, 0);
    const missing = res.assessToday.filter(a => a.supervisor && a.count === 0).length;
    addKids(out, [
      h('div', { class: 'tiles' }, tile('newToday'), tile('waitDecision', true), tile('s3Late', true), tile('actionsLate', true),
        tile('safetyWeek', true), tile('repeat7', true),
        h('div', { class: 'tile' + (missing ? ' alert' : '') }, h('div', { class: 'tile-n' }, String(assessTotal)),
          h('div', { class: 'tile-l' }, t('mgr.tile.assessToday')))),
      h('div', { class: 'cols' },
        card(t('mgr.needs') + ' (' + res.needs.length + ')',
          res.needs.length ? h('div', { class: 'list' }, res.needs.map(n => listRow(
            [h('div', null, h('b', null, n.id), ' ', n.safety ? tag('SAFETY', 'bad') : null, ' ', h('span', null, t('need.' + n.reason))),
              h('div', { class: 'small muted' }, n.what + (n.extra ? ' · ' + n.extra : ''))],
            h('span', null, n.area, h('br'), fmtDT(n.since)),
            { onClick: () => go('qrap', { id: n.id }), cls: n.urgency >= 80 ? 'urgent' : 'attention' })))
            : h('p', { class: 'muted' }, t('mgr.nothing'))),
        card(t('mgr.assessToday'),
          res.assessToday.length ? h('div', { class: 'list' }, res.assessToday.map(a => listRow(
            a.name + (a.supervisor ? '' : ' *'), h('span', { class: a.count ? 'pill-ok' : 'pill-bad' }, String(a.count)))))
            : h('p', { class: 'muted' }, '–'))),
      card(t('mgr.list', { n: res.total }), rowsTable(res.rows))
    ]);
  }

  /** Compact QRAP table (area, number, what, status, progress). */
  function rowsTable(rows) {
    if (!rows.length) return h('p', { class: 'muted' }, t('board.empty'));
    return table([t('f.area'), t('board.col.id'), t('board.col.what'), t('board.col.status'), t('board.col.progress')], rows.map(r => [
      r.area,
      h('span', null, qrapLink(r.id), ' ', qrapTags(r.safety, false, r.archived)),
      h('span', null, r.what, h('div', { class: 'small muted' }, fmtDT(r.det))),
      h('span', null, statusBadge(r.st), r.late ? h('div', { class: 'small pill-bad' }, t('lbl.late')) : null),
      chipsEl(r.chips)]), i => (rows[i].late ? 'late' : ''));
  }

  return { render: render };
})();
</script>
