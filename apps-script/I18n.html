'use strict';
/*
 * I18n – every UI text in Czech (default) and English. t('key', {param}) returns the text of the current language;
 * {name} placeholders are replaced by params. Missing English texts fall back to Czech, missing keys return the key.
 */
let I18N_LANG = 'cz';
try { const saved = localStorage.getItem('eqrap_lang'); if (saved === 'cz' || saved === 'en') I18N_LANG = saved; } catch (e) { /* private mode */ }

function setLang(l) {
  I18N_LANG = l === 'en' ? 'en' : 'cz';
  try { localStorage.setItem('eqrap_lang', I18N_LANG); } catch (e) { /* ignore */ }
  document.documentElement.lang = I18N_LANG === 'en' ? 'en' : 'cs';
}

function t(key, params) {
  let s = (I18N[I18N_LANG] || {})[key];
  if (s === undefined) s = I18N.cz[key];
  if (s === undefined) return key;
  if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] !== undefined && params[k] !== null ? String(params[k]) : ''));
  return s;
}
