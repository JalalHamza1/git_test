<script>
'use strict';
/*
 * ViewActions – "Moje akce" (?page=actions): definitive actions of the signed-in pilot, or of the people
 * whose N+1 the user is ("Můj tým"). Filters by status and due date; done date, notes and review dates.
 */
App.views.actions = (() => {
  const F = { scope: 'mine', status: 'OPENED', due: 'all' };

  function render(root) {
    const list = h('div', null, loadingEl());
    const reload = () => load(list);
    addKids(root, [
      pageHead({ title: t('act.title'), sub: t('act.sub'),
        actions: tabs([{ value: 'mine', label: t('act.mine') }, { value: 'team', label: t('act.team') }], F.scope, v => { F.scope = v; reload(); }) }),
      h('div', { class: 'card' }, h('div', { class: 'toolbar' },
        field(t('f.status'), segmented(['OPENED', 'CLOSED', 'REMOVED', 'ALL'].map(s => ({ value: s, label: t('ast.' + s) })), F.status,
          v => { F.status = v || 'OPENED'; reload(); })),
        field(t('act.due'), segmented(['all', 'late', 'week'].map(s => ({ value: s, label: t('act.due.' + s) })), F.due,
          v => { F.due = v || 'all'; reload(); })))),
      list
    ]);
    reload();
  }

  async function load(list) {
    clear(list).appendChild(loadingEl());
    const res = await api('apiGetMyActions', F);
    clear(list);
    if (!res.ok) { showErrors(res); return; }
    if (!res.actions.length) { list.appendChild(h('div', { class: 'card empty' }, t('act.none'))); return; }
    res.actions.forEach(a => list.appendChild(actionCard(a, () => load(list))));
  }

  function actionCard(a, reload) {
    const box = errorBox();
    let done = a.done || '';
    const nv = { note: '', review_date: '' };
    return h('div', { class: 'card sec sec-pil' + (a.late ? ' late' : '') },
      h('div', { class: 'sec-head' },
        h('div', { style: { minWidth: '0' } },
          h('div', { class: 'small muted' }, qrapLink(a.qrap.id), ' · ', a.qrap.area, ' · ', statusLabel(a.qrap.status)),
          h('div', { style: { fontSize: '16px', fontWeight: '600', marginTop: '2px' } }, a.text)),
        h('div', { style: { marginLeft: 'auto', display: 'flex', gap: '6px' } }, a.late ? tag(t('lbl.late'), 'bad') : null,
          h('span', { class: 'status status-' + (a.status === 'CLOSED' ? 'done' : a.status === 'OPENED' ? 'active' : 'neutral') },
            h('i'), t('ast.' + a.status)))),
      kvList([
        [t('f.qrap'), a.qrap.what],
        [t('f.pilot'), a.pilot_name],
        [t('f.planned'), fmtD(a.planned) + (a.planned_first && a.planned_first !== a.planned ? ' (' + t('ana.firstPlan') + ' ' + fmtD(a.planned_first) + ')' : '')],
        [t('f.done'), fmtD(a.done)],
        [t('f.evidence_url'), a.evidence_url ? h('a', { href: a.evidence_url, target: '_blank', rel: 'noopener' }, a.evidence_url) : '']
      ]),
      box,
      a.canEdit && a.status === 'OPENED' ? h('div', { style: { marginTop: '14px', maxWidth: '460px' } },
        field(t('act.doneDate'), withButton(dateInput(done, v => { done = v; }, { max: todayLocal() }),
          button(t('act.markDone'), async () => {
            const res = await api('apiSaveDefAction', { id: a.id, done: done || todayLocal(), evidence_url: a.evidence_url || '' });
            if (!res.ok) { showErrors(res, box); return; }
            toast(t('msg.saved'), 'ok');
            reload();
          }, 'primary')), { name: 'done' })) : null,
      a.notes.length || a.canNote ? h('div', { class: 'form-group-title', style: { marginTop: '12px' } }, t('ana.notes')) : null,
      a.notes.length ? table([t('f.note'), t('f.review_date'), t('f.author'), ''], a.notes.map(n => [n.note,
        n.review_date ? fmtD(n.review_date) : '', personName(n.author) + ' · ' + fmtDT(n.at),
        n.review_date && a.canNote ? checkbox(t('act.reviewDone'), n.review_done === true, async v => {
          const res = await api('apiSetReviewDone', { note_id: n.id, done: v });
          if (!res.ok) showErrors(res);
        }) : ''])) : null,
      a.canNote ? h('div', { class: 'row', style: { marginTop: '8px' } },
        textInput('', v => { nv.note = v; }, { placeholder: t('f.note'), max: 1000 }),
        h('div', { style: { flex: '0 0 190px' }, title: t('f.review_date') }, dateInput('', v => { nv.review_date = v; })),
        h('div', { style: { flex: '0 0 auto' } }, button(t('btn.addNote'), async () => {
          const res = await api('apiAddActionNote', { action_id: a.id, note: nv.note, review_date: nv.review_date });
          if (!res.ok) { showErrors(res, box); return; }
          reload();
        }, 'ghost'))) : null,
      h('div', { class: 'btn-row' }, button(t('qrap.analysis'), () => go('analysis', { id: a.qrap.id }), 'link')));
  }

  return { render: render };
})();
</script>
