<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tasks</title>
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <style>
    /* ===== Tokens ======================================================== */
    :root {
      --bg: #0b0f14;
      --bg-2: #0e1319;
      --card: #151b23;
      --card-hi: #1b232d;
      --raised: #1a212b;
      --line: #232c37;
      --line-2: #2f3a47;
      --text: #e6edf3;
      --text-2: #9ba8b5;
      --text-3: #6f7b89;
      --accent: #6ea8fe;
      --accent-ink: #0b1220;
      --accent-soft: rgba(110, 168, 254, .14);
      --chart: #5b8def;
      --red: #ff7b72;
      --red-soft: rgba(255, 123, 114, .14);
      --green: #3fb950;
      --green-soft: rgba(63, 185, 80, .14);
      --amber: #e3b341;
      --amber-soft: rgba(227, 179, 65, .14);
      --star: #f5c451;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .28);
      --shadow-lg: 0 24px 56px rgba(0, 0, 0, .55);
      --ease: cubic-bezier(.2, 0, 0, 1);
      --drawer-w: 264px;
      --card-w: 360px;
      --panel-w: 420px;
      color-scheme: dark;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
    ::selection { background: rgba(110, 168, 254, .35); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background-color: #3d4a59; }
    ::-webkit-scrollbar-track { background: transparent; }
    kbd {
      font: 500 11px/1 Inter, system-ui, sans-serif; color: var(--text-2);
      border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px; background: var(--card);
    }

    /* ===== Shell ========================================================= */
    .app {
      display: grid;
      grid-template-columns: var(--drawer-w) minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      transition: grid-template-columns .25s var(--ease);
    }
    .app.drawer-closed { grid-template-columns: 0 minmax(0, 1fr); }

    .drawer {
      background: var(--bg-2);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      min-width: 0; overflow: hidden;
    }
    .drawer-inner { width: var(--drawer-w); display: flex; flex-direction: column; height: 100%; overflow-y: auto; padding: 14px 12px 12px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; font-weight: 600; font-size: 17px; letter-spacing: -.1px; }
    .brand svg { width: 26px; height: 26px; color: var(--accent); }
    .create {
      display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
      height: 48px; padding: 0 20px 0 16px; margin: 0 0 14px 2px;
      border: 1px solid var(--line-2); border-radius: 16px; background: var(--card);
      font-weight: 600; box-shadow: var(--shadow);
      transition: background .15s var(--ease), transform .15s var(--ease);
    }
    .create svg { color: var(--accent); width: 22px; height: 22px; }
    .create:hover { background: var(--card-hi); }
    .create:active { transform: scale(.98); }

    .nav-item, .dl-row {
      display: flex; align-items: center; gap: 12px; width: 100%;
      min-height: 38px; padding: 0 10px 0 12px; border-radius: 19px; border: 0; background: none;
      color: var(--text-2); text-align: left; font-weight: 500;
      transition: background .12s var(--ease), color .12s var(--ease);
    }
    .nav-item:hover, .dl-row:hover { background: var(--card-hi); color: var(--text); }
    .nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
    .nav-item span.lbl { flex: 1; }
    .nav-item .badge { font-size: 12px; font-weight: 600; color: var(--text-3); }
    .nav-item .badge.hot { color: var(--red); }
    .nav-item[aria-current="page"] .badge { color: var(--accent); }

    .drawer-sec { display: flex; align-items: center; padding: 18px 6px 6px 12px; color: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; }
    .drawer-sec span { flex: 1; }
    .drawer-sec .icon-btn { width: 28px; height: 28px; }
    .drawer-sec .icon-btn svg { width: 18px; height: 18px; }

    .dl-row { padding: 0 4px 0 8px; gap: 8px; }
    .dl-check {
      width: 20px; height: 20px; flex: none; display: grid; place-items: center; padding: 0;
      border: 2px solid var(--c); border-radius: 6px; background: var(--c); color: var(--accent-ink);
      transition: background .12s var(--ease);
    }
    .dl-check svg { width: 16px; height: 16px; }
    .dl-row.off .dl-check { background: none; }
    .dl-row.off .dl-check svg { opacity: 0; }
    .dl-name { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 0; text-align: left; color: inherit; font-weight: 500; }
    .dl-name span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl-count { font-size: 12px; color: var(--text-3); min-width: 16px; text-align: right; }
    .dl-row .dl-more { width: 28px; height: 28px; opacity: 0; }
    .dl-row:hover .dl-more, .dl-row:focus-within .dl-more { opacity: 1; }
    .drawer-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }

    .drawer-scrim { display: none; }

    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }

    /* ===== Top bar ======================================================= */
    .topbar { display: flex; align-items: center; gap: 6px; padding: 10px 16px 8px 10px; flex: none; }
    .topbar h1 { flex: none; margin: 0 8px 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .spacer { flex: 1; }
    .search {
      display: flex; align-items: center; gap: 8px; flex: 0 1 420px; min-width: 0;
      height: 40px; padding: 0 8px 0 12px; margin-left: auto;
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      color: var(--text-3); transition: border-color .15s var(--ease), background .15s var(--ease);
    }
    .search:focus-within { border-color: var(--accent); background: var(--raised); color: var(--text-2); }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); height: 100%; }
    .search input::placeholder { color: var(--text-3); }
    .search input::-webkit-search-cancel-button { display: none; }
    .search .icon-btn { width: 28px; height: 28px; }
    .search .icon-btn svg { width: 18px; height: 18px; }
    .status { font-size: 12px; color: var(--text-3); min-width: 56px; text-align: right; white-space: nowrap; transition: opacity .3s; }
    .status.saving { color: var(--text-2); }

    .icon-btn {
      width: 38px; height: 38px; flex: none; display: grid; place-items: center; padding: 0;
      border: 0; border-radius: 50%; background: none; color: var(--text-2);
      transition: background .12s var(--ease), color .12s var(--ease);
    }
    .icon-btn:hover { background: var(--card-hi); color: var(--text); }
    .icon-btn:active { background: var(--line-2); }
    .icon-btn.spin svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Board ========================================================= */
    .board {
      flex: 1; min-height: 0;
      display: flex; align-items: flex-start; gap: 16px;
      overflow: auto; overscroll-behavior: contain;
      padding: 6px 24px 24px;
      transition: padding-right .25s var(--ease);
    }
    .board.single { justify-content: center; }
    .board::after { content: ''; flex: 0 0 8px; align-self: stretch; }

    .card {
      position: relative; flex: none; width: var(--card-w); max-height: 100%;
      display: flex; flex-direction: column;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
      --c: var(--accent);
    }
    .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--c); opacity: .9; }
    .card.wide { width: min(680px, 100%); }
    .card.flash { animation: flash .9s var(--ease); }
    @keyframes flash { 30% { box-shadow: 0 0 0 2px var(--c), var(--shadow); } }
    .card.drop-hover { border-color: var(--c); }

    .card-head { display: flex; align-items: center; gap: 8px; padding: 14px 8px 4px 16px; flex: none; }
    .card-head .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
    .card-head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-head .count { color: var(--text-3); font-size: 13px; font-weight: 500; }
    .card-head .grow { flex: 1; }
    .card-head .icon-btn { width: 32px; height: 32px; }
    .card-head .icon-btn svg { width: 18px; height: 18px; }
    .card-sub { padding: 0 16px 6px; color: var(--text-3); font-size: 12px; margin-top: -2px; }
    .card-meter { margin: 2px 16px 8px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-2); }
    .meter { flex: 1; height: 6px; border-radius: 3px; background: rgba(91, 141, 239, .18); overflow: hidden; }
    .meter i { display: block; height: 100%; border-radius: 3px; background: var(--chart); transition: width .4s var(--ease); }

    .card-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; flex: 1; padding-bottom: 8px; }
    .card-body { min-height: 8px; padding: 0 0 4px; }

    .text-btn {
      border: 0; background: none; border-radius: 16px; padding: 7px 12px; font-weight: 600; font-size: 13px; color: var(--accent);
      transition: background .12s var(--ease);
    }
    .text-btn:hover { background: var(--accent-soft); }
    .text-btn.danger { color: var(--red); }
    .text-btn.danger:hover { background: var(--red-soft); }
    .text-btn[disabled] { color: var(--text-3); background: none; cursor: default; }

    .new-list-card {
      flex: none; width: 240px; height: 120px; display: grid; place-items: center; gap: 6px;
      border: 1.5px dashed var(--line-2); border-radius: var(--radius); background: none; color: var(--text-3); font-weight: 600;
      transition: border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
    }
    .new-list-card:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .new-list-card span { display: flex; align-items: center; gap: 8px; }

    /* ===== Quick add ===================================================== */
    .qa { padding: 2px 12px 6px 10px; flex: none; }
    .qa-row {
      display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 12px;
      color: var(--accent); cursor: text; transition: background .12s var(--ease);
    }
    .qa-row:hover { background: var(--card-hi); }
    .qa-row:focus-within { background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--line-2); }
    .qa-row svg { width: 22px; height: 22px; }
    .qa-input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); height: 100%; }
    .qa-input::placeholder { color: var(--accent); font-weight: 500; }
    .qa-row:focus-within .qa-input::placeholder { color: var(--text-3); font-weight: 400; }
    .qa-preview { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px 2px 44px; }
    .qa-preview:empty { display: none; }
    .qa-hint { font-size: 11px; color: var(--text-3); align-self: center; }

    /* ===== Task rows ===================================================== */
    .section-label { padding: 12px 18px 4px; font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .7px; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
    .section-label.hot { color: var(--red); }
    .task {
      position: relative; display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 8px 8px 2px; margin: 0 6px; border-radius: 12px;
      outline: 0; cursor: pointer; user-select: none;
      transition: background .12s var(--ease);
    }
    .task:hover { background: var(--card-hi); }
    .task:focus-visible { background: var(--card-hi); box-shadow: inset 0 0 0 2px var(--accent); }
    .task.sub { margin-left: 34px; }
    .task.enter { animation: rowIn .28s var(--ease); }
    @keyframes rowIn { from { opacity: 0; transform: translateY(-6px); } }
    .task.leaving, .group.leaving { animation: rowOut .2s var(--ease) forwards; pointer-events: none; }
    @keyframes rowOut { to { opacity: 0; transform: translateX(16px); } }

    .grip, .grip-space { width: 16px; height: 22px; flex: none; display: grid; place-items: center; color: var(--text-3); margin-top: 1px; }
    .grip { opacity: 0; cursor: grab; touch-action: none; transition: opacity .12s; }
    .grip svg { width: 16px; height: 16px; }
    .task:hover .grip, .task:focus-visible .grip { opacity: 1; }
    @media (hover: none) { .grip { opacity: .7; } }

    .check {
      width: 22px; height: 22px; flex: none; margin-top: 0; padding: 0;
      display: grid; place-items: center; position: relative;
      border: 2px solid var(--text-3); border-radius: 50%; background: none; color: var(--accent-ink);
      transition: border-color .15s var(--ease), background .15s var(--ease);
    }
    .check svg { width: 16px; height: 16px; opacity: 0; transform: scale(.4); transition: opacity .15s var(--ease), transform .2s var(--ease); color: var(--accent); }
    .check:hover { border-color: var(--accent); }
    .check:hover svg { opacity: 1; transform: scale(1); }
    .task.done .check, .task.completing .check { background: var(--accent); border-color: var(--accent); }
    .task.done .check svg, .task.completing .check svg { opacity: 1; transform: scale(1); color: var(--accent-ink); }
    .task.completing .task-title { color: var(--text-3); text-decoration: line-through; }
    .task.completing { animation: pulse .26s var(--ease); }
    @keyframes pulse { 50% { background: var(--accent-soft); } }

    .task-body { flex: 1; min-width: 0; padding-top: 1px; }
    .task-title { font-size: 14px; line-height: 20px; word-break: break-word; }
    .task.done .task-title { color: var(--text-3); text-decoration: line-through; }
    .task-notes { font-size: 13px; line-height: 18px; color: var(--text-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    mark { background: rgba(245, 196, 81, .28); color: inherit; border-radius: 3px; padding: 0 1px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
      font-size: 12px; line-height: 18px; padding: 1px 8px; border-radius: 10px;
      background: var(--bg-2); color: var(--text-2); border: 1px solid var(--line);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip svg { width: 13px; height: 13px; }
    .chip .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
    .chip.today { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
    .chip.overdue, .chip.high { color: var(--red); background: var(--red-soft); border-color: transparent; }
    .chip.low { color: var(--green); background: var(--green-soft); border-color: transparent; }
    .chip.blocked { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
    .chip.progress { color: var(--accent); border-color: rgba(110, 168, 254, .35); background: none; }
    .chip.star { color: var(--star); background: rgba(245, 196, 81, .12); border-color: transparent; }

    .star {
      width: 30px; height: 30px; margin: -4px -2px -4px 0; flex: none; display: grid; place-items: center; padding: 0;
      border: 0; border-radius: 50%; background: none; color: var(--text-3); opacity: 0;
      transition: opacity .12s, color .12s, background .12s;
    }
    .star svg { width: 19px; height: 19px; }
    .task:hover .star, .task:focus-visible .star, .star.on { opacity: 1; }
    .star:hover { background: var(--line); color: var(--text); }
    .star.on { color: var(--star); }
    @media (hover: none) { .star { opacity: .6; } }
    .row-actions { display: flex; gap: 2px; margin: -5px -2px -5px 0; }
    .row-actions .icon-btn { width: 32px; height: 32px; }
    .row-actions .icon-btn svg { width: 18px; height: 18px; }

    .done-sec { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 4px; }
    .done-toggle {
      display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none;
      padding: 8px 16px; color: var(--text-2); font-weight: 600; font-size: 13px; text-align: left;
    }
    .done-toggle:hover { color: var(--text); }
    .done-toggle svg { width: 18px; height: 18px; transition: transform .2s var(--ease); transform: rotate(-90deg); }
    .done-sec.open .done-toggle svg { transform: none; }

    .mini-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 16px 26px; color: var(--text-3); font-size: 13px; text-align: center; }
    .mini-empty svg { width: 40px; height: 40px; opacity: .5; }
    .mini-empty strong { color: var(--text-2); font-weight: 600; font-size: 14px; }

    /* ===== Drag & drop =================================================== */
    body.dragging, body.dragging * { cursor: grabbing !important; user-select: none !important; }
    .ghost {
      position: fixed; z-index: 90; pointer-events: none; margin: 0;
      background: var(--raised); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg);
      transform: rotate(1.5deg); opacity: .96;
    }
    .ghost .grip, .ghost .star { opacity: 1; }
    .drag-src { display: none !important; }
    .drop-ph { margin: 2px 8px; border-radius: 12px; background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px rgba(110, 168, 254, .55); }
    .drop-ph.sub { margin-left: 40px; }

    /* ===== Skeleton / empty ============================================= */
    .skeleton { padding: 18px 16px; }
    .skeleton i {
      display: block; height: 12px; border-radius: 6px; margin: 14px 0;
      background: linear-gradient(90deg, var(--card-hi) 25%, var(--line-2) 37%, var(--card-hi) 63%);
      background-size: 400% 100%; animation: shimmer 1.3s ease infinite;
    }
    .skeleton i:nth-child(1) { width: 40%; height: 16px; margin-bottom: 22px; }
    .skeleton i:nth-child(even) { width: 78%; }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    .big-empty { margin: auto; text-align: center; color: var(--text-3); padding: 48px 24px; }
    .big-empty svg { width: 72px; height: 72px; opacity: .45; }
    .big-empty p { margin: 8px 0; }
    .big-empty .btn { margin-top: 10px; }

    /* ===== Buttons / controls ============================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line-2);
      background: none; color: var(--text); font-weight: 600; font-size: 13px;
      transition: background .12s var(--ease), border-color .12s var(--ease);
    }
    .btn:hover { background: var(--card-hi); }
    .btn svg { width: 18px; height: 18px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.primary:hover { background: #8ab8ff; }
    .btn.primary[disabled] { background: var(--line-2); border-color: var(--line-2); color: var(--text-3); cursor: default; }
    .btn.danger { color: var(--red); border-color: rgba(255, 123, 114, .4); }
    .btn.danger:hover { background: var(--red-soft); }
    .btn.tonal { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .btn.tonal:hover { background: rgba(110, 168, 254, .22); }

    .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 18px; overflow: hidden; flex-wrap: nowrap; }
    .seg button { border: 0; background: none; padding: 6px 12px; font-size: 12.5px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
    .seg button + button { border-left: 1px solid var(--line-2); }
    .seg button:hover { background: var(--card-hi); color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    .seg button[data-v="High"][aria-pressed="true"] { background: var(--red-soft); color: var(--red); }
    .seg button[data-v="Low"][aria-pressed="true"] { background: var(--green-soft); color: var(--green); }
    .seg button[data-v="Blocked"][aria-pressed="true"] { background: var(--amber-soft); color: var(--amber); }

    .input, .select {
      height: 36px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg-2);
      padding: 0 10px; color: var(--text); outline: 0; min-width: 0;
    }
    .input:focus, .select:focus { border-color: var(--accent); }
    .select option { background: var(--raised); color: var(--text); }

    /* ===== Detail panel ================================================== */
    .panel {
      position: fixed; z-index: 50; top: 12px; right: 12px; bottom: 12px; width: var(--panel-w); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column;
      background: var(--raised); border: 1px solid var(--line-2); border-radius: 20px; box-shadow: var(--shadow-lg);
      transform: translateX(calc(100% + 32px)); visibility: hidden;
      transition: transform .3s var(--ease), visibility 0s linear .3s;
    }
    .panel.open { transform: none; visibility: visible; transition: transform .3s var(--ease), visibility 0s; }
    .pnl-head { display: flex; align-items: center; gap: 4px; padding: 10px 8px 6px 14px; border-bottom: 1px solid var(--line); flex: none; }
    .pnl-head .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; margin-right: 2px; }
    .pnl-head .grow { flex: 1; }
    .pnl-head .list-select { border: 0; background: none; font-weight: 600; color: var(--text); padding: 6px 4px; border-radius: 8px; max-width: 200px; outline: 0; }
    .pnl-head .list-select:hover, .pnl-head .list-select:focus { background: var(--card-hi); }
    .pnl-head .list-select option { background: var(--raised); }
    .pnl-head .pnl-kind { font-weight: 600; }
    .pnl-scroll { flex: 1; overflow-y: auto; padding: 8px 20px 16px; }
    .pnl-back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--text-2); font-size: 12.5px; padding: 6px 8px; margin: 2px 0 0 -8px; border-radius: 8px; max-width: 100%; }
    .pnl-back:hover { background: var(--card-hi); color: var(--text); }
    .pnl-back svg { width: 16px; height: 16px; }
    .pnl-back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pnl-title, .pnl-notes { display: block; width: 100%; resize: none; border: 0; outline: 0; background: none; color: var(--text); padding: 8px 0; }
    .pnl-title { font-size: 21px; font-weight: 600; line-height: 1.3; letter-spacing: -.2px; overflow: hidden; }
    .pnl-title::placeholder, .pnl-notes::placeholder { color: var(--text-3); }
    .pnl-notes { font-size: 14px; line-height: 1.55; color: var(--text-2); min-height: 64px; border-radius: 10px; padding: 8px 10px; margin: 0 -10px; overflow: hidden; }
    .pnl-notes:hover { background: var(--card); }
    .pnl-notes:focus { background: var(--bg-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
    .pnl-done { display: flex; align-items: center; gap: 8px; margin: 4px 0 6px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 500; }
    .pnl-done svg { width: 18px; height: 18px; }
    .pnl-fields { display: flex; flex-direction: column; gap: 4px; margin: 10px 0 6px; }
    .frow { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; padding: 6px 0; }
    .frow > svg { width: 20px; height: 20px; color: var(--text-3); margin-top: 8px; }
    .frow .fctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
    .frow .flabel { width: 100%; font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text-3); margin: 2px 0 -2px; }
    .quick { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
    .quick button { border: 1px solid var(--line-2); background: none; color: var(--text-2); border-radius: 14px; padding: 3px 10px; font-size: 12px; font-weight: 500; }
    .quick button:hover { background: var(--card-hi); color: var(--text); }
    .quick button.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

    .pnl-subs { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
    .pnl-sec-title { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
    .sub-row { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-radius: 10px; }
    .sub-row:hover { background: var(--card); }
    .sub-row .check { width: 20px; height: 20px; }
    .sub-row .check svg { width: 14px; height: 14px; }
    .sub-row.done .check { background: var(--accent); border-color: var(--accent); }
    .sub-row.done .check svg { opacity: 1; transform: none; color: var(--accent-ink); }
    .sub-title { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 2px 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sub-row.done .sub-title { color: var(--text-3); text-decoration: line-through; }
    .sub-add { display: flex; align-items: center; gap: 10px; padding: 5px 4px; color: var(--accent); }
    .sub-add svg { width: 20px; height: 20px; }
    .sub-add input { flex: 1; border: 0; outline: 0; background: none; height: 30px; }
    .sub-add input::placeholder { color: var(--accent); }

    .pnl-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex: none; }
    .pnl-foot .meta { flex: 1; min-width: 0; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ===== Menus, dialogs, snackbar ====================================== */
    .menu-scrim { position: fixed; inset: 0; z-index: 70; }
    .menu {
      position: fixed; z-index: 71; min-width: 220px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow-y: auto;
      padding: 6px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow-lg);
      animation: pop .14s var(--ease);
    }
    @keyframes pop { from { opacity: 0; transform: scale(.96); } }
    .menu-i {
      display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left;
      padding: 8px 12px 8px 10px; border-radius: 9px; color: var(--text); font-size: 13.5px;
    }
    .menu-i svg { width: 18px; height: 18px; color: var(--text-2); }
    .menu-i .mi-space { width: 18px; flex: none; }
    .menu-i span.l { flex: 1; }
    .menu-i:hover, .menu-i:focus-visible { background: var(--card-hi); outline: 0; }
    .menu-i.on { color: var(--accent); }
    .menu-i.on svg { color: var(--accent); }
    .menu-i.danger { color: var(--red); }
    .menu-i.danger svg { color: var(--red); }
    .menu-i[disabled] { color: var(--text-3); cursor: default; background: none; }
    .menu-i[disabled] svg { color: var(--text-3); }
    .menu-i .cdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin: 0 4px; }
    .menu-h { padding: 8px 12px 4px; font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .6px; text-transform: uppercase; }
    .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

    .dlg-scrim { position: fixed; inset: 0; z-index: 80; background: rgba(1, 4, 9, .6); display: grid; place-items: center; padding: 16px; animation: fade .15s var(--ease); }
    @keyframes fade { from { opacity: 0; } }
    .dlg {
      width: min(440px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
      background: var(--raised); border: 1px solid var(--line-2); border-radius: 20px; box-shadow: var(--shadow-lg);
      padding: 22px 22px 16px; animation: pop .18s var(--ease);
    }
    .dlg h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    .dlg p { margin: 6px 0; color: var(--text-2); }
    .dlg-body { margin: 12px 0 4px; display: flex; flex-direction: column; gap: 10px; }
    .dlg-input { height: 42px; font-size: 15px; }
    .dlg-label { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text-3); margin-top: 6px; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, 34px); gap: 8px; }
    .sw { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--c); display: grid; place-items: center; padding: 0; color: var(--accent-ink); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
    .sw svg { opacity: 0; width: 20px; height: 20px; }
    .sw.on { box-shadow: 0 0 0 2px var(--raised), 0 0 0 4px var(--c); }
    .sw.on svg { opacity: 1; }

    .set-group { border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
    .set-group + .set-group { margin-top: 10px; }
    .set-title { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text-3); margin: 14px 0 6px; }
    .set-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
    .set-row + .set-row { border-top: 1px solid var(--line); }
    .set-row .grow { flex: 1; min-width: 0; }
    .set-label { font-weight: 500; }
    .set-desc { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
    .switch { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 12px; background: var(--line-2); position: relative; margin: 0; flex: none; cursor: pointer; transition: background .15s var(--ease); }
    .switch::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text-2); transition: transform .18s var(--ease), background .15s; }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(16px); background: var(--accent-ink); }
    .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; margin-top: 10px; font-size: 13.5px; color: var(--text-2); }
    .keys div:nth-child(odd) { display: flex; gap: 4px; justify-content: flex-end; }

    .snack {
      position: fixed; left: 50%; bottom: 20px; z-index: 85; transform: translate(-50%, 120px);
      display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px);
      background: #e6edf3; color: #0b0f14; border-radius: 12px; padding: 10px 10px 10px 16px;
      box-shadow: var(--shadow-lg); font-size: 13.5px; font-weight: 500; opacity: 0; pointer-events: none;
      transition: transform .25s var(--ease), opacity .25s var(--ease);
    }
    .snack.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
    .snack button { border: 0; background: none; color: #1f5fd1; font-weight: 700; padding: 6px 10px; border-radius: 8px; }
    .snack button:hover { background: rgba(31, 95, 209, .1); }

    .fab {
      position: fixed; right: 16px; bottom: 16px; z-index: 30; display: none; align-items: center; gap: 8px;
      height: 54px; padding: 0 20px 0 16px; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
      font-weight: 700; box-shadow: var(--shadow-lg);
    }
    .fab svg { width: 24px; height: 24px; }

    /* ===== Insights ====================================================== */
    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 8px 16px 16px; }
    .tile { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
    .tile:last-child:nth-child(odd) { grid-column: span 2; }
    .tile-label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
    .tile-label svg { width: 15px; height: 15px; }
    .tile-value { font-size: 28px; font-weight: 600; letter-spacing: -.5px; line-height: 1.2; margin-top: 4px; color: var(--text); }
    .tile-delta { font-size: 12px; margin-top: 2px; color: var(--text-3); }
    .tile-delta.up { color: var(--green); }
    .tile-delta.down { color: var(--red); }
    .tile.alert .tile-label { color: var(--red); }
    .chart { position: relative; padding: 4px 16px 0; }
    .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
    .chart .bar-hit { fill: transparent; cursor: default; outline: none; }
    .chart .bar-hit:hover + .bar, .chart .bar-hit:focus + .bar { fill: #7aa3f2; }
    .chart .bar { fill: var(--chart); pointer-events: none; }
    .chart .grid { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
    .chart .axis { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
    .chart .axis.today { fill: var(--text); font-weight: 600; }
    .chart .val { font-size: 11px; fill: var(--text-2); font-weight: 600; }
    .tip {
      position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -100%);
      background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; box-shadow: var(--shadow);
      font-size: 12px; color: var(--text-2); white-space: nowrap;
    }
    .tip strong { color: var(--text); font-size: 14px; margin-right: 4px; }
    details.table-view { padding: 4px 16px 14px; color: var(--text-2); font-size: 12.5px; }
    details.table-view summary { cursor: pointer; color: var(--text-3); padding: 6px 0; }
    details.table-view table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    details.table-view td, details.table-view th { padding: 4px 0; border-bottom: 1px solid var(--line); text-align: left; }
    details.table-view td:last-child, details.table-view th:last-child { text-align: right; }
    .lrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 16px; }
    .lrow .lname { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 500; }
    .lrow .lname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lrow .lname i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
    .lrow .lnum { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .lrow .meter { grid-column: 1 / -1; height: 6px; }

    /* ===== iPhone screen edges (notch, home indicator) ==================== */
    .topbar { padding-top: max(10px, env(safe-area-inset-top)); padding-right: max(16px, env(safe-area-inset-right)); }
    .drawer-inner { padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .board { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    .fab { bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px)); right: max(16px, env(safe-area-inset-right)); }
    .snack { bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); }
    .panel { bottom: max(12px, env(safe-area-inset-bottom)); }
    input, textarea, select { font-size: max(16px, 1em); }
    .qa-input, .search input, .sub-add input { font-size: 16px; }

    /* ===== Sign-in ======================================================= */
    .auth { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); overflow-y: auto; }
    .auth-card { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 28px 24px 22px; }
    .auth-card .brand { padding: 0 0 6px; }
    .auth-card h2 { margin: 12px 0 4px; font-size: 20px; }
    .auth-card p { margin: 0 0 16px; color: var(--text-2); font-size: 13.5px; }
    .auth-card form { display: flex; flex-direction: column; gap: 10px; }
    .auth-card label { font-size: 12px; font-weight: 600; color: var(--text-2); display: flex; flex-direction: column; gap: 6px; }
    .auth-card .input { height: 44px; font-size: 16px; }
    .auth-card .btn { height: 44px; margin-top: 6px; font-size: 15px; }
    .auth-err { color: var(--red); font-size: 13px; min-height: 18px; }
    .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
    .sync-dot.offline, .sync-dot.error { background: var(--amber); }
    .sync-dot.syncing { background: var(--accent); }
    .feed { display: flex; gap: 8px; margin-top: 8px; }
    .feed .input { flex: 1; font-size: 12.5px; }

    /* ===== Responsive ==================================================== */
    @media (min-width: 1180px) {
      .app.panel-open .board { padding-right: calc(var(--panel-w) + 36px); }
      .app.panel-open .board.single { justify-content: flex-start; }
    }
    @media (max-width: 900px) {
      .app, .app.drawer-closed { grid-template-columns: minmax(0, 1fr); }
      .drawer {
        position: fixed; z-index: 60; top: 0; bottom: 0; left: 0; width: var(--drawer-w); max-width: 86vw;
        transform: translateX(-102%); transition: transform .25s var(--ease); box-shadow: var(--shadow-lg);
      }
      .drawer-inner { width: 100%; }
      .app.drawer-open .drawer { transform: none; }
      .app.drawer-open .drawer-scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(1, 4, 9, .55); animation: fade .2s; }
      .fab { display: inline-flex; }
      .board { padding-bottom: 96px; }
    }
    @media (max-width: 640px) {
      :root { --radius: 14px; }
      .topbar { padding: 8px 6px 6px 2px; gap: 0; }
      .topbar h1 { flex: 0 1 auto; font-size: 18px; margin: 0 4px; }
      .topbar .icon-btn { width: 34px; height: 34px; }
      .frow { grid-template-columns: 1fr; }
      .frow > svg { display: none; }
      .seg button { padding: 6px 9px; font-size: 12px; }
      .pnl-scroll { padding: 8px 16px 16px; }
      .topbar.searching h1 { display: none; }
      .search { flex: 0 1 auto; width: 40px; padding: 0; justify-content: center; border-color: transparent; background: none; }
      .search input, .search .icon-btn, .search kbd { display: none; }
      .search > svg { width: 20px; height: 20px; color: var(--text-2); }
      .topbar.searching .search { flex: 1; width: auto; padding: 0 6px 0 12px; justify-content: flex-start; border-color: var(--accent); background: var(--raised); }
      .topbar.searching .search input, .topbar.searching .search .icon-btn { display: block; }
      .topbar.searching .search .icon-btn { display: grid; }
      .status { display: none; }
      .topbar { padding-top: max(8px, env(safe-area-inset-top)); }
      .board, .board.single { flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 4px 10px 96px; gap: 12px; overflow-x: hidden; }
      .card, .card.wide { width: auto; max-height: none; }
      .card-scroll { overflow: visible; }
      .new-list-card { width: auto; height: 64px; }
      .panel { top: 0; right: 0; bottom: 0; left: 0; width: auto; max-width: none; border-radius: 0; border: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .task.sub { margin-left: 26px; }
      .qa-preview { padding-left: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="drawer" id="drawer" aria-label="Navigation">
      <div class="drawer-inner">
        <div class="brand" id="brand"></div>
        <button class="create" id="btnCreate" type="button"></button>
        <nav id="nav" aria-label="Views"></nav>
        <div class="drawer-sec"><span>Lists</span><button class="icon-btn" id="btnNewList" type="button" title="Create new list" aria-label="Create new list"></button></div>
        <div id="drawerLists" role="group" aria-label="Lists"></div>
        <div class="drawer-foot" id="drawerFoot"></div>
      </div>
    </aside>
    <div class="drawer-scrim" id="drawerScrim"></div>

    <main class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn" id="btnDrawer" type="button" title="Main menu (m)" aria-label="Toggle main menu"></button>
        <h1 id="viewTitle">Tasks</h1>
        <div class="search" id="searchBox" role="search">
          <input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks" autocomplete="off">
          <kbd id="searchKbd">/</kbd>
          <button class="icon-btn" id="btnClearSearch" type="button" title="Clear search" aria-label="Clear search" hidden></button>
        </div>
        <span class="status" id="status" aria-live="polite"></span>
        <button class="icon-btn" id="btnSync" type="button" title="Sync now" aria-label="Sync now"></button>
        <button class="icon-btn" id="btnSettings" type="button" title="Settings" aria-label="Settings"></button>
      </header>
      <div class="board" id="board"></div>
    </main>

    <aside class="panel" id="panel" aria-label="Task details" aria-hidden="true"></aside>
  </div>

  <button class="fab" id="fab" type="button" aria-label="Create task"></button>
  <div class="snack" id="snack" role="status"><span id="snackText"></span><button id="snackAction" type="button" hidden></button></div>
  <div id="layer"></div>

  <div class="auth" id="auth" hidden></div>
  <script src="pocketbase.umd.js"></script>
  <script src="data.js"></script>
  <script>
  'use strict';

  /* ======================================================================
   * Helpers
   * ==================================================================== */
  const $ = id => document.getElementById(id);
  const PROPS = new Set(['value', 'checked', 'disabled', 'selected', 'tabIndex', 'hidden', 'type', 'rows', 'maxLength']);
  function h(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) for (const key in props) {
      const v = props[key];
      if (v == null || v === false) continue;
      if (key === 'class') n.className = v;
      else if (key === 'text') n.textContent = v;
      else if (key === 'style') n.style.cssText = v;
      else if (key.startsWith('on') && typeof v === 'function') n.addEventListener(key.slice(2), v);
      else if (PROPS.has(key)) n[key] = v;
      else n.setAttribute(key, v === true ? '' : v);
    }
    for (const kid of kids.flat(3)) if (kid != null && kid !== false) n.append(kid);
    return n;
