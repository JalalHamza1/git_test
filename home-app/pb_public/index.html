  const SORT_LABELS = { my: 'My order', date: 'Date', priority: 'Priority', title: 'Title' };
  const sortOf = list => (SORTS[prefs.sort[list]] ? prefs.sort[list] : 'my');
  const byDueTime = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.time || '').localeCompare(b.time || '') || RANK[a.priority] - RANK[b.priority] || a.order - b.order;
  const byCompletedDesc = (a, b) => (b.completed || '').localeCompare(a.completed || '');

  /* ======================================================================
   * Data bridge: operations run against the copy on this device (data.js),
   * which syncs with the NAS in the background. Results merge when the queue drains.
   * ==================================================================== */
  const call = (fn, ...args) => TM.call(fn, args);

  const Q = { chain: Promise.resolve(), pending: 0, results: [], failed: false };
  function send(fn, ...args) {
    Q.pending++;
    setStatus();
    const run = Q.chain.then(() => call(fn, ...args));
    Q.chain = run.then(res => { Q.results.push(res); }, err => {
      Q.failed = true;
      snack(`Couldn't save: ${(err && err.message) || err}`);
    }).then(() => { if (--Q.pending === 0) drain(); });
    return run.catch(() => undefined);
  }
  function drain() {
    setStatus();
    const results = Q.results;
    Q.results = [];
    if (Q.failed || remoteChanged) { Q.failed = remoteChanged = false; boot(true); return; }
    results.forEach(merge);
    reindex();
    schedule();
  }
  // Another device changed something: reload from the local copy once nothing is mid-edit.
  let remoteChanged = false;
  function onRemoteChange() {
    if (!S.ready) return;
    if (Q.pending || drag.active || composing) { remoteChanged = true; return; }
    boot(true);
  }
  function merge(r) {
    if (!r || typeof r !== 'object') return;
    (r.tasks || []).forEach(t => {
      const cur = byId.get(t.id);
      if (cur) Object.assign(cur, t); else { S.tasks.push(t); byId.set(t.id, t); }
    });
    if (r.removed && r.removed.length) {
      const gone = new Set(r.removed);
      S.tasks = S.tasks.filter(t => !gone.has(t.id));
    }
    if (r.lists) S.lists = r.lists;
    if (r.settings) S.settings = r.settings;
  }
  // Saves are instant on this device; the status shows how syncing with the NAS is going.
  let syncInfo = { state: 'idle', pending: 0 };
  function setStatus(info) {
    if (info) syncInfo = info;
    const s = $('status'), btn = $('btnSync');
    const label = { syncing: 'Syncing…', offline: 'Offline', error: 'Sync problem', 'signed-out': 'Signed out' }[syncInfo.state]
      || (syncInfo.pending ? 'Waiting to sync' : 'Synced');
    s.replaceChildren(h('span', { class: 'sync-dot ' + syncInfo.state }), label);
    s.title = TM.syncStatus();
    s.style.opacity = 1;
    btn.classList.toggle('spin', syncInfo.state === 'syncing');
  }
  window.addEventListener('beforeunload', flushSaves);

  async function boot(silent) {
    if (!silent && !S.ready) render();
    try {
      const data = await call('getAll');
      S.tasks = data.tasks || [];
      S.lists = data.lists || [];
      S.settings = data.settings || {};
      S.defaultList = data.defaultList || 'General';
      S.ready = true;
      S.error = null;
      S.loadedAt = Date.now();
      reindex();
    } catch (err) {
      if (!S.ready) S.error = (err && err.message) || String(err);
      else snack(`Couldn't refresh: ${(err && err.message) || err}`);
    }
    render();
  }

  /* ======================================================================
   * Mutations — optimistic locally, then queued to the server
   * ==================================================================== */
  const PAYLOAD = ['id', 'title', 'desc', 'due', 'time', 'status', 'priority', 'list', 'starred', 'parent', 'order', 'repeat'];
  function siblingOrders(list, parent) {
    return S.tasks.filter(t => !t.archived && t.list === list && (parent ? t.parent === parent : isTop(t))).map(t => t.order);
  }

  function createTask(f) {
    const list = f.list || S.defaultList, parent = f.parent || '';
    const orders = siblingOrders(list, parent);
    const order = !orders.length ? 0 : f.append ? Math.max(...orders) + 1 : Math.min(...orders) - 1;
    const due = f.due || (f.time ? todayISO() : '');
    const t = {
      id: newId(), title: f.title, desc: f.desc || '', due, time: due ? (f.time || '') : '',
      status: f.status || 'Not started', priority: f.priority || 'Medium', list, starred: !!f.starred, parent, order,
      repeat: f.repeat || '', created: new Date().toISOString(), completed: '', archived: false, archType: '', synced: false,
    };
    S.tasks.push(t);
    reindex();
    S.fresh.add(t.id);
    schedule();
    send('saveTask', Object.assign(pick(t, PAYLOAD), { create: true }));
    return t;
  }
  const pick = (o, keys) => keys.reduce((a, k) => (k in o ? (a[k] = o[k], a) : a), {});

  function patch(id, fields) {
    const t = byId.get(id);
    if (!t) return;
    const diff = {};
    for (const k in fields) if (t[k] !== fields[k]) diff[k] = fields[k];
    if (!Object.keys(diff).length) return;
    if ('due' in diff && !diff.due && t.time) diff.time = '';
    if ('list' in diff) {
      if (!('order' in diff)) { const o = siblingOrders(diff.list, ''); diff.order = o.length ? Math.min(...o) - 1 : 0; }
      if (t.parent && !('parent' in diff)) t.parent = '';
      kidsOf(id).forEach(k => { k.list = diff.list; });
    }
    Object.assign(t, diff);
    reindex();
    schedule();
    send('saveTask', Object.assign({ id }, diff));
  }

  const completing = new Set();
  function complete(id, rowEl) {
    const t = byId.get(id);
    if (!t || t.archived || completing.has(id)) return;
    completing.add(id);
    const finish = () => {
      completing.delete(id);
      if (t.archived) return;
      const now = new Date().toISOString();
      [t, ...activeKids(id)].forEach(x => Object.assign(x, { archived: true, archType: 'Completed', status: 'Done', completed: now }));
      let next = null;
      if (t.repeat) {
        next = Object.assign(pick(t, ['title', 'desc', 'time', 'priority', 'list', 'starred', 'order', 'repeat']), {
          id: newId(), due: nextDue(t.due, t.repeat, todayISO()), status: 'Not started', created: now, completed: '',
          parent: t.parent && isActive(byId.get(t.parent)) ? t.parent : '', archived: false, archType: '', synced: false,
        });
        S.tasks.push(next);
        S.fresh.add(next.id);
      }
      reindex();
      schedule();
      send('completeTask', id, next ? next.id : null);
      const nextId = next && next.id;
      snack(next ? `Completed · next one ${relDayLower(next.due)}` : 'Task completed', 'Undo', () => uncomplete(id, nextId));
    };
    if (rowEl && !matchMedia('(prefers-reduced-motion: reduce)').matches) { rowEl.classList.add('completing'); setTimeout(finish, 280); }
    else finish();
  }

  function unarch(x) { Object.assign(x, { archived: false, archType: '', completed: '', status: x.status === 'Done' ? 'Not started' : x.status }); }
  // Mirrors restoreTask in Code.gs.
  function restoreLocal(t) {
    const was = t.archType, stamp = t.completed;
    unarch(t);
    const p = t.parent && byId.get(t.parent);
    if (t.parent && !p) t.parent = '';
    else if (p && p.archType === 'Completed') unarch(p);
    else if (p && p.archived) t.parent = '';
    kidsOf(t.id).forEach(k => { if (k.archType === was && (was !== 'Completed' || k.completed === stamp)) unarch(k); });
  }

  // Mirrors purge_ in Code.gs: deleted subtasks go with their parent, live ones are detached.
  function dropLocal(ids) {
    S.tasks = S.tasks.filter(t => !ids.has(t.id) && !(ids.has(t.parent) && t.archType === 'Deleted'));
    S.tasks.forEach(t => { if (ids.has(t.parent)) t.parent = ''; });
    reindex();
  }

  function uncomplete(id, spawnedId) {
    const t = byId.get(id);
    if (!t) return;
    if (t.archType === 'Completed') { restoreLocal(t); send('restoreTask', id); }
    if (spawnedId && byId.has(spawnedId)) {
      dropLocal(new Set([spawnedId]));
      send('purgeTask', spawnedId);
    }
    reindex();
    schedule();
  }

  function trash(id) {
    const t = byId.get(id);
    if (!t) return;
    const affected = [t, ...kidsOf(id).filter(k => k.archType !== 'Deleted')];
    if (S.panel && (S.panel.id === id || affected.some(a => a.id === S.panel.id))) closePanel();
    animateOut(affected.map(a => a.id), () => {
      affected.forEach(x => Object.assign(x, { archived: true, archType: 'Deleted' }));
      schedule();
    });
    send('deleteTask', id);
    snack(affected.length > 1 ? `Moved to trash with ${affected.length - 1} subtask${affected.length > 2 ? 's' : ''}` : 'Moved to trash', 'Undo', () => untrash(id));
  }
  function untrash(id) {
    const t = byId.get(id);
    if (!t || t.archType !== 'Deleted') return;
    restoreLocal(t);
    S.fresh.add(id);
    reindex();
    schedule();
    send('restoreTask', id);
  }
  async function purge(id) {
    const t = byId.get(id);
    if (!t) return;
    if (!(await confirmDlg('Delete forever?', `"${t.title}" will be permanently removed. This can't be undone.`, 'Delete forever'))) return;
    animateOut([id], () => {
      dropLocal(new Set([id]));
      schedule();
    });
    send('purgeTask', id);
  }
  async function emptyTrash() {
    const gone = S.tasks.filter(t => t.archType === 'Deleted');
    if (!gone.length) return;
    if (!(await confirmDlg('Empty trash?', `${gone.length} task${gone.length > 1 ? 's' : ''} will be permanently deleted. This can't be undone.`, 'Empty trash'))) return;
    dropLocal(new Set(gone.map(t => t.id)));
    schedule();
    send('emptyTrash');
    snack('Trash emptied');
  }

  function reorder(list, parent, ids) {
    ids.forEach((id, i) => {
      const t = byId.get(id);
      if (!t) return;
      t.order = i;
      t.parent = parent;
      if (t.list !== list) { t.list = list; kidsOf(id).forEach(k => { k.list = list; }); }
    });
    reindex();
    schedule();
    send('reorderTasks', list, parent, ids);
  }
  const siblingsOf = t => (t.parent && !isTop(t)
    ? activeKids(t.parent).filter(k => k.list === t.list)
    : S.tasks.filter(x => !x.archived && x.list === t.list && isTop(x))).sort(SORTS.my);

  function moveBy(id, dir) {
    const t = byId.get(id);
    if (!t || t.archived) return;
    const sib = siblingsOf(t), i = sib.indexOf(t), j = i + dir;
    if (j < 0 || j >= sib.length) return;
    [sib[i], sib[j]] = [sib[j], sib[i]];
    reorder(t.list, isTop(t) ? '' : t.parent, sib.map(x => x.id));
  }
  function indent(id) {
    const t = byId.get(id);
    if (!t || t.archived || !isTop(t)) return;
    if (hasLiveKids(id)) return snack('Tasks with subtasks can\'t be indented');
    const sib = siblingsOf(t), i = sib.indexOf(t);
    if (i <= 0) return snack('Nothing above to indent under');
    const parent = sib[i - 1];
    reorder(t.list, parent.id, activeKids(parent.id).filter(k => k.list === t.list).sort(SORTS.my).map(k => k.id).concat(id));
  }
  function outdent(id) {
    const t = byId.get(id);
    if (!t || t.archived || isTop(t)) return;
    const p = byId.get(t.parent);
    const tops = S.tasks.filter(x => !x.archived && x.list === t.list && isTop(x)).sort(SORTS.my).map(x => x.id);
    tops.splice(tops.indexOf(p.id) + 1, 0, id);
    reorder(t.list, '', tops);
  }

  /* ----- lists ----- */
  async function newList() {
    const res = await listDlg({ title: 'Create new list', ok: 'Create', color: COLORS[S.lists.length % COLORS.length] });
    if (!res || !res.name) return;
    if (S.lists.some(l => l.name.toLowerCase() === res.name.toLowerCase())) return snack('That list already exists');
    S.lists.push({ name: res.name, color: res.color });
    prefs.hidden = prefs.hidden.filter(n => n !== res.name);
    savePrefs();
    send('createList', res.name, res.color);
    showList(res.name);
  }
  async function renameList(l) {
    const res = await listDlg({ title: 'Rename list', name: l.name, color: l.color, ok: 'Save' });
    if (!res || !res.name) return;
    const old = l.name, name = res.name;
    if (name !== old) {
      if (S.lists.some(x => x !== l && x.name.toLowerCase() === name.toLowerCase())) return snack('A list with that name already exists');
      l.name = name;
      S.tasks.forEach(t => { if (t.list === old) t.list = name; });
      if (old in prefs.sort) { prefs.sort[name] = prefs.sort[old]; delete prefs.sort[old]; }
      if (prefs.open['list:' + old]) { prefs.open['list:' + name] = true; delete prefs.open['list:' + old]; }
      prefs.hidden = prefs.hidden.map(n => (n === old ? name : n));
      savePrefs();
      send('renameList', old, name);
    }
    if (res.color !== l.color) { l.color = res.color; send('setListColor', name, res.color); }
    schedule();
  }
  async function recolorList(l) {
    const res = await listDlg({ title: `Color for “${l.name}”`, name: l.name, color: l.color, ok: 'Save', nameEditable: false });
    if (!res || res.color === l.color) return;
    l.color = res.color;
    schedule();
    send('setListColor', l.name, res.color);
  }
  async function deleteList(l) {
    const n = S.tasks.filter(t => t.list === l.name && t.archType !== 'Deleted').length;
    const msg = n ? `Its ${n} task${n > 1 ? 's' : ''} will move to Trash, where you can still restore them.` : 'This list is empty.';
    if (!(await confirmDlg(`Delete “${l.name}”?`, msg, 'Delete list'))) return;
    S.lists = S.lists.filter(x => x !== l);
    S.tasks.forEach(t => { if (t.list === l.name && t.archType !== 'Deleted') Object.assign(t, { archived: true, archType: 'Deleted' }); });
    if (S.panel && S.panel.id && (byId.get(S.panel.id) || {}).list === l.name) closePanel();
    schedule();
    send('deleteList', l.name);
    snack(`“${l.name}” deleted`);
  }
  function toggleHidden(name) {
    prefs.hidden = prefs.hidden.includes(name) ? prefs.hidden.filter(n => n !== name) : prefs.hidden.concat(name);
    savePrefs();
    schedule();
  }
  function hideList(name) {
    toggleHidden(name);
    snack(`“${name}” hidden from the board`, 'Show', () => toggleHidden(name));
  }
  function clearCompleted(l) {
    const done = S.tasks.filter(t => t.list === l.name && t.archType === 'Completed');
    if (!done.length) return;
    done.forEach(t => { t.archType = 'Deleted'; });
    schedule();
    send('clearCompleted', l.name);
    snack(`${done.length} completed task${done.length > 1 ? 's' : ''} moved to trash`);
  }
  function showList(name) {
    prefs.hidden = prefs.hidden.filter(n => n !== name);
    savePrefs();
    setView('board');
    if (isNarrow()) closeDrawer();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const card = $('board').querySelector(`.card[data-list="${CSS.escape(name)}"]`);
      if (!card) return;
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      card.classList.remove('flash');
      void card.offsetWidth;
      card.classList.add('flash');
    }));
  }

  /* ----- calendar / settings ----- */
  async function syncNow() {
    await TM.syncNow();
    snack(TM.syncStatus());
  }

  /* ======================================================================
   * Quick-add parsing:  "Call Sam tomorrow 3pm !high #Admin * every week"
   * ==================================================================== */
  const MONTHS = ['january|jan', 'february|feb', 'march|mar', 'april|apr', 'may', 'june|jun', 'july|jul', 'august|aug', 'september|sept|sep', 'october|oct', 'november|nov', 'december|dec'];
  const DAYS_FULL = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const DAYS_SHORT = ['sun', 'mon', 'tue|tues', 'wed', 'thu|thur|thurs', 'fri', 'sat'];
  const dayIndex = w => { w = w.toLowerCase(); return DAYS_FULL.findIndex((f, i) => f === w || DAYS_SHORT[i].split('|').includes(w)); };
  const monthIndex = w => { w = w.toLowerCase().replace('.', ''); return MONTHS.findIndex(m => m.split('|').includes(w)); };
  const nextWeekday = (idx, allowToday) => { const t = todayISO(); let diff = (idx - parseISO(t).getDay() + 7) % 7; if (!diff && !allowToday) diff = 7; return addDays(t, diff); };
  // "next friday" means Friday of next week (Monday-start), not the coming Friday.
  const weekdayNextWeek = idx => addDays(nextWeekday(1, false), (idx + 6) % 7);
  const norm = s => s.toLowerCase().replace(/[\s_-]+/g, '');
  function findList(token) {
    const n = norm(token), exact = S.lists.find(l => norm(l.name) === n);
    if (exact) return exact.name;
    const pre = S.lists.filter(l => norm(l.name).startsWith(n));
    return pre.length === 1 ? pre[0].name : '';
  }

  function parseQuick(raw) {
    let s = ' ' + raw + ' ';
    const r = {};
    const take = (pattern, fn) => {
      const m = s.match(new RegExp('\\s' + pattern + '(?=[\\s,.;:!?])', 'i'));
      if (!m || fn(m.slice(1)) === false) return false;
      s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length);
      return true;
    };
    const monthRe = `(${MONTHS.join('|')})\\.?`;
    // "sun", "sat" and "wed" are ordinary words, so they only count after on/next/this/due.
    const dayRe = `(${DAYS_FULL.join('|')}|mon|tues|tue|thurs|thur|thu|fri)`;
    const dayAnyRe = `(${DAYS_FULL.join('|')}|${DAYS_SHORT.join('|')})`;

    take('(?:!(?:high|h|1)|!!)', () => { r.priority = 'High'; })
      || take('!(?:low|l|3)', () => { r.priority = 'Low'; })
      || take('!(?:medium|med|m|2)', () => { r.priority = 'Medium'; });
    take('\\*', () => { r.starred = true; });
    take('#([^\\s#]+)', ([name]) => { const l = findList(name); if (!l) return false; r.list = l; });

    take(`every\\s+${dayAnyRe}`, ([d]) => { r.repeat = 'weekly'; r.due = nextWeekday(dayIndex(d), true); })
      || [['every\\s+day|daily', 'daily'], ['every\\s+weekday|weekdays', 'weekdays'], ['every\\s+week|weekly', 'weekly'],
        ['every\\s+month|monthly', 'monthly'], ['every\\s+year|yearly|annually', 'yearly']]
        .some(([p, v]) => take(`(?:${p})`, () => { r.repeat = v; }));

    take('(?:at\\s+)?(\\d{1,2})(?::([0-5]\\d))?\\s?(am|pm)', ([hh, mm, ap]) => {
      const n = Number(hh);
      if (n < 1 || n > 12) return false;
      r.time = pad(n % 12 + (ap.toLowerCase() === 'pm' ? 12 : 0)) + ':' + (mm || '00');
    })
      || take('(?:at\\s+)?([01]?\\d|2[0-3]):([0-5]\\d)', ([hh, mm]) => { r.time = pad(Number(hh)) + ':' + mm; })
      || take('(?:at\\s+)?noon', () => { r.time = '12:00'; });

    if (!r.due) {
      const today = todayISO();
      take('(?:today|tod)', () => { r.due = today; })
        || take('(?:tomorrow|tmrw|tmr)', () => { r.due = addDays(today, 1); })
        || take('(?:day\\s+after\\s+tomorrow)', () => { r.due = addDays(today, 2); })
        || take('next\\s+week', () => { r.due = nextWeekday(1, false); })
        || take('next\\s+month', () => { r.due = addMonths(today, 1); })
        || take('(?:this\\s+)?weekend', () => { r.due = nextWeekday(6, true); })
        || take('in\\s+(\\d+|a|an|one|two|three)\\s+(days?|weeks?|months?)', ([n, unit]) => {
          const k = { a: 1, an: 1, one: 1, two: 2, three: 3 }[n.toLowerCase()] || Number(n);
          r.due = unit.startsWith('month') ? addMonths(today, k) : addDays(today, unit.startsWith('week') ? k * 7 : k);
        })
        || take(`next\\s+${dayAnyRe}`, ([d]) => { r.due = weekdayNextWeek(dayIndex(d)); })
        || take(`(?:on\\s+|this\\s+|due\\s+)${dayAnyRe}`, ([d]) => { r.due = nextWeekday(dayIndex(d), false); })
        || take(dayRe, ([d]) => { r.due = nextWeekday(dayIndex(d), false); })
        || take('(\\d{4})-(\\d{2})-(\\d{2})', ([y, m, d]) => { const iso = `${y}-${m}-${d}`; if (isoOf(parseISO(iso)) !== iso) return false; r.due = iso; })
        || take(`(?:on\\s+)?${monthRe}\\s+(\\d{1,2})(?:st|nd|rd|th)?`, ([mo, d]) => setMonthDay(r, monthIndex(mo), Number(d)))
        || take(`(?:on\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+${monthRe}`, ([d, mo]) => setMonthDay(r, monthIndex(mo), Number(d)));
    }
    if ((r.time || r.repeat) && !r.due) r.due = todayISO();
    r.title = s.replace(/\s+([,.;:!?])/g, '$1').replace(/\s+/g, ' ').trim().replace(/[,;:]+(?=[.!?]*$)/, '').replace(/^[\s,.;:]+|[\s,;:]+$/g, '') || raw.trim();
    return r;
  }
  function setMonthDay(r, mi, day) {
    if (mi < 0 || day < 1 || day > 31) return false;
    const now = new Date();
    let d = new Date(now.getFullYear(), mi, day);
    if (d.getMonth() !== mi) return false;
    if (isoOf(d) < todayISO()) d = new Date(now.getFullYear() + 1, mi, day);
    r.due = isoOf(d);
  }

  /* ======================================================================
   * Rendering
   * ==================================================================== */
  let rafPending = false, renderBlocked = false, composing = false;
  function schedule() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; render(); });
  }
  function render() {
    if (drag.active || composing) { renderBlocked = true; return; }
    keepFocus($('drawer'), renderDrawer);
    renderTop();
    renderView();
    syncPanel();
    S.fresh.clear();
  }

  // Rebuilding a region would drop keyboard focus; put it back on the same keyed control.
  function keepFocus(root, build) {
    const a = document.activeElement, key = a && root.contains(a) ? a.dataset.key : null;
    build();
    if (!key) return;
    const n = root.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (n) n.focus({ preventScroll: true });
  }

  const isNarrow = () => matchMedia('(max-width: 900px)').matches;
  const VIEW_META = {
    board: ['All tasks', 'board'], starred: ['Starred', 'star'], today: ['Today', 'sun'],
    upcoming: ['Upcoming', 'upcoming'], insights: ['Insights', 'insights'], trash: ['Trash', 'trash'], search: ['Search', 'search'],
  };

  function renderDrawer() {
    const act = S.tasks.filter(t => !t.archived), today = todayISO();
    const todayCount = act.filter(t => t.due && t.due <= today).length;
    const overdue = act.some(t => t.due && t.due < today);
    const counts = new Map();
    act.forEach(t => counts.set(t.list, (counts.get(t.list) || 0) + 1));

    const nav = (key, badge, hot) => h('button', {
      class: 'nav-item', type: 'button', 'data-key': 'nav:' + key, 'aria-current': S.view === key ? 'page' : null,
      onclick: () => { setView(key); if (isNarrow()) closeDrawer(); },
    }, icon(VIEW_META[key][1]), h('span', { class: 'lbl', text: VIEW_META[key][0] }), badge ? h('span', { class: 'badge' + (hot ? ' hot' : ''), text: badge }) : null);

    $('nav').replaceChildren(
      nav('board', act.length || ''), nav('starred', act.filter(t => t.starred).length || ''),
      nav('today', todayCount || '', overdue), nav('upcoming'), nav('insights'));

    $('drawerLists').replaceChildren(...S.lists.map(l => {
      const hidden = prefs.hidden.includes(l.name);
      return h('div', { class: 'dl-row' + (hidden ? ' off' : '') },
        h('button', {
          class: 'dl-check', type: 'button', role: 'checkbox', 'aria-checked': String(!hidden), 'data-key': 'dl-check:' + l.name,
          'aria-label': `Show ${l.name} on the board`, title: hidden ? 'Show on board' : 'Hide from board',
          style: `--c:${COLOR_HEX[l.color] || COLOR_HEX.GRAY}`, onclick: () => toggleHidden(l.name),
        }, icon('check')),
        h('button', { class: 'dl-name', type: 'button', title: l.name, 'data-key': 'dl-name:' + l.name, onclick: () => showList(l.name) }, h('span', { text: l.name })),
        h('span', { class: 'dl-count', text: counts.get(l.name) || '' }),
        keyed(iconBtn('more', `Options for ${l.name}`, e => listMenu(l, e.currentTarget), 'dl-more'), 'dl-more:' + l.name));
    }));

    const trashCount = S.tasks.filter(t => t.archType === 'Deleted').length;
    $('drawerFoot').replaceChildren(
      nav('trash', trashCount || ''),
      h('button', { class: 'nav-item', type: 'button', 'data-key': 'nav:settings', onclick: settingsDlg }, icon('settings'), h('span', { class: 'lbl', text: 'Settings' })),
      h('button', { class: 'nav-item', type: 'button', 'data-key': 'nav:keys', onclick: shortcutsDlg }, icon('keyboard'), h('span', { class: 'lbl', text: 'Keyboard shortcuts' }), h('kbd', { text: '?' })));
  }

  function renderTop() {
    $('viewTitle').textContent = S.view === 'search' ? 'Search' : VIEW_META[S.view][0];
    $('btnClearSearch').hidden = !S.query;
    $('searchKbd').hidden = !!S.query;
    const app = $('app');
    app.classList.toggle('drawer-closed', !prefs.drawer);
  }

  function setView(v) {
    if (v !== 'search' && S.query) { S.query = ''; $('search').value = ''; $('topbar').classList.remove('searching'); }
    S.view = v;
    if (v !== 'search') { prefs.view = v; savePrefs(); }
    renderNow();
    $('board').scrollTo(0, 0);
  }
  function renderNow() { rafPending = false; render(); }

  /* ----- board-level snapshot so re-renders keep focus, caret and scroll ----- */
  function snapshot() {
    const board = $('board'), a = document.activeElement, snap = { left: board.scrollLeft, top: board.scrollTop, scrolls: {} };
    board.querySelectorAll('.card-scroll[data-key]').forEach(n => { snap.scrolls[n.dataset.key] = n.scrollTop; });
    if (a && board.contains(a)) {
      const keyed = a.closest('[data-key]');
      if (keyed) {
        snap.focus = keyed.dataset.key;
        snap.isInput = a.tagName === 'INPUT';
        if (snap.isInput) { snap.selStart = a.selectionStart; snap.selEnd = a.selectionEnd; }
        const rows = [...board.querySelectorAll('.task')];
        snap.rowIndex = rows.indexOf(a);
      }
    }
    return snap;
  }
  function restore(snap) {
    const board = $('board');
    board.scrollLeft = snap.left;
    board.scrollTop = snap.top;
    board.querySelectorAll('.card-scroll[data-key]').forEach(n => { if (n.dataset.key in snap.scrolls) n.scrollTop = snap.scrolls[n.dataset.key]; });
    if (!snap.focus) return;
    let target = board.querySelector(`[data-key="${CSS.escape(snap.focus)}"]`);
    if (!target && snap.rowIndex >= 0) {
      const rows = board.querySelectorAll('.task');
      target = rows[Math.min(snap.rowIndex, rows.length - 1)];
    }
    if (!target) return;
    target.focus({ preventScroll: true });
    if (snap.isInput && target.tagName === 'INPUT') { try { target.setSelectionRange(snap.selStart, snap.selEnd); } catch (e) {} }
  }

  function renderView() {
    const board = $('board'), snap = snapshot(), frag = document.createDocumentFragment();
    let single = false;
    if (S.error && !S.ready) {
      frag.append(h('div', { class: 'big-empty' }, icon('alert'), h('p', { text: 'Couldn\'t load your tasks.' }), h('p', { text: S.error }),
        h('button', { class: 'btn primary', type: 'button', onclick: () => { S.error = null; boot(); }, text: 'Try again' })));
    } else if (!S.ready) {
      for (let i = 0; i < 3; i++) frag.append(h('div', { class: 'card' }, h('div', { class: 'skeleton' }, h('i'), h('i'), h('i'), h('i'), h('i'))));
    } else {
      single = ({ board: renderBoard, starred: renderStarred, today: renderToday, upcoming: renderUpcoming, insights: renderInsights, trash: renderTrash, search: renderSearch })[S.view](frag);
    }
    board.className = 'board view-' + S.view + (single ? ' single' : '');
    board.replaceChildren(frag);
    restore(snap);
    if (S.view === 'insights' && S.ready) drawCharts();
  }

  function cardEl(o) {
    const card = h('section', { class: 'card' + (o.wide ? ' wide' : ''), 'aria-label': o.title });
    if (o.color) card.style.setProperty('--c', o.color);
    if (o.drop) Object.keys(o.drop).forEach(k => { card.dataset[k] = o.drop[k]; });
    if (o.list) card.dataset.list = o.list;
    card.append(h('header', { class: 'card-head' },
      h('span', { class: 'dot' }), h('h2', { text: o.title }),
      o.count ? h('span', { class: 'count', text: o.count }) : null,
      h('span', { class: 'grow' }), o.actions || null));
    if (o.sub) card.append(h('div', { class: 'card-sub', text: o.sub }));
    if (o.meter) card.append(o.meter);
    if (o.add) card.append(o.add);
    const scroll = h('div', { class: 'card-scroll', 'data-key': o.key });
    const body = h('div', { class: 'card-body' });
    scroll.append(body);
    card.append(scroll);
    return { card, body, scroll };
  }

  function miniEmpty(ic, title, text) {
    return h('div', { class: 'mini-empty' }, icon(ic), title ? h('strong', { text: title }) : null, text ? h('span', { text }) : null);
  }

  function renderBoard(frag) {
    const visible = S.lists.filter(l => !prefs.hidden.includes(l.name));
    if (!S.lists.length || !visible.length) {
      frag.append(h('div', { class: 'big-empty' }, icon('board'),
        h('p', { text: S.lists.length ? 'All lists are hidden.' : 'No lists yet.' }),
        S.lists.length
          ? h('button', { class: 'btn tonal', type: 'button', text: 'Show all lists', onclick: () => { prefs.hidden = []; savePrefs(); schedule(); } })
          : h('button', { class: 'btn primary', type: 'button', text: 'Create a list', onclick: newList })));
      return true;
    }
    visible.forEach(l => frag.append(listCard(l)));
    frag.append(h('button', { class: 'new-list-card', type: 'button', onclick: newList }, h('span', {}, icon('add'), 'Create new list')));
    return false;
  }

  function listCard(l) {
    const sort = sortOf(l.name), mine = sort === 'my';
    const act = S.tasks.filter(t => !t.archived && t.list === l.name);
    const done = S.tasks.filter(t => t.archType === 'Completed' && t.list === l.name).sort(byCompletedDesc);
    const { card, body, scroll } = cardEl({
      key: 'list:' + l.name, title: l.name, list: l.name, color: COLOR_HEX[l.color] || COLOR_HEX.GRAY,
      count: act.length || '', drop: mine ? { drop: 'list' } : null,
      actions: [sort !== 'my' ? h('span', { class: 'count', title: 'Sorted by ' + SORT_LABELS[sort].toLowerCase(), text: SORT_LABELS[sort] }) : null,
        iconBtn('more', `Options for ${l.name}`, e => listMenu(l, e.currentTarget))],
      add: quickAdd('add:' + l.name, { list: l.name }),
    });
    const tops = act.filter(isTop).sort(SORTS[sort]);
    if (!tops.length) body.append(done.length ? miniEmpty('doneAll', 'All tasks complete', 'Nice work!') : miniEmpty('notes', null, 'No tasks yet'));
    tops.forEach(t => body.append(groupEl(t, mine)));
    if (done.length) scroll.append(doneSection('list:' + l.name, done, { showParent: true }));
    return card;
  }

  function groupEl(t, draggable) {
    const g = h('div', { class: 'group', 'data-id': t.id });
    g.append(taskRow(t, { drag: draggable }));
    const sub = h('div', { class: 'subtasks', 'data-parent': t.id });
    activeKids(t.id).filter(k => k.list === t.list).sort(SORTS.my).forEach(k => sub.append(taskRow(k, { sub: true, drag: draggable })));
    g.append(sub);
    return g;
  }

  function doneSection(key, tasks, o) {
    const open = !!prefs.open[key];
    const sec = h('div', { class: 'done-sec' + (open ? ' open' : '') });
    sec.append(h('button', {
      class: 'done-toggle', type: 'button', 'aria-expanded': String(open),
      onclick: () => { prefs.open[key] = !open; savePrefs(); schedule(); },
    }, icon('chevron'), h('span', { text: `Completed (${tasks.length})` })));
    if (open) sec.append(h('div', {}, tasks.map(t => taskRow(t, Object.assign({}, o, { done: true })))));
    return sec;
  }

  function highlight(node, text, q) {
    if (!q) { node.textContent = text; return; }
    const lower = text.toLowerCase(), needle = q.toLowerCase();
    let i = 0, at;
    while ((at = lower.indexOf(needle, i)) >= 0) {
      node.append(text.slice(i, at), h('mark', { text: text.slice(at, at + needle.length) }));
      i = at + needle.length;
    }
    node.append(text.slice(i));
  }

  function taskRow(t, o = {}) {
    const done = t.archType === 'Completed';
    const row = h('div', {
      class: 'task' + (o.sub ? ' sub' : '') + (done ? ' done' : '') + (S.fresh.has(t.id) ? ' enter' : ''),
      'data-id': t.id, 'data-key': 'task:' + t.id + (o.keySuffix || ''), tabindex: 0,
      'aria-label': t.title + (done ? ', completed' : ''),
    });
    row.append(o.drag && !done ? h('span', { class: 'grip', title: 'Drag to move' }, icon('drag')) : h('span', { class: 'grip-space' }));
    if (!o.trash) {
      row.append(h('button', {
        class: 'check', type: 'button', role: 'checkbox', 'aria-checked': String(done),
        'aria-label': done ? 'Mark not complete' : 'Mark complete', title: done ? 'Mark not complete' : 'Mark complete',
        onclick: e => { e.stopPropagation(); done ? uncomplete(t.id) : complete(t.id, row); },
      }, icon('check')));
    }
    const body = h('div', { class: 'task-body' });
    const title = h('div', { class: 'task-title' });
    const q = S.view === 'search' ? S.query.trim() : '';
    highlight(title, t.title, q);
    body.append(title);
    if (t.desc && !done) {
      const notes = h('div', { class: 'task-notes' });
      highlight(notes, t.desc.split('\n')[0], q);
      body.append(notes);
    }
    const chips = chipsFor(t, o, done);
    if (chips.childNodes.length) body.append(chips);
    row.append(body);

    if (o.trash) {
      row.append(h('div', { class: 'row-actions' },
        iconBtn('restore', 'Restore', e => { e.stopPropagation(); untrash(t.id); }),
        iconBtn('deleteForever', 'Delete forever', e => { e.stopPropagation(); purge(t.id); })));
    } else if (!done) {
      row.append(h('button', {
        class: 'star' + (t.starred ? ' on' : ''), type: 'button', 'aria-pressed': String(t.starred),
        'aria-label': t.starred ? 'Remove star' : 'Star task', title: t.starred ? 'Remove star (s)' : 'Star (s)',
        onclick: e => { e.stopPropagation(); patch(t.id, { starred: !t.starred }); },
      }, icon(t.starred ? 'star' : 'starOutline')));
    }
    if (!o.trash) {
      row.addEventListener('click', () => openPanel(t.id));
      row.addEventListener('contextmenu', e => { e.preventDefault(); taskMenu(t, { x: e.clientX, y: e.clientY }); });
    }
    return row;
  }

  function chipsFor(t, o, done) {
    const c = h('div', { class: 'chips' }), today = todayISO();
    if (o.showList) c.append(h('span', { class: 'chip', style: `--c:${listHex(t.list)}` }, h('span', { class: 'cdot' }), t.list));
    if (done && t.completed) c.append(h('span', { class: 'chip' }, icon('check'), 'Done ' + relDayLower(localDayOf(t.completed))));
    if (!done && t.due) {
      const cls = t.due < today ? ' overdue' : t.due === today ? ' today' : '';
      const label = (o.hideDay ? '' : relDay(t.due)) + (t.time ? (o.hideDay ? '' : ', ') + fmtTime(t.time) : '');
      if (label) c.append(h('span', { class: 'chip' + cls }, icon(t.time ? 'clock' : 'event'), label, t.repeat ? icon('repeat') : null));
      else if (t.repeat) c.append(h('span', { class: 'chip' }, icon('repeat'), repeatLabel(t.repeat, t.due).split(' on ')[0]));
    } else if (!done && t.repeat) c.append(h('span', { class: 'chip' }, icon('repeat'), repeatLabel(t.repeat, t.due).split(' on ')[0]));
    if (!done && t.priority === 'High') c.append(h('span', { class: 'chip high' }, icon('flag'), 'High'));
    if (!done && t.priority === 'Low') c.append(h('span', { class: 'chip low' }, icon('flag'), 'Low'));
    if (!done && t.status === 'In progress') c.append(h('span', { class: 'chip progress' }, icon('half'), 'In progress'));
    if (!done && t.status === 'Blocked') c.append(h('span', { class: 'chip blocked' }, icon('blocked'), 'Blocked'));
    const ks = kidsOf(t.id).filter(k => k.archType !== 'Deleted');
    if (ks.length && !o.sub) c.append(h('span', { class: 'chip', title: 'Subtasks done' }, icon('checklist'), `${ks.filter(k => k.archived).length}/${ks.length}`));
    if (o.showParent && t.parent) {
      const p = byId.get(t.parent);
      if (p && (o.done || isTop(t) || o.showList)) c.append(h('span', { class: 'chip', title: 'Subtask of ' + p.title }, icon('subArrow'), p.title));
    }
    if (o.showStar && t.starred && !done) c.append(h('span', { class: 'chip star' }, icon('star'), 'Starred'));
    return c;
  }

  function quickAdd(key, defaults, placeholder) {
    const input = h('input', {
      class: 'qa-input', 'data-key': key, placeholder: placeholder || 'Add a task', 'aria-label': placeholder || 'Add a task',
      value: drafts.get(key) || '', autocomplete: 'off', enterkeyhint: 'done', maxlength: 500,
    });
    const preview = h('div', { class: 'qa-preview', 'aria-live': 'polite' });
    const refresh = () => {
      const v = input.value;
      if (v) drafts.set(key, v); else drafts.delete(key);
      preview.replaceChildren(...(v.trim() ? previewChips(parseQuick(v), defaults) : []));
    };
    input.addEventListener('input', refresh);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        const p = parseQuick(text);
        const f = Object.assign({}, defaults);
        Object.keys(p).forEach(k => { if (p[k] !== undefined) f[k] = p[k]; });
        createTask(f);
        input.value = '';
        refresh();
        if (p.list && p.list !== defaults.list) snack(`Added to ${p.list}`);
      } else if (e.key === 'Escape') {
        e.stopPropagation();
        input.value = '';
        refresh();
        input.blur();
      }
    });
    refresh();
    return h('div', { class: 'qa' }, h('label', { class: 'qa-row' }, icon('addCircle'), input), preview);
  }

  function previewChips(p, defaults) {
    const out = [];
    if (p.due && p.due !== defaults.due) out.push(h('span', { class: 'chip today' }, icon('event'), relDay(p.due)));
    if (p.time) out.push(h('span', { class: 'chip today' }, icon('clock'), fmtTime(p.time)));
    if (p.repeat) out.push(h('span', { class: 'chip' }, icon('repeat'), repeatLabel(p.repeat, p.due).split(' on ')[0]));
    if (p.priority) out.push(h('span', { class: 'chip ' + p.priority.toLowerCase() }, icon('flag'), p.priority));
    if (p.list && p.list !== defaults.list) out.push(h('span', { class: 'chip', style: `--c:${listHex(p.list)}` }, h('span', { class: 'cdot' }), p.list));
    if (p.starred) out.push(h('span', { class: 'chip star' }, icon('star'), 'Starred'));
    if (out.length) out.push(h('span', { class: 'qa-hint', text: 'Enter to add' }));
    return out;
  }

  /* ----- smart views ----- */
  function renderStarred(frag) {
    const items = S.tasks.filter(t => !t.archived && t.starred).sort(byDueTime);
    const { card, body } = cardEl({ key: 'starred', title: 'Starred', color: 'var(--star)', count: items.length || '', wide: true,
      add: quickAdd('add:starred', { starred: true }, 'Add a starred task') });
    if (!items.length) body.append(miniEmpty('starOutline', 'No starred tasks', 'Star important tasks to see them here.'));
    items.forEach(t => body.append(taskRow(t, { showList: true, showParent: true })));
    frag.append(card);
    return true;
  }

  function renderToday(frag) {
    const today = todayISO(), act = S.tasks.filter(t => !t.archived && t.due);
    const overdue = act.filter(t => t.due < today).sort(byDueTime);
    const dueToday = act.filter(t => t.due === today).sort(byDueTime);
    const doneToday = S.tasks.filter(t => t.archType === 'Completed' && localDayOf(t.completed) === today).sort(byCompletedDesc);
    const total = overdue.length + dueToday.length + doneToday.length;
    const meter = total ? h('div', { class: 'card-meter' },
      h('div', { class: 'meter', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': doneToday.length, 'aria-label': 'Done today' },
        h('i', { style: `width:${Math.round(doneToday.length / total * 100)}%` })),
      h('span', { text: `${doneToday.length} of ${total} done` })) : null;
    const { card, body, scroll } = cardEl({
      key: 'today', title: 'Today', wide: true, color: 'var(--accent)',
      sub: parseISO(today).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }),
      meter, add: quickAdd('add:today', { due: today }, 'Add a task for today'),
    });
    if (overdue.length) {
      body.append(h('div', { class: 'section-label hot' }, icon('alert'), `Overdue · ${overdue.length}`));
      overdue.forEach(t => body.append(taskRow(t, { showList: true, showParent: true, keySuffix: ':od' })));
      body.append(h('div', { class: 'section-label', text: 'Today' }));
    }
    if (!dueToday.length) body.append(miniEmpty(doneToday.length ? 'doneAll' : 'sun', doneToday.length ? 'All done for today' : 'Nothing due today', doneToday.length ? 'Enjoy the rest of your day.' : 'Add a task above or plan ahead in Upcoming.'));
    dueToday.forEach(t => body.append(taskRow(t, { showList: true, showParent: true, hideDay: true })));
    if (doneToday.length) scroll.append(doneSection('today', doneToday, { showList: true }));
    frag.append(card);
    return true;
  }

  function renderUpcoming(frag) {
    const today = todayISO(), act = S.tasks.filter(t => !t.archived && t.due);
    const overdue = act.filter(t => t.due < today).sort(byDueTime);
    const mk = (key, title, sub, items, date, color) => {
      const { card, body } = cardEl({
        key, title, sub, count: items.length || '', color,
        drop: date ? { drop: 'day', date } : null,
        add: date ? quickAdd('add:' + key, { due: date }) : null,
      });
      if (!items.length) body.append(miniEmpty('event', null, date ? 'Nothing planned' : 'Nothing here'));
      items.forEach(t => body.append(taskRow(t, { showList: true, showParent: true, drag: true, hideDay: !!date })));
      return card;
    };
    if (overdue.length) frag.append(mk('day:overdue', 'Overdue', 'Drag onto a day to reschedule', overdue, null, 'var(--red)'));
    for (let i = 0; i < 7; i++) {
      const d = addDays(today, i);
      frag.append(mk('day:' + d, i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : weekdayOf(d), fmtDay(d, { weekday: undefined }),
        act.filter(t => t.due === d).sort(byDueTime), d, i === 0 ? 'var(--accent)' : 'var(--line-2)'));
    }
    frag.append(mk('day:later', 'Later', 'After ' + fmtDay(addDays(today, 6), { weekday: undefined }), act.filter(t => t.due > addDays(today, 6)).sort(byDueTime), null, 'var(--line-2)'));
    return false;
  }

  function renderSearch(frag) {
    const q = S.query.trim().toLowerCase();
    const hit = t => t.archType !== 'Deleted' && (t.title.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.list.toLowerCase().includes(q));
    const act = S.tasks.filter(t => !t.archived && hit(t)).sort(byDueTime);
    const done = S.tasks.filter(t => t.archType === 'Completed' && hit(t)).sort(byCompletedDesc);
    const { card, body, scroll } = cardEl({ key: 'search', title: `Results for “${S.query.trim()}”`, wide: true, count: (act.length + done.length) || '' });
    if (!act.length && !done.length) body.append(miniEmpty('search', 'No matches', 'Try a different word, or check Trash.'));
    act.forEach(t => body.append(taskRow(t, { showList: true, showParent: true, showStar: true })));
    if (done.length) scroll.append(doneSection('search', done, { showList: true }));
    frag.append(card);
    return true;
  }

  function renderTrash(frag) {
    const items = S.tasks.filter(t => t.archType === 'Deleted').sort((a, b) => a.list.localeCompare(b.list) || a.title.localeCompare(b.title));
    const { card, body } = cardEl({
      key: 'trash', title: 'Trash', wide: true, color: 'var(--text-3)', count: items.length || '',
      sub: 'Deleted tasks stay here until you empty the trash.',
      actions: h('button', { class: 'text-btn danger', type: 'button', disabled: !items.length, onclick: emptyTrash, text: 'Empty trash' }),
    });
    if (!items.length) body.append(miniEmpty('trash', 'Trash is empty', null));
    items.forEach(t => body.append(taskRow(t, { trash: true, showList: true })));
    frag.append(card);
    return true;
  }

  /* ----- insights ----- */
  function computeStats() {
    const today = todayISO(), done = S.tasks.filter(t => t.archType === 'Completed' && t.completed);
    const perDay = new Map();
    done.forEach(t => { const d = localDayOf(t.completed); perDay.set(d, (perDay.get(d) || 0) + 1); });
    const days = [];
    for (let i = 13; i >= 0; i--) { const d = addDays(today, -i); days.push({ date: d, n: perDay.get(d) || 0 }); }
    const sum = (from, to) => { let s = 0; for (let i = from; i <= to; i++) s += perDay.get(addDays(today, -i)) || 0; return s; };
    let streak = 0;
    for (let i = perDay.get(today) ? 0 : 1; perDay.get(addDays(today, -i)); i++) streak++;
    const act = S.tasks.filter(t => !t.archived);
    return {
      days, today: perDay.get(today) || 0, week: sum(0, 6), prevWeek: sum(7, 13), streak,
      open: act.length, overdue: act.filter(t => t.due && t.due < today).length,
      lists: S.lists.map(l => ({ l, open: act.filter(t => t.list === l.name).length, done: S.tasks.filter(t => t.list === l.name && t.archType === 'Completed').length })),
    };
  }

  function drawCharts() {
    $('board').querySelectorAll('.chart[data-chart]').forEach(box => {
      const days = box.closest('.card')._days;
      const W = Math.max(240, box.clientWidth - 32), H = 170, top = 18, bottom = 24, left = 26, plotW = W - left, plotH = H - top - bottom;
      const max = Math.max(1, ...days.map(d => d.n)), niceMax = max <= 4 ? max : Math.ceil(max / 2) * 2;
      const slot = plotW / days.length, barW = Math.min(24, slot - 4);
      const svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', `Tasks completed per day over the last 14 days, up to ${max} per day`);
      const add = (tag, attrs, text) => {
        const n = document.createElementNS(SVGNS, tag);
        Object.keys(attrs).forEach(k => n.setAttribute(k, attrs[k]));
        if (text != null) n.textContent = text;
        svg.append(n);
        return n;
      };
      const y = v => top + plotH - (v / niceMax) * plotH;
      [0, niceMax / 2, niceMax].forEach(v => {
        if (v !== Math.round(v)) return;
        add('line', { class: 'grid', x1: left, x2: W, y1: y(v), y2: y(v) });
        add('text', { class: 'axis', x: left - 8, y: y(v) + 4, 'text-anchor': 'end' }, v);
      });
      const tip = h('div', { class: 'tip', hidden: true });
      const topIdx = days.reduce((best, d, i) => (d.n > days[best].n ? i : best), 0);
      days.forEach((d, i) => {
        const cx = left + slot * i + slot / 2, x = cx - barW / 2, bh = (d.n / niceMax) * plotH, isToday = i === days.length - 1;
        const hit = add('rect', { class: 'bar-hit', x: left + slot * i, y: top, width: slot, height: plotH, tabindex: 0,
          'aria-label': `${relDay(d.date)}: ${d.n} completed` });
        if (d.n) {
          const r = Math.min(4, bh), yb = top + plotH;
          add('path', { class: 'bar', d: `M${x},${yb} V${yb - bh + r} Q${x},${yb - bh} ${x + r},${yb - bh} H${x + barW - r} Q${x + barW},${yb - bh} ${x + barW},${yb - bh + r} V${yb} Z` });
        } else add('g', {});
        if ((i === topIdx && d.n) || (isToday && d.n)) add('text', { class: 'val', x: cx, y: y(d.n) - 5, 'text-anchor': 'middle' }, d.n);
        const day = parseISO(d.date);
        const crowded = slot < 44 && i === days.length - 2;
        const skip = slot < 26 ? (days.length - 1 - i) % 2 === 1 : crowded;
        add('text', { class: 'axis' + (isToday ? ' today' : ''), x: isToday ? W : cx, y: H - 6, 'text-anchor': isToday ? 'end' : 'middle' },
          isToday ? 'Today' : skip ? '' : day.getDate());
        const show = () => {
          tip.replaceChildren(h('strong', { text: d.n }), `completed · ${fmtDay(d.date)}`);
          tip.hidden = false;
          const scale = box.querySelector('svg').getBoundingClientRect().width / W;
          tip.style.left = (16 + cx * scale) + 'px';
          tip.style.top = (y(d.n) * scale - 6) + 'px';
        };
        hit.addEventListener('pointerenter', show);
        hit.addEventListener('focus', show);
        hit.addEventListener('pointerleave', () => { tip.hidden = true; });
        hit.addEventListener('blur', () => { tip.hidden = true; });
      });
      box.replaceChildren(svg, tip);
    });
  }

    });

      b.scrollLeft += e.deltaY;
      e.preventDefault();
    }, { passive: false });
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (S.view === 'insights') drawCharts(); if (!isNarrow()) closeDrawer(); }, 150);
    });
    window.addEventListener('pagehide', flushSaves);
    $('board').addEventListener('compositionstart', () => { composing = true; });
    $('board').addEventListener('compositionend', () => { composing = false; if (renderBlocked) { renderBlocked = false; renderNow(); } });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSaves(); });
    let midnight = todayISO();
    setInterval(() => { if (todayISO() !== midnight) { midnight = todayISO(); schedule(); } }, 60000);
  }

  /* ======================================================================
   * Sign-in and startup
   * ==================================================================== */
  function showAuth(firstRun, message) {
    const box = $('auth');
    const email = h('input', { class: 'input', type: 'email', autocomplete: 'username', required: true, id: 'authEmail' });
    const pass = h('input', { class: 'input', type: 'password', autocomplete: firstRun ? 'new-password' : 'current-password', required: true, minlength: 8, id: 'authPass' });
    const err = h('div', { class: 'auth-err', role: 'alert', text: message || '' });
    const submit = h('button', { class: 'btn primary', type: 'submit', text: firstRun ? 'Create account' : 'Sign in' });
    const form = h('form', {
      onsubmit: async e => {
        e.preventDefault();
        err.textContent = '';
        submit.disabled = true;
        try {
          if (firstRun) await TM.auth.createAccount(email.value.trim(), pass.value);
          else await TM.auth.signIn(email.value.trim(), pass.value);
          box.hidden = true;
          start();
        } catch (ex) {
          const status = ex && ex.status;
          err.textContent = status === 400 && !firstRun ? 'That email and password don’t match.'
            : status === 0 ? 'Can’t reach your NAS. Check that Tailscale is connected.'
            : explain(ex);
        } finally { submit.disabled = false; }
      },
    },
      h('label', {}, 'Email', email),
      h('label', {}, firstRun ? 'Password (at least 8 characters)' : 'Password', pass),
      err, submit,
      h('button', { class: 'text-btn', type: 'button', style: 'align-self:center',
        text: firstRun ? 'Already have an account? Sign in' : 'First time here? Create an account',
        onclick: () => showAuth(!firstRun) }));
    const brand = h('div', { class: 'brand' }, icon('logo'), h('span', { text: 'Tasks' }));
    box.replaceChildren(h('div', { class: 'auth-card' }, brand,
      h('h2', { text: firstRun ? 'Create your account' : 'Sign in' }),
      h('p', { text: firstRun ? 'This is the only account on your NAS. Your tasks sync between your iPhone and computer.' : 'Use the account you created on your NAS.' }),
      form));
    box.hidden = false;
    setTimeout(() => email.focus(), 50);
  }

  // PocketBase puts the real reason per field (e.g. "email already in use") under response.data.
  function explain(ex) {
    const fields = (ex && ex.response && ex.response.data) || {};
    const first = Object.keys(fields)[0];
    if (first && fields[first] && fields[first].message) return `${first[0].toUpperCase() + first.slice(1)}: ${fields[first].message}`;
    return (ex && ex.response && ex.response.message) || (ex && ex.message) || 'Something went wrong.';
  }

  async function askToSignIn(message) {
    let firstRun = false;
    try { firstRun = await TM.auth.needsSetup(); } catch (e) { message = message || 'Can’t reach your NAS. Check that Tailscale is connected.'; }
    showAuth(firstRun, message);
  }

  async function signOut() {
    closePanel();
    await TM.auth.signOut();
    S.tasks = [];
    S.lists = [];
    S.ready = false;
    reindex();
    $('layer').replaceChildren();
    askToSignIn();
  }

  function start() {
    boot();
  }

  initShell();
  render();
  TM.onSync(setStatus);
  TM.onChange(onRemoteChange);
  TM.onSignedOut(() => askToSignIn('Please sign in again.'));
  if (TM.auth.resume()) start(); else askToSignIn();
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
